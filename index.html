channel.on('broadcast', { event: 'REMATCH_DECLINE' }, (payload) => {
  showModal('遊戲結束', '對方不想玩了！', ['知道了'], () => { hideModal(); });
});

  channel.on('broadcast', { event: 'PLAY_CARD' }, (payload) => {
    const pData = payload.payload || {};
    const cardId = pData.cardId;
    const senderId = pData.playerIndex ?? pData.playerId;
    const cardData = pData.cardData;
    const targetId = pData.targetId;
    const sender = state.players[senderId];
    if (!sender) return;
    // 非自己的出牌才需要同步移除
    if (senderId !== myPlayerId) {
      const idx = sender.hand.findIndex(c => c.id === cardId);
      if (idx > -1) {
        const card = sender.hand.splice(idx, 1)[0];
        state.discard.push(card);
      }
    }
    const name = (cardData || sender.hand.find(c => c.id === cardId))?.name || getCardName(cardData?.type || 'unknown');
    // 互動式卡牌（SWAP/DEMAND/COMMAND）的 log 由 INTERACTIVE_TARGET handler 負責，避免重複和順序問題
    const interactiveTypes = [TYPES.SWAP, TYPES.DEMAND, TYPES.COMMAND];
    if (!interactiveTypes.includes(cardData?.type)) {
      log(`${sender.name} 打出了一張【${name}】。`);
      if (pData.extraMsg) {
        log(pData.extraMsg);
      }
    }
    // 同步非互動式卡牌效果
    if (!interactiveTypes.includes(cardData?.type)) {
      applyCardEffectRemote(cardData, senderId);
    }
    // 互動式卡牌的效果由 INTERACTIVE_TARGET handler 處理
    renderAll();
  });

  channel.on('broadcast', { event: 'DEMAND_RESULT' }, (payload) => {
    const data = payload.payload || {};
    console.log('[DEMAND_RESULT] result=' + data.result + ' fromIdx=' + data.fromIndex + ' toIdx=' + data.toIndex + ' pendingInt_before=' + state.pendingInteractive);
    const fromIdx = data.fromIndex;
    const toIdx = data.toIndex;
    const from = state.players[fromIdx];
    const to = state.players[toIdx];
    if (!from || !to) return;
    // 在清除 pendingInteractive 之前，先檢查是否需要繼續 AI 回合
    // 加入 isJoiner 檢查：防止 joiner 被強制出牌（PITFALL 70）
    const isJoiner = guestJoined && from && from.id === 1;
    const shouldContinueAI = isServer && from && state.pendingInteractiveTargetIsHuman && state.currentPlayer === from.id && state.phase === 'play' && !isJoiner;
    state.pendingInteractive = false;
    state.pendingInteractiveTargetIsHuman = false;
    switch (data.result) {
      case 'empty':
        log(`${from.name} 向 ${to.name} 索要，但 ${to.name} 沒有手牌。`);
        break;
      case 'veto':
        // 非 target 端顯示否決訊息
        if (myPlayerId !== toIdx) {
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【索要】！`);
        }
        if (data.fromHand) from.hand = data.fromHand;
        if (data.toHand) to.hand = data.toHand;
        // 清除 skipDraw（否決後回到 from 的回合）
        state.skipDraw = false;
        state.skipDrawFor = -1;
        break;
      case 'delivered':
        // 只有 sender 和 target 知道索要到什麼牌，其他人只看到通用訊息
        if (myPlayerId === fromIdx || myPlayerId === toIdx) {
          if (data.card) {
            log(`${from.name} 向 ${to.name} 成功索要到【${data.card.name}】！`);
          }
        } else {
          log(`${from.name} 向 ${to.name} 索要了一張牌！`);
        }
        if (data.fromHand && Array.isArray(data.fromHand)) from.hand = data.fromHand;
        if (data.toHand && Array.isArray(data.toHand)) to.hand = data.toHand;
        break;
    }
    renderAll();
    // RESULT 到達後：如果 sender 是 AI 且是 AI 回合且目標是 human，繼續 AI
    // 注意：只有當 from 仍是當前玩家且 isHuman=false 才繼續（避免跨回合誤觸發）
    if (shouldContinueAI && state.phase === 'play' && state.currentPlayer === from.id && !from.isHuman) {
      setTimeout(() => {
        // 再次確認 from 仍是當前玩家且未被替換
        if (state.currentPlayer === from.id && state.phase === 'play' && !from.isHuman && isServer) {
          runAI();
        }
      }, 300);
    }
    // joiner 端：如果 from 是 human 且回合在 from，觸發 endTurnPhase（只在 pendingInteractive 時）
    if (!isServer && from && from.isHuman && state.currentPlayer === from.id && state.phase === 'play' && state.pendingInteractive) {
      setTimeout(() => endTurnPhase(), 300);
    }
  });

  channel.on('broadcast', { event: 'SWAP_RESULT' }, (payload) => {
    const data = payload.payload || {};
    console.log('[SWAP_RESULT] result=' + data.result);
    const fromIdx = data.fromIndex;
    const toIdx = data.toIndex;
    const from = state.players[fromIdx];
    const to = state.players[toIdx];
    if (!from || !to) return;
    // 在清除 pendingInteractive 之前，先檢查是否需要繼續 AI 回合
    // 加入 isJoiner 檢查：防止 joiner 被強制出牌（PITFALL 70）
    const isJoiner = guestJoined && from && from.id === 1;
    const shouldContinueAI = isServer && from && state.pendingInteractiveTargetIsHuman && state.currentPlayer === from.id && state.phase === 'play' && !isJoiner;
    state.pendingInteractive = false;
    state.pendingInteractiveTargetIsHuman = false;
    switch (data.result) {
      case 'veto':
        // 非 target 端顯示否決訊息
        if (myPlayerId !== toIdx) {
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【交換】！`);
        }
        if (data.fromHand && Array.isArray(data.fromHand)) from.hand = data.fromHand;
        if (data.toHand && Array.isArray(data.toHand)) to.hand = data.toHand;
        // 清除 skipDraw
        state.skipDraw = false;
        state.skipDrawFor = -1;
        break;
      case 'swapped':
        log(`${from.name} 與 ${to.name} 交換手牌！`);
        if (data.fromHand && Array.isArray(data.fromHand)) from.hand = data.fromHand;
        if (data.toHand && Array.isArray(data.toHand)) to.hand = data.toHand;
        break;
    }
    renderAll();
    // RESULT 到達後：如果 sender 是 AI 且是 AI 回合，繼續 AI
    if (shouldContinueAI && state.phase === 'play' && state.currentPlayer === from.id && !from.isHuman) {
      setTimeout(() => {
        if (state.currentPlayer === from.id && state.phase === 'play' && !from.isHuman && isServer) {
          runAI();
        }
      }, 300);
    }
    // joiner 端：如果 from 是 human 且回合在 from，觸發 endTurnPhase
    if (!isServer && from && from.isHuman && state.currentPlayer === from.id && state.phase === 'play' && state.pendingInteractive) {
      setTimeout(() => endTurnPhase(), 300);
    }
  });

  channel.on('broadcast', { event: 'COMMAND_RESULT' }, (payload) => {
    const data = payload.payload || {};
    console.log('[COMMAND_RESULT] result=' + data.result);
    state.pendingInteractive = false;
    state.pendingInteractiveTargetIsHuman = false;
    const sourceIdx = data.sourceIndex;
    const targetIdx = data.targetIndex;
    const source = state.players[sourceIdx];
    const target = state.players[targetIdx];
    if (!source || !target) return;
    switch (data.result) {
      case 'self':
        log(`指使了自己！被指使回合為 ${data.commandTurnsLeft || state.commandTurnsLeft}。`);
        state.commandTurnsLeft = data.commandTurnsLeft || state.commandTurnsLeft;
        // 指使自己：currentPlayer 不變，如果 source 是 AI 且是 AI 回合，繼續 AI（只有 server 端執行）
        // 加入 isJoiner 檢查：防止 joiner 被強制出牌（PITFALL 70）
        const isJoinerCmd = guestJoined && source && source.id === 1;
        if (isServer && !source.isHuman && state.currentPlayer === source.id && state.phase === 'play' && !isJoinerCmd) {
          setTimeout(() => runAI(), 300);
        }
        break;
      case 'veto':
        // 非 target 端顯示否決訊息
        if (myPlayerId !== targetIdx) {
          log(`${target.name} 使用否決，拒絕了 ${source.name} 的【指使】！`);
        }
        // 否決後重置 currentPlayer 回 source（指使者）
        state.currentPlayer = sourceIdx;
        state.skipDraw = false;
        state.skipDrawFor = -1;
        // 只有 server 端才觸發 startTurn（更新 UI + 可能的 AI）
        if (isServer) {
          startTurn();
        } else {
          // Joiner 端只更新 UI
          updateActiveAvatar();
          renderAll();
          const p = state.players[state.currentPlayer];
          if (p) {
            UI.turnStatus.textContent = p.isHuman ? `你的回合（${p.name}）｜請出牌或摸牌` : `${p.name} 的回合...`;
            UI.turnStatus.style.color = p.isHuman ? '#98b0ee' : '#9c8aaa';
          }
        }
        break;
      case 'accepted':
        // target 接受了指使，sender 端執行效果
        // 只有 server 端執行效果（joiner 端只同步 state）
        if (isServer) {
          // 重新獲取 source 和 target（因為 state 可能已變化）
          const src = state.players[sourceIdx];
          const tgt = state.players[targetIdx];
          if (src && tgt) {
            applyCommandEffect(src, tgt, null);
          }
        } else {
          // Joiner 端：同步 command 狀態
          state.commandSource = data.commandSource;
          state.commandTarget = data.commandTarget;
          state.commandTurnsLeft = data.commandTurnsLeft;
          // 等待 applyCommandEffect 的 broadcast（COMMAND_RESULT commanded）來同步 currentPlayer
        }
        break;
      case 'commanded':
        state.commandSource = data.commandSource;
        state.commandTarget = data.commandTarget;
        state.commandTurnsLeft = data.commandTurnsLeft;
        if (data.currentPlayer !== undefined) state.currentPlayer = data.currentPlayer;
        log(`指使了${target.name}！${target.name}需要經歷${data.commandTurnsLeft}個回合。`);
        // 只有 server 端呼叫 startTurn（觸發 AI），非 server 端更新 UI
        if (isServer) {
          startTurn();
        } else {
          updateActiveAvatar();
          renderAll();
          const p = state.players[state.currentPlayer];
          if (p) {
            UI.turnStatus.textContent = p.isHuman ? `你的回合（${p.name}）｜請出牌或摸牌` : `${p.name} 的回合...`;
            UI.turnStatus.style.color = p.isHuman ? '#98b0ee' : '#9c8aaa';
          }
        }
        break;
    }
    renderAll();
    // COMMAND_RESULT 到達後：如果 source 是 human 且回合在 source，觸發 endTurnPhase（只在 pendingInteractive 時）
    if (!isServer && source && source.isHuman && state.currentPlayer === source.id && state.phase === 'play' && state.pendingInteractive) {
      setTimeout(() => endTurnPhase(), 300);
    }
  });

  channel.on('broadcast', { event: 'DRAW' }, (payload) => {
    const data = payload.payload || {};
    const playerIndex = data.playerIndex ?? data.playerId;
    const { playerName, cardType, deckCount, hand, deck } = data;
    // Always sync deck content (not just length)
    if (deck) {
      state.deck = deck;
      UI.deckCount.textContent = deck.length;
    } else if (deckCount !== undefined) {
      UI.deckCount.textContent = deckCount;
      state.deck.length = deckCount;
    }
    // 同步摸牌者的手牌（joiner 端現在不執行 drawPhase，需要從 broadcast 同步自己的手牌）
    if (hand) {
      const drawer = state.players[playerIndex];
      if (drawer) {
        drawer.hand = hand;
      }
    }
    // Sync draw message for other players
    if (playerIndex !== myPlayerId) {
      const targetPlayer = state.players[playerIndex];
      if (targetPlayer && targetPlayer.alive) {
        const msg = cardType === TYPES.POOP ? `${targetPlayer.name} 摸到了大便！` : `${targetPlayer.name} 摸了一張牌。`;
        log(msg);
        renderAll();
      }
    }
  });

  // DRAW_POOP：當某人摸到大便時廣播，讓其他人知道
  channel.on('broadcast', { event: 'DRAW_POOP' }, (payload) => {
    const { playerName } = payload.payload || {};
    const targetPlayer = state.players.find(p => p && p.name === playerName);
    if (targetPlayer && targetPlayer.alive) {
      log(`${playerName} 摸到了大便！`);
      renderAll();
    }
  });

  channel.on('broadcast', { event: 'POOP_CLEANSE' }, (payload) => {
    const { playerName, discardLength, deckCount, hand, deck, discard } = payload.payload || {};
    log(`${playerName || '?'} 使用掃除清理了大便！`);
    // 直接同步 discard 陣列（避免長度不一致）
    if (discard && Array.isArray(discard)) {
      state.discard = discard;
    } else if (discardLength !== undefined) {
      // fallback: 只移除末尾多余的牌
      while (state.discard.length > discardLength) {
        state.discard.pop();
      }
    }
    if (deckCount !== undefined) {
      state.deck.length = deckCount;
    }
    // Sync the player's hand (who cleaned the poop)
    if (hand) {
      const targetPlayer = state.players.find(p => p && p.name === playerName);
      if (targetPlayer) {
        targetPlayer.hand = hand;
      }
    }
    // Sync deck content (important for peek/divination accuracy)
    if (deck && Array.isArray(deck)) {
      state.deck = deck;
    }
    UI.deckCount.textContent = state.deck.length;
    UI.discardInfo.textContent = `棄牌數: ${state.discard.length}`;
    renderAll();
  });

  channel.on('broadcast', { event: 'TURN_CHANGED' }, (payload) => {
    const data = payload.payload || {};
    if (data.playerIndex !== undefined) {
      state.currentPlayer = data.playerIndex;
      // 同步 direction
      if (data.direction !== undefined) state.direction = data.direction;
      // 同步 command 狀態（確保兩端 commandTurnsLeft 一致）
      if (data.commandTurnsLeft !== undefined) state.commandTurnsLeft = data.commandTurnsLeft;
      if (data.commandTarget !== undefined) state.commandTarget = data.commandTarget;
      if (data.commandSource !== undefined) state.commandSource = data.commandSource;
      // 同步 skipDraw 狀態
      if (data.skipDraw !== undefined) state.skipDraw = data.skipDraw;
      if (data.skipDrawFor !== undefined) state.skipDrawFor = data.skipDrawFor;
      // Only server calls startTurn(); client only updates display
      if (isServer) {
        startTurn();
      } else {
        updateActiveAvatar();
        updateDirectionIndicator();
        renderAll();
        const p = state.players[data.playerIndex];
        if (p) {
          UI.turnStatus.textContent = p.isHuman ? `你的回合（${p.name}）｜請出牌或摸牌` : `${p.name} 的回合...`;
          UI.turnStatus.style.color = p.isHuman ? '#98b0ee' : '#9c8aaa';
        }
      }
    }
  });

  channel.on('broadcast', { event: 'SHUFFLED' }, (payload) => {
    shuffle(state.deck);
    log('牌堆已重新洗牌！');
    renderAll();
  });

  // Host 要求 Joiner 端顯示 modal（當 host 是發送者且目標是 remote human 時）
  channel.on('broadcast', { event: 'REQUEST_MODAL' }, (payload) => {
    const data = payload.payload || {};
    console.log('[REQUEST_MODAL] modalType=' + data.modalType + ' senderId=' + data.senderId + ' targetId=' + data.targetId + ' myPlayerId=' + myPlayerId);
    const modalType = data.modalType;
    const senderId = data.senderId;
    const targetId = data.targetId;
    const sender = state.players[senderId];
    const target = state.players[targetId];
    if (!sender || !target) return;
    // 只有目標是本地玩家才顯示 modal
    if (targetId !== myPlayerId) return;
    console.log('[REQUEST_MODAL] showing modal for targetId=' + targetId + ' myPlayerId=' + myPlayerId);
    // REQUEST_MODAL 只是通知，實際處理由 INTERACTIVE_TARGET handler 統一路由
    // 這裡只設定 pendingInteractive，不執行 handleXxxIncoming（避免重複執行）
  });

  channel.on('broadcast', { event: 'INTERACTIVE_TARGET' }, (payload) => {
    const data = payload.payload || {};
    const cardType = data.cardType;
    const senderId = data.senderId;
    const targetId = data.targetId;
    const sender = state.players[senderId];
    const target = state.players[targetId];
    if (!sender || !target) { console.warn('[INTERACTIVE_TARGET] sender or target not found:', senderId, targetId); return; }
    console.log('[INTERACTIVE_TARGET] cardType=' + cardType + ' sender=' + sender.name + '(id=' + senderId + ') target=' + target.name + '(id=' + targetId + ') myPlayerId=' + myPlayerId + ' isServer=' + isServer);

    // Supabase broadcast 不回送給發送者。發送者已在 showInteractiveChoice callback 中執行效果。
    // 非發送者端需要處理效果執行。

    // 在執行效果前，先從 sender 手牌中移除已打出的互動式卡牌
    // （因為 sender 端已經移除了這張牌，receiver 端需要同步）
    const interactiveTypes = [TYPES.SWAP, TYPES.DEMAND, TYPES.COMMAND];
    if (interactiveTypes.includes(cardType)) {
      const cardIdx = sender.hand.findIndex(c => c.type === cardType);
      if (cardIdx !== -1) {
        const card = sender.hand.splice(cardIdx, 1)[0];
        state.discard.push(card);
      }
    }

    const targetIsLocal = (targetId === myPlayerId);
    const targetIsRemoteHuman = (guestJoined && targetId === 1 && !targetIsLocal);

    // 路由規則：
    // 1. 發送者已在 showInteractiveChoice callback 中執行效果（broadcast 不回送）
    // 2. target 是本機 human → 本機顯示 modal（否決/選牌）
    // 3. target 是 remote human → 等 REQUEST_MODAL 或 RESULT broadcast
    // 4. target 是 AI → 只有非發送者端執行效果（發送者已在 callback 中執行）
    if (targetIsLocal) {
      // Target is local human — 設定 pendingInteractive 防止 RESULT handler 誤觸發 AI 繼續
      state.pendingInteractive = true;
      state.pendingInteractiveTargetIsHuman = true;
      // 顯示「X 打出了卡牌」訊息
      log(`${data.senderName || sender.name} 打出了一張【${data.cardTypeName || getCardName(cardType)}】。`);
      // handle modal (veto/choice)
      console.log('[INTERACTIVE_TARGET] targetIsLocal=true, routing to handleXxxIncoming');
      switch (cardType) {
        case TYPES.SWAP:
          handleSwapIncoming(sender, target);
          break;
        case TYPES.DEMAND:
          handleDemandIncoming(sender, target);
          break;
        case TYPES.COMMAND:
          handleCommandIncoming(sender, target);
          break;
      }
    } else if (targetIsRemoteHuman) {
      // Target is remote human — 發送者已廣播 REQUEST_MODAL，本機不需要再廣播
      // 但仍顯示「X 打出了卡牌」訊息
      const isLocalSender = (senderId === myPlayerId);
      if (!isLocalSender) {
        log(`${data.senderName || sender.name} 打出了一張【${data.cardTypeName || getCardName(cardType)}】。`);
      }
      // pendingInteractive 由 RESULT handler 清除
    } else {
      // Target is AI — 效果已在發送者 callback 中執行
      // 非發送者端顯示「X 打出了卡牌」訊息
      const isLocalSender = (senderId === myPlayerId);
      if (!isLocalSender) {
        // 先 log 出牌訊息，確保在 RESULT handler log 效果之前顯示
        log(`${data.senderName || sender.name} 打出了一張【${data.cardTypeName || getCardName(cardType)}】。`);
        // 清除 pendingInteractive（等 RESULT handler 清除狀態）
        state.pendingInteractive = false;
        state.pendingInteractiveTargetIsHuman = false;
      }
      // isLocalSender 時不清，等 RESULT handler 清除
    }

    renderAll();
  });

  channel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      await channel.send({ type: 'broadcast', event: 'player_joined', payload: { playerIndex: myPlayerId } });
    }
  });
}

function applyCardEffectRemote(card, senderId) {
  if (!card) return '';
  const sender = state.players[senderId];
  if (!sender) return '';
  let extraMsg = '';

  switch (card.type) {
    case TYPES.DIVINATION:
      extraMsg = `${sender.name} 使用了占卜`;
      break;
    case TYPES.PEEK:
      extraMsg = `${sender.name} 使用了看穿`;
      break;
    case TYPES.SHUFFLE:
      shuffle(state.deck);
      extraMsg = '牌堆已重新洗牌！';
      renderAll();
      break;
    case TYPES.SKIP:
      state.skipDraw = true;
      // skipDrawFor 設為下一個存活玩家
      const dir = state.direction || 1;
      let nextIdx = -1;
      for (let i = 0; i < 4; i++) {
        nextIdx = (state.currentPlayer + dir + i * (dir >= 0 ? 1 : -1) + 4) % 4;
        if (state.players[nextIdx] && state.players[nextIdx].alive && state.players[nextIdx].id !== state.currentPlayer) break;
      }
      if (nextIdx >= 0 && state.players[nextIdx] && state.players[nextIdx].alive) {
        state.skipDrawFor = state.players[nextIdx].id;
      } else {
        state.skipDrawFor = -1;
      }
      extraMsg = `${sender.name} 使用了跳過`;
      break;
    case TYPES.REVERSE:
      state.direction *= -1;
      updateDirectionIndicator();
      extraMsg = '方向反轉！';
      break;
  }
  return extraMsg;
}

// ================= 互動式卡牌效果處理（接收端） =================

// 統一原則：
// 1. 每端收到 INTERACTIVE_TARGET 都要本地執行效果（broadcast 不回送）
// 2. 只有 server 端 broadcast RESULT（避免重複 broadcast）
// 3. joiner 端收到 RESULT broadcast 後同步 state
// 4. SWAP：兩端都執行 doSwapExchange（手牌交換），broadcast 只在 isServer
// 5. DEMAND：只有 target 端執行 showDemandChoice（選擇交出哪張牌），sender 端同步 broadcast
// 6. COMMAND：sender 端執行 applyCommandEffect（改 currentPlayer），target 端同步 broadcast

// 交換incoming：被交換方可以選擇否決
function handleSwapIncoming(from, to) {
  const isTarget = (to.id === myPlayerId);
  
  if (isTarget && to.hand.some(c => c.type === TYPES.VETO)) {
    // target 有否決牌 → 顯示 modal
    showModal(`${from.name} 要求與你交換手牌，要否決嗎？`, '',
      ['要', '不要'],
      choice => {
        if (choice === '要') {
          const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
          const vCard = to.hand.splice(vi, 1)[0];
          state.discard.push(vCard);
          renderAll();
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【交換】！`);
          state.currentPlayer = from.id;
          state.skipDraw = false;
          state.skipDrawFor = -1;
          state.pendingInteractive = false;
          state.pendingInteractiveTargetIsHuman = false;
          // 兩端都 broadcast（joiner 端也需要 broadcast 讓 sender 端同步）
          channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
          // 只有 server 端才呼叫 startTurn（觸發 AI）
          if (isServer) startTurn();
        } else {
          // target 接受：執行效果
          state.pendingInteractive = false;
          doSwapExchange(from, to, null);
        }
      }
    );
  } else if (!isTarget) {
    // sender 端或非本地 target：執行效果
    state.pendingInteractive = false;
    doSwapExchange(from, to, null);
  } else {
    // target 沒有否決牌 → 執行效果
    state.pendingInteractive = false;
    doSwapExchange(from, to, null);
  }
}

// 索要incoming：被索要方可以選擇否決，然後選擇一張牌
function handleDemandIncoming(from, to) {
  const isTarget = (to.id === myPlayerId);
  
  // 確認 to 是有效的目標玩家
  if (!to || !to.alive) {
    state.pendingInteractive = false;
    return;
  }
  
  if (to.hand.length === 0) {
    state.pendingInteractive = false;
    if (isServer) {
      channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'empty' } }).catch(() => {});
    }
    return;
  }

  if (isTarget && to.hand.some(c => c.type === TYPES.VETO)) {
    // target 有否決牌 → 顯示 modal
    showModal(`${from.name} 向你索要手牌，要否決嗎？`, '',
      ['要', '不要'],
      choice => {
        if (choice === '要') {
          const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
          const vCard = to.hand.splice(vi, 1)[0];
          state.discard.push(vCard);
          renderAll();
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【索要】！`);
          state.currentPlayer = from.id;
          state.skipDraw = false;
          state.skipDrawFor = -1;
          state.pendingInteractive = false;
          state.pendingInteractiveTargetIsHuman = false;
          // 兩端都 broadcast（joiner 端也需要 broadcast 讓 sender 端同步）
          channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
          // 只有 server 端才呼叫 startTurn（觸發 AI）
          if (isServer) startTurn();
        } else {
          // 不要否決 → 等 showDemandChoice 選擇後再清除 pendingInteractive
          showDemandChoice(from, to, null);
        }
      }
    );
  } else if (!isTarget) {
    // sender 端：不執行效果，等 DEMAND_RESULT broadcast 同步
  } else {
    // target 沒有否決牌 → 執行效果（只有 target 選擇交出哪張牌）
    // 注意：不清 pendingInteractive，等 showDemandChoice 選擇後再清除
    showDemandChoice(from, to, null);
  }
}

// 指使incoming：被指使方可以選擇否決
function handleCommandIncoming(from, to) {
  console.log('[HANDLE_CMD_INCOMING] from=' + from.name + '(id=' + from.id + ') to=' + to.name + '(id=' + to.id + ') myPlayerId=' + myPlayerId + ' isServer=' + isServer);
  const isTarget = (to.id === myPlayerId);
  
  // 指使自己時：效果已在 sender 端執行，不需要再執行一次
  if (from.id === to.id) {
    state.pendingInteractive = false;
    return;
  }

  if (isTarget && to.hand.some(c => c.type === TYPES.VETO)) {
    // target 有否決牌 → 顯示 modal
    showModal(`${from.name} 指使你進行回合，要否決嗎？`, '',
      ['要', '不要'],
      choice => {
        if (choice === '要') {
          const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
          const vCard = to.hand.splice(vi, 1)[0];
          state.discard.push(vCard);
          renderAll();
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【指使】！`);
          state.currentPlayer = from.id;
          state.skipDraw = false;
          state.skipDrawFor = -1;
          state.pendingInteractive = false;
          // 兩端都 broadcast（joiner 端也需要 broadcast 讓 sender 端同步）
          channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: { sourceIndex: from.id, targetIndex: to.id, result: 'veto' } }).catch(() => {});
          // 只有 server 端才呼叫 startTurn（觸發 AI）
          if (isServer) startTurn();
        } else {
          state.pendingInteractive = false;
          // target 接受：broadcast COMMAND_RESULT(accepted) 讓 sender 端執行效果
          channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: {
            sourceIndex: from.id, targetIndex: to.id, result: 'accepted',
            commandTarget: to.id, commandTurnsLeft: state.commandTurnsLeft, commandSource: from.id,
            currentPlayer: state.currentPlayer
          }}).catch(() => {});
          // 只有 server 端執行效果
          if (isServer) {
            applyCommandEffect(from, to, null);
          }
        }
      }
    );
  } else if (!isTarget) {
    // 非 target 端（sender 或其他玩家）：只清除 pendingInteractive，不執行效果
    // 效果已由 sender 端執行
    state.pendingInteractive = false;
  } else {
    // target 沒有否決牌 → 自動接受，broadcast COMMAND_RESULT(accepted) 讓 sender 端執行效果
    state.pendingInteractive = false;
    channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: {
      sourceIndex: from.id, targetIndex: to.id, result: 'accepted',
      commandTarget: to.id, commandTurnsLeft: state.commandTurnsLeft, commandSource: from.id,
      currentPlayer: state.currentPlayer
    }}).catch(() => {});
    // 只有 server 端執行效果（避免重複）
    if (isServer) {
      applyCommandEffect(from, to, null);
    }
  }
}

// ================= 互動式卡牌選擇（真人出牌） =================

// 判斷 targetId 是否為 human（id 0 或 1 都是 human，id >= 2 是 AI）
function targetId_isHuman(targetId) {
  // id 0 和 1 都是 human（host 和 joiner），id >= 2 是 AI
  const p = state.players[targetId];
  return p && p.id < 2;
}

function showInteractiveChoice(card, senderId, onChoose) {
  const sender = state.players[senderId];
  if (!sender) return '';

  switch (card.type) {
    case TYPES.SWAP: {
      const targets = state.players.filter(p => p && p.alive && p.id !== senderId);
      if (targets.length === 0) return '';
      const buttonLabels = ['反悔', ...targets.map(p => p.name)];
      showModal('與誰交換手牌？', '', buttonLabels, choice => {
        if (choice === '反悔') {
          if (onChoose) onChoose('__CANCEL__');
          return;
        }
        const target = targets.find(t => t.name === choice);
        if (!target) return;
        console.log('[SHOW_INTERACTIVE] SWAP sender=' + sender.name + ' target=' + target.name);
        state.pendingInteractive = true;
        state.pendingInteractiveTargetIsHuman = targetId_isHuman(target.id);
        if (targetId_isHuman(target.id)) {
          channel.send({ type: 'broadcast', event: 'REQUEST_MODAL', payload: { modalType: 'swap', senderId: senderId, targetId: target.id } }).catch(() => {});
          // 也 broadcast INTERACTIVE_TARGET 讓 INTERACTIVE_TARGET handler 路由到 handleSwapIncoming
          channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.SWAP, senderId: senderId, targetId: target.id } }).catch(e => console.error('[SHOW_INTERACTIVE] send failed:', e));
        } else {
          // 先 broadcast INTERACTIVE_TARGET 讓 receiver 端先 log「打出了一張」
          channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.SWAP, senderId: senderId, targetId: target.id } }).catch(e => console.error('[SHOW_INTERACTIVE] send failed:', e));
          executeSwap(sender, target, null);
          state.pendingInteractive = false;
        }
        if (onChoose) onChoose(target);
      });
      return `${sender.name} 打出了【交換】，選擇目標...`;
    }
    case TYPES.DEMAND: {
      const targets = state.players.filter(p => p && p.alive && p.id !== senderId);
      if (targets.length === 0) return '';
      const buttonLabels = ['反悔', ...targets.map(p => p.name)];
      showModal('要向誰索要手牌？', '', buttonLabels, choice => {
        if (choice === '反悔') {
          if (onChoose) onChoose('__CANCEL__');
          return;
        }
        const target = targets.find(t => t.name === choice);
        if (!target) return;
        console.log('[SHOW_INTERACTIVE] DEMAND sender=' + sender.name + ' target=' + target.name);
        state.pendingInteractive = true;
        state.pendingInteractiveTargetIsHuman = targetId_isHuman(target.id);
        if (targetId_isHuman(target.id)) {
          channel.send({ type: 'broadcast', event: 'REQUEST_MODAL', payload: { modalType: 'demand', senderId: senderId, targetId: target.id } }).catch(() => {});
          // 也 broadcast INTERACTIVE_TARGET 讓 INTERACTIVE_TARGET handler 路由到 handleDemandIncoming
          channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.DEMAND, senderId: senderId, targetId: target.id } }).catch(e => console.error('[SHOW_INTERACTIVE] send failed:', e));
        } else {
          // 先 broadcast INTERACTIVE_TARGET 讓 receiver 端先 log「打出了一張」
          channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.DEMAND, senderId: senderId, targetId: target.id } }).catch(e => console.error('[SHOW_INTERACTIVE] send failed:', e));
          // 目標是 AI → 由 performDemandLogic 處理（不顯示 modal）
          // 但只有 sender 端執行效果，避免重複
          executeDemand(sender, target, null);
          state.pendingInteractive = false;
        }
        if (onChoose) onChoose(target);
      });
      return `${sender.name} 打出了【索要】，選擇目標...`;
    }
    case TYPES.COMMAND: {
      const aliveOthers = state.players.filter(p => p && p.alive && p.id !== senderId);
      const targetList = [sender, ...aliveOthers];
      if (targetList.length === 0) return '';
      const buttonLabels = ['反悔', ...targetList.map(p => p.name)];
      showModal('要指定誰代替你進行回合？', '', buttonLabels, choice => {
        if (choice === '反悔') {
          if (onChoose) onChoose('__CANCEL__');
          return;
        }
        const target = targetList.find(t => t.name === choice);
        if (!target) return;
        console.log('[SHOW_INTERACTIVE] COMMAND sender=' + sender.name + ' target=' + target.name);
        state.pendingInteractive = true;
        state.pendingInteractiveTargetIsHuman = targetId_isHuman(target.id);
        if (target.id === sender.id) {
          // 指使自己：直接執行效果，不廣播 INTERACTIVE_TARGET（避免重複執行）
          executeCommand(sender, target, null);
          state.pendingInteractive = false;
        } else if (targetId_isHuman(target.id)) {
          // 目標是 human → 由 target 端處理 modal（否決/接受）
          // sender 端不執行效果，等 target 端回應後再執行
          channel.send({ type: 'broadcast', event: 'REQUEST_MODAL', payload: { modalType: 'command', senderId: senderId, targetId: target.id } }).catch(() => {});
          // broadcast INTERACTIVE_TARGET 讓其他人同步
          channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.COMMAND, senderId: senderId, targetId: target.id } }).catch(e => console.error('[SHOW_INTERACTIVE] send failed:', e));
          // 注意：不在此處執行 executeCommand，等 target 端選擇後再執行
        } else {
          // 先 broadcast INTERACTIVE_TARGET 讓 receiver 端先 log「打出了一張」
          channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.COMMAND, senderId: senderId, targetId: target.id } }).catch(e => console.error('[SHOW_INTERACTIVE] send failed:', e));
          executeCommand(sender, target, null);
          state.pendingInteractive = false;
        }
        if (onChoose) onChoose(target);
      });
      return `${sender.name} 打出了【指使】，選擇目標...`;
    }
  }
  return '';
}

// ================= 執行互動式卡牌效果（共享邏輯） =================

function executeSwap(from, to, onComplete) {
  performSwapLogic(from, to, onComplete);
}

function executeDemand(from, to, onComplete) {
  performDemandLogic(from, to, onComplete);
}

function executeCommand(source, target, onComplete) {
  performCommandLogic(source, target, onComplete);
}

function performSwapLogic(from, to, onComplete) {
  // 檢查否決
  if (to.hand.some(c => c.type === TYPES.VETO)) {
    if (to.id === myPlayerId) {
      showModal(`你被${from.name}要求交換手牌了，要否決嗎？`, '',
        ['要', '不要'],
        choice => {
          if (choice === '要') {
            const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
            const vCard = to.hand.splice(vi, 1)[0];
            state.discard.push(vCard);
            renderAll();
            log(`${to.name} 使用否決，拒絕了 ${from.name} 的【交換】！`);
            // 否決後回到 from 的回合，清除 skipDraw
            state.currentPlayer = from.id;
            state.skipDraw = false;
            state.skipDrawFor = -1;
            state.pendingInteractive = false;
            channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
            // 只有 server 端才呼叫 startTurn（觸發 AI）
            if (isServer) startTurn();
          } else {
            // 不接受否決：執行效果
            state.pendingInteractive = false;
            if (isServer) startTurn();
            doSwapExchange(from, to, onComplete);
          }
        }
      );
    } else {
      // 非本地 target：檢查是否是 human（加入者）
      // 如果是 human，不執行效果，等 joiner 端 handleSwapIncoming 處理 modal 後 broadcast RESULT
      // 這樣 joiner 端可以選擇否決或接受，兩端手牌才會同步
      if (targetId_isHuman(to.id)) {
        // target 是 human（加入者）→ 不執行效果，等 RESULT broadcast
        // 但 broadcast 不回送給發送者，所以這裡不執行效果，讓 INTERACTIVE_TARGET handler 處理
        // 注意：pendingInteractive 由 RESULT handler 清除
      } else {
        // target 是 AI：檢查否決牌
        const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
        if (vi !== -1) {
          const vCard = to.hand.splice(vi, 1)[0];
          state.discard.push(vCard);
          renderAll();
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【交換】！`);
          state.currentPlayer = from.id;
          state.skipDraw = false;
          state.skipDrawFor = -1;
          channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
          if (isServer) startTurn();
        } else {
          doSwapExchange(from, to, onComplete);
        }
      }
    }
  } else {
    // 沒有否決牌：執行效果
    doSwapExchange(from, to, onComplete);
  }
}

function doSwapExchange(from, to, onComplete) {
  [from.hand, to.hand] = [to.hand, from.hand];
  renderAll();
  log(`${from.name} 與 ${to.name} 交換手牌！`);
  // broadcast（不管 isServer，因為兩端都可能執行）
  channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'swapped', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
  // 清除 pendingInteractive（broadcast 可能不回送給發送者）
  state.pendingInteractive = false;
  if (onComplete) {
    onComplete();
  }
  // 注意：SWAP 完成後不回調 nextTurn()，因為 from 的回合仍在進行中
  // from 可以繼續出牌或摸牌
}

function performDemandLogic(from, to, onComplete) {
  if (to.hand.length === 0) {
    log(`${from.name} 向 ${to.name} 索要，但 ${to.name} 沒有手牌。`);
    if (isServer) {
      channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'empty' } }).catch(() => {});
    }
    if (onComplete) onComplete();
    return;
  }

  if (to.hand.some(c => c.type === TYPES.VETO)) {
    if (to.id === myPlayerId) {
      showModal(`${from.name}向你索要手牌，要否決嗎？`, '',
        ['要', '不要'],
        choice => {
          if (choice === '要') {
            const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
            const vCard = to.hand.splice(vi, 1)[0];
            state.discard.push(vCard);
            renderAll();
            log(`${to.name} 使用否決，拒絕了 ${from.name} 的【索要】！`);
            // 否決後回到 from 的回合，清除 skipDraw
            state.currentPlayer = from.id;
            state.skipDraw = false;
            state.skipDrawFor = -1;
            state.pendingInteractive = false;
            channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
            // 只有 server 端才呼叫 startTurn（觸發 AI）
            if (isServer) startTurn();
          } else {
            showDemandChoice(from, to, onComplete);
          }
        }
      );
    } else {
      // 非本地 target：檢查是否是 human（加入者）
      // 如果是 human，不檢查否決牌，交由 target 端 handleDemandIncoming 處理 modal
      if (targetId_isHuman(to.id)) {
        // DEMAND：target 是 human（加入者）→ 不執行效果，等 joiner 端 handleDemandIncoming 處理 modal
        // pendingInteractive 不清，等 RESULT broadcast 到達後由 handler 清除
      } else {
        // target 是 AI：檢查否決牌
        const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
        if (vi !== -1) {
          const vCard = to.hand.splice(vi, 1)[0];
          state.discard.push(vCard);
          renderAll();
          log(`${to.name} 使用否決，拒絕了 ${from.name} 的【索要】！`);
          state.currentPlayer = from.id;
          state.skipDraw = false;
          state.skipDrawFor = -1;
          channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
          if (isServer) startTurn();
        } else {
          deliverDemandCard(from, to, onComplete);
        }
      }
    }
  } else {
    // 沒有否決牌：只有 target 端執行 showDemandChoice（選擇交出哪張牌）
    if (to.id === myPlayerId) {
      showDemandChoice(from, to, onComplete);
    } else {
      // 非本地 target：隨機選牌
      deliverDemandCard(from, to, onComplete);
    }
  }
}

function showDemandChoice(from, to, onComplete) {
  const cardOptions = to.hand.map((c, i) => `${c.name} #${i+1}`);
  showModal('選擇一張牌交出', '', cardOptions, selected => {
    const parts = selected.split('#');
    const idx = parseInt(parts[1].trim()) - 1;
    let card = null;
    if (idx >= 0 && idx < to.hand.length) {
      card = to.hand.splice(idx, 1)[0];
      from.hand.push(card);
      renderAll();
      log(`${from.name} 向 ${to.name} 成功索要到【${card.name}】！`);
    }
    // broadcast（不管 isServer）
    channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'delivered', card: card, fromHand: from.hand, toHand: to.hand } }).catch(() => {});
    state.pendingInteractive = false;
    if (isServer) startTurn();
    if (onComplete) onComplete();
    // 注意：DEMAND 完成後不回調 nextTurn()，因為 from 的回合仍在進行中
  });
}

function deliverDemandCard(from, to, onComplete) {
  const idx = Math.floor(Math.random() * to.hand.length);
  const card = to.hand.splice(idx, 1)[0];
  from.hand.push(card);
  if (myPlayerId === from.id || myPlayerId === to.id) {
    log(`${from.name} 向 ${to.name} 成功索要到【${card.name}】！`);
  } else {
    log(`${from.name} 向 ${to.name} 索要了一張牌！`);
  }
  renderAll();
  // broadcast（不管 isServer，因為 joiner 端也可能執行）
  channel.send({ type: 'broadcast', event: 'DEMAND_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'delivered', card: card, fromHand: from.hand, toHand: to.hand } }).catch(() => {});
  // 清除 pendingInteractive（broadcast 可能不回送給發送者）
  state.pendingInteractive = false;
  if (isServer) startTurn();
  if (onComplete) onComplete();
  // 注意：DEMAND 完成後不回調 nextTurn()，因為 from 的回合仍在進行中
}

function performCommandLogic(source, target, onComplete) {
  if (target.id === source.id) {
    state.commandSource = source.id;
    state.commandTarget = source.id;
    state.commandTurnsLeft += 2;
    log(`指使了自己！被指使回合為 ${state.commandTurnsLeft}。`);
    if (isServer) {
      channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: { sourceIndex: source.id, targetIndex: target.id, result: 'self', commandTurnsLeft: state.commandTurnsLeft } }).catch(() => {});
    }
    if (onComplete) onComplete();
    // 指使自己不改變 currentPlayer，不需要 startTurn()
    return;
  }

  if (target.hand.some(c => c.type === TYPES.VETO)) {
    if (target.id === myPlayerId) {
      showModal(`你被${source.name}指使了，要否決嗎？`, '',
        ['要', '不要'],
        choice => {
          if (choice === '要') {
            const vi = target.hand.findIndex(c => c.type === TYPES.VETO);
            const vCard = target.hand.splice(vi, 1)[0];
            state.discard.push(vCard);
            renderAll();
            log(`${target.name} 使用否決，拒絕了 ${source.name} 的【指使】！`);
            // 否決後回到 source 的回合，清除 skipDraw
            state.currentPlayer = source.id;
            state.skipDraw = false;
            state.skipDrawFor = -1;
            state.pendingInteractive = false;
            if (isServer) {
              channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: { sourceIndex: source.id, targetIndex: target.id, result: 'veto' } }).catch(() => {});
              startTurn();
            }
          } else {
            // target 接受：效果由 sender 端執行
            if (isServer) {
              applyCommandEffect(source, target, onComplete);
            }
          }
        }
      );
    } else {
      // 非本地 target：檢查是否是 human（加入者）
      // 如果是 human，不檢查否決牌，交由 target 端 handleCommandIncoming 處理 modal
      if (targetId_isHuman(target.id)) {
        // COMMAND：sender 端不執行效果，等 target 端回應
        state.pendingInteractive = false;
      } else {
        // target 是 AI：檢查否決牌
        const vi = target.hand.findIndex(c => c.type === TYPES.VETO);
        if (vi !== -1) {
          const vCard = target.hand.splice(vi, 1)[0];
          state.discard.push(vCard);
          renderAll();
          log(`${target.name} 使用否決，拒絕了 ${source.name} 的【指使】！`);
          state.currentPlayer = source.id;
          state.skipDraw = false;
          state.skipDrawFor = -1;
          channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: { sourceIndex: source.id, targetIndex: target.id, result: 'veto' } }).catch(() => {});
          if (isServer) startTurn();
        } else {
          applyCommandEffect(source, target, onComplete);
        }
      }
    }
  } else {
    // 沒有否決牌：執行效果（不管 isServer，因為只有 sender 端執行）
    applyCommandEffect(source, target, onComplete);
  }
}

function applyCommandEffect(source, target, onComplete) {
  console.log('[APPLY_CMD_EFFECT] source=' + source.name + '(id=' + source.id + ') target=' + target.name + '(id=' + target.id + ') isServer=' + isServer + ' currentPlayer_before=' + state.currentPlayer);
  state.commandSource = source.id;
  const remainingTurns = state.commandTurnsLeft;
  state.commandTarget = target.id;
  state.commandTurnsLeft = remainingTurns + 2;
  const isSelfCommand = (target.id === source.id);
  if (!isSelfCommand) {
    state.currentPlayer = target.id;
    state.skipDraw = true;
    state.skipDrawFor = source.id;
  }
  log(`指使了${target.name}！${target.name}需要經歷${remainingTurns + 2}個回合。`);
  // broadcast（只有 sender 端呼叫此函式，所以 always broadcast）
  channel.send({ type: 'broadcast', event: 'COMMAND_RESULT', payload: {
    sourceIndex: source.id, targetIndex: target.id, result: isSelfCommand ? 'self' : 'commanded',
    commandTarget: target.id, commandTurnsLeft: state.commandTurnsLeft, commandSource: source.id,
    currentPlayer: state.currentPlayer
  }}).catch(() => {});
  if (onComplete) {
    onComplete();
  } else if (!isSelfCommand) {
    // COMMAND 改變了 currentPlayer，直接開始被指使者的回合
    // 只有 server 端才呼叫 startTurn（觸發 AI）
    console.log('[APPLY_CMD_EFFECT] calling startTurn() isServer=' + isServer + ' currentPlayer=' + state.currentPlayer);
    if (isServer) startTurn();
  }
  // 指使自己時不呼叫 startTurn()，因為 currentPlayer 沒變
}


// ================= 遊戲啟動 =================

let gameStarted = false;

function initGameState() {
  state.gameOver = false;
  state.deck = createDeck();
  state.discard = [];
  let hostSeatIdx = Math.floor(Math.random() * 4);
  assignSeating(hostSeatIdx);

  state.players = [
    { id: 0, name: '?', isHuman: isHost, hand: [], alive: true, icon: '😎', avatarBg: 'linear-gradient(135deg, #78b89e, #a8d8c0)' },
    { id: 1, name: '?', isHuman: !isHost, hand: [], alive: true, icon: '🤖', avatarBg: 'linear-gradient(135deg, #a8d8a0, #c8e8c0)' },
    { id: 2, name: '?', isHuman: false, hand: [], alive: true, icon: '👻', avatarBg: 'linear-gradient(135deg, #8fb88a, #c0d8b8)' },
    { id: 3, name: '?', isHuman: false, hand: [], alive: true, icon: '👽', avatarBg: 'linear-gradient(135deg, #d4e8c8, #f0e8d0)' }
  ];

  state.players.forEach(p => p.name = '?');
  for (let s = 0; s < 4; s++) {
    const pid = seatMap[s];
    if (pid >= 0 && pid <= 3) {
      const player = state.players[pid];
      if (player) player.name = SEAT_LETTERS[s];
    }
  }

  dealCards();

  const startSeatId = seatMap[0] >= 0 && seatMap[0] <= 3 ? seatMap[0] : (seatMap.find(id => id >= 0 && id <= 3) ?? 0);
  state.currentPlayer = startSeatId;
  state.direction = 1;
  state.phase = 'play';
  state.skipDraw = false;
  state.skipDrawFor = -1;
  state.commandTarget = -1;
  state.commandTurnsLeft = 0;
  state.commandSource = -1;
  state.turnCount = 0;
  state.pendingInteractive = false;
  state.pendingInteractiveTargetIsHuman = false;
  state.lastActivePlayerId = -1;
  state.aiMemory = { topCards: [], knownPoopPositions: [] };

  UI.board.classList.add('active');
  // 設定 myPlayerId：host=0, joiner=1
  myPlayerId = isHost ? 0 : 1;
  startTurn();
  log('遊戲已開始！');

  return { hostSeatIdx, currentPlayer: startSeatId, direction: 1 };
}

function startGame() {
  if (!isHost || !channel || gameStarted) return;
  gameStarted = true;
  isServer = true;  // Host 端主動設定（broadcast 不回送給發送者，所以 game_full_state handler 不會執行 isServer = isHost）

  const initResult = initGameState();

  const lobbyScreen = document.getElementById('lobby-screen');
  if (lobbyScreen) lobbyScreen.style.display = 'none';

  // 取得 joiner 的座位索引
  let joinerSeatIdx = -1;
  for (let s = 0; s < 4; s++) {
    if (seatMap[s] === 1) { joinerSeatIdx = s; break; }
  }

  const fullGameState = {
    hostSeatIdx: initResult.hostSeatIdx,
    joinerSeatIdx: joinerSeatIdx,
    currentPlayer: initResult.currentPlayer,
    direction: initResult.direction,
    players: state.players.map(p => ({ id: p.id, name: p.name, icon: p.icon, avatarBg: p.avatarBg, hand: p.hand })),
    deck: state.deck,
    discard: state.discard
  };

  channel.send({ type: 'broadcast', event: 'game_started', payload: {
    hostSeatIdx: initResult.hostSeatIdx,
    currentPlayer: initResult.currentPlayer,
    direction: initResult.direction
  }}).catch(() => {});

  channel.send({ type: 'broadcast', event: 'game_full_state', payload: fullGameState }).catch(() => {});
}

// ================= App 模組匯出 =================
window.App = (() => ({
  init: () => {},
  createRoom, joinRoom, copyRoomId, startGame,
  clickDeck, playCard, toggleScrollMode, showModal, renderAll
}))();

window.onload = () => window.App.init();
</script>
