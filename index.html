<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>掃除大便生存戰 - 多人連線版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #e8f0e4; --text: #3a4a3c; --shadow-light: #ffffff; --shadow-dark: #b8d4b0;
    --card-radius: 16px; --btn-radius: 14px; --font-main: 'Noto Sans TC', sans-serif;
    --mint: #a8d8a0; --sage: #8fb88a; --cream: #f5f8f0; --moss: #5a8a56;
    --lavender: #d4c8e8; --peach: #f0c8a0; --sky: #a0c8e8; --rose: #e8a0b0; --amber: #e8d8a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font-main); background: linear-gradient(135deg, #f0f8ec 0%, #e8f4e0 50%, #f2f8ec 100%); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  #app { width: 100%; height: 100%; max-width: 1200px; position: relative; display: flex; flex-direction: column; }
  .neu-flat { background: linear-gradient(145deg, var(--cream), #e8f0e4); box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light); border-radius: var(--card-radius); }
  .glass { background: rgba(240, 248, 236, 0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(168, 216, 160, 0.3); border-radius: 16px; box-shadow: 0 4px 24px rgba(120, 170, 100, 0.1); }
  #lobby-screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: rgba(240, 248, 236, 0.9); backdrop-filter: blur(10px); }
  .lobby-box { padding: 30px; width: 90%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 20px; }
  .room-display { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: var(--moss); padding: 15px; border-radius: 10px; background: rgba(255,255,255,0.5); }
  .status-text { font-size: 16px; color: var(--sage); min-height: 24px; }
  #game-board { flex: 1; display: flex; flex-direction: column; opacity: 0; transition: opacity 0.5s; padding: 12px; gap: 8px; height: 100%; overflow: hidden; }
  #game-board.active { opacity: 1; }
  #player-row { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); justify-content: space-around; align-items: center; gap: 10px; }
  #direction-indicator { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: var(--moss); min-height: 28px; text-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  #direction-indicator.reverse { color: #d47a6a; }
  .seat-letter { font-size: 12px; font-weight: bold; color: var(--sage); text-align: center; margin-bottom: 4px; opacity: 0.6; }
  .player-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; flex: 1; max-width: 180px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .avatar.eliminated { filter: grayscale(1); opacity: 0.5; transform: scale(0.85); }
  .avatar.active-turn { box-shadow: 0 0 0 4px #a8d8a0, 0 0 16px rgba(168, 216, 160, 0.4); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .hand-count { font-size: 12px; font-weight: bold; color: var(--sage); background: rgba(240, 248, 236, 0.7); padding: 3px 8px; border-radius: 8px; }
  #center-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 0; }
  #hand-area { flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; padding: 10px; min-height: 120px; align-items: center; justify-content: center; background: rgba(240, 248, 236, 0.4); border-radius: 12px; }
  #deck-btn { width: 90px; height: 120px; border-radius: 14px; background: linear-gradient(145deg, var(--cream), #e0ecd8); box-shadow: 6px 6px 14px rgba(100, 150, 80, 0.2), -6px -6px 14px var(--shadow-light); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 16px; color: var(--moss); position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; user-select: none; }
  #deck-btn:hover { transform: scale(1.03); box-shadow: 8px 8px 18px rgba(100, 150, 80, 0.25), -8px -8px 18px var(--shadow-light); }
  #deck-btn:active { transform: scale(0.97); box-shadow: 3px 3px 8px rgba(100, 150, 80, 0.2), -3px -3px 8px var(--shadow-light); }
  #deck-btn::after { content: ''; position: absolute; inset: 4px; border-radius: 10px; border: 2px dashed rgba(139, 190, 130, 0.3); }
  #deck-count { font-size: 28px; font-weight: bold; margin-top: 4px; }
  #turn-status { width: 100%; max-width: 400px; text-align: center; font-size: 18px; font-weight: bold; color: var(--moss); background: rgba(240, 248, 236, 0.7); padding: 10px 14px; border-radius: 10px; box-shadow: inset 2px 2px 5px rgba(139, 190, 130, 0.15); }
  #discard-info { font-size: 14px; color: var(--sage); text-align: center; }
  #message-log { width: 100%; max-width: 400px; height: 132px; overflow-y: auto; background: rgba(240, 248, 236, 0.4); border-radius: 8px; padding: 6px; font-size: 15px; color: var(--sage); box-shadow: inset 2px 2px 5px rgba(139, 190, 130, 0.1); }
  .hand-card { width: 72px; height: 108px; border-radius: 10px; background: linear-gradient(145deg, var(--cream), #e0ecd8); box-shadow: 4px 4px 10px rgba(100, 150, 80, 0.15), -4px -4px 10px var(--shadow-light); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; flex-shrink: 0; }
  .hand-card:hover { transform: scale(1.08); box-shadow: 6px 6px 14px rgba(100, 150, 80, 0.2), -6px -6px 14px var(--shadow-light); }
  .hand-card:active { transform: scale(0.96); }
  .hand-card.poop { border: 2px solid var(--lavender); background: linear-gradient(145deg, #e8ddf5, var(--cream)); }
  .hand-card.cleanse { border: 2px solid var(--rose); background: linear-gradient(145deg, #f5d8dd, var(--cream)); }
  .hand-card.veto { border: 2px solid var(--lavender); background: linear-gradient(145deg, #e8ddf5, var(--cream)); }
  .hand-card.blue { border: 2px solid var(--sky); }
  .hand-card.green { border: 2px solid var(--mint); }
  .hand-card.yellow { border: 2px solid var(--peach); }
  .hand-card.orange { border: 2px solid var(--amber); }
  .card-name { font-size: 13px; font-weight: bold; margin-bottom: 2px; text-align: center; }
  .card-icon { font-size: 24px; margin-bottom: 2px; }
  .btn { padding: 10px 20px; border-radius: var(--btn-radius); font-family: inherit; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; font-size: 16px; }
  .btn-primary { background: linear-gradient(145deg, var(--cream), #e0ecd8); box-shadow: 5px 5px 10px rgba(100, 150, 80, 0.2), -5px -5px 10px var(--shadow-light); color: var(--text); }
  .btn-primary:hover { background: linear-gradient(145deg, var(--cream), #d8e8d4); }
  .btn-primary:active { box-shadow: inset 2px 2px 5px rgba(100, 150, 80, 0.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); }
  .label-tag { font-size: 13px; font-weight: bold; color: var(--sage); background: rgba(240, 248, 236, 0.6); padding: 2px 8px; border-radius: 6px; }
  #modal-overlay { position: fixed; inset: 0; background: rgba(60, 80, 55, 0.25); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box { width: 90%; max-width: 400px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; transform: scale(0.9); transition: transform 0.3s; }
  #modal-overlay.show .modal-box { transform: scale(1); }
  .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
  .modal-content { font-size: 16px; line-height: 1.5; color: #444; width: 100%; }
  .modal-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  @keyframes flipIn { 0% { transform: rotateY(90deg); opacity: 0; } 100% { transform: rotateY(0); opacity: 1; } }
  @keyframes dissolve { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2) rotate(5deg); opacity: 0.5; } 100% { transform: scale(0); opacity: 0; } }
  .flip-anim { animation: flipIn 0.6s ease-out forwards; }
  .dissolve-anim { animation: dissolve 0.8s ease-in forwards; }
  @media (max-width: 768px) {
    #player-row { gap: 6px; } .player-zone { max-width: 120px; padding: 6px; }
    .avatar { width: 48px; height: 48px; font-size: 18px; }
    .hand-count { font-size: 15px; } .label-tag { font-size: 15px; }
    #deck-btn { width: 80px; height: 100px; font-size: 18px; }
    #deck-count { font-size: 24px; } #turn-status { font-size: 18px; max-width: 280px; }
    #message-log { height: 132px; font-size: 16px; } #hand-area { min-height: 100px; padding: 8px; }
    .hand-card { width: 50px; height: 88px; } .card-name { font-size: 13px; } .card-icon { font-size: 20px; }
    #center-area { gap: 7px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="lobby-screen">
    <div class="lobby-box neu-flat glass">
      <h2 style="color:var(--moss)">掃除大便生存戰</h2>
      <div id="lobby-status" class="status-text">準備連接...</div>
      <div id="room-info-box" style="display:none; flex-direction:column; gap:10px; align-items:center;">
        <div style="font-size:14px; color:var(--sage)">你的房間號碼：</div>
        <div id="current-room-id" class="room-display">----</div>
        <button class="btn btn-primary" onclick="App.copyRoomId()">複製房號</button>
      </div>
      <div id="lobby-controls" style="display:flex; flex-direction:column; gap:12px; width:100%;">
        <input type="text" id="room-input" placeholder="輸入房號 (選填)" style="padding:10px; border-radius:8px; border:1px solid var(--sage); text-align:center; font-size:16px;">
        <div style="display:flex; gap:10px; width:100%;">
          <button class="btn btn-primary" style="flex:1;" onclick="App.createRoom()">建立房間</button>
          <button class="btn btn-primary" style="flex:1;" onclick="App.joinRoom()">加入遊戲</button>
        </div>
      </div>
      <button id="start-game-btn" class="btn btn-primary" style="display:none; width:100%; margin-top:10px;" onclick="App.startGame()">開始遊戲</button>
    </div>
  </div>
  <div id="game-board">
    <div id="player-row">
      <div id="seat-a" class="player-zone glass neu-flat" data-seat="A">
        <div class="hand-count">手牌: <span class="seat-hand-count">0</span></div>
        <div class="avatar seat-avatar" style="background: linear-gradient(135deg, #a8d8a0, #c8e8c0);">🤖</div>
        <div class="label-tag seat-player-label">?</div>
      </div>
      <div id="seat-b" class="player-zone glass neu-flat" data-seat="B">
        <div class="hand-count">手牌: <span class="seat-hand-count">0</span></div>
        <div class="avatar seat-avatar" style="background: linear-gradient(135deg, #8fb88a, #c0d8b8);">😎</div>
        <div class="label-tag seat-player-label">?</div>
      </div>
      <div id="seat-c" class="player-zone glass neu-flat" data-seat="C">
        <div class="hand-count">手牌: <span class="seat-hand-count">0</span></div>
        <div class="avatar seat-avatar" style="background: linear-gradient(135deg, #78b89e, #a8d8c0);">👻</div>
        <div class="label-tag seat-player-label">?</div>
      </div>
      <div id="seat-d" class="player-zone glass neu-flat" data-seat="D">
        <div class="hand-count">手牌: <span class="seat-hand-count">0</span></div>
        <div class="avatar seat-avatar" style="background: linear-gradient(135deg, #d4e8c8, #f0e8d0);">👽</div>
        <div class="label-tag seat-player-label">?</div>
      </div>
    </div>
    <div id="direction-indicator">A → B → C → D</div>
    <div id="center-area" class="glass neu-flat">
      <div id="deck-btn" onclick="App.clickDeck()">
        <span>牌堆</span><span id="deck-count">20</span>
      </div>
      <div id="turn-status">等待遊戲開始...</div>
      <div id="message-log"></div>
      <button id="scroll-mode-toggle" class="btn" onclick="App.toggleScrollMode()" style="font-size:13px; padding:4px 12px; background: linear-gradient(145deg, #f5f8f0, #e0ecd8); color: var(--moss); box-shadow: 2px 2px 5px rgba(100,150,80,0.15), -2px -2px 5px var(--shadow-light); border-radius: 8px; border: 1px solid rgba(139,190,130,0.2);">訊息:自動滾動</button>
      <div id="discard-info">棄牌數: 0</div>
    </div>
    <div id="hand-area" class="neu-flat"></div>
  </div>
</div>
<div id="modal-overlay">
  <div class="modal-box glass neu-flat">
    <div class="modal-title" id="m-title"></div>
    <div class="modal-content" id="m-body"></div>
    <div class="modal-actions" id="m-actions"></div>
  </div>
</div>
<script type="module">
// ================= Supabase 配置 =================
const SUPABASE_URL = 'https://ctpzyxuezychetfdkftb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PqU-ptNARKPSzRWn7wATBg_HS__tcpJ';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let channel = null;
let currentRoomId = null;
let isHost = false;
let guestJoined = false;
let myPlayerId = 0;
let mySeatIndex = -1;
let myName = '?';
let isServer = false;  // host runs game logic, joiner only syncs

// ================= 遊戲常數與狀態 =================
const TYPES = {
  POOP: 'poop', CLEANSE: 'cleanse', DIVINATION: 'divination', PEEK: 'peek',
  SHUFFLE: 'shuffle', SWAP: 'swap', DEMAND: 'demand', SKIP: 'skip',
  REVERSE: 'reverse', COMMAND: 'command', VETO: 'veto'
};

const CARD_ICONS = { poop:'💩', cleanse:'🧹', divination:'🔮', peek:'👁️', shuffle:'🔀', swap:'🔄', demand:'📥', skip:'⏭️', reverse:'🔁', command:'👉', veto:'🚫' };
const CARD_NAMES = { poop:'大便', cleanse:'掃除', divination:'占卜', peek:'看穿', shuffle:'洗牌', swap:'交換', demand:'索要', skip:'跳過', reverse:'轉向', command:'指使', veto:'否決' };
const AVATAR_ICONS = { 0:'😎', 1:'🤖', 2:'👻', 3:'👽' };
function getCardIcon(type) { return CARD_ICONS[type] || ''; }
function getCardName(type) { return CARD_NAMES[type] || type; }
function getAvatarIcon(id) { return AVATAR_ICONS[id] || '?'; }

let state = {
  deck: [], discard: [], players: [], currentPlayer: 0, direction: 1,
  phase: 'play', skipDraw: false, skipDrawFor: -1, turnCount: 0,
  gameOver: false, autoScrollMode: true,
  commandTarget: -1, commandTurnsLeft: 0, commandSource: -1,
  pendingInteractive: false,  // 等待互動式卡牌結果（human modal 中）
  aiMemory: { topCards: [], knownPoopPositions: [] }
};

const UI = {
  board: document.getElementById('game-board'),
  handArea: document.getElementById('hand-area'),
  log: document.getElementById('message-log'),
  modal: document.getElementById('modal-overlay'),
  mTitle: document.getElementById('m-title'),
  mBody: document.getElementById('m-body'),
  mActions: document.getElementById('m-actions'),
  turnStatus: document.getElementById('turn-status'),
  deckCount: document.getElementById('deck-count'),
  discardInfo: document.getElementById('discard-info'),
  directionIndicator: document.getElementById('direction-indicator'),
  scrollToggle: document.getElementById('scroll-mode-toggle'),
};

const SEAT_LETTERS = ['A','B','C','D'];
let seatMap = [-1,-1,-1,-1];
let playerSeatMap = {};

// ================= 工具函式 =================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function log(msg) {
  const line = document.createElement('div');
  line.textContent = msg;
  line.style.padding = '4px 0';
  line.style.borderBottom = '1px solid rgba(0,0,0,0.05)';
  UI.log.appendChild(line);
  if (state.autoScrollMode) UI.log.scrollTop = UI.log.scrollHeight;
}

function showModal(title, bodyHtml, buttons, callback) {
  UI.mTitle.textContent = title || '提示';
  UI.mBody.innerHTML = bodyHtml || '';
  UI.mActions.innerHTML = '';
  if (buttons && buttons.length > 0) {
    buttons.forEach(txt => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = txt;
      btn.onclick = () => { hideModal(); if(callback) callback(txt); };
      UI.mActions.appendChild(btn);
    });
  }
  UI.modal.classList.add('show');
}

function hideModal() {
  UI.modal.classList.remove('show');
  document.activeElement?.blur();
}

function createDeck() {
  let deck = [];
  const configs = [
    { type: TYPES.POOP, count: 3, name: '大便', icon: '💩', color: '#8e44ad' },
    { type: TYPES.CLEANSE, count: 5, name: '掃除', icon: '🧹', color: '#e74c3c' },
    { type: TYPES.DIVINATION, count: 4, name: '占卜', icon: '🔮', color: '#3498db' },
    { type: TYPES.PEEK, count: 4, name: '看穿', icon: '👁️', color: '#3498db' },
    { type: TYPES.SHUFFLE, count: 4, name: '洗牌', icon: '🔀', color: '#27ae60' },
    { type: TYPES.SWAP, count: 3, name: '交換', icon: '🔄', color: '#f1c40f' },
    { type: TYPES.DEMAND, count: 3, name: '索要', icon: '📥', color: '#e67e22' },
    { type: TYPES.SKIP, count: 4, name: '跳過', icon: '⏭️', color: '#2ecc71' },
    { type: TYPES.REVERSE, count: 4, name: '轉向', icon: '🔁', color: '#27ae60' },
    { type: TYPES.COMMAND, count: 3, name: '指使', icon: '👉', color: '#d35400' },
    { type: TYPES.VETO, count: 3, name: '否決', icon: '🚫', color: '#c9a0dc' }
  ];
  configs.forEach(c => { for(let i=0; i<c.count; i++) deck.push({ ...c, id: Math.random().toString(36).substr(2, 9) }); });
  shuffle(deck);
  return deck;
}

function dealCards() {
  let cleanses = state.deck.filter(c => c.type === TYPES.CLEANSE);
  shuffle(cleanses);
  let funcCards = state.deck.filter(c => c.type !== TYPES.CLEANSE && c.type !== TYPES.POOP);
  shuffle(funcCards);
  state.players.forEach((p, i) => {
    p.hand = [];
    if (i < cleanses.length) p.hand.push(cleanses[i]);
    for(let j=0; j<4 && funcCards.length>0; j++) p.hand.push(funcCards.shift());
  });
  const poopCards = state.deck.filter(c => c.type === TYPES.POOP);
  const cleanseRemaining = cleanses.slice(state.players.length);
  state.deck = [...cleanseRemaining, ...poopCards, ...funcCards];
  shuffle(state.deck);
}

function assignSeating(hostSeatIdx, joinerSeatIdx) {
  seatMap = [-1,-1,-1,-1];
  playerSeatMap = {};
  seatMap[hostSeatIdx] = 0;  // host = index 0
  playerSeatMap[0] = hostSeatIdx;
  if (joinerSeatIdx !== undefined && joinerSeatIdx >= 0 && joinerSeatIdx < 4) {
    seatMap[joinerSeatIdx] = 1;  // joiner = index 1
    playerSeatMap[1] = joinerSeatIdx;
  } else if (guestJoined) {
    // 只有在沒有明確指定 joinerSeatIdx 且 guestJoined 時才隨機（舊邏輯，已淘汰）
    let availableSlots = [];
    for(let i = 0; i < 4; i++) if(seatMap[i] === -1) availableSlots.push(i);
    if(availableSlots.length > 0) {
      let randomJoinerSeatIdx = availableSlots[Math.floor(Math.random() * availableSlots.length)];
      seatMap[randomJoinerSeatIdx] = 1;
      playerSeatMap[1] = randomJoinerSeatIdx;
    }
  }
  let aiIdCounter = 2;
  for (let s = 0; s < 4; s++) {
    if (seatMap[s] === -1) {
      seatMap[s] = aiIdCounter++;
      playerSeatMap[seatMap[s]] = s;
    }
  }
}

function updateDirectionIndicator() {
  if (!UI.directionIndicator) return;
  const alivePlayers = state.players.filter(p => p && p.alive);
  if (alivePlayers.length < 2) {
    const winnerName = alivePlayers.length === 1 ? (alivePlayers[0]?.name || '') : '';
    UI.directionIndicator.textContent = alivePlayers.length === 1 ? `${winnerName} 獲勝！` : '';
    UI.directionIndicator.classList.remove('reverse');
    return;
  }
  const arrow = state.direction === 1 ? '→' : '←';
  // 按照座位順序（slot 0→1→2→3 = A→B→C→D）顯示存活玩家
  let parts = [];
  for (let s = 0; s < 4; s++) {
    const pid = seatMap[s];
    if (pid >= 0 && pid <= 3) {
      const player = state.players[pid];
      if (player && player.alive) parts.push(SEAT_LETTERS[s]);
    }
  }
  UI.directionIndicator.textContent = parts.join(` ${arrow} `);
  UI.directionIndicator.classList.toggle('reverse', state.direction === -1);
}

function updateSeatUI() {
  for (let s = 0; s < 4; s++) {
    const seatEl = document.getElementById(`seat-${SEAT_LETTERS[s].toLowerCase()}`);
    if (!seatEl) continue;
    const pid = seatMap[s];
    const p = state.players[pid];
    if (!p) continue;
    const seatLabel = seatEl.querySelector('.seat-player-label');
    const seatHandCount = seatEl.querySelector('.seat-hand-count');
    const seatAvatar = seatEl.querySelector('.avatar');
    if (seatLabel) seatLabel.textContent = p.isHuman ? p.name + '（你）' : p.name;
    if (seatHandCount) seatHandCount.textContent = p.hand.length;
    if (seatAvatar) {
      seatAvatar.style.background = p.avatarBg;
      seatAvatar.textContent = p.icon;
      seatAvatar.classList.toggle('eliminated', !p.alive);
    }
  }
}

function updateActiveAvatar() {
  document.querySelectorAll('.avatar').forEach(el => {
    el.classList.remove('active-turn');
    el.classList.remove('eliminated');
    el.classList.remove('dissolve-anim');
  });
  for (let s = 0; s < 4; s++) {
    if (seatMap[s] === state.currentPlayer) {
      const seatEl = document.getElementById(`seat-${SEAT_LETTERS[s].toLowerCase()}`);
      if (seatEl) seatEl.querySelector('.avatar').classList.add('active-turn');
      break;
    }
  }
}

function renderAll() {
  for (let s = 0; s < 4; s++) {
    const pid = seatMap[s];
    if (pid < 0 || pid > 3) continue;
    const p = state.players[pid];
    if (!p) continue;
    const seatEl = document.getElementById(`seat-${SEAT_LETTERS[s].toLowerCase()}`);
    if (!seatEl) continue;
    const seatLabel = seatEl.querySelector('.seat-player-label');
    const seatHandCount = seatEl.querySelector('.seat-hand-count');
    const seatAvatar = seatEl.querySelector('.avatar');
    if (seatLabel) seatLabel.textContent = p.isHuman ? p.name + '（你）' : p.name;
    if (seatHandCount) seatHandCount.textContent = p.hand.length;
    if (seatAvatar) {
      seatAvatar.style.background = p.avatarBg;
      seatAvatar.textContent = p.icon;
      seatAvatar.classList.toggle('eliminated', !p.alive);
    }
  }
  updateDirectionIndicator();
  UI.deckCount.textContent = state.deck.length;
  UI.discardInfo.textContent = `棄牌數: ${state.discard.length}`;

  const humanPlayer = state.players.find(p => p.isHuman);
  // 只有當本地玩家存活且有 isHuman 时才渲染手牌
  if (humanPlayer && myPlayerId >= 0 && humanPlayer.id === myPlayerId) {
    UI.handArea.innerHTML = '';
    const isMyTurn = (state.currentPlayer === humanPlayer.id);
    humanPlayer.hand.forEach(c => {
      const el = document.createElement('div');
      el.className = `hand-card ${c.type} neu-flat`;
      el.innerHTML = `<div class="card-icon">${c.icon}</div><div class="card-name">${c.name}</div>`;
      if (c.type === TYPES.CLEANSE || c.type === TYPES.VETO) {
        el.style.opacity = '0.6'; el.style.cursor = 'default';
        el.onclick = () => showModal(c.type === TYPES.CLEANSE ? '掃除牌' : '否決牌',
          c.type === TYPES.CLEANSE ? '掃除牌只能在摸到大便時使用。' : '否決牌是防禦牌。', ['知道了']);
      } else if (isMyTurn) {
        el.onclick = () => window.App.playCard(c.id);
      } else {
        el.style.cursor = 'default';
      }
      UI.handArea.appendChild(el);
    });
  } else {
    UI.handArea.innerHTML = '';
  }
}

function initScrollMode() {
  try {
    const saved = localStorage.getItem('baba_scroll_mode');
    if (saved === 'auto') state.autoScrollMode = true;
    else if (saved === 'smart') state.autoScrollMode = false;
  } catch(e) {}
  if (UI.scrollToggle) UI.scrollToggle.textContent = state.autoScrollMode ? '訊息:自動滾動' : '訊息:手動滑動';
}

function toggleScrollMode() {
  state.autoScrollMode = !state.autoScrollMode;
  if (UI.scrollToggle) UI.scrollToggle.textContent = state.autoScrollMode ? '訊息:自動滾動' : '訊息:手動滑動';
  try { localStorage.setItem('baba_scroll_mode', state.autoScrollMode ? 'auto' : 'smart'); } catch(e) {}
}


// ================= 核心遊戲流程 =================

function startTurn() {
  const p = state.players[state.currentPlayer];
  console.log('[STARTTURN_ENTRY] currentPlayer=' + state.currentPlayer + ' playerName=' + p?.name + ' alive=' + p?.alive + ' isHuman=' + p?.isHuman);
  if (!p || !p.alive) { console.log('[STARTTURN_ENTRY] skipping: no player or not alive'); return nextTurn(); }
  state.phase = 'play';
  updateActiveAvatar();
  renderAll();

  if (p.isHuman) {
    // 自己的回合
    UI.turnStatus.textContent = `你的回合（${p.name}）｜請出牌或摸牌`;
    UI.turnStatus.style.color = '#98b0ee';
  } else {
    // 別人的回合
    UI.turnStatus.textContent = `${p.name} 的回合...`;
    UI.turnStatus.style.color = '#9c8aaa';
    // 只有 host 端對 AI 玩家執行 AI（排除 human player 和 joiner）
    // joiner 的 player id 是 1（如果有加入者）
    const isJoiner = guestJoined && p.id === 1;
    // 如果 pendingInteractive 殘留且不是 human 回合，強制清除
    if (state.pendingInteractive && !p.isHuman && isServer) {
      console.log('[STARTTURN] pendingInteractive stuck, force clearing');
      state.pendingInteractive = false;
    }
    // 切換到不同玩家時清除 pendingInteractiveTargetIsHuman，防止殘留值觸發 shouldContinueAI
    if (state.lastActivePlayerId !== undefined && state.lastActivePlayerId !== p.id) {
      state.pendingInteractiveTargetIsHuman = false;
    }
    state.lastActivePlayerId = p.id;
    const canRunAI = !UI.modal.classList.contains('show') && !state.pendingInteractive && isServer && !isJoiner;
    console.log('[STARTTURN] player=' + p.name + '(id=' + p.id + ') isHuman=' + p.isHuman + ' isJoiner=' + isJoiner + ' modal=' + UI.modal.classList.contains('show') + ' pendingInt=' + state.pendingInteractive + ' isHost=' + isHost + ' → runAI=' + canRunAI);
    if (canRunAI) {
      setTimeout(() => runAI(), 800);
    }
  }
}

function playCard(cardId, isAI = false) {
  if (UI.modal.classList.contains('show')) return;
  const p = state.players[state.currentPlayer];
  if (!p) return;
  // AI 不受 isHuman 限制
  if (!isAI && !p.isHuman) return;
  // 只有當前的活人可以出牌
  const humanPlayer = state.players.find(pp => pp.isHuman);
  if (!isAI && humanPlayer && state.currentPlayer !== humanPlayer.id) return;
  const idx = p.hand.findIndex(c => c.id === cardId);
  if (idx === -1) return;
  const card = p.hand.splice(idx, 1)[0];
  state.discard.push(card);

  let logMsg = `${p.name} 打出了一張【${card.name}】。`;
  let extraMsg = '';

  // 互動式卡牌：AI 出牌時選目標並廣播 INTERACTIVE_TARGET
  const isInteractiveCard = [TYPES.SWAP, TYPES.DEMAND, TYPES.COMMAND].includes(card.type);
  if (isInteractiveCard && isAI) {
    log(logMsg);
    // AI 選目標
    let targetId = -1;
    if (card.type === TYPES.COMMAND) {
      // AI 指使：可以指使自己或他人
      const aliveOthers = state.players.filter(pl => pl.alive && pl.id !== p.id);
      const targetList = [p, ...aliveOthers];
      const target = targetList[Math.floor(Math.random() * targetList.length)];
      targetId = target.id;
    } else {
      const targets = state.players.filter(pl => pl.alive && pl.id !== p.id);
      if (targets.length > 0) {
        targetId = targets[Math.floor(Math.random() * targets.length)].id;
      }
    }
    if (targetId >= 0) {
      state.pendingInteractive = true;
      state.pendingInteractiveTargetIsHuman = targetId_isHuman(targetId);
      // AI 出互動式牌：本地執行效果 + 廣播 INTERACTIVE_TARGET
      const target = state.players[targetId];
      if (target) {
        if (targetId_isHuman(targetId)) {
          // 目標是 human：先 broadcast INTERACTIVE_TARGET 讓 joiner 端先 log「打出了一張」
          if (card.type !== TYPES.COMMAND || targetId !== p.id) {
            channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: card.type, senderId: p.id, targetId: targetId, senderName: p.name, cardTypeName: card.name } }).catch(() => {});
          }
          // 然後執行效果，等房主選擇
          if (targetId === myPlayerId) {
            // 本地 human（房主 id=0）→ 執行效果，等房主選擇
            switch (card.type) {
              case TYPES.SWAP: executeSwap(p, target, null); break;
              case TYPES.DEMAND: executeDemand(p, target, null); break;
              case TYPES.COMMAND:
                executeCommand(p, target, null);
                break;
            }
            state.pendingInteractive = false;
            state.pendingInteractiveTargetIsHuman = false;
          } else {
            // 遠端 human（加入者 id=1）→ 不執行效果，等 joiner 端 modal 選擇後 broadcast RESULT
            // pendingInteractive 不清，等 RESULT handler 清除
          }
        } else {
          // 目標是 AI → 先 broadcast INTERACTIVE_TARGET 讓 receiver 端先 log「打出了一張」
          if (card.type !== TYPES.COMMAND || targetId !== p.id) {
            channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: card.type, senderId: p.id, targetId: targetId, senderName: p.name, cardTypeName: card.name } }).catch(() => {});
          }
          // 然後執行效果
          switch (card.type) {
            case TYPES.SWAP: executeSwap(p, target, null); break;
            case TYPES.DEMAND: executeDemand(p, target, null); break;
            case TYPES.COMMAND:
              executeCommand(p, target, null);
              break;
          }
          state.pendingInteractive = false;
          state.pendingInteractiveTargetIsHuman = false;
        }
      }
    } else {
      // AI 沒有選到目標（只剩自己）→ 當非互動式牌處理，不清 pendingInteractive
      state.pendingInteractive = false;
    }
    renderAll();
    return;
  } else if (isInteractiveCard && !isAI) {
    // 真人出互動式牌：顯示 modal 選目標，然後廣播
    log(logMsg);
    extraMsg = showInteractiveChoice(card, p.id, (target) => {
      if (target === '__CANCEL__') {
        // 反悔：把牌從棄牌堆移回手牌
        const discardIdx = state.discard.findIndex(c => c.id === cardId);
        if (discardIdx !== -1) {
          state.discard.splice(discardIdx, 1);
          p.hand.push(card);
        }
        log(`${p.name} 取消了出牌。`);
        renderAll();
        return;
      }
      // 廣播 PLAY_CARD 讓對方知道這張牌被打出
      channel.send({ type: 'broadcast', event: 'PLAY_CARD', payload: { playerIndex: p.id, cardId: cardId, cardData: card, extraMsg: extraMsg } }).catch(() => {});
      renderAll();
    });
    if (extraMsg) log(extraMsg);
    renderAll();
    return;
  } else {
    // 非互動式牌：正常執行效果
    extraMsg = applyCardEffect(card);
  }
  log(logMsg);
  if (extraMsg) log(extraMsg);
  renderAll();

  // 廣播出牌（AI 和真人出牌都要廣播）
  channel.send({ type: 'broadcast', event: 'PLAY_CARD', payload: { playerIndex: p.id, cardId: cardId, cardData: card, extraMsg: extraMsg } }).catch(() => {});

  // 只有 SKIP / REVERSE 會立即結束回合
  if (card.type === TYPES.SKIP) {
    state.skipDraw = true;
    endTurn();
  }
  if (card.type === TYPES.REVERSE) {
    state.skipDraw = true;
    updateDirectionIndicator();
    endTurn();
  }
  // 其他牌不結束回合（DEMAND/SWAP/COMMAND 在 handler 中處理）
  // AI 出完非 SKIP/REVERSE 牌後，由 runAI 自行控制是否結束回合
}

function clickDeck() {
  if (myPlayerId === -1) return;
  if (state.phase === 'play') {
    const cp = state.players[state.currentPlayer];
    if (cp && !cp.isHuman) return;
    // Only allow deck click when it's the human player's turn
    const humanPlayer = state.players.find(p => p.isHuman);
    if (humanPlayer && state.currentPlayer !== humanPlayer.id) return;
    if (state.pendingInteractive) return;  // 等待互動式卡牌結果中
    endTurnPhase();
  }
}

function endTurnPhase() {
  if (UI.modal.classList.contains('show')) return;
  if (state.pendingInteractive) return;  // 等待互動式卡牌結果中
  if (state.phase === 'play') {
    drawPhase();
  } else {
    nextTurn();
  }
}

function drawPhase() {
  const p = state.players[state.currentPlayer];
  console.log('[DRAWPHASE] player=' + p?.name + ' alive=' + p?.alive + ' skipDraw=' + state.skipDraw + ' skipDrawFor=' + state.skipDrawFor);
  if (!p.alive) return nextTurn();

  // 檢查跳過摸牌
  if (state.skipDraw && (state.skipDrawFor === -1 || state.skipDrawFor === state.currentPlayer)) {
    log(`${p.name} 跳過了摸牌階段。`);
    state.skipDraw = false;
    state.skipDrawFor = -1;
    nextTurn();
    return;
  }

  // 牌堆枯竭 → 重組
  if (state.deck.length === 0) {
    state.deck = [...state.discard];
    shuffle(state.deck);
    state.discard = [];
    log('牌堆枯竭，棄牌堆重組為新牌堆。');
  }

  const card = state.deck.shift();
  p.hand.push(card);
  // 處理大便：先檢查，避免 log 錯誤訊息
  if (card.type === TYPES.POOP) {
    handlePoopDraw(p.id, card);
    return;
  }
  if (p.isHuman) {
    log(`你摸到了【${card.name}】。`);
  } else {
    log(`${p.name} 摸了一張牌。`);
  }

  renderAll();

  // 廣播摸牌（非大便才廣播，包含完整 deck 內容以同步）
  channel.send({
    type: 'broadcast', event: 'DRAW',
    payload: { playerIndex: p.id, playerName: p.name, cardType: card.type, deckCount: state.deck.length, hand: p.hand, deck: state.deck }
  }).catch(() => {});

  nextTurn();
}

function handlePoopDraw(drawId, card) {
  const drawPlayer = state.players[drawId];
  if (!drawPlayer || !drawPlayer.alive) return;

  // 廣播「摸到大便」訊息給其他人（摸牌者本地已在 drawPhase 中 log）
  if (drawId !== myPlayerId) {
    log(`${drawPlayer.name} 摸到了大便！`);
  }
  // 總是 broadcast，讓所有人都知道誰摸到了大便
  channel.send({ type: 'broadcast', event: 'DRAW_POOP', payload: { playerName: drawPlayer.name } }).catch(() => {});

  // 如果是自己的回合（無論 host/joiner），顯示 modal 讓玩家選擇
  if (drawId === myPlayerId) {
    showModal('你摸到了大便！', '💩 危險！', ['確認'], () => {
      const cleanIdx = drawPlayer.hand.findIndex(c => c.type === TYPES.CLEANSE);
      if (cleanIdx !== -1) {
        const cleanseCard = drawPlayer.hand.splice(cleanIdx, 1)[0];
        state.discard.push(cleanseCard);
        const maxPos = Math.min(5, state.deck.length);
        const positions = Array.from({length: maxPos}, (_,i) => `第${i+1}張`);
        positions.push('隨機');
        showModal('使用掃除清理！將大便放回牌堆何處？', '',
          positions, pos => {
            const insertedIdx = placePoopBack(card, pos);
            const poopIdx = drawPlayer.hand.findIndex(c => c.id === card.id);
            if (poopIdx !== -1) { drawPlayer.hand.splice(poopIdx, 1); }
            renderAll();
            log(`${drawPlayer.name} 使用掃除清理了大便！`);
            log(`大便已放回牌堆第 ${insertedIdx+1} 張位置。`);
            // 被指使者摸到大便 → 立即解除指使狀態
            if (state.commandTarget === drawPlayer.id && state.commandTurnsLeft > 0) {
              log(`${drawPlayer.name} 解除被指使狀態。`);
              state.commandTarget = -1;
              state.commandTurnsLeft = 0;
              state.skipDraw = false;
              state.skipDrawFor = -1;
            }
            channel.send({ type: 'broadcast', event: 'POOP_CLEANSE', payload: { playerName: drawPlayer.name, discardLength: state.discard.length, discard: [...state.discard], deckCount: state.deck.length, hand: drawPlayer.hand, deck: state.deck } }).catch(() => {});
            nextTurn();
          }
        );
      } else {
        eliminatePlayer(drawId);
      }
    });
  } else {
    const cleanIdx = drawPlayer.hand.findIndex(c => c.type === TYPES.CLEANSE);
    if (cleanIdx !== -1) {
      const cleanseCard = drawPlayer.hand.splice(cleanIdx, 1)[0];
      state.discard.push(cleanseCard);
      placePoopBack(card, '隨機');
      const poopIdx = drawPlayer.hand.findIndex(c => c.id === card.id);
      if (poopIdx !== -1) { drawPlayer.hand.splice(poopIdx, 1); }
      renderAll();
      log(`${drawPlayer.name} 使用掃除清理了大便！`);
      // 被指使者摸到大便 → 立即解除指使狀態
      if (state.commandTarget === drawPlayer.id && state.commandTurnsLeft > 0) {
        log(`${drawPlayer.name} 解除被指使狀態。`);
        state.commandTarget = -1;
        state.commandTurnsLeft = 0;
        state.skipDraw = false;
        state.skipDrawFor = -1;
      }
      channel.send({ type: 'broadcast', event: 'POOP_CLEANSE', payload: { playerName: drawPlayer.name, discardLength: state.discard.length, discard: [...state.discard], deckCount: state.deck.length, hand: drawPlayer.hand, deck: state.deck } }).catch(() => {});
      nextTurn();
    } else {
      eliminatePlayer(drawId);
    }
  }
}

function placePoopBack(card, pos) {
  let insertIdx = 0;
  const maxPos = Math.min(5, state.deck.length);
  if (pos === '隨機') {
    insertIdx = Math.floor(Math.random() * Math.max(1, maxPos));
  } else {
    const n = parseInt(pos.replace(/[^0-9]/g, ''));
    insertIdx = Math.max(0, Math.min(n-1, maxPos - 1));
  }
  state.deck.splice(insertIdx, 0, card);
  return insertIdx;
}

function eliminatePlayer(pid) {
  const p = state.players[pid];
  p.alive = false;
  log(`${p.name} 被淘汰！`);

  for (let s = 0; s < 4; s++) {
    if (seatMap[s] === pid) {
      const seatEl = document.getElementById(`seat-${SEAT_LETTERS[s].toLowerCase()}`);
      if (seatEl) {
        const av = seatEl.querySelector('.avatar');
        if (av) av.classList.add('eliminated', 'dissolve-anim');
      }
      break;
    }
  }

  const poopCards = p.hand.filter(c => c.type === TYPES.POOP);
  p.hand = p.hand.filter(c => c.type !== TYPES.POOP);
  if (poopCards.length > 0) {
    poopCards.forEach(poop => state.discard.push(poop));
    log(`大便已進入棄牌堆。`);
  }
  // 所有剩餘手牌也進入棄牌堆
  if (p.hand.length > 0) {
    state.discard.push(...p.hand);
    p.hand = [];
    log(`${p.name} 的所有手牌已進入棄牌堆。`);
  }

  const aliveCount = state.players.filter(p=>p.alive).length;

  channel.send({ type: 'broadcast', event: 'player_eliminated', payload: { playerIndex: pid, discardLength: state.discard.length, discard: [...state.discard] } }).catch(() => {});

  // 檢查是否所有真人玩家都已淘汰
  const anyHumanAlive = state.players.some(pp => pp.alive && pp.id < 2);
  if (!anyHumanAlive) {
    // 所有真人被淘汰，遊戲結束，顯示最後存活的 AI 獲勝
    const winner = state.players.find(pp => pp.alive);
    channel.send({ type: 'broadcast', event: 'GAME_OVER', payload: { winnerName: winner?.name || '?' } }).catch(() => {});
    // 所有端都顯示遊戲結束
      setTimeout(() => {
        showRematchModal(winner.name);
      }, 800);
    return;
  }

  if (aliveCount === 1) {
    const winner = state.players.find(pp=>pp.alive);
    channel.send({ type: 'broadcast', event: 'GAME_OVER', payload: { winnerName: winner?.name || '?' } }).catch(() => {});
    // 顯示給所有真人玩家（無論勝者或敗者）
    const humanWinner = state.players.find(pp => pp.alive && pp.id < 2);
    if (humanWinner && myPlayerId >= 0 && humanWinner.id === myPlayerId) {
      // 人類贏家：顯示勝利訊息，由 GAME_OVER handler 統一顯示 rematch modal
      setTimeout(() => {
        showRematchModal(winner.name);
      }, 800);
    }
  } else {
    // 如果 server 被淘汰，轉移 server 角色給下一個存活的 human 玩家
    if (isServer && p.isHuman) {
      // 先把被淘汰的玩家設為 pure spectator（不能再操作）
      isServer = false;
      myPlayerId = -1;
      // 找下一個存活的 human 玩家（id < 2），優先給 joiner（id=1）
      let newServerId = -1;
      for (let i = 0; i < 4; i++) {
        if (state.players[i] && state.players[i].alive && state.players[i].id < 2) {
          newServerId = i;
          break;
        }
      }
      if (newServerId >= 0) {
        // 廣播 server 轉移（讓 joiner 端知道）
        channel.send({ type: 'broadcast', event: 'SERVER_TRANSFERRED', payload: { newServerId: newServerId } }).catch(() => {});
        // 重新設定各玩家的 isHuman（讓兩端都知道誰是 human）
        state.players.forEach(pl => { pl.isHuman = (pl.id === newServerId); });
      } else {
        // 沒有其他 human 了，由第一個存活的 AI 接手
        for (let i = 0; i < 4; i++) {
          if (state.players[i] && state.players[i].alive) {
            newServerId = state.players[i].id;
            break;
          }
        }
        if (newServerId >= 0) {
          channel.send({ type: 'broadcast', event: 'SERVER_TRANSFERRED', payload: { newServerId: newServerId } }).catch(() => {});
          state.players.forEach(pl => { pl.isHuman = (pl.id === newServerId); });
        }
      }
      setTimeout(() => showModal('你被淘汰了！', [`💔（${p.name}）被淘汰出局，改為觀戰模式`], ['知道了'], () => { hideModal(); }), 800);
    }
    nextTurn();
  }
  if (p.isHuman) {
    if (aliveCount === 1) {
      const winner = state.players.find(pp => pp.alive);
      // GAME_OVER handler 會統一顯示 rematch modal
      setTimeout(() => {
        showRematchModal(winner.name);
      }, 800);
    } else {
      setTimeout(() => showModal('你被淘汰了！', [`💔（${p.name}）被淘汰出局，改為觀戰模式`], ['知道了'], () => { hideModal(); }), 800);
    }
  }
}

function endTurn() {
  state.skipDraw = false;
  nextTurn();
}

function nextTurn() {
  console.log('[NEXTTURN] currentPlayer=' + state.currentPlayer + ' commandTarget=' + state.commandTarget + ' commandTurnsLeft=' + state.commandTurnsLeft);
  // 被指使者回合計數 — 在被指使者回合結束時遞減
  if (state.commandTarget >= 0 && state.currentPlayer === state.commandTarget && state.commandTurnsLeft > 0) {
    state.commandTurnsLeft--;
    if (state.commandTurnsLeft > 0) {
      // 還有剩餘指使回合，繼續讓被指使者
      startTurn();
      return;
    }
    // 指使回合已用完，解除指使狀態
    state.commandTarget = -1;
    state.commandTurnsLeft = 0;
    state.skipDraw = false;
    state.skipDrawFor = -1;
  }

  // 找到當前玩家在 seatMap 中的 slot
  let currentSlot = -1;
  for (let s = 0; s < 4; s++) {
    if (seatMap[s] === state.currentPlayer) { currentSlot = s; break; }
  }

  // 找到下一個存活玩家
  let nextSlot = currentSlot >= 0 ? currentSlot : 0;
  let loop = 0;
  do {
    nextSlot = (nextSlot + state.direction + 4) % 4;
    const nextPlayerId = seatMap[nextSlot];
    if (nextPlayerId >= 0 && nextPlayerId <= 3 && state.players[nextPlayerId] && state.players[nextPlayerId].alive) {
      state.currentPlayer = nextPlayerId;
      break;
    }
    loop++;
  } while (loop < 4);

  state.skipDraw = false;

  // 廣播回合轉移（包含 direction、command 狀態、skipDraw 狀態）
  const nextPlayer = state.players[state.currentPlayer];
  channel.send({
    type: 'broadcast', event: 'TURN_CHANGED',
    payload: { playerIndex: state.currentPlayer, playerName: nextPlayer?.name || '?', direction: state.direction, commandTurnsLeft: state.commandTurnsLeft, commandTarget: state.commandTarget, commandSource: state.commandSource, skipDraw: state.skipDraw, skipDrawFor: state.skipDrawFor }
  }).catch(() => {});

  startTurn();
}


// ================= 卡牌效果處理 =================

function applyCardEffect(card) {
  const cp = state.players[state.currentPlayer];
  const isHumanTurn = cp.isHuman;
  let extraMsg = '';

  switch (card.type) {
    case TYPES.DIVINATION:
      if (isHumanTurn) {
        const poopIdx = state.deck.findIndex(c => c.type === TYPES.POOP);
        if (poopIdx !== -1) {
          showModal('占卜結果', `牌堆第 ${poopIdx+1} 張是大便！`, ['知道了'], () => {
            state.aiMemory.knownPoopPositions = [poopIdx + 1];
          });
        } else {
          showModal('占卜結果', '牌堆中沒有大便。', ['知道了'], () => {
            state.aiMemory.knownPoopPositions = [];
          });
        }
      } else {
        const poopIdx = state.deck.findIndex(c => c.type === TYPES.POOP);
        state.aiMemory.knownPoopPositions = [];
        if (poopIdx !== -1) state.aiMemory.knownPoopPositions.push(poopIdx + 1);
        extraMsg = `${cp.name} 使用了占卜`;
      }
      break;

    case TYPES.PEEK:
      if (isHumanTurn) {
        const peeked = [];
        for (let i = 0; i < Math.min(3, state.deck.length); i++) {
          peeked.push({ ...state.deck[i], _peekIndex: i + 1 });
        }
        const info = peeked.map(c => `第${c._peekIndex}張：【${c.name}】`).join('<br>');
        const poopPositions = peeked.filter(c => c.type === TYPES.POOP).map(c => c._peekIndex);
        showModal('看穿結果', info, ['知道了'], () => {
          window._lastPeek = peeked.map(c => c.type);
          state.aiMemory.topCards = peeked.map(c => ({ type: c.type, position: c._peekIndex }));
          state.aiMemory.knownPoopPositions = poopPositions;
        });
      } else {
        const peeked = [];
        for (let i = 0; i < Math.min(3, state.deck.length); i++) {
          peeked.push({ ...state.deck[i], _peekIndex: i + 1 });
        }
        state.aiMemory.topCards = peeked.map(c => ({ type: c.type, position: c._peekIndex }));
        state.aiMemory.knownPoopPositions = peeked.filter(c => c.type === TYPES.POOP).map(c => c._peekIndex);
        extraMsg = `${cp.name} 使用了看穿`;
      }
      break;

    case TYPES.SHUFFLE:
      state.aiMemory.topCards = [];
      state.aiMemory.knownPoopPositions = [];
      for (let i = state.deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
      }
      extraMsg = '牌堆已重新洗牌！';
      break;

    case TYPES.SKIP:
      state.skipDraw = true;
      break;

    case TYPES.REVERSE:
      state.direction *= -1;
      extraMsg = '方向反轉！';
      break;

    case TYPES.SWAP:
      if (isHumanTurn) {
        const targets = state.players.filter(p => p.alive && p.id !== cp.id);
        if (targets.length > 0) {
          showModal('與誰交換手牌？', '', targets.map(p => p.name), t => {
            const target = state.players.find(p => p.name === t);
            if (!target) return;
            // 廣播目標選擇，讓接收端處理
            channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.SWAP, senderId: cp.id, targetId: target.id } }).catch(() => {});
          });
        }
      }
      // 非 human 分支已移除：AI 出互動式牌也走 INTERACTIVE_TARGET 流程
      // sender 端已經廣播，receiver 端處理效果
      break;

    case TYPES.DEMAND:
      if (isHumanTurn) {
        const targets = state.players.filter(p => p.alive && p.id !== cp.id);
        if (targets.length > 0) {
          showModal('要向誰索要手牌？', '', targets.map(p => p.name), t => {
            const target = state.players.find(p => p.name === t);
            if (!target) return;
            channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.DEMAND, senderId: cp.id, targetId: target.id } }).catch(() => {});
          });
        }
      }
      break;

    case TYPES.COMMAND:
      if (isHumanTurn) {
        const aliveOthers = state.players.filter(p => p.alive && p.id !== cp.id);
        const targetList = [cp, ...aliveOthers];
        if (targetList.length > 0) {
          showModal('要指定誰代替你進行回合？', '', targetList.map(p => p.name), t => {
            const target = state.players.find(p => p.name === t);
            if (!target) return;
            channel.send({ type: 'broadcast', event: 'INTERACTIVE_TARGET', payload: { cardType: TYPES.COMMAND, senderId: cp.id, targetId: target.id } }).catch(() => {});
          });
        }
      }
      break;
  }
  return extraMsg;
}

function handleSwap(from, to, onComplete) {
  // 檢查否決
  if (to.hand.some(c => c.type === TYPES.VETO)) {
    if (to.id === myPlayerId) {
      showModal(`你被${from.name}要求交換手牌了，要否決嗎？`, '',
        ['要', '不要'],
        choice => {
          if (choice === '要') {
            const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
            const vCard = to.hand.splice(vi, 1)[0];
            state.discard.push(vCard);
            renderAll();
            log(`${to.name} 使用否決，拒絕了 ${from.name} 的【交換】！`);
            // 否決後回到 from 的回合，清除 skipDraw
            state.currentPlayer = from.id;
            state.skipDraw = false;
            state.skipDrawFor = -1;
            state.pendingInteractive = false;
            channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
            // 只有 server 端才呼叫 startTurn（觸發 AI）
            if (isServer) startTurn();
          } else {
            [from.hand, to.hand] = [to.hand, from.hand];
            renderAll();
            log(`${from.name} 與 ${to.name} 交換手牌！`);
            channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'swapped', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
            if (onComplete) onComplete();
          }
        }
      );
    } else {
      const vi = to.hand.findIndex(c => c.type === TYPES.VETO);
      if (vi !== -1) {
        const vCard = to.hand.splice(vi, 1)[0];
        state.discard.push(vCard);
        renderAll();
        log(`${to.name} 使用否決，拒絕了 ${from.name} 的【交換】！`);
        // 否決後回到 from 的回合，清除 skipDraw
        state.currentPlayer = from.id;
        state.skipDraw = false;
        state.skipDrawFor = -1;
        channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'veto', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
        // 只有 server 端才呼叫 startTurn（觸發 AI）
        if (isServer) startTurn();
      } else {
        [from.hand, to.hand] = [to.hand, from.hand];
        renderAll();
        log(`${from.name} 與 ${to.name} 交換手牌！`);
        channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'swapped', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
        if (onComplete) onComplete();
      }
    }
  } else {
    [from.hand, to.hand] = [to.hand, from.hand];
    renderAll();
    log(`${from.name} 與 ${to.name} 交換手牌！`);
    channel.send({ type: 'broadcast', event: 'SWAP_RESULT', payload: { fromIndex: from.id, toIndex: to.id, result: 'swapped', fromHand: from.hand, toHand: to.hand } }).catch(() => {});
    if (onComplete) onComplete();
  }
}

// ================= AI 出牌邏輯 =================

function runAI() {
  const p = state.players[state.currentPlayer];
  if (!p || !p.alive || p.isHuman) { console.log('[RUNAI] SKIP: no player or eliminated or human'); return; }
  if (state.phase !== 'play') { console.log('[RUNAI] SKIP: phase=' + state.phase); return; }

  let playable = p.hand.filter(c => c.type !== TYPES.CLEANSE && c.type !== TYPES.VETO);

  // AI 防呆：手牌多時保留否決
  if (p.hand.length > 8 && p.hand.some(c => c.type === TYPES.VETO)) {
    playable = playable.filter(c => c.type !== TYPES.VETO);
  }
  // AI 防呆：只有一張指使時不輕易使用
  if (p.hand.filter(c => c.type === TYPES.COMMAND).length <= 1 && p.hand.length > 2) {
    playable = playable.filter(c => c.type !== TYPES.COMMAND);
  }

  console.log('[RUNAI] player=' + p.name + ' hand=' + p.hand.length + ' playable=' + playable.length);

  if (playable.length === 0) {
    console.log('[RUNAI] NO playable cards → endTurnPhase');
    endTurnPhase();
    return;
  }

  // 權重計算
  const weights = {};
  weights[TYPES.COMMAND] = 4;
  weights[TYPES.DEMAND] = 3;
  weights[TYPES.SWAP] = 1;
  weights[TYPES.SKIP] = 1;
  weights[TYPES.REVERSE] = 1;
  weights[TYPES.DIVINATION] = 1;
  weights[TYPES.PEEK] = 1;
  weights[TYPES.SHUFFLE] = 1;

  const handCount = p.hand.length;
  if (handCount > 8) { weights[TYPES.DEMAND] += 3; weights[TYPES.SWAP] += 3; }
  else if (handCount > 6) { weights[TYPES.DEMAND] += 2; weights[TYPES.SWAP] += 2; }
  if (handCount <= 2) weights[TYPES.SKIP] += 2;

  const poopInDiscard = state.discard.filter(c => c.type === TYPES.POOP).length;
  const poopInDeck = 3 - poopInDiscard;
  const poopProbability = state.deck.length > 0 ? poopInDeck / state.deck.length : 0.075;

  let skipBonus = 0;
  if (poopProbability >= 0.2) skipBonus = Math.min(2, Math.floor(poopProbability * 4));
  if (poopProbability < 0.25) weights[TYPES.SHUFFLE] += 3;
  if (poopProbability < 0.2) skipBonus = -1;
  if (!isEndgame() && state.deck.length > 20) weights[TYPES.SHUFFLE] += 2;

  const heavyOpponents = state.players.filter(pl => pl.alive && pl.id !== p.id && pl.hand.length > p.hand.length + 2);
  if (heavyOpponents.length > 0) {
    weights[TYPES.SWAP] += 2 * heavyOpponents.length;
    weights[TYPES.DEMAND] += 2 * heavyOpponents.length;
  }
  if (handCount >= 4) {
    const lightOpponents = state.players.filter(pl => pl.alive && pl.id !== p.id && pl.hand.length < handCount - 1);
    if (lightOpponents.length > 0) weights[TYPES.SWAP] = Math.max(1, weights[TYPES.SWAP] - 1);
  }
  const nearEliminated = state.players.filter(pl => pl.alive && pl.id !== p.id && pl.hand.length <= 1);
  if (nearEliminated.length >= 2) {
    weights[TYPES.SWAP] = Math.max(1, weights[TYPES.SWAP] - 2);
    weights[TYPES.DEMAND] = Math.max(1, weights[TYPES.DEMAND] - 2);
  }
  if (isEndgame()) {
    weights[TYPES.COMMAND] += 3;
    weights[TYPES.DEMAND] += 2;
    weights[TYPES.SKIP] += 2;
  }
  if (state.deck.length < 10) { skipBonus += 2; }
  if (state.commandTarget >= 0 && p.id === state.commandTarget && state.commandTurnsLeft > 0) {
    weights[TYPES.SWAP] = Math.max(1, weights[TYPES.SWAP] - 1);
    weights[TYPES.DEMAND] = Math.max(1, weights[TYPES.DEMAND] - 1);
    weights[TYPES.COMMAND] = Math.max(1, weights[TYPES.COMMAND] - 1);
  }
  const cleanseCount = p.hand.filter(c => c.type === TYPES.CLEANSE).length;
  if (cleanseCount > 0 && poopProbability > 0.12) weights[TYPES.SKIP] = Math.max(1, weights[TYPES.SKIP] - 1);

  let knowsTopPoop = false;
  if (state.aiMemory.knownPoopPositions && state.aiMemory.knownPoopPositions.length > 0) {
    state.aiMemory.knownPoopPositions = state.aiMemory.knownPoopPositions.filter(pos => pos <= state.deck.length);
    if (state.aiMemory.knownPoopPositions.find(pos => pos === 1)) knowsTopPoop = true;
  }
  if (knowsTopPoop) {
    weights[TYPES.SKIP] += 5;
    weights[TYPES.SHUFFLE] = (weights[TYPES.SHUFFLE] || 0) + 5;
    weights[TYPES.DEMAND] = (weights[TYPES.DEMAND] || 0) + 3;
    if (cleanseCount > 0) weights[TYPES.SHUFFLE] += 3;
  }
  if (!knowsTopPoop && state.deck.length < 10) weights[TYPES.SKIP] += 2;

  weights[TYPES.SKIP] = Math.max(1, weights[TYPES.SKIP] + skipBonus);

  // 跳過/轉向時機
  let forwardHand = 0, backwardHand = 0;
  // 找下一個存活玩家（順時針方向）
  let nextSlot = -1;
  for (let s = 0; s < 4; s++) {
    if (seatMap[s] === p.id) { nextSlot = s; break; }
  }
  if (nextSlot >= 0) {
    let loop = 0;
    do {
      nextSlot = (nextSlot + state.direction + 4) % 4;
      const nextId = seatMap[nextSlot];
      if (nextId >= 0 && nextId <= 3 && state.players[nextId] && state.players[nextId].alive) {
        forwardHand = state.players[nextId].hand.length;
        break;
      }
      loop++;
    } while (loop < 4);
  }
  // 找上一個存活玩家（逆時針方向）
  if (nextSlot >= 0) {
    let loop = 0;
    do {
      nextSlot = (nextSlot - state.direction + 4) % 4;
      const prevId = seatMap[nextSlot];
      if (prevId >= 0 && prevId <= 3 && state.players[prevId] && state.players[prevId].alive) {
        backwardHand = state.players[prevId].hand.length;
        break;
      }
      loop++;
    } while (loop < 4);
  }
  if (forwardHand < 3) weights[TYPES.REVERSE] += 3;
  if (backwardHand < 3) weights[TYPES.SKIP] += 2;

  let pool = [];
  playable.forEach(card => {
    const w = weights[card.type] || 1;
    const includeChance = Math.min(1, w / 5);
    if (Math.random() < includeChance) pool.push(card);
  });
  if (pool.length === 0) pool = playable;

  const chosen = pool[Math.floor(Math.random() * pool.length)];
  const playerBefore = state.currentPlayer;
  const wasInteractive = [TYPES.SWAP, TYPES.DEMAND, TYPES.COMMAND].includes(chosen.type);
  playCard(chosen.id, true);  // isAI = true

  // 出完牌後，如果 state.phase 仍是 'play' 且 currentPlayer 沒變，表示牌沒有立即結束回合
  // （SKIP/REVERSE 已在 playCard 中呼叫 endTurn()，COMMAND 會改變 currentPlayer）
  // 互動式牌已由 playCard callback 執行效果，pendingInteractive 應已設為 false
  // 如果 pendingInteractive 為 false 且沒有 modal，可以繼續摸牌或結束回合
  const canEnd = state.phase === 'play' && !UI.modal.classList.contains('show') && state.currentPlayer === playerBefore && !state.pendingInteractive;
  if (canEnd) {
    endTurnPhase();
  } else if (state.pendingInteractive && state.phase === 'play' && state.currentPlayer === playerBefore) {
    // AI 出互動式牌對 human 目標 → pendingInteractive=true → 等 RESULT（不設超時，等 human 選擇）
    // AI 出互動式牌對 AI 目標 → pendingInteractive=true → 等 RESULT，設超時防止卡死
    if (!state.pendingInteractiveTargetIsHuman) {
      console.log('[RUNAI] pendingInteractive stuck (AI target), forcing clear after delay');
      setTimeout(() => {
        if (state.pendingInteractive && state.currentPlayer === playerBefore && state.phase === 'play') {
          console.log('[RUNAI] pendingInteractive timeout, clearing');
          state.pendingInteractive = false;
          endTurnPhase();
        }
      }, 5000);
    }
  }
}

function isEndgame() {
  return state.players.filter(pl => pl.alive).length <= 2;
}


// ================= 網路通訊 =================

async function createRoom() {
  currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
  isHost = true;
  guestJoined = false;
  const { error } = await sb.from('game_rooms').insert({ room_id: currentRoomId, host_id: 'anon', status: 'waiting' });
  if (error) { alert('房間建立失敗'); return; }
  showLobbyUI(currentRoomId);
  joinChannel(currentRoomId);
  // 自動複製房號到剪貼簿
  try { await navigator.clipboard.writeText(currentRoomId); } catch(e) {}
}

async function joinRoom() {
  const input = document.getElementById('room-input').value.toUpperCase().trim();
  if (!input) { alert('請輸入房號'); return; }
  currentRoomId = input;
  isHost = false;
  guestJoined = true;
  showLobbyUI(currentRoomId);
  joinChannel(currentRoomId);
}

function showLobbyUI(roomId) {
  document.getElementById('lobby-status').textContent = '已連接至房間';
  document.getElementById('room-info-box').style.display = 'flex';
  document.getElementById('current-room-id').textContent = roomId;
  document.getElementById('lobby-controls').style.display = 'none';
  // 只有房主顯示複製房號按鈕（加入者不需要複製）
  const copyBtn = document.querySelector('#room-info-box button');
  if (copyBtn) copyBtn.style.display = isHost ? 'block' : 'none';
  if (isHost) {
    document.getElementById('start-game-btn').style.display = 'block';
    document.getElementById('lobby-status').textContent = '等候玩家加入...';
  } else {
    document.getElementById('start-game-btn').style.display = 'none';
    document.getElementById('lobby-status').textContent = '已就座，等待房主開始';
  }
}

async function copyRoomId() {
  const roomId = document.getElementById('current-room-id').textContent;
  await navigator.clipboard.writeText(roomId);
}

function joinChannel(roomId) {
  const channelName = `room:${roomId}`;
  if (channel) channel.unsubscribe();
  channel = sb.channel(channelName);
  //清空訊息
  document.getElementById('message-log').innerHTML = '';

  channel.on('broadcast', { event: 'player_joined' }, async (payload) => {
    if (isHost && !guestJoined) {
      guestJoined = true;
      document.getElementById('lobby-status').textContent = '玩家已加入！可以開始遊戲';
    }
    if (!isHost) {
      document.getElementById('lobby-status').textContent = '已就座，等待房主開始';
    }
  });

  channel.on('broadcast', { event: 'game_started' }, (payload) => {
    const data = payload.payload || {};
    if (gameStarted) return;
    const lobbyScreen = document.getElementById('lobby-screen');
    if (lobbyScreen) lobbyScreen.style.display = 'none';
    if (data.hostSeatIdx >= 0 && data.hostSeatIdx < 4) assignSeating(data.hostSeatIdx);
  });

  channel.on('broadcast', { event: 'game_full_state' }, (payload) => {
    if (gameStarted) return;
    gameStarted = true;
    const data = payload.payload || {};
    const joinedPlayerId = isHost ? 0 : 1;  // host = index 0, joiner = index 1
    myPlayerId = joinedPlayerId;
    isServer = isHost;  // host is server, joiner is client
    // 使用 host 端確定的座位資訊
    if (data.hostSeatIdx >= 0 && data.hostSeatIdx < 4) {
      assignSeating(data.hostSeatIdx, data.joinerSeatIdx);
    }
    // Each side determines isHuman based on their own myPlayerId
    if (data.players && Array.isArray(data.players)) {
      state.players = data.players.map(p => ({
        id: p.id, name: p.name,
        isHuman: p.id === myPlayerId,
        hand: (p.hand || []).map(c => ({ ...c, icon: c.icon || getCardIcon(c.type) })),
        alive: true, icon: p.icon || getAvatarIcon(p.id), avatarBg: p.avatarBg
      }));
    }
    if (data.deck && Array.isArray(data.deck)) state.deck = data.deck;
    else if (!state.deck || state.deck.length === 0) state.deck = createDeck();
    if (!state.discard) state.discard = [];
    if (data.discard && Array.isArray(data.discard)) state.discard = data.discard;
    state.currentPlayer = (data.currentPlayer >= 0 && data.currentPlayer <= 3) ? data.currentPlayer : (seatMap.find(id => id >= 0 && id <= 3) ?? 0);
    state.direction = data.direction || 1;
    UI.board.classList.add('active');
    // Only host starts the game loop; joiner waits for TURN_CHANGED broadcast
    if (isServer) {
      startTurn();
      log('遊戲已開始！');
    } else {
      // Joiner: render + update turn status based on whose turn it is
      renderAll();
      updateActiveAvatar();
      const p = state.players[state.currentPlayer];
      if (p) {
        if (p.id === myPlayerId) {
          UI.turnStatus.textContent = `你的回合（${p.name}）｜請出牌或摸牌`;
          UI.turnStatus.style.color = '#98b0ee';
        } else {
          UI.turnStatus.textContent = `${p.name} 的回合...`;
          UI.turnStatus.style.color = '#9c8aaa';
        }
      }
      log('遊戲已開始！');
    }
  });

  channel.on('broadcast', { event: 'new_round' }, (payload) => {
    const data = payload.payload || {};
    currentRoomId = data.roomId;
    const lobbyScreen = document.getElementById('lobby-screen');
    if (lobbyScreen) lobbyScreen.style.display = 'flex';
    showLobbyUI(currentRoomId);
    if(isHost) document.getElementById('start-game-btn').style.display = 'block';
  });

  channel.on('broadcast', { event: 'SERVER_TRANSFERRED' }, (payload) => {
    const data = payload.payload || {};
    const newServerId = data.newServerId;
    if (newServerId >= 0) {
      isServer = true;
      myPlayerId = newServerId;
      state.players.forEach(pl => { pl.isHuman = (pl.id === myPlayerId); });
      //log(`伺服器角色已轉移給 ${state.players[newServerId]?.name || '?'}！`);
    }
  });

  channel.on('broadcast', { event: 'player_eliminated' }, (payload) => {
    const data = payload.payload || {};
    const pid = data.playerIndex ?? data.playerId;
    const p = state.players[pid];
    if (!p || !p.alive) return;
    p.alive = false;
    // 直接同步 discard 陣列
    if (data.discard && Array.isArray(data.discard)) {
      state.discard = data.discard;
    } else if (data.discardLength !== undefined) {
      // fallback: 只移除末尾多餘的牌
      while (state.discard.length > data.discardLength) {
        state.discard.pop();
      }
    }
    // 清空被淘汰者手牌
    p.hand = [];
    log(`${p.name} 被淘汰！`);
    renderAll();
  });

  channel.on('broadcast', { event: 'GAME_OVER' }, (payload) => {
    state.gameOver = true;
    const data = payload.payload || {};
    showRematchModal(data.winnerName || '?');
  });

// ================= Rematch 邏輯（全域，供 eliminatePlayer 呼叫）=================
// 流程（在舊頻道達成共識），再加入新頻道
window.showRematchModal = function showRematchModal(winnerName) {
  showModal('遊戲結束', `${winnerName} 獲勝！`, ['再來一局'], () => {
    // 重置所有遊戲狀態
    gameStarted = false;
    state.gameOver = false;
    state.pendingInteractive = false;
    state.pendingInteractiveTargetIsHuman = false;
    state.lastActivePlayerId = -1;
    state.skipDraw = false;
    state.skipDrawFor = -1;
    state.deck = [];
    state.discard = [];
    state.players = [];
    state.currentPlayer = 0;
    state.direction = 1;
    seatMap = [-1, -1, -1, -1];
    myPlayerId = -1;  // 重設，避免舊局 myPlayerId 殘留
    document.getElementById('game-board').classList.remove('active');
    document.querySelectorAll('.avatar').forEach(el => {
      el.classList.remove('active-turn');
      el.classList.remove('eliminated');
      el.classList.remove('dissolve-anim');
    });
    document.getElementById('lobby-screen').style.display = 'flex';
    if (isHost) {
      // 房主發起重開 → 建立新房號，廣播給加入者
      const newRoom = Math.random().toString(36).substring(2, 8).toUpperCase();
      channel.send({ type: 'broadcast', event: 'REMATCH_REQUEST', payload: { roomId: newRoom, fromName: '房主' } }).catch(() => {});
      // 顯示 lobby 等待加入者確認
      currentRoomId = newRoom;
      isServer = true;
      // 知道有加入者，設 true 讓 initGameState → assignSeating 能分配 joiner 座位
      guestJoined = true;
      showLobbyUI(newRoom);
      document.getElementById('lobby-status').textContent = '等待加入者確認...';
    } else {
      // 加入者發起重開 → 廣播要求房主同意
      channel.send({ type: 'broadcast', event: 'REMATCH_REQUEST', payload: { roomId: '', fromName: '加入者' } }).catch(() => {});
      // 顯示 lobby 等待房主確認
      isServer = false;
      showLobbyUI('');
      document.getElementById('lobby-status').textContent = '已發送重開請求，等待房主確認...';
    }
  });
}
