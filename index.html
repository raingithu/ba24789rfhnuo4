<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊樂區</title>
<style>
/* ============================================================
   參數設定區 — 在此設定你的遊戲清單與封面圖片路徑
   增減遊戲只需修改這裡，JS 會自動讀取
   ============================================================ */
:root {
  /* 封面圖片路徑（留空 "" 則使用預設漸層封面）*/
  --cover-ggsnake: "g/covers/00001.jpg";
  --cover-ddbird: "g/covers/00005.jpg";
  --cover-candyp: "g/covers/00002.jpg";
  --cover-pingpong: "g/covers/00004.jpg";
  --cover-tetris: "g/covers/00008.jpg";
  --cover-gomoku: "g/covers/00006.jpg";
  --cover-kongming: "g/covers/00007.jpg";
  --cover-chickgh: "g/covers/00003.jpg";

  /* 遊戲連結路徑 */
  --link-ggsnake: "g/00001.html";
  --link-ddbird: "g/00005.html";
  --link-candyp: "g/00002.html";
  --link-pingpong: "g/00004.html";
  --link-tetris: "g/00008.html";
  --link-gomoku: "g/00006.html";
  --link-kongming: "g/00007.html";
  --link-chickgh: "g/00003.html";

  /* 遊戲名稱 */
  --name-ggsnake: "貪食蛇";
  --name-ddbird: "呆呆鳥";
  --name-candyp: "糖果小精靈";
  --name-pingpong: "乒乓";
  --name-tetris: "俄羅斯方塊";
  --name-gomoku: "星空五子棋";
  --name-kongming: "孔明棋";
  --name-chickgh: "小雞回家";

  /* 遊戲簡介 */
  --desc-ggsnake: "經典貪食蛇，吃食物變長，別撞到牆和自己！";
  --desc-ddbird: "操控呆呆鳥穿越水管障礙，能飛多高？";
  --desc-candyp: "在迷宮中吃掉所有糖果，小心幽靈追擊！";
  --desc-pingpong: "復古乒乓對戰，向更高難度挑戰！";
  --desc-tetris: "益智方塊，消除連線、挑戰極限！";
  --desc-gomoku: "黑白交錯，五子連珠即勝的策略遊戲。";
  --desc-kongming: "跳躍消除益智遊戲，最後只剩一顆棋子！";
  --desc-chickgh: "來幫助小雞穿過障礙，安全回到雞舍！";

  /* 封面 emoji（無圖片時的替代圖示）*/
  --emoji-ggsnake: "🐍";
  --emoji-ddbird: "🐦";
  --emoji-candyp: "👾";
  --emoji-pingpong: "🏓";
  --emoji-tetris: "🧩";
  --emoji-gomoku: "⚫";
  --emoji-kongming: "🔴";
  --emoji-chickgh: "🐥";

  /* 漸層類別 */
  --grad-ggsnake: "cover-ggsnake";
  --grad-ddbird: "cover-ddbird";
  --grad-candyp: "cover-candyp";
  --grad-pingpong: "cover-pingpong";
  --grad-tetris: "cover-tetris";
  --grad-gomoku: "cover-gomoku";
  --grad-kongming: "cover-kongming";
  --grad-chickgh: "cover-chickgh";
}

/* ============================================================
   基礎樣式
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  background: #0d0d0d;
  color: #e0e0e0;
  min-height: 100vh;
}

/* ============================================================
   頁面標題
   ============================================================ */
.page-header {
  text-align: center;
  padding: 48px 20px 32px;
}
.page-header h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  background: linear-gradient(135deg, #444444, #0f9868, #3b9cf6, #dddddd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.05em;
}
.page-header p {
  margin-top: 8px;
  color: #888;
  font-size: 0.95rem;
}

/* ============================================================
   遊戲卡片網格
   ============================================================ */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 64px;
}

/* ============================================================
   單張卡片
   ============================================================ */
.game-card {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #1a1a1a;
  text-decoration: none;
  color: inherit;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.game-card:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

/* 封面區域 */
.card-cover {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
}

/* 預設漸層封面（當沒有設定圖片時顯示） */
.card-cover .default-cover {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
}

/* 自訂圖片封面（當有設定圖片時顯示） */
.card-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none; /* 預設隱藏，有圖片時由 JS 顯示 */
}
.card-cover img.loaded {
  display: block;
}
.card-cover img.loaded + .default-cover {
  display: none;
}

/* 各遊戲預設漸層 */
.cover-ggsnake    { background: linear-gradient(135deg, #064e3b, #10b981, #34d399); }
.cover-ddbird   { background: linear-gradient(135deg, #1e3a5f, #3b82f6, #60a5fa); }
.cover-candyp   { background: linear-gradient(135deg, #4c1d95, #8b5cf6, #a78bfa); }
.cover-pingpong     { background: linear-gradient(135deg, #1c1917, #57534e, #d4d4d4); }
.cover-tetris   { background: linear-gradient(135deg, #7c2d12, #f97316, #fbbf24); }
.cover-gomoku   { background: linear-gradient(135deg, #451a03, #92400e, #d4a574); }
.cover-kongming { background: linear-gradient(135deg, #7f1d1d, #dc2626, #f87171); }
.cover-chickgh    { background: linear-gradient(135deg, #713f12, #eab308, #fde047); }

/* 封面陰影過渡 */
.card-cover::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: linear-gradient(to top, #1a1a1a, transparent);
}

/* 卡片資訊 */
.card-info {
  padding: 16px 20px 20px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card-info h2 {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.card-info .card-desc {
  font-size: 0.85rem;
  color: #888;
  line-height: 1.4;
}
.card-info .play-hint {
  margin-top: 12px;
  font-size: 0.8rem;
  color: #f59e0b;
  font-weight: 600;
  letter-spacing: 0.05em;
}

/* ============================================================
   搜尋列
   ============================================================ */
.search-bar {
  max-width: 400px;
  margin: 0 auto 32px;
  padding: 0 24px;
}
.search-bar input {
  width: 100%;
  padding: 12px 20px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: #e0e0e0;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-bar input::placeholder { color: #555; }
.search-bar input:focus { border-color: #f59e0b; }

/* ============================================================
   頁尾
   ============================================================ */
.page-footer {
  text-align: center;
  padding: 32px 20px;
  color: #555;
  font-size: 0.8rem;
  border-top: 1px solid #222;
}

/* ============================================================
   RWD 響應式
   ============================================================ */
@media (max-width: 600px) {
  .game-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    padding: 0 12px 48px;
  }
  .card-info h2 { font-size: 1rem; }
  .card-info .card-desc { font-size: 0.75rem; }
  .card-cover .default-cover { font-size: 2.5rem; }
  .page-header { padding: 32px 16px 20px; }
}
</style>
</head>
<body>

<header class="page-header">
  <h1>🎮 遊戲機</h1>
  <p>請自己選擇一款遊戲</p>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜尋遊戲名稱…" autocomplete="off">
</div>

<main class="game-grid" id="gameGrid"></main>

<footer class="page-footer">
  <p>持續更新中</p>
</footer>

<script>
// ============================================================
// 動態渲染遊戲卡片（從 CSS :root 變數讀取設定）
// 增減遊戲只需修改上方 :root 的 CSS 變數
// ============================================================
(function renderGames() {
  var grid = document.getElementById('gameGrid');
  var cs = getComputedStyle(document.documentElement);
  var idx = 0;
  var names = ['ggsnake','ddbird','candyp','pingpong','tetris','gomoku','kongming','chickgh'];

  grid.innerHTML = '';

  names.forEach(function(name) {
    var link = cs.getPropertyValue('--link-' + name).trim().replace(/^"|"$/g, '').replace(/^'|'$/g, '');
    var cover = cs.getPropertyValue('--cover-' + name).trim().replace(/^"|"$/g, '').replace(/^'|'$/g, '');
    var gameName = cs.getPropertyValue('--name-' + name).trim().replace(/^"|"$/g, '').replace(/^'|'$/g, '');
    var desc = cs.getPropertyValue('--desc-' + name).trim().replace(/^"|"$/g, '').replace(/^'|'$/g, '');
    var emoji = cs.getPropertyValue('--emoji-' + name).trim().replace(/^"|"$/g, '').replace(/^'|'$/g, '');
    var grad = cs.getPropertyValue('--grad-' + name).trim().replace(/^"|"$/g, '').replace(/^'|'$/g, '');

    if (!gameName) return; // 沒設名稱就跳過

    var card = document.createElement('a');
    card.className = 'game-card';
    card.href = link;
    card.setAttribute('data-name', gameName.toLowerCase());

    var coverDiv = document.createElement('div');
    coverDiv.className = 'card-cover';

    var img = document.createElement('img');
    img.src = cover || '';
    img.alt = gameName + '封面';
    if (cover) {
      img.onload = function() { img.classList.add('loaded'); };
      if (img.src) img.classList.add('loaded');
    }

    var defaultCover = document.createElement('div');
    defaultCover.className = 'default-cover ' + grad;
    defaultCover.textContent = emoji;

    coverDiv.appendChild(img);
    coverDiv.appendChild(defaultCover);

    var info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML =
      '<div>' +
        '<h2>' + gameName + '</h2>' +
        '<p class="card-desc">' + desc + '</p>' +
      '</div>' +
      '<span class="play-hint">▶ 立即遊玩</span>';

    card.appendChild(coverDiv);
    card.appendChild(info);
    grid.appendChild(card);
  });
})();

// ============================================================
// 搜尋功能
// ============================================================
document.getElementById('searchInput').addEventListener('input', function(e) {
  var query = e.target.value.trim().toLowerCase();
  var cards = document.querySelectorAll('.game-card');
  cards.forEach(function(card) {
    var name = card.getAttribute('data-name');
    card.style.display = name.indexOf(query) !== -1 ? '' : 'none';
  });
});
</script>

</body>
</html>
