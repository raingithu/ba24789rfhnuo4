    const today=nowText();
    const context='以下是 '+today+' 於 Open-Meteo 取得的'+label+'天氣預報：\n\n'+body
      +'\n\n（回答規則：1. 直接依上述資料回答該地天氣，不要用搜尋結果或自身知識覆蓋。2. 只涵蓋未來 7 天（當地時區）；問第 8 天以後時直接說尚無預報，不要硬答。3. 現在時間是 '+today+'，【現在】是當地最新實況。）';
    dbg('[OM] 國外天氣完成:',label,'context 長度:',context.length);
    return {context:context,sources:[{title:'Open-Meteo: '+label+'天氣預報',url:'https://open-meteo.com/'}]};
  }catch(e){
    if(e.name==='AbortError')throw e;

// ===== 三之8：台灣國定假日／停班停課直查（不扣 Tavily 額度）=====
// 假日：imsyuan/taiwan-holidays（來源：data.gov.tw 14718 辦公日曆表，月更），經 jsDelivr CDN。
//   完整日曆 data/<YYYY>.json；欄位 {date:YYYYMMDD, week, isHoliday, description, lunar}
// 停班停課：NCDR RSS AlertType=33（來源：data.gov.tw 20457／人事總處即時發布）。
const HOLIDAY_RE=/放假|休假|假日|國定|連假|補班|補假|上班日曆|行事曆|辦公日曆|請假攻略|怎麼請|停班|停課|颱風假|不上班|不上課|holiday|vacation|day off/i;

// 意圖閘門＋日期解析雙重把關：無日期（如「搬家公司推薦」）→ 回 null 走一般搜尋，
// 避免「今天適合慢跑嗎」這類非擇日問題被誤注入（慢跑不在擇日動詞表內）。
const ALMANAC_RE=/宜|忌|沖|煞|胎神|黃曆|黃歷|農民曆|老黃曆|吉時|吉日|好日子|看日子|擇日子|選日子|時辰|宜忌|開運|黃道|嫁娶|入宅|動土|安床|開市|破土|安葬|祭祀|祈福|搬家|結婚|開工|相沖|沖到|農曆|农历/i;

const ALMANAC_PLACE_EXCEPT=/宜蘭|宜兴|宜興|沖繩|沖縄|冲绳/g;

function lunarFestivalSolar(y,lm,ld){
  try{
    for(let i=0;i<366;i++){
      const t=new Date(y,0,1);t.setDate(t.getDate()+i);
      if(t.getFullYear()!==y)break;
      const l=solarToLunar(t);
      if(l&&!l.isLeap&&l.month===lm&&l.day===ld)return new Date(t.getFullYear(),t.getMonth(),t.getDate());

  return null;

// 中文數字 → 阿拉伯數字（農曆月日用）：支援 十五／廿三／三十／初五／正／元／冬／臘
const CN_NUM={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,廿:20,卅:30,正:1,元:1,冬:11,臘:12,腊:12};
function cnNum(s){
  if(s==null)return null;
  s=String(s).trim();
  if(!s)return null;
  if(/^\d+$/.test(s))return +s;
  if(CN_NUM[s]!=null)return CN_NUM[s];
  let m;
  if(m=s.match(/^初(.+)$/)){const v=CN_NUM[m[1]];return v!=null?v:null;}     // 初五＝5
  if(m=s.match(/^廿(.+)$/)){const v=CN_NUM[m[1]];return v!=null?20+v:null;}   // 廿三＝23
  if(m=s.match(/^十(.+)$/)){const v=CN_NUM[m[1]];return v!=null?10+v:null;}   // 十五＝15
  if(m=s.match(/^(.+)十$/)){const v=CN_NUM[m[1]];return v!=null?v*10:null;}   // 二十＝20

// 農曆（年,月,日,閏）→ 陽曆 Date。掃描自前一年 12 月起 450 天，確保涵蓋農曆年頭
// （農曆正月初一落在陽曆 1/21～2/21）。純算術，約數毫秒。
function lunarToSolar(ly,lm,ld,leap){
  try{
    const start=new Date(ly-1,11,1);
    for(let i=0;i<450;i++){
      const t=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      const l=solarToLunar(t);
      if(l&&l.year===ly&&!!l.isLeap===!!leap&&l.month===lm&&l.day===ld)
        return new Date(t.getFullYear(),t.getMonth(),t.getDate());
    }
  }catch(e){}
  return null;
}
// 中文日期解析（回傳 Date／null）：明確日期優先，其次相對日期，最後下週／本週Ｘ
function parseAlmanacDate(q,now){

  const noYear=(m1,m2)=>{const y=today.getFullYear();let t=valid(y,m1,m2);if(!t)return null;if(t<today)t=valid(y+1,m1,m2);return t;};   // 無年：已過→明年（擇日多問未來）

  if(m=q.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))return valid(+m[1],+m[2],+m[3]);
  if(m=q.match(/((?:19|20)\d{2})(\d{2})(\d{2})/))return valid(+m[1],+m[2],+m[3]);   // 20260920
  // 農曆日期（農曆八月十五／農曆8月15／閏六月…）：必須排在下面的「M月D日」之前，
  // 否則「農曆8月15日」會被當成陽曆 8/15 而算錯。
  if(m=q.match(/(?:農曆|农历|陰曆|陰历|舊曆|旧历)\s*(閏|闰)?\s*([0-9一二三四五六七八九十廿卅初正元冬臘腊]{1,3})\s*月\s*([0-9一二三四五六七八九十廿卅初]{1,3})\s*[日號号]?/)){
    const lm=cnNum(m[2]),ld=cnNum(m[3]);
    if(lm!=null&&ld!=null&&lm>=1&&lm<=12&&ld>=1&&ld<=30){
      const ym=q.match(/((?:19|20)\d{2})\s*年/);
      const y=ym?+ym[1]:today.getFullYear();
      let t=lunarToSolar(y,lm,ld,!!m[1]);
      if(!t&&!ym)t=lunarToSolar(y+1,lm,ld,!!m[1]);   // 今年該農曆日已過 → 找明年
      if(t)return t;
    }
  }
  if(m=q.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日?/))return noYear(+m[1],+m[2]);
  if(m=q.match(/(\d{1,2})\/(\d{1,2})/))return noYear(+m[1],+m[2]);
  // 農曆節日（中秋節這類無數字日期）：轉當年農曆 M/D 再掃陽曆對應日；已過→明年，「明年」前綴→+1 年
  const fest={'春節':[1,1],'農曆新年':[1,1],'過年':[1,1],'元宵':[1,15],'元宵節':[1,15],'端午':[5,5],'端午節':[5,5],'七夕':[7,7],'中秋':[8,15],'中秋節':[8,15],'重陽':[9,9],'重陽節':[9,9]};
  for(const k in fest){
    if(q.indexOf(k)<0)continue;
    let y=today.getFullYear();
    const ym=q.match(/((?:19|20)\d{2})\s*年/);
    if(ym)y=+ym[1];else if(q.indexOf('明年')>=0)y++;

  if(m=q.match(/下\s*(?:週|周|星期|禮拜|礼拜)\s*([一二三四五六日天])/)){const t=new Date(today);let d=(wn[m[1]]-t.getDay()+7)%7;if(d===0)d=7;t.setDate(t.getDate()+d);return t;}
  if(m=q.match(/(?:本|這|这)\s*(?:週|周|星期|禮拜|礼拜)\s*([一二三四五六日天])/)){const t=new Date(today);t.setDate(t.getDate()+((wn[m[1]]-t.getDay()+7)%7));return t;}
  return null;
}

// 模型工具 almanac_lookup 的本地執行：參數 date（中文或 YYYY-MM-DD，一次一個日期）；
// 解析失敗回錯誤字串請模型換格式重調，不丟錯（避免整輪工具鏈被單一壞參數拖垮）。
function runAlmanacCall(c){
  let ds='';

  const alm=almanacSummary(dt);
  if(!alm)return '（農民曆查詢失敗：日期超出可計算範圍。請換一個日期重查。）';
  const dstr=dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'+dt.getDate()+'日（星期'+'日一二三四五六'[dt.getDay()]+'）';
  const lunar=lunarDateText(dt);
  return '【'+dstr+(lunar?'，農曆'+lunar:'')+'農民曆】'+alm.replace(/^農民曆：/,'');
}
// ===== 模糊擇日直查（B' 篩選式保底：不依賴模型主動調工具，後端無 tools 照樣有正確資料）=====
// 觸發需同時：模糊時間詞（最近／哪天／未來…）＋擇日動作詞（出遊／搬家…）。只注入未來14天「相關的天」

// 擇日語境詞：出現這些詞＝使用者在問「日子好不好」，不是問天氣／新聞。
// 刻意不收「好嗎／好不好／可以嗎／日子」——太泛（「最近好嗎」「過日子」會誤觸）。
const ALMANAC_INTENT_RE=/適合|好日子|吉日|宜忌|時辰|擇日|選日|看日子|選日子|開運|黃道|哪天好/;
// 「強」時間詞：明確在規劃一段時間。只有強時間詞才允許「動作未收錄 → 注入全量」的降級路徑，
// 避免「最近有什麼適合的餐廳」這種閒聊被當成擇日問題。
const ALMANAC_FUZZY_STRONG_RE=/哪天|哪幾天|哪一天|未來|這週|下週|一週|7天|七天|14天|半個月|一個月|這個月|本月|下個月|這禮拜|接下來|擇日|選日|黃道吉日/i;
// 回傳：null＝不是擇日問題（放行給天氣／一般搜尋）；{terms:[...]}＝有明確動作；
// {terms:[]}＝有擇日語境但動作未收錄 → 注入未來 14 天全量宜忌（不再直接放棄、不再掉進付費搜尋）。
function parseFuzzyAction(rawQ){
  const s=String(rawQ||'');
  if(!ALMANAC_FUZZY_RE.test(s))return null;
  for(const a of ALMANAC_ACTION_MAP){if(a.re.test(s))return {terms:a.terms};}
  // 天氣查詢直接放行：否則「最近天氣適合出門嗎」會被「最近＋適合」攔成農民曆問題
  if(ALMANAC_INTENT_RE.test(s)&&ALMANAC_FUZZY_STRONG_RE.test(s)&&!isWeatherQuery(s))return {terms:[]};
  return null;   // 只有模糊時間詞、無擇日語境（如最近新聞）→ 交回原本流程，禁止塞農民曆
}
// 農民曆意圖總判定（單日直查的閘門）：意圖詞／擇日語境／動作詞任一命中，且不是天氣查詢。
// 補「明確日期＋擇日語境但無意圖詞」的缺口：例如「11月5日適合做什麼」過去過不了
// isAlmanacQuery（無「宜忌沖煞」等詞）→ 掉進付費搜尋。天氣詞優先，避免「11月5日天氣好嗎」被搶走。
function hasAlmanacIntent(q){
  const s=String(q||'');
  if(isWeatherQuery(s))return false;
  return isAlmanacQuery(s)||ALMANAC_INTENT_RE.test(s)||ALMANAC_ACTION_MAP.some(a=>a.re.test(s));
}
function fmtRangeDay(dt){

}
function tryAlmanacRange(query,extra,statusCb){

  if(statusCb)statusCb('<span class="spinner"></span>📅 正在查詢農民曆');
  const today=new Date();today.setHours(0,0,0,0);
  const hits=[],all=[];
  for(let i=0;i<14;i++){
    const dt=new Date(today);dt.setDate(dt.getDate()+i);
    let yi=[],ji=[];
    try{
      const l=Solar.fromYmd(dt.getFullYear(),dt.getMonth()+1,dt.getDate()).getLunar();
      yi=l.getDayYi()||[];ji=l.getDayJi()||[];
    }catch(e){continue;}
    const line=fmtRangeDay(dt);
    if(line)all.push({dt:dt,yi:yi,ji:ji,line:line});

  }
  if(!all.length)return null;

    // 過去這種情況直接回 null → 掉進付費搜尋，是最常見的白扣額度來源。
    body='【未來14天宜忌（使用者問的是「'+String(query||'').slice(0,40)+'」，該動作未在對照表內，請自行比對宜忌挑合適的日子）】\n'+all.map(a=>a.line).join('\n');
  }else if(hits.length)body='【未來14天含「'+terms.join('／')+'」相關宜忌的日子】\n'+hits.join('\n')+'\n（沒列出的日期表示當日宜忌無「'+terms.join('／')+'」相關。）';
  else body='【未來14天沒有宜忌含「'+terms.join('／')+'」的日子】\n'+all.slice(0,7).map(a=>a.line).join('\n')+'\n（供參考：未來7天精簡宜忌如上。）';
  const context='使用者在問模糊擇日問題（'+String(query||'').slice(0,60)+'），以下為離線計算結果：\n\n'+almanacS2T(body)+'\n\n（回答規則：1. 直接依上述資料回答，不要呼叫搜尋、不要編造其他日期。2. 可結合你手上的天氣資料綜合建議（如適合同時宜出行且天氣好）。3. 使用者追問其他動作或日期時，引導他給明確日期，不要自行推算。）';
  return {context:context,sources:[]};
}

const NDS_RE=/停班|停課|颱風假|不上班|不上課|天然災害/i;
function isNdsQuery(q){return NDS_RE.test(q||'')}
const TW_HOLIDAY_CDN='https://cdn.jsdelivr.net/gh/imsyuan/taiwan-holidays/data';
const TW_NDS_RSS='https://alerts.ncdr.nat.gov.tw/RssAtomFeed.ashx?AlertType=33';
const TW_NDS_PAGE='https://www.dgpa.gov.tw/typh/daily/nds.html';

const HOLIDAY_PROXIES=['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url='];
const holidayCache={};   // year -> {at, data}，快取 24h
const ndsCache={at:0,items:null};
async function fetchJsonDirect(url,sig){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(new Error('timeout')),20000);
  const onA=()=>ctl.abort(new Error('aborted'));
  if(sig)sig.addEventListener('abort',onA,{once:true});
  try{
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(timer);if(sig)sig.removeEventListener('abort',onA)}
}
async function fetchTextVia(url,sig,viaProxy){
  const target=viaProxy?viaProxy+encodeURIComponent(url):url;
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(new Error('timeout')),20000);
  const onA=()=>ctl.abort(new Error('aborted'));
  if(sig)sig.addEventListener('abort',onA,{once:true});
  try{
    const r=await fetch(target,{signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }finally{clearTimeout(timer);if(sig)sig.removeEventListener('abort',onA)}
}
// 查詢文字 → 年份清單（民國年轉西元；「明年」以今年推；預設今年）
function holidayYears(q,nowY){
  const ys=new Set();
  const push=y=>{if(y>=2017&&y<=2040)ys.add(y)};
  const qq=String(q||'');
  let m;
  const reM=/(\d{2,4})\s*年/g;
  while((m=reM.exec(qq))){
    const digits=m[1];
    if(digits.length===4){push(+digits);continue}   // 2026年 → 西元年，不加 1911
    const n=+digits;
    if(n>=100&&n<192)push(n+1911);                   // 115年 → 2026（民國年才可能 3 位數，西元年必 4 位數）
  }
  const reY=/(19|20)\d{2}/g;
  while((m=reY.exec(qq)))push(+m[0]);
  if(/明年|下一年/.test(qq))push(nowY+1);
  if(/去年|前一年/.test(qq))push(nowY-1);
  if(!ys.size)push(nowY);
  return [...ys].sort();
}
async function getHolidayYear(y,sig){
  const hit=holidayCache[y];
  if(hit&&Date.now()-hit.at<86400000)return hit.data;
  let lastErr=null;
  try{const d=await fetchJsonDirect(TW_HOLIDAY_CDN+'/'+y+'.json',sig);holidayCache[y]={at:Date.now(),data:d};return d}
  catch(e){lastErr=e}
  for(const p of HOLIDAY_PROXIES){
    try{
      const t=await fetchTextVia(TW_HOLIDAY_CDN+'/'+y+'.json',sig,p);
      const d=JSON.parse(t);holidayCache[y]={at:Date.now(),data:d};return d;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('假日資料取得失敗');
}
function fmtHolidayDay(d){

  const md=dt.length===8?dt.slice(4,6)+'/'+dt.slice(6,8):dt;
  const wk='（週'+(d.week||'')+'）';
  if(d.isHoliday)return md+wk+'休：'+(d.description||'例假日');
  if(d.description)return md+wk+'班：'+d.description+'（補班日）';
  return null;   // 純上班日不列，省 token

    }

      +'5. 使用者問颱風時以【颱風警特報】那一段為準：該段若寫「目前沒有生效中的颱風警特報」，就明確回答目前沒有颱風警報，不要拿降雨或風力資料推測可能有颱風；沒有這一段時，代表本次沒取得颱風資料，不要假裝有。）';

    dbg('[CWA] 天氣完成，範圍:',loc||'全台','context 長度:',context.length);

// B 完整版：連假偵測（連續 isHoliday>=3 天且含國定說明）＋請假橋接日（前後 3 天內都有假的上班日）
function analyzeHolidayData(all){
  const runs=[];let cur=[];
  for(const d of all){
    if(d.isHoliday)cur.push(d);
    else{if(cur.length){runs.push(cur);cur=[]}}
  }
  if(cur.length)runs.push(cur);
  const longRuns=runs.filter(r=>r.length>=3&&r.some(d=>d.description));
  const bridge=[];
  for(let i=0;i<all.length;i++){
    const d=all[i];if(d.isHoliday)continue;
    const hasH=lo=>{for(let k=1;k<=3;k++){const j=i+lo*k;if(j>=0&&j<all.length&&all[j].isHoliday)return true}return false};
    if(hasH(-1)&&hasH(1))bridge.push(d);
  }
  return {longRuns:longRuns,bridge:bridge};
}
function fmtLongRuns(runs){
  return runs.map(r=>{
    const f=String(r[0].date).slice(4,6)+'/'+String(r[0].date).slice(6,8);
    const t=String(r[r.length-1].date).slice(4,6)+'/'+String(r[r.length-1].date).slice(6,8);
    const names=[...new Set(r.map(d=>d.description).filter(Boolean))].join('、');
    return f+'～'+t+' 共'+r.length+'天'+(names?'（'+names+'）':'');
  });
}
// 停班課 RSS 解析：取有效期內（effective<=now<expires+6h）的 entry → [{area,text,effective}]
function parseNdsFeed(xml,nowMs){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('parsererror'))throw new Error('RSS 解析失敗');
  const items=[];
  doc.querySelectorAll('entry').forEach(en=>{
    const ns={s:(en.querySelector('summary')||{}).textContent||''};
    const txt=ns.s;
    const area=(txt.match(/\]([^:\[：]+)\s*[:：]/)||[])[1]||'';
    const effTxt=((en.getElementsByTagNameNS('urn:oasis:names:tc:emergency:cap:1.1','effective')[0]||{}).textContent)
      ||(en.querySelector('updated')||{}).textContent||'';
    const expTxt=((en.getElementsByTagNameNS('urn:oasis:names:tc:emergency:cap:1.1','expires')[0]||{}).textContent)||'';
    const eff=Date.parse(String(effTxt).replace(/\//g,'-'))||0;
    let exp=Date.parse(String(expTxt).replace(/\//g,'-'))||0;
    if(exp)exp+=6*3600000;   // 公告寫「到當日 00:00」：效力涵蓋當天，寬限 6h 避免半夜被濾掉
    if(eff&&nowMs<eff-86400000*2)return;   // 兩天前才生效的預告先不列
    if(exp&&nowMs>exp)return;              // 過期跳過
    if(!/停班|停課|停止上班|停止上課/.test(txt))return;
    items.push({area:String(area||'').trim(),text:txt.trim().replace(/\s+/g,''),effective:String(effTxt||'').trim()});
  });
  return items;
}
async function getNdsItems(sig){
  if(ndsCache.items&&Date.now()-ndsCache.at<10*60000)return ndsCache.items;
  let lastErr=null;
  const tries=[null].concat(HOLIDAY_PROXIES);
  for(const p of tries){
    try{
      const t=await fetchTextVia(TW_NDS_RSS,sig,p);
      const items=parseNdsFeed(t,Date.now());
      ndsCache={at:Date.now(),items:items};
      return items;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('停班課資料取得失敗');
}
// 三之8 主流程：成功回傳 {context,sources}；失敗回傳 null（呼叫端落回 Tavily）；中止原樣丟出
async function tryHolidayDirect(query,statusCb,sig,extra){
  if(!isHolidayQuery(query))return null;
  const rawQ=String(query||'')+' '+String(extra||'');
  const wantNds=isNdsQuery(rawQ);
  const wantHol=!wantNds||/放假|休假|假日|國定|連假|補班|補假|上班日曆|行事曆|請假|holiday|vacation|day off/i.test(rawQ);
  const st=h=>{if(statusCb)statusCb(h)};
  const parts=[],sources=[];
  const nowY=new Date().getFullYear();
  try{
    if(wantHol){
      st('<span class="spinner"></span>📅 正在查詢國定假日（辦公日曆表）');
      const years=holidayYears(rawQ,nowY);
      const all=[];
      for(const y of years){
        const arr=await getHolidayYear(y,sig);
        if(Array.isArray(arr))arr.forEach(d=>all.push(d));
      }
      all.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      let list=all;
      const mQ=rawQ.match(/(0?[1-9]|1[0-2])\s*月/);
      const relQ=/明天|後天|大後天|本週|這週|下週|下個月|這個月/.test(rawQ);
      if(mQ||relQ){
        const now=new Date();
        let yy=now.getFullYear(),mm=now.getMonth()+1;
        if(mQ){mm=+mQ[1];const yInQ=(rawQ.match(/(20\d{2})/)||[])[1];if(yInQ)yy=+yInQ;else if(/明年/.test(rawQ))yy=nowY+1}
        else if(/下個月/.test(rawQ)){mm++;if(mm>12){mm=1;yy++}}
        else if(/下週/.test(rawQ)){const d=new Date(now);d.setDate(d.getDate()+7);yy=d.getFullYear();mm=d.getMonth()+1}
        const key=String(yy)+String(mm).padStart(2,'0');
        const sub=all.filter(d=>String(d.date).startsWith(key));
        if(sub.length)list=sub;
      }
      const lines=list.map(fmtHolidayDay).filter(Boolean);
      let txt='';
      if(lines.length&&lines.length<=60)txt='【國定假日與補班（'+years.join('、')+'，人事總處辦公日曆表）】\n'+lines.join('\n');
      else if(lines.length)txt='【國定假日與補班（'+years.join('、')+'）】\n'+lines.slice(0,60).join('\n')+'\n…（共 '+lines.length+' 筆休假／補班日）';
      else txt='【國定假日與補班（'+years.join('、')+'）】\n此範圍內沒有國定假日（僅例假週末）。';
      if(/連假|請假|攻略|怎麼請|全年|整年|一覽|總覽/.test(rawQ)){
        const az=analyzeHolidayData(all);
        if(az.longRuns.length)txt+='\n\n【連假一覽】\n'+fmtLongRuns(az.longRuns).join('\n');
        if(az.bridge.length){
          const b=az.bridge.slice(0,12).map(d=>{const s=String(d.date);return s.slice(4,6)+'/'+s.slice(6,8)+'（週'+d.week+'）'});
          txt+='\n\n【請假攻略：請 1 天可連休的日子】\n'+b.join('、');
        }
      }
      parts.push(txt);
      sources.push({title:'台灣國定假日（資料來源：人事總處辦公日曆表）',url:'https://www.dgpa.gov.tw/'});
    }
    if(wantNds){
      st('<span class="spinner"></span>🌀 正在查詢停班停課（人事總處即時公告）');
      const items=await getNdsItems(sig);
      if(items.length){
        parts.push('【天然災害停班停課（人事總處即時公告，有效期內）】\n'
          +items.map(it=>'・'+(it.area?it.area+'：':'')+it.text).join('\n')
          +'\n（如與縣市政府最新公告不一致，以縣市政府為準。）');
      }else{
        parts.push('【天然災害停班停課（人事總處即時公告）】\n目前沒有有效期內的停班停課公告（全台正常上班上課）。');
      }
      sources.push({title:'人事總處：天然災害停止上班及上課情形查詢',url:TW_NDS_PAGE});
    }
    if(!parts.length)return null;
    const today=nowText();
    const context='以下是 '+today+' 取得的台灣放假／停班課官方資料：\n\n'+parts.join('\n\n')
      +'\n\n（回答規則：1. 優先根據上述資料回答，不要用搜尋結果或自身知識猜測日期。'
      +'2. 國定假日涵蓋 2017 年以後；問更早年份請明說查無資料。'
      +'3. 停班課只反映有效期內的即時公告：有列出的縣市／區域才停班課，沒列出就是正常上班上課；不要把國定假日與颱風停班課混為一談。'
      +'4. 問特定縣市明天是否上課時，先看停班課段落有無該縣市，再看當天是否國定假日，兩段都沒有才回答正常上班上課。）';
    dbg('[Holiday] 直查完成，段落:',parts.length,'context 長度:',context.length);
    return {context:context,sources:sources};
  }catch(e){
    if(e.name==='AbortError')throw e;

}
// 官方直查路由閘門（單一來源）：天氣／颱風／地震 → 氣象署或 Open-Meteo、放假停班課 → 人事總處、
// 農民曆 → 本地離線計算。這四類都免 Tavily 額度；其餘（新聞／匯率／股價／景點／餐廳…）才走付費搜尋。
// 【重要】sendMessage、requestWebSearch、regenWithSearch、web_search 工具執行器四處都必須呼叫本函式。
// 2026-09-16 的 regression 就是四處各寫一份條件、其中 web_search 工具那份漏了 isWeatherQuery／isQuakeQuery，
// 導致模型主動查天氣時全部落到付費搜尋，還被 6145 當成「免費輪」反覆放行重試（連續 5 次白扣額度）。
function needsDirectLookup(q){return isWeatherQuery(q)||isQuakeQuery(q)||isHolidayQuery(q)||isAlmanacQuery(q)||ALMANAC_FUZZY_RE.test(String(q||''));}
// 統一派發：農民曆 → 放假／停班課 → 天氣 → 模糊擇日 → 地震；其他 → null（走一般搜尋）
// 【重要】每一層都必須「試過才往下」：過去每層都直接 return，只要判定成立但解析失敗（回 null）
// 就整條結束。結果「高雄這週天氣」被農民曆的時間詞（這週）攔下、動作解析失敗回 null 後，
// 就再也到不了氣象署，直接掉進付費搜尋——這正是加了農民曆之後台灣天氣反而變差的原因。
async function tryCwaDirect(query,statusCb,sig,extra){
  query=String(query||'');extra=String(extra||'');
  if(hasAlmanacIntent(query)||hasAlmanacIntent(extra)){
    const a=tryAlmanacDirect(query,extra,statusCb);   // 農民曆單日直查（同步離線計算，不扣額度）
    if(a)return a;
  }
  if(isHolidayQuery(query)||isHolidayQuery(extra)){
    const h=await tryHolidayDirect(query,statusCb,sig,extra);
    if(h)return h;
  }
  if(isWeatherQuery(query)){
    const w=await tryCwaWeather(query,statusCb,sig,extra);   // 台灣→氣象署；國外→Open-Meteo
    if(w)return w;
  }
  if(ALMANAC_FUZZY_RE.test(query)||ALMANAC_FUZZY_RE.test(extra)){
    const r=tryAlmanacRange(query,extra,statusCb);   // 模糊擇日（最近哪天…）→ 未來14天篩選
    if(r)return r;
  }
  if(isQuakeQuery(query)){
    const q=await tryCwaQuake(query,statusCb,sig);
    if(q)return q;
  }
  // 最後保險：確定是農民曆問題但日期與動作都解析不出 → 附今日農民曆並引導使用者給日期，
  // 不要讓它掉進付費搜尋（「農民曆 2026 宜忌」就是這種）。
  const hint=tryAlmanacHint(query,extra);
  if(hint)return hint;
  return null;
}

// ---- Tavily 搜尋（api.tavily.com，JSON）----
async function performTavilySearch(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  dbg('[Search] Tavily 查詢:',query);
  // 時效性偵測（分兩級）：
  // day：明確問「今天／今日」等當日字詞 → 限定最近一天，最精準
  // week：其他時效性字詞（最新、最近、年份等）→ 限定最近一週，兼顧時效與命中率
  // 避免相關性排名把數月前的權威頁面（如氣象署舊快照）排最前面，導致讀到過期資訊
  const day=/現在|剛剛|剛才|即時|今天|今日|今晚|今晨|今早|今(天|日)(的|有|是)|本日/.test(query);
  const week=/最新|最近|目前|近期|本週|這幾天|\d{4}\s*年/.test(query);
  const fresh=day||week;
  const ac=new AbortController();
  if(sig&&sig.aborted)ac.abort();
  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});   // 外部「■ 停止」鈕同步中斷
  const tid=setTimeout(()=>ac.abort(),25000);   // 搜尋整體 25 秒逾時
  const reqBody={query:query,search_depth:'basic',max_results:WEB_SEARCH.maxResults};
  if(day)reqBody.time_range='day';
  else if(week)reqBody.time_range='week';
  const resp=await fetch(SUPABASE_PROXY_BASE+'/tavily/search',{
    method:'POST',
    headers:proxyHeaders(), // Tavily Key 由後端注入
    body:JSON.stringify(reqBody),
    signal:ac.signal
  });
  clearTimeout(tid);
  if(!resp.ok)throw new Error('HTTP '+resp.status);
  const j=await resp.json();
  const results=(j.results||[]).slice(0,WEB_SEARCH.maxResults);
  if(!results.length)throw new Error('沒有搜尋結果');
  return buildSearchContext(query,results,st,sig,fresh);
}

// 關鍵字命中時的完整流程：改寫查詢 → Tavily 搜尋 → Jina Reader 讀全文 → 注入 context 後走正常文字請求
// （改寫為空＝無法判斷要查什麼：直接中止，不呼叫 Tavily 以免浪費搜尋額度）
async function requestWebSearch(query){
  isStreaming=true;updateSendButton();   // 搜尋進行中即視為串流狀態：避免期間使用者再送訊息造成並發請求
  abortCtrl=new AbortController();   // 搜尋期間的「■ 停止」鈕支援
  const statusDiv=makeStatusEl('<span class="spinner"></span>🔍 正在準備搜尋');
  messagesEl.appendChild(statusDiv);
  followIfStuck();   // 搜尋狀態列：僅在自動捲動開啟且貼底時跟上
  let context='';
  try{
    // 步驟 1：查詢改寫——依對話歷史把「那你幫我查一下」補齊成獨立搜尋字串（如「台北天氣」）
    let rewritten=await rewriteSearchQuery(query);
    if(!rewritten){
      // 模型改寫無效：客戶端降級——先剝目前訊息的指令詞；剝完沒主題就往回找前幾則使用者訊息
      const chat=chats[activeChatId];
      rewritten=extractSearchTopic(query);
      if(!rewritten&&chat){
        for(let i=chat.messages.length-2;i>=0;i--){
          const m=chat.messages[i];
          if(m.role!=='user'||m.error)continue;
          rewritten=extractSearchTopic(contentText(m));
          if(rewritten)break;
        }
      }
      if(!rewritten){
        if(statusDiv.isConnected)statusDiv.remove();
        abortCtrl=null;isStreaming=false;updateSendButton();   // 中止：復原串流狀態
        showToast('無法判斷要搜尋的內容，請說明想查什麼','warn');
        return;   // 中止：不呼叫 Tavily，不浪費搜尋額度
      }
      dbg('[Search] 客戶端降級查詢:',rewritten);
    }
    if(rewritten!==query)dbg('[Search] 查詢改寫:',query,'→',rewritten);
    // 一之1：改寫／降級後的查詢若仍是殘缺片段或亂碼 → 中止，不呼叫 Tavily（白扣額度）
    if(!isSaneQuery(rewritten)){
      if(statusDiv.isConnected)statusDiv.remove();
      abortCtrl=null;isStreaming=false;updateSendButton();   // 中止：復原串流狀態
      showToast('無法判斷要搜尋的內容，請說明想查什麼','warn');
      return;
    }
    // 主題分層：當前訊息本身含主題 → 直接搜；依賴上下文的追問（如「那你查一下」）→
    // 先用確認框顯示實際搜尋字串讓使用者把關，避免改寫猜錯主題白扣搜尋額度
    if(!extractSearchTopic(query)){
      const ok=await showConfirm('要幫你搜尋「'+rewritten+'」嗎？');
      if(!ok){abortCtrl=null;isStreaming=false;updateSendButton();return}   // 取消：不呼叫 Tavily，不浪費搜尋額度
    }
    query=rewritten;
    let weather=false,directKind=null;
    // 三之4／三之8：天氣與地震走氣象署 OpenData、放假／停班課走官方直查、農民曆走本地離線計算（都不花 Tavily 額度）；
    // web_search 工具保留，模型遇到資料不足（台灣以外地區、2017 年以前等）時自行呼叫工具補查。無 key／失敗 → 落回一般搜尋。
    if(needsDirectLookup(query)){
      statusDiv.innerHTML=(isAlmanacQuery(query)||ALMANAC_FUZZY_RE.test(query))?'<span class="spinner"></span>📅 正在查詢農民曆':'<span class="spinner"></span>🌤️ 正在查詢中央氣象署';
      const w=await tryCwaDirect(query,h=>{statusDiv.innerHTML=h},abortCtrl.signal);
      if(w){
        setSearchSources(query,w.sources);   // 🔍 徽章與來源面板顯示官方頁面（氣象署／人事總處；農民曆 sources 為空，直接略過）
        context=w.context;
        weather=true;
        directKind=(isAlmanacQuery(query)||ALMANAC_FUZZY_RE.test(query))?'almanac':((context&&isHolidayQuery(query))?'holiday':'cwa');
      }
    }
    if(!weather){
      statusDiv.innerHTML='<span class="spinner"></span>🔍 正在搜尋網路';
      context=await performSearch(query,h=>{statusDiv.innerHTML=h},abortCtrl.signal);
    }
//    showToast('🔍 已搜尋：'+query,'success');   // 可選：讓使用者看到實際搜尋的字串
  }catch(e){
    console.error('[Search] 搜尋失敗:',e);
    if(e.name==='AbortError'||(abortCtrl&&abortCtrl.signal.aborted)){
      showToast('已停止搜尋','warn');
      abortCtrl=null;isStreaming=false;updateSendButton();
      return;
    }
    showToast('網路搜尋失敗（'+e.message+'），改用模型知識回答','warn');
  }finally{
    if(statusDiv.isConnected)statusDiv.remove();
  }
  await requestAI(context?{searchContext:context,_searchQuery:query,_cwa:weather,_directKind:directKind}:{});
}

// 重新生成「有搜尋標記」的回答：沿用原查詢字串重新搜尋後生成（不需改寫與確認）
async function regenWithSearch(q){
  // 一之1：歷史訊息記錄的查詢字串可能是早期版本留下的亂碼／殘缺值，這裡一併擋掉
  if(!isSaneQuery(q)){
    showToast('原查詢字串無法使用，改以模型知識回答','warn');
    await requestAI();
    return;
  }
  isStreaming=true;updateSendButton();
  const statusDiv=makeStatusEl('<span class="spinner"></span>🔍 正在重新搜尋');
  messagesEl.appendChild(statusDiv);
  followIfStuck();
  let context='',weather=false;
  try{
    // 三之4／三之8：同 requestWebSearch——重新生成也先走官方直查（氣象署／假日），失敗落回一般搜尋
    if(needsDirectLookup(q)){
      statusDiv.innerHTML='<span class="spinner"></span>🌤️ 正在查詢中央氣象署';
      const w=await tryCwaDirect(q,h=>{statusDiv.innerHTML=h});
      if(w){setSearchSources(q,w.sources);context=w.context;weather=true}
    }
    if(!weather){
      statusDiv.innerHTML='<span class="spinner"></span>🔍 正在重新搜尋';
      context=await performSearch(q,h=>{statusDiv.innerHTML=h});
    }
  }catch(e){
    showToast('重新搜尋失敗（'+e.message+'），改用模型知識回答','warn');
  }finally{
    if(statusDiv.isConnected)statusDiv.remove();
  }
  // 三之8：把直查種類往下傳，讓系統提示能註明資料來源（假日／停班課 vs 氣象署）
  const directKind=(context&&(isAlmanacQuery(q)||ALMANAC_FUZZY_RE.test(q)))?'almanac':((context&&isHolidayQuery(q))?'holiday':(weather?'cwa':null));
  await requestAI(context?{searchContext:context,_searchQuery:q,_cwa:weather,_directKind:directKind}:{});
}

// 依目前對話送出請求並串流顯示回應
async function requestAI(opts){
  opts=opts||{};
  const chat=chats[activeChatId];
  if(!chat)return;
  const apiKey=getApiKey();
  if(!apiKey){
    showToast('請先設定 API Key<br>（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }
  isStreaming=true;
  updateSendButton();

  const container=messagesEl;
  const statusDiv=makeStatusEl('<span class="spinner"></span>回應中','statusMsg');
  container.appendChild(statusDiv);
  followIfStuck();   // 回應中狀態列：僅在自動捲動開啟且貼底時跟上

  let aiDiv=null;   // 串流中的回應氣泡
  let full='';      // 累積的純文字
  let thinking=opts._prevThinking||'';  // 累積的推理內容（reasoning_content）；工具呼叫（web_search）多輪時帶入前輪思考，避免最終訊息只剩最後一輪的思考（開啟「顯示思考過程」卻在回覆完成後消失的原因）
  let finishReason=null;   // C6：最後一個 chunk 的 finish_reason（length=被截斷）
  let sawToolCalls=false;   // 模型是否輸出過 tool_calls
  let sawDone=false;        // 是否收到 SSE 的 [DONE]（搭配 finish_reason 偵測串流是否被提前切斷）
  let toolAcc=[];           // 串流中累積的 tool_calls 片段（tool calling 模式）
  let useTools=false;       // 本次請求是否附帶 web_search 工具
  let rafId=0;
  const fixStream=makeFixStreamer();   // 二之1：串流中增量修復 Jina 壞連結（取代每幀全文重跑）
  // 剔除開頭空白行（模型有時會先輸出空行），顯示與儲存都經過它
  // （宣告必須在 try 之前：若中止發生在串流開始前，catch 內也取得到 clean，否則會 ReferenceError）
  const clean=s=>s.replace(/^\s+/, '');

  try{
    // 組建上下文：排除錯誤訊息，並依設定限制歷史則數
    let hist=chat.messages.filter(m=>!m.error);
    const limit=getCtxLimit();
    if(limit!=='all'&&hist.length>parseInt(limit,10))hist=hist.slice(-parseInt(limit,10));
    const msgs=await histToMsgs(hist);
    if(opts.searchContext)msgs.unshift({role:'system',content:opts.searchContext});   // 網路搜尋結果：注入在歷史最前（系統提示之下）
    const sys=getSystemPrompt();
    if(sys)msgs.unshift({role:'system',content:sys});
    // 工具呼叫模式：一般請求附上 web_search 工具，由模型自行決定何時搜尋（後端不支援時自動降級）
    // 三之4：氣象署天氣直查的請求（_cwa）也保留工具——台灣以外的天氣／資料不足時由模型 fallback
    // 三之5：續問輪原本一律不附工具（!opts._toolMsgs），但模型拿到不足的資料（例如一週預報沒拿到）
    // 想再查一次時，手上已經沒有工具可用，只能把 tool_call 當純文字吐出來——使用者看到的就是
    // 「回答的內容似乎是它要調工具的內容」然後就斷了。
    // 改為：上一輪若命中氣象署直查（免額度），續問輪保留工具，讓模型真的能再查一次；
    // Tavily（會扣額度）的請求維持原來「只查一次」的行為。
    const allowToolInFollowUp=(opts._cwaRounds||0)>0;
    useTools=(opts._cwa||!opts.searchContext||allowToolInFollowUp)&&(!opts._toolMsgs||allowToolInFollowUp)&&!opts.noTools&&!opts._retryEmpty&&!TOOL_STATE.unsupported&&(opts._toolDepth||0)<WEB_SEARCH.toolMaxRounds+(opts._cwaRounds||0);
    // 提醒訊息：附工具時告知可用 web_search；未搜尋時禁止編造即時資料（避免幻覺）
    // 兩種都附上今天日期：模型對「現在」的認知來自訓練資料，不給日期它會猜錯（如把 9 月查成 7 月）
    const todayNote=(d=>{const alm=almanacSummary(d);return nowText(d,true)+(lunarDateText(d)?('｜農曆 '+lunarDateText(d)):'')+(alm?('｜'+alm):'');})(new Date());   // 三之6：含國曆＋星期＋「現在時刻」＋農曆＋當日農民曆（宜忌沖煞胎神）：日期換算與「今天」農民曆問題不必呼叫搜尋；問其他日期宜忌仍須搜尋
    if(!opts.searchContext&&!opts._toolMsgs){
      // 一之4：關鍵字提示——使用者的訊息含搜尋用語，但由模型自己判斷是否真的需要即時資料
      const kwHint=opts._keywordHint
        ?'（使用者的訊息含有「查／找／搜尋」等用語。若他確實在要即時資訊（天氣、新聞、匯率、股價、賽事、公告等），就呼叫 web_search；若只是一般問題或名詞解釋，直接回答即可，不需要搜尋。）'
        :'';
      const note=useTools
        ?'（提示：現在時間是 '+todayNote+'。你可以呼叫 web_search 工具查詢即時資訊（天氣——含國外城市、匯率、股價、新聞、賽事等）。若使用者的問題需要即時或最新資料而你沒有把握，就呼叫工具；若不需要即時資料則直接回答。呼叫工具時若查詢涉及日期，務必使用上面的今天實際日期，不要憑記憶猜測。若使用者只是要日期換算（如今天是農曆幾號、星期幾），上方今天資訊已有答案，直接回答即可；但只要問到某個日期的農民曆宜忌而上方沒有該日期的資料，就直接呼叫 almanac_lookup（離線計算、零成本、保證正確），不要改叫 web_search，也不要說「查不到」。若問的是「最近哪天／未來一週／這個月」這類需看多天的問題，必須主動呼叫 almanac_lookup 逐日查詢（一次一個日期、可一次調用多個），查完再綜合回答，絕對不要說「沒有資料庫／無法查詢」或叫使用者去別處查。若你沒有呼叫工具，切勿編造即時資料。若使用者只是打招呼或寒暄（如在嗎、你好），自然簡短回應即可，不要主動列舉你的功能。台灣天氣官方預報只有未來7天（今天起算）；若使用者問第8天以後的天氣，不要拿搜尋到的舊資料硬當答案，直接說明該日期尚無官方預報，改給氣候常態＋行前複查建議。你有兩個工具：web_search（即時資訊，天氣含台灣與國外城市）與 almanac_lookup（指定日期農民曆，參數 date 如「9月20日」「農曆八月十五」或 YYYY-MM-DD，一次查一個日期；「最近哪天適合…」請自行展開候選日期逐一查詢再綜合回答，農民曆問題不要上網搜尋）。你確實具備聯網搜尋與農民曆查詢能力，絕對不要自稱「沒有聯網／查不到」。不要輸出其他 tool_calls。）'+kwHint
        :'（注意：現在時間是 '+todayNote+'。本次對話沒有進行網路搜尋，你沒有任何即時資料來源。切勿編造即時資訊（天氣、匯率、股價、新聞、比分等）或模仿搜尋結果的格式輸出假資料；若使用者詢問此類資訊，請明確說明你無法取得即時資料，並建議使用者輸入「查一下」等關鍵字要求你搜尋網路（日期換算與農民曆宜忌除外——上方的今天資訊或直查資料已有答案，可直接回答；仍無資料時再引導使用者輸入「查一下＋日期」要求搜尋）。另外：你不具備任何工具或函式，絕對不要輸出 tool_calls／函式呼叫，一律只用純文字回答；也絕對不要假裝「馬上幫你查」——做不到就直說並引導關鍵字，不要開空頭支票。）';
      if(sys)msgs[0].content+='\n'+note;
      else msgs.unshift({role:'system',content:note});
      // 快速回覆的第二道保險（模型關不掉思考時用）：系統提示直接要求省略思考、輸出答案。
      // 這是純文字指示，任何模型都吃得到；含搜尋／工具續問的請求需要推理讀長 context，不加這句。
      // 尊重「顯示思考過程」開關：使用者想看思考時不加這句，否則快速回覆會把顯示開關架空（思考永遠生不出來）。
      // 注意：這句只影響「新發送」的請求；是否顯示舊訊息的思考只看開關＋訊息有沒有存 thinking。
      if(getQuickReply()&&!opts._noQuick&&!getShowThinking())msgs[0].content+='\n（快速回覆模式：請省略思考過程，直接輸出最終答案。）';
    }else if(opts._cwa&&!opts._toolMsgs){
      // 三之4／三之8：官方直查資料已注入——台灣天氣／假日／停班課直接用；資料不足才呼叫 web_search
      const isHol=opts._directKind==='holiday';
      const isAlm=opts._directKind==='almanac';
      let cwaNote='';
      if(isAlm)cwaNote='（提示：現在時間是 '+todayNote+'。上方已附本地農民曆離線計算結果（明確單日，或「最近／未來」多天篩選，或使用者未給日期時的今日宜忌）。請直接依該資料回答，不要呼叫 web_search，不要編造資料沒有的日期，也不要用搜尋結果覆蓋它；若使用者問的是其他日期而上方的資料沒涵蓋，請明確請他給出日期（例如「10月5日」或「農曆八月十五」）；可結合對話中已有的天氣資料綜合建議。）';
      else if(isHol)cwaNote='（提示：現在時間是 '+todayNote+'。上方已附台灣放假／停班課官方資料（國定假日與補班＝人事總處辦公日曆表，2017 年以後；停班課＝人事總處即時公告，只含有效期內的）。使用者問放假、停班、停課時，請直接依該資料回答並附上來源連結。若資料不足——例如使用者問的是 2017 年以前的假日、台灣以外地區、或公告有效期外的停班課——再呼叫 web_search 工具補查；資料足夠時不要呼叫工具。沒有呼叫工具時切勿編造資料。）';
      else cwaNote='（提示：現在時間是 '+todayNote+'。上方已附中央氣象署（官方網址 www.cwa.gov.tw）的台灣天氣預報（今明 36 小時＋一週）。使用者問天氣時，請直接依該資料回答並附上來源連結，日期與時段以資料中的 startTime 為準。若上方是 Open-Meteo 的國外預報，直接依該資料回答即可；台灣資料不足（需要特定鄉鎮的細節、即時觀測或過去天氣）時才呼叫 web_search 工具補查；資料足夠時不要呼叫工具。沒有呼叫工具時切勿編造資料。）';
      if(sys)msgs[0].content+='\n'+cwaNote;
      else msgs.unshift({role:'system',content:cwaNote});
    }else if(opts._toolMsgs){
      // 工具呼叫續問輪次：明確告知模型剛收到的 tool 訊息就是「搜尋結果」，請直接根據它回答（不要當成對話歷史忽略）
      // 三之5：本輪「還有沒有工具」要分開講。過去不分情況一律寫「不要再輸出 tool_calls」，
      // 但續問輪其實還附著工具，模型想補查時被這句話卡死，就有可能把 tool_call 當純文字吐出來。
      const toolNote=useTools
        ?'（提示：現在時間是 '+todayNote+'。你剛剛呼叫了工具，結果已透過 tool 訊息回傳給你（web_search＝搜尋結果，almanac_lookup＝該日期農民曆，請直接讀取「role: tool」的訊息內容）。請優先根據結果回答。若結果明顯不足以回答使用者的問題——例如缺少他問的那一天或那個地區的資料，或工具訊息明確寫著「取得失敗，請再呼叫一次 web_search 重試」——你可以再呼叫一次 web_search 補查（換個更具體的查詢字串，例如補上縣市名）；資料已經夠用就不要重複搜尋。切勿在沒有呼叫工具的情況下編造即時資料。）'
        :'（提示：現在時間是 '+todayNote+'。你剛剛呼叫了 web_search 工具，搜尋結果已透過 tool 訊息回傳給你（請直接讀取「role: tool」的訊息內容）。請根據搜尋結果回答使用者的問題——即使問題涉及即時資訊（天氣、匯率、股價、新聞等）也沒問題，你已有資料。若結果不充分，就依現有資料與你的知識回答並說明限制；不要以為你「沒有即時資料」而回罐頭拒絕回答。注意：這一輪已達搜尋次數上限，沒有工具可用，絕對不要再輸出 tool_calls 或假造函式呼叫，一律只用純文字回覆。）';
      if(sys)msgs[0].content+='\n'+toolNote;
      else msgs.unshift({role:'system',content:toolNote});
    }
    // 工具呼叫輪次：附加 ephemeral 的 assistant tool_calls 與 tool 搜尋結果（不存進聊天歷史）
    if(opts._toolMsgs)msgs.push(...opts._toolMsgs);
    // C6：續寫模式——補一則不存進歷史的指示訊息
    if(opts.continueHint)msgs.push({role:'user',content:opts.continueHint});
    dbg('[Chat] 發送請求至:', getEndpoint()+'/chat/completions');
    dbg('[Chat] 模型:', getModel());

    abortCtrl=new AbortController();
    const sig=opts._sig||abortCtrl.signal;   // 工具呼叫多輪共用同一個中止信號：按「■ 停止」可中斷整條鏈
    const resp=await fetchWithRetry(`${getEndpoint()}/chat/completions`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
      body:JSON.stringify(Object.assign({
        model:getModel(),messages:msgs,stream:true,
        max_tokens:(opts.searchContext||opts._toolMsgs)?Math.max(getMaxTokens(),16384):getMaxTokens(),temperature:getTemperature()   // 含搜尋結果／網頁內容的請求：context 長且思考型模型的推理會吃 max_tokens，保底 16384 確保正文有輸出空間（避免「讀完網頁後回覆中斷」）
      },useTools?{tools:[WEB_SEARCH_TOOL,ALMANAC_TOOL]}:{},
        // 快速回覆：嘗試關閉思考以加快回覆（各家參數一次帶上，後端只讀認識的）。
        // 含搜尋結果／網頁內容的請求不套用——這類請求本來就要產出完整長文，且需要推理讀懂長 context。
        // 降級重試（_noQuick）也不帶——後端已證明不吃這套參數。
        (!opts.searchContext&&!opts._toolMsgs&&!opts._noQuick)?quickReplyParams():{})),
      signal:sig
    },{
      timeoutMs:TIMEOUT.http,   // 只限「連線建立」（回應表頭前）；串流本身不限時
      maxAttempts:Math.max(4,keyPoolSize()*2+2),   // Key 池越大給越多嘗試空間（429/401/403 換 Key 重試也計入次數）
      getKey:()=>pickApiKey(),   // 多 Key 輪替：主 Key 限流／失效時自動換備用 Key
      onStatus:h=>{if(statusDiv.isConnected)statusDiv.innerHTML=h},
      onWait:()=>{if(statusDiv.isConnected)statusDiv.innerHTML='<span class="spinner"></span>回應中'},
      isAborted:()=>sig.aborted
    });

    dbg('[Chat] 回應狀態:', resp.status, resp.statusText);

    // 移除狀態提示，改用訊息氣泡
    // 工具呼叫續問輪次：沿用前輪傳來的 aiDiv（不重建），避免「第一輪氣泡被吃掉」的視覺中斷感
    if(!opts._aiDivEl){
      statusDiv.remove();
      aiDiv=document.createElement('div');
      aiDiv.className='msg assistant';
      container.appendChild(aiDiv);
      followIfStuck(); // statusDiv 移除後建立 aiDiv：僅在自動捲動開啟且貼底時跟上
    }else{
      // 續問輪次：沿用前輪的 aiDiv（規劃文字會被第二輪正文覆寫）
      aiDiv=opts._aiDivEl;
      if(statusDiv.isConnected)statusDiv.remove();
      followIfStuck();
    }

    // 以 requestAnimationFrame 節流重繪，避免每個片段都整段重建 HTML。
    // P4：原本是「每幀」對整段累積文字重跑 renderContent（marked＋DOMPurify）＋KaTeX，長回覆是 O(n²)，
    // 後半段會明顯掉幀。這裡再加兩道節流：
    //   STREAM_PAINT_MS → 畫面更新間隔（不到時間就排下一幀再試，不會把最後幾個字吃掉）
    //   STREAM_MATH_MS  → KaTeX 更貴，間隔再拉長（收尾時最終列會走完整渲染，不會留下未排版的 $..$）
    const STREAM_PAINT_MS=CONFIG.stream.paintMs;
    const STREAM_MATH_MS=CONFIG.stream.mathMs;
    let lastPaint=0,lastMath=0;
    const show=()=>{
      if(rafId)return;
      rafId=requestAnimationFrame(()=>{
        rafId=0;
        const now=Date.now();
        if(now-lastPaint<STREAM_PAINT_MS){show();return}   // 還沒到節流時間：下一幀再來
        lastPaint=now;
        // 二之1：fixStream 只修復新追加的片段，並以 alreadyFixed 讓 renderContent 不再重跑一次全文修復
        aiDiv.innerHTML=renderContent({content:clean(fixStream(full)),thinking:thinking||null,thinkingOpen:true},true);
        enhanceCodeBlocks(aiDiv);
        if(now-lastMath>=STREAM_MATH_MS){lastMath=now;renderMath(aiDiv)}
        if(shouldAutoScroll())scrollToBottom(false);   // 串流中：自動滾動開啟且使用者仍貼底時持續跟上（雙 RAF 避免圖片/數學尚未 layout 造成中間地帶）
      });
    };
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer=''; // SSE 行緩衝
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      // 逐行切割 SSE
      let nl;
      while((nl=buffer.indexOf('\n'))>=0){
        const line=buffer.slice(0,nl).trim();
        buffer=buffer.slice(nl+1);
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]'){sawDone=true;continue;}
        try{
          const j=JSON.parse(data);
          const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(delta.content)full+=delta.content;
          if(delta.reasoning_content)thinking+=delta.reasoning_content;
          if(delta.tool_calls){sawToolCalls=true;delta.tool_calls.forEach(tc=>{const i=tc.index||0;toolAcc[i]=toolAcc[i]||{id:'',name:'',args:''};if(tc.id)toolAcc[i].id=tc.id;if(tc.function){if(tc.function.name)toolAcc[i].name=tc.function.name;if(tc.function.arguments)toolAcc[i].args+=tc.function.arguments;}});}   // 累積 tool_calls 片段（tool calling 模式）
          if(j.choices&&j.choices[0]&&j.choices[0].finish_reason)finishReason=j.choices[0].finish_reason;
        }catch(e){/* 忽略無法解析的續傳片段 */}
      }
      show();
    }
    // 處理緩衝區殘留最後一行
    if(buffer.trim().startsWith('data:')){
      const data=buffer.trim().slice(5).trim();
      if(data!=='[DONE]'){
        try{
          const j=JSON.parse(data);
          const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(delta.content)full+=delta.content;
          if(delta.reasoning_content)thinking+=delta.reasoning_content;
          if(delta.tool_calls){sawToolCalls=true;delta.tool_calls.forEach(tc=>{const i=tc.index||0;toolAcc[i]=toolAcc[i]||{id:'',name:'',args:''};if(tc.id)toolAcc[i].id=tc.id;if(tc.function){if(tc.function.name)toolAcc[i].name=tc.function.name;if(tc.function.arguments)toolAcc[i].args+=tc.function.arguments;}});}
          if(j.choices&&j.choices[0]&&j.choices[0].finish_reason)finishReason=j.choices[0].finish_reason;
        }catch(e){}
      }
    }
    // 修復模型輸出中照抄 Jina 的壞連結格式（[文字]$網址$ → [文字](網址)、$網址$ → 網址）
    full=fixJinaLinks(full);
    // 串流提前中斷偵測：連線在正常結束前被切斷（沒有 finish_reason 也沒有 [DONE]）。
    // 讀網頁／搜尋後 context 很長，串流較容易被中間層切斷；過去會把半成品默默當完整回覆存檔
    // （看起來就是「回覆莫名中斷」）。現在標記 truncated 讓訊息下方出現「⤵️ 繼續生成」，完成時再跳出提示。
    // 一之3：只在「後端會送結束訊號」的前提下才判定中斷（後端從不送時自動停止判定，避免每則都誤標）
    noteStreamSignal(sawDone||!!finishReason);
    const streamDropped=!STREAM_DROP.disabled&&!sawDone&&!finishReason&&!!clean(full);
    if(streamDropped)dbg('[Chat] 偵測到串流提前中斷（無 finish_reason／[DONE]），已收長度=',full.length);
    // 進階 tool calling：模型要求搜尋 → 執行 Tavily+Jina，把結果以 tool 訊息帶回再續問（最多 WEB_SEARCH.toolMaxRounds 輪）
    const toolCallsReq=toolAcc.filter(Boolean);
    const searchCall=toolCallsReq.find(c=>c.name==='web_search');
    const almCalls=toolCallsReq.filter(c=>c&&c.name==='almanac_lookup');   // 農民曆本地工具：同步執行，不佔搜尋輪次
    // 三之5：輪次上限。一般查詢維持 WEB_SEARCH.toolMaxRounds（Tavily 每次都扣額度）；
    // 本次請求若已命中過氣象署直查（免額度），續問輪多給一輪，讓模型能補查（例如一週預報沒拿到時）。
    const toolDepth=opts._toolDepth||0;
    const freeRound=(opts._cwaRounds||0)>0;   // 本次請求已用過氣象署直查＝免費來源
    const maxToolRounds=WEB_SEARCH.toolMaxRounds+(freeRound?1:0);
    // 一之2：與 useTools 的條件統一為「< toolMaxRounds」——原本 +1 讓搜尋次數比設定多一次（off-by-one）
    if((searchCall&&toolDepth<maxToolRounds)||almCalls.length){
      let q='';
      try{const a=JSON.parse((searchCall&&searchCall.args)||'{}');q=String(a.query||a.q||'')}catch(e){}
      if(!q&&searchCall)q=String(searchCall.args||'').replace(/[{}\[\]"\\]/g,'').trim();   // 後端 args 非正規 JSON 時的保底
      // 一之1：參數殘缺／亂碼 → 不搜尋，直接略過工具輪（避免白扣額度）。
      // 後續若模型只輸出 tool_calls 沒輸出正文，會由空回應防護自動重試一次（該次不附工具，模型改以知識回答）。
      if(q&&!isSaneQuery(q)){
        dbg('[Chat] 工具呼叫查詢字串異常，略過搜尋:',String(q).slice(0,80));
        q='';
      }
      // 三之5：多出來的那一輪只放行免費查詢（氣象署／假日直查），避免模型拿加開的輪數去燒 Tavily 額度
      if(q&&toolDepth>=WEB_SEARCH.toolMaxRounds&&!needsDirectLookup(q)){
        dbg('[Chat] 加開的續問輪僅開放免費來源（氣象署），略過付費搜尋:',String(q).slice(0,80));
        q='';
      }
      if(q){
        if(sig.aborted)throw Object.assign(new Error('aborted'),{name:'AbortError'});   // 停止鈕：中斷整條工具鏈
        dbg('[Chat] 工具呼叫 web_search:',q);
        const tStat=makeStatusEl('<span class="spinner"></span>🔍 正在搜尋網路');
        container.appendChild(tStat);
        followIfStuck();
        let toolResult='';
        let cwaHit=null;
        let cwaUsed=false;   // 三之5：本輪是否命中氣象署直查（免額度）→ 決定續問輪要不要保留工具
        // 三之4：最後一則使用者訊息——模型改寫的 query 偶爾漏掉縣市名，用原訊息補
        const lastUserMsg=(()=>{for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];if(m&&m.role==='user'&&typeof m.content==='string')return m.content}return ''})();
        try{
          // 三之4／三之8：天氣／地震走氣象署 OpenData、放假／停班課走官方直查（都不扣 Tavily 額度）；查不到再走一般搜尋
          // 【本次修復】原本這行只判斷假日／農民曆，漏了 isWeatherQuery／isQuakeQuery：
          // 模型主動呼叫 web_search 查天氣時不會走氣象署／Open-Meteo，直接落到付費搜尋；
          // 又因 6145 仍把天氣視為「免費輪」而反覆放行，造成連續重試燒額度。改用單一路由閘門。
          if(needsDirectLookup(q)||needsDirectLookup(lastUserMsg))cwaHit=await tryCwaDirect(q,h=>{tStat.innerHTML=h},sig,lastUserMsg);
          if(cwaHit){
            toolResult=cwaHit.context;
            cwaUsed=true;
            setSearchSources(q,cwaHit.sources);   // 🔍 來源徽章顯示氣象署頁面
          }else{
            toolResult=await performSearch(q,h=>{tStat.innerHTML=h},sig);
          }
//          showToast('🔍 已搜尋：'+q,'success');
        }catch(e2){
          if(e2.name==='AbortError')throw e2;
          console.error('[Chat] 工具搜尋失敗:',e2);
          showToast('網路搜尋失敗（'+e2.message+'），改用模型知識回答','warn');
          toolResult='（搜尋失敗：'+e2.message+'。請依你自己的知識回答，並明確說明無法取得即時資料。）';
        }finally{
          if(tStat.isConnected)tStat.remove();
        }
        if(sig.aborted)throw Object.assign(new Error('aborted'),{name:'AbortError'});   // 停止鈕：搜尋完成後若已中止，不進入下一輪
        if(rafId){cancelAnimationFrame(rafId);rafId=0}
        // 跨輪思考加分隔：下一輪的推理會直接接在本輪思考後面，補一行標記避免內容黏在一起難以閱讀
        if(thinking&&thinking.length>(opts._prevThinking||'').length)thinking+='\n\n〔以下為依搜尋結果回答時的思考〕\n\n';
        // 不移除 aiDiv：把前輪的 DOM 元素透過 _aiDivEl 傳給下一輪，避免「第一輪氣泡被吃掉」的視覺中斷感
        const aiDivEl=aiDiv;   // 閉包抓住元素參考
        toolCallsReq.forEach((c,i)=>{if(!c.id)c.id='call_'+Date.now()+'_'+i;});   // 補齊 id 以符合 API 規範
        if(almCalls.length)cwaUsed=true;   // 農民曆本地計算＝免費來源 → 續問輪保留工具（同 cwaHit）
        const toolMsgs=(opts._toolMsgs||[]).concat([
          {role:'assistant',content:clean(full)||null,tool_calls:toolCallsReq.map(c=>({id:c.id,type:'function',function:{name:c.name||'web_search',arguments:c.args||'{}'}}))},
          ...((searchCall&&toolDepth<maxToolRounds)?[{role:'tool',tool_call_id:searchCall.id,content:toolResult}]:[]),
          ...almCalls.map(c=>({role:'tool',tool_call_id:c.id,content:runAlmanacCall(c)}))
        ]);
        toolCallsReq.forEach((c,i)=>{if(c!==searchCall&&c.name!=='almanac_lookup')toolMsgs.push({role:'tool',tool_call_id:c.id,content:'（本次僅處理第一個搜尋，此呼叫略過。）'});});
        return await requestAI(Object.assign({},opts,{_toolMsgs:toolMsgs,_toolDepth:toolDepth+1,_cwaRounds:(cwaUsed||freeRound)?1:0,_searchQuery:q,_sig:sig,_aiDivEl:aiDivEl,_prevThinking:thinking||''}));   // await：外層 finally 等內層完成後才收尾；_searchQuery 供最終訊息標記；_sig 讓整條鏈共用中止信號；_aiDivEl 跨輪傳遞同一個氣泡 DOM；_prevThinking 跨輪保留思考過程；_cwaRounds 傳遞「已用過免費來源」供續問輪保留工具
      }
    }
    // 空回應防護：只有思考沒有正文時，先自動重試一次（模型誤輸出 tool_calls 的情況重試通常會正常），仍失敗才顯示提示
    if(!clean(full)){
      dbg('[Chat] 空回應：finish_reason=',finishReason,'tool_calls=',sawToolCalls,'thinking 長度=',thinking.length);
      if(sawToolCalls&&!opts._retryEmpty){
        dbg('[Chat] 模型誤輸出 tool_calls，自動重試一次');
        if(statusDiv.isConnected)statusDiv.remove();
        if(aiDiv)aiDiv.remove();
        return await requestAI(Object.assign({},opts,{_retryEmpty:true,_sig:sig,_prevThinking:thinking||''}));   // await：外層 finally 會等內層完成；_prevThinking 保留思考
      }
      if(sawToolCalls)full='（⚠️ 模型沒有輸出文字，而是嘗試呼叫它沒有的工具（重試仍失敗）。請按 ⋮ 重新生成再試一次。）';
      else if(finishReason==='length')full='（⚠️ 思考過程就佔滿了最大回覆長度，正文還沒開始就被截斷。請到 ⚙ 設定調高「最大回覆長度」，再按 ⋮ 重新生成。）';
      else if(streamDropped)full='（⚠️ 連線提前中斷，未收到任何內容。請按 ⋮ 重新生成再試一次。）';
      else full='（⚠️ 模型未回傳任何內容，請按 ⋮ 重新生成。）';
    }
    // 完成後以完整訊息列重建 DOM（含 ⋮ 選單），並尊重使用者的捲動位置
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    const finalMsg={role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now(),truncated:finishReason==='length'||streamDropped};   // C3：時間戳；C6：length 截斷標記；串流被提前切斷也視同截斷（出現「⤵️ 繼續生成」）
    if(opts._searchQuery){
      finalMsg.searchQuery=opts._searchQuery;   // 🔍 搜尋標記：記錄實際查詢字串（氣泡顯示徽章、重新生成時重用）
      const src=SEARCH_SOURCES.get(opts._searchQuery);   // 三之1：附上本次搜尋的來源清單（顯示於來源面板）
      if(src&&src.length)finalMsg.sources=src;
    }
    chat.messages.push(finalMsg);
    touchChat(chat);   // 新回應完成：更新最後活動時間
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    saveChatsDataNow();   // B2：串流結束立即寫入
    aiDiv.remove();
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加完成的訊息列，不重建（尊重使用者捲動位置）
    renderChatList();   // 依最後活動時間重新排序與分組（該對話移到頂端）
    if(chat.messages.length===2&&(chat.titleFromMsg||!chat.title||chat.title==='新對話'))autoTitle(chat);   // 標題自動生成：第一輪對話結束後（覆蓋暫用標題）
    // 三之5：串流提前中斷 → 自動續寫一次，避免使用者看到中斷的回覆無下文
    if(streamDropped){
      if(opts.continueHint){
        // 自動續寫本身又中斷：不再無限觸發，提示使用者手動按 ⤵️
        showToast('連線再次中斷，請手動按訊息下方的[繼續生成]','warn');
      }else{
        showToast('連線提前中斷，正在自動要求續寫','warn');
        // 等本輪 finally 收尾（isStreaming 設回 false）後再發起續寫，避免並發請求
        setTimeout(()=>{ if(activeChatId===chat.id&&!isStreaming) requestAI({continueHint:'從上次中斷處繼續，直接接續輸出剩餘內容，不要重複已輸出的部分。'}); },500);
      }
    }
    if(getAutoScroll()){
      stickBottom=true;
      scrollToLatestStart(false,true);   // 自動滾動開啟：短回覆捲到底、長回覆停在最後一則開頭從頭讀（強制執行，stickBottom 剛設 true 不再被擋；雙 RAF 等 layout 避免「中間地帶」；之後圖片載入由 load 監聽跟上）
    }else{
      showToast('有新訊息','success');   // 自動滾動關閉：AI 回應完成時提醒，畫面一律不動
    }
    updateScrollBtn();
    dbg('[Chat] 完成，長度:', full.length);
  }catch(e){
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    // 後端不支援 tools（400/422 等）：關閉工具模式並原樣重試一次（之後整個工作階段不再附帶）
    if(useTools&&!opts._toolsRetry&&e.name!=='AbortError'&&isToolsUnsupportedError(e.message)){
      TOOL_STATE.unsupported=true;
      console.warn('[Chat] 後端不支援 tools，此工作階段改用無工具模式：',e.message);
      if(statusDiv.isConnected)statusDiv.remove();
      if(aiDiv)aiDiv.remove();
      return await requestAI(Object.assign({},opts,{_toolsRetry:true,_sig:sig,_prevThinking:thinking||''}));
    }
    // 後端不吃關思考參數（嚴格校驗回 400）：拿掉全部快速回覆參數，原樣重試一次
    //（系統提示裡的「省略思考」要求不受影響，仍可加速；之後本輪不再重試，避免迴圈）
    if(!opts._noQuick&&getQuickReply()&&e.name!=='AbortError'&&isQuickReplyUnsupportedError(e.message)){
      console.warn('[Chat] 後端不支援關思考參數，降級為一般請求重試：',e.message);
      if(statusDiv.isConnected)statusDiv.remove();
      if(aiDiv)aiDiv.remove();
      return await requestAI(Object.assign({},opts,{_noQuick:true,_sig:sig,_prevThinking:thinking||''}));
    }
    if(e.name==='AbortError'){
      // 使用者主動停止：保留已產生的部分內容
      if(aiDiv)aiDiv.remove();
      if(statusDiv.isConnected)statusDiv.remove();
      if(clean(full)){
        chat.messages.push({role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now()});   // C3：時間戳
        touchChat(chat);
        saveChatsData(chats,chat.id);   // A1：只寫入這場對話
        saveChatsDataNow();   // B2：立即寫入
        appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加保留的部分回應，不重建
        renderChatList();
        if(shouldAutoScroll())scrollToBottom(false);   // 自動捲動開啟且使用者仍貼底才捲到底（使用者已往上捲就不拉回，只提示）
        showToast('已停止生成，已保留部分回應','warn');
      }else{
        showToast('已停止生成','warn');
      }
      return;
    }
    console.error('[Chat] 錯誤:', e);
    if(statusDiv.isConnected){
      statusDiv.innerHTML=`<span style="color:var(--accent)">✕ 錯誤：${escHtml(e.message)}</span>`;
      statusDiv.classList.remove('typing');
      setTimeout(()=>{if(statusDiv.isConnected)statusDiv.remove()},6000);
    }else{
      showToast('錯誤：'+e.message,'warn');
    }
    // B2：串流中若已有部分內容，先保留，並把錯誤原因**併進同一則**（訊息下方顯示紅字註記）。
    // 原本會再多 push 一則 [錯誤] 氣泡，畫面同時出現「半成品」與「錯誤」兩則，冗餘；
    // 合併後使用者一樣看得到「為什麼停下來」，只是不再多一則。（完全沒內容時仍維持單獨的 [錯誤] 氣泡）
    const partial=(aiDiv&&clean(full))?clean(full):'';
    if(aiDiv)aiDiv.remove();
    if(partial){
      chat.messages.push({role:'assistant',content:partial,thinking:thinking||null,createdAt:Date.now(),errorNote:'回應未完成：'+e.message});   // C3：時間戳
    }else{
      // 錯誤訊息標記為 error：會顯示，但不會送回 API 上下文
      chat.messages.push({role:'assistant',content:`[錯誤] ${e.message}`,error:true});
    }
    touchChat(chat);
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加新增的那一列，不重建（畫面不跑動）
    renderChatList();
  }finally{
    isStreaming=false;
    abortCtrl=null;
    updateSendButton();
    saveChatsDataNow();    // B2：串流結束沖掉待寫存的變更
    flushQueuedMessage();    // D8：送出排隊訊息
  }
}

// 標題自動生成：第一輪對話結束後，用小型（非串流）請求為「新對話」取標題
async function autoTitle(chat){
  const fu=chat.messages.find(m=>m.role==='user');
  // fallback：任何失敗（網路錯誤／非 200／空標題）都改用首則使用者訊息前 18 字，避免標題停留在暫用值
  const applyFallback=()=>{
    if(!chat.titleFromMsg)return;   // 使用者期間已手動改名：尊重，不覆蓋
    const t=(contentText(fu||{}).replace(/\s+/g,' ').trim().slice(0,18))||'新對話';
    chat.title=t;
    delete chat.titleFromMsg;   // 已生成正式標題，之後不再觸發
    saveChatsData(chats,chat.id);
    renderChatList();
    dbg('[Chat] 標題自動生成（fallback）:',t);
  };
  try{
    const fa=chat.messages.find(m=>m.role==='assistant'&&!m.error);
    if(!fu||!fa)return;
    const sys='你是對話標題產生器。根據對話開頭取一個 6～14 字的繁體中文（台灣用語）標題，概括對話主題。只輸出標題本身，不要引號、句號或任何其他文字。';
    const resp=await fetch(getEndpoint()+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+pickApiKey()},
      body:JSON.stringify({model:getModel(),stream:false,max_tokens:500,temperature:0.4,messages:[
        {role:'system',content:sys},
        {role:'user',content:'使用者: '+contentText(fu).slice(0,200)+'\nAI: '+contentText(fa).slice(0,200)}
      ]})
    });
    if(!resp.ok)return applyFallback();
    const j=await resp.json();
    let t=((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'')
      .replace(/<think>[\s\S]*?(<\/think>|$)/g,'')   // 思考型模型：濾掉思考段
      .split('\n').map(l=>l.trim()).filter(Boolean).pop()||'';
    t=t.replace(/^["「『\s]+|["」』\s.。]+$/g,'').slice(0,30);
    if(!t)return applyFallback();
    if(!chat.titleFromMsg)return;   // 使用者在生成期間已手動改名：尊重命名，不覆蓋
    chat.title=t;
    delete chat.titleFromMsg;   // 已生成正式標題，之後不再觸發
    saveChatsData(chats,chat.id);
    renderChatList();
    dbg('[Chat] 標題自動生成:',t);
  }catch(e){dbg('[Chat] 標題生成失敗，改用 fallback:',e);applyFallback();}
}

// 圖片模型請求（文生圖 / 圖生圖 / 多圖合成）
async function requestImage(opts){
  const chat=chats[activeChatId];
  if(!chat)return;
  const apiKey=getImageApiKey();   // Agnes 官方圖片模型：一律用預設 Agnes Key（不受使用者自訂 Key 影響）
  if(!apiKey){
    showToast('請先設定 API Key<br>（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }
  isStreaming=true;
  updateSendButton();

  const container=messagesEl;
  const statusDiv=makeStatusEl('<span class="spinner"></span>🖼️ 正在生成圖片','statusMsg');
  container.appendChild(statusDiv);
  followIfStuck(); // 圖片請求 statusDiv 建立：僅在自動捲動開啟且貼底時跟上

  abortCtrl=new AbortController();
  const imgStart=performance.now();
  try{
    dbg('[Chat] 發送圖片請求至:', getImageEndpoint()+'/images/generations');
    dbg('[Chat] 圖片模型:', getImageModel());
    // 依官方文件：size 用檔位（2K）+ ratio（16:9）由後端解析；response_format 用 "url"
    // （官方範例用 url；曾嘗試 "b64_json" 會卡死 spinner 至 timeout，因此採 url 由前端下載）
    const body={model:getImageModel(),prompt:opts.prompt,size:getImageSize(),ratio:getImageRatio(),extra_body:{response_format:'url'}};
    if(opts.images&&opts.images.length){
      // 圖生圖：單張直接給 dataURL；多圖合成：給陣列
      body.extra_body.image=opts.images.length===1?opts.images[0]:opts.images;
    }
    dbg('[Chat] 圖片請求 body:', body);
    // 送出請求；與文字請求共用 fetchWithRetry：伺服器忙碌（503「queue is full」）或連線逾時時自動重試
    const resp=await fetchWithRetry(`${getImageEndpoint()}/images/generations`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal:abortCtrl.signal
    },{
      timeoutMs:TIMEOUT.image,   // 2K 圖片生成正常 30~90 秒；單次嘗試逾時 2 分鐘視為卡死
      maxAttempts:Math.max(5,keyPoolSize(getImageApiKey())*2+2),
      getKey:()=>pickApiKey(getImageApiKey()),   // 多 Key 輪替（圖片 Key 為主的池）
      onStatus:h=>{statusDiv.innerHTML=h},
      onWait:()=>{statusDiv.innerHTML='<span class="spinner"></span>🖼️ 正在生成圖片'},   // 重試間隔後立刻把狀態文字切回，避免「伺服器忙碌」殘留 30~90 秒
      statusPrefix:'🖼️ ',
      isAborted:()=>abortCtrl.signal.aborted
    });
    dbg('[Chat] 圖片回應狀態:', resp.status, resp.statusText, `(${Math.round(performance.now()-imgStart)}ms)`);
    statusDiv.innerHTML='<span class="spinner"></span>⬇️ 正在取得圖片';   // 重試成功後立刻切換狀態文字，避免「伺服器忙碌」殘留
    const j=await resp.json();
    dbg('[Chat] 圖片回應 body:', j);
    const item=(j.data&&j.data[0])||{};
    const b64=item.b64_json||'';
    const url=item.url||'';
    if(!b64&&!url)throw new Error('圖片模型未回傳圖片（請檢查 prompt 與 API 權限）');

    // 圖片存進 IndexedDB，歷史只留輕量 image_ref，不撐爆 localStorage
    const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    if(b64){
      // 優先使用 b64_json：伺服器直接給 base64，無 CORS 問題，且永久保存
      const dataUrl=b64.startsWith('data:')?b64:'data:image/png;base64,'+b64;
      await mediaPut(id,dataUrl);
    }else if(url.startsWith('data:')){
      await mediaPut(id,url);
    }else if(url){
      // Agnes 圖床（platform-outputs.agnes-ai.space）無 CORS header，瀏覽器 JS 無法直接讀取。
      // 透過直接抓取 / CORS 圖片代理把圖抓回來存進 IndexedDB：永久保存（URL 過期也不怕）且可直接下載。
      // 全部失敗才退回只存 URL 字串（顯示靠 <img src> 不受 CORS 影響）。
      const blob=await fetchRemoteImage(url,30000);
      if(blob){
        await mediaPut(id,blob);
        dbg('[Chat] 圖片已抓回存入 IndexedDB，大小:',blob.size);
      }else{
        dbg('[Chat] 圖片抓取失敗（含代理），僅保存 URL，該圖可能無法直接下載');
        await mediaPut(id,url,null,{urlOnly:true});   // A7：標記僅連結（無法下載／壓縮，Gallery 會顯示提示）
      }
    }
    statusDiv.remove();
    const prefix=opts.images&&opts.images.length?`已根據 ${opts.images.length} 張圖生成：`:'已生成圖片：';
    chat.messages.push({role:'assistant',content:[{type:'text',text:prefix+opts.prompt},{type:'image_ref',id,large:true}],createdAt:Date.now()});   // C3：時間戳
    touchChat(chat);
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    saveChatsDataNow();   // B2：立即寫入
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加生成的圖片訊息列，不重建（尊重使用者捲動位置）
    renderChatList();
    if(getAutoScroll()){
      stickBottom=true;
      scrollToBottom(false,true);   // 自動滾動開啟：捲到最新（強制執行，stickBottom 剛設 true 不再被擋；雙 RAF 等 layout；圖片載入後由 load 監聽跟上，避免「中間地帶」）
    }else{
      showToast('圖片已生成','success');   // 自動滾動關閉：圖片生成完成時提醒，畫面一律不動
    }
    updateScrollBtn();
    dbg('[Chat] 圖片完成，id:', id);
  }catch(e){
    if(e.name==='AbortError'){
      if(statusDiv.isConnected)statusDiv.remove();
      showToast('已停止生成圖片','warn');
      return;
    }
    console.error('[Chat] 圖片錯誤:', e);
    if(statusDiv.isConnected){
      statusDiv.innerHTML=`<span style="color:var(--accent)">✕ 錯誤：${escHtml(e.message)}</span>`;
      statusDiv.classList.remove('typing');
      setTimeout(()=>{if(statusDiv.isConnected)statusDiv.remove()},6000);
    }else{
      showToast('錯誤：'+e.message,'warn');
    }
    chat.messages.push({role:'assistant',content:`[錯誤] ${e.message}`,error:true});
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加錯誤訊息列，不重建
  }finally{
    isStreaming=false;
    abortCtrl=null;
    updateSendButton();
    saveChatsDataNow();   // B2：結束時沖掉待寫存的變更
    flushQueuedMessage();   // D8：送出排隊訊息
  }
}

// 送出 / 停止 / 語音三態切換（同一個槽位互斥顯示）
function updateSendButton(){
  const b=document.getElementById('btnSend');
  const m=document.getElementById('btnMic');
  if(isStreaming){
    if(b){
      b.textContent='■';b.classList.add('stop');
      b.title='停止生成';b.setAttribute('aria-label','停止生成');
      b.classList.remove('hidden');
    }
    if(m)m.classList.add('hidden');
  }else{
    const hasText=!!msgInput.value.trim();
    if(b){
      b.textContent='➤';b.classList.remove('stop');
      b.title='送出';b.setAttribute('aria-label','送出');
      b.classList.toggle('hidden',!hasText);
    }
    if(m)m.classList.toggle('hidden',hasText);
  }
}

// ===== B2：設定欄位映射（openSettings / saveSettings / resetSettings 共用單一來源；新增設定只需加一列）=====
const SETTING_FIELDS=[
  {id:'settingKey',key:'apiKey',type:'text',trim:true},
  {id:'settingModel',key:'model',type:'model'},
  {id:'settingImageModel',key:'imageModel',type:'text',trim:true,def:'agnes-image-2.1-flash'},
  {id:'settingImageSize',key:'imageSize',type:'text'},
  {id:'settingImageRatio',key:'imageRatio',type:'text'},
  {id:'settingEndpoint',key:'endpoint',type:'text',trim:true},
  {id:'settingTemp',key:'temperature',type:'float',def:0.6},
  {id:'settingMaxTokens',key:'maxTokens',type:'int',def:16384},
  {id:'settingCtx',key:'ctxLimit',type:'text'},
  {id:'settingAutoScroll',key:'autoScroll',type:'bool'},
  {id:'settingQuickReply',key:'quickReply',type:'bool'},
  {id:'settingThinking',key:'showThinking',type:'bool'},
  {id:'settingStorageWarn',key:'storageWarnMB',type:'int',def:DEFAULT_STORAGE_WARN_MB},
  {id:'settingSystem',key:'systemPrompt',type:'text',trim:true},
  {id:'settingPersona',key:'persona',type:'text'},
  {id:'settingSendKey',key:'sendKey',type:'text',def:'auto'},
  {id:'settingTheme',key:'theme',type:'text'}
];
function openSettings(){
  // B2：以 SETTING_FIELDS 映射表統一填值
  SETTING_FIELDS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(!el)return;
    if(f.type==='bool'){
      // B5：沿用各設定 getter 的語意（三者都是 `!==false`，未設定時一律視為「開」；
      //     實務上 migrateLegacySettings() 啟動時就會補上 DEFAULT_SETTINGS，不會真的走到未設定分支）
      el.checked=f.key==='autoScroll'?getAutoScroll():f.key==='quickReply'?getQuickReply():getShowThinking();
    }else{
      // 後備鏈：settings 值 → DEFAULT_SETTINGS 預設 → 欄位 def → 空字串（確保面板永不空白）
      const v=settings[f.key];
      const dv=(v!=null&&v!=='')?v:(DEFAULT_SETTINGS[f.key]!=null?DEFAULT_SETTINGS[f.key]:(f.def!=null?f.def:''));
      el.value=dv;
    }
  });
  syncModelInput();   // 依端點欄位值切換模型欄的「下拉/文字」形態（model 值先寫入文字端，再由 sync 統一兩側）
  fillPersonaOptions();
  document.getElementById('settingPersona').value=getPersonaId();
  updatePersonaDesc();
  document.getElementById('settingsModal').classList.add('open');
  histPush('settings');   // 推入一筆歷史狀態：手機返回鍵／返回手勢觸發 popstate 時關設定，而不是離開頁面
}
function closeSettings(){
  document.getElementById('settingsModal').classList.remove('open');
  histPop('settings');   // 手機返回鍵同步：用 ✕／背景／Esc 關閉時退掉推入的狀態
  applyTheme();
}

// ===== Modal 確認框 & Toast 提示 =====
function showConfirm(msg){
  return new Promise(resolve=>{
    const modal=document.getElementById('confirmModal');
    const yes=document.getElementById('confirmYes');
    const no=document.getElementById('confirmNo');
    document.getElementById('confirmMsg').textContent=msg;
    modal.classList.add('open');
    histPush('confirm');   // 推入一筆歷史狀態：手機返回鍵關確認框（視同按「取消」），而不是離開頁面
    const done=v=>{
      modal.classList.remove('open');
      histPop('confirm');   // 同步退掉推入的狀態（popstate 端旗標已清，不會重複關閉）
      yes.removeEventListener('click',onYes);
      no.removeEventListener('click',onNo);
      modal.removeEventListener('click',onBg);
      resolve(v);
    };
    const onYes=()=>done(true);
    const onNo=()=>done(false);
    const onBg=e=>{if(e.target===modal)done(false)};
    yes.addEventListener('click',onYes);
    no.addEventListener('click',onNo);
    modal.addEventListener('click',onBg);
  });
}
// ===== 三之1：搜尋來源面板 =====
// 訊息上只存了查詢字串（🔍 徽章）；實際引用到的來源清單記錄在 m.sources，點徽章即可展開。
function safeHttpUrl(u){
  const s=String(u||'').trim();
  return /^https?:\/\/[^\s]+$/i.test(s)?s:'';   // 只放行 http(s)，阻擋 javascript: 等偽協議
}
function showSourcesModal(m){
  const list=(m&&m.sources||[]).map(s=>({title:String(s.title||''),url:safeHttpUrl(s.url)})).filter(s=>s.url);
  if(!list.length){showToast('沒有可用的來源網址','warn');return}
  document.getElementById('sourcesQuery').textContent=m.searchQuery?('查詢字串：'+m.searchQuery):'';
  document.getElementById('sourcesList').innerHTML=list.map((s,i)=>
    '<a href="'+escHtml(s.url)+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="src-title">'+escHtml((i+1)+'. '+(s.title||s.url))+'</span>'+
      '<span class="src-url">'+escHtml(s.url)+'</span>'+
    '</a>').join('');
  document.getElementById('sourcesModal').classList.add('open');
  histPush('sources');   // 推入一筆歷史狀態：手機返回鍵關面板，而不是離開頁面
}
function closeSourcesModal(fromPop){
  const modal=document.getElementById('sourcesModal');
  if(!modal.classList.contains('open'))return;
  modal.classList.remove('open');
  histPop('sources',!!fromPop);   // 由 popstate 觸發時歷史狀態已彈掉，不能再退一次
}
document.getElementById('sourcesClose').addEventListener('click',()=>closeSourcesModal(false));
document.getElementById('sourcesModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSourcesModal(false)});

function showToast(msg,type){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.innerHTML=msg;
  wrap.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2600);
  return t;
}
// ===== PWA 新版更新提示（記憶體旗標：本輪只提示一次、不騷擾）=====
let appUpdateToastShown=false;   // 本輪是否已顯示過「有新版本」toast
let appUpdatePending=false;      // 是否有待套用的新版（header 更新鈕顯示依據）
function setAppUpdatePending(on){
  appUpdatePending=!!on;
  const b=document.getElementById('btnAppUpdate');
  if(b){b.hidden=!appUpdatePending;b.classList.toggle('show',appUpdatePending)}
}
function notifyAppUpdateAvailable(){
  setAppUpdatePending(true);
  if(appUpdateToastShown)return;   // 已提示過：只留 header 更新鈕，不再彈 toast
  appUpdateToastShown=true;
  const t=showToast('有新版本，可更新','action');
  if(t)t.addEventListener('click',()=>applyAppUpdate());
}
function applyAppUpdate(){
  // 串流生成中禁止重整：避免 AI 回覆／生圖被中斷；請使用者等完成後再點 header 的更新鈕
  if(typeof isStreaming!=='undefined'&&isStreaming){showToast('AI 回覆中，請稍後更新','warn');return}
  try{
    if(draftTimer){clearTimeout(draftTimer);draftTimer=null}
    if(typeof saveDraft==='function')saveDraft();               // 輸入框草稿先存
    if(typeof saveChatsDataNow==='function')saveChatsDataNow(); // 待寫存的對話先沖掉
    if(typeof saveDrafts==='function')saveDrafts();
  }catch(e){}
  // controller 已換手時 reload 必定拿到新殼；若新 SW 還在背景裝，給它一點時間再重整
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)setAppUpdatePending(false),location.reload();
  else setTimeout(()=>location.reload(),1200);
}
// D3：常駐進度提示（匯出／壓縮大量項目時用；與 toast 不同，不會自動消失）
let progressToastEl=null;
function showProgress(msg){
  if(!progressToastEl){
    progressToastEl=document.createElement('div');
    progressToastEl.className='toast';
    document.getElementById('toastWrap').appendChild(progressToastEl);
  }
  progressToastEl.innerHTML=msg;
}
function hideProgress(){
  if(!progressToastEl)return;
  const el=progressToastEl;progressToastEl=null;
  el.classList.add('out');
  setTimeout(()=>el.remove(),300);
}
// D7：啟動時儲存空間用量檢查（超過設定門檻則提醒壓縮／清理）
async function checkStorageUsage(){
  try{
    if(!navigator.storage||!navigator.storage.estimate)return;
    const est=await navigator.storage.estimate();
    const usage=est.usage||0;
    const limitMB=parseInt(settings.storageWarnMB,10)||DEFAULT_STORAGE_WARN_MB;
    if(usage>limitMB*1048576)showToast('⚠️ 本機儲存已用 '+fmtBytes(usage)+'（提醒門檻 '+limitMB+' MB），<br>建議開啟圖片庫壓縮或清理','warn');
  }catch(e){}
}

async function resetSettings(){
  if(!await showConfirm('確定要將所有設定恢復為網頁預設值嗎？\n僅保留自填 API Key，自訂人格會清除。'))return;
  const keepKey=settings.apiKey;   // 重設保留自填 Key：清空會把人踢回代理，Key 得重貼
  settings={...DEFAULT_SETTINGS};
  if(keepKey)settings.apiKey=keepKey;
  loadCustomPersonas();   // 重設會清掉自訂人格設定，同步把運作中的人格清單還原回內建（再開設定即為空白新增項）
  saveSettingsData(settings);
  // B2：以 SETTING_FIELDS 映射表統一回填預設值
  SETTING_FIELDS.forEach(f=>{
    const el=document.getElementById(f.id);

  // 人格下拉選單同步重建：loadCustomPersonas 已清掉自訂人格，但不重建下拉殘留舊 option 與舊選取值
  fillPersonaOptions();

  updatePersonaDesc();
  applyTheme();
  invalidateRenderCache();   // B1：設定回到預設值，快取同樣要失效
  if(chats[activeChatId])renderMessages(true);
  showToast('已恢復為預設設定','success');
}
function saveSettings(){
  const prevThinking=getShowThinking();   // B1：判斷「顯示思考過程」是否真的被改動
  syncModelInput();   // 模型雙形態：把目前有效端的值帶回文字端（#settingModel），下面統一從文字端收值
  // B2：以 SETTING_FIELDS 映射表統一收值
  SETTING_FIELDS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(!el)return;
    if(f.type==='bool'){settings[f.key]=el.checked;return}
    let v=el.value;
    if(f.trim)v=v.trim();
    if(f.type==='float')v=parseFloat(v);
    else if(f.type==='int')v=parseInt(v,10);
    if((f.type==='float'||f.type==='int')&&!Number.isFinite(v))v=f.def!=null?f.def:0;
    else if(v===''&&f.def!=null)v=f.def;
    settings[f.key]=v;
  });
  applyTheme();
  saveSettingsData(settings);
  invalidateRenderCache();   // B1：設定會影響 renderContent 的輸出（例：顯示思考過程）
  closeSettings();
  // 「顯示思考過程」開關會改變既有訊息的外觀：真的改了才重繪（保留捲動位置）
  if(getShowThinking()!==prevThinking&&chats[activeChatId])renderMessages(true);
}

// 輸入框自動調整高度；只要內容裝得下（未達 150px 捲動上限）就垂直置中，達上限後維持頂部對齊捲動
const msgInput=document.getElementById('msgInput');
// 隱藏量測用 textarea：量 placeholder 折行後的實際高度（同寬、同字體、同 padding）
let phMeter=null;
function measureNaturalH(text){
  if(!phMeter){
    phMeter=document.createElement('textarea');
    phMeter.setAttribute('readonly','');
    phMeter.rows=1;
    phMeter.style.position='absolute';
    phMeter.style.visibility='hidden';
    phMeter.style.left='-9999px';
    phMeter.style.top='0';
    phMeter.style.resize='none';
    phMeter.style.overflow='hidden';
    document.body.appendChild(phMeter);
  }
  const cs=getComputedStyle(msgInput),s=phMeter.style;
  s.width=msgInput.clientWidth+'px';
  s.boxSizing='border-box';
  s.border='0';
  s.padding=cs.padding;
  s.fontStyle=cs.fontStyle;s.fontWeight=cs.fontWeight;s.fontSize=cs.fontSize;
  s.lineHeight=cs.lineHeight;s.fontFamily=cs.fontFamily;s.letterSpacing=cs.letterSpacing;
  phMeter.value=text||' ';
  return phMeter.scrollHeight;
}
function layoutMsgInput(){
  msgInput.style.paddingTop='';msgInput.style.paddingBottom=''; // 先還原置中，避免污染量測
  msgInput.style.height='auto';
  msgInput.style.minHeight='0';                        // 暫時解除 min-height，量出內容自然高度
  let natural=msgInput.scrollHeight;                   // 內容自然高度（含上下 padding）
  // 空值時改量 placeholder（圖生圖提示文字在手機會折行，框要夠高才不會被切到）
  if(!msgInput.value){
    const ph=measureNaturalH(msgInput.getAttribute('placeholder')||'');
    if(ph>natural)natural=ph;
  }
  msgInput.style.minHeight='';
  msgInput.style.height=Math.min(natural,150)+'px';    // 長高邏輯與原本相同（上限 150px）
  // 有留白就上下均分 → 任何行數都垂直置中；達上限（捲動狀態）時 slack<=0，維持頂部對齊
  const slack=msgInput.clientHeight-natural;
  if(slack>0){
    const base=parseFloat(getComputedStyle(msgInput).paddingTop)||12;
    msgInput.style.paddingTop=(base+slack/2)+'px';
    msgInput.style.paddingBottom=(base+slack/2)+'px';
    msgInput.scrollTop=0;
  }
}
msgInput.addEventListener('input',layoutMsgInput);

// ===== 草稿自動保存（重整／當機／切換對話都不丟輸入內容）=====
// 以對話 id 為鍵存在 localStorage；未選定對話時用 '__new__'。
// 只存文字與附件 id（圖片本體在 IndexedDB），因此體積極小。
const DRAFT_KEY='chatcat_drafts';
let drafts=loadDrafts();
let draftTimer=null;
function loadDrafts(){
  try{const o=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}}catch(e){return {}}
}
function saveDrafts(){
  try{
    const keys=Object.keys(drafts);
    if(keys.length>CONFIG.draft.maxDrafts){   // 超出上限：淘汰最久沒動的
      keys.sort((a,b)=>(drafts[a].t||0)-(drafts[b].t||0));
      keys.slice(0,keys.length-CONFIG.draft.maxDrafts).forEach(k=>delete drafts[k]);
    }
    localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));
  }catch(e){}
}
function draftKey(id){return id||activeChatId||'__new__'}
function saveDraft(id){
  const k=draftKey(id);
  const text=msgInput?msgInput.value:'';
  const images=pendingImages.map(p=>p.id);
  if(!text&&!images.length){   // 空草稿不留痕跡
    if(drafts[k]){delete drafts[k];saveDrafts()}
    return;
  }
  drafts[k]={text:text,images:images,imgMode:!!imgMode,t:Date.now()};
  saveDrafts();
}
function scheduleDraft(){
  if(draftTimer)clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{draftTimer=null;saveDraft()},CONFIG.draft.debounceMs);
}
// 切換對話時把還原：文字直接回填，附件只還原 IndexedDB 裡還存在的 id
async function applyDraft(id){
  const d=drafts[draftKey(id)];
  clearPendingImages();
  if(!d){
    if(msgInput&&msgInput.value)msgInput.value='';
    return false;
  }
  if(msgInput)msgInput.value=d.text||'';
  if(!!d.imgMode!==imgMode){
    imgMode=!!d.imgMode;
    const b=document.getElementById('btnImgMode');
    if(b)b.classList.toggle('active',imgMode);
  }
  const restored=[];
  for(const mid of (d.images||[])){
    try{
      const data=await mediaGet(mid);
      if(data!=null)restored.push({id:mid,url:previewUrlFor(data)});
    }catch(e){}
  }
  pendingImages=restored;
  renderAttachBar();
  updateImgModeHint();
  if(msgInput){layoutMsgInput();updateSendButton()}
  return true;
}

// 輸入框文字變動時也要更新三態切換（同一個槽位互斥顯示）
msgInput.addEventListener('input',updateSendButton);

// 在游標處插入換行（舊寫法 value+='\n' 永遠插在尾端，游標在中間斷行時會被搬到最後）
// 有選取時取代選取範圍；插入後游標停在換行之後。
function insertNewlineAtCaret(ta){
  ta.focus();
  const v=ta.value;
  const s=(ta.selectionStart==null)?v.length:ta.selectionStart;
  const e=(ta.selectionEnd==null)?s:ta.selectionEnd;
  let ok=false;
  try{
    ta.setSelectionRange(s,e);
    // execCommand 會觸發原生 input 事件且保留復原堆疊（Android IME 相容較好）；已廢棄但仍廣泛支援
    ok=document.execCommand('insertText',false,'\n');
  }catch(err){ok=false}
  if(!ok){   // 後備：手動切字串（execCommand 被停用或失敗時）
    ta.value=v.slice(0,s)+'\n'+v.slice(e);
    const p=s+1;
    try{ta.setSelectionRange(p,p)}catch(err){}
    ta.dispatchEvent(new Event('input'));
  }
}
msgInput.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.isComposing||e.keyCode===229)return;   // IME 組字中（注音／倉頡等）：Enter 是選字鍵，交給輸入法
  // 觸控為主的裝置（手機／平板）：Enter 換行、Shift+Enter 送出；有滑鼠／實體鍵盤的環境維持 Enter 送出。
  // 舊判定用 navigator.maxTouchPoints>0，會把「觸控螢幕筆電」也當成手機（Enter 永遠送不出去）。
  const touchPrimary=window.matchMedia
    ?window.matchMedia('(hover:none) and (pointer:coarse)').matches
    :(navigator.maxTouchPoints>0);
  // 送出鍵可切換（設定 → 送出鍵）：auto＝依裝置自動、enter＝Enter 送出、ctrlenter＝Ctrl/Cmd+Enter 送出
  const keyMode=settings.sendKey||'auto';
  if(keyMode==='ctrlenter'){
    if(e.ctrlKey||e.metaKey){e.preventDefault();sendMessage()}
    return;   // Enter 維持原生換行
  }
  if(touchPrimary&&keyMode!=='enter'){
    if(e.shiftKey){e.preventDefault();sendMessage()}
    else{e.preventDefault();insertNewlineAtCaret(msgInput)}
  }else{
    if(!e.shiftKey){e.preventDefault();sendMessage()}
  }
});

// 加入圖片附件（檔案選擇／拖放／貼上三條路徑共用）
// 存進 IndexedDB 的是 Blob（不再整份轉成 dataURL 字串），預覽改用 objectURL，送出前才轉 dataURL。
// 同一張圖重複加入會命中內容去重，沿用既有 id，不會在圖庫裡多存一份。
async function addImageFiles(files){
  const list=[...(files||[])].filter(f=>f&&f.type&&f.type.indexOf('image/')===0);
  if(!list.length)return 0;
  let n=0;
  for(const f of list){
    if(pendingImages.length>=8){showToast('一次最多附加 8 張圖片','warn');break}
    try{
      let data;
      if(f.type==='image/gif'||f.size<300*1024){
        data=f;   // B3：小檔或 GIF（動圖轉 JPEG 會失去動畫）直接原樣保存
      }else{
        data=(await compressToJpeg(f,{maxEdge:1024,quality:0.85})).data;
      }
      const id=await mediaPutDedup(data,'u');   // 存進 IndexedDB，歷史只留 image_ref，不撐爆 localStorage
      pendingImages.push({id,url:previewUrlFor(data)});
      n++;
      renderAttachBar();
    }catch(err){
      showToast('圖片讀取失敗：'+(f.name||''),'warn');
    }
  }
  if(n)scheduleDraft();
  return n;
}

  e.target.value='';
  await addImageFiles(files);
});

// B3：通用 JPEG 壓縮核心（附件上傳與 Gallery 壓縮共用）
// source：File / Blob / dataURL 字串；opt.maxEdge 限制長邊（0＝維持原尺寸）；opt.quality 預設 0.85
// 回傳 {data:Blob,width,height}；透明處鋪白底（JPEG 無透明）
function compressToJpeg(source,opt){
  opt=opt||{};
  const quality=opt.quality||0.85,maxEdge=opt.maxEdge||0;
  return new Promise((resolve,reject)=>{
    const isStr=typeof source==='string';
    const srcUrl=isStr?source:URL.createObjectURL(source);
    const cleanup=()=>{if(!isStr){try{URL.revokeObjectURL(srcUrl)}catch(e){}}};
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(maxEdge&&w>maxEdge&&h>maxEdge){
          const s=Math.min(maxEdge/w,maxEdge/h);
          w=Math.round(w*s);h=Math.round(h*s);
        }
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        cv.toBlob(blob=>{
          cleanup();
          if(blob)resolve({data:blob,width:w,height:h});
          else reject(new Error('瀏覽器不支援 canvas 轉檔'));
        },'image/jpeg',quality);
      }catch(e){cleanup();reject(e)}
    };
    img.onerror=()=>{cleanup();reject(new Error('圖片讀取失敗'))};
    img.src=srcUrl;
  });
}

// 設定面板不採用「點面板外關閉」（有取消按鈕，避免誤觸）；僅由取消／儲存／ESC 關閉

// ===== 捲動輔助（單一真相來源：應不應該自動捲，一律問 shouldAutoScroll）=====
// shouldAutoScroll：在「自動捲動訊息」開啟 且 使用者仍貼底（stickBottom）時才回 true。
// scrollToBottom 內部不再自己檢查開關，呼叫端一律先問 shouldAutoScroll() 再決定，
// 避免「外層問一次、內層又問一次、還有 force 繞過」三種語意互相打架。
function shouldAutoScroll(){return getAutoScroll()&&stickBottom}
// scrollToBottom：捲到底部。用雙 RAF 等 layout 完成後再 scroll，確保圖片非同步載入後仍能正確捲到最新位置。
// force=true → 無條件捲，給「使用者手動點擊 ↓ 按鈕」這類必須執行的場景用；其餘一律先問 shouldAutoScroll()。
function scrollToBottom(smooth,force){
  if(!force&&!shouldAutoScroll())return;
  stickBottom=true;   // 程式觸發的捲動（自動跟隨／完成／手動回到底）：回到貼底狀態
  const doScroll=()=>{
    messagesEl.scrollTo({
      top:messagesEl.scrollHeight-messagesEl.clientHeight,
      behavior:smooth?'smooth':'auto'
    });
    updateScrollBtn();
  };
  if(smooth){doScroll();return}   // 手動平滑回到底：立即執行才有動畫感，不等 RAF
  requestAnimationFrame(()=>{
    requestAnimationFrame(doScroll);
  });
}
// scrollToLatestStart：捲到「最後一則訊息的開頭」（長回覆完成時用，從頭開始讀）。
// force 語意同 scrollToBottom；短回覆（一屏能看完）會退化成捲到底，避免底部留白。
function scrollToLatestStart(smooth,force){
  if(!force&&!shouldAutoScroll())return;
  stickBottom=true;
  const doScroll=()=>{
    try{
      const rows=messagesEl.querySelectorAll('.msg-row');
      const last=rows.length?rows[rows.length-1]:null;
      if(last&&last.offsetHeight>messagesEl.clientHeight*1.5)last.scrollIntoView({block:'start',behavior:smooth?'smooth':'auto'});
      else messagesEl.scrollTo({top:messagesEl.scrollHeight-messagesEl.clientHeight,behavior:smooth?'smooth':'auto'});
    }catch(e){try{messagesEl.scrollTop=messagesEl.scrollHeight}catch(_){}}
    updateScrollBtn();
  };
  if(smooth){doScroll();return}
  requestAnimationFrame(()=>{requestAnimationFrame(doScroll)});   // 雙 RAF：等最終排版完成再定位，避免開頭量錯
}
// stickBottom：使用者是否「貼在最新訊息」。新訊息（AI 回覆／生圖完成／送出訊息）時設 true；
// 使用者主動往上捲（滾輪／觸控）設 false，之後串流與圖片載入就不再拉動畫面。
// 注意：送出訊息／完成／圖片載入跟上時不要直接 stickBottom=true，
// 先問 shouldAutoScroll() 再決定，避免「使用者已往上捲卻被強制拉回」的打架。
let stickBottom=true;
// 使用者手勢離開底部：停止自動跟隨（scroll 事件會被程式式捲動觸發，故只攔 wheel/touch）
messagesEl.addEventListener('wheel',()=>{stickBottom=false},{passive:true});
messagesEl.addEventListener('touchmove',()=>{stickBottom=false},{passive:true});
// 自動捲動開啟且仍貼底時跟到最新
function followIfStuck(){
  if(shouldAutoScroll())scrollToBottom(false);
}
function updateScrollBtn(){
  const b=document.getElementById('btnScrollBottom');
  if(!b)return;
  // 「回到最新訊息」按鈕：開關無關，只要有訊息、且使用者不在底部就顯示；
  // 開啟時平常貼底所以自然隱藏，往上捲仍可手動一鍵回到底（點按鈕用 force，不受開關影響）
  const hasMsg=chats[activeChatId]&&chats[activeChatId].messages.length>0;
  const away=(messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight)>80;
  const showBtn=!!hasMsg&&away;
  b.classList.toggle('show',showBtn);
}

// 圖片模式切換：ON 時送出改呼叫圖片模型（文生圖 / 圖生圖 / 多圖合成）
function updateImgModeHint(){
  const inp=document.getElementById('msgInput');
  if(!inp)return;
