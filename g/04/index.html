<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ccdeeb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatCAT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<title>ChatCAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--surface:#141414;--surface2:#1e1e1e;--accent:#9bbfdb;
  --text:#8899aa;--text2:#9bbbdb;--border:#2a2a2a;--input-bg:#111;
  --msg-user:#a1c4dc;--msg-ai:#a9cda8;--scrollbar:#2a2a2a;
  --msg-user-bg:rgba(92,132,166,.8);--msg-ai-bg:rgba(88,108,88,.8);
  --cat-fur:#7a8590;--cat-inner:#c49a9c;--cat-belly:#aeb6bf;--cat-paw:#6a7480;
  --cat-eye:#2a2f36;--cat-blush:rgba(196,154,156,.5);--cat-nose:#56606d;--cat-detail:#8a949e;
}
html,body{height:100%;height:100dvh;font-family:'Chiron GoRound TC',ui-monospace,SFMono-Regular,Consolas, monospace,'Noto Sans TC','Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);font-optical-sizing:auto;font-weight:600;font-style:normal;overscroll-behavior:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.app{display:flex;height:100%;height:100dvh;height:100svh;overflow:hidden}

/* 側邊欄 */
input,textarea,select,span{font-family:'Chiron GoRound TC',ui-monospace,SFMono-Regular,Consolas, monospace,'Noto Sans TC','Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;}
button{font-family:'LXGW WenKai TC',cursive,ui-monospace,SFMono-Regular,Consolas, monospace,'Noto Sans TC','Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;font-weight:800;}
h2,h3{font-family:'LXGW WenKai TC','IBM Plex Mono','Noto Sans TC','Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;font-weight:900}
.sidebar{width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s;min-height:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.sidebar-header h2{font-size:18px;color:var(--accent)}
.btn-new{padding:8px 14px;background:var(--msg-user-bg);color:var(--text);border:none;border-radius:18px;cursor:pointer;font-size:13px;transition:opacity .2s}
.btn-new:hover{opacity:.85}
.chat-list{flex:1;min-height:0;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.msg pre,.msg .msg-body table,.msg table{touch-action:pan-x pan-y}
.chat-item{padding:10px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .2s;display:flex;align-items:center;gap:8px}
.chat-item:hover{background:var(--surface2)}
.chat-item.active{background:var(--surface2);border:1px solid var(--accent)}
.chat-item .icon{font-size:16px}
.chat-item .title{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .del,.chat-item .act{opacity:0;font-size:12px;color:var(--text2);transition:opacity .2s;background:none;border:none;cursor:pointer;padding:2px 3px}
.chat-item:hover .del,.chat-item:hover .act{opacity:1}
.chat-item .del:hover,.chat-item .act:hover{color:var(--accent)}
.chat-group{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.5px;opacity:.85;padding:12px 12px 4px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);flex:0 0 auto;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.btn-settings{width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:6px;cursor:pointer;font-size:16px;transition:all .2s}
.btn-settings:hover{border-color:var(--accent);color:var(--text)}

/* 主區域 */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);flex:0 0 auto;padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
.menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:0;border-radius:8px;line-height:0;width:36px;height:36px;flex-shrink:0;align-items:center;justify-content:center;transition:background .2s}
.menu-btn:hover{background:var(--surface2);color:var(--accent)}
.menu-btn svg{width:24px;height:24px;display:block;overflow:visible}
.arrow{transform-box:fill-box;transform-origin:center}
@keyframes arrowEnter{
  0%{transform:translate(52.95%,50.625%) matrix(0.6,0,0,-0.6,0,0);opacity:0;stroke-opacity:0.2}
  15%{opacity:1;stroke-opacity:0.2}
  46%{transform:translate(56.425%,50.625%) matrix(1,0,0,-1,0,0);opacity:1;stroke-opacity:1}
  100%{transform:translate(62.5%,50.625%) matrix(1,0,0,-1,0,0);opacity:1;stroke-opacity:1}
}
@keyframes arrowLeave{
  0%{transform:translate(52.95%,50.625%) matrix(0.6,0,0,-0.6,0,0);opacity:0;stroke-opacity:0.2}
  15%{opacity:1;stroke-opacity:0.2}
  46%{transform:translate(56.425%,50.625%) matrix(1,0,0,-1,0,0);opacity:1;stroke-opacity:1}
  100%{transform:translate(62.5%,50.625%) matrix(1,0,0,-1,0,0);opacity:1;stroke-opacity:1}
}
.menu-btn:hover .arrow{animation:arrowEnter 217ms ease-out forwards}
.menu-btn:not(:hover) .arrow{animation:arrowLeave 217ms ease-in reverse backwards}
.model-badge{padding:4px 10px;background:var(--surface2);border-radius:4px;font-size:12px;color:var(--text2)}
.messages{flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.msg{max-width:84%;padding:10px 14px;border-radius:14px;line-height:1.6;font-size:14px;word-break:break-word;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.msg.user{color:var(--msg-user);
  background:linear-gradient(150deg,rgba(92,132,166,.92),rgba(70,105,140,.85));
  border-bottom-right-radius:4px;border:1px solid rgba(160,200,230,.35)}
.msg.assistant{color:var(--msg-ai);
  background:linear-gradient(150deg,rgba(88,108,88,.78),rgba(70,90,75,.82));
  border-bottom-left-radius:4px;border:1px solid rgba(160,200,160,.3)}
.msg.system{align-self:center;background:transparent;color:var(--text2);font-size:12px;border:none;padding:4px}
.msg .msg-img{max-width:220px;max-height:220px;border-radius:8px;display:block;margin-bottom:8px;border:1px solid var(--border)}
#statusMsg.typing{color:var(--msg-ai);}
.typing{align-self:flex-start;color:var(--msg-ai);background:var(--msg-ai-bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--text2);display:flex;align-items:center;gap:8px}
.typing::after{content:'';color:var(--msg-ai);animation:dots 1.5s infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 輸入區 */
.input-area{z-index:1;padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom));padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right));border-top:1px solid var(--border);background:var(--surface);flex:0 0 auto}
.input-row{display:flex;gap:10px;align-items:flex-end}
#msgInput{flex:1;padding:12px 16px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;resize:none;max-height:150px;min-height:44px;outline:none;transition:border-color .2s}
#personaNameInput{width:100%;box-sizing:border-box;margin-bottom:16px;padding:8px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
#personaNameInput:focus{border-color:var(--accent)}
#personaNameInput::placeholder{color:var(--text2)}
#bookmarkRenameInput{width:100%;box-sizing:border-box;margin-bottom:16px;padding:8px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
#bookmarkRenameInput:focus{border-color:var(--accent)}
#bookmarkRenameInput::placeholder{color:var(--text2)}
#msgInput:focus{border-color:var(--accent)}
#msgInput::placeholder{color:var(--text2)}
.btn-attach{width:44px;height:44px;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(180,215,245,.06) 50%,rgba(120,160,210,.18));
  border:1px solid rgba(255,255,255,.22);border-radius:11px;color:#cfe3f5;font-size:18px;cursor:pointer;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 8px rgba(15,30,55,.3);
  position:relative;overflow:hidden;transition:all .25s}
.btn-attach::after{content:'';position:absolute;top:0;left:-90%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-25deg);transition:left .5s ease}
.btn-attach:hover{border-color:rgba(255,255,255,.45);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.4)}
.btn-attach:hover::after{left:140%}
.btn-attach:active{transform:translateY(0);box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.btn-imgmode.active{background:linear-gradient(160deg,rgba(255,214,110,.85),rgba(245,160,80,.75));border-color:rgba(255,200,90,.9);color:#3a2c00;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2px rgba(255,200,90,.35)}
.btn-imgmode.active::after{display:none}
.btn-imgmode.active:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2px rgba(255,200,90,.45)}
.msg .msg-img.large{max-width:min(420px,100%);max-height:420px}
.msg-img-slot{min-height:120px;min-width:120px;max-width:220px;max-height:220px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:8px;margin-bottom:8px;color:var(--text2);font-size:12px;background:rgba(255,255,255,.03)}
.attach-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.attach-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-remove{position:absolute;top:2px;right:2px;width:20px;height:20px;line-height:20px;text-align:center;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;font-size:12px;cursor:pointer;padding:0}
.attach-remove:hover{background:rgba(180,50,50,.9)}
.btn-send{width:44px;height:44px;background:linear-gradient(160deg,var(--msg-user-bg),var(--msg-user-bg) 25%,rgba(120,160,210,.18));
  border:0;border-radius:11px;color:#cfe3f5;font-size:18px;cursor:pointer;flex-shrink:0;
  position:relative;overflow:hidden;transition:all .25s}
.btn-send::after{content:'';position:absolute;top:0;left:-90%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-25deg);transition:left .5s ease}
.btn-send:hover{border-color:rgba(255,255,255,.45);color:#fff;}
.btn-send:hover::after{left:140%}
.btn-send:active{transform:translateY(0);box-shadow:inset 0 2px 8px rgba(0,0,0,.35);}
/* .empty{position:absolute;text-align:center;color:var(--text2);left:18%;bottom:10%;font-size:14px} */

/* 設定彈窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px;width:98%;max-width:420px;max-height:640px;max-height:min(640px,calc(100vh - 24px));max-height:min(640px,calc(100dvh - 24px));max-height:min(640px,calc(100svh - 24px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal h3{margin-bottom:16px;color:var(--accent)}
#personaPrompt{width:100%;height:24px;overflow-y:hidden}
#settingSystem{background:var(--input-bg);color:var(--text);width:100%;height:60px;padding:4px;border:1px solid var(--border);border-radius:6px;outline:none;transition:border-color .2s}
#settingSystem:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--text2);opacity:.75}
.field{margin-bottom:3px}
.field label{display:block;font-size:11px;color:var(--text2);margin:3px}
.field input,.field select{width:100%;padding:4px;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field input{padding-left:8px}
.field select{padding:4px}
.modal-actions{display:flex;gap:18px;justify-content:center;margin-top:16px}
.modal-actions button{padding:10px 6px;border-radius:6px;cursor:pointer;font-size:13px;border:none}
.btn-cancel{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-save{background:var(--msg-user-bg);color:var(--text)}
.btn-reset{margin-right:auto;background:transparent;color:var(--text2);border:1px dashed var(--border);transition:all .2s}
.btn-reset:hover{border-color:var(--accent);color:var(--text)}

/* 確認彈窗 */
.confirm-overlay{z-index:150}
.confirm-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:90%;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.confirm-modal p{color:var(--text);font-size:14px;line-height:1.6;margin-bottom:16px;text-align:center;white-space:pre-line}

/* Toast 提示 */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
/* Toast：更新提示那顆可點擊；其餘維持不可點避免擋訊息操作 */
.toast{padding:10px 18px;border-radius:10px;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.4);animation:toastIn .25s ease;max-width:80vw;word-break:break-word}
.toast.success{border-color:rgba(120,180,120,.6);color:var(--msg-ai)}
.toast.warn{border-color:rgba(200,170,90,.6);color:var(--text2)}
.toast.action{pointer-events:auto;cursor:pointer;border-color:var(--accent);color:var(--text2);text-decoration:underline;text-underline-offset:3px}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

/* ===== Markdown 與訊息增強樣式 ===== */
.msg p{margin:.35em 0}
.msg p:first-child{margin-top:0}
.msg p:last-child{margin-bottom:0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:.6em 0 .3em;line-height:1.4}
.msg h1{font-size:1.3em}.msg h2{font-size:1.2em}.msg h3{font-size:1.1em}
.msg ul,.msg ol{margin:.35em 0;padding-left:1.5em}
.msg li{margin:.15em 0}
.msg blockquote{margin:.4em 0;padding:.2em .8em;border-left:3px solid var(--border);opacity:.85}
.msg table{border-collapse:collapse;margin:.5em 0;font-size:.95em;display:block;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.msg th,.msg td{border:1px solid var(--border);padding:4px 10px;white-space:nowrap}
.msg th{background:rgba(255,255,255,.06)}
.msg hr{border:none;border-top:1px solid var(--border);margin:.6em 0}
.msg a{color:var(--accent)}
.msg :not(pre)>code{background:rgba(0,0,0,.25);padding:1px 6px;border-radius:4px;font-size:.9em;font-family:'LXGW WenKai TC',cursive}
/* 訊息內嵌 SVG：限制最大尺寸避免撐破氣泡；消毒後若只剩空殼由 stripEmptySvg 移除，這裡只是保險 */
.msg svg{max-width:100%;height:auto;max-height:360px}
.msg p>svg:only-child{display:block;margin:.2em 0}
.msg svg:empty{display:none}
.msg pre{position:relative;background:rgba(0,0,0,.16);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;overflow-y:hidden;max-width:100%;-webkit-overflow-scrolling:touch;margin:.5em 0}
/* KaTeX：預設 .katex-display 不換行會撐破氣泡；強制容器內水平滾動 */
.msg .katex-display{display:block;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.2em 0;-webkit-overflow-scrolling:touch}
.msg .katex{white-space:normal}
.msg .katex-display>.katex{display:inline-block;white-space:nowrap}
.msg pre code{font-family:'LXGW WenKai TC',cursive;font-size:13px;line-height:1.5;background:none;padding:0}
.code-copy{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:11px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:4px;cursor:pointer;opacity:0;transition:opacity .2s}
.code-view{right:60px}
.msg pre:hover .code-copy{opacity:1}
.code-copy:hover{color:var(--accent);border-color:var(--accent)}

/* 程式碼預覽彈窗 */
.preview-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:94%;max-width:960px;height:86vh;display:flex;flex-direction:column;overflow:hidden}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;flex:0 0 auto}
.preview-head-actions{display:flex;gap:8px}
.preview-head .btn-cancel{width:auto;padding:6px 12px;margin:0}
#previewFrame{flex:1;width:100%;border:none;background:#fff}

/* 訊息列：⋮ 絕對定位於氣泡外側（user 左 / AI 右），PC hover 顯示；手機長按氣泡直接開選單 */
.msg-row{display:flex;position:relative;scroll-margin-top:10px;scroll-margin-bottom:10px}   /* scroll-margin：書籤／搜尋跳轉 block:'start' 時不貼平上緣 */
.msg-row.user{justify-content:flex-end}
.msg-menu-wrap{position:absolute;top:2px;z-index:5}
.msg-row.user .msg-menu-wrap{right:calc(100% + 6px)}
.msg-row.assistant .msg-menu-wrap{left:calc(100% + 6px)}
.msg-menu{display:block;width:24px;height:24px;z-index:100;border:none;background:transparent;color:var(--text2);font-size:15px;line-height:1;cursor:pointer;border-radius:50%;padding:0;opacity:0;visibility:hidden;transition:opacity .15s,background .2s}
.msg-menu:hover{background:var(--surface2)}
.msg-row:hover .msg-menu,.msg-row.menu-open .msg-menu{opacity:1;visibility:visible}
/* 朗讀中：正在朗讀的那則訊息，⋮ 下方顯示 ⏹ 停止朗讀（不需 hover，朗讀期間常駐可見；觸控裝置也看得到） */
.msg-tts-stop{display:none;width:24px;height:24px;margin-top:4px;border:none;background:transparent;color:#ef5350;font-size:12px;line-height:1;cursor:pointer;border-radius:50%;padding:0;animation:ttsPulse 1.4s ease-in-out infinite}
.msg-tts-stop:hover{background:var(--surface2)}
.msg-row.speaking .msg-tts-stop{display:block}
@keyframes ttsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.msg-dropdown{position:absolute;top:0;right:-36px;z-index:30;background:var(--surface2);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:132px;overflow:hidden;display:none}
.msg-row.assistant .msg-dropdown{left:auto;right:0}
.msg-dropdown.open{display:block}
.msg-dropdown.touch{position:fixed;z-index:1300;width:200px;max-width:calc(100vw - 24px);box-sizing:border-box}   /* 觸控長按：固定寬度，不隨長按座標撐開到邊緣；按鈕文字允許換行避免溢出 */
.msg-dropdown.touch button{white-space:normal;line-height:1.35;text-align:left}
/* 選單開啟時整列拉到最上層（蓋過其他訊息列）；下方空間不足時改向上展開（positionDropdown 處理），不會被輸入列遮住 */
.msg-row.menu-open{z-index:60}
.msg-dropdown.up{top:auto;bottom:100%;margin-bottom:6px}
.msg-dropdown button{display:block;width:100%;text-align:left;padding:8px 14px;font-size:13px;background:none;border:none;color:var(--text);cursor:pointer;white-space:nowrap}
.msg-dropdown button:hover{background:var(--surface);color:var(--accent)}
/* 三之1：可點擊的 🔍 時間徽章（有搜尋來源記錄時）與來源面板 */
.msg-time.clickable{pointer-events:auto;cursor:pointer;transition:color .15s}
.msg-time.clickable:hover{color:var(--accent)}
.sources-query{font-size:12px;color:var(--text2);margin:-8px 0 10px;word-break:break-all}
.sources-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sources-list a{display:block;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);text-decoration:none;line-height:1.45}
.sources-list a:hover{border-color:var(--accent)}
.sources-list .src-title{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.sources-list .src-url{display:block;font-size:11px;color:var(--text2);word-break:break-all}
/* 觸控裝置：不出現 ⋮（長按直接開選單）；長按中禁止文字選取 */
@media(hover:none){
  .msg-row:hover .msg-menu,.msg-row.menu-open .msg-menu{opacity:0;visibility:hidden}
  .msg-row.pressing .msg{-webkit-user-select:none;user-select:none}
  /* 當前選中的對話直接顯示操作圖示（其他對話維持長按顯示）；長按對話列不觸發反白 */
  .chat-item.active .act,.chat-item.active .del{opacity:1}
  .chat-item{-webkit-user-select:none;user-select:none}
  .chat-item input{-webkit-user-select:text;user-select:text}
}

/* 錯誤訊息 */
.msg.error{background:rgba(120,60,60,.35);border:1px solid rgba(220,120,120,.4);color:#e8b8b8;font-size:13px}

/* 思考過程（reasoning）摺疊區塊 */
.thinking{margin-bottom:8px;font-size:12px;color:var(--text2)}
.thinking summary{cursor:pointer;user-select:none;opacity:.8}
.thinking summary:hover{opacity:1}
.thinking-body{margin-top:6px;padding:8px 12px;background:rgba(0,0,0,.2);border:2px solid var(--border);border-radius:4px;white-space:pre-wrap;word-break:break-word}

/* 回到最新按鈕 */
.main{position:relative}
.scroll-bottom{position:absolute;right:20px;bottom:110px;width:36px;height:36px;border-radius:25%;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:16px;cursor:pointer;display:none;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.scroll-bottom.show{
  color:var(--text);
  display:block;
  border: 1px solid #ffffff30;
  box-shadow: inset 0 -10px 24px 12px rgba(255, 255, 255, .12), inset 0 -16px 8px rgba(250, 250, 250, .3);
}
.scroll-bottom:hover{color:var(--accent);border-color:var(--accent)}

/* 側邊欄：搜尋與項目操作 */
.chat-search{margin:8px 8px 0;padding:8px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;width:calc(100% - 16px)}
.chat-search:focus{border-color:var(--accent)}
.rename-input{flex:1;min-width:0;font-size:13px;background:var(--input-bg);border:1px solid var(--accent);border-radius:4px;color:var(--text);padding:2px 6px;outline:none}

/* 停止按鈕狀態 */
/* 停止鈕配色跟隨各主題的 AI 氣泡背景與文字色 */
.btn-send.stop{background:var(--ai-stop-bg,linear-gradient(150deg,rgba(88,108,88,.9),rgba(70,90,75,.9)));color:var(--ai-stop-fg,var(--msg-ai))}
body[data-theme="priconne"]{--ai-stop-bg:linear-gradient(150deg,#eee0ff,#d9c4fa);--ai-stop-fg:#7c4a9e}
body[data-theme="cream"]{--ai-stop-bg:linear-gradient(150deg,#ece7d2,#dcd4b4);--ai-stop-fg:#6b5e3c}
body[data-theme="matcha"]{--ai-stop-bg:linear-gradient(150deg,#f0f2df,#dfe4c6);--ai-stop-fg:#55663d}
body[data-theme="blue"]{--ai-stop-bg:linear-gradient(150deg,#e4f2fc,#cfe6f5);--ai-stop-fg:#2f5a78}
body[data-theme="wine"]{--ai-stop-bg:linear-gradient(150deg,#4a2c38,#38222b);--ai-stop-fg:#d8aeb9}
body[data-theme="gray"]{--ai-stop-bg:linear-gradient(150deg,#34383d,#2b2f34);--ai-stop-fg:#b0b8c2}
body[data-theme="orange"]{--ai-stop-bg:linear-gradient(150deg,#fbeed2,#f4ddb0);--ai-stop-fg:#7a5624}
body[data-theme="inkgold"]{--ai-stop-bg:linear-gradient(150deg,#20362c,#152822);--ai-stop-fg:#d8bb83}
body[data-theme="mistyslate"]{--ai-stop-bg:linear-gradient(150deg,#eef3f9,#dbe5f1);--ai-stop-fg:#065f67}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100%;height:100dvh;height:100svh;z-index:50;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .scroll-bottom{bottom:100px;right:14px}
}

/* ===== 橫向矮螢幕（手機轉橫向）：只收緊高度相關間距，寬度/斷點邏輯不動 =====
   條件同時要求 landscape + 高度不足，避免影響 PC（PC 高度通常 >500px，
   即使視窗拉矮也不會同時符合 landscape+小寬度以外的條件太多；且此處只改 padding/高度上限） */
@media(orientation:landscape) and (max-height:500px){
  .header{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
  .messages{padding:12px;gap:10px}
  .input-area{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  #msgInput{max-height:84px;min-height:38px}
  .modal{padding:14px 16px;max-height:calc(100dvh - 16px);max-height:calc(100svh - 16px)}
  .modal h3{margin-bottom:10px}
  .modal-actions{margin-top:10px}
  .msg .msg-img{max-width:180px;max-height:150px}
  .scroll-bottom{bottom:86px}
  /* 側欄若在橫向被打開：高度不足時寵物圖/裝飾不佔空間，把空間留給對話清單與設定鈕 */
  .sidebar .pet{display:none !important}
  .sidebar-header{padding:10px 12px}
  .sidebar-footer{padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
}

/* 小寵物顯示切換（由 applyTheme() 以 JS 控制） */
.pet{display:none}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{animation:sway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}
.flap{animation:flap 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes riseFade{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-44px);opacity:0}}
.bubble{animation:riseFade 3.4s ease-in infinite;transform-box:fill-box}
.steam{animation:riseFade 4.2s ease-in-out infinite;transform-box:fill-box}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.drift{animation:drift 5s ease-in-out infinite;transform-box:fill-box}
#petMistyslate svg{display:block;margin:0 auto;will-change:transform;animation:petFloat 4s ease-in-out infinite}
@keyframes petFloat{0%,100%{transform:translateY(0) scale(1,.96)}30%{transform:translateY(-10px) scale(.99,1.02)}}
/* ===== 白蘿蔔寵物動畫（僅 #petCream，其他寵物不受影響）===== */
#petCream svg{display:block;margin:0 auto;will-change:transform;animation:petFloat 4s ease-in-out infinite}
@keyframes petFloat{0%,100%{transform:translateY(0) scale(1,.96)}30%{transform:translateY(-10px) scale(.99,1.02)}}
/* 身體微微左右搖晃 */
#petCream #radishSway{transform-box:fill-box;transform-origin:50% 20%;animation:petBodySway 4.2s ease-in-out infinite}
@keyframes petBodySway{animation:rad-body-sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
/* 眨眼：以眼睛自身中心做 scaleY */
#petCream .pet-eye{transform-box:fill-box;transform-origin:center;animation:petBlink 4.6s linear infinite}
@keyframes petBlink{0%,88%,100%{transform:scale(1,1)}91%{transform:scale(1.15,.12)}94%{transform:scale(1,1)}96%{transform:scale(1.15,.1)}}
/* 腮紅呼吸 */
#petCream .pet-blush{opacity:.72;transform-box:fill-box;transform-origin:center;animation:petBlush 3.2s ease-in-out infinite}
@keyframes petBlush{0%,100%{opacity:.72;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
/* 葉子輕擺 */
#petCream #radishLeaves{transform-box:fill-box;transform-origin:50% 100%;animation:petLeafSway 4.2s ease-in-out infinite}
@keyframes petLeafSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
/* 雙手同時小幅換姿（平時檔案姿勢，偶爾切另一組位置；包 g 層動，原 ellipse 姿勢不受影響） */
#petCream .pet-hand{transform-box:fill-box;transform-origin:50% 90%;animation:petHandShift 8s ease-in-out infinite}
#petCream .hand-back{--dx:4px;--dr:-10deg}
#petCream .hand-front{--dx:-4px;--dr:10deg}
@keyframes petHandShift{0%,78%,100%{transform:translate(0,0) rotate(0)}78%,96%{transform:translate(var(--dx),0) rotate(var(--dr))}}
@media (prefers-reduced-motion:reduce){#petCream svg,#petCream svg *{animation:none !important}#petCream svg{will-change:auto}}

.lightbox-btn:hover{transform:scale(1.1);box-shadow:0 0 0 1px rgba(255,255,255,.4)}

#lbDownload{right:90px}
/* 燈箱左右切換：游標靠左右邊緣才顯示的箭頭（一般不顯示）；手機以滑動切換 */
.lb-nav{position:fixed;top:0;bottom:0;width:64px;display:none;align-items:center;justify-content:center;color:#fff;font-size:44px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:1001;user-select:none;-webkit-user-select:none}
.lb-prev{left:0;background:linear-gradient(to right,rgba(0,0,0,.4),transparent)}
.lb-next{right:0;background:linear-gradient(to left,rgba(0,0,0,.4),transparent)}
.lightbox:hover .lb-nav.avail{display:flex}
.lb-nav.avail:hover{opacity:1}
/* D5：Gallery 多選模式：選取中的縮圖 */
.gallery-item.selected{outline:2px solid var(--accent);outline-offset:-2px}
/* D6：搜尋跳轉時的訊息高亮 */
.msg-row.search-flash .msg{outline:2px solid var(--accent);outline-offset:2px}
/* 書籤：訊息氣泡上的小旗標記（只有被收藏的那一則會顯示） */
.msg-bm-flag{display:none;position:absolute;top:1px;right:-10px;font-size:13px;opacity:.9;pointer-events:none}
.msg-row.bm .msg-bm-flag{display:block}
/* 書籤清單面板 */
.bookmark-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.bookmark-item{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer}
.bookmark-item:hover{border-color:var(--accent)}
.bookmark-item .bm-main{flex:1;min-width:0}
.bookmark-item .bm-chat{font-size:15px;color:var(--text2);margin-bottom:2px;display:flex;align-items:center;gap:4px;min-width:0}
.bookmark-item .bm-chat .bm-title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookmark-item .bm-rename{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;padding:1px 5px;border-radius:6px;flex-shrink:0;line-height:1;opacity:.55;transition:opacity .2s,background .2s}
.bookmark-item .bm-chat:hover .bm-rename,.bookmark-item .bm-rename:focus-visible{opacity:1}
.bookmark-item .bm-rename:hover{background:var(--surface);color:var(--accent);opacity:1}
.bookmark-item .bm-text{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookmark-item .bm-time{font-size:11px;color:var(--text2);margin-top:2px}
.bookmark-item .bm-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;padding:2px 4px;flex-shrink:0;opacity:.55;transition:opacity .2s,background .2s}
.bookmark-item .bm-del:hover{opacity:1}
.bookmark-empty{text-align:center;color:var(--text2);font-size:13px;padding:20px}
/* 拖曳圖片到視窗上傳時的提示框 */
body.drag-over .main{outline:2px dashed var(--accent);outline-offset:-8px}
/* 對話內搜尋列（Ctrl+F） */
.header-btn{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1}
.header-btn:hover{background:var(--surface2);color:var(--accent)}
.header-btn.update{display:none;border:1px solid var(--accent);color:var(--text);font-size:13px;padding:5px 10px;white-space:nowrap;animation:updatePulse 1.6s ease-in-out infinite}
.header-btn.update:hover{background:var(--surface2);color:var(--accent)}
.header-btn.update.show{display:inline-block;}
@keyframes updatePulse{0%,100%{box-shadow:0 0 0 0 rgba(155,191,219,0)}50%{box-shadow:0 0 0 4px rgba(155,191,219,.18)}}
.find-bar{display:none;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.find-bar.open{display:flex}
.find-bar input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:13px;outline:none}
.find-bar input:focus{border-color:var(--accent)}
.find-count{font-size:12px;color:var(--text2);white-space:nowrap;min-width:56px;text-align:center}
.find-bar button{padding:4px 10px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:13px;cursor:pointer;line-height:1.4}
.find-bar button:hover{border-color:var(--accent);color:var(--accent)}
/* P2：分段漸進渲染的「載入更早訊息」提示（可點擊；IntersectionObserver 的保底操作） */
.msg-top-sentinel{align-self:center;cursor:pointer;user-select:none;font-size:12px;color:var(--text2);padding:6px 14px;border:1px solid var(--border);border-radius:999px;background:var(--input-bg);margin:0 auto}
.msg-top-sentinel:hover,.msg-top-sentinel:focus-visible{color:var(--text);border-color:var(--accent);outline:none}
/* B2：串流出錯但已有部分內容時的錯誤註記（直接標在該則訊息下方） */
.msg-errnote{margin-top:8px;padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.5;word-break:break-word;background:rgba(200,60,60,.14);border:1px solid rgba(200,60,60,.35);color:#ef5350}
/* 對話內搜尋：命中關鍵字高亮 */
.msg mark.chatcat-hit{background:rgba(255,214,0,.45);color:inherit;border-radius:3px;padding:0 1px}
.msg mark.chatcat-hit.cur{background:#ffb300;color:#1a1a1a;box-shadow:0 0 0 2px rgba(255,179,0,.35)}
/* 從燈箱刪除圖片時，確認彈窗暫時拉到燈箱上層 */
#confirmModal.above-lightbox{z-index:1100}
/* C6 繼續生成按鈕 */
.continue-btn{display:block;margin-top:8px;padding:6px 12px;font-size:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer}
.continue-btn:hover{color:var(--accent);border-color:var(--accent)}
/* C3 訊息時間戳（長按選單第一行） */
.menu-time{padding:6px 14px 4px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap}
/* C3 訊息時間戳小氣泡：疊在訊息氣泡下緣邊線上（中心對齊邊線）、上層顯示；
   user 靠右、AI 靠左，且各留 8px 不貼齊訊息氣泡邊緣；樣式跟隨所屬氣泡 */
.msg-time{position:absolute;top:calc(100% - 9px);z-index:2;height:18px;line-height:18px;padding:0 10px;
  font-size:10px;border-radius:6px;white-space:nowrap;pointer-events:none;
  background:var(--msg-user-bg);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.msg-row.user .msg-time{right:8px}
.msg-row.assistant .msg-time,.msg-row.error .msg-time{left:8px;background:var(--msg-ai-bg);color:var(--msg-ai)}
/* C12 語音輸入（僅支援的瀏覽器顯示） */
.btn-mic:not(.enabled){display:none}
.btn-mic.listening{background:linear-gradient(160deg,rgba(255,214,110,.85),rgba(245,160,80,.75));border-color:rgba(255,234,120,.9);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.btn-send.hidden,.btn-mic.hidden{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,110,110,.5)}50%{box-shadow:0 0 0 6px rgba(255,110,110,0)}}
/* C2 側欄寵物＝匯出／匯入入口 */
.pet{cursor:pointer}
/* C9 Gallery：右上入口 + 格狀縮圖 */
.gallery-btn{margin-left:auto;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1}
.gallery-btn:hover{background:var(--surface2);color:var(--accent)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:56vh;overflow-y:auto;padding:4px}
.gallery-item{position:relative;background:var(--surface2)}
.gallery-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px 12px 6px 6px;display:block;cursor:zoom-in}
.gallery-item-info{font-size:10px;color:var(--text2);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-item-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.gallery-item:hover .gallery-item-actions,.gallery-item:focus-within .gallery-item-actions{opacity:1}
.gallery-item-actions button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer;line-height:1}
.gallery-item-actions button:hover{background:rgba(0,0,0,.75)}
/* 圖片庫關閉列：內容過長時固定在 modal 可視底部，不必捲到最底才能關閉（手機縮圖多時尤其需要） */
#galleryModal .modal-actions{position:sticky;bottom:0;margin:8px -20px -20px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 10px rgba(0,0,0,.18)}
/* 圖片庫：彈窗本體不捲動（只有縮圖區內部捲動），高度自適應裝置可視範圍，避免出現多餘的外層 scrollbar */
#galleryModal .modal{display:flex;flex-direction:column;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);max-height:calc(100svh - 24px);overflow:hidden}
#galleryModal .gallery-grid{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;align-content:start}
</style>
</head>

<!-- 設定彈窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙ 設定</h3>
    <div class="field-row">
      <div class="field">
        <label>API 端點</label>
        <input type="text" id="settingEndpoint" value="https://apihub.agnes-ai.com/v1">
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="settingKey" placeholder="．．．．．．．．．．．．">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>模型</label>
        <input type="text" id="settingModel" value="agnes-2.5-flash">
        <select id="settingModelSelect" style="display:none"></select>
      </div>
      <div class="field">
        <label>主題</label>
        <select id="settingTheme" onchange="previewTheme(this.value)">
          <option value="default">經典深色</option>
          <option value="blue">晴空水藍</option>
          <option value="cream">典雅米白</option>
          <option value="matcha">和風清新</option>
          <option value="inkgold">墨玉鎏金</option>
          <option value="wine">微醺酒紅</option>
          <option value="mistyslate">霧藍沉韻</option>
          <option value="orange">鮮橙柑橘</option>
          <option value="gray">靜謐月夜</option>
          <option value="priconne">粉嫩公主</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>圖片模型</label>
        <input type="text" id="settingImageModel" value="agnes-image-2.1-flash">
      </div>
      <div class="field">
        <label>圖片尺寸</label>
        <select id="settingImageSize">
          <option value="1024">1024</option>
          <option value="2K" selected>2K</option>
          <option value="4K">4K</option>
        </select>
      </div>
      <div class="field">
        <label>圖片比例</label>
        <select id="settingImageRatio">
          <option value="1:1">1:1（方形）</option>
          <option value="4:3">4:3（橫式）</option>
          <option value="3:4">3:4（直式）</option>
          <option value="16:9">16:9（橫式）</option>
          <option value="9:16" selected>9:16（直式）</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>人格</label>
      <select id="settingPersona" onchange="updatePersonaDesc()"></select>
      <!-- 內建人格：顯示原本的簡短描述；自訂人格：同一個位置改成可輸入的設定欄（版面不動） -->
      <div id="personaDesc" style="text-align:center;font-size:12px;color:var(--text2);margin-top:4px;min-height:16px"></div>
      <div id="personaCustom" style="display:none;margin-top:6px">
        <textarea id="personaPrompt" rows="4" placeholder="請輸入這個自訂人格的設定" style="resize:vertical;font-size:12px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px"></textarea>
        <div style="display:flex;justify-content:space-evenly;margin-top:6px">
          <button class="btn-cancel" id="btnPersonaRename" type="button" style="font-size:11px;border:0">✏️ 重新命名人格</button>
          <button class="btn-cancel" id="btnPersonaDel" type="button" style="font-size:11px;border:0">🗑️ 刪除當前人格</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>溫度</label>
      <select id="settingTemp" style="font-size:12px">
        <option value="0.1">0.1：精確回答（數理計算、科學問題）</option>
        <option value="0.2">0.2：嚴謹回答（程式除錯、技術分析）</option>
        <option value="0.3">0.3：邏輯回答（知識問答、專業建議）</option>
        <option value="0.4">0.4：穩定回答（一般問題、教學解說）</option>
        <option value="0.5">0.5：自然回答（日常對話、一般創作）</option>
        <option value="0.6" selected>0.6：靈活回答（文案、故事內容改寫）</option>
        <option value="0.7">0.7：創意回答（角色設定、遊戲設計）</option>
        <option value="0.8">0.8：高創意回答（小說劇情、世界觀創作）</option>
        <option value="0.9">0.9：更加有創意（腦力激盪、藝術性創作）</option>
        <option value="1.0">1.0：最大隨機性（自由發想、實驗性創作）</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>最大輸出 Tokens</label>
        <input type="number" id="settingMaxTokens" min="256" max="65536" step="256" value="16384">
      </div>
      <div class="field">
        <label>傳送上下文則數</label>
        <select id="settingCtx">
          <option value="10">最近 10 則</option>
          <option value="20">最近 20 則</option>
          <option value="30">最近 30 則</option>
          <option value="40">最近 40 則</option>
          <option value="all">全部歷史</option>
        </select>
      </div>
      <div class="field">
        <label>空間提醒門檻 (MB)</label>
        <input type="number" id="settingStorageWarn" min="50" step="50" value="1000" style="width:100%">
      </div>
    </div>
    <div class="field-row">
      <div class="field" style="grid-column:1/-1">
        <label>送出鍵</label>
        <select id="settingSendKey" style="font-size:12px">
          <option value="auto">自動（觸控裝置 Enter 換行／電腦 Enter 送出）</option>
          <option value="enter">Enter 送出（Shift+Enter 換行）</option>
          <option value="ctrlenter">Ctrl / ⌘ + Enter 送出（Enter 換行）</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px">
          <input type="checkbox" id="settingAutoScroll" checked style="width:auto">自動捲動訊息
        </label>
      </div>
      <div class="field">
        <label title="嘗試關閉模型思考以加快回覆；模型不支援時自動降級，仍會要求模型省略思考" style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px">
          <input type="checkbox" id="settingQuickReply" checked style="width:auto">快速回覆模式
        </label>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px">
          <input type="checkbox" id="settingThinking" style="width:auto">顯示思考過程
        </label>
      </div>
    </div>
    <div class="field">
      <textarea id="settingSystem" rows="3" placeholder="這裡可輸入你自訂的回覆規則" style="resize:vertical"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-reset" onclick="resetSettings()">↺ 預設</button>
      <button class="btn-cancel" onclick="closeSettings()">關閉</button>
      <button class="btn-save" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<!-- 確認彈窗 -->
<div class="modal-overlay confirm-overlay" id="confirmModal">
  <div class="confirm-modal">
    <p id="confirmMsg"></p>
    <div class="modal-actions" style="margin-top:0">
      <button class="btn-cancel" id="confirmNo">取消</button>
      <button class="btn-save" id="confirmYes">確定</button>
    </div>
  </div>
</div>

<!-- 自訂人格命名／重新命名彈窗 -->
<div class="modal-overlay confirm-overlay" id="personaNameModal">
  <div class="confirm-modal">
    <p id="personaNameMsg"></p>
    <input type="text" id="personaNameInput" maxlength="30" placeholder="請輸入人格名稱">
    <div class="modal-actions" style="margin-top:0">
      <button class="btn-cancel" id="personaNameNo">取消</button>
      <button class="btn-save" id="personaNameYes">確定</button>
    </div>
  </div>
</div>

<!-- 書籤重新命名彈窗（疊在書籤清單上；僅改書籤顯示，不動原對話） -->
<div class="modal-overlay confirm-overlay" id="bookmarkRenameModal">
  <div class="confirm-modal">
    <p id="bookmarkRenameMsg"></p>
    <input type="text" id="bookmarkRenameInput" maxlength="30" placeholder="請輸入書籤名稱">
    <div class="modal-actions" style="margin-top:0">
      <button class="btn-cancel" id="bookmarkRenameNo">取消</button>
      <button class="btn-save" id="bookmarkRenameYes">確定</button>
    </div>
  </div>
</div>

<!-- 三之1 搜尋來源面板（🔍 徽章／選單「查看來源」開啟）-->
<div class="modal-overlay" id="sourcesModal">
  <div class="modal" style="max-width:520px">
    <h3>🔍 搜尋來源</h3>
    <p id="sourcesQuery" class="sources-query"></p>
    <div id="sourcesList" class="sources-list"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="sourcesClose" type="button">✕ 關閉</button>
    </div>
  </div>
</div>

<!-- 程式碼預覽彈窗（沙箱 iframe，不含 same-origin，無法存取主頁資料）-->
<div class="modal-overlay" id="previewModal">
  <div class="preview-modal">
    <div class="preview-head">
      <span>👁 即時預覽</span>
      <div class="preview-head-actions">
        <button class="btn-cancel" id="previewOpen" type="button">↗ 新視窗開啟</button>
        <button class="btn-cancel" id="previewClose" type="button">✕ 關閉</button>
      </div>
    </div>
    <!-- sandbox 不給 allow-top-navigation / allow-same-origin：預覽內容無法把整頁導走，也碰不到主頁資料 -->
    <iframe id="previewFrame" title="程式碼預覽" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
  </div>
</div>

<!-- C1 圖片燈箱 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-btn" id="lbClose" type="button" title="關閉 (Esc／返回鍵)">✖️</button>
  <button class="lightbox-btn" id="lbDelete" type="button" title="刪除圖片">🗑️</button>
  <button class="lightbox-btn" id="lbDownload" type="button" title="下載圖片">💾</button>
  <img id="lbImg" alt="放大圖片">
  <div class="lb-nav lb-prev" id="lbPrev" title="上一張">‹</div>
  <div class="lb-nav lb-next" id="lbNext" title="下一張">›</div>
</div>

<!-- C2 匯出／匯入對話 -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <h3>📦 匯出／匯入對話</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px"></p>
    <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
      <input type="checkbox" id="exportWithImages" checked style="width:auto;margin-top:2px">
      <span>包含圖片資料（圖片以 dataURL 內嵌）。<br>不勾選時，僅保留圖片 id，但要注意：<br>匯入後需原裝置上已有該圖，否則會顯示替代外觀</span>
    </label>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn-save" id="btnExportAll" type="button" style="width:100%;">匯出<br>全部對話</button>
      <button class="btn-save" id="btnExportCurrent" type="button" style="width:100%;">匯出<br>當前對話</button>
      <button class="btn-save" id="btnExportMd" type="button" style="width:100%;">匯出<br>當前Markdown</button>
      <button class="btn-save" id="btnExportHtml" type="button" style="width:100%;">匯出<br>當前HTML</button>
    </div>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn-cancel" id="btnImportPick" type="button">📥  匯入對話 JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn-cancel" id="btnExportClose" type="button">關閉</button>
    </div>
  </div>
</div>

<!-- C-edit：編輯並重送確認（覆寫並重送／另開對話分支／取消）-->
<div class="modal-overlay" id="editBranchModal">
  <div class="modal">
    <h3>✏️ 編輯並重送</h3>
    <p id="editBranchMsg" style="font-size:13px;color:var(--text2);margin:4px 0 8px;white-space:pre-wrap"></p>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn-save" id="editOverwrite" type="button" style="width:100%">覆寫並重送<br><span style="font-size:11px;opacity:.8">（之後的對話會被刪除）</span></button>
      <button class="btn-save" id="editBranch" type="button" style="width:100%">另開對話分支<br><span style="font-size:11px;opacity:.8">（原對話保留）</span></button>
    </div>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn-cancel" id="editCancel" type="button">取消</button>
    </div>
  </div>
</div>

<!-- C9 圖片 Gallery -->
<div class="modal-overlay" id="galleryModal">
  <div class="modal" style="max-width:720px">
    <h3>🖼️ 圖片庫</h3>
    <div class="field-row" style="justify-content: space-between;">
    <h3> </h3>
    <div style="margin-top:-20px;font-size:13px">
    <span id="galleryUsage" style="color:var(--accent)"></span>
    </div>
    </div>
    <div style="margin-top:-18px;margin-bottom:10px;margin-right:4px;text-align:right">
    <button class="btn-cancel" id="btnGallerySelect" type="button" style="font-size:11px;border:0;">☑️ 多選操作</button>
    <button class="btn-cancel" id="btnCompressImages" type="button" style="font-size:11px;border:0;">🗜️ 壓縮圖片</button>
    <button class="btn-cancel" id="btnCleanOrphan" type="button" style="font-size:11px;border:0;">🧹 清理未被引用的圖片</button>
    </div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">壓縮圖片可節省空間佔用，注意：此操作不可逆。<br>如有特定圖片需要無壓縮的原檔，請在壓縮前先下載。<br>以下是透過本頁面保存在裝置上的所有圖片；點縮圖可放大。<br>刪除後，引用它的訊息文字會保留、圖片則顯示「已刪除」。<br>點選上方的多選按鈕，可對多個圖片選取並同時操作。</p>
    <div id="galleryBatchBar" style="display:none;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;flex-wrap:wrap">
      <span id="gallerySelCount">已選 0 張</span>
      <button class="btn-cancel" id="btnBatchDownload" type="button" style="font-size:11px;">💾 下載</button>
      <button class="btn-cancel" id="btnBatchCompress" type="button" style="font-size:11px;">🗜️ 壓縮</button>
      <button class="btn-cancel" id="btnBatchDelete" type="button" style="font-size:11px;">🗑️ 刪除</button>
      <button class="btn-cancel" id="btnBatchCancel" type="button" style="font-size:11px;">❎ 取消選取</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn-cancel" id="btnGalleryClose" type="button">關閉</button>
    </div>
  </div>
</div>

<!-- 書籤清單（🔖）：跨對話列出所有收藏的訊息，點一下直接跳過去 -->
<div class="modal-overlay" id="bookmarkModal">
  <div class="modal" style="max-width:520px">
    <h3>🔖 書籤</h3>
    <div id="bookmarkList" class="bookmark-list"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnBookmarkClose" type="button">關閉</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

三年之内连遭祸，事事教君没始终。","{xx.tail}":"尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。","{xx.ji}":"箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。","{xx.dou}":"斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。","{xx.niu}":"牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。","{xx.nv}":"女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。","{xx.xu}":"虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。","{xx.wei}":"危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。","{xx.shi}":"室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。","{xx.qiang}":"壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。","{xx.kui}":"奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。"},ZHENG:{"{xx.jiao}":"{wx.mu}","{xx.jing}":"{wx.mu}","{xx.kui}":"{wx.mu}","{xx.dou}":"{wx.mu}","{xx.kang}":"{wx.jin}","{xx.gui}":"{wx.jin}","{xx.lou}":"{wx.jin}","{xx.niu}":"{wx.jin}","{x //           SEARCH_KEYWORDS / BUILTIN_PERSONAS＋自訂人格
//   [CDN]   LIB_SOURCES（marked、DOMPurify 備援）/ KATEX_SOURCES（延遲載入）/ ensureLibs / loadKatex
//   [儲存]  IndexedDB：openDB / idbRun / loadChatsAsync / saveChatsData / mediaPut / mediaGet / mediaDel
//   [去重]  mediaHash / mediaFindByHash / mediaPutDedup / delMediaIds（仍被引用就不刪）
//   [渲染]  renderMessages / msgHtml / renderContent / finalBodyHtml / fitMathBlocks / fitPendingMath
//   [串流]  fetchWithRetry / requestAI / requestImage / performSearch / tryCwaWeather / tryCwaQuake
//   [對話]  newChat / setActiveChat / deleteChat / renderChatList / autoTitle
//   [對話內搜尋] runFind / highlightRow / highlightRenderedRows / jumpToSearchMatches
//   [書籤]  collectBookmarks / renderBookmarkList / openBookmarkModal
//   [草稿]  saveDraft / scheduleDraft / applyDraft
//   [附件]  addImageFiles（選檔／拖放／貼上三合一）/ renderAttachBar / compressToJpeg
//   [朗讀]  toggleSpeak / ttsStop
//   [UI]    showToast / showConfirm / showProgress / histPush / histPop（返回鍵分層）
//   [PWA]   setupServiceWorker（./sw.js）/ setupManifest（./manifest.webmanifest）
//   逾時與節流一律取 TIMEOUT / CONFIG，不要再在函式裡寫死數字
// ============================================================
let settings=loadSettings();
let chats={};           // 啟動時由 loadChatsAsync() 載入（四：對話已搬遷至 IndexedDB）
let activeChatId=null;
let isStreaming=false;
let pendingImages=[];   // 待發送的圖片 {id,url} 陣列
                        // id → IndexedDB 的圖片 id（原始資料的唯一來源）
                        // url → 預覽用 objectURL（Blob 才會建；dataURL 直接沿用字串）
                        // 舊版在這裡存整份 dataUrl 字串，多張大圖同時待送時很吃記憶體
const pendingUrls=new Set();   // 待送圖片的預覽 URL，移除附件／送出後統一釋放
function trackPendingUrl(u){if(u&&u.indexOf('blob:')===0)pendingUrls.add(u);return u}
function revokePendingUrl(u){
  if(u&&u.indexOf('blob:')===0){try{URL.revokeObjectURL(u)}catch(e){}}
  pendingUrls.delete(u);
}
function previewUrlFor(data){
  if(data==null)return '';
  if(typeof data==='string')return data;   // dataURL 字串：直接用，不另建 objectURL
  return trackPendingUrl(URL.createObjectURL(data));
}
function clearPendingImages(){
  pendingImages.forEach(p=>revokePendingUrl(p.url));
  pendingImages=[];
}
let pendingQueue=null;   // D8：串流中排隊的下一則訊息 {text,images}
let abortCtrl=null;     // 串流中斷控制器
let imgMode=false;      // 圖片模式：ON 時送出改呼叫圖片模型（文生圖 / 圖生圖）

// ===== A2：blob URL 追蹤（渲染建立的 objectURL 統一記錄，重建訊息區時釋放）=====
const blobUrlRegistry=new Set();
function trackBlobUrl(u){if(u&&u.indexOf('blob:')===0)blobUrlRegistry.add(u);return u}
function revokeRenderBlobUrls(){
  blobUrlRegistry.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  blobUrlRegistry.clear();
}
// ===== B1：訊息渲染快取（以訊息物件為 key；WeakMap 不會被 JSON.stringify 存進 localStorage）=====
// 兩層快取：
//   renderCache    → renderContent 的輸出（markdown 剖析 ＋ DOMPurify 消毒）
//   finalHtmlCache → 再經 enhanceCodeBlocks（程式碼按鈕）＋ renderMath（KaTeX）後的「列內最終 HTML」
// 兩者必須同時失效：renderContent 的輸出會受設定影響（例如 getShowThinking() 決定要不要輸出思考區塊），
// 舊程式碼從不清除快取，導致「設定改了、切換對話後卻拿到舊結果」。
let renderCache=new WeakMap();
let finalHtmlCache=new WeakMap();
function invalidateRenderCache(){renderCache=new WeakMap();finalHtmlCache=new WeakMap()}
function renderContentCached(m){
  if(renderCache.has(m))return renderCache.get(m);
  const html=renderContent(m);
  try{renderCache.set(m,html)}catch(e){}
  return html;
}
// 「已定稿」訊息的列內最終 HTML（含程式碼區塊按鈕與 KaTeX DOM）。
// 重建訊息區時直接把這段字串灌回 DOM，markdown／消毒／KaTeX／按鈕全部不必重跑。
// 注意：fitMathBlocks 的結果**不進快取**——它是依容器寬度算出來的 inline font-size，
// 快取後視窗縮放或手機橫豎屏就會失真，所以 renderMath 傳 skipFit=true，改由插入 DOM 後統一執行。
function finalBodyHtml(m){
  if(finalHtmlCache.has(m))return finalHtmlCache.get(m);
  const stage=document.createElement('div');
  stage.innerHTML=renderContentCached(m);
  enhanceCodeBlocks(stage);
  renderMath(stage,true);
  const html=stage.innerHTML;
  try{finalHtmlCache.set(m,html)}catch(e){}
  return html;
}
// ===== A1：收集訊息／對話引用的圖片 id，並自 IndexedDB 刪除 =====
function collectMsgImageIds(m){
  const ids=[];
  if(m&&Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id)ids.push(p.id)});
  return ids;
}
function collectChatImageIds(c){
  const ids=[];
  ((c&&c.messages)||[]).forEach(m=>ids.push(...collectMsgImageIds(m)));
  return ids;
}
// 刪除圖片：只刪「沒有任何其他訊息在引用」的 id。
// 圖片去重後同一個 id 可能被多則訊息共用（修改圖片、重複附同一張圖），
// 若無條件刪除，會讓還在的訊息突然變成「圖片已刪除」佔位；孤兒圖交給「清理未引用圖片」處理。
async function delMediaIds(ids){
  if(!ids||!ids.length)return;
  const used=new Set();
  Object.values(chats).forEach(c=>collectChatImageIds(c).forEach(i=>used.add(i)));
  for(const id of ids){
    if(used.has(id))continue;
    try{await mediaDel(id)}catch(e){}
  }
}
// ===== B2：saveChatsData debounce（300ms；重點時刻呼叫 saveChatsDataNow() 立即寫入）=====
// A1 差異化寫入：只有被標記 dirty 的對話才寫進 IndexedDB，避免每次存檔都重寫全部對話。
// saveChatsData(c, id) 可傳入變更的對話 id（或 id 陣列）；未傳則保守地把全部對話標為 dirty。
let saveTimer=null,savePending=null;
const dirtyChatIds=new Set();
function saveChatsData(c,ids){
  savePending=c||chats;
  if(ids)(Array.isArray(ids)?ids:[ids]).forEach(id=>dirtyChatIds.add(id));
  else Object.keys(savePending).forEach(id=>dirtyChatIds.add(id));
  if(saveTimer)return true;   // 300ms 內的重複呼叫合併為一次寫入
  saveTimer=setTimeout(saveChatsDataNow,300);
  return true;
}
function saveChatsDataNow(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
  if(!savePending)return;
  const d=savePending;savePending=null;
  const ids=[...dirtyChatIds].filter(id=>d[id]);dirtyChatIds.clear();
  if(!ids.length)return;
  // 四：寫入 IndexedDB（只寫 dirty 的對話；失敗只提示，不影響畫面）
  idbPutChats(d,ids).catch(e=>{
    backupLocalStorageChats(d);   // A2：IndexedDB 寫入失敗時，立即退回 localStorage 備援
    showToast('儲存失敗：'+((e&&e.message)||e),'warn');
  });
}
// 同步備份到 localStorage：unload / 隱藏分頁時 IndexedDB 寫入可能不完成，留一份救援用；
// A2：平時 IndexedDB 寫入失敗時也會呼叫此函式備援（使用者全部刪除對話時會連帶清掉備份，避免「復活」已刪資料）
function backupLocalStorageChats(d){
  d=d||savePending||chats;
  try{
    if(d&&Object.keys(d).length)localStorage.setItem('all_chats',JSON.stringify(d));
    else localStorage.removeItem('all_chats');
  }catch(e){}
}
window.addEventListener('beforeunload',()=>{saveChatsDataNow();backupLocalStorageChats()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveChatsDataNow();backupLocalStorageChats()}});

function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('chat_settings')||'{}');
    return (s&&typeof s==='object'&&!Array.isArray(s))?s:{};   // 防禦：損毀/非物件內容一律視為空設定
  }catch(e){return {}}
}
function saveSettingsData(s){
  try{localStorage.setItem('chat_settings',JSON.stringify(s))}
  catch(e){showToast('設定儲存失敗：'+e.message,'warn')}
}
// ===== 四：IndexedDB 對話儲存（擺脫 localStorage 5MB 上限）=====
// B1：開庫與 transaction 樣板統一（media / chats 兩個 DB 共用同一套輔助函式）
function openDB(name,ver,onUpgrade){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('此瀏覽器不支援 IndexedDB'));return}
    let req;
    try{req=indexedDB.open(name,ver)}catch(e){rej(e);return}
    req.onupgradeneeded=()=>{if(onUpgrade)onUpgrade(req.result)};
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
// 執行單一 IDBRequest（get/getAll/put/delete）；makeReq(st) 回傳 request。
// 若 makeReq 執行多筆操作而回傳 null／undefined（如 idbPutChats 批次 put），
// 則改以交易本身的 complete/error 決定結果。
function idbRun(db,store,mode,makeReq){
  return new Promise((res,rej)=>{
    try{
      const tx=db.transaction(store,mode);
      const rq=makeReq(tx.objectStore(store));
      if(rq){
        rq.onsuccess=()=>{db.close();res(rq.result)};
        rq.onerror=()=>{db.close();rej(rq.error)};
      }else{
        tx.oncomplete=()=>{db.close();res()};
        tx.onerror=()=>{db.close();rej(tx.error)};
      }
      tx.onabort=()=>{db.close();rej(tx.error||new Error('write aborted'))};
    }catch(e){db.close();rej(e)}
  });
}
const APP_DB='chatcat_app',APP_DB_VER=1,APP_CHAT_STORE='chats';
function openAppDB(){return openDB(APP_DB,APP_DB_VER,db=>{if(!db.objectStoreNames.contains(APP_CHAT_STORE))db.createObjectStore(APP_CHAT_STORE,{keyPath:'id'})})}
function idbAllChats(){
  return openAppDB().then(db=>idbRun(db,APP_CHAT_STORE,'readonly',st=>st.getAll()));
}
// A1：ids 指定時只寫入這幾場對話；未指定則全量寫入（匯入／遷移等一次性操作用）
function idbPutChats(obj,ids){
  return openAppDB().then(db=>idbRun(db,APP_CHAT_STORE,'readwrite',st=>{
    const list=ids&&ids.length?ids.map(id=>obj[id]).filter(Boolean):Object.values(obj);
    list.forEach(c=>st.put(c));
    return null;
  }));
}
function idbDeleteChat(id){
  return openAppDB().then(db=>idbRun(db,APP_CHAT_STORE,'readwrite',st=>st.delete(id)));
}
// 啟動載入：IndexedDB 為主；若 IDB 空且 localStorage.all_chats 有資料 → 自動遷移
// （localStorage 保留為備份並加標記，不主動刪除；使用者可自行清空）
async function loadChatsAsync(){
  let idbOut=null;
  try{
    const recs=await idbAllChats();
    if(recs&&recs.length){
      const out={};
      recs.forEach(c=>{if(c&&c.id)out[c.id]=ensureChatMeta(c)});
      idbOut=out;
    }
  }catch(e){
    dbg('[Chat] IndexedDB 讀取失敗：',e&&e.message);
  }
  let lsObj=null;
  try{lsObj=JSON.parse(localStorage.getItem('all_chats')||'null')}catch(e){lsObj=null}
  if(lsObj&&typeof lsObj==='object'&&Object.keys(lsObj).length){
    Object.values(lsObj).forEach(ensureChatMeta);
  }else lsObj=null;
  // 取「最新活動時間較新」的來源：IDB 寫入失敗期間，localStorage 備援可能比 IndexedDB 新
  const newest=t=>{let m=0;Object.values(t||{}).forEach(c=>{const v=chatLastTime(c);if(v>m)m=v});return m};
  if(idbOut&&lsObj){
    if(newest(lsObj)>newest(idbOut)){
      // localStorage 備援較新（IDB 曾寫入失敗）→ 以備援為準並回寫 IndexedDB
      try{await idbPutChats(lsObj)}catch(e){}
      return lsObj;
    }
    return idbOut;
  }
  if(idbOut)return idbOut;
  if(lsObj){
    try{
      await idbPutChats(lsObj);
      localStorage.setItem('chatcat_idb_migrated',new Date().toISOString());   // 標記已遷移
      dbg('[Chat] 已將 localStorage 對話遷移至 IndexedDB：',Object.keys(lsObj).length,'場');
    }catch(e){
      dbg('[Chat] 遷移寫入 IndexedDB 失敗，續用 localStorage：',e&&e.message);
    }
    return lsObj;
  }
  return {};
}

// ===== IndexedDB 圖片儲存（上傳圖、生成圖都存這裡，避免撐爆 localStorage）=====
const MEDIA_DB='chatcat_media',MEDIA_DB_VER=1,MEDIA_STORE='images';
// C1：文字請求組上下文用的 dataURL 快取（同一張圖每輪請求不再重複 get+轉檔）
const mediaDataUrlCache=new Map();
const MEDIA_URL_CACHE_MAX=CONFIG.media.dataUrlCache;
// P6：顯示用圖片 URL 快取（id → {url,blob}）：重建訊息區時不必逐張重讀 IndexedDB。
// 與 mediaDataUrlCache 分開，因為這裡存的是「可直接餵給 <img src>」的 URL：
// dataURL 字串直接用；Blob 建出來的 objectURL 由本快取自己管釋放，
// **不**放進 blobUrlRegistry（那個是每次重建訊息區就整批撤銷的暫存 URL，會把快取裡的 URL 一起弄壞）。
const mediaDisplayCache=new Map();
const MEDIA_DISPLAY_CACHE_MAX=CONFIG.media.displayCache;
function mediaDisplayEvict(id){
  const e=mediaDisplayCache.get(id);
  if(!e)return;
  if(e.blob){try{URL.revokeObjectURL(e.url)}catch(err){}}
  mediaDisplayCache.delete(id);
}
async function mediaDisplayUrl(id){
  const hit=mediaDisplayCache.get(id);
  if(hit){mediaDisplayCache.delete(id);mediaDisplayCache.set(id,hit);return hit.url}   // LRU：命中就移到最新端
  const data=await mediaGet(id);
  if(data==null)return null;
  let url,blob=false;
  if(typeof data==='string')url=data;
  else{url=URL.createObjectURL(data);blob=true}
  if(mediaDisplayCache.size>=MEDIA_DISPLAY_CACHE_MAX)mediaDisplayEvict(mediaDisplayCache.keys().next().value);
  mediaDisplayCache.set(id,{url:url,blob:blob});
  return url;
}
// Gallery 快取髒標記：mediaPut／mediaDel（新增、刪除、壓縮覆寫、匯入等所有路徑）都會設 dirty；
// 開啟 Gallery 時若無變更就直接重用上次的內容與 blob URL，不必每次重新讀取 IndexedDB。
// gen 為世代計數：渲染期間若有變更，渲染完也不會誤清 dirty。
let galleryDirty=true;
let galleryGen=0;
function openMediaDB(){return openDB(MEDIA_DB,MEDIA_DB_VER,db=>{if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE,{keyPath:'id'})})}
// A7：extra 可附帶 urlOnly:true 等標記（遠端 URL 抓取失敗只存連結時用）
function mediaPut(id,data,createdAt,extra){
  if(mediaDataUrlCache.has(id))mediaDataUrlCache.delete(id);   // 資料更新，快取失效
  mediaDisplayEvict(id);                                       // P6：顯示快取一併失效
  galleryDirty=true;galleryGen++;   // Gallery 快取失效
  mediaRememberHash(data,id);       // 內容去重對照表
  return openMediaDB().then(db=>idbRun(db,MEDIA_STORE,'readwrite',st=>st.put(Object.assign({id,data,createdAt:createdAt||Date.now()},extra||{}))));
}
function mediaGet(id){
  return openMediaDB().then(db=>idbRun(db,MEDIA_STORE,'readonly',st=>st.get(id))).then(rec=>rec?rec.data:null);
}
function mediaDel(id){
  if(mediaDataUrlCache.has(id))mediaDataUrlCache.delete(id);   // 資料刪除，快取失效
  mediaDisplayEvict(id);                                       // P6：顯示快取一併失效
  galleryDirty=true;galleryGen++;   // Gallery 快取失效
  mediaForgetHash(id);              // 去重對照表一併清掉（避免指到已刪除的 id）
  return openMediaDB().then(db=>idbRun(db,MEDIA_STORE,'readwrite',st=>st.delete(id)));
}
// ===== 圖片內容去重：「修改圖片」不再無限複製同一張 =====
// 以「內容雜湊 → 媒體 id」對照表記住已存過的圖；加入同一張圖時直接沿用既有 id，
// 不再新增第二份相同的資料。沿用後該 id 會被多則訊息引用，因此 delMediaIds()
// 改為「還有別則訊息在引用就保留」，避免刪 A 訊息害 B 訊息的圖變佔位。
const MEDIA_HASH_KEY='chatcat_media_hash';
let mediaHashMap=loadMediaHashMap();
function loadMediaHashMap(){
  try{const o=JSON.parse(localStorage.getItem(MEDIA_HASH_KEY)||'{}');return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}}catch(e){return {}}
}
function saveMediaHashMap(){
  try{
    const keys=Object.keys(mediaHashMap);
    if(keys.length>2000)keys.slice(0,1000).forEach(k=>delete mediaHashMap[k]);   // 簡易淘汰：超過上限砍掉最舊的一批
    localStorage.setItem(MEDIA_HASH_KEY,JSON.stringify(mediaHashMap));
  }catch(e){}
}
function mediaForgetHash(id){
  let changed=false;
  Object.keys(mediaHashMap).forEach(h=>{if(mediaHashMap[h]===id){delete mediaHashMap[h];changed=true}});
  if(changed)saveMediaHashMap();
}
// 內容雜湊：優先用 WebCrypto SHA-256；不可用（例如部分 file:// 環境）時退回 FNV-1a。
// 僅供「同一張圖」比對，不做任何安全用途。
async function mediaHash(data){
  let bytes=null;
  try{
    if(typeof data==='string')bytes=new TextEncoder().encode(data);
    else if(data&&data.arrayBuffer)bytes=new Uint8Array(await data.arrayBuffer());
  }catch(e){bytes=null}
  if(!bytes||!bytes.length)return '';
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    try{
      const d=await crypto.subtle.digest('SHA-256',bytes);
      return 's'+Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
    }catch(e){}
  }
  let h=0x811c9dc5;
  for(let i=0;i<bytes.length;i++){h^=bytes[i];h=(h*0x01000193)>>>0}
  return 'f'+bytes.length.toString(36)+'_'+h.toString(36);
}
function mediaRememberHash(data,id){
  mediaHash(data).then(h=>{
    if(!h||!id)return;
    if(mediaHashMap[h]!==id){mediaHashMap[h]=id;saveMediaHashMap()}
  }).catch(()=>{});
}
// 找「內容完全相同」的既有圖片；找不到或指向的圖已被刪除則回傳 null
async function mediaFindByHash(data){
  const h=await mediaHash(data);
  if(!h)return null;
  const id=mediaHashMap[h];
  if(!id)return null;
  try{
    const d=await mediaGet(id);
    if(d!=null)return id;
  }catch(e){return null}
  delete mediaHashMap[h];saveMediaHashMap();   // 對照表指向已刪除的圖：清掉
  return null;
}
// 存圖（含去重）：內容已存在就回傳既有 id，否則建立新 id 後寫入
async function mediaPutDedup(data,prefix){
  try{
    const exist=await mediaFindByHash(data);
    if(exist)return exist;
  }catch(e){}
  const id='img_'+(prefix||'u')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  await mediaPut(id,data);
  return id;
}
function mediaAllEntries(){return openMediaDB().then(db=>idbRun(db,MEDIA_STORE,'readonly',st=>st.getAll()))}
// C1：id → dataURL（帶上限的 LRU 式快取）；圖片不存在回傳 null（不快取 null）
async function mediaToDataURL(id){
  if(mediaDataUrlCache.has(id)){
    const v=mediaDataUrlCache.get(id);
    mediaDataUrlCache.delete(id);mediaDataUrlCache.set(id,v);   // LRU：命中就移到最新端
    return v;
  }
  const data=await mediaGet(id);
  if(data==null)return null;
  const url=typeof data==='string'?data:await blobToDataURL(data);
  if(mediaDataUrlCache.size>=MEDIA_URL_CACHE_MAX){
    const oldest=mediaDataUrlCache.keys().next().value;
    mediaDataUrlCache.delete(oldest);
  }
  mediaDataUrlCache.set(id,url);
  return url;
}
// B3：媒體資料大小（dataURL 依 base64 估、Blob 取 size、遠端 URL 字串取長度）
function mediaDataSize(data){
  if(typeof data==='string')return Math.round((data.length-data.indexOf(',')-1)*0.75);
  return (data&&data.size)||0;
}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
// 為 <img data-media-id> 填入 IndexedDB 的圖片（P6：改走 mediaDisplayUrl 快取，重建時不再逐張讀 DB）
function hydrateMedia(root){
  if(!root)return;
  root.querySelectorAll('img[data-media-id]').forEach(img=>{
    const id=img.dataset.mediaId;
    if(!id||img.dataset.hydrated)return;
    img.dataset.hydrated='1';
    mediaDisplayUrl(id).then(url=>{
      if(url==null){
        // C9：圖片已被刪除（Gallery 刪除或孤兒清理）→ 訊息文字保留，圖片改顯示佔位框
        const ph=document.createElement('div');
        ph.className='msg-img-slot';
        ph.textContent='🖼️ 圖片已刪除';
        img.replaceWith(ph);
        return;
      }
      img.src=url;
    }).catch(()=>{});
  });
}
// 舊資料遷移：把歷史中已存的 image_url（dataURL 或可抓取的 URL）搬進 IndexedDB，
// 改存輕量的 image_ref，避免日後撐爆 localStorage；回傳是否完成
async function migrateLegacyMedia(){
  let dirty=false,migrated=0;
  for(const c of Object.values(chats)){
    for(const m of c.messages){
      const cont=m.content;
      if(!Array.isArray(cont))continue;
      for(const p of cont){
        if(p.type==='image_url'&&p.image_url&&p.image_url.url){
          const url=p.image_url.url;
          let data;
          if(url.startsWith('data:'))data=url;
          else{try{const blob=await(await fetch(url)).blob();data=blob}catch(e){continue}}
          if(data==null)continue;
          const id='img_mig_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
          try{await mediaPut(id,data);migrated++}catch(e){continue}
          p.type='image_ref';p.id=id;delete p.image_url;
          dirty=true;
        }
      }
    }
  }
  // 訊息物件被原地改成 image_ref：快取裡還是舊的 image_url HTML，必須失效並重繪
  if(dirty){saveChatsData(chats);invalidateRenderCache();if(chats[activeChatId])renderMessages(true)}
  return migrated;
}

// 一之7：收窄「後端不支援 tools」的判定
// 原本只要錯誤訊息出現 HTTP 4xx 或 tool/function 字樣就永久關閉工具，範圍過寬：
// 500 錯誤的 JSON 內文若剛好含 "function"、或 405/409 等無關狀態碼，也會誤關整個工作階段的工具。
// 改為：只有 400／404／422（典型的「不認得 tools 參數」回應）才直接判定不支援；
// 其餘 4xx 必須在訊息中明確提到 tool／function 才判定，且排除 401／403（金鑰問題）與 429（限流）。
function isToolsUnsupportedError(msg){
  const m=String(msg||'');
  const st=m.match(/HTTP\s+(4\d\d)\b/);
  if(!st)return false;                                  // 非 HTTP 4xx（逾時、網路錯誤）→ 與工具無關
  const code=parseInt(st[1],10);
  if(code===400||code===404||code===422)return true;
  return code!==401&&code!==403&&code!==429&&/tool|function/i.test(m);
}

// 不傳送結束訊號，自動關閉偵測；一旦又收到正常訊號就立即恢復。

  }
}

// 如需關閉代理走舊直連，把 Key 貼在設定面板的 API Key 欄即可，此陣列不再使用
const BACKUP_API_KEYS=[]; // ← 備用 Key 已搬到後端 AGNES_API_KEYS Secrets（逗號分隔），前端不再存放
// KEY_POOL.ptr 是輪替起點，KEY_POOL.fail 記錄各 Key 的冷卻到期時間（ms epoch）
const KEY_POOL={ptr:0,fail:{}};
function getKeyPool(prim){
  const isImg=prim!=null;   // 圖片請求會帶入專用 Key：此時端點要用圖片端點判斷
  const ep=isImg?getImageEndpoint():getEndpoint();

  // 備用 Key 僅在 Agnes 官方端點時啟用：自訂端點時使用者的 Key 是給其他服務的，備用池不參與輪替
  const extra=isAgnesEndpoint(ep)?BACKUP_API_KEYS.map(s=>String(s||'').trim()).filter(Boolean):[];
  const all=[primary].concat(extra).filter(Boolean);
  return all.filter((k,i)=>all.indexOf(k)===i);   // 去重
}
function pickApiKey(prim){
  const pool=getKeyPool(prim);
  if(!pool.length)return '';
  const now=Date.now();
  for(let n=0;n<pool.length;n++){
    const k=pool[(KEY_POOL.ptr+n)%pool.length];
    if(!(KEY_POOL.fail[k]>now))return k;   // 跳過冷卻中的 Key
  }
  return pool[KEY_POOL.ptr%pool.length];   // 全部冷卻中：照原順序嘗試（交給後端回應）
}
function keyPoolSize(prim){return getKeyPool(prim).length}
// Key 限流／失效：標記冷卻並把輪替指標移到下一把
function markKeyFail(k,ms){
  if(!k)return;
  KEY_POOL.fail[k]=Date.now()+(ms||60000);
  const pool=getKeyPool();
  const i=pool.indexOf(k);
  if(i>=0)KEY_POOL.ptr=(i+1)%pool.length;
}
// 連線逾時／回應慢：不標記失敗，僅換下一把 Key 試試（可能是該 Key 的佇列比較塞）
function rotateKeyPtr(prim){
  const pool=getKeyPool(prim);
  if(pool.length>1)KEY_POOL.ptr=(KEY_POOL.ptr+1)%pool.length;
}

// 自訂人格命名／重新命名共用彈窗：回傳名稱（取消或空白 → null，本輪不關閉條件：點背景不關，只接受取消/ESC/返回鍵/確定）
// 點背景不關閉：避免命名中誤觸關掉；空白確定視同取消、不修改
function promptPersonaName(msg,defaultName){
  return new Promise(resolve=>{
    const modal=document.getElementById('personaNameModal');
    const input=document.getElementById('personaNameInput');
    const yes=document.getElementById('personaNameYes');
    const no=document.getElementById('personaNameNo');
    document.getElementById('personaNameMsg').textContent=msg;
    input.value=defaultName||'';
    modal.classList.add('open');
    input.focus();input.select();
    histPush('personaName');   // 推入一筆歷史狀態：手機返回鍵關命名框（視同取消），而不是離開頁面
    let settled=false;
    const done=v=>{
      if(settled)return;settled=true;
      modal.classList.remove('open');
      histPop('personaName');   // 同步退掉推入的狀態（popstate 端旗標已清，不會重複關閉）
      yes.removeEventListener('click',onYes);
      no.removeEventListener('click',onNo);
      input.removeEventListener('keydown',onKey);
      resolve(v);
    };
    const onYes=()=>done(input.value.trim()||null);
    const onNo=()=>done(null);
    const onKey=e=>{
      if(e.isComposing)return;   // IME 組字中：Enter 是上字，不能視同「確定」
      if(e.key==='Enter'){e.preventDefault();onYes()}
      else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(null)}
    };
    yes.addEventListener('click',onYes);
    no.addEventListener('click',onNo);
    input.addEventListener('keydown',onKey);
  });
}

// 對話「最後活動時間」，排序與分組的依據：
// 優先 updatedAt；舊資料沒有就回退 createdAt，再沒有就回退最後一則訊息的時間
function chatLastTime(c){
  if(c&&c.updatedAt)return c.updatedAt;
  if(c&&c.createdAt)return c.createdAt;
  if(c&&Array.isArray(c.messages)){
    for(let i=c.messages.length-1;i>=0;i--){
      const t=c.messages[i]&&c.messages[i].createdAt;
      if(t)return t;
    }
  }
  return 0;
}
// 補齊舊對話缺漏的 meta（updatedAt／createdAt／title），讓排序與分組一直穩定
function ensureChatMeta(c){
  if(!c||typeof c!=='object')return c;
  if(!c.updatedAt)c.updatedAt=chatLastTime(c)||Date.now();
  if(!c.createdAt)c.createdAt=c.updatedAt;
  if(!c.title)c.title='新對話';
  return c;
}
// 對話有新增活動（新訊息／新回應）時更新最後活動時間；c 可為 id 或對話物件
function touchChat(c){

}
// 對話歷史分組標籤：今天 → 昨天 → 本週 → 上週 → 本月 → 月份（跨年加年份）
function chatGroupLabel(t){
  const MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const now=new Date();
  const d=new Date(t);
  const sod=x=>{const v=new Date(x);v.setHours(0,0,0,0);return v.getTime()};
  const day=sod(t);
  const diff=(sod(now.getTime())-day)/86400000;
  if(diff===0)return '今天';
  if(diff===1)return '昨天';
  const mon=new Date(sod(now.getTime()));
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));   // 本週一（一週從週一起算）
  const lastMon=new Date(mon);lastMon.setDate(lastMon.getDate()-7);
  if(day>=mon.getTime())return '本週';
  if(day>=lastMon.getTime())return '上週';
  if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth())return '本月';
  const label=MONTHS[d.getMonth()];
  return d.getFullYear()===now.getFullYear()?label:(d.getFullYear()+' 年 '+label);
}

function renderChatList(){
  const list=document.getElementById('chatList');
  const q=(document.getElementById('chatSearch').value||'').trim().toLowerCase();
  // 依「最後活動時間」新→舊（有最新訊息的對話自然排到最上面）
  let ids=Object.keys(chats).sort((a,b)=>chatLastTime(chats[b])-chatLastTime(chats[a]));
  if(q){
    ids=ids.filter(id=>{
      const c=chats[id];
      if((c.title||'').toLowerCase().includes(q))return true;
      return c.messages.some(m=>contentText(m).toLowerCase().includes(q));
    });
  }
  if(!ids.length){
    list.innerHTML=`<div class="chatList-empty" style="text-align:center;">${q?'找不到符合的對話':'尚無對話'}</div>`;
    return;
  }
  const itemHTML=id=>{
    const c=chats[id];
    return `<div class="chat-item ${id===activeChatId?'active':''}" data-id="${id}">
      <span class="icon">${c.pinned?'📌':'💬'}</span>
      <span class="title">${escHtml(c.title||'新對話')}</span>
      <button class="act" data-act="pin" type="button" title="${c.pinned?'取消置頂':'置頂'}">${c.pinned?'📍':'📌'}</button>
      <button class="act" data-act="rename" type="button" title="重新命名">📝</button>
      <button class="del" data-act="del" type="button" title="刪除">❌</button>
    </div>`;
  };
  // 搜尋時顯示平鋪結果（不打亂搜尋結果）；平常依時間分組
  if(q){
    list.innerHTML=ids.map(itemHTML).join('');
    return;
  }
  const rows=[];
  let lastGroup=null;
  const pushOne=id=>{
    const g=chats[id].pinned?'📌 置頂':chatGroupLabel(chatLastTime(chats[id]));
    if(g!==lastGroup){lastGroup=g;rows.push(`<div class="chat-group">${escHtml(g)}</div>`)}
    rows.push(itemHTML(id));
  };
  ids.filter(id=>chats[id].pinned).forEach(pushOne);
  ids.filter(id=>!chats[id].pinned).forEach(pushOne);
  list.innerHTML=rows.join('');
}

  return String(c||'');
}
