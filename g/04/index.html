// 訊息選單（⋮）與操作（複製 / 編輯 / 重新生成 / 刪除單則 / 繼續生成）＋ C1 點圖放大
messagesEl.addEventListener('click',async e=>{
  // C1：點擊訊息內圖片 → 開啟燈箱
  const lbTarget=e.target.closest('.msg-img');
  if(lbTarget){
    openLightbox(lbTarget.currentSrc||lbTarget.src,lbTarget.dataset.mediaId||null);
    return;
  }
  // 切換 ⋮ 選單
  const menuBtn=e.target.closest('.msg-menu');
  if(menuBtn){
    const dd=menuBtn.parentElement.querySelector('.msg-dropdown');
    const wasOpen=dd.classList.contains('open');
    closeAllMenus();
    if(!wasOpen){
      dd.classList.add('open');
      menuBtn.closest('.msg-row').classList.add('menu-open');
      positionDropdown(menuBtn.closest('.msg-row'));   // 下方空間不足時改向上展開
    }
    return;
  }
  // C6：繼續生成（finish_reason=length 被截斷的訊息；按鈕不在 ⋮ 選單內，需先於 dropdown 判斷）
  const contBtn=e.target.closest('.continue-btn');
  if(contBtn){
    if(isStreaming)return;
    const chatC=chats[activeChatId];
    const rowC=contBtn.closest('.msg-row');
    const mC=chatC&&rowC?chatC.messages[parseInt(rowC.dataset.idx,10)]:null;
    if(!mC)return;
    mC.truncated=false;
    saveChatsData(chats);
    contBtn.remove();   // 只移除「繼續生成」按鈕本身，不重建訊息區（畫面不跑動）
    followIfStuck();   // 續寫模式
    requestAI({continueHint:'從上次中斷處繼續，直接接續輸出剩餘內容，不要重複已輸出的部分。'});
    return;
  }
  const btn=e.target.closest('.msg-dropdown [data-act]');
  if(!btn)return;
  closeAllMenus();
  const row=btn.closest('.msg-row');
  const chat=chats[activeChatId];
  if(!row||!chat)return;
  const act=btn.dataset.act;
  if(isStreaming&&act!=='copy'&&act!=='saveimg')return;
  const idx=parseInt(row.dataset.idx,10);
  const m=chat.messages[idx];
  if(!m)return;
  if(act==='copy'){
    copyToClipboard(contentText(m)).then(ok=>showToast(ok?'已複製':'複製失敗',ok?'success':'warn'));
  }else if(act==='copyconv'){
    // 轉格式複製：\(..\)/\[..\] → $..$/$$..$$，貼到其他地方可直接使用
    copyToClipboard(convertCopyText(contentText(m))).then(ok=>showToast(ok?'已複製':'複製失敗',ok?'success':'warn'));
  }else if(act==='saveimg'){
    saveMessageImages(m);
  }else if(act==='edit'){
    // 將訊息內容放回輸入框，並移除該則之後的所有訊息
    msgInput.value=contentText(m);
    const removed=chat.messages.splice(idx);
    delMediaIds(removed.flatMap(collectMsgImageIds));   // A1：被移除訊息內的圖片一併從 IndexedDB 刪除
    saveChatsData(chats);
    removeMessageRowsFrom(idx);   // A7：標題不變，不需重繪對話列表；只移除尾端列，捲動位置不變
    msgInput.dispatchEvent(new Event('input'));
    msgInput.focus();
  }else if(act==='regen'){
    // 移除該則回應之後的內容，重新請求
    const removed=chat.messages.splice(idx);
    delMediaIds(removed.flatMap(collectMsgImageIds));   // A1：被移除訊息內的圖片一併從 IndexedDB 刪除
    saveChatsData(chats);
    removeMessageRowsFrom(idx);   // 只移除尾端列，捲動位置不變
    followIfStuck();   // regen：僅在自動捲動開啟且貼底時跟上
    if(chat.messages.length&&chat.messages[chat.messages.length-1].role==='user')requestAI();
  }else if(act==='delmsg'){
    // C4：刪除單則訊息（串流中已被上方 guard 阻擋）
    if(!await showConfirm('確定要刪除這則訊息嗎？'))return;
    await delMediaIds(collectMsgImageIds(m));   // A1：訊息內圖片一併從 IndexedDB 刪除
    chat.messages.splice(idx,1);
    saveChatsData(chats);
    // 不重建整個訊息區：只移除該列 DOM 並重編 data-idx，捲動位置完全不變（其餘訊息自然上移補位）
    removeMessageRow(idx);
  }else if(act==='editimg'){
    // 將 AI 生成的圖片設為圖生圖參考圖：複製一份新媒體記錄，避免日後刪除任一訊息時互相誤刪
    const part=Array.isArray(m.content)?m.content.find(p=>p.type==='image_ref'&&p.id):null;
    if(!part)return;
    const data=await mediaGet(part.id);
    if(data==null){showToast('圖片資料已不存在（可能已被刪除）','warn');return}
    const dataUrl=typeof data==='string'?data:await blobToDataURL(data);
    const nid='img_e_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    try{await mediaPut(nid,dataUrl)}catch(e){showToast('圖片讀取失敗','warn');return}
    pendingImages.push({id:nid,dataUrl});
    if(!imgMode){
      imgMode=true;   // 修改圖片需在圖片模式下送出，自動開啟
      const b=document.getElementById('btnImgMode');
      if(b)b.classList.add('active');
      showToast('已自動切換到圖片模式（🎨）','success');
    }
    renderAttachBar();   // 內部會 updateImgModeHint 更新輸入框提示
    showToast('已將圖片作為參考圖加入，請輸入要修改的內容描述','success');
    msgInput.focus();
  }
});

// 手機長按氣泡（480ms）直接開啟選單；滑動即取消
let lpTimer=null;
// 開啟訊息選單時檢查：若向下展開會超出對話區下緣（被輸入列裁切），改加上 .up 向上展開
function positionDropdown(row){
  if(!row)return;
  const dd=row.querySelector('.msg-dropdown');
  if(!dd)return;
  dd.classList.remove('up');
  const cr=messagesEl.getBoundingClientRect();
  const dr=dd.getBoundingClientRect();
  if(dr.bottom>cr.bottom-4)dd.classList.add('up');
}
function openRowMenu(row){
  closeAllMenus();
  const dd=row.querySelector('.msg-dropdown');
  if(!dd)return;
  dd.classList.add('open');
  row.classList.add('menu-open');
  positionDropdown(row);
  if(navigator.vibrate){try{navigator.vibrate(15)}catch(e){}}
}
messagesEl.addEventListener('touchstart',e=>{
  const row=e.target.closest('.msg-row');
  if(!row||!row.querySelector('.msg-dropdown'))return;
  row.classList.add('pressing');
  lpTimer=setTimeout(()=>openRowMenu(row),480);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>messagesEl.addEventListener(ev,()=>{
  clearTimeout(lpTimer);
  document.querySelectorAll('.msg-row.pressing').forEach(r=>r.classList.remove('pressing'));
},{passive:true}));

// ===== C1：圖片燈箱（點擊 .msg-img 放大；滾輪/雙擊縮放；✕/🗑️/💾/背景/Esc；左右切換：PC 拖曳＋邊緣箭頭、手機滑動）=====
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbPrev=document.getElementById('lbPrev');
const lbNext=document.getElementById('lbNext');
let lbScale=1,lbTx=0,lbTy=0,lbDrag=null,lbSwipe=null,lbMediaId=null,lbSrc=null;
let lbList=[],lbPos=-1;   // 燈箱左右切換：目前情境可瀏覽的圖片 id 清單與位置
function lbApply(){
  lbImg.style.transform='translate('+lbTx+'px,'+lbTy+'px) scale('+lbScale+')';
  updateLbNav();
}
// 邊緣箭頭：一般不顯示；有前/後一張可切換且未放大時，游標靠近左右緣才顯示
function updateLbNav(){
  const on=lbScale<=1&&lbList.length>1;
  lbPrev.classList.toggle('avail',on&&lbPos>0);
  lbNext.classList.toggle('avail',on&&lbPos>=0&&lbPos<lbList.length-1);
}
// 依開啟來源建立切換清單：Gallery 開啟 → 全部圖片（照圖庫排序）；訊息開啟 → 目前對話的圖片順序
function lbBuildList(currentId){
  lbList=[];lbPos=-1;
  if(!currentId)return;
  let ids=[];
  if(document.getElementById('galleryModal').classList.contains('open')&&galleryIds.length){
    ids=galleryIds.slice();
  }else{
    const chat=chats[activeChatId];
    if(chat)chat.messages.forEach(m=>{
      if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id&&!ids.includes(p.id))ids.push(p.id)});
    });
  }
  const i=ids.indexOf(currentId);
  if(i>=0){lbList=ids;lbPos=i}
  else{lbList=[currentId];lbPos=0}
}
async function lbShow(id){
  const data=await mediaGet(id);
  if(data==null){showToast('圖片資料已不存在','warn');return}
  lbMediaId=id;
  lbSrc=(typeof data==='string')?data:trackBlobUrl(URL.createObjectURL(data));
  lbScale=1;lbTx=0;lbTy=0;
  lbImg.src=lbSrc;
  lbApply();
}
function lbNav(dir){
  const np=lbPos+dir;
  if(np<0||np>=lbList.length)return;
  lbPos=np;
  lbShow(lbList[lbPos]);
}
function openLightbox(src,mediaId){
  if(!src)return;
  lbSrc=src;lbMediaId=mediaId||null;
  lbBuildList(lbMediaId);
  lbScale=1;lbTx=0;lbTy=0;lbApply();
  lbImg.src=src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  if(!lightbox.classList.contains('open'))return;
  lightbox.classList.remove('open');
  lbImg.src='';lbSrc=null;lbMediaId=null;lbList=[];lbPos=-1;lbDrag=null;lbSwipe=null;
}
document.getElementById('lbClose').addEventListener('click',closeLightbox);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});
lightbox.addEventListener('contextmenu',e=>e.preventDefault());   // 燈箱內停用瀏覽器右鍵／長按選單，避免干擾拖曳與滑動切換
lightbox.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.15:1/1.15;
  lbScale=Math.min(8,Math.max(0.2,lbScale*f));
  lbApply();
},{passive:false});
lbImg.addEventListener('dblclick',()=>{lbScale=lbScale>1?1:2;lbTx=0;lbTy=0;lbApply()});
// 放大後拖曳平移；未放大時水平拖曳切換上/下一張（不影響觸控雙指縮放：未對 touch 事件 preventDefault）
lbImg.addEventListener('pointerdown',e=>{
  if(lbScale<=1){
    lbSwipe={x:e.clientX,y:e.clientY};
    try{lbImg.setPointerCapture(e.pointerId)}catch(err){}
    return;
  }
  lbDrag={x:e.clientX,y:e.clientY,tx:lbTx,ty:lbTy};
  try{lbImg.setPointerCapture(e.pointerId)}catch(err){}
});
lbImg.addEventListener('pointermove',e=>{
  if(!lbDrag)return;
  lbTx=lbDrag.tx+(e.clientX-lbDrag.x);
  lbTy=lbDrag.ty+(e.clientY-lbDrag.y);
  lbApply();
});
['pointerup','pointercancel'].forEach(ev=>lbImg.addEventListener(ev,e=>{
  if(ev==='pointerup'&&lbSwipe){
    const dx=e.clientX-lbSwipe.x,dy=e.clientY-lbSwipe.y;
    lbSwipe=null;
    if(lbScale<=1&&Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.2)lbNav(dx<0?1:-1);
  }
  lbDrag=null;
}));
// 手機：在燈箱上直接左右滑動切換（右滑→上一張＝左側、左滑→下一張＝右側）
let lbTouch=null;
lightbox.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||lbScale>1)return;
  lbTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
lightbox.addEventListener('touchend',e=>{
  if(!lbTouch)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-lbTouch.x,dy=t.clientY-lbTouch.y;
  lbTouch=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.2)lbNav(dx<0?1:-1);
},{passive:true});
lbPrev.addEventListener('click',()=>lbNav(-1));
lbNext.addEventListener('click',()=>lbNav(1));
// 燈箱下載：複用 saveMessageImages 的資料取得邏輯（IndexedDB → dataURL/Blob/遠端）

// 燈箱刪除：與 Gallery 刪除同一套確認提示；確認彈窗暫時拉到燈箱上層（modal-overlay 預設 z-index 低於燈箱）
document.getElementById('lbDelete').addEventListener('click',async()=>{
  if(!lightbox.classList.contains('open'))return;
  if(!lbMediaId){showToast('此圖片未儲存在本機，無法刪除','warn');return}
  const used=Object.values(chats).filter(c=>collectChatImageIds(c).includes(lbMediaId)).length;
  const msg=used
    ?('此圖被 '+used+' 則訊息引用；刪除後訊息文字保留、圖片改顯示「圖片已刪除」佔位。確定刪除？')
    :'確定要刪除這張圖片嗎？';
  const cm=document.getElementById('confirmModal');
  cm.classList.add('above-lightbox');
  const ok=await showConfirm(msg);
  cm.classList.remove('above-lightbox');
  if(!ok)return;
  try{await mediaDel(lbMediaId)}catch(e){showToast('刪除失敗：'+((e&&e.message)||e),'warn');return}
  showToast('圖片已刪除','success');
  closeLightbox();
  if(document.getElementById('galleryModal').classList.contains('open'))renderGalleryGrid();   // Gallery 開著則即時刷新
  renderMessages(true);   // 當前對話缺圖改為佔位框（hydrateMedia 處理）；保持捲動位置
});

// 匯出檔名時間戳：ChatCAT_export_YYYYMMDD_HHMMSS
function exportStamp(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob);
  downloadHref(u,name);
  setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
}
// 組匯出 JSON：{app:'ChatCAT',version:1,exportedAt,chats:[...]}
async function buildExportData(list){
  const withImg=document.getElementById('exportWithImages').checked;
  const out=[];
  for(const c of list){
    const cc=JSON.parse(JSON.stringify(c));
    for(const m of cc.messages){
      if(!Array.isArray(m.content))continue;
      for(const p of m.content){
        if(p.type==='image_ref'&&p.id){
          if(withImg){
            try{
              const data=await mediaGet(p.id);
              if(data==null)p.missing=true;
              else if(typeof data==='string')p.dataUrl=data;
              else if(data instanceof Blob)p.dataUrl=await blobToDataURL(data);
            }catch(e){p.missing=true}
          }
          // 不含圖時僅保留 id（匯入後需該裝置上已有圖，否則顯示替代）
        }
      }
    }
    out.push(cc);
  }
  return {app:'ChatCAT',version:1,exportedAt:new Date().toISOString(),chats:out};
}
document.getElementById('btnExportAll').addEventListener('click',async()=>{
  const list=Object.values(chats);
  if(!list.length){showToast('沒有可匯出的對話','warn');return}
  try{
    const data=await buildExportData(list);
    downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'ChatCAT_export_'+exportStamp()+'.json');
    showToast('已匯出 '+list.length+' 場對話','success');
  }catch(e){showToast('匯出失敗：'+e.message,'warn')}
});
document.getElementById('btnExportCurrent').addEventListener('click',async()=>{
  const c=chats[activeChatId];
  if(!c){showToast('沒有當前對話','warn');return}
  try{
    const data=await buildExportData([c]);
    downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'ChatCAT_export_'+exportStamp()+'.json');
    showToast('已匯出當前對話','success');
  }catch(e){showToast('匯出失敗：'+e.message,'warn')}
});
// 匯出 Markdown（當前對話）
document.getElementById('btnExportMd').addEventListener('click',()=>{
  const c=chats[activeChatId];
  if(!c){showToast('沒有當前對話','warn');return}
  const lines=['# '+(c.title||'新對話'),''];
  c.messages.forEach(m=>{
    const who=m.role==='user'?'🧑 使用者':'🐱 AI';
    let body=contentText(m);
    if(msgHasImage(m))body+='\n[圖片]';
    lines.push('**'+who+'**：','',body,'');
  });
  downloadBlob(new Blob([lines.join('\n')],{type:'text/markdown'}),'ChatCAT_export_'+exportStamp()+'.md');
});

// 匯入：選檔(JSON) → 驗證 → id 衝突重取 → 圖片 dataURL 寫進 IndexedDB → 合併
document.getElementById('btnImportPick').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];
  e.target.value='';
  if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data||data.app!=='ChatCAT'||!Array.isArray(data.chats))throw new Error('格式不符（需 ChatCAT 匯出檔）');
    let imported=0,imgs=0;
    for(const c of data.chats){
      if(!c||!Array.isArray(c.messages))continue;
      const id=(c.id&&!(c.id in chats))?c.id:('chat_'+Date.now()+'_'+Math.random().toString(36).slice(2,6));   // id 衝突以新 id 重取，不覆蓋
      c.id=id;
      for(const m of c.messages){
        delete m.truncated;
        if(!Array.isArray(m.content))continue;
        for(const p of m.content){
          if(p.type==='image_ref'&&p.dataUrl){
            const nid='img_imp_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
            try{await mediaPut(nid,p.dataUrl);p.id=nid;imgs++}catch(e2){}
            delete p.dataUrl;
          }
        }
      }
      chats[id]=ensureChatMeta(c);
      imported++;
    }
    if(!imported)throw new Error('檔內沒有可匯入的對話');
    saveChatsData(chats);
    saveChatsDataNow();
    renderChatList();
    showToast('已匯入 '+imported+' 場對話（內嵌圖片 '+imgs+' 張）','success');
    closeExportModal();
  }catch(err){
    showToast('匯入失敗：'+err.message,'warn');
  }
});
// 讀取 IndexedDB 全部 key（清理未引用圖片用）
function mediaAllKeys(){
  return openMediaDB().then(db=>new Promise((res,rej)=>{
    try{
      const rq=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).getAllKeys();
      rq.onsuccess=()=>{db.close();res(rq.result||[])};
      rq.onerror=()=>{db.close();rej(rq.error)};
    }catch(e){db.close();rej(e)}
  }));
}
// 維護：清理未被任何對話引用的圖片（對應 A1）
document.getElementById('btnCleanOrphan').addEventListener('click',async()=>{
  if(!await showConfirm('掃描所有對話，刪除未被任何訊息引用的圖片。\n\n確定執行？'))return;
  try{
    const keys=await mediaAllKeys();
    const used=new Set();
    Object.values(chats).forEach(c=>collectChatImageIds(c).forEach(id=>used.add(id)));
    let n=0;
    for(const k of keys){
      if(!used.has(k)){try{await mediaDel(k);n++}catch(e){}}
    }
    showToast(n?('已清理 '+n+' 張未引用圖片'):'沒有未引用的圖片','success');
    if(document.getElementById('galleryModal').classList.contains('open'))renderGalleryGrid();   // Gallery 若開著則即時刷新
  }catch(e){showToast('清理失敗：'+e.message,'warn')}
});

// ===== C12：語音輸入（Web Speech API；僅支援的瀏覽器顯示 🎤）=====
(function initVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById('btnMic');
  if(!btn)return;
  btn.classList.add('enabled');  // 修正：原用 style.display='' 清不掉 CSS 的 .btn-mic{display:none}，導致按鈕永遠不出現
  if(!SR){
    // 不支援的瀏覽器仍顯示按鈕，點擊時說明原因（方便行動端排查，手機沒有主控台）
    btn.addEventListener('click',()=>showToast('此瀏覽器不支援語音輸入（Web Speech API）。請改用 Chrome / Edge 或 Safari（iOS 14.5+）','warn'));
    return;
  }
  let rec=null,listening=false;
  btn.addEventListener('click',()=>{
    if(listening){
      listening=false;
      btn.classList.remove('listening');
      try{rec.stop()}catch(e){}
      return;
    }
    try{rec=new SR()}catch(e){return}
    rec.lang='zh-TW';
    rec.interimResults=true;
    rec.continuous=false;
    listening=true;
    btn.classList.add('listening');
    rec.onresult=ev=>{
      let finalTxt='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)finalTxt+=ev.results[i][0].transcript;
      }
      if(finalTxt){
        msgInput.value=(msgInput.value||'')+finalTxt;   // 結果附加進輸入框
        msgInput.dispatchEvent(new Event('input'));
      }
    };
    rec.onend=()=>{listening=false;btn.classList.remove('listening')};
    rec.onerror=ev=>{
      listening=false;
      btn.classList.remove('listening');
      const why={
        'not-allowed':'語音輸入失敗：麥克風權限被拒絕（請允許麥克風存取）',
        'service-not-allowed':'語音輸入失敗：瀏覽器或系統未允許語音服務',
        'network':'語音輸入失敗：需要網路連線（辨識在雲端進行）',
        'audio-capture':'語音輸入失敗：找不到可用的麥克風',
        'no-speech':'沒有偵測到說話內容',
        'aborted':null
      }[ev.error];
      if(why)showToast(why,'warn');
    };
    try{
      rec.start();
      showToast('語音辨識中…再次點擊 🎤 可停止');
    }catch(e){
      listening=false;
      btn.classList.remove('listening');
    }
  });
})();

// ===== C9：圖片 Gallery（瀏覽所有 IndexedDB 圖片；入口：右上 🖼️）=====
const galleryUrls=new Set();
let galleryIds=[];   // 圖庫目前排序的圖片 id 清單（燈箱左右切換用）
function openGallery(){renderGalleryGrid();document.getElementById('galleryModal').classList.add('open')}
function closeGallery(){
  document.getElementById('galleryModal').classList.remove('open');
  galleryUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  galleryUrls.clear();
}
async function renderGalleryGrid(){
  // 先釋放上一輪的 blob URL，避免孤兒清理後殘留殭屍 URL
  galleryUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  galleryUrls.clear();
  const grid=document.getElementById('galleryGrid');
  grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:20px">讀取中…</div>';
  // 建立 圖片id → 來源對話標題 對照
  const owner={};
  Object.values(chats).forEach(c=>{
    ((c&&c.messages)||[]).forEach(m=>{
      if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id&&!owner[p.id])owner[p.id]=c.title||'新對話'});
    });
  });
  let entries=[];
  try{
    const all=await mediaAllEntries();
    // 依生成時間新→舊排序：優先用記錄的 createdAt，舊記錄則從 id 解析 13 位時間戳（img_<ts>_ / img_u_<ts>_ / img_e_<ts>_ / img_mig_<ts>_）
    const tsOf=rec=>{if(!rec)return 0;if(rec.createdAt)return rec.createdAt;const m=String(rec&&rec.id||'').match(/(\d{13})/);return m?+m[1]:0};
    entries=all.slice().sort((a,b)=>tsOf(b)-tsOf(a));
    galleryIds=entries.map(rec=>rec&&rec.id).filter(Boolean);   // 記下圖庫排序，燈箱左右切換依此順序
  }catch(e){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:20px">讀取失敗：'+escHtml((e&&e.message)||e)+'</div>';
    return;
  }
  if(!entries.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:20px">尚無圖片</div>';
    return;
  }
  grid.innerHTML='';
  entries.forEach(rec=>{
    if(!rec||!rec.id)return;
    const item=document.createElement('div');
    item.className='gallery-item';
    const img=document.createElement('img');
    img.alt=rec.id;
    img.loading='lazy';
    img.title=(owner[rec.id]?('來源：'+owner[rec.id]):'（未被任何對話引用）')+'｜'+rec.id;
    if(typeof rec.data==='string')img.src=rec.data;
    else if(rec.data instanceof Blob){const u=URL.createObjectURL(rec.data);galleryUrls.add(u);img.src=u}
    const info=document.createElement('div');
    info.className='gallery-item-info';
    info.textContent=owner[rec.id]||'（未被引用）';
    const acts=document.createElement('div');
    acts.className='gallery-item-actions';
    const bDl=document.createElement('button');bDl.type='button';bDl.textContent='💾';bDl.title='下載';
    const bDel=document.createElement('button');bDel.type='button';bDel.textContent='🗑️';bDel.title='刪除';
    acts.appendChild(bDl);acts.appendChild(bDel);
    item.appendChild(img);item.appendChild(info);item.appendChild(acts);
    img.addEventListener('click',()=>openLightbox(img.src,rec.id));   // 大圖：複用燈箱
    bDl.addEventListener('click',()=>saveMessageImages({content:[{type:'image_ref',id:rec.id}]}));
    bDel.addEventListener('click',async()=>{
      const used=Object.values(chats).filter(c=>collectChatImageIds(c).includes(rec.id)).length;
      const msg=used
        ?('此圖被 '+used+' 則訊息引用；刪除後訊息文字保留、圖片改顯示「圖片已刪除」佔位。\n\n確定刪除？')
        :'確定要刪除這張圖片嗎？';
      if(!await showConfirm(msg))return;
      try{await mediaDel(rec.id)}catch(e){showToast('刪除失敗：'+e.message,'warn');return}
      showToast('圖片已刪除','success');
      renderGalleryGrid();
      renderMessages(true);   // 重新渲染當前對話，缺圖改為佔位框（hydrateMedia 處理）；保持捲動位置
    });
    grid.appendChild(item);
  });
}
document.getElementById('btnGallery').addEventListener('click',openGallery);
document.getElementById('btnGalleryClose').addEventListener('click',closeGallery);
document.getElementById('galleryModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeGallery()});
// 讀取 IndexedDB 全部圖片記錄（Gallery 用）
function mediaAllEntries(){
  return openMediaDB().then(db=>new Promise((res,rej)=>{
    try{
      const rq=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).getAll();
      rq.onsuccess=()=>{db.close();res(rq.result||[])};

// ===== C9-2：Gallery 一鍵壓縮（PNG → JPEG 品質 85%）=====
// 不縮小尺寸、只轉檔：肉眼幾乎感覺不出差異，但 PNG（無損）轉 JPEG 通常可省 60~90% 空間。
// 壓縮後若沒有比原檔小 10% 以上就不覆蓋，避免白工或反而變大。JPEG 不支援透明，透明處鋪白底。
function fmtBytes(n){
  if(n>=1048576)return (n/1048576).toFixed(2)+' MB';
  if(n>=1024)return (n/1024).toFixed(1)+' KB';
  return n+' B';
}
function isPngMedia(data){
  if(typeof data==='string')return /^data:image\/png/i.test(data);
  return data instanceof Blob&&(data.type==='image/png'||data.type==='');
}
// 壓縮單筆媒體資料；成功回傳 {data:Blob,saved:位元組數}，無法壓縮／不划算回傳 null
function compressMediaData(data,quality){
  return new Promise(resolve=>{
    const srcSize=typeof data==='string'?Math.round((data.length-data.indexOf(',')-1)*0.75):data.size;
    const srcUrl=typeof data==='string'?data:URL.createObjectURL(data);
    const cleanup=()=>{if(typeof data!=='string'){try{URL.revokeObjectURL(srcUrl)}catch(e){}}};
    const img=new Image();
    img.onload=()=>{
      try{
        const cv=document.createElement('canvas');
        cv.width=img.naturalWidth;cv.height=img.naturalHeight;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);   // 透明鋪白底
        ctx.drawImage(img,0,0);
        cv.toBlob(blob=>{
          cleanup();
          if(!blob)resolve(null);
          else if(blob.size>=srcSize*0.9)resolve(null);   // 省不到 10% 就不覆蓋
          else resolve({data:blob,saved:srcSize-blob.size});
        },'image/jpeg',quality||0.85);
      }catch(e){cleanup();resolve(null)}
    };
    img.onerror=()=>{cleanup();resolve(null)};
    img.src=srcUrl;
  });
}
document.getElementById('btnCompressImages').addEventListener('click',async()=>{
  const btn=document.getElementById('btnCompressImages');
  if(btn.disabled)return;
  let entries;
  try{entries=await mediaAllEntries()}catch(e){showToast('讀取失敗：'+((e&&e.message)||e),'warn');return}
  const cands=entries.filter(rec=>rec&&rec.id&&isPngMedia(rec.data));
  if(!cands.length){showToast('沒有可壓縮的 PNG 圖片（JPEG／遠端連結不在處理範圍）','warn');return}
  const msg=`將把 ${cands.length} 張 PNG 圖片轉存為 JPEG\n（品質 85%、尺寸不變、透明處鋪白底）。\n\n此動作不可還原，確定繼續？`;
  if(!await showConfirm(msg))return;
  btn.disabled=true;
  const oldText=btn.textContent;
  let done=0,savedBytes=0;
  for(let i=0;i<cands.length;i++){
    btn.textContent=`🗜️ 壓縮中 ${i+1}/${cands.length}…`;
    try{
      const r=await compressMediaData(cands[i].data,0.85);
      if(r){await mediaPut(cands[i].id,r.data,cands[i].createdAt);done++;savedBytes+=r.saved}   // 壓縮覆寫保留原時間戳，排序不變
    }catch(e){}
  }
  btn.disabled=false;btn.textContent=oldText;
  if(done){
    showToast(`已壓縮 ${done} 張圖片，節省 ${fmtBytes(savedBytes)}`,'success');
    renderGalleryGrid();   // 刷新縮圖
  }else{
    showToast('沒有圖片需要壓縮','warn');
  }
});

// ===== C10：Service Worker 離線快取（需 https；file:// 或註冊失敗時自動略過）=====
(function setupServiceWorker(){
  try{
    if(!('serviceWorker' in navigator))return;
    if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;   // file:// 直接略過
    const swCode=[
      "const CACHE='chatcat-v1';",
      "self.addEventListener('install',e=>self.skipWaiting());",
      "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));",
      "self.addEventListener('fetch',e=>{",
      "  if(e.request.method!=='GET')return;",
      "  e.respondWith((async()=>{",
      "    const c=await caches.open(CACHE);",
      "    const hit=await c.match(e.request);",
      "    if(hit)return hit;",
      "    try{",
      "      const r=await fetch(e.request);",
      "      const u=e.request.url;",
      "      if(r&&r.ok&&(u.startsWith(self.location.origin)||u.indexOf('cdn.jsdelivr.net')>=0))c.put(e.request,r.clone());",
      "      return r;",
      "    }catch(err){throw err}",
      "  })());",
      "});"
    ].join('\n');
    const swUrl=URL.createObjectURL(new Blob([swCode],{type:'text/javascript'}));
    navigator.serviceWorker.register(swUrl)
      .then(()=>console.log('[Chat] Service Worker 已註冊（離線快取開啟）'))
      .catch(err=>console.log('[Chat] Service Worker 註冊略過：',err&&err.message));
  }catch(e){}
})();

// ===== PWA：動態產生 manifest（http(s) 環境下可安裝到主畫面；file:// 環境自動忽略）=====
(function setupManifest(){
  try{
    const cv=document.createElement('canvas');
    cv.width=cv.height=192;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#141414';ctx.fillRect(0,0,192,192);
    ctx.font='84px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🐱',96,102);
    const manifest={
      name:'ChatCAT',short_name:'ChatCAT',start_url:'.',display:'standalone',
      background_color:'#0d0d0d',theme_color:'#0d0d0d',
      icons:[{src:cv.toDataURL('image/png'),sizes:'192x192',type:'image/png'}]
    };
    const link=document.createElement('link');
    link.rel='manifest';
    link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(link);
  }catch(e){}
})();
