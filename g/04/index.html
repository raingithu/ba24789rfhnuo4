// ===== 對話內全文搜尋：高亮 ＋ 上／下一則（Ctrl+F 或點 🔍）=====
// 搜尋粒度是「訊息」：m = 符合的訊息則數，n = 目前停在第幾則。
// 高亮只作用在已渲染的列上；往上捲載入更早訊息時（P2）會自動補高亮。
const findBarEl=document.getElementById('findBar');
const findInputEl=document.getElementById('findInput');
const findCountEl=document.getElementById('findCount');
// 高亮時要避開的區域：MathML 原文、程式碼按鈕、訊息選單與時間徽章等 UI 文字
const FIND_SKIP='script,style,textarea,.katex-mathml,.code-copy,.msg-menu-wrap,.msg-time,.continue-btn,.msg-top-sentinel';
let findQ='';          // 目前搜尋字串（小寫）
let findMsgIdxs=[];    // 符合的訊息索引（遞增）
let findCur=-1;        // 目前停在哪一筆 findMsgIdxs
function clearFindMarks(){
  findMarkCount=0;   // 標記計數歸零（重搜時重新累計）
  messagesEl.querySelectorAll('mark.chatcat-hit').forEach(mk=>{
    const p=mk.parentNode;
    if(!p)return;
    p.replaceChild(document.createTextNode(mk.textContent),mk);
    try{p.normalize()}catch(e){}
  });
}
function highlightRow(row){
  if(!row||!findQ)return 0;
  if(row.querySelector('mark.chatcat-hit'))return 0;
  const walker=document.createTreeWalker(row,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      if(!n.nodeValue)return NodeFilter.FILTER_REJECT;
      const p=n.parentElement;
      if(!p)return NodeFilter.FILTER_REJECT;
      if(p.closest(FIND_SKIP))return NodeFilter.FILTER_REJECT;
      return n.nodeValue.toLowerCase().indexOf(findQ)>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }
  });
  const nodes=[];let w;
  while((w=walker.nextNode()))nodes.push(w);
  let cnt=0;
  nodes.forEach(node=>{
    const text=node.nodeValue,lc=text.toLowerCase(),frag=document.createDocumentFragment();
    let pos=0,i;
    while((i=lc.indexOf(findQ,pos))>=0){
      if(i>pos)frag.appendChild(document.createTextNode(text.slice(pos,i)));
      const mk=document.createElement('mark');
      mk.className='chatcat-hit';
      mk.textContent=text.slice(i,i+findQ.length);
      frag.appendChild(mk);
      pos=i+findQ.length;cnt++;
    }
    if(pos<text.length)frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag,node);
  });
  return cnt;
}
// 只標「畫面內（含上下 200px 緩衝）」的訊息列：萬字長對話不會一次掃完所有列。
// 捲動時由 onViewChange() 補標新進畫面的列；標記總量達上限就停止，避免 DOM 被 mark 塞爆。
const FIND_VIEW_MARGIN=200;
let findMarkCount=0;
function rowInView(row){
  if(!messagesEl)return true;
  const cr=messagesEl.getBoundingClientRect();
  const br=row.getBoundingClientRect();
  return br.bottom>cr.top-FIND_VIEW_MARGIN&&br.top<cr.bottom+FIND_VIEW_MARGIN;
}
function highlightRenderedRows(){
  if(!findQ||!findMsgIdxs.length)return;
  if(findMarkCount>=CONFIG.find.maxMarks)return;
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    if(findMarkCount>=CONFIG.find.maxMarks)return;
    const i=parseInt(r.dataset.idx,10);
    if(findMsgIdxs.indexOf(i)<0)return;
    if(!rowInView(r))return;
    findMarkCount+=highlightRow(r);
  });
}
// 視窗／捲動變化後的統一補做：數學字級 + 搜尋高亮（rAF 節流）
let viewRaf=0;
function onViewChange(){
  if(viewRaf)return;
  viewRaf=requestAnimationFrame(()=>{
    viewRaf=0;
    fitPendingMath();
    if(findQ)highlightRenderedRows();
  });
}
function updateFindCount(){findCountEl.textContent=findMsgIdxs.length?((findCur+1)+' / '+findMsgIdxs.length):'0 / 0'}
function findGoto(pos){
  if(!findMsgIdxs.length)return;
  findCur=((pos%findMsgIdxs.length)+findMsgIdxs.length)%findMsgIdxs.length;
  const idx=findMsgIdxs[findCur];
  ensureMsgRendered(idx);   // P2：必要時往前補載
  const row=messagesEl.querySelector('.msg-row[data-idx="'+idx+'"]');
  if(row){
    highlightRow(row);
    messagesEl.querySelectorAll('mark.chatcat-hit.cur').forEach(m=>m.classList.remove('cur'));
    row.querySelectorAll('mark.chatcat-hit').forEach(m=>m.classList.add('cur'));
    row.scrollIntoView({block:'start'});
  }
  updateFindCount();
}
function runFind(){
  const q=(findInputEl.value||'').trim().toLowerCase();
  findQ=q;
  clearFindMarks();
  const chat=chats[activeChatId];
  findMsgIdxs=[];findCur=-1;
  if(chat&&q)chat.messages.forEach((m,i)=>{if(contentText(m).toLowerCase().indexOf(q)>=0)findMsgIdxs.push(i)});
  highlightRenderedRows();
  if(findMsgIdxs.length)findGoto(0);
  else updateFindCount();
}
function openFindBar(){
  findBarEl.classList.add('open');
  findInputEl.focus();
  findInputEl.select();
  if(findInputEl.value.trim())runFind();
}
function closeFindBar(){
  findBarEl.classList.remove('open');
  findQ='';findMsgIdxs=[];findCur=-1;
  clearFindMarks();
  updateFindCount();
}
document.getElementById('btnFind').addEventListener('click',()=>{
  if(findBarEl.classList.contains('open'))closeFindBar();else openFindBar();
});
document.getElementById('findClose').addEventListener('click',closeFindBar);
document.getElementById('findPrev').addEventListener('click',()=>findGoto(findCur-1));
document.getElementById('findNext').addEventListener('click',()=>findGoto(findCur+1));
let findDeb=null;
findInputEl.addEventListener('input',()=>{
  if(findDeb)clearTimeout(findDeb);
  findDeb=setTimeout(runFind,150);
});
findInputEl.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==='Enter'){e.preventDefault();findGoto(findCur+(e.shiftKey?-1:1))}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeFindBar()}
});
// Ctrl/Cmd+F 開啟對話內搜尋；搜尋列開著時 Esc 先關它
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='f'||e.key==='F')){
    e.preventDefault();openFindBar();return;
  }
  if(e.key==='Escape'&&findBarEl.classList.contains('open')){closeFindBar();return}
},{capture:true});
// 對話列表事件委派：切換 / 置頂 / 重新命名 / 刪除
document.getElementById('chatList').addEventListener('click',async e=>{
  if(e.target.tagName==='INPUT')return; // 重新命名輸入中，不觸發其他行為
  const item=e.target.closest('.chat-item');
  if(!item)return;
  const id=item.dataset.id;
  const act=e.target.closest('[data-act]');
  if(!act){
    const q=(document.getElementById('chatSearch').value||'').trim().toLowerCase();
    setActiveChat(id);
    if(q)jumpToSearchMatches(q);   // D6：從搜尋結果進入對話，跳到第一則符合訊息
    document.getElementById('sidebar').classList.remove('open');
    return;
  }
  const a=act.dataset.act;
  if(a==='del'){await deleteChat(id);return}
  if(a==='pin'){chats[id].pinned=!chats[id].pinned;saveChatsData(chats);renderChatList();return}
  if(a==='rename'){
    const c=chats[id];
    const titleEl=item.querySelector('.title');
    const inp=document.createElement('input');
    inp.className='rename-input';inp.value=c.title||'';
    titleEl.replaceWith(inp);
    inp.focus();inp.select();
    let finished=false;   // B4：Enter 觸發後 renderChatList 會移除輸入框，blur 可能再觸發一次
    const done=save=>{
      if(finished)return;
      finished=true;
      if(save&&inp.value.trim()){c.title=inp.value.trim().slice(0,60);delete c.titleFromMsg;saveChatsData(chats)}   // 手動改名：清除暫用標記，避免被自動標題覆蓋
      renderChatList();
    };
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'){ev.preventDefault();done(true)}
      else if(ev.key==='Escape'){ev.stopPropagation();done(false)}
    });
    inp.addEventListener('blur',()=>done(true));
  }
});
// 對話搜尋（比對標題與內容）— B3：200ms debounce，避免每個按鍵都全量掃描
let searchDeb=null;
document.getElementById('chatSearch').addEventListener('input',()=>{
  if(searchDeb)clearTimeout(searchDeb);
  searchDeb=setTimeout(renderChatList,200);
});

const messagesEl=document.getElementById('messages');

// ===== P2：分段漸進渲染 =====
// 開場只 render 最後 MSG_PAGE 則，往上捲時以 IntersectionObserver 分批往前補；
// sentinel 也可直接點擊（IntersectionObserver 沒觸發時的保底操作）。
// 數百則的長對話不必一次處理全部，開場體感差很多。
const MSG_PAGE=CONFIG.render.msgPage;
let msgRenderedFrom=0;    // 目前已渲染的最前端訊息索引（0 = 已全部載入）
let msgTopObs=null;
function msgRangeHtml(from,to){
  const chat=chats[activeChatId];
  let s='';
  for(let i=from;i<to;i++)s+=msgHtml(chat.messages[i],i);
  return s;
}
function updateMsgTopSentinel(){
  const chat=chats[activeChatId];
  if(chat)msgRenderedFrom=Math.min(msgRenderedFrom,Math.max(0,chat.messages.length));   // 刪除訊息後可能越界
  const el=document.getElementById('msgTopSentinel');
  if(!el)return;
  if(msgRenderedFrom<=0){el.remove();return}
  el.textContent='↑ 顯示更早的 '+Math.min(MSG_PAGE,msgRenderedFrom)+' 則（尚有 '+msgRenderedFrom+' 則未載入）';
}
function setupMsgTopObserver(){
  if(msgTopObs){msgTopObs.disconnect();msgTopObs=null}
  if(msgRenderedFrom<=0)return;
  const el=document.getElementById('msgTopSentinel');
  if(!el||!window.IntersectionObserver)return;
  msgTopObs=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))loadMoreMessagesUp()},{root:messagesEl,rootMargin:'300px'});
  msgTopObs.observe(el);
}
// 往前補一批訊息；回傳是否真的補了
function loadMoreMessagesUp(){
  if(msgRenderedFrom<=0)return false;
  const chat=chats[activeChatId];
  if(!chat)return false;
  const prevH=messagesEl.scrollHeight,prevTop=messagesEl.scrollTop;
  const to=msgRenderedFrom,from=Math.max(0,to-MSG_PAGE);
  const wrap=document.createElement('div');
  wrap.innerHTML=msgRangeHtml(from,to);
  const frag=document.createDocumentFragment(),newRows=[];
  let n;
  while((n=wrap.firstElementChild)){newRows.push(n);frag.appendChild(n)}
  const sentinel=document.getElementById('msgTopSentinel');
  if(sentinel)sentinel.after(frag);
  else messagesEl.insertBefore(frag,messagesEl.firstChild);
  msgRenderedFrom=from;
  newRows.forEach(r=>{
    fitMathBlocks(r);
    hydrateMedia(r);
    const ri=parseInt(r.dataset.idx,10);
    if(findQ&&findMsgIdxs.indexOf(ri)>=0)highlightRow(r);   // 補載的段落若有命中，一併高亮
  });
  messagesEl.scrollTop=prevTop+(messagesEl.scrollHeight-prevH);   // 補償：上方插入內容後畫面不跳動
  updateMsgTopSentinel();
  updateScrollBtn();
  if(msgRenderedFrom<=0&&msgTopObs){msgTopObs.disconnect();msgTopObs=null}
  return true;
}
// 確保第 idx 則已被渲染（搜尋跳轉用）：連續往前補到該則進入 DOM
function ensureMsgRendered(idx){
  let guard=0;
  while(idx<msgRenderedFrom&&msgRenderedFrom>0&&guard++<200){if(!loadMoreMessagesUp())break}
}

function renderMessages(keepPos){
  closeLightbox();           // 重建 DOM 前先收起燈箱，避免引用被釋放的 blob URL
  revokeRenderBlobUrls();    // A2：釋放上一輪渲染建立的 objectURL
  if(msgTopObs){msgTopObs.disconnect();msgTopObs=null}
  const chat=chats[activeChatId];
  if(!chat||!chat.messages.length){messagesEl.innerHTML='<div class="empty"></div>';msgRenderedFrom=0;if(shouldAutoScroll())scrollToBottom(false);updateScrollBtn();return}   // 空對話也要同步重算按鈕，否則舊對話的 ↓ 會殘留
  const total=chat.messages.length;
  msgRenderedFrom=Math.max(0,total-MSG_PAGE);   // P2：開場只 render 最後一批
  // P1：msgHtml 內部使用 finalBodyHtml（已含程式碼按鈕與 KaTeX，且整列 HTML 有快取）
  const head=msgRenderedFrom>0?'<div id="msgTopSentinel" class="msg-top-sentinel" role="button" tabindex="0"></div>':'';
  messagesEl.innerHTML=head+msgRangeHtml(msgRenderedFrom,total);
  updateMsgTopSentinel();
  fitMathBlocks(messagesEl);   // 字級依容器寬度計算、不進快取；整批插入 DOM 後統一跑一次
  hydrateMedia(messagesEl);
  if(findQ)highlightRenderedRows();   // 重建後補回搜尋高亮（findQ 為空時不做）
  setupMsgTopObserver();
  updateScrollBtn();   // 重建後更新「捲到底按鈕」顯示
  updateTtsBtn();   // 朗讀中重建訊息區（切換對話回來／設定變更重繪）：把 ⏹ 停止朗讀補回正在朗讀的那則
  // 預設強制捲到底；keepPos=true 表示呼叫端會自行決定（注意：scrollToBottom 會再問一次 shouldAutoScroll，關閉或已往上捲就不動）
  if(!keepPos&&shouldAutoScroll())scrollToBottom(false);
}

// 刪除單則訊息時使用：只移除該列 DOM 並重編後續 data-idx，
// 不重建整個訊息區 → 捲動位置保持不變，其餘訊息自然上移補位（自動捲動關閉時畫面完全不受影響）
function removeMessageRow(idx){
  const row=messagesEl.querySelector(`.msg-row[data-idx="${idx}"]`);
  if(row)row.remove();
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    const i=parseInt(r.dataset.idx,10);
    if(!Number.isNaN(i)&&i>idx)r.dataset.idx=String(i-1);
  });
  if(!chats[activeChatId]||!chats[activeChatId].messages.length)messagesEl.innerHTML='<div class="empty"></div>';
  updateScrollBtn();
}
// 移除 idx（含）之後的所有列（編輯重送／重新生成時用；被移除的一定在尾端）
function removeMessageRowsFrom(idx){
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    const i=parseInt(r.dataset.idx,10);
    if(!Number.isNaN(i)&&i>=idx)r.remove();
  });
  if(!chats[activeChatId]||!chats[activeChatId].messages.length)messagesEl.innerHTML='<div class="empty"></div>';
  updateScrollBtn();
}
// 新訊息加入：只附加單一列 DOM，不重建整個訊息區。
// （innerHTML 重建會讓圖片重新載入、高度瞬間塌縮，捲動位置因此漂移——自動捲動關閉時尤其明顯；
//   附加方式對上方既有內容零影響，捲動位置完全不動）
function appendMessageRow(m){
  const chat=chats[activeChatId];
  if(!chat||!m)return;
  const i=chat.messages.indexOf(m);
  if(i<0)return;
  const empty=messagesEl.querySelector('.empty');
  if(empty)empty.remove();
  const wrap=document.createElement('div');
  wrap.innerHTML=msgHtml(m,i);
  const row=wrap.firstElementChild;
  if(!row)return;
  messagesEl.appendChild(row);
  fitMathBlocks(row);      // P1：只補跑字級調整（其餘已在 finalBodyHtml 快取內）
  hydrateMedia(row);
  updateScrollBtn();
}

function msgHtml(m,i){
  const cls=m.role==='user'?'user':(m.error?'error':'assistant');
  const isUser=m.role==='user';
  // C3：訊息時間戳（舊資料無 createdAt 則不顯示）
  const tstr=m.createdAt?('🕒 '+new Date(m.createdAt).toLocaleString('zh-TW')):'';
  // 氣泡上顯示時間（完整時間保留在長按選單第一行）；使用者訊息不顯示，僅 AI 氣泡下方顯示
  const tshort=m.createdAt?new Date(m.createdAt).toLocaleTimeString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const timeRow=tstr?`<div class="menu-time">${escHtml(tstr)}</div>`:'';
  // 🔍 搜尋標記：該回覆曾以搜尋結果增強（滑鼠移過顯示實際查詢字串）
  // 三之1：有記錄來源時，徽章可點擊開啟來源面板
  const hasSrc=!isUser&&Array.isArray(m.sources)&&m.sources.length>0;
  const searchTip=(!isUser&&m.searchQuery)?` title="🔍 搜尋：${escHtml(m.searchQuery)}${hasSrc?'（可點擊查看來源）':''}"`:'';
  const timeBadge=(tshort&&!isUser)?`<div class="msg-time${hasSrc?' clickable':''}"${searchTip}${hasSrc?' data-act="sources" role="button" tabindex="0"':''}>${m.searchQuery?'🔍 ':''}${escHtml(tshort)}</div>`:'';
  // 選單項目：user = 複製/編輯；AI 純文字 = 複製/轉格式複製/重新生成；AI 圖片訊息 = 儲存圖片/重新生成（C4：皆附刪除）
  // 書籤與朗讀為本次新增：書籤一律提供，朗讀只在瀏覽器支援語音合成時出現
  const delBtn=`<button data-act="delmsg" type="button">🗑️ 刪除</button>`;
  const bmBtn=`<button data-act="bookmark" type="button">${m.bm?'🔖 移除書籤':'🔖 加入書籤'}</button>`;
  const speakBtn=ttsSupported()?`<button data-act="speak" type="button">🔊 朗讀</button>`:'';
  const items=isUser
    ?`<button data-act="copy" type="button">📋 複製</button><button data-act="edit" type="button">✏️ 編輯並重送</button>${speakBtn}${bmBtn}${delBtn}`
    :(msgHasImage(m)
      ?`${hasSrc?`<button data-act="sources" type="button">🔗 查看來源</button>`:''}<button data-act="saveimg" type="button">💾 儲存圖片</button><button data-act="editimg" type="button">🎨 修改圖片</button><button data-act="regen" type="button">🔄 重新生成</button>${bmBtn}${delBtn}`
      :`${hasSrc?`<button data-act="sources" type="button">🔗 查看來源</button>`:''}<button data-act="copy" type="button">📋 複製（原始）</button><button data-act="copyconv" type="button">📋 複製（文字）</button>${speakBtn}<button data-act="regen" type="button">🔄 重新生成</button>${bmBtn}${delBtn}`);
  // 書籤標記：只在該則被收藏時顯示（樣式由 .msg-row.bm 控制，切換書籤時只動 class）
  const bmFlag='<span class="msg-bm-flag" title="已加入書籤">🔖</span>';
  // C6：因長度上限被截斷（finish_reason=length）的 AI 訊息，附「繼續生成」按鈕
  const contBtn=(m.truncated&&!isUser)?`<button class="continue-btn" type="button">⤵️ 繼續生成</button>`:'';
  // B2：串流出錯但已有部分內容時，錯誤原因直接標在該則下方（不再多一則 [錯誤] 氣泡）
  const errNote=(!isUser&&m.errorNote)?`<div class="msg-errnote">⚠️ ${escHtml(m.errorNote)}</div>`:'';
  return `<div class="msg-row ${cls}${m.bm?' bm':''}" data-idx="${i}"><div class="msg ${cls}">${finalBodyHtml(m)}${timeBadge}${bmFlag}<div class="msg-menu-wrap"><button class="msg-menu" type="button" title="訊息選單" aria-label="訊息選單">⋮</button><button class="msg-tts-stop" type="button" title="停止朗讀" aria-label="停止朗讀">⏹</button><div class="msg-dropdown">${timeRow}${items}</div></div>${errNote}${contBtn}</div></div>`;
}

// 關閉所有訊息選單
function closeAllMenus(){

  document.querySelectorAll('.msg-row.menu-open').forEach(r=>r.classList.remove('menu-open'));

// 數學前置處理：
//  - 把模型的 LaTeX 分隔符 \[ .. \]、\( .. \) 轉成 KaTeX auto-render 認得的 $$ / $
//    （Markdown 會把反斜線當跳脫字元吃掉，必須在 parse 之前轉換）
//  - 程式碼區塊（``` 圍欄與行內 `code`）原樣保留，讓數學與程式碼互不干擾
//  - 已認得的數學（$$..$$、$..$）先「收進佔位符」，之後的「裸括號→行內數學」
//    才不會誤改到數學內部而產生巢狀 $（例如 $$OA^2 + OB^2 = (x_1^2 + 16) + …$$
//    被包成 $x_1^2 + 16$ 就會造成 KaTeX parse error）
//  - 顯示數學內若殘留巢狀 / 孤立的 $（舊資料或缺漏裁切所致），會還原成括號或直接清除
const MATH_PH_START='\uE000';
const MATH_PH_END='\uE001';
function preprocessMath(text){
  // 先抽出程式碼（``` 圍欄 + 行內 `code`）與一般文字
  const parts=String(text).split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/);
  return parts.map((p,idx)=>{
    if(idx%2===1)return p; // 程式碼原樣保留，不做任何數學轉換
    return convertMath(p);
  }).join('');
}
// 不含程式碼的文字上做數學轉換（含對舊資料的修補）
function convertMath(p){
  const tokens=[];
  const ph=s=>{tokens.push(s);return MATH_PH_START+(tokens.length-1)+MATH_PH_END;};
  const unph=s=>{
    const re=new RegExp(MATH_PH_START+'(\\d+)'+MATH_PH_END,'g');
    let t=s;
    // 循環還原：即使意外出現「佔位符包佔位符」的巢狀，內層也會在後續回合還原
    for(let k=0;k<20;k++){
      const n=t.replace(re,(m,i)=>tokens[+i]!==undefined?tokens[+i]:m);
      if(n===t)break;
      t=n;
    }
    return t;
  };
  // 1) \[ .. \] → 顯示數學（整段先收進佔位符，避免被後續步驟誤改）
  p=p.replace(/\\\[([\s\S]*?)\\\]/g,(m,c)=>ph('\n\n$$'+c+'$$\n\n'));
  // 2) \( .. \) → 行內數學
  p=p.replace(/\\\(([\s\S]*?)\\\)/g,(m,c)=>ph('$'+c+'$'));
  // 3) $$ .. $$ 顯示數學：內部殘留的巢狀 $..$ 還原成括號、孤立 $ 清除
  //    （舊版誤把括號包成 $..$，例如 $x_1^2 + 16$ 原本是 (x_1^2 + 16)）
  p=p.replace(/\$\$([\s\S]*?)\$\$/g,(m,c)=>ph('$$'+c.replace(/\$([^$\n]{1,120})\$/g,'($1)').replace(/\$/g,'')+'$$'));
  // 4) $ .. $ 行內數學（內容不含換行，避免誤抓跨行文字）
  p=p.replace(/\$([^$\n]{1,200}?)\$/g,(m,c)=>ph('$'+c+'$'));
  // 5) 裸括號內含數學符號（^ _ 或 \指令）時視為行內數學，如 (3^{x+1} = 27)
  //    此時真正的數學已被佔位符取代，不會再改到 $$..$$ 或 $..$ 內部
  //    佔位符本身不含 $ ( ) ^ _ \，不會再被此規則誤判
  p=p.replace(/\(([^()\n]{0,120})\)/g,(m,c)=>/[\\^_]/.test(c)?ph('$'+c+'$'):m);
  // 還原被保護的數學區段
  return unph(p);
}

// 保護 $$..$$ 不被 marked 掃進去：把每段顯示數學收進佔位符，
// marked 處理完後再還原。否則 marked 會把 `_x`、`*x*` 當斜體/粗體，
// 把公式結構毀掉（例：|_{L_{-m}} → |<em>L</em>{-m}）。
function shieldDisplayMath(text){
  const tokens=[];
  const re=/\$\$([\s\S]*?)\$\$/g;
  const shielded=text.replace(re,(m,c)=>{
    tokens.push('$$'+c+'$$');
    return MATH_PH_START+(tokens.length-1)+MATH_PH_END;
  });
  return {shielded,restore:s=>s.replace(new RegExp(MATH_PH_START+'(\\d+)'+MATH_PH_END,'g'),(m,i)=>tokens[+i]!==undefined?tokens[+i]:m)};
}

// KaTeX 自動排版（pre/code 內不自動渲染；載入失敗時靜默跳過）
// skipFit=true：略過 fitMathBlocks（快取「定稿 HTML」時用；字級調整依賴容器寬度，不能快取）
function renderMath(el,skipFit){
  if(window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        ignoredTags:['script','noscript','style','textarea','pre','code'],
        throwOnError:false
      });
    }catch(e){}
  }
  if(!skipFit)fitMathBlocks(el);
}

// 自動縮字級：每個 .katex-display 若自然寬超過容器可用寬度，就單獨往下縮到不溢出為止；
// 縮不到下限（10px）就交給水平 scrollbar。只動該段，不影響其他內容。
// 效能：只處理「在畫面內（含上下 400px 緩衝）」的區塊；畫面外的標記 .math-pending，
// 等使用者捲過去時再由 fitPendingMath() 補算——長對話（數百則、每則都有公式）不再卡頓。
const MATH_VIEW_MARGIN=400;
function mathBoxInView(box){
  if(!messagesEl)return true;
  const cr=messagesEl.getBoundingClientRect();
  const br=box.getBoundingClientRect();
  return br.bottom>cr.top-MATH_VIEW_MARGIN&&br.top<cr.bottom+MATH_VIEW_MARGIN;
}
function fitOneMath(box){
  const MIN_PX=10;     // 下限：再小就糊了
  const STEP=0.92;     // 每次縮 92%
  const MAX_LOOPS=8;   // 安全閥
  if(box.style.fontSize)box.style.fontSize='';   // 先還原到繼承值（沒被調整過就不寫，少一次強制排版）
  if(box.scrollWidth<=box.clientWidth+1)return;  // 沒溢出的區塊直接跳過，省掉 getComputedStyle()
  let n=0;
  while(box.scrollWidth>box.clientWidth+1&&n<MAX_LOOPS){
    const cur=parseFloat(getComputedStyle(box).fontSize);
    if(cur<=MIN_PX+0.5)break;   // 觸底，改走 scrollbar
    box.style.fontSize=(cur*STEP)+'px';
    n++;
  }
}
function fitMathBlocks(root){
  if(!root||!root.querySelectorAll)return;
  root.querySelectorAll('.katex-display').forEach(box=>{
    if(!mathBoxInView(box)){box.classList.add('math-pending');return}
    box.classList.remove('math-pending');
    fitOneMath(box);
  });
}
// 捲動時補算「先前在畫面外」的公式（rAF 節流，一幀最多一次）
let pendingFitRaf=0;
function fitPendingMath(){
  if(pendingFitRaf)return;
  pendingFitRaf=requestAnimationFrame(()=>{
    pendingFitRaf=0;
    const boxes=messagesEl.querySelectorAll('.katex-display.math-pending');
    if(!boxes.length)return;
    let did=false;
    boxes.forEach(box=>{
      if(!mathBoxInView(box))return;
      box.classList.remove('math-pending');
      fitOneMath(box);
      did=true;
    });
    if(did)updateScrollBtn();
  });
}

// Markdown 渲染（CDN 載入失敗時退回純文字）
function mdToHtml(text){
  maybeLoadKatex(text);   // 延遲初始化：訊息真的有數學才去抓 KaTeX
  const t=preprocessMath(text);
  if(window.marked&&window.DOMPurify){
    try{
      // 先把 $$..$$ 收進佔位符，避免 marked 掃進去把 `_x` `*x*` 當斜體/粗體
      const {shielded,restore}=shieldDisplayMath(t);
      const html=DOMPurify.sanitize(marked.parse(shielded,{breaks:true}));
      // 最後一道保險：清掉 <a> 前後殘留的 $，確保點開網址永遠不會多出 $ 而失誤
      const safeHtml=sanitizeAnchors(html);
      // SVG 空殼清理：foreignObject/script/事件屬性被 DOMPurify 拔掉後，可能留下
      // <svg width height> 空殼（看不見卻佔位）；這裡整顆移除，不放寬消毒器
      const noEmptySvg=stripEmptySvg(safeHtml);
      // 所有對外連結另開分頁，避免離開聊天頁；rel 加 noopener+noreferrer 防 opener 控制與 Referer 外洩
      const withBlank=noEmptySvg.replace(/<a\s+([^>]*?)>/gi,(m,attrs)=>{
        if(!/href=/i.test(attrs))return m;   // 沒 href 不處理
        if(/target=/i.test(attrs))return m;   // 已設 target 不覆蓋
        return `<a ${attrs} target="_blank" rel="noopener noreferrer">`;
      });
      return restore(withBlank);
    }catch(e){return formatMsg(t)}
  }
  return formatMsg(t);
}

function formatMsg(text){
  return escHtml(text).replace(/\n/g,'<br>');
}

// ===== 最後一道連結 $ 保險 =====
// 就算模型/fixJinaLinks 漏掉，render 出的 <a> 前後若還殘留 $，點開時就會多出 $ 而失誤。
// 這裡直接把每個 <a href> 最前、最後的 $ 清掉（顯示文字也一併清），保證點開網址永遠正確。
// 只清「開頭／結尾」的 $，絕不碰網址中間的 $（例如 ?t=...$1... 這種查詢參數留著不動）。
function sanitizeAnchors(html){
  if(!html||html.indexOf('$')<0)return html;   // 完全沒有 $，直接原樣回傳（最快路徑）
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  const trimEdge=s=>String(s||'').replace(/^[\s$]+/,'').replace(/[\s$]+$/,'');
  const anchors=tmp.querySelectorAll('a[href]');
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i];
    const href=a.getAttribute('href')||'';
    const trimmed=trimEdge(href);
    if(trimmed!==href)a.setAttribute('href',trimmed);   // 移除開頭/結尾的 $ 與空白
    // 顯示文字前後的 $ 也一併清（避免「$文字$」殘留在可見處）
    if(a.firstChild&&a.firstChild.nodeType===Node.TEXT_NODE){
      const t=trimEdge(a.firstChild.textContent);
      if(t!==a.firstChild.textContent)a.firstChild.textContent=t;
    }
  }
  return tmp.innerHTML;
}

// 移除消毒後殘留的 SVG 空殼（foreignObject/script 動畫被拔掉後只剩 <svg width height>）
// DOMPurify 預設允許 svg/circle/rect 等圖形標籤但擋 foreignObject/script/on*；
// foreignObject 包排版文字的卡片型 SVG 消毒後就變「看不見但佔 width×height 的空盒」。
// 不放寬消毒器（XSS 風險），改為整顆移除；<pre><code> 內的原始碼文字不受影響。
function stripEmptySvg(html){
  if(!html||html.indexOf('<svg')<0)return html;
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  tmp.querySelectorAll('svg').forEach(svg=>{
    // 有實際圖形子元素（path/circle/rect/ellipse/line/polyline/polygon/text/use/image/g）就保留
    if(svg.querySelector('path,circle,rect,ellipse,line,polyline,polygon,text,use,image,g'))return;
    svg.remove();
  });
  // 空殼被移除後若留下空 <p>（只有 <br> 或空白），一併清掉避免殘留大段空白
  tmp.querySelectorAll('p').forEach(p=>{
    if(p.querySelector('svg,img,pre,code,a,table,.katex'))return;
    if((p.textContent||'').trim()==='')p.remove();
  });
  return tmp.innerHTML;
}

// 為程式碼區塊加上複製按鈕
// ===== 剪貼簿（PC / 手機皆可）=====
// 同步備援方案：隱藏 textarea + execCommand('copy')，相容性最好（手機瀏覽器、file:// 皆可用）
function copyTextSync(text){
  text=String(text||'');
  if(!text)return false;
  const textarea=document.createElement('textarea');
  textarea.value=text;
  textarea.setAttribute('readonly','');
  textarea.style.position='fixed';
  textarea.style.left='0';
  textarea.style.top='0';
  textarea.style.width='1px';
  textarea.style.height='1px';
  textarea.style.padding='0';
  textarea.style.border='0';
  textarea.style.outline='0';
  textarea.style.opacity='0.01';
  textarea.style.zIndex='999999';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  textarea.setSelectionRange(0,textarea.value.length);
  let success=false;
  try{success=document.execCommand('copy')}catch(e){}
  textarea.blur();
  document.body.removeChild(textarea);
  return success;
}
// 統一入口：優先 Clipboard API，失敗自動退回 execCommand
function copyToClipboard(text){
  text=String(text||'');
  if(!text)return Promise.resolve(false);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text)
      .then(()=>true)
      .catch(()=>Promise.resolve(copyTextSync(text)));
  }
  return Promise.resolve(copyTextSync(text));
}

// 轉格式複製：把 LaTeX 分隔符 \(..\) \[..\] 轉成 $..$ $$..$$（與畫面顯示用的轉換一致），
// 讓貼到其他支援數學的地方可直接使用；原樣複製仍保留在「📋 複製」
function convertCopyText(t){return preprocessMath(String(t||''));}

// ===== 訊息朗讀（TTS）：訊息選單的「🔊 朗讀」=====
let ttsUtter=null,ttsMsg=null;
function ttsSupported(){return typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined'}
function ttsVoice(){
  try{
    const vs=window.speechSynthesis.getVoices?speechSynthesis.getVoices():[];
    return vs.find(v=>/zh[-_]?(TW|Hant)/i.test(v.lang||''))||vs.find(v=>/^zh/i.test(v.lang||''))||null;
  }catch(e){return null}
}
// 朗讀狀態 → 畫面：正在朗讀的那則訊息加 .speaking，讓 ⋮ 下方的 ⏹ 顯示出來（其餘列清除）
function updateTtsBtn(){
  document.querySelectorAll('.msg-row.speaking').forEach(r=>r.classList.remove('speaking'));
  if(!ttsMsg||!chats[activeChatId])return;
  const idx=chats[activeChatId].messages.indexOf(ttsMsg);
  if(idx<0)return;   // 該則已被刪除或屬於其他對話：不顯示
  const row=document.querySelector(`.msg-row[data-idx="${idx}"]`);
  if(row)row.classList.add('speaking');
}
function ttsStop(){
  try{speechSynthesis.cancel()}catch(e){}
  ttsUtter=null;ttsMsg=null;
  updateTtsBtn();
}
function toggleSpeak(m){
  if(!ttsSupported()){showToast('此瀏覽器不支援語音朗讀','warn');return}
  if(ttsUtter&&ttsMsg===m){ttsStop();showToast('已停止朗讀','warn');return}   // 同一則再點一次 = 停止
  const text=contentText(m)
    .replace(/```[\s\S]*?```/g,'（程式碼區塊省略）')
    .replace(/`([^`\n]*)`/g,'$1')
    .replace(/\$\$?([^$\n]{1,200}?)\$\$?/g,'（公式）')
    .replace(/^\s*[#>*\-]+\s?/gm,'')
    .trim();
  if(!text){showToast('這一則沒有可朗讀的文字','warn');return}
  ttsStop();
  const u=new SpeechSynthesisUtterance(text.slice(0,4000));   // 上限保護：超長訊息不餵爆引擎
  u.lang='zh-TW';
  const v=ttsVoice();if(v)u.voice=v;
  u.rate=1.25;
  u.pitch=1.8;
  u.onend=()=>{ttsUtter=null;ttsMsg=null;updateTtsBtn()};
  u.onerror=()=>{ttsUtter=null;ttsMsg=null;updateTtsBtn()};
  ttsUtter=u;ttsMsg=m;
  try{speechSynthesis.speak(u);updateTtsBtn();showToast('朗讀中… <br>點 ⏹ 可停止朗讀','success')}
  catch(e){ttsUtter=null;ttsMsg=null;updateTtsBtn();showToast('朗讀失敗','warn')}
}
window.addEventListener('beforeunload',ttsStop);
// ⏹ 停止朗讀按鈕（在 .msg-menu-wrap 內，不在 dropdown 選單裡）：用捕捉層先攔，避免觸發其他文件級 handler
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('.msg-tts-stop'):null;
  if(!b)return;
  e.stopPropagation();
  if(!ttsUtter)return;
  ttsStop();
  showToast('已停止朗讀','warn');
},true);

// ===== 儲存訊息圖片 =====
function extFromMime(t){
  t=String(t||'').toLowerCase();
  if(t.includes('jpeg')||t.includes('jpg'))return'.jpg';
  if(t.includes('webp'))return'.webp';
  if(t.includes('gif'))return'.gif';
  return'.png';
}
// 觸發瀏覽器下載（dataURL / blobURL 皆可）
function downloadHref(href,name){
  const a=document.createElement('a');
  a.href=href;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
// 抓取遠端圖片成 Blob：直接抓 → 失敗改走 CORS 圖片代理（Agnes 圖床無 CORS header，瀏覽器 JS 讀不到，需借代理）
// 會驗證回傳內容確實是圖片（避免代理的錯誤頁面被當成圖片）；全部失敗回傳 null。
// 注意：圖片 URL 會經過第三方代理伺服器。
async function blobIsImage(blob){
  const t=String(blob.type||'').toLowerCase();
  if(t.startsWith('image/'))return true;
  try{
    const b=new Uint8Array(await blob.slice(0,16).arrayBuffer());
    if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)return true;                // PNG
    if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return true;                             // JPEG
    if(b[0]===0x47&&b[1]===0x49&&b[2]===0x46)return true;                             // GIF
    if(b[0]===0x52&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50)return true; // WEBP
  }catch(e){}
  return false;
}
async function fetchRemoteImage(url,timeoutMs){
  timeoutMs=timeoutMs||TIMEOUT.remoteImage;
  const enc=encodeURIComponent(url);
  const tries=[
    url,                                            // 有些圖床其實有開 CORS，先直接試
    'https://wsrv.nl/?url='+enc+'&n=-1',            // images.weserv.nl 圖片代理（實測對 Agnes 圖床有效，ACO:*）
    'https://api.allorigins.win/raw?url='+enc,      // allorigins 備援
    'https://api.codetabs.com/v1/proxy?quest='+enc, // codetabs 備援
  ];
  for(let i=0;i<tries.length;i++){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
      const r=await fetch(tries[i],{signal:ctrl.signal});
      clearTimeout(timer);
      if(!r.ok)continue;
      const blob=await r.blob();
      if(blob&&blob.size>0&&await blobIsImage(blob)){
        dbg('[Chat] 圖片抓取成功（來源：'+(i===0?'直接':('代理 #'+i))+'），大小:',blob.size);
        return blob;
      }
      dbg('[Chat] 圖片來源 #'+i+' 回應非圖片（type:',blob.type,'size:',blob.size,'）');
    }catch(e){}
  }
  return null;
}
// 儲存訊息內的所有圖片（從 IndexedDB 取出：dataURL / Blob / 遠端 URL）
async function saveMessageImages(m){
  const parts=Array.isArray(m.content)?m.content.filter(p=>p.type==='image_ref'&&p.id):[];
  if(!parts.length){showToast('此訊息沒有圖片','warn');return}
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const base=`image_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  let saved=0,opened=0,failed=0;
  for(let i=0;i<parts.length;i++){
    const name=parts.length>1?`${base}_${i+1}`:base;
    try{
      const data=await mediaGet(parts[i].id);
      if(data==null){failed++;continue}
      if(typeof data==='string'){
        if(data.startsWith('data:')){
          downloadHref(data,name+extFromMime(data.slice(0,data.indexOf(','))));saved++;
        }else{
          // 遠端 URL：直接抓或走 CORS 代理抓回 Blob 再下載；都失敗才退回開新分頁讓使用者手動另存
          showToast('正在取得圖片…');
          const blob=await fetchRemoteImage(data);
          if(blob){
            const u=URL.createObjectURL(blob);
            downloadHref(u,name+extFromMime(blob.type));saved++;
            setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
          }else{
            const a=document.createElement('a');
            a.href=data;a.target='_blank';a.rel='noopener';
            document.body.appendChild(a);a.click();a.remove();
            opened++;
          }
        }
      }else if(data instanceof Blob){
        const u=URL.createObjectURL(data);
        downloadHref(u,name+extFromMime(data.type));saved++;
        setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
      }else failed++;
    }catch(e){failed++}
  }
  if(opened)setTimeout(()=>showToast('無法取得圖片資料，已開新分頁，<br>請長按／右鍵另存圖片','warn'),saved?1800:0);
  if(failed&&!saved&&!opened)setTimeout(()=>showToast('儲存失敗：找不到圖片資料','warn'),(saved||opened)?1800:0);
}

// 取出 <pre> 的純文字（排除按鈕本身與結尾空行）
function preText(pre){
  const clone=pre.cloneNode(true);
  clone.querySelectorAll('.code-copy,.code-view').forEach(b=>b.remove());
  return (clone.textContent||'').replace(/\n+$/,'');
}

// 只負責「把按鈕加進 HTML」，點擊行為改由下方 messagesEl 的事件委派處理。
// 原因：定稿訊息的 HTML 會被快取並以 innerHTML 灌回 DOM，逐顆按鈕掛的監聽不會跟著回來。
function enhanceCodeBlocks(root){
  root.querySelectorAll('pre').forEach(pre=>{
    if(pre.dataset.enhanced)return;
    pre.dataset.enhanced='1';
    const btn=document.createElement('button');
    btn.className='code-copy';btn.type='button';btn.textContent='複製';
    btn.title='複製程式碼';
    pre.appendChild(btn);

    // HTML / SVG 程式碼加上即時預覽按鈕
    const codeEl=pre.querySelector('code');
    const lang=((codeEl&&codeEl.className.match(/language-([\w-]+)/))||[])[1]||'';
    const raw=preText(pre);
    const looksHtml=/^\s*(<!DOCTYPE\s+html|<html[\s>]|<svg[\s>])/i.test(raw);
    if(looksHtml||/^(html|svg|xml|xhtml)$/i.test(lang)){
      const pv=document.createElement('button');
      pv.className='code-copy code-view';pv.type='button';pv.textContent='👁 預覽';
      pv.title='另開視窗預覽';
      pre.appendChild(pv);
    }
  });
}
// 程式碼區塊按鈕：事件委派（掛在容器上，快取 HTML 重新灌回 DOM 後仍然有效）
// 內容在點擊當下才從 <pre> 取出，不會因為快取而拿到舊資料。
messagesEl.addEventListener('click',e=>{
  if(!e.target||!e.target.closest)return;
  if(e.target.closest('#msgTopSentinel')){loadMoreMessagesUp();return}   // P2：手動載入更早的訊息
  const btn=e.target.closest('.code-copy');
  if(!btn)return;
  const pre=btn.closest('pre');
  if(!pre)return;
  if(btn.classList.contains('code-view')){openPreview(preText(pre));return}
  copyToClipboard(preText(pre)).then(ok=>{
    if(ok){
      btn.textContent='已複製';
      setTimeout(()=>{if(btn.isConnected)btn.textContent='複製'},1500);
    }else showToast('複製失敗','warn');
  });
});

// ===== R3：彈出層「手機返回鍵關閉」共用機制 =====
// 每個可被返回鍵關閉的彈出層在此註冊歷史旗標 key：開層 histPush() 推入一筆歷史狀態，
// 返回鍵觸發 popstate 時由單一分派表關閉最上層；用 ✕／背景／Esc 關閉時 histPop()
// 同步退掉推入的狀態（由 popstate 觸發的關閉傳 skipBack=true——歷史已彈掉，不能再退）。
const HIST_LAYERS={
  confirm:'chatcatConfirm',        // 確認框
  sources:'chatcatSources',        // 搜尋來源面板
  lightbox:'chatcatLightbox',      // 圖片燈箱
  gallery:'chatcatGallery',        // 圖片庫
  settings:'chatcatSettings',      // 設定
  personaName:'chatcatPersonaName', // 自訂人格命名／重命名彈窗（疊在設定面板上）
  bmRename:'chatcatBmRename',     // 書籤重新命名彈窗（疊在書籤清單上）
  export:'chatcatExport',          // 匯出／匯入
  preview:'chatcatPreview',        // 程式碼即時預覽
  editBranch:'chatcatEditBranch',  // 「編輯並重送」確認
  bookmark:'chatcatBookmark'       // 書籤清單
};
const histArmed={};   // layerId → 推入的歷史狀態是否仍掛在堆疊上
function histPush(layer){   // 開層時推入歷史狀態（已推過不重複推）
  if(histArmed[layer])return;
  histArmed[layer]=true;
  try{history.pushState({[HIST_LAYERS[layer]]:1},'')}catch(e){histArmed[layer]=false}
}
function histPop(layer,skipBack){   // 關層時同步退掉推入的狀態
  if(!histArmed[layer])return;
  histArmed[layer]=false;
  if(!skipBack)history.back();   // popstate 觸發時歷史已彈掉，不能再退（避免連退兩層）
}

// ===== 程式碼即時預覽（沙箱 iframe）=====
function openPreview(code){
  const frame=document.getElementById('previewFrame');
  const s=code.trim();
  const isSvg=/^<svg[\s>]/i.test(s)||/^<\?xml[\s\S]*?<svg[\s>]/i.test(s);
  frame.srcdoc=isSvg
    ?`<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#fff}svg{max-width:96%;max-height:96%}</style></head><body>${s}</body></html>`
    // 外部連結先確認再開：避免預覽裡的程式碼一被點就把使用者帶去陌生網站
    :`<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><style>body{margin:8px;font-family:'LXGW WenKai TC',cursive,sans-serif}</style></head><body>${s}<script>document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;var h=a.getAttribute('href')||'';if(/^https?:\\/\\//i.test(h)&&!confirm('開啟外部連結？\\n'+h))e.preventDefault();},true);<\/script></body></html>`;
  document.getElementById('previewModal').classList.add('open');
  histPush('preview');   // 推入一筆歷史狀態：手機返回鍵關預覽，而不是離開頁面
}
function closePreview(){
  document.getElementById('previewModal').classList.remove('open');
  histPop('preview');   // 手機返回鍵同步：用 ✕／背景／Esc 關閉時退掉推入的狀態
  document.getElementById('previewFrame').srcdoc='';
}
document.getElementById('previewClose').addEventListener('click',closePreview);
document.getElementById('previewOpen').addEventListener('click',()=>{
  const frame=document.getElementById('previewFrame');
  if(!frame.srcdoc)return;
  const url=URL.createObjectURL(new Blob([frame.srcdoc],{type:'text/html'}));
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
});
document.getElementById('previewModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closePreview()});

// 處理訊息內容：支援純文字、含圖片的多模態陣列，以及思考過程（reasoning）
// 二之1：alreadyFixed=true 表示呼叫端已修復過 Jina 壞連結（串流中的增量修復器），不再重跑一次
function renderContent(m,alreadyFixed){
  const fx=alreadyFixed?(s=>String(s==null?'':s)):fixJinaLinks;
  let html='';
  if(m.thinking&&getShowThinking())html+=`<details class="thinking"${m.thinkingOpen?' open':''}><summary>💭 思考過程</summary><div class="thinking-body">${escHtml(m.thinking)}</div></details>`;
  const c=m.content;
  if(typeof c==='string')html+=mdToHtml(fx(c));   // 修復舊訊息中 Jina 壞連結格式（顯示層）
  else if(Array.isArray(c)){
    c.forEach(p=>{
      if(p.type==='image_ref'&&p.id){
        html+=`<img class="msg-img${p.large?' large':''}" data-media-id="${escHtml(p.id)}" alt="圖片">`;
      }else if(p.type==='image_url'&&p.image_url&&p.image_url.url){
        // B6：僅相容極舊資料（遷移前直接內嵌 URL 的訊息）；新資料一律為 image_ref
        html+=`<img src="${escHtml(p.image_url.url)}" class="msg-img" alt="attached">`;
      }else if(p.type==='text'&&p.text){
        html+=mdToHtml(fx(p.text));
      }
    });
  }else html+=formatMsg(String(c));
  return html;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
// 二：打字／狀態列元素工廠（取代多處重複的 createElement + className='typing'）
function makeTypingEl(){const d=document.createElement('div');d.className='typing';return d;}
// R2：帶內容（與可選 id）的狀態列工廠；原本 5 處各寫一次 createElement+className+innerHTML
function makeStatusEl(html,id){
  const d=makeTypingEl();
  if(id)d.id=id;
  if(html)d.innerHTML=html;
  return d;
}

// 前一則使用者訊息（農民曆追問用：動作在上句、日期在下句時合併判斷；圖片訊息取其文字段）
function prevUserText(){try{const ms=chats[activeChatId].messages;let n=0;for(let i=ms.length-1;i>=0;i--){const m=ms[i];if(m&&m.role==='user'){n++;if(n===2){if(typeof m.content==='string')return m.content;if(Array.isArray(m.content)){const t=m.content.find(p=>p&&p.type==='text');return (t&&t.text)||'';}}}};}catch(e){}return '';}
async function sendMessage(){
  let almResult=null;   // 農民曆直查結果暫存（條件內賦值用，避免同步函式調兩次）
  const input=document.getElementById('msgInput');
  const text=input.value.trim();

    if(text||pendingImages.length){
      pendingQueue={text:text,images:pendingImages.slice(),imgMode:imgMode};   // 連圖片模式一起排隊，避免排隊期間切換模式造成送出時 mode 錯亂
      pendingImages=[];

      showToast('已排隊：目前回覆完成後自動送出','success');

  // 若無活躍對話，自動建立

  input.value='';layoutMsgInput();updateSendButton();   // 清空並重置輸入框高度／置中狀態、三態按鈕切換
  updateImgModeHint();

  if(!chats[activeChatId].messages.length){
    chats[activeChatId].title=(text||'📷 圖片').slice(0,30)+((text||'📷 圖片').length>30?'…':'');
    chats[activeChatId].titleFromMsg=true;   // 標記：此標題為暫用（取自首則訊息），第一輪結束後由 autoTitle 覆蓋
    saveChatsData(chats);renderChatList();
  }
  const userContent=pendingImages.length
    ? [{type:'text',text},...pendingImages.map(u=>({type:'image_ref',id:u.id}))]
    : text;
  chats[activeChatId].messages.push({role:'user',content:userContent,createdAt:Date.now()});   // C3：記錄時間戳
  touchChat(activeChatId);   // 最後活動時間更新：對話依此往頂端移動
  const imgs=pendingImages.slice();
  clearPendingImages();   // 預覽用 objectURL 一併釋放
  renderAttachBar();
  saveDraft();            // 送出後清空該對話的草稿
  saveChatsData(chats,activeChatId);   // A1：只標記這場對話 dirty
  renderChatList();   // 有新訊息時，把這則對話移回分組頂端
  appendMessageRow(chats[activeChatId].messages[chats[activeChatId].messages.length-1]);   // 只附加新訊息列，不重建（畫面不跑動）
  if(shouldAutoScroll())scrollToBottom(false);   // 使用者送出訊息後：自動捲動開啟且仍貼底才捲到底；關閉或已往上捲就不動（維持使用者控制權）
  if(imgMode){
    const imgData=[];   // 送出前才把 Blob 轉成 dataURL（模型要的是可內嵌的資料）
    for(const it of imgs){
      try{const d=await mediaToDataURL(it.id);if(d)imgData.push(d)}catch(e){}
    }
    await requestImage({prompt:text,images:imgData});
  }
  else if(extractUrls(text).length){
    // 訊息含網址：讀取網頁內容讓 AI 分析（貼網址意圖明確，不需關鍵字；優先於搜尋關鍵字）
    await requestPageRead(text,extractUrls(text));
  }
  else if((almResult=tryAlmanacDirect(text,prevUserText(),null)||tryAlmanacRange(text,prevUserText(),null)||tryAlmanacHint(text,prevUserText()))){
    // 農民曆直查優先於關鍵字分流：明確日期→單日離線計算；模糊擇日（最近哪天…）→未來14天篩選；
    // 問了農民曆但沒給可解析日期（如「農民曆 2026 宜忌」）→附今日宜忌並引導給日期，避免白扣搜尋額度。
    // 意圖＋日期確定時直接本地計算注入（正確答案，不經模型判斷、不扣額度）；
    // 都解析不出→落回關鍵字／直接請求原流程。網址意圖仍優先於此（上一分支）。
    await requestAI({searchContext:almResult.context,_searchQuery:text,_cwa:true,_directKind:'almanac'});
  }
  else if(isWeatherQuery(text)&&isForeignWxAsk(text,prevUserText())){
    // 天氣後端攔截（農民曆 B' 同款）：天氣意圖＋問句＋可抽出地名時，後端直接查（台灣 CWA／國外 Open-Meteo）
    // 再注入，不經模型 initiative——弱後端／無工具後端照樣有正確資料。查到才注入；失敗回 null → 純文字請求。
    // 位置在農民曆之後、關鍵字之前：陳述句（今天天氣真好）因問句閘門不會進來。
    isStreaming=true;updateSendButton();abortCtrl=new AbortController();
    const wxStat=makeStatusEl('<span class="spinner"></span>🌍 正在查詢氣象資訊');
    let wxHit=null;
    try{wxHit=await tryCwaDirect(text,h=>{wxStat.innerHTML=h},abortCtrl.signal,prevUserText());}
    catch(e){if(wxStat.isConnected)wxStat.remove();if(e&&e.name==='AbortError')return;wxHit=null;}
    if(wxStat.isConnected)wxStat.remove();
    if(wxHit&&wxHit.context){
      setSearchSources(text,wxHit.sources);
      await requestAI({searchContext:wxHit.context,_searchQuery:text,_cwa:true,_directKind:'cwa'});
    }
    else requestAI();
  }
  else if(matchSearchKeyword(text)){
    // 一之4：關鍵字命中改走兩條路，避免誤觸發付費搜尋
    // A. 後端支援 tools → 交給模型判斷（關鍵字只當作提示）。原本子字串命中就直接搜尋，
    //    「什麼是搜尋引擎」這類純名詞解釋也會白白扣一次 Tavily 額度；交給模型後，
    //    它只在真的需要即時資訊時才呼叫 web_search（此路徑也省下每次的查詢改寫成本）。
    // B. 後端不支援 tools → 沿用原本的關鍵字快速通道（改寫 → 搜尋 → 注入 context）。
    if(!TOOL_STATE.unsupported){
      requestAI({_keywordHint:true});
      return;
    }
    // 關鍵字命中：目前引擎有設定對應 key 才走搜尋流程，否則提示並照常送純文字請求
    const engineOk=true; // 搜尋 Key 已搬後端，前端不再檢查
    if(engineOk)await requestWebSearch(text);
    else{
//      showToast('偵測到搜尋關鍵字：尚未設定 '+(WEB_SEARCH.engine==='jina'?'Jina':'Tavily')+' API Key（請在檔案內搜尋「WEB_SEARCH」填入）','warn');
      requestAI();
    }
  }
  else requestAI();
}

// 組文本模型的上下文：把歷史中的 image_ref 從 IndexedDB 還原成文本模型可讀的 image_url
async function histToMsgs(hist){
  const IMG_LIMIT=4;   // B4：文字請求最多附「最後 4 張」圖；更舊的以 [圖片] 文字替代，避免請求爆量
  const allIds=[];
  hist.forEach(m=>{if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id)allIds.push(p.id)})});
  const keep=new Set(allIds.slice(-IMG_LIMIT));
  const out=[];
  for(const m of hist){
    const c=m.content;
    if(Array.isArray(c)){
      const parts=[];
      for(const p of c){
        if(p.type==='image_ref'&&p.id){
          if(keep.has(p.id)){
            const url=await mediaToDataURL(p.id);   // C1：帶快取的 id→dataURL（同一張圖每輪請求不再重複轉檔）
            if(url)parts.push({type:'image_url',image_url:{url}});
          }else if(!parts.some(q=>q.type==='text'&&q.text==='[圖片]')){
            parts.push({type:'text',text:'[圖片]'});
          }
        }else if(p.type==='text'&&p.text){parts.push({type:'text',text:fixJinaLinks(p.text)})}   // 順手修復歷史中照抄 Jina 的壞連結格式，避免模型模仿
        else parts.push(p);
      }
      out.push({role:m.role,content:parts});
    }else out.push({role:m.role,content:fixJinaLinks(c)});
  }
  return out;
}

// ===== C5：共用「503/queue is full/逾時自動重試」fetch（文字與圖片請求共用同一套模式）=====
// 回傳成功的 Response；使用者主動中止（AbortError）不重試直接丟出；
// 可重試錯誤用盡次數後丟出 Error（訊息截斷 300 字，與圖片請求一致）
async function fetchWithRetry(url,options,cfg){
  cfg=cfg||{};
  const timeoutMs=cfg.timeoutMs||TIMEOUT.http;   // 單次嘗試的連線逾時（回應表頭前）
  const maxAttempts=cfg.maxAttempts||4;       // 最多嘗試次數
  const onStatus=cfg.onStatus||null;          // 重試進度回呼（更新狀態列）
  const onWait=cfg.onWait||null;              // 等待重試間隔的 callback（讓呼叫端把狀態文字切回「正在…」，避免「伺服器忙碌」殘留至下一輪請求完成）
  const prefix=cfg.statusPrefix||'';          // 狀態文字前綴（如 '🖼️ '）
  const isAborted=cfg.isAborted||(()=>false); // 等待重試間隔時檢查是否已被中止
  const getKey=cfg.getKey||null;              // 多 Key 輪替：每次嘗試前呼叫，取得本次要用的 API Key（備用 Key 輪替用）
  let resp=null,attempt=0,timedOut=false;
  while(true){
    attempt++;
    timedOut=false;
    const curKey=getKey?getKey():null;   // 本次要用的 Key（429/401/403 時標記冷卻並換下一把）
    if(curKey&&options&&options.headers&&typeof options.headers==='object')options.headers.Authorization='Bearer '+curKey;
    const timeoutId=setTimeout(()=>{timedOut=true;cfg.abort&&cfg.abort()},timeoutMs);
    try{
      resp=await fetch(url,options);
    }catch(e){
      clearTimeout(timeoutId);
      if(e.name==='AbortError'&&!timedOut)throw e;   // 使用者主動停止，不重試
      if(attempt>=maxAttempts)throw e;               // 重試次數用完
      if(curKey)rotateKeyPtr();   // 連線逾時／回應慢：下一把 Key 換著試（不標記失敗）
      const wait=Math.min(5*attempt,15);
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+'連線逾時，'+wait+' 秒後自動重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      dbg('[Chat] 連線逾時，自動重試第 '+(attempt+1)+' 次');
      await new Promise(r=>setTimeout(r,wait*1000));
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      if(onWait)onWait(attempt+1);   // 把狀態文字切回「正在…」避免「連線逾時」殘留
      continue;
    }
    clearTimeout(timeoutId);
    if(resp.ok)break;
    const errText=await resp.text();
    // 多 Key 輪替：限流（429）或 Key 失效（401/403）→ 標記該 Key 冷卻，立刻換下一把重試（不等待）
    if(curKey&&(resp.status===429||resp.status===401||resp.status===403)&&attempt<maxAttempts){
      markKeyFail(curKey,resp.status===429?60000:10*60000);   // 限流冷卻 60 秒；401/403 視為無效，冷卻 10 分鐘
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+(resp.status===429?'Key 限流':'Key 無效')+'，切換備用重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      dbg('[Chat] HTTP '+resp.status+'，換備用 Key 重試（第 '+(attempt+1)+' 次）');
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      continue;
    }
    // 佇列已滿 / 伺服器忙碌 → 自動重試
    if((resp.status===503||/queue is full|please retry later/i.test(errText))&&attempt<maxAttempts){
      const wait=Math.min(5*attempt,15);
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+'伺服器忙碌，'+wait+' 秒後自動重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      dbg('[Chat] 伺服器忙碌（503 queue is full），第 '+attempt+' 次失敗，'+wait+' 秒後重試');
      await new Promise(r=>setTimeout(r,wait*1000));
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      if(onWait)onWait(attempt+1);   // 把狀態文字切回「正在…」避免「伺服器忙碌」殘留 30~90 秒
      continue;
    }
    // 重試次數用盡：把常見錯誤代碼轉成友善中文訊息，避免把 JSON 錯誤內容直接丟給使用者
    const err=new Error();
    if(resp.status===503||/queue is full|please retry later/i.test(errText)){
      err.message='伺服器忙碌中，請稍後再試';
    }else if(resp.status===429){
      err.message='請求過於頻繁，請稍後再試';
    }else if(resp.status===401||resp.status===403){
      err.message='API Key 無效或權限不足';
    }else if(resp.status>=500){
      err.message='伺服器錯誤（'+resp.status+'），請稍後再試';
    }else{
      err.message=`HTTP ${resp.status}: ${errText.slice(0,300)}`;
    }
    throw err;
  }
  return resp;
}

// ===== 網路搜尋：關鍵字偵測 → Tavily 搜尋 → Jina Reader 讀全文 → 注入 context 後走正常文字請求 =====
// 一之4：定義型問句不該觸發付費搜尋（「什麼是搜尋引擎」並非要上網查，只是問名詞解釋）
const SEARCH_STOP_PATTERNS=/^(什麼是|什麼叫|什麼叫做|何謂|何為)/;
function matchSearchKeyword(t){
  const s=String(t||'').trim();
  if(!s)return false;
  if(SEARCH_STOP_PATTERNS.test(s))return false;
  return SEARCH_KEYWORDS.some(k=>s.includes(k));
}

// 一之1：搜尋查詢健全性檢查（三條搜尋路徑共用：tool calling／關鍵字／重新搜尋）
// 背景：串流若在 tool_calls 的 arguments 傳到一半時斷線，JSON.parse 會失敗，正則保底取出來的
// 可能只是殘缺片段或亂碼（例：'{"query":"高雄天'）。這種字串打去 Tavily 只會白扣額度，
// 因此送出前三道檢查：長度、殘留符號／控制字元、有效內容比例與重複字元（亂碼）偵測。
function isSaneQuery(q){
  const s=String(q==null?'':q).trim();
  if(s.length<2||s.length>120)return false;
  if(/[{}[\]\\"'`]/.test(s))return false;                  // 殘留 JSON 結構、反斜線或引號
  if(/[\u0000-\u001f\u007f]/.test(s))return false;         // 控制字元
  let meaningful='';
  try{meaningful=s.replace(/[\s\p{P}\p{S}]/gu,'')}         // 去掉空白與標點符號後的有效字元
  catch(e){meaningful=s.replace(/\s/g,'')}                 // 舊瀏覽器不支援 Unicode 屬性逃脫時的保底
  if(meaningful.length<2)return false;
  if(meaningful.length>=4){   // 4 字以上才做亂碼偵測（避免「好好吃」這類疊字短查詢被誤擋）
    const freq=Object.create(null);let top=0;
    for(const ch of meaningful){freq[ch]=(freq[ch]||0)+1;if(freq[ch]>top)top=freq[ch]}
    if(top/meaningful.length>0.75)return false;            // 單一字元佔比過高 → 視為亂碼
  }
  return true;
}

// 修復 Jina Reader 轉換 PDF／LaTeX 來源、以及模型照抄時產生的連結格式問題：
//   1) [文字] $https://...$（含 ] 與 $ 之間有空白／強調符號）→ [文字](https://...)（轉成合法 Markdown 連結）
//   2) $https://...$ → https://...（去掉 LaTeX 式 $ 包裹）
//   3) 行首孤立 $https://... → https://...（$ 只殘留開頭時也移除）
// 不先處理的話，模型會照抄壞格式，回答裡出現「[標題]$網址$」這種失效連結。
// 注意：只處理「成對包裹」與「行首孤立」的 $，絕不刪網址中間的 $（如查詢參數），
// 避免誤刪正常網址；渲染後再由 sanitizeAnchors 做最後一道 $ 清除保險。
function fixJinaLinks(s){
  return String(s||'')
    // [文字] $url$ / [文字]$url$：允許 ] 與 $ 之間有空白
    .replace(/\[\s*([^\]\n]{1,200}?)\s*\]\s*\$+(https?:\/\/[^\s<>$]+?)\$+/g,'[$1]($2)')
    // **文字** $url$：被 Markdown 強調符號包住的連結文字也還原成連結
    .replace(/\*{1,3}([^*\n]{1,100}?)\*{1,3}\s*\$+(https?:\/\/[^\s<>$]+?)\$+/g,'[$1]($2)')
    // 純 $url$ → url
    .replace(/\$+(https?:\/\/[^\s<>$]+?)\$+/g,'$1')
    // 行首孤立 $ 後緊接網址 → 移除該 $
    .replace(/^\s*\$+(?=https?:)/gm,'');
}

// 二之1：串流中的增量修復器
// 原本每個 RAF 都對「整段累積文字」重跑一次 fixJinaLinks（4 道正則 × 每次全文 → 隨長度呈平方成長），
// 串流結束、renderContent、histToMsgs 又各跑一次。改為只修復新追加的片段：
// fixJinaLinks 的四道正則都不跨行（標題與 URL 的字元類別皆排除換行），故以「換行」為安全切割點。
// 回傳值＝已修復的前段＋尚未修復的最後一行（串流結束時由呼叫端做一次完整修復，不會漏掉）。
function makeFixStreamer(){
  let fixedLen=0,fixed='';
  return function(text){
    const s=String(text||'');
    if(s.length<=fixedLen)return fixed+s.slice(fixedLen);   // 理論上不會發生（full 只增不減）：保守回傳
    const nl=s.lastIndexOf('\n');
    if(nl>=fixedLen){                                       // 有完整的行可修：一次修好接到已修復的前段
      fixed+=fixJinaLinks(s.slice(fixedLen,nl+1));
      fixedLen=nl+1;
    }
    return fixed+s.slice(fixedLen);                         // 尾端未結束的那一行原樣輸出，下輪或結束時再修
  };
}

// 用 Jina Reader 把網頁轉成純文字（Markdown）；失敗回空字串（單頁失敗不影響整體）
async function jinaFetch(url,sig){
  try{
    const ac=new AbortController();
    if(sig&&sig.aborted)ac.abort();
    else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});   // 外部「■ 停止」鈕同步中斷
    const tid=setTimeout(()=>ac.abort(),TIMEOUT.pageRead);   // 單頁讀取逾時
    const headers={
      'Accept':'text/plain',
      'X-Locale':'zh-TW',               // 結果回繁中（與搜尋端一致）
      'X-Retain-Images':'none',         // 跳過圖片（氣象圖示、logo 等都對回答無用，省 token）
      'X-Base':'final'                  // 取得 redirect 終點的 URL（cwa.gov.tw/V8/C/ → index.html），避免抓到重導頁造成 422
    };
    // r.jina.ai 走匿名（不附 key）：避免 Jina 搜尋額度被讀全文的請求吃光
    // 匿名限流按 IP，多人共用時，避免吃同一 apikey額度，匿名的不同 IP 較難打滿 20 rpm；單頁讀取失敗回空字串由 buildSearchContext 走搜尋自帶 content 兜底
    const resp=await fetch(WEB_SEARCH.jinaReader+url,{signal:ac.signal,headers});
    clearTimeout(tid);
    if(!resp.ok)return '';
    return await resp.text();
  }catch(e){return ''}
}

// 查詢改寫：使用者訊息常依賴上下文（如 AI 說無法查天氣後，使用者補「那你幫我查一下」），
// 直接拿去搜尋會得到不相關的結果。這裡先用文字模型（非串流）把最新訊息依對話歷史補齊成
// 「獨立的搜尋字串」，同時順便清掉「幫我查」「搜尋」等指令詞。
// 注意：思考型模型的推理會吃掉 max_tokens，故給 1000 並過濾 <think>／reasoning；失敗回空字串，由呼叫端降級。
async function rewriteSearchQuery(query){
  try{
    const chat=chats[activeChatId];
    let hist='';
    if(chat){
      chat.messages.filter(m=>!m.error).slice(-6).forEach(m=>{   // 取最近 6 則（去除錯誤訊息）作為上下文
        const t=contentText(m).slice(0,300);
        if(t)hist+=(m.role==='user'?'使用者: ':'AI: ')+t+'\n';
      });
    }
    const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
    const sys='你是搜尋查詢產生器。根據對話上下文，把使用者最新訊息改寫成一條適合搜尋引擎的獨立查詢字串。規則：\n'+
      '1. 補齊代名詞與省略的內容，指涉的東西要寫清楚。\n'+
      '2. 必須保留原主題的具體名詞（城市、地點、事物）。例如前面在問「高雄天氣」，使用者只說「那你查一下」→ 就查「高雄 今天 天氣」。\n'+
      '3. 若使用者追問來源或細節（如「中央氣象署的資料呢」），要把來源與原主題合併，例如「中央氣象署 高雄 天氣」，不能只搜來源名稱。\n'+
      '4. 去除「幫我查」「搜尋一下」等指令詞。若需要日期，用具體日期（現在時間是 '+today+'）。\n'+
      '只輸出查詢字串本身，不要任何解釋、引號或多餘文字。';
    const resp=await fetch(getEndpoint()+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+pickApiKey()},
      body:JSON.stringify({
        model:getModel(),stream:false,max_tokens:1000,temperature:0.2,
        messages:[
          {role:'system',content:sys},
          {role:'user',content:(hist?('對話歷史:\n'+hist+'\n'):'')+'最新訊息: '+query}
        ]
      })
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const j=await resp.json();
    const raw=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    dbg('[Search] 改寫原始輸出:',raw);
    let q=raw.replace(/<think>[\s\S]*?(<\/think>|$)/g,'')          // 思考型模型：濾掉思考段（含未閉合）
      .split('\n').map(l=>l.trim()).filter(Boolean).pop()||'';     // 取最後一行非空文字（模型常先客套）
    q=q.replace(/^(查詢|搜尋|查詢字串|搜尋字串)\s*[:：]\s*/,'')     // 去除「查詢：」前綴
       .replace(/^["「『`']+|["」』`']+$/g,'').trim();              // 去前後引號
    if(!q||q.length>120)return '';                                 // 空值或過長視為無效改寫
    return q;
  }catch(e){
    dbg('[Search] 查詢改寫失敗:',e);
    return '';
  }
}

// 客戶端降級：把訊息中的搜尋指令詞／語尾助詞剝掉，取出實際要查的主題（剝完不足 2 字視為無主題）
function extractSearchTopic(text){
  let s=String(text||'');
  SEARCH_KEYWORDS.forEach(k=>{s=s.split(k).join(' ')});
  s=s.replace(/^(那你|那|就|再|然後|幫我|麻煩|請|拜託)+/g,'')
     .replace(/(一下|一下下|看看|好嗎|可以嗎|好不好|嘛|吧|囉|喔|哦|喵)+$/g,'')
     .replace(/[，,。!！?？～、\s]+/g,' ').trim();
  return s.length>=2?s:'';
}

// 從訊息中抓出網址（URL 本體限 ASCII 合法字元，避免把後面接的中文一起抓進來；去尾端標點、去重複、限量）
function extractUrls(text){
  const m=String(text||'').match(/https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/g)||[];
  const urls=m.map(u=>u.replace(/[。，、！？；：」』】〉》!?,;\)\]}'"…．]+$/,''));
  return [...new Set(urls)].slice(0,WEB_SEARCH.urlMaxPages);
}

// 一之6：網頁內容注入量自適應
// 3 頁 × 8000 字 ≈ 上萬 token，再疊上長對話歷史就可能撐爆模型 context，觸發「回覆中斷」。
// 改以總預算 urlCtxBudget 扣掉對話歷史的估計長度，動態決定每頁注入多少字（歷史越長，每頁給越少）。
function adaptivePageChars(pageCount){
  const n=Math.max(1,pageCount||1);
  let histChars=0;
  const chat=chats[activeChatId];
  if(chat)chat.messages.slice(-20).forEach(m=>{histChars+=Math.min(contentText(m).length,2000)});   // 只估最近 20 則（更舊的通常已被 ctxLimit 截掉）
  const per=Math.floor(((WEB_SEARCH.urlCtxBudget||24000)-histChars)/n);
  return Math.max(1200,Math.min(WEB_SEARCH.urlMaxChars,per));   // 下限 1200：再少就失去讀網頁的意義
}

// 網頁分析：訊息含網址時，用 Jina Reader 讀取內容注入 context，讓模型依頁面內容回答／分析
async function requestPageRead(text,urls){
  isStreaming=true;updateSendButton();   // 讀取進行中即視為串流狀態：避免期間使用者再送訊息造成並發請求
  abortCtrl=new AbortController();   // 讀取期間的「■ 停止」鈕支援
  const statusDiv=makeStatusEl('<span class="spinner"></span>🔗 正在讀取網頁（0/'+urls.length+'）');
  messagesEl.appendChild(statusDiv);
  followIfStuck();   // 讀取狀態列：僅在自動捲動開啟且貼底時跟上
  let context='';
  try{
    let done=0;
    const pages=await Promise.all(urls.map(async u=>{
      const txt=await jinaFetch(u,abortCtrl.signal);
      done++;
      if(statusDiv.isConnected)statusDiv.innerHTML='<span class="spinner"></span>🔗 正在讀取網頁（'+done+'/'+urls.length+'）';
      return {u:u,txt:txt};
    }));
    const ok=pages.filter(p=>p.txt&&p.txt.trim());
    if(!ok.length)throw new Error('所有網頁都讀取失敗');
    const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
    const perPage=adaptivePageChars(ok.length);   // 一之6：依對話歷史長度動態決定每頁注入字數
    const parts=ok.map((p,i)=>{
      let s='[網頁 '+(i+1)+'] '+p.u+'\n內容:\n'+fixJinaLinks(p.txt).trim().slice(0,perPage);
      return s;
    });
    pages.forEach((p,i)=>{if(!(p.txt&&p.txt.trim()))parts.push('[網頁 '+(ok.length+1)+'] '+p.u+'\n（讀取失敗，請對此網址誠實說明無法取得內容）');});
    context='以下是使用者提供網址，於 '+today+' 透過網頁讀取工具取得的網頁實際內容（你沒有任何工具可呼叫，禁止輸出 tool_calls，請直接以文字根據這些內容回答）：\n\n'+parts.join('\n\n')+
      '\n\n（回答規則：以上即為網頁的實際內容，請依使用者的問題或指示分析、摘要、解讀。引用網頁連結時必須使用 Markdown 格式 [文字](網址)，網址須與內容中出現的原始網址完全一致，不可夾帶 $ 符號或自行拼湊。現在時間是 '+today+'。）';
    showToast('🔗 已讀取 '+ok.length+' 個網頁','success');
  }catch(e){
    if(abortCtrl&&abortCtrl.signal.aborted){
      showToast('已停止讀取網頁','warn');
      abortCtrl=null;isStreaming=false;updateSendButton();
      return;
    }
    console.error('[Page] 網頁讀取失敗:',e);
    showToast('網頁讀取失敗（'+e.message+'），<br>無法取得內容','warn');
    // fallback context：明確禁止 AI 偷跑去搜尋（Jina 失敗時不該自動觸發 web_search，
    // 搜尋結果跟原網址無關，會誤導使用者），noTools:true 讓 requestAI 不附帶 web_search 工具
    context='（重要：以下網址的網頁讀取工具（Jina Reader）讀取失敗，無法取得實際內容。請直接告訴使用者無法讀取這些網址，建議他們改用純文字貼上內容摘要、或換成可公開存取的網頁。'+
      '**不要**呼叫任何工具、**不要**用其他來源的資訊猜測網頁內容、**不要**搜尋網路。嚴格只用文字回答。）\n\n'+
      '使用者提供的網址：\n'+urls.map((u,i)=>`[網址 ${i+1}] ${u}`).join('\n');
  }finally{
    if(statusDiv.isConnected)statusDiv.remove();
  }
  await requestAI(context?{searchContext:context,noTools:true}:{});
}

// 三之1：記錄每次搜尋實際引用的來源（🔍 徽章點擊時可開啟來源面板）
const SEARCH_SOURCES=new Map();   // query → [{title,url}]
function setSearchSources(q,results){
  if(!q||!results||!results.length)return;
  if(SEARCH_SOURCES.size>=30){const first=SEARCH_SOURCES.keys().next().value;SEARCH_SOURCES.delete(first)}
  SEARCH_SOURCES.set(q,results.filter(r=>r&&r.url).slice(0,10).map(r=>({title:String(r.title||'').slice(0,120),url:String(r.url).slice(0,600)})));
}

// 三之3：搜尋結果快取（同一工作階段內相同查詢直接重用 context，省 Tavily／Jina 額度）
// 即時性查詢（今天／現在／股價…）不進快取，避免回覆時拿到幾分鐘前的舊資料。
const SEARCH_CACHE=new Map();          // key → {ctx,at,sources}
const SEARCH_CACHE_TTL=10*60*1000;     // 快取有效時間：10 分鐘
const SEARCH_CACHE_MAX=30;             // 最多保留 30 筆（超過淘汰最舊的）
const NO_CACHE_QUERY=/今天|今日|今晚|今晨|今早|現在|即時|剛剛|剛才|目前|最新|比分|股價|匯率|天氣/;
function searchCacheKey(q){return (WEB_SEARCH.engine||'')+'|'+String(q||'').trim().toLowerCase()}
function getSearchCache(q){
  if(!q||NO_CACHE_QUERY.test(q))return null;
  const k=searchCacheKey(q),e=SEARCH_CACHE.get(k);
  if(!e)return null;
  if(Date.now()-e.at>SEARCH_CACHE_TTL){SEARCH_CACHE.delete(k);return null}
  return e;
}
function setSearchCache(q,ctx){
  if(!q||!ctx||NO_CACHE_QUERY.test(q))return;
  const k=searchCacheKey(q);
  if(SEARCH_CACHE.size>=SEARCH_CACHE_MAX){const first=SEARCH_CACHE.keys().next().value;SEARCH_CACHE.delete(first)}
  SEARCH_CACHE.set(k,{ctx:ctx,at:Date.now(),sources:SEARCH_SOURCES.get(q)||null});
}

// 執行網路搜尋（依 WEB_SEARCH.engine：Jina Reader s.jina.ai 或 Tavily）＋Jina 讀全文，
// 組出注入用的 context 字串；失敗丟錯由呼叫端處理
// statusCb(html)：更新「正在搜尋／閱讀」狀態文字（關鍵字路徑與 tool calling 路徑共用）
async function performSearch(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  // 三之3：快取命中 → 直接沿用上次的 context（不再打 Tavily、不再用 Jina 讀頁）
  const hit=getSearchCache(query);
  if(hit){
    if(hit.sources&&!SEARCH_SOURCES.has(query))setSearchSources(query,hit.sources);
    dbg('[Search] 快取命中，跳過搜尋:',query);
    st('<span class="spinner"></span>♻️ 沿用剛剛的搜尋結果');
    return hit.ctx;
  }
  // 引擎派發：Jina 搜尋走 s.jina.ai（純文字），Tavily 走 api.tavily.com（JSON）
  const ctx=WEB_SEARCH.engine==='jina'
    ? await performJinaSearch(query,statusCb,sig)
    : await performTavilySearch(query,statusCb,sig);
  setSearchCache(query,ctx);
  return ctx;
}

// ---- Jina Reader 搜尋（s.jina.ai）----
// 官方建議：以 POST 帶 JSON body {"q": "查詢"}，並用 Authorization: Bearer 帶 key。
// 加 X-With-Links-Summary / X-With-Images-Summary 後，回應會是 JSON 結構（data 內含搜尋結果）。
// 若伺服器不支援 JSON body（舊版）而回純文字，也會自動 fallback 到 markdown 解析。
async function performJinaSearch(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  dbg('[Search] Jina 查詢:',query);
  const ac=new AbortController();
  if(sig&&sig.aborted)ac.abort();
  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});
  const tid=setTimeout(()=>ac.abort(),25000);
  st('<span class="spinner"></span>🔍 正在搜尋');
  let raw='';
  let isJson=false;
  try{
    const resp=await fetch(SUPABASE_PROXY_BASE+'/jina/search',{
      method:'POST',
      headers:Object.assign(proxyHeaders(),{ // Jina Key 由後端注入；以下為搜尋行為參數，原樣轉發
        'X-Engine':'browser',                              // 官方能拿到正確資訊的引擎（s.jina.ai 搜尋+JSON 結構）
        'X-Locale':'zh-TW',                               // 與官方測試一致，結果回 zh-Hant-TW
        'X-With-Images-Summary':'true',
        'X-With-Links-Summary':'true',
        'Accept':'application/json, text/plain'
      }),
      body:JSON.stringify({q:query}),
      signal:ac.signal
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const ct=(resp.headers.get('Content-Type')||'').toLowerCase();
    isJson=ct.indexOf('json')>=0;
    raw=await resp.text();
  }finally{clearTimeout(tid)}
  if(!raw||!raw.trim())throw new Error('Jina 搜尋回傳空白');
  // 依回應類型解析：JSON（新版）或純文字（舊版 fallback）
  const results=(isJson?parseJinaSearchJson(raw):parseJinaSearchResults(raw)).slice(0,WEB_SEARCH.maxResults);
  if(!results.length){
    dbg('[Search] Jina 未解析出結果，raw 開頭:',raw.slice(0,400));
    throw new Error('Jina 未找到搜尋結果');
  }
  dbg('[Search] Jina 解析出結果數:',results.length);
  // 與 Tavily 相同的「讀前 N 筆全文 → 其餘附摘要 → 組 context」流程
  return buildSearchContext(query,results,st,sig,true);
}

// 新版 s.jina.ai 的 JSON 回應解析。結構通常形如：
//   { "code":200, "status":2000000, "data": { ..., "search": [ { "url":"..","title":"..","description":".." } ] } }
// 但欄位可能為 links／results／data 直接陣列、或 metadata.title 等。這裡容錯抽取出各候選欄位。
function parseJinaSearchJson(text){
  let obj=null;
  try{obj=JSON.parse(text)}catch(e){return []}
  const out=[];
  // 收集所有可能包含結果的陣列
  const candidates=[];
  if(obj&&obj.data){
    if(Array.isArray(obj.data.search))candidates.push(obj.data.search);
    if(Array.isArray(obj.data.links))candidates.push(obj.data.links);
    if(Array.isArray(obj.data.results))candidates.push(obj.data.results);
    if(Array.isArray(obj.data))candidates.push(obj.data);
  }
  if(obj){
    if(Array.isArray(obj.search))candidates.push(obj.search);
    if(Array.isArray(obj.results))candidates.push(obj.results);
    if(Array.isArray(obj.links))candidates.push(obj.links);
  }
  const seen=new Set();
  for(const arr of candidates){
    if(Array.isArray(arr))arr.forEach(item=>{
      if(!item||typeof item!=='object')return;
      const url=(item.url||item.link||item.href||(item.metadata&&item.metadata.url)||'').trim();
      if(!url||!/^https?:\/\//i.test(url)||seen.has(url))return;
      seen.add(url);
      const title=(item.title||item.name||(item.metadata&&(item.metadata.title||item.metadata.name))||'').trim();
      const desc=(item.description||item.content||item.snippet||item.summary||(item.metadata&&item.metadata.description)||'').trim();
      out.push({title:title,url:url,content:desc});
    });
    // 找到就停；避免重複加同一批資料
    if(out.length)candidates.length=0;
  }
  return out;
}

// s.jina.ai 的純文字通常形如：
//   Title: OOO
//   URL: https://...
//   Description: ...
//   (有時夾雜 AUTHOR、PUBLISH DATE 等欄位，或原文擷取段落)
// 這裡用「Title + 下一個 URL」區塊切割，容錯未知欄位；回傳 [{title,url,content}]
function parseJinaSearchResults(text){
  const out=[];let cur=null;
  // Jina 實際回傳格式為「[N] Title: ..」「[N] URL Source: ..」「[N] Description: ..」(N 為結果編號)
  // 編號前綴要吃進去，避免被誤判成新 group
  const lineRe=/(?:^|\n)\s*(?:\[\d+\]\s*)?(Title|URL Source|URL|Description)\s*:\s*(.+?)\s*$/gim;
  let m;
  while((m=lineRe.exec(text))){
    const key=m[1].toLowerCase(),val=m[2];
    if(key==='title'){cur={title:val,url:'',content:''};out.push(cur)}
    else if((key==='url source'||key==='url')&&cur){cur.url=val}
    else if(key==='description'&&cur){cur.content=val}
  }
  // 過濾掉缺網址的虛項（s.jina.ai 偶爾單獨回一段無網址原文）
  return out.filter(x=>x.url&&/^https?:\/\//i.test(x.url));
}

// 共用組 context 流程：前 fetchPages 筆抓全文，其餘附摘要
// 優先用搜尋結果自帶的 content（Jina s.jina.ai 搜尋回應就含完整網頁內文），
// 只有在 r.content 為空或過短時才額外呼叫 jinaFetch(r.url) 抓全文（Tavily 走這條路徑）。
// 避免 Jina 搜尋後又 jinaFetch 一次同網址浪費額度，也避免 r.jina.ai 不支援的頁面（重導、SPA）
// 回 422 / 拉一堆不相干的 noise 進 context。
async function buildSearchContext(query,results,st,sig,fresh){
  setSearchSources(query,results);   // 三之1：記錄本次搜尋的來源，供訊息上的 🔍 面板顯示
  const top=results.slice(0,WEB_SEARCH.fetchPages);
  st('<span class="spinner"></span>📖 正在閱讀網頁（0/'+top.length+'）');
  let done=0;
  const pages=await Promise.all(top.map(async r=>{
    // r.content 已有足夠內容（Jina 搜尋結果）→ 直接用，不重抓
    const builtIn=(r.content&&r.content.trim().length>=200)?r.content.trim():'';
    let txt='';
    if(!builtIn){
      // 缺內文（Tavily 只有 description；或 Jina content 太短）才呼叫 r.jina.ai
      txt=await jinaFetch(r.url,sig);
    }
    done++;
    st('<span class="spinner"></span>📖 正在閱讀網頁（'+done+'/'+top.length+'）');
    return {r:r,txt:txt,builtIn:builtIn};
  }));
  const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
  const parts=pages.map((p,i)=>{
    let s='[來源 '+(i+1)+'] '+(p.r.title||'')+'\n網址: '+p.r.url;
    // 優先序：jinaFetch 結果 > 搜尋自帶 content > 搜尋自帶 description
    const body=fixJinaLinks((p.txt&&p.txt.trim())||p.builtIn||p.r.content||'');
    if(body)s+='\n內容:\n'+body.slice(0,WEB_SEARCH.pageChars);
    return s;
  });
  results.slice(WEB_SEARCH.fetchPages).forEach(r=>{
    parts.push('[來源 '+(parts.length+1)+'] '+(r.title||'')+'\n網址: '+r.url+'\n摘要: '+fixJinaLinks((r.content||'').slice(0,300)));
  });
  dbg('[Search] 完成，來源數:',results.length);
  return '以下是以「'+query+'」為關鍵字，於 '+today+' 進行網路搜尋的結果'+(fresh?'（本次限定近期內的資料，若其中沒有使用者問的當日資訊，請明確說明查無當日資料，不要把舊資料當成今天的）':'（搜尋已完成，結果直接列在下方；你沒有任何工具可呼叫，禁止輸出 tool_calls／函式呼叫，請直接以文字根據這些結果回答）')+'：\n\n'+parts.join('\n\n')+
    '\n\n（回答規則：1. 優先根據上述搜尋結果回答，引用到的資訊請附上來源連結（Markdown 格式）；連結只能原樣引用上方「網址:」列出的字串，不可自行拼湊、改寫或編造網址。2. 使用者問了多個對象（如多個城市）時，每個對象都要分別說明。3. 若搜尋結果與問題無關或不足，就依你自己的知識回答並說明。現在時間是 '+today+'。）';
}

// ---- 中央氣象署 OpenData 天氣直查（三之4）----
// 天氣類查詢不走 Tavily：直接向氣象署拉「今明 36 小時預報＋一週預報」（官方 JSON、免費、
// 有授權碼即可），組成精簡文字 context。台灣以外地區或需要更細資料時，requestAI 端
// 保留 web_search 工具讓模型自行 fallback（見 _cwa 提示）。
// 三之5：模型改寫的 query 常出現簡體（「高雄天气」）或英文（「Kaohsiung weather」），
// 只認繁體會漏判 → 明明是台灣天氣卻跑去跑 Tavily 白扣額度。這裡補上簡體與常見英文寫法。
// 補常見問法（實測漏接）：「巴黎現在幾度」「首爾冷不冷」原本不在表內 → 判定不是天氣查詢 →
// 掉進付費搜尋。加入 幾度／冷不冷／熱不熱／會冷／會熱／下雪／颳風／風大／悶熱／潮濕／濕度。
const WEATHER_RE=/天氣|天气|氣溫|气温|溫度|温度|降雨|下雨|雨量|颱風|台风|暴風圈|暴风圈|寒流|冷氣團|热浪|熱浪|高溫|高温|低溫|低温|紫外線|紫外线|體感|体感|預報|预报|幾度|幾多度|冷不冷|熱不熱|會冷|會熱|下雪|颳風|風大|悶熱|潮濕|濕度|weather|forecast|temperature|typhoon|rainfall/i;
const CWA_LOCATIONS=['基隆市','臺北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];
// 三之5：簡體地名用字 → 繁體。實測氣象署只認繁體縣市名：送簡體（花莲县）或英文（Kaohsiung）
// 會回 HTTP 200、success=true 但資料 0 筆，因此要在送出前先把縣市名轉成繁體。
const CWA_LOC_S2T=[[/县/g,'縣'],[/莲/g,'蓮'],[/兰/g,'蘭'],[/义/g,'義'],[/云/g,'雲'],[/园/g,'園'],[/门/g,'門'],[/东/g,'東'],[/龙/g,'龍']];
const CWA_CACHE=new Map();   // datasetId＋縣市 → {at,records}（氣象署約每小時更新，短 TTL 即可）
function isWeatherQuery(q){return WEATHER_RE.test(q||'')}
// 三之7：颱風類查詢（命中才多拉一次颱風警特報，避免每次天氣查詢都多打一支 API）。
// 「臺风」是必要的：縣市比對會先把「台」轉成「臺」，簡體「台风」在該步驟後會變成「臺风」。
const TYPH_RE=/颱風|台风|臺风|typhoon|暴風圈|暴风圈|熱帶性低氣壓|热带性低气压|陸上警報|海上警報|陆上警报|海上警报/i;
function isTyphoonQuery(q){return TYPH_RE.test(q||'')}
// 取單一資料集：params 為查詢參數（locationName/elementName 小寫＝F-C 系列；
// LocationName/ElementName 大寫＋中文元素名＝F-D0047-091；limit＝地震報告）
async function cwaFetch(ds,params,sig){
  const pkey=JSON.stringify(params||{});
  const key=ds+'|'+pkey;
  const hit=CWA_CACHE.get(key);
  if(hit&&Date.now()-hit.at<WEB_SEARCH.cwaCacheMs)return hit.records;
  const u=new URL(WEB_SEARCH.cwaEndpoint+ds);
  u.searchParams.set('format','JSON');
  for(const k in (params||{}))u.searchParams.set(k,params[k]);
  const ac=new AbortController();
  if(sig&&sig.aborted)ac.abort();
  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});   // 外部「■ 停止」鈕同步中斷
  const tid=setTimeout(()=>ac.abort(),TIMEOUT.cwa);
  try{
    let j=null;
    // 走後端代理：授權碼由後端注入（URL 不再帶 Key）；後端轉發無 CORS 問題，中繼分支刪除
    const pu=SUPABASE_PROXY_BASE+'/cwa/'+ds+'?'+u.searchParams.toString();
    const resp=await fetch(pu,{headers:proxyHeaders(),signal:ac.signal});
    if(!resp.ok)throw Object.assign(new Error('HTTP '+resp.status),{cwaHttp:true});
    j=await resp.json();
    if(!j||!j.records)throw new Error('資料集無資料（確認資料集代號與授權碼）');
    CWA_CACHE.set(key,{at:Date.now(),records:j.records});
    return j.records;
  }finally{clearTimeout(tid)}
}
function cwaTimes(loc,elName){   // 相容 F-C（小寫 elementName/time）與 F-D0047-091（大寫）兩種欄位
  const els=loc.weatherElement||loc.WeatherElement||[];
  const el=els.find(e=>e.elementName===elName||e.ElementName===elName);
  const t=el&&(el.time||el.Time);
  return t&&Array.isArray(t)?t:null;
}
function cwaVal(slot){   // 三種型態：F-C 的 parameter.parameterName、F-D0047 的 ElementValue[{鍵:值}]、舊式 elementValue[{value}]
  if(slot&&slot.parameter)return String(slot.parameter.parameterName!=null?slot.parameter.parameterName:'').trim();
  const ev=slot&&(slot.ElementValue||slot.elementValue);
  if(ev&&ev[0]){for(const k in ev[0]){const v=ev[0][k];if(v!=null&&v!=='')return String(v).trim()}}
  return '';
}
function cwaDay(iso){   // '2026-09-06T06:00:00+08:00' 或 '2026-09-06 06:00:00' → '9/6(週日)'
  const d=new Date(String(iso||'').replace(' ','T'));
  return isNaN(d)?String(iso||'').slice(5,10):((d.getMonth()+1)+'/'+d.getDate()+'(週'+'日一二三四五六'[d.getDay()]+')');
}
// 今明 36 小時（F-C0032-001）：每縣市每時段一行（Wx 氣溫 降雨% 舒適度）
function fmtCwaCurrent(records){
  const locs=records.location||((records.locations&&records.locations[0]&&records.locations[0].location)||[]);
  const out=[];
  for(const loc of locs){
    const wx=cwaTimes(loc,'Wx'),minT=cwaTimes(loc,'MinT'),maxT=cwaTimes(loc,'MaxT'),pop=cwaTimes(loc,'PoP12h'),ci=cwaTimes(loc,'CI');
    if(!wx)continue;
    const segs=[];
    for(let i=0;i<wx.length;i++){
      const w=cwaVal(wx[i]);
      const lo=minT&&minT[i]?cwaVal(minT[i]):'?',hi=maxT&&maxT[i]?cwaVal(maxT[i]):'?';
      const p=pop&&pop[i]?cwaVal(pop[i]):'',c=ci&&ci[i]?cwaVal(ci[i]):'';
      segs.push(w+' '+lo+'~'+hi+'°C'+(p?' 降雨'+p+'%':'')+(c?'（'+c+'）':''));
    }
    if(segs.length)out.push(loc.locationName+'：\n'+segs.map((x,i)=>'  '+String(wx[i].startTime||wx[i].StartTime||'').slice(5,16).replace('T',' ')+'起 '+x).join('\n'));
  }
  return out.join('\n');
}
// 一週（F-D0047-091）：按日期分組，每行一天（白天／夜晚各一筆）；LocationName 過濾後通常只有該縣市一筆
function fmtCwaWeek(records){
  const locs=(records.Locations&&records.Locations[0]&&records.Locations[0].Location)||[];
  const out=[];
  for(const loc of locs){
    const wx=cwaTimes(loc,'天氣現象'),minT=cwaTimes(loc,'最低溫度'),maxT=cwaTimes(loc,'最高溫度'),pop=cwaTimes(loc,'12小時降雨機率');
    if(!wx)continue;
    const days=[];   // [{date,segs:[]}]
    for(let i=0;i<wx.length;i++){
      const st=String(wx[i].StartTime||wx[i].startTime||'');
      const d=new Date(st.replace(' ','T'));
      const date=isNaN(d)?st.slice(0,10):((d.getMonth()+1)+'/'+d.getDate()+'(週'+'日一二三四五六'[d.getDay()]+')');
      const h=isNaN(d)?0:d.getHours();
      const label=h<6?'凌晨':(h<18?'白天':'夜晚');
      const lo=minT&&minT[i]?cwaVal(minT[i]):'?',hi=maxT&&maxT[i]?cwaVal(maxT[i]):'?';
      const p=pop&&pop[i]?cwaVal(pop[i]):'';
      const seg=label+' '+cwaVal(wx[i])+' '+lo+'~'+hi+'°C'+(p&&/\d/.test(p)?' 降雨'+p+'%':'');
      const last=days[days.length-1];
      if(last&&last.date===date)last.segs.push(seg);
      else days.push({date:date,segs:[seg]});
    }
    if(days.length)out.push((loc.LocationName||loc.locationName)+'：\n'+days.map(d=>'  '+d.date+'：'+d.segs.join('／')).join('\n'));
  }
  return out.join('\n');
}
// 地震報告（E-A0015-001 顯著有感／E-A0016-001 小區域）：摘要直接用官方 ReportContent（含時間、規模、最大震度）
function fmtCwaQuake(records){
  const list=(records&&records.Earthquake)||[];
  return list.map(eq=>{
    const info=eq.EarthquakeInfo||{};
    const t=new Date(String(info.OriginTime||'').replace(' ','T'));
    const when=isNaN(t)?String(info.OriginTime||'').slice(5,16):((t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
    const mag=info.EarthquakeMagnitude&&info.EarthquakeMagnitude.MagnitudeValue;
    return '● 規模 '+(mag!=null?mag:'?')+'｜深度 '+(info.FocalDepth!=null?info.FocalDepth:'?')+' km｜發震時間 '+when
      +'\n  震央：'+((info.Epicenter&&info.Epicenter.Location)||'?')
      +(eq.ReportContent?('\n  摘要：'+eq.ReportContent):'')
      +(eq.Web?('\n  報告：'+eq.Web):'');
  }).join('\n');
}
// 颱風警特報（W-C0034-001）：records.info[] 每筆是一個 CAP 格式的警報。
// 重要：不帶 expires=true 時，氣象署連「已解除的舊警報」也會回傳（實測 9/7 查詢仍回 8/28 解除的
// 沙德爾），直接餵給模型會被當成現況 → 比不查更糟。所以呼叫端帶 expires=true，
// 這裡再依 expires 時間做第二層過濾（雙重保險），只輸出尚未過期的警報。
function fmtCwaTyphoon(records){
  const list=(records&&records.info)||[];
  const now=Date.now();
  const out=[];
  for(const it of list){
    if(!it)continue;
    const exp=it.expires?new Date(String(it.expires).replace(' ','T')).getTime():NaN;
    if(!isNaN(exp)&&exp<=now)continue;   // 已過期 → 略過（不讓舊警報被當成現況）
    const head=[];
    if(it.headline)head.push(String(it.headline));
    const eff=it.effective?new Date(String(it.effective).replace(' ','T')):null;
    const exd=isNaN(exp)?null:new Date(exp);
    const fm=d=>d&&!isNaN(d)?((d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')):'';
    if(eff)head.push('發布 '+fm(eff));
    if(exd)head.push('有效至 '+fm(exd));
    const secs=(it.description&&it.description.section)||[];
    const body=secs.map(s=>'  '+s.title+'：'+String(s.value==null?'':s.value).replace(/\s+/g,' ').trim()).join('\n');
    out.push('● '+head.join('｜')+(body?'\n'+body:''));
  }
  return out.join('\n');
}
// ===== 國外天氣（Open-Meteo，免 Key；台灣縣市一律走 CWA，loc 抓不到才到這裡）=====
// 觸發：天氣意圖＋無台灣縣市＋問句殘留可 geocode 的地名（如東京天氣、紐約明天會下雨嗎）。
// 純「台灣天氣」「明天會下雨嗎」→ extractForeignPlace 回 null → 落回原本 CWA 全台 36 小時。
// 地名候選抽取：回傳「可能是地名」的候選陣列（依可信度排序），供 tryOpenMeteo 逐一 geocode。
// 回空陣列 → 呼叫端落回 CWA 全台 36 小時（純「明天會下雨嗎」這類沒講地點的問法）。
// 2026-09-16 修正：原本只回單一字串，且剝除詞表不完整，實測會抽出「東京一週」「本東京未來一週」
// 「東京那東京的」這類垃圾 → geocode 全部失敗 → 落回台灣全台資料，模型誤以為工具只會給台灣。
//   1. 不再單獨剝「日」——「日本」會被拆成「本」（「日」只在數字日期語境剝）。
//   2. 補剝時間／意圖／語助詞：一週／未來／旅遊／穿著／適合／那／的…
//   3. 改為「依空白分段 + 整段」多候選，讓「東京 天氣 那東京的呢」也能撈回「東京」。
function foreignPlaceCandidates(q){
  let s=String(q||'');
  if(/台灣|臺灣|國內|本島|外島|離島/.test(s))return [];   // 國內意圖 → CWA
  s=s.replace(/台/g,'臺');
  try{s=s.replace(new RegExp(WEATHER_RE.source,'gi'),'');}catch(e){}
  s=s.replace(/今天|今日|明天|明日|後天|大後天|昨天|前天|本週|這週|下週|上週|本周|下周|這周|週末|假日|現在|目前|此刻|最近|這幾天|未來|接下來|一週|兩週|一周|兩周|七天|7天|14天|半個月|這個月|下個月|年|月|\d{1,2}日|星期.|週.|每天|逐小時|\d+/g,'')
    .replace(/國外|海外|好嗎|好|嗎|呢|吧|啊|喔|耶|哦|請問|請|幫我|幫忙|查一下|查詢|怎麼樣|如何|會不會|會|怎麼|什麼|狀況|情形|穿搭|穿衣|穿著|適合出遊|出遊|出門|旅遊|旅行|遊玩|行程|景點|美食|適合|推薦/g,'')
    .replace(/[?？!！。,.，、]+/g,' ');
  const out=[];
  const push=v=>{
    v=String(v||'').replace(/[\s\u3000]+/g,'').replace(/^[那的這]+/,'').replace(/[那的這了吧呀]+$/,'');
    if(v.length>=2&&!out.includes(v))out.push(v.slice(0,12));
  };
  const segs=s.split(/[\s\u3000]+/).filter(Boolean);
  for(const seg of segs)push(seg);   // 分段優先：「日本 東京」先試「日本」（會被國名過濾）再試「東京」
  if(segs.length>1)push(segs.join(''));
  const en=String(q||'').match(/[A-Za-z]{4,}/);   // 純英文查詢（Tokyo weather）
  if(en)push(en[0]);
  return out;
}
function extractForeignPlace(q){const c=foreignPlaceCandidates(q);return c.length?c[0]:null;}

// 陳述句（今天天氣真好）不觸發；台灣縣市也會放行（tryCwaWeather 內 CWA 優先，本函式只管放行）。
// 放寬原因（實測漏接）：「東京天氣」「倫敦天氣」「高雄這週天氣」都是正常問法，卻因缺「嗎／呢／預報」
// 等問句詞而被擋 → 落到純文字請求。改為：地名能抽出來就放行，改用陳述句黑名單擋「只是在描述天氣」。
const WX_STATEMENT_RE=/真好|好熱|好冷|好涼|變涼|變冷|變熱|舒服|糟透|很不錯|很悶|下雨了|下雪了|出太陽|天氣不錯/;

// 直接串接會變成「東京東京」，geocode 一定失敗）。

function isForeignWxAsk(text,prev){
  if(!isWeatherQuery(text))return null;

  if(twCounty||isTyphoonQuery(s))return '臺灣';   // 台灣縣市／颱風 → 交給 CWA（呼叫端只用真值判斷，不看內容）

const OM_GEO='https://geocoding-api.open-meteo.com/v1/search';

// 這張表只放「實測查無」的常見城市，查到就當備援候選再試一次（不必維護完整對照）。
const FOREIGN_ALIAS={'首爾':'Seoul','釜山':'Busan','雪梨':'Sydney','墨爾本':'Melbourne','奧克蘭':'Auckland',
  '溫哥華':'Vancouver','多倫多':'Toronto','蒙特婁':'Montreal','大阪':'Osaka','京都':'Kyoto','札幌':'Sapporo',
  '福岡':'Fukuoka','名古屋':'Nagoya','曼谷':'Bangkok','普吉':'Phuket','峇里島':'Bali','吉隆坡':'Kuala Lumpur',
  '雅加達':'Jakarta','馬尼拉':'Manila','河內':'Hanoi','胡志明市':'Ho Chi Minh City','杜拜':'Dubai',
  '伊斯坦堡':'Istanbul','米蘭':'Milan','威尼斯':'Venice','巴塞隆納':'Barcelona','布拉格':'Prague','雪梨':'Sydney'};
// geocoding 會回一堆同名地點（實測「倫敦」第一筆是加拿大安大略省的倫敦市），
// 依 feature_code 取行政層級最高的（PPLC 首都 > PPLA 省會 > PPL 一般城市），同級再比人口。
function pickBestCity(results){
  if(!Array.isArray(results)||!results.length)return null;
  const RANK={PPLC:0,PPLA:1,PPLA2:2,PPLA3:3,PPLA4:4};
  const rank=fc=>RANK[String(fc||'')]!=null?RANK[fc]:5;
  const ok=results.filter(h=>h&&h.latitude!=null&&h.name!==h.country&&!/^PCL/.test(String(h.feature_code||'')));
  if(!ok.length)return null;
  // 人口優先：同名地點裡人口最多的幾乎就是使用者要的（紐約市 > 英國約克、倫敦市 > 加拿大倫敦），
  // 人口相同或缺失時才比行政層級（PPLC 首都 > PPLA 省會 > PPL）。
  ok.sort((a,b)=>((b.population||0)-(a.population||0))||(rank(a.feature_code)-rank(b.feature_code)));
  return ok[0];
}
function wmoText(c){const m={0:'晴',1:'大致晴朗',2:'多雲',3:'陰天',45:'霧',48:'霧凇',51:'輕微毛毛雨',53:'毛毛雨',55:'濃密毛毛雨',56:'凍毛毛雨',57:'凍毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'凍雨',67:'凍雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'小陣雨',81:'陣雨',82:'強陣雨',85:'陣雪',86:'強陣雪',95:'雷雨',96:'雷雨伴冰雹',99:'雷雨伴冰雹'};return m[c]!=null?m[c]:('代碼'+c);}
async function omJson(url,sig){
  const ac=new AbortController();

  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});
  const tid=setTimeout(()=>ac.abort(),TIMEOUT.cwa);

function fmtOmDay(iso){const m=String(iso||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return String(iso||'');const d=new Date(+m[1],+m[2]-1,+m[3]);return (+m[2])+'/'+(+m[3])+'(週'+'日一二三四五六'[d.getDay()]+')';}
function fmtOmForecast(j){
  if(!j||!j.daily||!Array.isArray(j.daily.time)||!j.daily.time.length)return '';
  const n=j.daily.time.length,out=[];
  for(let i=0;i<n;i++){
    const w=wmoText(j.daily.weather_code&&j.daily.weather_code[i]);
    const mx=j.daily.temperature_2m_max&&j.daily.temperature_2m_max[i],mn=j.daily.temperature_2m_min&&j.daily.temperature_2m_min[i];
    const p=j.daily.precipitation_probability_max&&j.daily.precipitation_probability_max[i];
    out.push('  '+fmtOmDay(j.daily.time[i])+'：'+w+' '+(mn!=null?Math.round(mn):'?')+'~'+(mx!=null?Math.round(mx):'?')+'°C'+(p!=null?' 降雨'+p+'%':''));
  }
  let head='';

// place 可為字串或候選陣列（foreignPlaceCandidates 的輸出）：逐一 geocode，取第一個「真的是城市」的結果。
// 2026-09-16：geocoding 對國名會回國家本身（「日本」→ feature_code PCLI，座標是全國中心點），
// 必須跳過換下一個候選，否則「日本 東京」會答成日本全國平均。
async function tryOpenMeteo(place,st,sig){
  const list=(Array.isArray(place)?place:[place]).map(v=>String(v||'').trim()).filter(Boolean);
  try{
    st('<span class="spinner"></span>🌍 正在查詢 Open-Meteo（氣象資訊）');
    let hit=null;
    // 兩段語言 × 原文／alias 四種組合都試：zh-TW 城市名才是繁體（「首爾」），
    // 但 zh-TW 的譯名庫較小（實測「巴黎」查無、zh 才查得到），所以 zh-TW 失敗再退 zh。
    for(const p of list){
      const names=[p,FOREIGN_ALIAS[p]].filter(Boolean);
      for(const lang of ['zh-TW','zh']){
        for(const nm of names){
          const g=await omJson(OM_GEO+'?name='+encodeURIComponent(nm)+'&count=5&language='+lang+'&format=json',sig);
          const h=pickBestCity(g&&g.results);
          if(h){hit=h;break}
        }
        if(hit)break;
      }
      if(hit)break;
    }
    if(!hit)throw new Error('查無地點「'+(list[0]||'')+'」');

    const body=fmtOmForecast(f);
