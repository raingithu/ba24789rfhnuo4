<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatCAT">
<title>ChatCAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--surface:#141414;--surface2:#1e1e1e;--accent:#9bbfdb;
  --text:#8899aa;--text2:#9bbbdb;--border:#2a2a2a;--input-bg:#111;
  --msg-user:#a1c4dc;--msg-ai:#a9cda8;--scrollbar:#2a2a2a;
  --msg-user-bg:rgba(92,132,166,.8);--msg-ai-bg:rgba(88,108,88,.8);
  --cat-fur:#7a8590;--cat-inner:#c49a9c;--cat-belly:#aeb6bf;--cat-paw:#6a7480;
  --cat-eye:#2a2f36;--cat-blush:rgba(196,154,156,.5);--cat-nose:#56606d;--cat-detail:#8a949e;
}
html,body{height:100%;font-family:'Noto Sans TC','Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.app{display:flex;height:100%;overflow:hidden}

/* 側邊欄 */
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:18px;font-weight:600;color:var(--accent)}
.btn-new{padding:8px 14px;background:var(--msg-user-bg);color:#fff;border:none;border-radius:18px;cursor:pointer;font-size:13px;transition:opacity .2s}
.btn-new:hover{opacity:.85}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .2s;display:flex;align-items:center;gap:8px}
.chat-item:hover{background:var(--surface2)}
.chat-item.active{background:var(--surface2);border:1px solid var(--accent)}
.chat-item .icon{font-size:16px}
.chat-item .title{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .del,.chat-item .act{opacity:0;font-size:12px;color:var(--text2);transition:opacity .2s;background:none;border:none;cursor:pointer;padding:2px 3px}
.chat-item:hover .del,.chat-item:hover .act{opacity:1}
.chat-item .del:hover,.chat-item .act:hover{color:var(--accent)}
.chat-group{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.5px;opacity:.85;padding:12px 12px 4px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.btn-settings{width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-settings:hover{border-color:var(--accent);color:var(--text)}

/* 主區域 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer}
.model-badge{padding:4px 10px;background:var(--surface2);border-radius:4px;font-size:12px;color:var(--text2)}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:75%;padding:12px 16px;border-radius:14px;line-height:1.6;font-size:14px;word-break:break-word;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.msg.user{color:#dceeff;
  background:linear-gradient(150deg,rgba(92,132,166,.92),rgba(70,105,140,.85));
  border-bottom-right-radius:4px;border:1px solid rgba(160,200,230,.35)}
.msg.assistant{color:var(--msg-ai);
  background:linear-gradient(150deg,rgba(88,108,88,.78),rgba(70,90,75,.82));
  border-bottom-left-radius:4px;border:1px solid rgba(160,200,160,.3)}

.msg.system{align-self:center;background:transparent;color:var(--text2);font-size:12px;border:none;padding:4px}
.msg .msg-img{max-width:220px;max-height:220px;border-radius:8px;display:block;margin-bottom:8px;border:1px solid var(--border)}
#statusMsg.typing{color:var(--msg-ai);}
.typing{align-self:flex-start;color:var(--msg-ai);background:var(--msg-ai-bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--text2);display:flex;align-items:center;gap:8px}
.typing::after{content:'';color:var(--msg-ai);animation:dots 1.5s infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.status-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:4px 8px}
.spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 輸入區 */
.input-area{z-index:1;padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface)}
.input-row{display:flex;gap:10px;align-items:flex-end}
#msgInput{flex:1;padding:12px 16px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;resize:none;max-height:150px;min-height:44px;outline:none;transition:border-color .2s}
#msgInput:focus{border-color:var(--accent)}
#msgInput::placeholder{color:var(--text2)}
.btn-attach{width:44px;height:44px;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(180,215,245,.06) 50%,rgba(120,160,210,.18));
  border:1px solid rgba(255,255,255,.22);border-radius:11px;color:#cfe3f5;font-size:18px;cursor:pointer;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 8px rgba(15,30,55,.3);
  position:relative;overflow:hidden;transition:all .25s}
.btn-attach::after{content:'';position:absolute;top:0;left:-90%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-25deg);transition:left .5s ease}
.btn-attach:hover{border-color:rgba(255,255,255,.45);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.4)}
.btn-attach:hover::after{left:140%}
.btn-attach:active{transform:translateY(0);box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.btn-imgmode.active{background:linear-gradient(160deg,rgba(255,214,110,.85),rgba(245,160,80,.75));border-color:rgba(255,200,90,.9);color:#3a2c00;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2px rgba(255,200,90,.35)}
.btn-imgmode.active::after{display:none}
.btn-imgmode.active:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2px rgba(255,200,90,.45)}
.msg .msg-img.large{max-width:min(420px,100%);max-height:420px}
.msg-img-slot{min-height:120px;min-width:120px;max-width:220px;max-height:220px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:8px;margin-bottom:8px;color:var(--text2);font-size:12px;background:rgba(255,255,255,.03)}
.attach-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.attach-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-remove{position:absolute;top:2px;right:2px;width:20px;height:20px;line-height:20px;text-align:center;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;font-size:12px;cursor:pointer;padding:0}
.attach-remove:hover{background:rgba(180,50,50,.9)}
.btn-send{width:44px;height:44px;background:linear-gradient(160deg,var(--msg-user-bg),var(--msg-user-bg) 25%,rgba(120,160,210,.18));
  border:0;border-radius:11px;color:#cfe3f5;font-size:18px;cursor:pointer;flex-shrink:0;
  position:relative;overflow:hidden;transition:all .25s}
.btn-send::after{content:'';position:absolute;top:0;left:-90%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-25deg);transition:left .5s ease}
.btn-send:hover{border-color:rgba(255,255,255,.45);color:#fff;}
.btn-send:hover::after{left:140%}
.btn-send:active{transform:translateY(0);box-shadow:inset 0 2px 8px rgba(0,0,0,.35);}
/* .empty{position:absolute;text-align:center;color:var(--text2);left:18%;bottom:10%;font-size:14px} */

/* 設定彈窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:96%;max-width:420px;max-height:640px;overflow-y:auto}
.modal h3{margin-bottom:16px;color:var(--accent)}
#settingSystem{background:var(--input-bg);color:var(--text);width:100%;height:60px;border:1px solid var(--border);border-radius:6px;outline:none;transition:border-color .2s}
#settingSystem:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--text2);opacity:.75}
.field{margin-bottom:3px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:18px;justify-content:center;margin-top:16px}
.modal-actions button{padding:10px 6px;border-radius:6px;cursor:pointer;font-size:13px;border:none}
.btn-cancel{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-save{background:var(--msg-user-bg);color:#fff}
.btn-reset{margin-right:auto;background:transparent;color:var(--text2);border:1px dashed var(--border);transition:all .2s}
.btn-reset:hover{border-color:var(--accent);color:var(--text)}

/* 確認彈窗 */
.confirm-overlay{z-index:150}
.confirm-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:90%;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.confirm-modal p{color:var(--text);font-size:14px;line-height:1.6;margin-bottom:16px;text-align:center;white-space:pre-line}

/* Toast 提示 */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:10px 18px;border-radius:10px;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.4);animation:toastIn .25s ease;max-width:80vw;word-break:break-word}
.toast.success{border-color:rgba(120,180,120,.6);color:var(--msg-ai)}
.toast.warn{border-color:rgba(200,170,90,.6);color:#e0c98a}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

/* ===== Markdown 與訊息增強樣式 ===== */
.msg p{margin:.35em 0}
.msg p:first-child{margin-top:0}
.msg p:last-child{margin-bottom:0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:.6em 0 .3em;line-height:1.4}
.msg h1{font-size:1.3em}.msg h2{font-size:1.2em}.msg h3{font-size:1.1em}
.msg ul,.msg ol{margin:.35em 0;padding-left:1.5em}
.msg li{margin:.15em 0}
.msg blockquote{margin:.4em 0;padding:.2em .8em;border-left:3px solid var(--border);opacity:.85}
.msg table{border-collapse:collapse;margin:.5em 0;font-size:.95em;display:block;overflow-x:auto}
.msg th,.msg td{border:1px solid var(--border);padding:4px 10px}
.msg th{background:rgba(255,255,255,.06)}
.msg hr{border:none;border-top:1px solid var(--border);margin:.6em 0}
.msg a{color:var(--accent)}
.msg :not(pre)>code{background:rgba(0,0,0,.25);padding:1px 6px;border-radius:4px;font-size:.9em;font-family:Consolas,Menlo,monospace}
.msg pre{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:.5em 0}
/* KaTeX：預設 .katex-display 不換行會撐破氣泡；強制容器內水平滾動 */
.msg .katex-display{display:block;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.2em 0}
.msg .katex{white-space:normal}
.msg .katex-display>.katex{display:inline-block;white-space:nowrap}
.msg pre code{font-family:Consolas,Menlo,'Courier New',monospace;font-size:13px;line-height:1.5;background:none;padding:0}
.code-copy{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:11px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:4px;cursor:pointer;opacity:0;transition:opacity .2s}
.code-view{right:54px}
.msg pre:hover .code-copy{opacity:1}
.code-copy:hover{color:var(--accent);border-color:var(--accent)}

/* 程式碼預覽彈窗 */
.preview-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:94%;max-width:960px;height:86vh;display:flex;flex-direction:column;overflow:hidden}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;flex:0 0 auto}
.preview-head-actions{display:flex;gap:8px}
.preview-head .btn-cancel{width:auto;padding:6px 12px;margin:0}
#previewFrame{flex:1;width:100%;border:none;background:#fff}

/* 訊息列：⋮ 絕對定位於氣泡外側（user 左 / AI 右），PC hover 顯示；手機長按氣泡直接開選單 */
.msg-row{display:flex;position:relative}
.msg-row.user{justify-content:flex-end}
.msg-menu-wrap{position:absolute;top:2px;z-index:5}
.msg-row.user .msg-menu-wrap{right:calc(100% + 6px)}
.msg-row.assistant .msg-menu-wrap{left:calc(100% + 6px)}
.msg-menu{display:block;width:24px;height:24px;z-index:100;border:none;background:transparent;color:var(--text2);font-size:15px;line-height:1;cursor:pointer;border-radius:50%;padding:0;opacity:0;visibility:hidden;transition:opacity .15s,background .2s}
.msg-menu:hover{background:var(--surface2)}
.msg-row:hover .msg-menu,.msg-row.menu-open .msg-menu{opacity:1;visibility:visible}
.msg-dropdown{position:absolute;top:0;right:-36px;z-index:30;background:var(--surface2);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:132px;overflow:hidden;display:none}
.msg-row.assistant .msg-dropdown{left:auto;right:0}
.msg-dropdown.open{display:block}
/* 選單開啟時整列拉到最上層（蓋過其他訊息列）；下方空間不足時改向上展開（positionDropdown 處理），不會被輸入列遮住 */
.msg-row.menu-open{z-index:60}
.msg-dropdown.up{top:auto;bottom:100%;margin-bottom:6px}
.msg-dropdown button{display:block;width:100%;z-index:100;text-align:left;padding:8px 14px;font-size:13px;background:none;border:none;color:var(--text);cursor:pointer;white-space:nowrap}
.msg-dropdown button:hover{background:var(--surface);color:var(--accent)}
/* 觸控裝置：不出現 ⋮（長按直接開選單）；長按中禁止文字選取 */
@media(hover:none){
  .msg-row:hover .msg-menu,.msg-row.menu-open .msg-menu{opacity:0;visibility:hidden}
  .msg-row.pressing .msg{-webkit-user-select:none;user-select:none}
  /* 當前選中的對話直接顯示操作圖示（其他對話維持長按顯示）；長按對話列不觸發反白 */
  .chat-item.active .act,.chat-item.active .del{opacity:1}
  .chat-item{-webkit-user-select:none;user-select:none}
  .chat-item input{-webkit-user-select:text;user-select:text}
}

/* 錯誤訊息 */
.msg.error{background:rgba(120,60,60,.35);border:1px solid rgba(220,120,120,.4);color:#e8b8b8;font-size:13px}

/* 思考過程（reasoning）摺疊區塊 */
.thinking{margin-bottom:8px;font-size:12px;color:var(--text2)}
.thinking summary{cursor:pointer;user-select:none;opacity:.8}
.thinking summary:hover{opacity:1}
.thinking-body{margin-top:6px;padding:8px 12px;background:rgba(0,0,0,.2);border-left:2px solid var(--border);border-radius:4px;white-space:pre-wrap;word-break:break-word}

/* 回到最新按鈕 */
.main{position:relative}
.scroll-bottom{position:absolute;right:20px;bottom:110px;width:36px;height:36px;border-radius:25%;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:16px;cursor:pointer;display:none;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.scroll-bottom.show{display:block}
.scroll-bottom:hover{color:var(--accent);border-color:var(--accent)}

/* 側邊欄：搜尋與項目操作 */
.chat-search{margin:8px 8px 0;padding:8px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;width:calc(100% - 16px)}
.chat-search:focus{border-color:var(--accent)}
.rename-input{flex:1;min-width:0;font-size:13px;background:var(--input-bg);border:1px solid var(--accent);border-radius:4px;color:var(--text);padding:2px 6px;outline:none}

/* 停止按鈕狀態 */
/* 停止鈕配色跟隨各主題的 AI 氣泡背景與文字色 */
.btn-send.stop{background:var(--ai-stop-bg,linear-gradient(150deg,rgba(88,108,88,.9),rgba(70,90,75,.9)));color:var(--ai-stop-fg,var(--msg-ai))}
body[data-theme="priconne"]{--ai-stop-bg:linear-gradient(150deg,#eee0ff,#d9c4fa);--ai-stop-fg:#7c4a9e}
body[data-theme="cream"]{--ai-stop-bg:linear-gradient(150deg,#ece7d2,#dcd4b4);--ai-stop-fg:#6b5e3c}
body[data-theme="matcha"]{--ai-stop-bg:linear-gradient(150deg,#f0f2df,#dfe4c6);--ai-stop-fg:#55663d}
body[data-theme="blue"]{--ai-stop-bg:linear-gradient(150deg,#e4f2fc,#cfe6f5);--ai-stop-fg:#2f5a78}
body[data-theme="wine"]{--ai-stop-bg:linear-gradient(150deg,#4a2c38,#38222b);--ai-stop-fg:#d8aeb9}
body[data-theme="gray"]{--ai-stop-bg:linear-gradient(150deg,#34383d,#2b2f34);--ai-stop-fg:#b0b8c2}
body[data-theme="orange"]{--ai-stop-bg:linear-gradient(150deg,#fbeed2,#f4ddb0);--ai-stop-fg:#7a5624}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100%;z-index:50;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:block}
  .scroll-bottom{bottom:100px;right:14px}

}

/* 設定欄位並排（模型 + 主題 各50%） */
.field-row{display:flex;gap:10px}
.field-row>.field{flex:1;min-width:0}

/* ===== 主題：粉嫩公主（可愛風）===== */
body[data-theme="priconne"]{
  --bg:#fde5ef;--surface:#ffeef6;--surface2:#ffd4e6;--accent:#f56ba4;
  --text:#8a4a66;--text2:#c47ba0;--border:#ffbcd8;--input-bg:#fff3f8;
  --msg-user:#fff;--msg-ai:#8a5fb8;--scrollbar:#ffb0d0;
  --msg-user-bg:rgba(245,107,164,.85);--msg-ai-bg:rgba(231,214,250,.9);
  --cat-fur:#ffb3d2;--cat-fur2:#fcdef0;--cat-fur3:#ffc4ea;--cat-inner:#ff7fb2;--cat-belly:#fee0f2;--cat-paw:#fd9ec4;
  --cat-eye:#5b3b78;--cat-blush:#ffbfe6;--cat-nose:#e05c9c;--cat-detail:#d97aa8;
  background-image:radial-gradient(rgba(245,107,164,.22) 1.5px,transparent 1.5px);
  background-size:22px 22px;
}
body[data-theme="priconne"] .msg{border-radius:18px;box-shadow:0 4px 14px rgba(255,143,188,.28),inset 0 1px 0 rgba(255,255,255,.6)}
body[data-theme="priconne"] .msg.user{color:#fff;background:linear-gradient(150deg,#ff9ec6,#f77fb2);border:1px solid rgba(255,255,255,.7)}
body[data-theme="priconne"] .msg.assistant{color:#7c4a9e;background:linear-gradient(150deg,#eee0ff,#d9c4fa);border:1px solid rgba(180,140,230,.55)}
body[data-theme="priconne"] .typing{color:var(--msg-ai);background:linear-gradient(150deg,#eee0ff,#d9c4fa);border:1px solid rgba(180,140,230,.55);border-radius:14px}

/* 小寵物顯示切換（由 applyTheme() 以 JS 控制） */
.pet{display:none}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{animation:sway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}
.flap{animation:flap 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes riseFade{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-44px);opacity:0}}
.bubble{animation:riseFade 3.4s ease-in infinite;transform-box:fill-box}
.steam{animation:riseFade 4.2s ease-in-out infinite;transform-box:fill-box}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.drift{animation:drift 5s ease-in-out infinite;transform-box:fill-box}
/* ===== 批次1 新增 ===== */
/* A5 合併後，.act/.del 樣式集中在檔頭 */
/* C1 圖片燈箱 */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:88vh;transform-origin:center center;cursor:grab;user-select:none;-webkit-user-drag:none}
.lightbox-btn{position:fixed;top:14px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer;z-index:1002;transition:transform .15s ease,background .15s ease}
.lightbox-btn:hover{transform:scale(1.1);box-shadow:0 0 0 1px rgba(255,255,255,.4)}
#lbClose{right:10px}
#lbDelete{right:50px}
#lbDownload{right:90px}
/* 燈箱左右切換：游標靠左右邊緣才顯示的箭頭（一般不顯示）；手機以滑動切換 */
.lb-nav{position:fixed;top:0;bottom:0;width:64px;display:none;align-items:center;justify-content:center;color:#fff;font-size:44px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:1001;user-select:none;-webkit-user-select:none}
.lb-prev{left:0;background:linear-gradient(to right,rgba(0,0,0,.4),transparent)}
.lb-next{right:0;background:linear-gradient(to left,rgba(0,0,0,.4),transparent)}
.lightbox:hover .lb-nav.avail{display:flex}
.lb-nav.avail:hover{opacity:1}
/* 從燈箱刪除圖片時，確認彈窗暫時拉到燈箱上層 */
#confirmModal.above-lightbox{z-index:1100}
/* C6 繼續生成按鈕 */
.continue-btn{display:block;margin-top:8px;padding:6px 12px;font-size:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer}
.continue-btn:hover{color:var(--accent);border-color:var(--accent)}
/* C3 訊息時間戳（長按選單第一行） */
.menu-time{padding:6px 14px 4px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap}
/* C3 訊息時間戳小氣泡：疊在訊息氣泡下緣邊線上（中心對齊邊線）、上層顯示；
   user 靠右、AI 靠左，且各留 8px 不貼齊訊息氣泡邊緣；樣式跟隨所屬氣泡 */
.msg-time{position:absolute;top:calc(100% - 9px);z-index:2;height:18px;line-height:18px;padding:0 10px;
  font-size:10px;border-radius:6px;white-space:nowrap;pointer-events:none;
  background:var(--msg-user-bg);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.msg-row.user .msg-time{right:8px}
.msg-row.assistant .msg-time,.msg-row.error .msg-time{left:8px;background:var(--msg-ai-bg);color:var(--msg-ai)}
/* C12 語音輸入（僅支援的瀏覽器顯示） */
.btn-mic:not(.enabled){display:none}
.btn-mic.listening{background:linear-gradient(160deg,rgba(255,120,120,.85),rgba(220,80,80,.8));border-color:rgba(255,140,140,.9);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.btn-send.hidden,.btn-mic.hidden{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,110,110,.5)}50%{box-shadow:0 0 0 6px rgba(255,110,110,0)}}
/* C2 側欄寵物＝匯出／匯入入口 */
.pet{cursor:pointer}
/* C9 Gallery：右上入口 + 格狀縮圖 */
.gallery-btn{margin-left:auto;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1}
.gallery-btn:hover{background:var(--surface2);color:var(--accent)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:56vh;overflow-y:auto;padding:4px}
.gallery-item{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface2)}
.gallery-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:zoom-in}
.gallery-item-info{font-size:10px;color:var(--text2);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-item-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.gallery-item:hover .gallery-item-actions,.gallery-item:focus-within .gallery-item-actions{opacity:1}
.gallery-item-actions button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer;line-height:1}
.gallery-item-actions button:hover{background:rgba(0,0,0,.75)}
</style>

<script>
function initCatHeadTilt(){
  const heads = document.querySelectorAll('.head');
  heads.forEach(head => {
    if (head.dataset.tiltReady) return;
    head.dataset.tiltReady = '1';

    let lastSide = 0;

    function tilt(){
      let side = Math.random() < 0.5 ? -1 : 1;
      if (side === lastSide) side *= -1;
      lastSide = side;

      const angle = side * (5 + Math.random() * 4);
      head.style.transform = `rotate(${angle}deg)`;

      setTimeout(() => {
        head.style.transform = 'rotate(0deg)';
        setTimeout(tilt, 4000 + Math.random() * 9000);
      }, 2200 + Math.random() * 1800);
    }

    setTimeout(tilt, 3000 + Math.random() * 7000);
  });
}

initCatHeadTilt();
</script>

let chats={};           // 啟動時由 loadChatsAsync() 載入（四：對話已搬遷至 IndexedDB）
let activeChatId=null;
let isStreaming=false;
let pendingImages=[];   // 待發送的圖片 {id,dataUrl} 陣列（dataUrl 用於預覽，原始資料已存 IndexedDB）
let abortCtrl=null;     // 串流中斷控制器

// ===== A2：blob URL 追蹤（渲染建立的 objectURL 統一記錄，重建訊息區時釋放）=====
const blobUrlRegistry=new Set();
function trackBlobUrl(u){if(u&&u.indexOf('blob:')===0)blobUrlRegistry.add(u);return u}
function revokeRenderBlobUrls(){
  blobUrlRegistry.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  blobUrlRegistry.clear();
}
// ===== B1：訊息渲染快取（以訊息物件為 key；WeakMap 不會被 JSON.stringify 存進 localStorage）=====
const renderCache=new WeakMap();
function renderContentCached(m){
  if(renderCache.has(m))return renderCache.get(m);
  const html=renderContent(m);
  try{renderCache.set(m,html)}catch(e){}
  return html;
}
// ===== A1：收集訊息／對話引用的圖片 id，並自 IndexedDB 刪除 =====
function collectMsgImageIds(m){
  const ids=[];
  if(m&&Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id)ids.push(p.id)});
  return ids;
}
function collectChatImageIds(c){
  const ids=[];
  ((c&&c.messages)||[]).forEach(m=>ids.push(...collectMsgImageIds(m)));
  return ids;
}
async function delMediaIds(ids){for(const id of ids){try{await mediaDel(id)}catch(e){}}}
// ===== B2：saveChatsData debounce（300ms；重點時刻呼叫 saveChatsDataNow() 立即寫入）=====
let saveTimer=null,savePending=null;
function saveChatsDataNow(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
  if(!savePending)return;
  const d=savePending;savePending=null;
  // 四：寫入 IndexedDB（逐筆 put，不再全量 stringify；失敗只提示，不影響畫面）
  idbPutChats(d).catch(e=>showToast('儲存失敗：'+((e&&e.message)||e),'warn'));
}
function saveChatsData(c){
  savePending=c||chats;
  if(saveTimer)return true;   // 300ms 內的重複呼叫合併為一次寫入
  saveTimer=setTimeout(saveChatsDataNow,300);
  return true;
}
// 同步備份到 localStorage：unload / 隱藏分頁時 IndexedDB 寫入可能不完成，留一份救援用
// （使用者全部刪除對話時會連帶清掉備份，避免下次啟動「復活」已刪資料）
function backupLocalStorageChats(){
  const d=savePending||chats;
  try{
    if(d&&Object.keys(d).length)localStorage.setItem('all_chats',JSON.stringify(d));
    else localStorage.removeItem('all_chats');
  }catch(e){}
}
window.addEventListener('beforeunload',()=>{saveChatsDataNow();backupLocalStorageChats()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveChatsDataNow();backupLocalStorageChats()}});

function loadSettings(){
  try{return JSON.parse(localStorage.getItem('chat_settings')||'{}')}catch(e){return {}}
}
function saveSettingsData(s){
  try{localStorage.setItem('chat_settings',JSON.stringify(s))}
  catch(e){showToast('設定儲存失敗：'+e.message,'warn')}
}
// ===== 四：IndexedDB 對話儲存（擺脫 localStorage 5MB 上限）=====
const APP_DB='chatcat_app',APP_DB_VER=1,APP_CHAT_STORE='chats';
function openAppDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('此瀏覽器不支援 IndexedDB'));return}
    let req;
    try{req=indexedDB.open(APP_DB,APP_DB_VER)}catch(e){rej(e);return}
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(APP_CHAT_STORE))db.createObjectStore(APP_CHAT_STORE,{keyPath:'id'});
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function idbAllChats(){
  return openAppDB().then(db=>new Promise((res,rej)=>{
    try{
      const rq=db.transaction(APP_CHAT_STORE,'readonly').objectStore(APP_CHAT_STORE).getAll();
      rq.onsuccess=()=>{db.close();res(rq.result||[])};
      rq.onerror=()=>{db.close();rej(rq.error)};
    }catch(e){db.close();rej(e)}
  }));
}
function idbPutChats(obj){
  return openAppDB().then(db=>new Promise((res,rej)=>{
    try{
      const tx=db.transaction(APP_CHAT_STORE,'readwrite');
      const st=tx.objectStore(APP_CHAT_STORE);
      Object.values(obj).forEach(c=>st.put(c));
      tx.oncomplete=()=>{db.close();res()};
      tx.onerror=()=>{db.close();rej(tx.error)};
      tx.onabort=()=>{db.close();rej(tx.error||new Error('write aborted'))};
    }catch(e){db.close();rej(e)}
  }));
}
function idbDeleteChat(id){
  return openAppDB().then(db=>new Promise((res,rej)=>{
    try{
      const tx=db.transaction(APP_CHAT_STORE,'readwrite');
      tx.objectStore(APP_CHAT_STORE).delete(id);
      tx.oncomplete=()=>{db.close();res()};
      tx.onerror=()=>{db.close();rej(tx.error)};
    }catch(e){db.close();rej(e)}
  }));
}
// 啟動載入：IndexedDB 為主；若 IDB 空且 localStorage.all_chats 有資料 → 自動遷移
// （localStorage 保留為備份並加標記，不主動刪除；使用者可自行清空）
async function loadChatsAsync(){
  try{
    const recs=await idbAllChats();
    if(recs&&recs.length){
      const out={};
      recs.forEach(c=>{if(c&&c.id)out[c.id]=ensureChatMeta(c)});
      return out;
    }
  }catch(e){
    console.warn('[Chat] IndexedDB 讀取失敗，改用 localStorage：',e);
  }
  let obj=null;
  try{obj=JSON.parse(localStorage.getItem('all_chats')||'null')}catch(e){obj=null}
  if(obj&&typeof obj==='object'&&Object.keys(obj).length){
    try{
      await idbPutChats(obj);
      localStorage.setItem('chatcat_idb_migrated',new Date().toISOString());   // 標記已遷移
      console.log('[Chat] 已將 localStorage 對話遷移至 IndexedDB：',Object.keys(obj).length,'場');
    }catch(e){
      console.warn('[Chat] 遷移寫入 IndexedDB 失敗，續用 localStorage：',e);
    }
  }
  if(obj)Object.values(obj).forEach(ensureChatMeta);
  return obj||{};
}

// ===== IndexedDB 圖片儲存（上傳圖、生成圖都存這裡，避免撐爆 localStorage）=====
const MEDIA_DB='chatcat_media',MEDIA_DB_VER=1,MEDIA_STORE='images';
function openMediaDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('此瀏覽器不支援 IndexedDB'));return}
    let req;
    try{req=indexedDB.open(MEDIA_DB,MEDIA_DB_VER)}catch(e){rej(e);return}
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(MEDIA_STORE))req.result.createObjectStore(MEDIA_STORE,{keyPath:'id'})};
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function mediaPut(id,data,createdAt){return openMediaDB().then(db=>new Promise((res,rej)=>{try{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put({id,data,createdAt:createdAt||Date.now()});tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}}catch(e){db.close();rej(e)}}))}
function mediaGet(id){return openMediaDB().then(db=>new Promise((res,rej)=>{try{const rq=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).get(id);rq.onsuccess=()=>{db.close();res(rq.result?rq.result.data:null)};rq.onerror=()=>{db.close();rej(rq.error)}}catch(e){db.close();rej(e)}}))}
function mediaDel(id){return openMediaDB().then(db=>new Promise((res,rej)=>{try{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}}catch(e){db.close();rej(e)}}))}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
// 為 <img data-media-id> 填入 IndexedDB 的圖片（dataURL 直接顯示，Blob 轉 objectURL）
function hydrateMedia(root){
  if(!root)return;
  root.querySelectorAll('img[data-media-id]').forEach(img=>{
    const id=img.dataset.mediaId;
    if(!id||img.dataset.hydrated)return;
    img.dataset.hydrated='1';
    mediaGet(id).then(data=>{
      if(data==null){
        // C9：圖片已被刪除（Gallery 刪除或孤兒清理）→ 訊息文字保留，圖片改顯示佔位框
        const ph=document.createElement('div');
        ph.className='msg-img-slot';
        ph.textContent='🖼️ 圖片已刪除';
        img.replaceWith(ph);
        return;
      }
      img.src=(typeof data==='string')?data:trackBlobUrl(URL.createObjectURL(data));
    }).catch(()=>{});
  });
}
// 舊資料遷移：把歷史中已存的 image_url（dataURL 或可抓取的 URL）搬進 IndexedDB，
// 改存輕量的 image_ref，避免日後撐爆 localStorage；回傳是否完成
async function migrateLegacyMedia(){
  let dirty=false,migrated=0;
  for(const c of Object.values(chats)){
    for(const m of c.messages){
      const cont=m.content;
      if(!Array.isArray(cont))continue;
      for(const p of cont){
        if(p.type==='image_url'&&p.image_url&&p.image_url.url){
          const url=p.image_url.url;
          let data;
          if(url.startsWith('data:'))data=url;
          else{try{const blob=await(await fetch(url)).blob();data=blob}catch(e){continue}}
          if(data==null)continue;
          const id='img_mig_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
          try{await mediaPut(id,data);migrated++}catch(e){continue}
          p.type='image_ref';p.id=id;delete p.image_url;
          dirty=true;
        }
      }
    }
  }
  if(dirty)saveChatsData(chats);
  return migrated;
}

async function deleteChat(id){
  const c=chats[id];
  if(c&&!await showConfirm(`將刪除「${c.title||'新對話'}」\n\n確定要刪除嗎？`))return;
  if(c)delMediaIds(collectChatImageIds(c));   // A1：對話內所有 image_ref 一併從 IndexedDB 刪除
  delete chats[id];
  saveChatsData(chats);
  idbDeleteChat(id).catch(()=>{});   // 四：同步刪除 IndexedDB 內的對話記錄
  if(activeChatId===id){
    const ids=Object.keys(chats).sort((a,b)=>chatLastTime(chats[b])-chatLastTime(chats[a]));
    setActiveChat(ids.length?ids[0]:null);   // 內部已呼叫 renderChatList
  }else{
    renderChatList();
  }
}

// 對話「最後活動時間」，排序與分組的依據：
// 優先 updatedAt；舊資料沒有就回退 createdAt，再沒有就回退最後一則訊息的時間
function chatLastTime(c){
  if(c&&c.updatedAt)return c.updatedAt;
  if(c&&c.createdAt)return c.createdAt;
  if(c&&Array.isArray(c.messages)){
    for(let i=c.messages.length-1;i>=0;i--){
      const t=c.messages[i]&&c.messages[i].createdAt;
      if(t)return t;
    }
  }
  return 0;
}
// 補齊舊對話缺漏的 meta（updatedAt／createdAt／title），讓排序與分組一直穩定
function ensureChatMeta(c){
  if(!c||typeof c!=='object')return c;
  if(!c.updatedAt)c.updatedAt=chatLastTime(c)||Date.now();
  if(!c.createdAt)c.createdAt=c.updatedAt;
  if(!c.title)c.title='新對話';
  return c;
}
// 對話有新增活動（新訊息／新回應）時更新最後活動時間；c 可為 id 或對話物件
function touchChat(c){
  const obj=typeof c==='string'?chats[c]:c;
  if(obj)obj.updatedAt=Date.now();
}
// 對話歷史分組標籤：今天 → 昨天 → 本週 → 上週 → 本月 → 月份（跨年加年份）
function chatGroupLabel(t){
  const MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const now=new Date();
  const d=new Date(t);
  const sod=x=>{const v=new Date(x);v.setHours(0,0,0,0);return v.getTime()};
  const day=sod(t);
  const diff=(sod(now.getTime())-day)/86400000;
  if(diff===0)return '今天';
  if(diff===1)return '昨天';
  const mon=new Date(sod(now.getTime()));
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));   // 本週一（一週從週一起算）
  const lastMon=new Date(mon);lastMon.setDate(lastMon.getDate()-7);
  if(day>=mon.getTime())return '本週';
  if(day>=lastMon.getTime())return '上週';
  if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth())return '本月';
  const label=MONTHS[d.getMonth()];
  return d.getFullYear()===now.getFullYear()?label:(d.getFullYear()+' 年 '+label);
}

function renderChatList(){
  const list=document.getElementById('chatList');
  const q=(document.getElementById('chatSearch').value||'').trim().toLowerCase();
  // 依「最後活動時間」新→舊（有最新訊息的對話自然排到最上面）
  let ids=Object.keys(chats).sort((a,b)=>chatLastTime(chats[b])-chatLastTime(chats[a]));
  if(q){
    ids=ids.filter(id=>{
      const c=chats[id];
      if((c.title||'').toLowerCase().includes(q))return true;
      return c.messages.some(m=>contentText(m).toLowerCase().includes(q));
    });
  }
  if(!ids.length){
    list.innerHTML=`<div class="chatList-empty" style="text-align:center;">${q?'找不到符合的對話':'尚無對話'}</div>`;
    return;
  }
  const itemHTML=id=>{
    const c=chats[id];
    return `<div class="chat-item ${id===activeChatId?'active':''}" data-id="${id}">
      <span class="icon">${c.pinned?'📌':'💬'}</span>
      <span class="title">${escHtml(c.title||'新對話')}</span>
      <button class="act" data-act="pin" type="button" title="${c.pinned?'取消置頂':'置頂'}">${c.pinned?'📍':'📌'}</button>
      <button class="act" data-act="rename" type="button" title="重新命名">📝</button>
      <button class="del" data-act="del" type="button" title="刪除">❌</button>
    </div>`;
  };
  // 搜尋時顯示平鋪結果（不打亂搜尋結果）；平常依時間分組
  if(q){
    list.innerHTML=ids.map(itemHTML).join('');
    return;
  }
  const rows=[];
  let lastGroup=null;
  const pushOne=id=>{
    const g=chats[id].pinned?'📌 置頂':chatGroupLabel(chatLastTime(chats[id]));
    if(g!==lastGroup){lastGroup=g;rows.push(`<div class="chat-group">${escHtml(g)}</div>`)}
    rows.push(itemHTML(id));
  };
  ids.filter(id=>chats[id].pinned).forEach(pushOne);
  ids.filter(id=>!chats[id].pinned).forEach(pushOne);
  list.innerHTML=rows.join('');
}
// 取出訊息的純文字（支援多模態陣列）
function contentText(m){
  const c=m.content;
  if(typeof c==='string')return c;
  if(Array.isArray(c))return c.map(p=>p.type==='text'?(p.text||''):(p.type==='image_ref'?'[圖片]':'')).join('\n');
  return String(c||'');
}
// 訊息是否含圖片（圖片生成模式 / 附圖的訊息）
function msgHasImage(m){
  return Array.isArray(m.content)&&m.content.some(p=>p.type==='image_ref'&&p.id);
}
// 對話列表事件委派：切換 / 置頂 / 重新命名 / 刪除
document.getElementById('chatList').addEventListener('click',async e=>{
  if(e.target.tagName==='INPUT')return; // 重新命名輸入中，不觸發其他行為
  const item=e.target.closest('.chat-item');
  if(!item)return;
  const id=item.dataset.id;
  const act=e.target.closest('[data-act]');
  if(!act){
    setActiveChat(id);
    document.getElementById('sidebar').classList.remove('open');
    return;
  }
  const a=act.dataset.act;
  if(a==='del'){await deleteChat(id);return}
  if(a==='pin'){chats[id].pinned=!chats[id].pinned;saveChatsData(chats);renderChatList();return}
  if(a==='rename'){
    const c=chats[id];
    const titleEl=item.querySelector('.title');
    const inp=document.createElement('input');
    inp.className='rename-input';inp.value=c.title||'';
    titleEl.replaceWith(inp);
    inp.focus();inp.select();
    const done=save=>{
      if(save&&inp.value.trim()){c.title=inp.value.trim().slice(0,60);saveChatsData(chats)}
      renderChatList();
    };
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'){ev.preventDefault();done(true)}
      else if(ev.key==='Escape'){ev.stopPropagation();done(false)}
    });
    inp.addEventListener('blur',()=>done(true));
  }
});

document.getElementById('chatSearch').addEventListener('input',()=>{

const messagesEl=document.getElementById('messages');

function renderMessages(keepPos){
  closeLightbox();           // 重建 DOM 前先收起燈箱，避免引用被釋放的 blob URL
  revokeRenderBlobUrls();    // A2：釋放上一輪渲染建立的 objectURL
  const chat=chats[activeChatId];
  if(!chat||!chat.messages.length){messagesEl.innerHTML='<div class="empty"></div>';scrollToBottom(false);return}
  messagesEl.innerHTML=chat.messages.map((m,i)=>msgHtml(m,i)).join('');   // B1：msgHtml 內部使用 renderContentCached
  enhanceCodeBlocks(messagesEl);
  renderMath(messagesEl);
  hydrateMedia(messagesEl);
  updateScrollBtn();   // 重建後更新「捲到底按鈕」顯示
  // 預設強制捲到底；keepPos=true 表示呼叫端會自行決定
  if(!keepPos)scrollToBottom(false);
}

// 刪除單則訊息時使用：只移除該列 DOM 並重編後續 data-idx，
// 不重建整個訊息區 → 捲動位置保持不變，其餘訊息自然上移補位（自動捲動關閉時畫面完全不受影響）
function removeMessageRow(idx){
  const row=messagesEl.querySelector(`.msg-row[data-idx="${idx}"]`);
  if(row)row.remove();
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    const i=parseInt(r.dataset.idx,10);
    if(!Number.isNaN(i)&&i>idx)r.dataset.idx=String(i-1);
  });
  if(!chats[activeChatId]||!chats[activeChatId].messages.length)messagesEl.innerHTML='<div class="empty"></div>';
  updateScrollBtn();
}
// 移除 idx（含）之後的所有列（編輯重送／重新生成時用；被移除的一定在尾端）
function removeMessageRowsFrom(idx){
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    const i=parseInt(r.dataset.idx,10);
    if(!Number.isNaN(i)&&i>=idx)r.remove();
  });
  if(!chats[activeChatId]||!chats[activeChatId].messages.length)messagesEl.innerHTML='<div class="empty"></div>';
  updateScrollBtn();
}
// 新訊息加入：只附加單一列 DOM，不重建整個訊息區。
// （innerHTML 重建會讓圖片重新載入、高度瞬間塌縮，捲動位置因此漂移——自動捲動關閉時尤其明顯；
//   附加方式對上方既有內容零影響，捲動位置完全不動）
function appendMessageRow(m){
  const chat=chats[activeChatId];
  if(!chat||!m)return;
  const i=chat.messages.indexOf(m);
  if(i<0)return;
  const empty=messagesEl.querySelector('.empty');
  if(empty)empty.remove();
  const wrap=document.createElement('div');
  wrap.innerHTML=msgHtml(m,i);
  const row=wrap.firstElementChild;
  if(!row)return;
  messagesEl.appendChild(row);
  enhanceCodeBlocks(row);
  renderMath(row);
  hydrateMedia(row);
  updateScrollBtn();
}

function msgHtml(m,i){
  const cls=m.role==='user'?'user':(m.error?'error':'assistant');
  const isUser=m.role==='user';
  // C3：訊息時間戳（舊資料無 createdAt 則不顯示）
  const tstr=m.createdAt?('🕒 '+new Date(m.createdAt).toLocaleString('zh-TW')):'';
  // 氣泡上顯示時間（完整時間保留在長按選單第一行）；使用者訊息不顯示，僅 AI 氣泡下方顯示
  const tshort=m.createdAt?new Date(m.createdAt).toLocaleTimeString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const timeRow=tstr?`<div class="menu-time">${escHtml(tstr)}</div>`:'';
  const timeBadge=(tshort&&!isUser)?`<div class="msg-time">${escHtml(tshort)}</div>`:'';
  // 選單項目：user = 複製/編輯；AI 純文字 = 複製/轉格式複製/重新生成；AI 圖片訊息 = 儲存圖片/重新生成（C4：皆附刪除）
  const delBtn=`<button data-act="delmsg" type="button">🗑️ 刪除</button>`;
  const items=isUser
    ?`<button data-act="copy" type="button">📋 複製</button><button data-act="edit" type="button">✏️ 編輯並重送</button>${delBtn}`
    :(msgHasImage(m)
      ?`<button data-act="saveimg" type="button">💾 儲存圖片</button><button data-act="editimg" type="button">🎨 修改圖片</button><button data-act="regen" type="button">🔄 重新生成</button>${delBtn}`
      :`<button data-act="copy" type="button">📋 複製（原始）</button><button data-act="copyconv" type="button">📋 複製（文字）</button><button data-act="regen" type="button">🔄 重新生成</button>${delBtn}`);
  // C6：因長度上限被截斷（finish_reason=length）的 AI 訊息，附「繼續生成」按鈕
  const contBtn=(m.truncated&&!isUser)?`<button class="continue-btn" type="button">⤵️ 繼續生成</button>`:'';
  return `<div class="msg-row ${cls}" data-idx="${i}"><div class="msg ${cls}">${renderContentCached(m)}${timeBadge}<div class="msg-menu-wrap"><button class="msg-menu" type="button" title="訊息選單" aria-label="訊息選單">⋮</button><div class="msg-dropdown">${timeRow}${items}</div></div>${contBtn}</div></div>`;
}

// 數學前置處理：
//  - 把模型的 LaTeX 分隔符 \[ .. \]、\( .. \) 轉成 KaTeX auto-render 認得的 $$ / $
//    （Markdown 會把反斜線當跳脫字元吃掉，必須在 parse 之前轉換）
//  - 程式碼區塊（``` 圍欄與行內 `code`）原樣保留，讓數學與程式碼互不干擾
//  - 已認得的數學（$$..$$、$..$）先「收進佔位符」，之後的「裸括號→行內數學」
//    才不會誤改到數學內部而產生巢狀 $（例如 $$OA^2 + OB^2 = (x_1^2 + 16) + …$$
//    被包成 $x_1^2 + 16$ 就會造成 KaTeX parse error）
//  - 顯示數學內若殘留巢狀 / 孤立的 $（舊資料或缺漏裁切所致），會還原成括號或直接清除
const MATH_PH_START='\uE000';
const MATH_PH_END='\uE001';
function preprocessMath(text){
  // 先抽出程式碼（``` 圍欄 + 行內 `code`）與一般文字
  const parts=String(text).split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/);
  return parts.map((p,idx)=>{
    if(idx%2===1)return p; // 程式碼原樣保留，不做任何數學轉換
    return convertMath(p);
  }).join('');
}
// 不含程式碼的文字上做數學轉換（含對舊資料的修補）
function convertMath(p){
  const tokens=[];
  const ph=s=>{tokens.push(s);return MATH_PH_START+(tokens.length-1)+MATH_PH_END;};
  const unph=s=>{
    const re=new RegExp(MATH_PH_START+'(\\d+)'+MATH_PH_END,'g');
    let t=s;
    // 循環還原：即使意外出現「佔位符包佔位符」的巢狀，內層也會在後續回合還原
    for(let k=0;k<20;k++){
      const n=t.replace(re,(m,i)=>tokens[+i]!==undefined?tokens[+i]:m);
      if(n===t)break;
      t=n;
    }
    return t;
  };
  // 1) \[ .. \] → 顯示數學（整段先收進佔位符，避免被後續步驟誤改）
  p=p.replace(/\\\[([\s\S]*?)\\\]/g,(m,c)=>ph('\n\n$$'+c+'$$\n\n'));
  // 2) \( .. \) → 行內數學
  p=p.replace(/\\\(([\s\S]*?)\\\)/g,(m,c)=>ph('$'+c+'$'));
  // 3) $$ .. $$ 顯示數學：內部殘留的巢狀 $..$ 還原成括號、孤立 $ 清除
  //    （舊版誤把括號包成 $..$，例如 $x_1^2 + 16$ 原本是 (x_1^2 + 16)）
  p=p.replace(/\$\$([\s\S]*?)\$\$/g,(m,c)=>ph('$$'+c.replace(/\$([^$\n]{1,120})\$/g,'($1)').replace(/\$/g,'')+'$$'));
  // 4) $ .. $ 行內數學（內容不含換行，避免誤抓跨行文字）
  p=p.replace(/\$([^$\n]{1,200}?)\$/g,(m,c)=>ph('$'+c+'$'));
  // 5) 裸括號內含數學符號（^ _ 或 \指令）時視為行內數學，如 (3^{x+1} = 27)
  //    此時真正的數學已被佔位符取代，不會再改到 $$..$$ 或 $..$ 內部
  //    佔位符本身不含 $ ( ) ^ _ \，不會再被此規則誤判
  p=p.replace(/\(([^()\n]{0,120})\)/g,(m,c)=>/[\\^_]/.test(c)?ph('$'+c+'$'):m);
  // 還原被保護的數學區段
  return unph(p);
}

// 保護 $$..$$ 不被 marked 掃進去：把每段顯示數學收進佔位符，
// marked 處理完後再還原。否則 marked 會把 `_x`、`*x*` 當斜體/粗體，
// 把公式結構毀掉（例：|_{L_{-m}} → |<em>L</em>{-m}）。
function shieldDisplayMath(text){
  const tokens=[];
  const re=/\$\$([\s\S]*?)\$\$/g;
  const shielded=text.replace(re,(m,c)=>{
    tokens.push('$$'+c+'$$');
    return MATH_PH_START+(tokens.length-1)+MATH_PH_END;
  });
  return {shielded,restore:s=>s.replace(new RegExp(MATH_PH_START+'(\\d+)'+MATH_PH_END,'g'),(m,i)=>tokens[+i]!==undefined?tokens[+i]:m)};
}

// KaTeX 自動排版（pre/code 內不自動渲染；載入失敗時靜默跳過）
function renderMath(el){
  if(window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        ignoredTags:['script','noscript','style','textarea','pre','code'],
        throwOnError:false
      });
    }catch(e){}
  }
  fitMathBlocks(el);
}

// 自動縮字級：每個 .katex-display 若自然寬超過容器可用寬度，就單獨往下縮到不溢出為止；
// 縮不到下限（10px）就交給水平 scrollbar。只動該段，不影響其他內容。
function fitMathBlocks(root){
  if(!root||!root.querySelectorAll)return;
  const MIN_PX=10;     // 下限：再小就糊了
  const STEP=0.92;     // 每次縮 92%
  const MAX_LOOPS=8;   // 安全閥
  root.querySelectorAll('.katex-display').forEach(box=>{
    box.style.fontSize='';   // 先還原到繼承值
    let n=0;
    while(box.scrollWidth>box.clientWidth+1&&n<MAX_LOOPS){
      const cur=parseFloat(getComputedStyle(box).fontSize);
      if(cur<=MIN_PX+0.5)break;   // 觸底，改走 scrollbar
      box.style.fontSize=(cur*STEP)+'px';
      n++;
    }
  });
}

// Markdown 渲染（CDN 載入失敗時退回純文字）
function mdToHtml(text){
  const t=preprocessMath(text);
  if(window.marked&&window.DOMPurify){
    try{
      // 先把 $$..$$ 收進佔位符，避免 marked 掃進去把 `_x` `*x*` 當斜體/粗體
      const {shielded,restore}=shieldDisplayMath(t);
      const html=DOMPurify.sanitize(marked.parse(shielded,{breaks:true}));
      return restore(html);
    }catch(e){return formatMsg(t)}
  }
  return formatMsg(t);
}

function formatMsg(text){
  return escHtml(text).replace(/\n/g,'<br>');
}

// 為程式碼區塊加上複製按鈕
// ===== 剪貼簿（PC / 手機皆可）=====
// 同步備援方案：隱藏 textarea + execCommand('copy')，相容性最好（手機瀏覽器、file:// 皆可用）
function copyTextSync(text){
  text=String(text||'');
  if(!text)return false;
  const textarea=document.createElement('textarea');
  textarea.value=text;
  textarea.setAttribute('readonly','');
  textarea.style.position='fixed';
  textarea.style.left='0';
  textarea.style.top='0';
  textarea.style.width='1px';
  textarea.style.height='1px';
  textarea.style.padding='0';
  textarea.style.border='0';
  textarea.style.outline='0';
  textarea.style.opacity='0.01';
  textarea.style.zIndex='999999';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  textarea.setSelectionRange(0,textarea.value.length);
  let success=false;
  try{success=document.execCommand('copy')}catch(e){}
  textarea.blur();
  document.body.removeChild(textarea);
  return success;
}
// 統一入口：優先 Clipboard API，失敗自動退回 execCommand
function copyToClipboard(text){
  text=String(text||'');
  if(!text)return Promise.resolve(false);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text)
      .then(()=>true)
      .catch(()=>Promise.resolve(copyTextSync(text)));
  }
  return Promise.resolve(copyTextSync(text));
}

// 轉格式複製：把 LaTeX 分隔符 \(..\) \[..\] 轉成 $..$ $$..$$（與畫面顯示用的轉換一致），
// 讓貼到其他支援數學的地方可直接使用；原樣複製仍保留在「📋 複製」
function convertCopyText(t){return preprocessMath(String(t||''));}

// ===== 儲存訊息圖片 =====
function extFromMime(t){
  t=String(t||'').toLowerCase();
  if(t.includes('jpeg')||t.includes('jpg'))return'.jpg';
  if(t.includes('webp'))return'.webp';
  if(t.includes('gif'))return'.gif';
  return'.png';
}
// 觸發瀏覽器下載（dataURL / blobURL 皆可）
function downloadHref(href,name){
  const a=document.createElement('a');
  a.href=href;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
// 抓取遠端圖片成 Blob：直接抓 → 失敗改走 CORS 圖片代理（Agnes 圖床無 CORS header，瀏覽器 JS 讀不到，需借代理）
// 會驗證回傳內容確實是圖片（避免代理的錯誤頁面被當成圖片）；全部失敗回傳 null。
// 注意：圖片 URL 會經過第三方代理伺服器。
async function blobIsImage(blob){
  const t=String(blob.type||'').toLowerCase();
  if(t.startsWith('image/'))return true;
  try{
    const b=new Uint8Array(await blob.slice(0,16).arrayBuffer());
    if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)return true;                // PNG
    if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return true;                             // JPEG
    if(b[0]===0x47&&b[1]===0x49&&b[2]===0x46)return true;                             // GIF
    if(b[0]===0x52&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50)return true; // WEBP
  }catch(e){}
  return false;
}
async function fetchRemoteImage(url,timeoutMs){
  timeoutMs=timeoutMs||30000;
  const enc=encodeURIComponent(url);
  const tries=[
    url,                                            // 有些圖床其實有開 CORS，先直接試
    'https://wsrv.nl/?url='+enc+'&n=-1',            // images.weserv.nl 圖片代理（實測對 Agnes 圖床有效，ACO:*）
    'https://api.allorigins.win/raw?url='+enc,      // allorigins 備援
    'https://api.codetabs.com/v1/proxy?quest='+enc, // codetabs 備援
  ];
  for(let i=0;i<tries.length;i++){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
      const r=await fetch(tries[i],{signal:ctrl.signal});
      clearTimeout(timer);
      if(!r.ok)continue;
      const blob=await r.blob();
      if(blob&&blob.size>0&&await blobIsImage(blob)){
        console.log('[Chat] 圖片抓取成功（來源：'+(i===0?'直接':('代理 #'+i))+'），大小:',blob.size);
        return blob;
      }
      console.warn('[Chat] 圖片來源 #'+i+' 回應非圖片（type:',blob.type,'size:',blob.size,'）');
    }catch(e){}
  }
  return null;
}
// 儲存訊息內的所有圖片（從 IndexedDB 取出：dataURL / Blob / 遠端 URL）
async function saveMessageImages(m){
  const parts=Array.isArray(m.content)?m.content.filter(p=>p.type==='image_ref'&&p.id):[];
  if(!parts.length){showToast('此訊息沒有圖片','warn');return}
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const base=`image_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  let saved=0,opened=0,failed=0;
  for(let i=0;i<parts.length;i++){
    const name=parts.length>1?`${base}_${i+1}`:base;
    try{
      const data=await mediaGet(parts[i].id);
      if(data==null){failed++;continue}
      if(typeof data==='string'){
        if(data.startsWith('data:')){
          downloadHref(data,name+extFromMime(data.slice(0,data.indexOf(','))));saved++;
        }else{
          // 遠端 URL：直接抓或走 CORS 代理抓回 Blob 再下載；都失敗才退回開新分頁讓使用者手動另存
          showToast('正在取得圖片…');
          const blob=await fetchRemoteImage(data);
          if(blob){
            const u=URL.createObjectURL(blob);
            downloadHref(u,name+extFromMime(blob.type));saved++;
            setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
          }else{
            const a=document.createElement('a');
            a.href=data;a.target='_blank';a.rel='noopener';
            document.body.appendChild(a);a.click();a.remove();
            opened++;
          }
        }
      }else if(data instanceof Blob){
        const u=URL.createObjectURL(data);
        downloadHref(u,name+extFromMime(data.type));saved++;
        setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
      }else failed++;
    }catch(e){failed++}
  }
  if(opened)setTimeout(()=>showToast('無法取得圖片資料，已開新分頁，請長按／右鍵另存圖片','warn'),saved?1800:0);
  if(failed&&!saved&&!opened)setTimeout(()=>showToast('儲存失敗：找不到圖片資料','warn'),(saved||opened)?1800:0);
}

// 取出 <pre> 的純文字（排除按鈕本身與結尾空行）
function preText(pre){
  const clone=pre.cloneNode(true);
  clone.querySelectorAll('.code-copy,.code-view').forEach(b=>b.remove());
  return (clone.textContent||'').replace(/\n+$/,'');
}

function enhanceCodeBlocks(root){
  root.querySelectorAll('pre').forEach(pre=>{
    if(pre.dataset.enhanced)return;
    pre.dataset.enhanced='1';
    const btn=document.createElement('button');
    btn.className='code-copy';btn.type='button';btn.textContent='複製';
    btn.addEventListener('click',()=>{
      copyToClipboard(preText(pre)).then(ok=>{
        if(ok){
          btn.textContent='已複製';
          setTimeout(()=>btn.textContent='複製',1500);
        }else{
          showToast('複製失敗','warn');
        }
      });
    });
    pre.appendChild(btn);

    // HTML / SVG 程式碼加上即時預覽按鈕
    const codeEl=pre.querySelector('code');
    const lang=((codeEl&&codeEl.className.match(/language-([\w-]+)/))||[])[1]||'';
    const raw=preText(pre);
    const looksHtml=/^\s*(<!DOCTYPE\s+html|<html[\s>]|<svg[\s>])/i.test(raw);
    if(looksHtml||/^(html|svg|xml|xhtml)$/i.test(lang)){
      const pv=document.createElement('button');
      pv.className='code-copy code-view';pv.type='button';pv.textContent='👁 預覽';
      pv.addEventListener('click',()=>openPreview(raw));
      pre.appendChild(pv);
    }
  });
}

function renderContent(m){

  if(typeof c==='string')html+=mdToHtml(c);
  else if(Array.isArray(c)){

// 組文本模型的上下文：把歷史中的 image_ref 從 IndexedDB 還原成文本模型可讀的 image_url
async function histToMsgs(hist){
  const IMG_LIMIT=4;   // B4：文字請求最多附「最後 4 張」圖；更舊的以 [圖片] 文字替代，避免請求爆量
  const allIds=[];
  hist.forEach(m=>{if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id)allIds.push(p.id)})});
  const keep=new Set(allIds.slice(-IMG_LIMIT));
  const out=[];
  for(const m of hist){
    const c=m.content;
    if(Array.isArray(c)){
      const parts=[];
      for(const p of c){
        if(p.type==='image_ref'&&p.id){
          if(keep.has(p.id)){
            const data=await mediaGet(p.id);
            if(data!=null){
              const url=typeof data==='string'?data:await blobToDataURL(data);
              parts.push({type:'image_url',image_url:{url}});
            }
          }else if(!parts.some(q=>q.type==='text'&&q.text==='[圖片]')){
            parts.push({type:'text',text:'[圖片]'});
          }
        }else parts.push(p);
      }
      out.push({role:m.role,content:parts});
    }else out.push({role:m.role,content:c});
  }
  return out;
}

// ===== C5：共用「503/queue is full/逾時自動重試」fetch（文字與圖片請求共用同一套模式）=====
// 回傳成功的 Response；使用者主動中止（AbortError）不重試直接丟出；
// 可重試錯誤用盡次數後丟出 Error（訊息截斷 300 字，與圖片請求一致）
async function fetchWithRetry(url,options,cfg){
  cfg=cfg||{};
  const timeoutMs=cfg.timeoutMs||60000;       // 單次嘗試的連線逾時（回應表頭前）
  const maxAttempts=cfg.maxAttempts||4;       // 最多嘗試次數
  const onStatus=cfg.onStatus||null;          // 重試進度回呼（更新狀態列）
  const onWait=cfg.onWait||null;              // 等待重試間隔的 callback（讓呼叫端把狀態文字切回「正在…」，避免「伺服器忙碌」殘留至下一輪請求完成）
  const prefix=cfg.statusPrefix||'';          // 狀態文字前綴（如 '🖼️ '）
  const isAborted=cfg.isAborted||(()=>false); // 等待重試間隔時檢查是否已被中止
  let resp=null,attempt=0,timedOut=false;
  while(true){
    attempt++;
    timedOut=false;
    const timeoutId=setTimeout(()=>{timedOut=true;cfg.abort&&cfg.abort()},timeoutMs);
    try{
      resp=await fetch(url,options);
    }catch(e){
      clearTimeout(timeoutId);
      if(e.name==='AbortError'&&!timedOut)throw e;   // 使用者主動停止，不重試
      if(attempt>=maxAttempts)throw e;               // 重試次數用完
      const wait=Math.min(5*attempt,15);
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+'連線逾時，'+wait+' 秒後自動重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      console.warn('[Chat] 連線逾時，自動重試第 '+(attempt+1)+' 次');
      await new Promise(r=>setTimeout(r,wait*1000));
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      if(onWait)onWait(attempt+1);   // 把狀態文字切回「正在…」避免「連線逾時」殘留
      continue;
    }
    clearTimeout(timeoutId);
    if(resp.ok)break;
    const errText=await resp.text();
    // 佇列已滿 / 伺服器忙碌 → 自動重試
    if((resp.status===503||/queue is full|please retry later/i.test(errText))&&attempt<maxAttempts){
      const wait=Math.min(5*attempt,15);
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+'伺服器忙碌，'+wait+' 秒後自動重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      console.warn('[Chat] 伺服器忙碌（503 queue is full），第 '+attempt+' 次失敗，'+wait+' 秒後重試');
      await new Promise(r=>setTimeout(r,wait*1000));
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      if(onWait)onWait(attempt+1);   // 把狀態文字切回「正在…」避免「伺服器忙碌」殘留 30~90 秒
      continue;
    }
    // 重試次數用盡：把常見錯誤代碼轉成友善中文訊息，避免把 JSON 錯誤內容直接丟給使用者
    const err=new Error();
    if(resp.status===503||/queue is full|please retry later/i.test(errText)){
      err.message='伺服器忙碌中，請稍後再試';
    }else if(resp.status===429){
      err.message='請求過於頻繁，請稍後再試';
    }else if(resp.status===401||resp.status===403){
      err.message='API Key 無效或權限不足';
    }else if(resp.status>=500){
      err.message='伺服器錯誤（'+resp.status+'），請稍後再試';
    }else{
      err.message=`HTTP ${resp.status}: ${errText.slice(0,300)}`;
    }
    throw err;
  }
  return resp;
}

// 依目前對話送出請求並串流顯示回應
async function requestAI(opts){
  opts=opts||{};
  const chat=chats[activeChatId];
  if(!chat)return;
  const apiKey=getApiKey();
  if(!apiKey){
    showToast('請先設定 API Key（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }
  isStreaming=true;
  updateSendButton();

  const container=messagesEl;
  const statusDiv=document.createElement('div');
  statusDiv.className='typing';
  statusDiv.id='statusMsg';
  statusDiv.innerHTML='<span class="spinner"></span>回應中';
  container.appendChild(statusDiv);
  followIfStuck();   // 回應中狀態列：僅在自動捲動開啟且貼底時跟上

  let aiDiv=null;   // 串流中的回應氣泡
  let full='';      // 累積的純文字
  let thinking='';  // 累積的推理內容（reasoning_content）
  let finishReason=null;   // C6：最後一個 chunk 的 finish_reason（length=被截斷）
  let rafId=0;

  try{
    // 組建上下文：排除錯誤訊息，並依設定限制歷史則數
    let hist=chat.messages.filter(m=>!m.error);
    const limit=getCtxLimit();
    if(limit!=='all'&&hist.length>parseInt(limit,10))hist=hist.slice(-parseInt(limit,10));
    const msgs=await histToMsgs(hist);
    const sys=getSystemPrompt();
    if(sys)msgs.unshift({role:'system',content:sys});
    // C6：續寫模式——補一則不存進歷史的指示訊息
    if(opts.continueHint)msgs.push({role:'user',content:opts.continueHint});
    console.log('[Chat] 發送請求至:', getEndpoint()+'/chat/completions');
    console.log('[Chat] 模型:', getModel());

    abortCtrl=new AbortController();
    const resp=await fetchWithRetry(`${getEndpoint()}/chat/completions`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
      body:JSON.stringify(Object.assign({
        model:getModel(),messages:msgs,stream:true,
        max_tokens:getMaxTokens(),temperature:getTemperature()
      },getQuickReply()?{logit_bias:{[QUICK_REPLY.token]:QUICK_REPLY.bias}}:{})),
      signal:abortCtrl.signal
    },{
      timeoutMs:60000,   // 只限「連線建立」（回應表頭前）；串流本身不限時
      maxAttempts:4,
      onStatus:h=>{if(statusDiv.isConnected)statusDiv.innerHTML=h},
      onWait:()=>{if(statusDiv.isConnected)statusDiv.innerHTML='<span class="spinner"></span>回應中'},
      isAborted:()=>abortCtrl.signal.aborted
    });

    console.log('[Chat] 回應狀態:', resp.status, resp.statusText);

    // 移除狀態提示，改用訊息氣泡
    statusDiv.remove();
    aiDiv=document.createElement('div');
    aiDiv.className='msg assistant';
    container.appendChild(aiDiv);
    followIfStuck(); // statusDiv 移除後建立 aiDiv：僅在自動捲動開啟且貼底時跟上

    // 剔除開頭空白行（模型有時會先輸出空行），顯示與儲存都經過它
    const clean=s=>s.replace(/^\s+/, '');
    // 以 requestAnimationFrame 節流重繪，避免每個片段都整段重建 HTML
    const show=()=>{
      if(rafId)return;
      rafId=requestAnimationFrame(()=>{
        rafId=0;
        aiDiv.innerHTML=renderContent({content:clean(full),thinking:thinking||null,thinkingOpen:true});
        enhanceCodeBlocks(aiDiv);
        renderMath(aiDiv);
        if(getAutoScroll()&&stickBottom)scrollToBottom(false);   // 串流中：自動滾動開啟且使用者仍貼底時持續跟上（雙 RAF 避免圖片/數學尚未 layout 造成中間地帶）
      });
    };
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer=''; // SSE 行緩衝
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      // 逐行切割 SSE
      let nl;
      while((nl=buffer.indexOf('\n'))>=0){
        const line=buffer.slice(0,nl).trim();
        buffer=buffer.slice(nl+1);
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]')continue;
        try{
          const j=JSON.parse(data);
          const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(delta.content)full+=delta.content;
          if(delta.reasoning_content)thinking+=delta.reasoning_content;
          if(j.choices&&j.choices[0]&&j.choices[0].finish_reason)finishReason=j.choices[0].finish_reason;
        }catch(e){/* 忽略無法解析的續傳片段 */}
      }
      show();
    }
    // 處理緩衝區殘留最後一行
    if(buffer.trim().startsWith('data:')){
      const data=buffer.trim().slice(5).trim();
      if(data!=='[DONE]'){
        try{
          const j=JSON.parse(data);
          const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(delta.content)full+=delta.content;
          if(delta.reasoning_content)thinking+=delta.reasoning_content;
          if(j.choices&&j.choices[0]&&j.choices[0].finish_reason)finishReason=j.choices[0].finish_reason;
        }catch(e){}
      }
    }
    // 完成後以完整訊息列重建 DOM（含 ⋮ 選單），並尊重使用者的捲動位置
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    chat.messages.push({role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now(),truncated:finishReason==='length'});   // C3：時間戳；C6：length 截斷標記
    touchChat(chat);   // 新回應完成：更新最後活動時間
    saveChatsData(chats);
    saveChatsDataNow();   // B2：串流結束立即寫入
    aiDiv.remove();
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加完成的訊息列，不重建（尊重使用者捲動位置）
    renderChatList();   // 依最後活動時間重新排序與分組（該對話移到頂端）
    if(getAutoScroll()){
      stickBottom=true;
      scrollToBottom(false);   // 自動滾動開啟：捲到最新（雙 RAF 等 layout 避免「中間地帶」；之後圖片載入由 load 監聽跟上）
    }else{
      showToast('有新訊息','success');   // 自動滾動關閉：AI 回應完成時提醒，畫面一律不動
    }
    updateScrollBtn();
    console.log('[Chat] 完成，長度:', full.length);
  }catch(e){
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    if(e.name==='AbortError'){
      // 使用者主動停止：保留已產生的部分內容
      if(aiDiv)aiDiv.remove();
      if(statusDiv.isConnected)statusDiv.remove();
      if(clean(full)){
        chat.messages.push({role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now()});   // C3：時間戳
        touchChat(chat);
        saveChatsData(chats);
        saveChatsDataNow();   // B2：立即寫入
        appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加保留的部分回應，不重建
        renderChatList();
        if(getAutoScroll()){stickBottom=true;scrollToBottom(false)}   // 自動捲動開啟才捲到底讓使用者看到已產生的部分
        showToast('已停止生成，已保留部分回應','warn');
      }else{
        showToast('已停止生成','warn');
      }
      return;
    }
    console.error('[Chat] 錯誤:', e);
    if(statusDiv.isConnected){
      statusDiv.innerHTML=`<span style="color:var(--accent)">✕ 錯誤：${escHtml(e.message)}</span>`;
      statusDiv.classList.remove('typing');
      setTimeout(()=>{if(statusDiv.isConnected)statusDiv.remove()},6000);
    }else{
      showToast('錯誤：'+e.message,'warn');
    }
    // 串流中若已有部分內容，先保留
    if(aiDiv&&clean(full)){
      aiDiv.remove();
      chat.messages.push({role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now()});   // C3：時間戳
    }
    // 錯誤訊息標記為 error：會顯示，但不會送回 API 上下文
    chat.messages.push({role:'assistant',content:`[錯誤] ${e.message}`,error:true});
    touchChat(chat);
    saveChatsData(chats);
    // 只附加新增的訊息列（部分回應＋錯誤），不重建整個訊息區（畫面不跑動）
    if(aiDiv&&clean(full))appendMessageRow(chat.messages[chat.messages.length-2]);
    appendMessageRow(chat.messages[chat.messages.length-1]);
    renderChatList();
  }finally{
    isStreaming=false;
    abortCtrl=null;
    updateSendButton();
    saveChatsDataNow();   // B2：串流結束沖掉待寫存的變更
  }
}

// 圖片模型請求（文生圖 / 圖生圖 / 多圖合成）
async function requestImage(opts){
  const chat=chats[activeChatId];
  if(!chat)return;
  const apiKey=getApiKey();
  if(!apiKey){
    showToast('請先設定 API Key（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }
  isStreaming=true;
  updateSendButton();

  const container=messagesEl;
  const statusDiv=document.createElement('div');
  statusDiv.className='typing';
  statusDiv.id='statusMsg';
  statusDiv.innerHTML='<span class="spinner"></span>🖼️ 正在生成圖片';
  container.appendChild(statusDiv);
  followIfStuck(); // 圖片請求 statusDiv 建立：僅在自動捲動開啟且貼底時跟上

  abortCtrl=new AbortController();
  const imgStart=performance.now();
  try{
    console.log('[Chat] 發送圖片請求至:', getEndpoint()+'/images/generations');
    console.log('[Chat] 圖片模型:', getImageModel());
    // 依官方文件：size 用檔位（2K）+ ratio（16:9）由後端解析；response_format 用 "url"
    // （官方範例用 url；曾嘗試 "b64_json" 會卡死 spinner 至 timeout，因此採 url 由前端下載）
    const body={model:getImageModel(),prompt:opts.prompt,size:getImageSize(),ratio:getImageRatio(),extra_body:{response_format:'url'}};
    if(opts.images&&opts.images.length){
      // 圖生圖：單張直接給 dataURL；多圖合成：給陣列
      body.extra_body.image=opts.images.length===1?opts.images[0]:opts.images;
    }
    console.log('[Chat] 圖片請求 body:', body);
    // 送出請求；與文字請求共用 fetchWithRetry：伺服器忙碌（503「queue is full」）或連線逾時時自動重試
    const resp=await fetchWithRetry(`${getEndpoint()}/images/generations`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal:abortCtrl.signal
    },{
      timeoutMs:120000,   // 2K 圖片生成正常 30~90 秒；單次嘗試逾時 2 分鐘視為卡死
      maxAttempts:5,
      onStatus:h=>{statusDiv.innerHTML=h},
      onWait:()=>{statusDiv.innerHTML='<span class="spinner"></span>🖼️ 正在生成圖片'},   // 重試間隔後立刻把狀態文字切回，避免「伺服器忙碌」殘留 30~90 秒
      statusPrefix:'🖼️ ',
      isAborted:()=>abortCtrl.signal.aborted
    });
    console.log('[Chat] 圖片回應狀態:', resp.status, resp.statusText, `(${Math.round(performance.now()-imgStart)}ms)`);
    statusDiv.innerHTML='<span class="spinner"></span>⬇️ 正在取得圖片';   // 重試成功後立刻切換狀態文字，避免「伺服器忙碌」殘留
    const j=await resp.json();
    console.log('[Chat] 圖片回應 body:', j);
    const item=(j.data&&j.data[0])||{};
    const b64=item.b64_json||'';
    const url=item.url||'';
    if(!b64&&!url)throw new Error('圖片模型未回傳圖片（請檢查 prompt 與 API 權限）');

    // 圖片存進 IndexedDB，歷史只留輕量 image_ref，不撐爆 localStorage
    const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    if(b64){
      // 優先使用 b64_json：伺服器直接給 base64，無 CORS 問題，且永久保存
      const dataUrl=b64.startsWith('data:')?b64:'data:image/png;base64,'+b64;
      await mediaPut(id,dataUrl);
    }else if(url.startsWith('data:')){
      await mediaPut(id,url);
    }else if(url){
      // Agnes 圖床（platform-outputs.agnes-ai.space）無 CORS header，瀏覽器 JS 無法直接讀取。
      // 透過直接抓取 / CORS 圖片代理把圖抓回來存進 IndexedDB：永久保存（URL 過期也不怕）且可直接下載。
      // 全部失敗才退回只存 URL 字串（顯示靠 <img src> 不受 CORS 影響）。
      const blob=await fetchRemoteImage(url,30000);
      if(blob){
        await mediaPut(id,blob);
        console.log('[Chat] 圖片已抓回存入 IndexedDB，大小:',blob.size);
      }else{
        console.warn('[Chat] 圖片抓取失敗（含代理），僅保存 URL，該圖可能無法直接下載');
        await mediaPut(id,url);
      }
    }
    statusDiv.remove();
    const prefix=opts.images&&opts.images.length?`已根據 ${opts.images.length} 張圖生成：`:'已生成圖片：';
    chat.messages.push({role:'assistant',content:[{type:'text',text:prefix+opts.prompt},{type:'image_ref',id,large:true}],createdAt:Date.now()});   // C3：時間戳
    touchChat(chat);
    saveChatsData(chats);
    saveChatsDataNow();   // B2：立即寫入
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加生成的圖片訊息列，不重建（尊重使用者捲動位置）
    renderChatList();
    if(getAutoScroll()){
      stickBottom=true;
      scrollToBottom(false);   // 自動滾動開啟：捲到最新（雙 RAF 等 layout；圖片載入後由 load 監聽跟上，避免「中間地帶」）
    }else{
      showToast('圖片已生成','success');   // 自動滾動關閉：圖片生成完成時提醒，畫面一律不動
    }
    updateScrollBtn();
    console.log('[Chat] 圖片完成，id:', id);
  }catch(e){
    if(e.name==='AbortError'){
      if(statusDiv.isConnected)statusDiv.remove();
      showToast('已停止生成圖片','warn');
      return;
    }
    console.error('[Chat] 圖片錯誤:', e);
    if(statusDiv.isConnected){
      statusDiv.innerHTML=`<span style="color:var(--accent)">✕ 錯誤：${escHtml(e.message)}</span>`;
      statusDiv.classList.remove('typing');
      setTimeout(()=>{if(statusDiv.isConnected)statusDiv.remove()},6000);
    }else{
      showToast('錯誤：'+e.message,'warn');
    }
    chat.messages.push({role:'assistant',content:`[錯誤] ${e.message}`,error:true});
    saveChatsData(chats);
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加錯誤訊息列，不重建
  }finally{
    isStreaming=false;
    abortCtrl=null;
    updateSendButton();
    saveChatsDataNow();   // B2：結束時沖掉待寫存的變更
  }
}

// ===== Modal 確認框 & Toast 提示 =====
function showConfirm(msg){
  return new Promise(resolve=>{
    const modal=document.getElementById('confirmModal');
    const yes=document.getElementById('confirmYes');
    const no=document.getElementById('confirmNo');
    document.getElementById('confirmMsg').textContent=msg;
    modal.classList.add('open');
    const done=v=>{
      modal.classList.remove('open');
      yes.removeEventListener('click',onYes);
      no.removeEventListener('click',onNo);
      modal.removeEventListener('click',onBg);
      resolve(v);
    };
    const onYes=()=>done(true);
    const onNo=()=>done(false);
    const onBg=e=>{if(e.target===modal)done(false)};
    yes.addEventListener('click',onYes);
    no.addEventListener('click',onNo);
    modal.addEventListener('click',onBg);
  });
}
function showToast(msg,type){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.innerHTML=msg;
  wrap.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2600);
}

// 輸入框自動調整高度；只要內容裝得下（未達 150px 捲動上限）就垂直置中，達上限後維持頂部對齊捲動
const msgInput=document.getElementById('msgInput');
// 隱藏量測用 textarea：量 placeholder 折行後的實際高度（同寬、同字體、同 padding）
let phMeter=null;
function measureNaturalH(text){
  if(!phMeter){
    phMeter=document.createElement('textarea');
    phMeter.setAttribute('readonly','');
    phMeter.rows=1;
    phMeter.style.position='absolute';
    phMeter.style.visibility='hidden';
    phMeter.style.left='-9999px';
    phMeter.style.top='0';
    phMeter.style.resize='none';
    phMeter.style.overflow='hidden';
    document.body.appendChild(phMeter);
  }
  const cs=getComputedStyle(msgInput),s=phMeter.style;
  s.width=msgInput.clientWidth+'px';
  s.boxSizing='border-box';
  s.border='0';
  s.padding=cs.padding;
  s.fontStyle=cs.fontStyle;s.fontWeight=cs.fontWeight;s.fontSize=cs.fontSize;
  s.lineHeight=cs.lineHeight;s.fontFamily=cs.fontFamily;s.letterSpacing=cs.letterSpacing;
  phMeter.value=text||' ';
  return phMeter.scrollHeight;
}
function layoutMsgInput(){
  msgInput.style.paddingTop='';msgInput.style.paddingBottom=''; // 先還原置中，避免污染量測
  msgInput.style.height='auto';
  msgInput.style.minHeight='0';                        // 暫時解除 min-height，量出內容自然高度
  let natural=msgInput.scrollHeight;                   // 內容自然高度（含上下 padding）
  // 空值時改量 placeholder（圖生圖提示文字在手機會折行，框要夠高才不會被切到）
  if(!msgInput.value){
    const ph=measureNaturalH(msgInput.getAttribute('placeholder')||'');
    if(ph>natural)natural=ph;
  }
  msgInput.style.minHeight='';
  msgInput.style.height=Math.min(natural,150)+'px';    // 長高邏輯與原本相同（上限 150px）
  // 有留白就上下均分 → 任何行數都垂直置中；達上限（捲動狀態）時 slack<=0，維持頂部對齊
  const slack=msgInput.clientHeight-natural;
  if(slack>0){
    const base=parseFloat(getComputedStyle(msgInput).paddingTop)||12;
    msgInput.style.paddingTop=(base+slack/2)+'px';
    msgInput.style.paddingBottom=(base+slack/2)+'px';
    msgInput.scrollTop=0;
  }
}

document.getElementById('fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];
  e.target.value='';
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    try{
      const dataUrl=await compressImage(f);
      const id='img_u_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
      await mediaPut(id,dataUrl);   // 存進 IndexedDB，歷史只留 image_ref，不撐爆 localStorage

    }
  }
});
// 大圖先壓縮（長邊 1024px、JPEG 85%），避免 localStorage 爆量
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('讀取失敗'));
    reader.onload=()=>{
      const dataUrl=reader.result;
      if(file.size<300*1024)return resolve(dataUrl);
      const img=new Image();
      img.onerror=()=>resolve(dataUrl);
      img.onload=()=>{
        const MAX=1024;
        if(img.width<=MAX&&img.height<=MAX)return resolve(dataUrl);
        const scale=Math.min(MAX/img.width,MAX/img.height);
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*scale);
        cv.height=Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        resolve(cv.toDataURL('image/jpeg',0.85));
      };
      img.src=dataUrl;
    };
    reader.readAsDataURL(file);
  });
}

// 設定面板不採用「點面板外關閉」（有取消按鈕，避免誤觸）；僅由取消／儲存／ESC 關閉

// ===== 捲動輔助 =====
// scrollToBottom：捲到底部。用雙 RAF 等 layout 完成後再 scroll，確保圖片非同步載入後仍能正確捲到最新位置。
// 預設遵守 getAutoScroll()：開啟才捲，關閉就不動（控制權完全在使用者）。
// force=true → 無條件捲，給「使用者手動點擊的按鈕」這類必須執行的場景用。
function scrollToBottom(smooth,force){
  if(!force&&!getAutoScroll())return;
  const doScroll=()=>{
    messagesEl.scrollTo({
      top:messagesEl.scrollHeight-messagesEl.clientHeight,
      behavior:smooth?'smooth':'auto'
    });
    updateScrollBtn();
  };
  requestAnimationFrame(()=>{
    requestAnimationFrame(doScroll);
  });
}
// stickBottom：使用者是否「貼在最新訊息」。新訊息（AI 回覆／生圖完成／送出訊息）時設 true；
// 使用者主動往上捲（滾輪／觸控）設 false，之後串流與圖片載入就不再拉動畫面。
let stickBottom=true;
// 使用者手勢離開底部：停止自動跟隨（scroll 事件會被程式式捲動觸發，故只攔 wheel/touch）
messagesEl.addEventListener('wheel',()=>{stickBottom=false},{passive:true});
messagesEl.addEventListener('touchmove',()=>{stickBottom=false},{passive:true});
// 自動捲動開啟且仍貼底時跟到最新
function followIfStuck(){
  if(getAutoScroll()&&stickBottom)scrollToBottom(false);
}
function updateScrollBtn(){
  const b=document.getElementById('btnScrollBottom');
  if(!b)return;
  // 「回到最新訊息」按鈕：自動滾動關閉且有訊息時顯示，提醒使用者有新訊息可看
  const hasMsg=chats[activeChatId]&&chats[activeChatId].messages.length>0;
  const showBtn=!!hasMsg&&(!getAutoScroll()||(messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight)>80);
  b.classList.toggle('show',showBtn);
}

// 圖片模式切換：ON 時送出改呼叫圖片模型（文生圖 / 圖生圖 / 多圖合成）
function updateImgModeHint(){
  const inp=document.getElementById('msgInput');
  if(!inp)return;
  inp.placeholder=imgMode
    ?(pendingImages.length
      ?`🎨 請輸入要修改的內容…（已附 ${pendingImages.length} 張，可選多張合成）`
      :'🎨 請描述圖片內容…')
    :'✒️ 請輸入訊息…';
  layoutMsgInput();   // placeholder 折行數可能改變，重算輸入框高度與置中
}
function toggleImgMode(){
  imgMode=!imgMode;
  const b=document.getElementById('btnImgMode');
  if(b)b.classList.toggle('active',imgMode);
  updateImgModeHint();
  showToast(imgMode?'已開啟圖片模式（🎨 送出時呼叫圖片模型）':'已切回文字模式','success');
}
document.getElementById('btnImgMode').addEventListener('click',toggleImgMode);

// ESC 關閉彈窗（訊息選單 > 預覽 > 確認 > 設定）
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.querySelector('.msg-dropdown.open')){closeAllMenus();return}
  const l=document.getElementById('lightbox');

// 圖片非同步載入時 scrollHeight 會變大（捲動位置會留在「中間地帶」）。
// 舊版用 ResizeObserver 觀察容器本身，但容器大小固定不會觸發，導致自動捲動停在半路。
