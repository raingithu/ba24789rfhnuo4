<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>曲線吞噬者</title>
<style>
:root {
    --bg-color: #1a1a1a;
    --grid-color: #2a2a2a;
    --snake-color: #00ffcc;
    --snake-head-color: #ccff00;
    --food-color: #ff3366;
    --text-color: #ffffff;
    --ui-bg: rgba(255, 255, 255, 0.1);
}

* {
    box-sizing: border-box;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
     margin: 0;
     padding: 10px;
     background-color: var(--bg-color);
     color: var(--text-color);
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
     height: 100vh;
     height: 100dvh;
     display: flex;
     flex-direction: column;
     align-items: center;
     overflow: hidden;
 }

 /* UI 資訊列 - 在遊戲視窗外面 */
 .ui-bar {
     width: 100%;
     max-width: 500px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     gap: 16px;
     padding: 10px 12px;
 }

 .ui-left {
     display: flex;
     align-items: center;
 }

 .ui-center {
     display: flex;
     align-items: baseline;
     gap: 12px;
 }

 .ui-right {
     display: flex;
     align-items: center;
 }

 /* 難度徽章 */
 .difficulty-badge {
     padding: 4px 12px;
     border-radius: 12px;
     font-size: 0.8rem;
     font-weight: 600;
     background: linear-gradient(135deg, rgba(204, 255, 0, 0.15), rgba(204, 255, 0, 0.05));
     color: var(--snake-head-color);
     border: 1px solid rgba(204, 255, 0, 0.2);
     white-space: nowrap;
 }

 /* 分數 */
 .score-board {
     display: flex;
     align-items: baseline;
     gap: 12px;
 }

 .score-board .label {
     font-size: 1.2rem;
     color: var(--snake-head-color);
 }

 .score-board span {
     font-size: 1.5rem;
     font-weight: 700;
     color: var(--snake-color);
     font-variant-numeric: tabular-nums;
 }

 /* 暫停按鈕 - 與難度徽章同風格 */
 #pause-btn {
     padding: 4px 12px;
     border-radius: 12px;
     font-size: 0.8rem;
     font-weight: 600;
     background: linear-gradient(135deg, rgba(204, 255, 0, 0.15), rgba(204, 255, 0, 0.05));
     color: var(--snake-head-color);
     border: 1px solid rgba(0, 255, 204, 0.2);
     cursor: pointer;
     white-space: nowrap;
     user-select: none;
     transition: all 0.2s ease;
 }

 #pause-btn:hover {
     background: linear-gradient(135deg, rgba(0, 255, 204, 0.25), rgba(0, 255, 204, 0.1));
     color: #fff;
 }

 #pause-btn:active {
     transform: scale(0.96);
 }

 #pause-btn.paused {
     background: linear-gradient(135deg, rgba(0, 255, 204, 0.15), rgba(0, 255, 204, 0.05));
     color: var(--snake-color);
     border-color: rgba(204, 255, 0, 0.2);
 }

/* 遊戲區域容器 - 吞噬者主題外框 */
 #game-container {
     position: relative;
     border-radius: 20px;
     box-shadow:
         0 8px 32px rgba(0, 0, 0, 0.7),
         0 0 60px rgba(0, 255, 204, 0.15),
         inset 0 2px 0 rgba(255, 255, 255, 0.2);
     width: 0;
     height: 0;
 }

 #game-container::before {
     content: '';
     position: absolute;
     top: 0;
     left: 0;
     right: 0;
     bottom: 0;
     border-radius: 20px;
     background: linear-gradient(135deg, #00ffcc, #ccff00, #00ffcc, #ccff00, #00ffcc);
     z-index: 0;
 }

canvas {
     display: block;
     border-radius: 14px;
     background-color: #1a1a1a;
 }

/* 遊戲覆蓋層 */
#overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    text-align: center;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    transition: opacity 0.3s;
    border-radius: 14px;
}

#overlay h1 {
    font-size: 3rem;
    margin: 0 0 20px 0;
    color: var(--snake-color);
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 20px var(--snake-color);
}

#overlay p {
    font-size: 1.2rem;
    color: #ddd;
    margin-bottom: 30px;
}

.btn {
    padding: 12px 30px;
    font-size: 1.2rem;
    background: linear-gradient(45deg, var(--snake-color), #00cc99);
    color: #000;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    font-weight: bold;
}

.btn:hover {
    transform: scale(1.04);
    background: #00cc99; color: rgba(0, 255, 204, 1);
}

.btn:active {
    transform: scale(0.95);
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
}

.hidden {
    opacity: 0;
    pointer-events: none;
}

/* 難度提升提示 */
#difficulty-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 255, 204, 0.5);
    color: #000;
    padding: 10px 10px;
    border-radius: 10px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
}

#difficulty-toast.show {
    opacity: 1;
}

#swipe-hint {
    position: fixed;
    bottom: 18px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.9rem;
    pointer-events: none;
}
</style>
</head>
<body>

    <div class="ui-bar">
         <div class="ui-left">
             <button id="pause-btn" title="暫停 (空白鍵)">⏸ 暫停</button>
         </div>
         <div class="ui-center">
             <div class="score-board">
                 <span class="label">分數</span>
                 <span id="score">0</span>
             </div>
         </div>
         <div class="ui-right">
             <div class="difficulty-badge">難度：天堂</div>
         </div>
     </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="overlay">
            <h1 id="status-text">曲線吞噬者</h1>
            <p id="final-score">改變吞噬者的移動方向吃掉蘋果！<br>手機觸控／PC鍵盤與滑鼠操作</p>
            <button class="btn" id="start-btn">開始遊戲</button>
        </div>
    </div>

    <div id="difficulty-toast">難度提升！</div>
    <div id="swipe-hint"></div>

<script>

// 遊戲設定與狀態
const config = {
    gridSize: 20,
    speed: 150,
    swipeThreshold: 30,
    tapThreshold: 10,
    colors: {
        bg: '#1a1a1a',
        snakeHead: '#ccff00',
        snakeBody: '#00ffcc',
        food: '#ff3366'
    },
    difficulty: {
        levels: [
            { score: 0, speed: 150, name: "天堂" },
            { score: 100, speed: 140, name: "簡單" },
            { score: 200, speed: 130, name: "一般" },
            { score: 300, speed: 120, name: "進階" },
            { score: 400, speed: 110, name: "高手" },
            { score: 500, speed: 100, name: "地獄" }
        ],
        maxLevelIndex: 5,
        currentLevelIndex: 0
    },
    walls: [],          // 不可穿過的牆面 [ {x, y} ]
    wallClosed: false,  // 是否已完全封閉
    wallAnimation: null, // { progress, total, side, col, row, startX, startY, endX, endY }
    };

let canvas, ctx;
let gameInterval;
let isPlaying = false;
let isPaused = false;
let score = 0;

let snake = [];
let food = { x: 0, y: 0 };
let direction = { x: 0, y: 0 };
let nextDirection = { x: 0, y: 0 };

let touchStartX = 0;
let touchStartY = 0;
let isTouching = false;

function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    resizeCanvas();
    
    // 確保 ctx 初始 scale 為 1（避免高 DPI 疊加）
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        startGame();
    });

    const pauseBtn = document.getElementById('pause-btn');
    pauseBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!isPlaying && !isPaused) return;
        togglePause();
    });

    const container = document.getElementById('game-container');
    document.addEventListener('pointerdown', handleTouchStart, { passive: false });
    document.addEventListener('pointermove', handleTouchMove, { passive: false });
    document.addEventListener('pointerup', handleTouchEnd, { passive: false });
    document.addEventListener('pointercancel', handleTouchEnd, { passive: false });
    
    container.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    container.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    
    // 鍵盤支援
    document.addEventListener('keydown', handleKeyDown);
    }

    function handleKeyDown(e) {
      if (!isPlaying) return;
    
      if (e.key === ' ') {
          e.preventDefault();
          togglePause();
          return;
      }
    
      const keyMap = {
          'ArrowUp': 'up', 'ArrowDown': 'down',
          'ArrowLeft': 'left', 'ArrowRight': 'right',
          'w': 'up', 's': 'down',
          'a': 'left', 'd': 'right',
          'W': 'up', 'S': 'down',
          'A': 'left', 'D': 'right'
      };
    
      const dir = keyMap[e.key];
      if (dir) {
          e.preventDefault();
          changeDirection(dir);
      }
    }

function resizeCanvas() {
    const container = document.getElementById('game-container');

    // 計算可用空間
    const uiBarHeight = 56;
    const hintHeight = 30;
    const padding = 20;

    const maxWidth = window.innerWidth - padding;
    const maxHeight = window.innerHeight - uiBarHeight - hintHeight - padding;

    // 格子大小由寬度決定（COLS=20 固定），這樣 32 行的高度在任何螢幕都一致
    let targetCellSize = Math.floor(maxWidth / 20);
    let CELL_SIZE = Math.max(15, Math.min(40, targetCellSize));
    const COLS = 20;
    const ROWS = 32;
    let canvasWidth = COLS * CELL_SIZE;
    let canvasHeight = ROWS * CELL_SIZE;

    // 如果高度超出螢幕，縮小格子大小直到能容納
    while (canvasHeight > maxHeight && CELL_SIZE > 10) {
        CELL_SIZE--;
        canvasWidth = COLS * CELL_SIZE;
        canvasHeight = ROWS * CELL_SIZE;
    }

    config.gridSize = CELL_SIZE;

    // 高 DPI 支援
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const BORDER = 10;
    container.style.width = (canvasWidth + BORDER * 2) + 'px';
    container.style.height = (canvasHeight + BORDER * 2) + 'px';

    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    canvas.style.width = canvasWidth + 'px';
    canvas.style.height = canvasHeight + 'px';
    canvas.style.position = 'absolute';
    canvas.style.top = BORDER + 'px';
    canvas.style.left = BORDER + 'px';

    draw();
}

function handleTouchStart(e) {
    if (!isPlaying) return;
    // 排除按鈕和覆寫層
    if (e.target.closest('#overlay, #start-btn, #pause-btn')) return;
    e.preventDefault(); 
    
    isTouching = true;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
}

function handleTouchMove(e) {
    if (!isPlaying || !isTouching) return;
    e.preventDefault();

    const diffX = e.clientX - touchStartX;
    const diffY = e.clientY - touchStartY;

    const distance = Math.sqrt(diffX*diffX + diffY*diffY);

    if (distance > config.tapThreshold) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0) changeDirection('right');
            else changeDirection('left');
        } else {
            if (diffY > 0) changeDirection('down');
            else changeDirection('up');
        }
    }
}

function handleTouchEnd(e) {
    isTouching = false;
}

function togglePause() {
    isPaused = !isPaused;
    const btn = document.getElementById('pause-btn');
    if (isPaused) {
        btn.innerText = '▶ 繼續';
        btn.classList.add('paused');
        clearInterval(gameInterval);
    } else {
        btn.innerText = '⏸ 暫停';
        btn.classList.remove('paused');
        gameInterval = setInterval(gameLoop, config.difficulty.speed);
    }
}

function toggleWallAnimation() {
    if (isPaused) return;
    
    const anim = config.wallAnimation;
    if (anim && anim.interval) {
        clearInterval(anim.interval);
        anim.paused = true;
    } else if (anim && anim.paused) {
        anim.interval = setInterval(() => {
            if (config.wallAnimation.currentIndex < config.wallAnimation.perimeter.length) {
                const cell = config.wallAnimation.perimeter[config.wallAnimation.currentIndex];
                config.walls.push({ x: cell.x, y: cell.y });
                config.wallAnimation.currentIndex++;
                draw();
                
                if (config.wallAnimation.currentIndex >= config.wallAnimation.perimeter.length) {
                    config.wallClosed = true;
                    clearInterval(config.wallAnimation.interval);
                    config.wallAnimation = null;
                }
            }
        }, 80);
    }
}

function startGame() {
    document.getElementById('overlay').classList.add('hidden');
    resetGame();
    isPlaying = true;

    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, config.difficulty.speed);
}

function resetGame() {
    isPaused = false;
    const btn = document.getElementById('pause-btn');
    btn.innerText = '⏸ 暫停';
    btn.classList.remove('paused');

    const COLS = 20;
    const ROWS = 32;
    const centerX = Math.floor(COLS / 2);
    const centerY = Math.floor(ROWS / 2);

    snake = [
        { x: centerX, y: centerY },
        { x: centerX, y: centerY + 1 },
        { x: centerX, y: centerY + 2 }
    ];

    direction = { x: 0, y: -1 };
    nextDirection = { x: 0, y: -1 };
    score = 0;

    config.difficulty.currentLevelIndex = 0;
    config.difficulty.speed = config.difficulty.levels[0].speed;

    config.walls = [];
    config.wallClosed = false;
    config.wallAnimation = null;
    config.extraWallsTriggered = false;

    updateDifficultyDisplay();

    updateScore();
    placeFood();
}

function changeDirection(newDir) {
    const goingUp = direction.y === -1;
    const goingDown = direction.y === 1;
    const goingRight = direction.x === 1;
    const goingLeft = direction.x === -1;

    switch (newDir) {
        case 'up':
            if (!goingDown) nextDirection = { x: 0, y: -1 };
            break;
        case 'down':
            if (!goingUp) nextDirection = { x: 0, y: 1 };
            break;
        case 'left':
            if (!goingRight) nextDirection = { x: -1, y: 0 };
            break;
        case 'right':
            if (!goingLeft) nextDirection = { x: 1, y: 0 };
            break;
    }
}

function gameLoop() {
    direction = nextDirection;

    const head = { ...snake[0] };
    head.x += direction.x;
    head.y += direction.y;

    const COLS = 20;
    const ROWS = 32;

    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;

    // 碰撞障礙物（僅在牆面完全關閉後生效）
    if (config.wallClosed) {
        for (let w of config.walls) {
            if (head.x === w.x && head.y === w.y) {
                gameOver();
                return;
            }
        }
    }

    for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
         score += 10;
         updateScore();
         placeFood();
          // 500 分後每次吃食物隨機新增障礙物
           if (config.extraWallsTriggered) {
               addRandomObstacle();
           }
    } else {
         snake.pop();
    }

    draw();
}

function placeFood() {
    const COLS = 20;
    const ROWS = 32;
    
    let valid = false;
    while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        
        // 避免食物出現在最外圍四週（防止死局）
        if (config.wallClosing && (food.x === 0 || food.x === COLS - 1 || food.y === 0 || food.y === ROWS - 1)) {
            continue;
        }
        
        valid = true;
              for (let part of snake) {
                  if (part.x === food.x && part.y === food.y) {
                      valid = false;
                      break;
                  }
              }
              for (let w of config.walls) {
                  if (w.x === food.x && w.y === food.y) {
                      valid = false;
                      break;
                  }
              }
    }
}

function gameOver() {
    isPlaying = false;
    clearInterval(gameInterval);
    
    document.getElementById('status-text').innerText = "粉身碎骨";
    document.getElementById('final-score').innerText = `分數：${score}`;
    document.getElementById('start-btn').innerText = "再玩一次";
    document.getElementById('overlay').classList.remove('hidden');
}

function updateScore() {
    document.getElementById('score').innerText = score;
    checkDifficulty();
}

function checkDifficulty() {
    const levels = config.difficulty.levels;
    const currentLevelIndex = config.difficulty.currentLevelIndex;
    
    if (currentLevelIndex < levels.length - 1) {
        const nextLevel = levels[currentLevelIndex + 1];
        if (score >= nextLevel.score) {
            config.difficulty.currentLevelIndex = currentLevelIndex + 1;
            config.difficulty.speed = nextLevel.speed;
            
            updateDifficultyDisplay();
            
            // 分數到 300 時觸發牆面關閉
             if (nextLevel.score === 300 && !config.wallClosed && config.wallAnimation === null) {
                 startWallClosure();
             }
            
             // 分數到 500 時，新增旗標：此後每次吃食物都會隨機增加障礙物
             if (nextLevel.score === 500 && !config.extraWallsTriggered) {
                 config.extraWallsTriggered = true;
             }
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, config.difficulty.speed);
            
            showDifficultyToast(nextLevel.name);
        }
    }
}

function updateDifficultyDisplay() {
    const levelIndex = config.difficulty.currentLevelIndex;
    const levelName = config.difficulty.levels[levelIndex].name;
    document.querySelector('.difficulty-badge').innerText = `難度：${levelName}`;
}

function showDifficultyToast(levelName) {
    const toast = document.getElementById('difficulty-toast');
    toast.innerText = `難度提升！目前：${levelName}`;
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 1500);
}

function addRandomObstacle() {
    const COLS = 20;
    const ROWS = 32;
    
    let attempts = 0;
    while (attempts < 100) {
        const x = Math.floor(Math.random() * COLS);
        const y = Math.floor(Math.random() * ROWS);
        
        // 不能出現在已有牆上
        let onWall = false;
        for (let w of config.walls) {
            if (w.x === x && w.y === y) {
                onWall = true;
                break;
            }
        }
        if (onWall) {
            attempts++;
            continue;
        }
        
        // 不能出現在蛇身上
        let onSnake = false;
        for (let part of snake) {
            if (part.x === x && part.y === y) {
                onSnake = true;
                break;
            }
        }
        if (onSnake) {
            attempts++;
            continue;
        }
        
        // 不能出現在食物上
        if (food.x === x && food.y === y) {
            attempts++;
            continue;
        }
        
        // 可以新增
        config.walls.push({ x, y });
        draw();
        return;
    }
}

// 牆面關閉動畫
function startWallClosure() {
    const COLS = 20;
    const ROWS = 32;

    config.wallClosing = true;
    // 收集四週格子：12點鐘順時針
    const perimeter = [];
    
    // 上方行 (row 0): 左 → 右
    for (let x = 0; x < COLS; x++) {
        perimeter.push({ x, y: 0 });
    }
    // 右方行 (col COLS-1): top+1 → bottom
    for (let y = 1; y < ROWS; y++) {
        perimeter.push({ x: COLS - 1, y });
    }
    // 下方行 (row ROWS-1): right-1 → left
    for (let x = COLS - 2; x >= 0; x--) {
        perimeter.push({ x, y: ROWS - 1 });
    }
    // 左方行 (col 0): bottom-1 → 1
    for (let y = ROWS - 2; y > 0; y--) {
        perimeter.push({ x: 0, y });
    }
    
    config.wallAnimation = {
        perimeter,
        currentIndex: 0,
        total: perimeter.length,
        interval: null
    };
    
    // 每 80ms 關閉一格
    config.wallAnimation.interval = setInterval(() => {
        if (config.wallAnimation.currentIndex < config.wallAnimation.perimeter.length) {
            const cell = config.wallAnimation.perimeter[config.wallAnimation.currentIndex];
            config.walls.push({ x: cell.x, y: cell.y });
            config.wallAnimation.currentIndex++;
            draw();
            
            if (config.wallAnimation.currentIndex >= config.wallAnimation.perimeter.length) {
                config.wallClosed = true;
                clearInterval(config.wallAnimation.interval);
                config.wallAnimation = null;
            }
        }
    }, 80);
}

function draw() {
    const displayWidth = canvas.width / (window.devicePixelRatio || 1);
    const displayHeight = canvas.height / (window.devicePixelRatio || 1);
    
    ctx.save();
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    
    ctx.fillStyle = config.colors.bg;
    ctx.fillRect(0, 0, displayWidth, displayHeight);

    // 繪製單一綠色背景 + 淡綠色格線
    const cs = config.gridSize;
    ctx.fillStyle = 'rgba(34, 120, 50, 0.25)';
    ctx.fillRect(0, 0, displayWidth, displayHeight);

    // 淡綠色格線（虛線）
    ctx.strokeStyle = 'rgba(100, 200, 120, 0.2)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 4]);
    for (let gx = 0; gx <= displayWidth; gx += cs) {
        ctx.beginPath();
        ctx.moveTo(gx + 0.5, 0);
        ctx.lineTo(gx + 0.5, displayHeight);
        ctx.stroke();
    }
    for (let gy = 0; gy <= displayHeight; gy += cs) {
        ctx.beginPath();
        ctx.moveTo(0, gy + 0.5);
        ctx.lineTo(displayWidth, gy + 0.5);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    // 邊界暈影（圖片的 vignette 效果，讓中心更聚焦）
    const vignetteGrad = ctx.createRadialGradient(
        displayWidth / 2, displayHeight / 2, Math.min(displayWidth, displayHeight) * 0.3,
        displayWidth / 2, displayHeight / 2, Math.max(displayWidth, displayHeight) * 0.7
    );
    vignetteGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vignetteGrad.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, displayWidth, displayHeight);
    
    if (snake.length > 0) {
         // 繪製蘋果食物
         drawApple(food.x, food.y, config.gridSize);
    }
    
    // 繪製牆面
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(142, 102, 72, 0.3)';
    for (let w of config.walls) {
        const size = config.gridSize * 0.7;
        const offset = (config.gridSize - size) / 2;
        const wx = w.x * config.gridSize + offset;
        const wy = w.y * config.gridSize + offset;

        // 牆壁漸層
        const grad = ctx.createLinearGradient(wx, wy, wx + size, wy + size);
        grad.addColorStop(0, '#888A70');   // 較亮
        grad.addColorStop(0.5, '#886644'); // 主色
        grad.addColorStop(1, '#664422');   // 較深
        ctx.fillStyle = grad;
        drawRoundRect(wx, wy, size, size, 3);
    }
    ctx.shadowBlur = 0;
    
    // 蛇身（單一 shadow 批次繪製）
    ctx.shadowBlur = 0;
    for (let i = 0; i < snake.length; i++) {
         const isHead = i === 0;
         if (isHead) {
             ctx.shadowBlur = 15;
             ctx.shadowColor = '#FFFFFF';
             ctx.fillStyle = '#FFFFFF';
         } else {
             // 蛇身漸層：越靠近尾巴越透明
             const opacity = 1 - (i / (snake.length + 5));
             ctx.fillStyle = `rgba(0, 255, 204, ${opacity})`;
         }

         const size = config.gridSize * 0.72;
          const offset = (config.gridSize - size) / 2;
        
         
         drawRoundRect(
             snake[i].x * config.gridSize + offset,
             snake[i].y * config.gridSize + offset,
             size, size, 
             4
         );
    }
    ctx.shadowBlur = 0;
    ctx.restore();
}

function drawRoundRect(x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();
}

function drawApple(cx, cy, cellSize) {
    // 與蛇身同風格：圓角矩形 + 漸層 + 陰影，但加入食物特徵
    const size = cellSize * 0.72;
    const offset = (cellSize - size) / 2;
    const x = cx * cellSize + offset;
    const y = cy * cellSize + offset;

    // 陰影
    ctx.save();
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(255, 50, 80, 0.5)';

    // 主體漸層（紅色系）
    const grad = ctx.createLinearGradient(x, y, x + size, y + size);
    grad.addColorStop(0, '#ff6688');
    grad.addColorStop(0.5, '#ee2244');
    grad.addColorStop(1, '#aa1133');
    ctx.fillStyle = grad;
    drawRoundRect(x, y, size, size, 4);
    ctx.restore();

    // 左上高光（橢圓形光斑）
    ctx.save();
    const hlX = x + size * 0.28;
    const hlY = y + size * 0.28;
    ctx.beginPath();
    ctx.ellipse(hlX, hlY, size * 0.18, size * 0.12, -0.4, 0, Math.PI * 2);
    const hlGrad = ctx.createRadialGradient(hlX, hlY, 0, hlX, hlY, size * 0.18);
    hlGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
    hlGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = hlGrad;
    ctx.fill();
    ctx.restore();

    // 右上角小梗（細短线段）
    ctx.save();
    ctx.strokeStyle = '#5a3520';
    ctx.lineWidth = Math.max(1.5, cellSize * 0.06);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + size * 0.5, y + size * 0.08);
    ctx.quadraticCurveTo(x + size * 0.55, y - size * 0.05, x + size * 0.62, y - size * 0.08);
    ctx.stroke();
    ctx.restore();

    // 小葉子（深綠，附著在梗旁）
    ctx.save();
    ctx.translate(x + size * 0.52, y + size * 0.02);
    ctx.rotate(-0.6);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(size * 0.12, -size * 0.15, size * 0.35, -size * 0.12, size * 0.38, size * 0.02);
    ctx.bezierCurveTo(size * 0.25, size * 0.06, size * 0.1, size * 0.06, 0, 0);
    const leafGrad = ctx.createLinearGradient(0, 0, size * 0.38, 0);
    leafGrad.addColorStop(0, '#3a9a3a');
    leafGrad.addColorStop(1, '#2a7a2a');
    ctx.fillStyle = leafGrad;
    ctx.fill();
    ctx.restore();

    // 右下角暗面（增強立體感）
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x + size * 0.65, y + size * 0.65, size * 0.25, size * 0.18, 0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(60, 5, 10, 0.2)';
    ctx.fill();
    ctx.restore();
}

function drawCircle(x, y, radius) {
    ctx.beginPath();
    ctx.arc(
        x * config.gridSize + config.gridSize / 2,
        y * config.gridSize + config.gridSize / 2,
        radius, 0, Math.PI * 2
    );
    ctx.fill();
}

window.onload = init;

</script>
