<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>糖果俄羅斯</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2b2d42 0%, #1a1c29 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #edf2f4;
            --accent-color: #ff006e;
            
            /* Candy Colors */
            --c-i: #06d6a0; /* Teal */
            --c-j: #118ab2; /* Blue */
            --c-l: #ef476f; /* Pink */
            --c-o: #ffd166; /* Yellow */
            --c-s: #06d6a0; /* Green (Wait, S is usually green. Let's fix mapping) */
            --c-t: #9b5de5; /* Purple */
            --c-z: #f72585; /* Red/Pinkish */
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
        }

           body {
                   margin: 0;
                   padding: 0;
                   background: var(--bg-gradient);
                   color: var(--text-color);
                   font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                   height: 100dvh;
                   display: flex;
                   justify-content: center;
                   align-items: center;
                   overflow: hidden;
               }

          #app {
              display: flex;
              flex-direction: column;
              gap: 8px;
              align-items: center;
              position: relative;
              width: 100%;
              max-width: 800px;
              padding: 10px;
          }

        /* Top bar: score | next | level */
        .top-bar {
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
            width: 100%;
            justify-content: center;
            flex-shrink: 0;
        }

        .panel-box {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid var(--glass-border);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .score-label {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
             font-size: 2.2rem;
             font-weight: bold;
             color: #fff;
             text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
         }

        /* Next piece preview - inline, no border */
        .next-preview {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

          #next-canvas {
                display: block;
                background: transparent;
            }

            #next-canvas {
                width: 72px;
                height: 72px;
            }

            /* Game Board Container */
        .game-container {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            flex-shrink: 1;
        }

        canvas#tetris {
            display: block;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
        }

        /* Overlay for Game Over / Pause */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .start-btn {
            padding: 12px 30px;
            background: var(--accent-color);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 110, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .btn {
             background: rgba(255, 255, 255, 0.1);
             border: 1px solid rgba(255, 255, 255, 0.2);
             border-radius: 50%;
             width: 56px;
             height: 56px;
             display: flex;
             justify-content: center;
             align-items: center;
             font-size: 22px;
             color: white;
             cursor: pointer;
             transition: background 0.1s, transform 0.1s;
             box-shadow: 0 4px 6px rgba(0,0,0,0.2);
         }

         .btn:active {
             background: rgba(255, 255, 255, 0.3);
             transform: scale(0.95);
         }

         .btn-icon {
             width: 56px;
             height: 56px;
             border-radius: 16px;
             font-size: 18px;
         }

         .controls {
             display: flex;
             flex-direction: row;
             gap: 10px;
             justify-content: center;
             align-items: center;
             width: 100%;
             flex-shrink: 0;
             flex-wrap: nowrap;
         }
        @media (max-width: 768px) {
            #app {
                gap: 12px;
                padding: 6px;
            }

            .top-bar {
                gap: 6px;
            /* Responsive for mobile */
               @media (max-width: 768px) {
                   body {
                       align-items: flex-start;
                   }

                   #app {
                       position: fixed;
                       inset: 0;
                       width: 100%;
                       height: 100%;
                       gap: 4px;
                       padding: 4px;
                       justify-content: space-between;
                   }

                   .top-bar {
                       gap: 4px;
                       flex-shrink: 0;
                   }

                   .panel-box {
                       min-width: 40px;
                       padding: 3px 6px;
                       flex: 1;
                   }

                   .score-label {
                       font-size: 0.6rem;
                       margin-bottom: 0;
                   }

                   .score-value {
                       font-size: 1.4rem;
                       line-height: 1.1;
                   }

                   .next-preview {
                       padding: 3px;
                       flex: 1;
                   }
            
                   .next-preview .score-label {
                       font-size: 0.6rem;
                   }

                   #next-canvas {
                       width: 60px;
                       height: 60px;
                   }

                   .game-container {
                       flex: 1;
                       min-height: 0;
                       padding: 4px;
                       border-radius: 18px;
                   }

                   canvas#tetris {
                       width: 100%;
                       height: 100%;
                       border-radius: 12px;
                   }

                   .overlay {
                       border-radius: 18px;
                   }

                   .overlay h2 {
                       font-size: 1.3rem;
                       margin-bottom: 12px;
                   }

                   .start-btn {
                       padding: 8px 20px;
                       font-size: 0.95rem;
                   }

                   .controls {
                       gap: 6px;
                       flex-shrink: 0;
                   }

                   .btn {
                       width: 48px;
                       height: 48px;
                       font-size: 18px;
                   }

                   .btn-icon {
                       width: 48px;
                       height: 48px;
                       font-size: 14px;
                   }
               }

        @media (max-width: 400px) {
            .panel-box {
                min-width: 42px;
                padding: 10px 8px;
            }

            .score-label {
                font-size: 0.55rem;
            }

            .score-value {
                font-size: 0.95rem;
            }

            .next-preview {
                padding: 3px;
            }

            .btn {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }

            .btn-icon {
                width: 48px;
                height: 48px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Top bar: score | next piece | level -->
    <div class="top-bar">
        <div class="panel-box">
            <div class="score-label">分數</div>
            <div class="score-value" id="score">0</div>
        </div>

        <div class="next-preview">
            <div class="score-label">預覽</div>
            <canvas id="next-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-box">
            <div class="score-label">等級</div>
            <div class="score-value" id="level">1</div>
        </div>
    </div>

    <!-- Game Board -->
    <div class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <!-- Overlay -->
        <div id="overlay" class="overlay active">
            <h2 id="status-text">Candy Tetris</h2>
            <button class="start-btn" id="start-btn">開始遊戲</button>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls" id="controls-bar">
        <div class="btn" id="btn-pause" title="暫停">⏸</div>
        <div class="btn" id="btn-hard-drop" title="快速落下">⤓</div>
        <div class="btn" id="btn-left">←</div>
        <div class="btn" id="btn-down">↓</div>
        <div class="btn" id="btn-right">→</div>
        <div class="btn" id="btn-rotate" style="background: rgba(255, 0, 110, 0.3); border-color: var(--accent-color);">↻</div>
    </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nextContext = nextCanvas.getContext('2d');
const scoreElement = document.getElementById('score');
const levelElement = document.getElementById('level');
const overlay = document.getElementById('overlay');
const statusText = document.getElementById('status-text');
const startBtn = document.getElementById('start-btn');
const btnPause = document.getElementById('btn-pause');

// Scale for high DPI screens
context.scale(20, 20);
nextContext.scale(20, 20);

// Tetromino Definitions
const PIECES = 'ILJOTSZ';
const COLORS = [
    null,
    '#FF006E', // 1 - Z
    '#3A86FF', // 2 - I
    '#8338EC', // 3 - T
    '#FFD166', // 4 - O
    '#06D6A0', // 5 - S
    '#118AB2', // 6 - J
    '#EF476F', // 7 - L
];

function createPiece(type) {
    if (type === 'I') {
        return [
            [0, 0, 0, 0],
            [2, 2, 2, 2],
            [0, 0, 0, 0],
            [0, 0, 0, 0],
        ];
    } else if (type === 'L') {
         return [
             [7, 0, 0],
             [7, 7, 7],
             [0, 0, 0],
         ];
    } else if (type === 'J') {
        return [
            [0, 0, 6],
            [6, 6, 6],
            [0, 0, 0],
        ];
    } else if (type === 'O') {
        return [
            [4, 4],
            [4, 4],
        ];
    } else if (type === 'Z') {
        return [
            [1, 1, 0],
            [0, 1, 1],
            [0, 0, 0],
        ];
    } else if (type === 'S') {
        return [
            [0, 5, 5],
            [5, 5, 0],
            [0, 0, 0],
        ];
    } else if (type === 'T') {
        return [
            [0, 3, 0],
            [3, 3, 3],
            [0, 0, 0],
        ];
    }
}

// Color mapping: piece value -> CSS color
function getColor(value) {
    if (value >= 1 && value <= 7) return COLORS[value];
    return '#fff';
}

// Game State
const arena = createMatrix(12, 20);
const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    score: 0,
    level: 1,
    next: null,
};

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let isPaused = true;
let isGameOver = false;

function createMatrix(w, h) {
    const matrix = [];
    while (h--) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

// Collision Detection
function collide(arena, player) {
    const m = player.matrix;
    const o = player.pos;
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 &&
               (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

// Drawing Logic with "Candy" Style
function drawMatrix(matrix, offset, ctx = context) {
    if (!matrix) return;
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                context.save && ctx.save();
                const px = x + offset.x;
                const py = y + offset.y;
                const size = 1;

                // Base color
                ctx.fillStyle = getColor(value);
                
                // Shadow/3D effect
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 0.5;
                ctx.shadowOffsetX = 0.2;
                ctx.shadowOffsetY = 0.2;

                // Main block
                ctx.beginPath();
                ctx.roundRect(px + 0.1, py + 0.1, size - 0.2, size - 0.2, 0.3);
                ctx.fill();

                // Reset shadow for highlight
                ctx.shadowColor = 'transparent';
                
                // Highlight (Top-Left)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.moveTo(px + 0.1, py + size - 0.1);
                ctx.lineTo(px + 0.1, py + 0.1);
                ctx.lineTo(px + size - 0.1, py + 0.1);
                ctx.lineTo(px + 0.5, py + 0.5);
                ctx.lineTo(px + 0.3, py + 0.5);
                ctx.lineTo(px + 0.3, py + 0.3);
                ctx.lineTo(px + 0.1, py + 0.1);
                ctx.fill();

                // Inner Shine (Glossy)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(px + size/2, py + size/2, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        });
    });
}

function drawNext() {
    nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!player.next) return;
    
    // 用 4x4 網格居中（I 是 4x4，其他都是 3x3）
    const gridSize = 4;
    const offsetX = (gridSize - player.next[0].length) / 2;
    const offsetY = (gridSize - player.next.length) / 2;
    drawMatrix(player.next, {x: offsetX, y: offsetY}, nextContext);
}

function draw() {
    context.clearRect(0, 0, canvas.width, canvas.height);
    
    drawMatrix(arena, {x: 0, y: 0}, context);
    drawMatrix(player.matrix, player.pos, context);
}

// SRS Simplified Rotation
function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) {
        matrix.forEach(row => row.reverse());
    } else {
        matrix.reverse();
    }
}

function playerRotate(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
    }
    dropCounter = 0;
}

// Hard Drop - 快速落下
function playerHardDrop() {
    while (!collide(arena, player)) {
        player.pos.y++;
    }
    player.pos.y--;
    merge(arena, player);
    playerReset();
    arenaSweep();
    updateScore();
    dropCounter = 0;
}

function playerMove(dir) {
    player.pos.x += dir;
    if (collide(arena, player)) {
        player.pos.x -= dir;
    }
}

function playerReset() {
    if (player.next) {
        player.matrix = player.next;
    } else {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
    }

    // Generate new next piece
    const nextType = PIECES[PIECES.length * Math.random() | 0];
    player.next = createPiece(nextType);
    
    drawNext();

    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    
    if (collide(arena, player)) {
        isGameOver = true;
        statusText.innerText = "遊戲結束";
        startBtn.innerText = "再玩一次";
        overlay.classList.add('active');
    }
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
                continue outer;
            }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
        
        player.level = Math.floor(player.score / 100) + 1;
        dropInterval = Math.max(100, 1000 - (player.level * 50)); 
    }
}

function updateScore() {
    scoreElement.innerText = player.score;
    levelElement.innerText = player.level;
}

// Game Loop
function update(time = 0) {
    if (isPaused || isGameOver) return;

    const deltaTime = time - lastTime;
    lastTime = time;

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
        playerDrop();
    }

    draw();
    requestAnimationFrame(update);
}

function startGame() {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    player.level = 1;
    dropInterval = 1000;
    updateScore();
    player.next = null;
    playerReset();
    isGameOver = false;
    isPaused = false;
    overlay.classList.remove('active');
    btnPause.innerText = '⏸';
    update();
}

// Pause toggle
function togglePause() {
    if (isGameOver) return;
    isPaused = !isPaused;
    if (isPaused) {
        statusText.innerText = "已暫停";
        startBtn.innerText = "繼續";
        overlay.classList.add('active');
    } else {
        overlay.classList.remove('active');
        lastTime = performance.now();
        update();
    }
}

// Input Handling
document.addEventListener('keydown', event => {
    if (isPaused || isGameOver) return;
    
    if (event.keyCode === 37) { // Left
        playerMove(-1);
    } else if (event.keyCode === 39) { // Right
        playerMove(1);
    } else if (event.keyCode === 40) { // Down
        playerDrop();
    } else if (event.keyCode === 32) { // Space - Hard Drop
        event.preventDefault();
        playerHardDrop();
    } else if (event.keyCode === 81 || event.keyCode === 38) { // Q or Up
        playerRotate(1);
    } else if (event.keyCode === 69) { // E
        playerRotate(-1);
    } else if (event.keyCode === 80) { // P - Pause
        togglePause();
    }
});

// Mobile Controls
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnDown = document.getElementById('btn-down');
const btnRotate = document.getElementById('btn-rotate');
const btnHardDrop = document.getElementById('btn-hard-drop');

function addTouch(elem, action) {
    elem.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!isPaused && !isGameOver) action();
    }, {passive: false});
    
    elem.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (!isPaused && !isGameOver) action();
    });
}

addTouch(btnLeft, () => playerMove(-1));
addTouch(btnRight, () => playerMove(1));
addTouch(btnDown, () => playerDrop());
addTouch(btnRotate, () => playerRotate(1));
addTouch(btnHardDrop, () => playerHardDrop());

// Pause button
btnPause.addEventListener('click', () => {
    if (!isGameOver) togglePause();
});

// Start Button
startBtn.addEventListener('click', startGame);

// 初始不生成預覽，等待開始遊戲
</script>
</body>
</html>
