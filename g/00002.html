<style>
:root {
    --bg-color: #111;
    --pacman-color: #FFD700;
    --text-color: #fff;
}

body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

canvas {
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    background-color: #000;
    border-radius: 4px;
    -webkit-user-select: none;
}

#ui-layer {
    pointer-events: none;
    z-index: 10;
    width: 100%;
    display: flex;
    justify-content: center;
}

#top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(60, 60, 60, 0.25);
    border: 2px solid var(--pacman-color);
    border-radius: 10px;
    padding: 6px 16px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    width: 100%;
    max-width: 380px;
}

#top-bar .left-section {
    display: flex;
    align-items: center;
    gap: 6px;
}

#pause-btn {
    min-width: 44px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--pacman-color);
    border-radius: 6px;
    background: rgba(255, 215, 0, 0.1);
    color: var(--pacman-color);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    touch-action: manipulation;
    transition: all 0.2s;
    pointer-events: auto;
}

#pause-btn:hover {
    background: rgba(255, 215, 0, 0.2);
}

#pause-btn:active {
    transform: scale(0.95);
}

#pause-btn.paused {
    background: rgba(255, 215, 0, 0.25);
    color: #fff;
}

#top-bar .right-section {
    display: flex;
    align-items: center;
    gap: 4px;
}

#top-bar .heart {
    color: #e74c3c;
    font-size: 18px;
}

#top-bar .score-value {
    color: #00bcd4;
}

#message-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    padding: 16px;
    border: 2px solid var(--pacman-color);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 0px;
    z-index: 20;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
}

.leaderboard-btn {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    border-radius: 8px;
    touch-action: manipulation;
    transition: all 0.2s;
    margin-top: 8px;
}

.leaderboard-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
}

.leaderboard-btn:active {
    transform: scale(0.95);
}

/* 排行榜遮罩 */
#leaderboard-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(6px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
    box-sizing: border-box;
}

#leaderboard-overlay.active {
    display: flex;
}

#lb-title {
    color: #FFD700;
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 16px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

#lb-list {
    width: 100%;
    max-width: 400px;
    max-height: 60vh;
    overflow-y: auto;
    margin-bottom: 16px;
}

.lb-row {
    display: flex;
    align-items: center;
    padding: 3px 16px;
    border-radius: 6px;
    margin-bottom: 3px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 1rem;
    color: #fff;
}

.lb-row.top1 { background: rgba(255, 215, 0, 0.2); }
.lb-row.top2 { background: rgba(192, 192, 192, 0.15); }
.lb-row.top3 { background: rgba(205, 127, 50, 0.15); }

.lb-rank {
    width: 36px;
    font-weight: bold;
    color: #FFD700;
    text-align: center;
}

.lb-name {
    flex: 1;
    text-align: left;
    padding: 0 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

.lb-score {
    font-weight: bold;
    color: #00bcd4;
    min-width: 80px;
    text-align: right;
}

.lb-level {
    font-size: 0.85rem;
    color: #aaa;
    min-width: 100px;
    text-align: center;
}

#lb-input-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    width: 100%;
    max-width: 400px;

#lb-input-area.active {
    display: flex;
}

#lb-name-input {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid var(--pacman-color);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.8rem;
    color: #fff;
    text-align: center;
    width: 240px;
    outline: none;
    font-family: inherit;
}

#lb-name-input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

#lb-submit-btn {
    background: var(--pacman-color);
    border: none;
    padding: 10px 30px;
    font-size: 1rem;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    border-radius: 8px;
    touch-action: manipulation;
    transition: all 0.2s;
}

#lb-submit-btn:hover {
    background: #fff;
}

#lb-submit-btn:active {
    transform: scale(0.95);
}

#lb-close-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 8px 24px;
    font-size: 0.95rem;
    color: #fff;
    cursor: pointer;
    border-radius: 8px;
    touch-action: manipulation;
    transition: all 0.2s;
    margin-top: 8px;
}

#lb-close-btn:hover {
    background: rgba(255, 255, 255, 0.25);
}

#lb-close-btn:active {
    transform: scale(0.95);
}

#lb-status {
    color: #aaa;
    font-size: 0.85rem;
    min-height: 1.2em;

h1 {
    margin: 0;
    color: var(--pacman-color);
    text-shadow: 0 0 10px var(--pacman-color);
    font-size: 2.5rem;
    letter-spacing: 2px;

p {
    margin: 5px 0;
    font-size: 1rem;
    color: #ccc;
    line-height: 1.6;

#start-btn {
    background: var(--pacman-color);
    border: none;
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    border-radius: 50px;
    box-shadow: 0 0 15px var(--pacman-color);

    margin-top: 10px;
    touch-action: manipulation;
}

#start-btn:hover {
    transform: scale(1.05);
    background: #fff;

#start-btn:active {
    transform: scale(0.95);

@media (max-width: 480px) {
    h1 { font-size: 1.8rem; }
    p { font-size: 0.9rem; }
    #message-overlay {

        padding: 10px;
        margin-top: 15%;
        transform: translate(-50%, -50%);

}

// 檢查是否為牆
function isTileWall(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
    var map = getCurrentMap();
    return map[row][col] === 1;
}

// 檢查格子是否可以通行（牆=1不可通行；4/5 通道視為可通行；越界視為可通行供通道穿越）
function isPassable(col, row) {
    if (row < 0 || row >= ROWS) return false;
    var map = getCurrentMap();
    if (col < 0 || col >= COLS) {
        // 越界：檢查同行是否有通道格子，有則可穿越（通道格子往通道方向）
        if (row >= 0 && row < ROWS) {
            for (let c = 0; c < COLS; c++) {
                if (map[row][c] === 4 || map[row][c] === 5) return true;
            }
        }
        return false;
    }
    var tile = map[row][col];
    return tile !== 1;
}

// 幽靈回鬼屋（一般死幽靈使用，貪婪法）
function moveToHouse(g) {
    var houseX = 9 * TILE_SIZE + TILE_SIZE / 2;
    var houseY = 9 * TILE_SIZE + TILE_SIZE / 2;
    var hdx = houseX - g.x;
    var hdy = houseY - g.y;
    if (Math.abs(hdx) > 2 || Math.abs(hdy) > 2) {
        var dxd = Math.abs(hdx) > Math.abs(hdy) ? (hdx > 0 ? 1 : -1) : 0;
        var dyd = Math.abs(hdy) > Math.abs(hdx) ? (hdy > 0 ? 1 : -1) : 0;
        if (dxd !== 0 && canMoveAt(g.x, g.y, {x:dxd, y:0}, GHOST_RADIUS)) {
            g.x += dxd;
        } else if (dyd !== 0 && canMoveAt(g.x, g.y, {x:0, y:dyd}, GHOST_RADIUS)) {
            g.y += dyd;
        }
    } else {
        g.dead = false;
        g.inGhostHouse = true;
        g.homeTimer = Date.now();
        g.frightened = false;
        g.frightenedTimer = 0;
    }
}

// BFS 最短路径（用於分數達標後的恐懼幽靈回鬼屋）
function bfsShortestPath(ghost, targetCol, targetRow) {
    var gCol = Math.round((ghost.x - TILE_SIZE/2) / TILE_SIZE);
    var gRow = Math.round((ghost.y - TILE_SIZE/2) / TILE_SIZE);
    var visited = {};
    var queue = [{ col: gCol, row: gRow, path: [] }];
    visited[gRow + ',' + gCol] = true;
    var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    while (queue.length > 0) {
        var cur = queue.shift();
        if (cur.col === targetCol && cur.row === targetRow) {
            return cur.path;
        }
        for (var i = 0; i < dirs.length; i++) {
            var nc = cur.col + dirs[i].x;
            var nr = cur.row + dirs[i].y;
            var key = nr + ',' + nc;
            if (!visited[key] && isPassable(nc, nr)) {
                visited[key] = true;
                var newPath = cur.path.concat([{ col: nc, row: nr }]);
                queue.push({ col: nc, row: nr, path: newPath });
            }
        }
    }
    return null; // 無路徑
}

// 檢查是否可以移動 — 經典 Pac-Man 風格：檢查前方格子的角落
function canMoveAt(x, y, dir, radius) {
    var r = radius || PACMAN_RADIUS;
    // 計算物體前方一格的中心點座標
    if (dir.x !== 0) {
        // 水平移動：檢查前方格子的上下兩個角
        var fcol = dir.x > 0 ? Math.floor((x + r + 1) / TILE_SIZE) : Math.floor((x - r - 1) / TILE_SIZE);
        // 容差改為 2px（原為 1px），避免速度倍率導致位置偏移而誤判
        var topRow = Math.floor((y - r + 2) / TILE_SIZE);
        var botRow = Math.floor((y + r - 2) / TILE_SIZE);
        if (isTileWall(fcol, topRow)) return false;
        if (isTileWall(fcol, botRow)) return false;
        // 額外檢查：確保前方格子本身也不是牆（防止速度倍率導致偏移）
        var myRow = Math.round((y - TILE_SIZE / 2) / TILE_SIZE);
        if (isTileWall(fcol, myRow)) return false;
    }
    if (dir.y !== 0) {
        // 垂直移動：檢查前方格子的左右兩個角
        var frow = dir.y > 0 ? Math.floor((y + r + 2) / TILE_SIZE) : Math.floor((y - r - 2) / TILE_SIZE);
        // 容差改為 2px（原為 1px），避免速度倍率導致位置偏移而誤判
        var leftCol = Math.floor((x - r + 2) / TILE_SIZE);
        var rightCol = Math.floor((x + r - 2) / TILE_SIZE);
        if (isTileWall(leftCol, frow)) return false;
        if (isTileWall(rightCol, frow)) return false;
        // 額外檢查：確保前方格子本身也不是牆（防止速度倍率導致偏移）
        var myCol = Math.round((x - TILE_SIZE / 2) / TILE_SIZE);
        if (isTileWall(myCol, frow)) return false;
    }
    return true;
}

// 檢查是否對齊網格（用於精確轉向）— 用容差 3px
function isAligned(x, y) {
    var targetX = Math.round((x - TILE_SIZE / 2) / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
    var targetY = Math.round((y - TILE_SIZE / 2) / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
    return Math.abs(x - targetX) < 3 && Math.abs(y - targetY) < 3;
}

function resizeCanvas() {
    const w = COLS * TILE_SIZE;
    const h = ROWS * TILE_SIZE;
    const maxWidth = window.innerWidth;
    const maxHeight = window.innerHeight - 50;
    let scale = 1;

    if (w > maxWidth) scale = maxWidth / w;
    if (h > maxHeight) scale = maxHeight / h;

    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.style.width = `${w * scale}px`;
    canvas.style.height = `${h * scale}px`;
}

// 建立牆壁離線快取（只畫一次，大幅降低每幀 shadowBlur 開銷）
function buildWallCache() {
    const cacheCanvas = document.createElement('canvas');
    cacheCanvas.width = COLS * TILE_SIZE;
    cacheCanvas.height = ROWS * TILE_SIZE;
    const cctx = cacheCanvas.getContext('2d');
    const ts = TILE_SIZE;
    cctx.shadowColor = '#7EC8E3';
    cctx.shadowBlur = 10;

    // 預先建立單格冰磚貼圖（離線，只算一次）
    const brick = document.createElement('canvas');
    brick.width = ts;
    brick.height = ts;
    const bctx = brick.getContext('2d');

    // 冰磚基底漸層（模擬冰塊通透感）
    const grad = bctx.createLinearGradient(0, 0, ts, ts);
    grad.addColorStop(0, '#7EC8E3');
    grad.addColorStop(0.3, '#A8DCEF');
    grad.addColorStop(0.7, '#B8E0F0');
    grad.addColorStop(1, '#6BB8D8');
    bctx.fillStyle = grad;
    bctx.beginPath();
    bctx.roundRect(1, 1, ts - 2, ts - 2, 2);
    bctx.fill();

    // 冰磚高光（左上角微弱反光）
    const hlGrad = bctx.createRadialGradient(3, 3, 0, 3, 3, ts * 0.6);
    hlGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    bctx.fillStyle = hlGrad;
    bctx.beginPath();
    bctx.roundRect(1, 1, ts - 2, ts - 2, 2);
    bctx.fill();

    // 冰磚縫隙（mortar lines — 模擬磚塊拼接）
    bctx.strokeStyle = 'rgba(160,200,220,0.6)';
    bctx.lineWidth = 0.5;
    bctx.beginPath();
    bctx.roundRect(1, 1, ts - 2, ts - 2, 2);
    bctx.stroke();

    // 內部微妙紋理線（冰裂效果）
    bctx.strokeStyle = 'rgba(255,255,255,0.12)';
    bctx.lineWidth = 0.4;
    bctx.beginPath();
    bctx.moveTo(4, ts * 0.35);
    bctx.lineTo(ts * 0.6, ts * 0.35);
    bctx.stroke();
    bctx.beginPath();
    bctx.moveTo(ts * 0.5, ts * 0.55);
    bctx.lineTo(ts - 4, ts * 0.55);
    bctx.stroke();

    // 逐格貼上冰磚貼圖
    walls.forEach(w => {
        cctx.drawImage(brick, w.x, w.y);
    });

    wallCache = cacheCanvas;
}

// 取得 Pacman 發光快取圖（按 mouthOpen 索引緩存，避免每幀 shadowBlur）
// 由於發光是圓形弧線，方向由 mouthOpen 決定（嘴巴張開角度），不需按方向額外快取
function getGlowCache(mouthOpenIdx) {
    if (!glowCache[mouthOpenIdx]) {
        const size = (PACMAN_RADIUS * 2 + 20);
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const cx = c.getContext('2d');
        const offX = size / 2;
        const offY = size / 2;
        cx.fillStyle = '#FFD700';
        cx.shadowColor = '#FFD700';
        cx.shadowBlur = 10;
        cx.beginPath();
        cx.arc(offX, offY, PACMAN_RADIUS, mouthOpenIdx * Math.PI, (2 - mouthOpenIdx) * Math.PI);
        cx.lineTo(offX - 1, offY - 1);
        cx.fill();
        glowCache[mouthOpenIdx] = c;
    }
    return glowCache[mouthOpenIdx];
}

// 預先渲染所有可能的發光幀（避免遊戲中動態創建 canvas 造成 GC 暫停）
function prewarmGlowCache() {
    // mouthOpen 範圍約 0.13~0.37，乘以 20 後約 2~7
    for (let i = 0; i <= 20; i++) {
        getGlowCache(i);
    }
}

/*
// Pac-Man 發光（每幀畫，但只用 shadowBlur 一次，效能可接受）
function drawPacmanGlow(x, y, dirX, dirY, mouthOpenVal) {
    // 量化 mouthOpen 為索引，減少快取數量
    var idx = Math.round(mouthOpenVal * 20);
    var cached = glowCache[idx];
    if (cached) {
        ctx.drawImage(cached, x - cached.width / 2, y - cached.height / 2);
    }
}
*/

function initGame() {
    walls = [];
    dots = [];
    powerDots = [];
    ghosts = [];
    score = 0;
    lives = 3;
    level = 1;
    totalCleared = 0;
    ghostsEatenCounter = 0;
    powerMode = false;
    powerModeTimer = 0;
    powerModeParticles = [];
    scoreEl.innerText = score;
    livesEl.innerText = lives;
    levelEl.innerText = 1;
    cycleEl.innerText = 1;

    var map = getCurrentMap();
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const type = map[r][c];
            if (type === 1) {
                walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
            } else if (type === 0) {
                dots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
            } else if (type === 3) {
                powerDots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
            }
            // 4/5 鏡射通道：不加入任何物件（如同已打通的空洞）
        }
    }

    // Pac-Man 起始位置
    var start = findPacmanStart();
    pacman.x = start.x * TILE_SIZE + TILE_SIZE / 2;
    pacman.y = start.y * TILE_SIZE + TILE_SIZE / 2;
    pacman.dir = {x: 1, y: 0};
    pacman.nextDir = {x: 1, y: 0};
    pacman.speed = 2;

    // 預先計算通道位置（避免每幀掃瞄 ROWS×COLS）
    tunnelPositions = [];
    for (let r = 0; r < ROWS; r++) {
        var col4 = -1, col5 = -1;
        for (let c = 0; c < COLS; c++) {
            if (map[r][c] === 4) col4 = c;
            else if (map[r][c] === 5) col5 = c;
        }
        if (col4 >= 0 && col5 >= 0) {
            tunnelPositions.push({ row: r, col4: col4, col5: col5 });
        }
    }

    // 幽靈起始位置（鬼屋出口）
    var ghostStarts = [
        { x: 9, y: 8 },  // 中間
        { x: 8, y: 8 },  // 左
        { x: 10, y: 8 }, // 右
        { x: 9, y: 9 },  // 重複（4隻時用）
    ];
    var ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];

    for (var i = 0; i < 4; i++) {
        var gs = ghostStarts[i];
        ghosts.push({
            x: gs.x * TILE_SIZE + TILE_SIZE / 2,
            y: gs.y * TILE_SIZE + TILE_SIZE / 2,
            color: ghostColors[i],
            dir: {x: 0, y: 0},
            speed: getConfig().ghostSpeed,
            inGhostHouse: true,
            frightened: false,
            frightenedTimer: 0,
            dead: false,
            returningHome: false,
            homeTimer: null,
            _bfsPath: null
        });
    }

    levelTransition = false;
    dying = false;
    justDied = false;
    ghostReleaseTimer = 0;
    powerMode = false;
    powerModeTimer = 0;
    powerModeParticles = [];
}

function update(dt) {
    if (levelTransition || dying) return;

    // 以 FIXED_DT 為基準的比例因子（手機 30fps 時約 2x）
    const t = dt / FIXED_DT;

    // 幽靈釋放計時
    if (ghostReleaseTimer < GHOST_RELEASE_FRAMES) {
        ghostReleaseTimer += t;
        for (var gi = 0; gi < ghosts.length; gi++) {
            var g = ghosts[gi];
            if (g.inGhostHouse) {
                // 讓幽靈在鬼屋出口附近擺動
                var exitX = 9 * TILE_SIZE + TILE_SIZE / 2;
                var exitY = 9 * TILE_SIZE + TILE_SIZE / 2;
                var dx = g.x - exitX;
                var dy = g.y - exitY;
                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    // 向出口移動
                    if (Math.abs(dx) > Math.abs(dy)) {
                        g.x += (dx > 0 ? -1 : 1) * t;
                    } else {
                        g.y += (dy > 0 ? -1 : 1) * t;
                    }
                }
            }
        }
    } else {
        // 釋放幽靈
        for (var gi = 0; gi < ghosts.length; gi++) {
            var g = ghosts[gi];
            if (g.inGhostHouse && !g.homeTimer) {
                g.inGhostHouse = false;
                // 移到鬼屋出口
                g.x = (gi % 4 === 0 ? 9 : gi % 4 === 1 ? 8 : gi % 4 === 2 ? 10 : 9) * TILE_SIZE + TILE_SIZE / 2;
                g.y = 8 * TILE_SIZE + TILE_SIZE / 2;
                g.dir = {x: gi % 2 === 0 ? 1 : -1, y: 0};
            }
        }
    }

    // 更新 Pac-Man（經典 Pac-Man 行為：只有在路口/交叉點才能轉向）
    // 使用距離中心的歐氏距離，容差固定 6px（不受 speed 影響，避免手機端跳幀）
    var pacCenterX = Math.round((pacman.x - TILE_SIZE / 2) / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
    var pacCenterY = Math.round((pacman.y - TILE_SIZE / 2) / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
    var dxToCenter = pacman.x - pacCenterX;
    var dyToCenter = pacman.y - pacCenterY;
    var distToCenter = Math.sqrt(dxToCenter * dxToCenter + dyToCenter * dyToCenter);
    var AT_INTERSECTION = 6; // 固定容差 6px，確保手機端跳幀也能捕捉到

    // 垂直軸吸附：移動時，將非移動軸的 pacman 位置吸附到網格中心
    // 這樣可以避免浮點數累積誤差導致 pacman 偏離道路中央
    // 只吸附 perpendicular axis，不碰移動軸，所以不會造成卡頓或跳幀
    if (pacman.dir.x !== 0 && pacman.dir.y === 0) {
        // 水平移動：吸附 y 軸
        if (Math.abs(dyToCenter) < TILE_SIZE / 2) {
            pacman.y = pacCenterY;
        }
    } else if (pacman.dir.y !== 0 && pacman.dir.x === 0) {
        // 垂直移動：吸附 x 軸
        if (Math.abs(dxToCenter) < TILE_SIZE / 2) {
            pacman.x = pacCenterX;
        }
    }

    if (distToCenter < AT_INTERSECTION) {
        // 已在路口：嘗試轉向
        if ((pacman.nextDir.x !== 0 || pacman.nextDir.y !== 0) && isPassable(
            Math.round((pacman.x - TILE_SIZE / 2) / TILE_SIZE) + pacman.nextDir.x,
            Math.round((pacman.y - TILE_SIZE / 2) / TILE_SIZE) + pacman.nextDir.y
        )) {
            pacman.dir = {x: pacman.nextDir.x, y: pacman.nextDir.y};
            pacman.nextDir = {x: 0, y: 0};
        }

        // 檢查前方是否可移動，如果不可移動則停止
        if (!isPassable(
            Math.round((pacman.x - TILE_SIZE / 2) / TILE_SIZE) + pacman.dir.x,
            Math.round((pacman.y - TILE_SIZE / 2) / TILE_SIZE) + pacman.dir.y
        )) {
            pacman.dir = {x: 0, y: 0};
            // 撞牆停止時，強制對齊到網格中心，避免下一輪移動時 perpendicular 軸偏移
            pacman.x = pacCenterX;
            pacman.y = pacCenterY;
        }
    }

    // 移動
    pacman.x += pacman.dir.x * pacman.speed * t;
    pacman.y += pacman.dir.y * pacman.speed * t;
    // 記錄最後實際移動的方向（用於渲染）
    if (pacman.dir.x !== 0 || pacman.dir.y !== 0) {
        pacman.renderDir = {x: pacman.dir.x, y: pacman.dir.y};
    }

    // 左右隧道 / 鏡射通道（使用預先計算的通道位置列表，避免每幀掃瞄地圖）
    var teleported = false;
    if (pacman.dir.x > 0) {
        // 向右移動：檢查所有 col4 通道
        for (var ti = 0; ti < tunnelPositions.length; ti++) {
            var tp = tunnelPositions[ti];
            if (pacman.y + pacman.radius > tp.row * TILE_SIZE && pacman.y - pacman.radius < (tp.row + 1) * TILE_SIZE) {
                if (pacman.x >= tp.col4 * TILE_SIZE && pacman.x < (tp.col4 + 1) * TILE_SIZE) {
                    pacman.x = tp.col5 * TILE_SIZE + TILE_SIZE * 0.75;
                    pacman.y = tp.row * TILE_SIZE + TILE_SIZE / 2;
                    teleported = true;
                    break;
                }
            }
        }
    }
    if (!teleported && pacman.dir.x < 0) {
        // 向左移動：檢查所有 col5 通道
        for (var ti = 0; ti < tunnelPositions.length; ti++) {
            var tp = tunnelPositions[ti];
            if (pacman.y + pacman.radius > tp.row * TILE_SIZE && pacman.y - pacman.radius < (tp.row + 1) * TILE_SIZE) {
                if (pacman.x >= tp.col5 * TILE_SIZE && pacman.x < (tp.col5 + 1) * TILE_SIZE) {
                    pacman.x = tp.col4 * TILE_SIZE + TILE_SIZE * 0.25;
                    pacman.y = tp.row * TILE_SIZE + TILE_SIZE / 2;
                    teleported = true;
                    break;
                }
            }
        }
    }
    // 傳統隧道（從地圖外穿過）
    if (!teleported) {
        if (pacman.x < -TILE_SIZE/2) pacman.x = COLS * TILE_SIZE + TILE_SIZE/2;
        else if (pacman.x > COLS * TILE_SIZE + TILE_SIZE/2) pacman.x = -TILE_SIZE/2;
    }

    // 吃能量球（使用平方距離比較，避免 Math.sqrt）
    var eatDistSq = (TILE_SIZE / 2) * (TILE_SIZE / 2);
    for (let i = dots.length - 1; i >= 0; i--) {
        var d = dots[i];
        var dx = pacman.x - d.x;
        var dy = pacman.y - d.y;
        if (dx*dx + dy*dy < eatDistSq) {
            dots.splice(i, 1);
            score += 10;
            scoreEl.innerText = score;
            playSound('eat');
        }
    }

    // 吃強化能量球（Power Dot，使用平方距離比較）
    for (let i = powerDots.length - 1; i >= 0; i--) {
        var pd = powerDots[i];
        var dx = pacman.x - pd.x;
        var dy = pacman.y - pd.y;
        if (dx*dx + dy*dy < eatDistSq) {
            powerDots.splice(i, 1);
            score += 50;
            scoreEl.innerText = score;
            playSound('eat');
            // 啟動 Pacman 藥效模式
            powerMode = true;
            powerModeTimer = getConfig().powerDuration;
            powerModeParticles = [];
            // 幽靈變恐懼
            for (var gj = 0; gj < ghosts.length; gj++) {
                var g = ghosts[gj];
                if (!g.inGhostHouse && !g.dead) {
                    g.frightened = true;
                    g.frightenedTimer = getConfig().powerDuration;
                    g.dir = {x: -g.dir.x, y: -g.dir.y};
                }
            }
        }
    }

    // 幽靈 AI
    var cfg = getConfig();
    for (var gi = 0; gi < ghosts.length; gi++) {
        var g = ghosts[gi];

        // 恐懼計時
        if (g.frightened) {
            g.frightenedTimer -= t;
            if (g.frightenedTimer <= 0) {
                g.frightened = false;
                g.dir = {x: -g.dir.x, y: -g.dir.y};
            }
        }

        // 已死的幽靈回鬼屋（一般吃法）
        if (g.dead) {
            moveToHouse(g);
            continue;
        }

        // 分數達標的恐懼幽靈回鬼屋（最短路径）
        if (g.returningHome) {
            if (!g._bfsPath) {
                g._bfsPath = bfsShortestPath(g, 9, 9);
            }
            if (g._bfsPath && g._bfsPath.length > 0) {
                var next = g._bfsPath[0];
                var targetX = next.col * TILE_SIZE + TILE_SIZE / 2;
                var targetY = next.row * TILE_SIZE + TILE_SIZE / 2;
                var dx = targetX - g.x;
                var dy = targetY - g.y;
                var distSq = dx*dx + dy*dy;
                var spdSq = (g.speed * 0.6 * t);
                if (distSq <= (spdSq + 1) * (spdSq + 1)) {
                    // 到達目標格子，移除並重新計算路徑
                    g._bfsPath.shift();
                    g.x = targetX;
                    g.y = targetY;
                } else {
                    var dist = Math.sqrt(distSq);
                    g.x += (dx / dist) * spdSq;
                    g.y += (dy / dist) * spdSq;
                }
                g.dir = { x: dx >= 0 ? 1 : -1, y: dy >= 0 ? 1 : -1 };
            } else {
                // BFS 路徑已用完，重新計算
                g._bfsPath = null;
            }
            // 回到鬼屋（統一在這裡檢查）
            if (Math.abs(g.x - (9 * TILE_SIZE + TILE_SIZE / 2)) < 3 && Math.abs(g.y - (9 * TILE_SIZE + TILE_SIZE / 2)) < 3) {
                g.returningHome = false;
                g._bfsPath = null;
                g.inGhostHouse = true;
                // 強制把幽靈放到鬼屋中心，確保不會再移動出去
                g.x = 9 * TILE_SIZE + TILE_SIZE / 2;
                g.y = 9 * TILE_SIZE + TILE_SIZE / 2;
                g.homeTimer = Date.now(); // 記錄回到鬼屋的時間
                g.frightened = false;
                g.frightenedTimer = 0;
            }
            continue;
        }

        // 回到鬼屋後的等待：時間到後釋放追擊
        if (g.homeTimer) {
            if (!g.inGhostHouse) {
                g.homeTimer = null;
            } else if (Date.now() - g.homeTimer >= 6000) {
                g.inGhostHouse = false;
                g.homeTimer = null;
                g.dir = {x: 1, y: 0};
            } else {
                continue;
            }
        } else if (g.inGhostHouse && !g.returningHome && !g.dead) {
            continue;
        }

        // 只在網格中心檢查是否要轉向（經典 Pac-Man 行為）
        var atCenter = (Math.abs(g.x % TILE_SIZE - TILE_SIZE/2) < 2) &&
                       (Math.abs(g.y % TILE_SIZE - TILE_SIZE/2) < 2);

        if (atCenter) {
            var gridCol = Math.round((g.x - TILE_SIZE/2) / TILE_SIZE);
            var gridRow = Math.round((g.y - TILE_SIZE/2) / TILE_SIZE);
            var oppositeDir = {x: -g.dir.x, y: -g.dir.y};

            // 如果當前方向撞牆，強制轉向
            if (!canMoveAt(g.x, g.y, g.dir, GHOST_RADIUS)) {
                g.dir = {x: -g.dir.x, y: -g.dir.y};
            } else {
                // 在網格中心時選擇新方向
                var validDirs = [];
                var possibleDirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
                for (var pdi = 0; pdi < possibleDirs.length; pdi++) {
                    var d = possibleDirs[pdi];
                    if (d.x === oppositeDir.x && d.y === oppositeDir.y && validDirs.length > 0) continue;
                    if (isPassable(gridCol + d.x, gridRow + d.y)) {
                        validDirs.push(d);
                    }
                }
                if (validDirs.length === 0) {
                    if (isPassable(gridCol + oppositeDir.x, gridRow + oppositeDir.y)) {
                        validDirs.push(oppositeDir);
                    }
                }

                if (validDirs.length > 0) {
                    if (g.frightened && !g.dead) {
                        g.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                    } else if (!g.frightened) {
                        // 如果 pacman 變身中且距離夠近，幽靈強制恐懼
                        if (powerMode && powerModeTimer > 0) {
                            var gx = g.x - pacman.x;
                            var gy = g.y - pacman.y;
                            var dist = Math.sqrt(gx * gx + gy * gy);
                            if (dist < TILE_SIZE * 3) {
                                g.frightened = true;
                                g.frightenedTimer = powerModeTimer;
                                g.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                            } else {
                                // 追蹤 Pac-Man
                                var bestDir = validDirs[0];
                                var bestDist = Infinity;
                                for (var vi = 0; vi < validDirs.length; vi++) {
                                    var vd = validDirs[vi];
                                    var nx = g.x + vd.x * TILE_SIZE * 5;
                                    var ny = g.y + vd.y * TILE_SIZE * 5;
                                    var d = Math.abs(nx - pacman.x) + Math.abs(ny - pacman.y);
                                    if (d < bestDist) {
                                        bestDist = d;
                                        bestDir = vd;
                                    }
                                }
                                g.dir = bestDir;
                            }
                        } else {
                            // 追蹤 Pac-Man
                            var bestDir = validDirs[0];
                            var bestDist = Infinity;
                            for (var vi = 0; vi < validDirs.length; vi++) {
                                var vd = validDirs[vi];
                                var nx = g.x + vd.x * TILE_SIZE * 5;
                                var ny = g.y + vd.y * TILE_SIZE * 5;
                                var d = Math.abs(nx - pacman.x) + Math.abs(ny - pacman.y);
                                if (d < bestDist) {
                                    bestDist = d;
                                    bestDir = vd;
                                }
                            }
                            g.dir = bestDir;
                        }
                    }
                }
            }
        }

        // 移動
        if (canMoveAt(g.x, g.y, g.dir, GHOST_RADIUS)) {
            var spd = g.frightened ? g.speed * 0.6 : g.speed;
            if (g.dead) spd = g.speed * 1.5;
            g.x += g.dir.x * spd * t;
            g.y += g.dir.y * spd * t;
        } else {
            g.dir = {x: -g.dir.x, y: -g.dir.y};
        }

        // 鏡射通道（使用預先計算的位置列表）
        var map = getCurrentMap();
        var gCol = Math.round((g.x - TILE_SIZE/2) / TILE_SIZE);
        var gRow = Math.round((g.y - TILE_SIZE/2) / TILE_SIZE);
        for (var ti = 0; ti < tunnelPositions.length; ti++) {
            var tp = tunnelPositions[ti];
            if (tp.row === gRow) {
                if (map[gRow][gCol] === 4 && g.dir.x > 0 && g.x > gCol * TILE_SIZE + TILE_SIZE / 2) {
                    g.x = tp.col5 * TILE_SIZE + TILE_SIZE / 2;
                    g.y = gRow * TILE_SIZE + TILE_SIZE / 2;
                } else if (map[gRow][gCol] === 5 && g.dir.x < 0 && g.x < gCol * TILE_SIZE + TILE_SIZE / 2) {
                    g.x = tp.col4 * TILE_SIZE + TILE_SIZE / 2;
                    g.y = gRow * TILE_SIZE + TILE_SIZE / 2;
                }
            }
        }
        if (g.x < -TILE_SIZE/2) g.x = COLS * TILE_SIZE + TILE_SIZE/2;
        else if (g.x > COLS * TILE_SIZE + TILE_SIZE/2) g.x = -TILE_SIZE/2;

        // 碰撞檢測（使用平方距離比較）
        var cdx = pacman.x - g.x;
        var cdy = pacman.y - g.y;
        var collisionDist = (pacman.radius + GHOST_RADIUS) * 0.8;
        var collisionDistSq = collisionDist * collisionDist;
        if (cdx*cdx + cdy*cdy < collisionDistSq) {
            if (g.frightened && !g.dead) {
                ghostsEatenCounter++;
                if (score >= EAT_SCORE_THRESHOLD) {
                    score += 200;
                    scoreEl.innerText = score;
                    playSound('eat');
                    g.returningHome = true;
                    g.dir = {x: -g.dir.x, y: -g.dir.y};
                } else {
                    g.dead = true;
                    score += 200;
                    scoreEl.innerText = score;
                    playSound('eat');
                }
                // 每吃 10 隻恐懼幽靈 +1 生命
                if (ghostsEatenCounter % 10 === 0) {
                    lives++;
                    livesEl.innerText = lives;
                }
            } else if (!g.dead) {
                // 死亡
                playerDie();
            }
        }
    }

    // Pacman 藥效計時（放在幽靈迴圈外，避免每幀被減多次）
    if (powerMode) {
        powerModeTimer -= t;
        if (powerModeTimer <= 0) {
            powerMode = false;
            powerModeParticles = [];
            powerModeArcs = [];
        }
    }

    // 檢查是否通關
    if (dots.length === 0 && powerDots.length === 0) {
        nextLevel();
    }
}

function playerDie() {
    if (justDied) return;
    justDied = true;
    dying = true;
    gameRunning = false;
    lives--;
    livesEl.innerText = lives;
    playSound('die');
    cancelAnimationFrame(animationId);

    // 保存死亡前的狀態
    var savedDots = dots.slice();
    var savedPowerDots = powerDots.slice();
    var savedPacmanX = pacman.x;
    var savedPacmanY = pacman.y;
    var savedPacmanDir = {x: pacman.dir.x, y: pacman.dir.y};
    var savedPacmanNextDir = {x: pacman.nextDir.x, y: pacman.nextDir.y};
    var savedPacmanSpeed = pacman.speed;
    var savedGhosts = ghosts.map(function(g) {
        return {
            x: g.x, y: g.y, color: g.color,
            dir: {x: g.dir.x, y: g.dir.y},
            speed: g.speed,
            inGhostHouse: g.inGhostHouse,
            frightened: g.frightened,
            frightenedTimer: g.frightenedTimer,
            dead: g.dead,
            returningHome: g.returningHome,
            homeTimer: g.homeTimer,
            _bfsPath: g._bfsPath ? g._bfsPath.slice() : null
        };
    });
    var savedGhostReleaseTimer = ghostReleaseTimer;
    var savedLevelConfig = getConfig();

    resumeState = {
        dots: savedDots,
        powerDots: savedPowerDots,
        pacman: { x: savedPacmanX, y: savedPacmanY, dir: savedPacmanDir, nextDir: savedPacmanNextDir, speed: savedPacmanSpeed },
        ghosts: savedGhosts,
        ghostReleaseTimer: savedGhostReleaseTimer,
        levelConfig: savedLevelConfig
    };

    // 更新最高分
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('pacmanHighScore', highScore.toString());
    }

    if (lives <= 0) {
        // 遊戲結束
        overlay.style.display = 'flex';
        overlayTitle.innerText = "遊戲結束";
        startBtn.innerText = "重新開始";
        // 清除舊訊息
        var oldMsgs = overlay.querySelectorAll(':scope > p');
        oldMsgs.forEach(function(el) { el.remove(); });
        var p = document.createElement('p');
        p.style.color = '#FFD700';
        p.style.fontSize = '1.1rem';
        p.style.whiteSpace = 'pre-line';
        p.innerHTML = "生命耗盡！\n最終分數：" + score + "\n最高分：" + highScore + "\n到達關卡：第" + (Math.floor(totalCleared / LEVEL_MAPS.length) + 1) + "-" + ((totalCleared % LEVEL_MAPS.length) + 1) + "關";
        overlay.appendChild(p);

        // 排行榜按鈕
        var oldLbBtn = overlay.querySelector('.leaderboard-btn');
        if (oldLbBtn) oldLbBtn.remove();
        var lbBtn = document.createElement('button');
        lbBtn.className = 'leaderboard-btn';
        lbBtn.textContent = '🏆 排行榜';
        lbBtn.addEventListener('pointerdown', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            showLeaderboard(score, getGameOverLevelLabel());
        });
        overlay.appendChild(lbBtn);

        resumeState = null;
    } else {
        // 繼續遊戲（保留目前分數）
        overlay.style.display = 'flex';
        overlayTitle.innerText = "你死亡了";
        startBtn.innerText = "繼續";
        gameRunning = false;
        // 清除舊訊息
        var oldMsgs = overlay.querySelectorAll(':scope > p');
        oldMsgs.forEach(function(el) { el.remove(); });
        var p = document.createElement('p');
        p.style.color = '#FFD700';
        p.style.fontSize = '1.1rem';
        p.style.whiteSpace = 'pre-line';
        p.innerHTML = "剩餘生命：" + lives + "\n目前分數：" + score + "\n最高分：" + highScore;
        overlay.appendChild(p);
    }
}

function nextLevel() {
    levelTransition = true;
    var prevLevel = level;

    // 計算已經完成的關卡數（從1開始）
    totalCleared++;
    var cycle = Math.ceil(totalCleared / LEVEL_MAPS.length);

    levelEl.innerText = nowlevel;

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'eat') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    } else if (type === 'start') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, COLS * TILE_SIZE, ROWS * TILE_SIZE);

    // 牆壁：從離線快取貼上（不再每幀重算 shadowBlur）
    if (wallCache) {
        ctx.drawImage(wallCache, 0, 0);
    }

    // 能量球（糖果風格）
    for (let di = 0; di < dots.length; di++) {
        var dd = dots[di];
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(dd.x, dd.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(dd.x - 1, dd.y - 1, 1.2, 0, Math.PI * 2);
        ctx.fill();
    }

    // 強化能量球（糖果風格 + 脈衝閃爍）
    var pulse = 1 + Math.sin(Date.now() / 200) * 0.2;
    for (let pi = 0; pi < powerDots.length; pi++) {
        var pd = powerDots[pi];
        ctx.fillStyle = '#EC5F72';
        ctx.beginPath();
        ctx.arc(pd.x, pd.y, 6 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(pd.x - 2 * pulse, pd.y - 2 * pulse, 2.4 * pulse, 0, Math.PI * 2);
        ctx.fill();
    }

    // 幽靈（霓虹風格）
    for (var gi = 0; gi < ghosts.length; gi++) {
        var g = ghosts[gi];
        var color = g.frightened ? '#2244CC' : g.dead ? '#888888' : g.color;

        // 幽靈陰影光暈
        if (!g.frightened && !g.dead) {
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
        }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(g.x, g.y - 2, 8, Math.PI, 0);
        ctx.lineTo(g.x + 8, g.y + 8);
        // 波浪邊緣
        for (var w = 0; w < 3; w++) {
            var wx = g.x + 8 - w * (16/3);
            ctx.quadraticCurveTo(wx - 4, g.y + 4, wx - (16/3), g.y + 8);
        }
        ctx.fill();
        ctx.shadowBlur = 0; // 重置 shadow

        // 眼睛
        if (!g.frightened) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(g.x - 3, g.y - 4, 2, 0, Math.PI * 2);
            ctx.arc(g.x + 3, g.y - 4, 2, 0, Math.PI * 2);
            ctx.fill();

            // 瞳孔
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(g.x - 3 + g.dir.x, g.y - 4 + g.dir.y, 1, 0, Math.PI * 2);
            ctx.arc(g.x + 3 + g.dir.x, g.y - 4 + g.dir.y, 1, 0, Math.PI * 2);
            ctx.fill();
        }

        // 恐懼幽靈的恐懼表情
        if (g.frightened) {
            // 眼睛改為小圓點
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(g.x - 3, g.y - 3, 1.5, 0, Math.PI * 2);
            ctx.arc(g.x + 3, g.y - 3, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // 波浪嘴巴
            ctx.strokeStyle = '#FFD0D0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(g.x - 6, g.y + 3);
            ctx.lineTo(g.x - 3, g.y + 1);
            ctx.lineTo(g.x, g.y + 3);
            ctx.lineTo(g.x + 3, g.y + 1);
            ctx.lineTo(g.x + 6, g.y + 3);
            ctx.stroke();
        }
    }

    // ===== 小精靈渲染 =====
    var glowMouthOpen = 0.25 + Math.sin(Date.now() / 80) * 0.12;
    if (glowMouthOpen > 0.37) glowMouthOpen = 0.37;
    if (glowMouthOpen < 0.13) glowMouthOpen = 0.13;
    var grx = pacman.renderDir ? pacman.renderDir.x : pacman.dir.x;
    var gry = pacman.renderDir ? pacman.renderDir.y : pacman.dir.y;
    if (grx === 0 && gry === 0) { grx = 1; gry = 0; }

    if (powerMode) {
        // === 藥效模式：金色閃電 ===
        var now = Date.now();

        // --- 1. 隨機閃電弧線 ---
        // 每幾幀產生一條新閃電（頻率提高）
        if (now - (powerModeLastArc || 0) > 80) {
            powerModeLastArc = now;
            var arcLen = 4 + Math.floor(Math.random() * 5);
            var arc = { segments: [], birth: now };
            var cx = pacman.x, cy = pacman.y;
            var baseAngle = Math.random() * Math.PI * 2;
            for (var s = 0; s < arcLen; s++) {
                var jitter = (Math.random() - 0.5) * 10;
                cx += Math.cos(baseAngle) * 5 + Math.cos(baseAngle + Math.PI/2) * jitter;
                cy += Math.sin(baseAngle) * 5 + Math.sin(baseAngle + Math.PI/2) * jitter;
                arc.segments.push({ x1: cx - Math.cos(baseAngle)*5, y1: cy - Math.sin(baseAngle)*5, x2: cx, y2: cy });
            }
            powerModeArcs.push(arc);
        }

        // 繪製閃電
        for (var ai = powerModeArcs.length - 1; ai >= 0; ai--) {
            var arc = powerModeArcs[ai];
            var age = now - (arc.birth || now);
            if (age > 500) { powerModeArcs.splice(ai, 1); continue; }
            var alpha = Math.max(0, 1 - age / 500);

            // 外層暖黃光暈
            ctx.shadowColor = `rgba(255, 200, 50, ${alpha * 0.6})`;
            ctx.shadowBlur = 8;
            ctx.strokeStyle = `rgba(255, 200, 50, ${alpha * 0.5})`;
            ctx.lineWidth = 5;
            ctx.beginPath();
            for (var si = 0; si < arc.segments.length; si++) {
                var seg = arc.segments[si];
                if (si === 0) ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(seg.x2, seg.y2);
            }
            ctx.stroke();

            // 內層亮黃核心
            ctx.shadowBlur = 0;
            ctx.strokeStyle = `rgba(255, 240, 150, ${alpha * 0.95})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (var si = 0; si < arc.segments.length; si++) {
                var seg = arc.segments[si];
                if (si === 0) ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(seg.x2, seg.y2);
            }
            ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // --- 2. 本體：電弧包裹的金色漸層 ---
        ctx.save();
        ctx.translate(pacman.x, pacman.y);
        var drawAngle = Math.atan2(gry, grx);
        ctx.rotate(drawAngle);
        var bodyGrad = ctx.createRadialGradient(-2, -2, 0, 0, 0, PACMAN_RADIUS);
        bodyGrad.addColorStop(0, '#FFF5B0');
        bodyGrad.addColorStop(0.7, '#FFD700');
        bodyGrad.addColorStop(1, '#E6A800');

        // 外層電暈包裹
        ctx.shadowColor = '#4488FF';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, PACMAN_RADIUS + 3, glowMouthOpen * Math.PI, (2 - glowMouthOpen) * Math.PI);
        ctx.lineTo(0, 0);
        ctx.fillStyle = bodyGrad;
        ctx.fill();

        // 閃電紋路（從嘴巴向外放射）
        ctx.strokeStyle = `rgba(100, 200, 255, ${0.3 + Math.sin(now / 80) * 0.2})`;
        ctx.lineWidth = 1.5;
        for (var lw = 0; lw < 4; lw++) {
            var wAngle = glowMouthOpen * Math.PI + (lw * Math.PI / 4);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(wAngle) * PACMAN_RADIUS * 1.3, Math.sin(wAngle) * PACMAN_RADIUS * 1.3);
            ctx.stroke();
        }

        ctx.shadowBlur = 0;
        ctx.restore();

        // --- 3. 脈衝環（金色） ---
        var pulsePhase = (now % 800) / 800;
        var pulseRadius = PACMAN_RADIUS + 4 + pulsePhase * 16;
        var pulseAlpha = (1 - pulsePhase) * 0.5;
        ctx.strokeStyle = `rgba(255, 220, 80, ${pulseAlpha})`;
        ctx.lineWidth = 2 * (1 - pulsePhase);
        ctx.beginPath();
        ctx.arc(pacman.x, pacman.y, pulseRadius, 0, Math.PI * 2);
        ctx.stroke();
    } else {
        // === 常規模式：經典霓虹金黃風格 ===
        // 不使用 drawPacmanGlow（shadow blur 會 bleed 到嘴巴缺口造成閃爍）
        // 改用輕微 shadowBlur 直接畫在本體上

        ctx.save();
        ctx.translate(pacman.x, pacman.y);
        var rx = pacman.renderDir ? pacman.renderDir.x : pacman.dir.x;
        var ry = pacman.renderDir ? pacman.renderDir.y : pacman.dir.y;
        if (rx === 0 && ry === 0) { rx = 1; ry = 0; }
        var rAngle = Math.atan2(ry, rx);
        ctx.rotate(rAngle);

        // 霓虹金漸層
        var goldGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, PACMAN_RADIUS);
        goldGrad.addColorStop(0, '#FFE44D');
        goldGrad.addColorStop(0.7, '#FFD700');
        goldGrad.addColorStop(1, '#E6A800');

        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(0, 0, PACMAN_RADIUS, glowMouthOpen * Math.PI, (2 - glowMouthOpen) * Math.PI);
        ctx.lineTo(0, 0);
        ctx.fillStyle = goldGrad;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    // 暫停覆蓋層
    if (isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, COLS * TILE_SIZE, ROWS * TILE_SIZE);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 32px "Microsoft JhengHei", "PingFang TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('暫停', COLS * TILE_SIZE / 2, ROWS * TILE_SIZE / 2);
        ctx.font = '14px "Microsoft JhengHei", "PingFang TC", sans-serif';
        ctx.fillStyle = '#ccc';
        ctx.fillText('點擊 ▶ 繼續', COLS * TILE_SIZE / 2, ROWS * TILE_SIZE / 2 + 36);
    }
}

// 固定時間步進 — 避免手機端 rAF 幀率跳動導致視覺忽快忽慢
let lastFrameTime = 0;
const FIXED_DT = 16.6667; // 目標 60fps 步進（ms）

function loop(timestamp) {
    if (!gameRunning || levelTransition) return;
    if (!timestamp) timestamp = performance.now();
    if (lastFrameTime === 0) lastFrameTime = timestamp;

    const delta = timestamp - lastFrameTime;
    lastFrameTime = timestamp;

    // 限制最大 delta 防止切換 tab 後爆衝
    const dt = Math.min(delta, FIXED_DT * 3);

    if (!isPaused) {
        // 以實際經過時間比例更新（手機 30fps 時 delta 約 33ms → 移動 2x）
        update(dt);
    }
    draw();
    animationId = requestAnimationFrame(loop);
}

let gameStarted = false;
var resumeState = null; // 保存死亡前的遊戲狀態，用於繼續遊戲（保留能量球和分數）

function startGame(resetScore = true) {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    resizeCanvas();

    if (resetScore || !gameStarted) {
        initGame();
        buildWallCache();
        prewarmGlowCache();
        gameStarted = true;
    } else if (resumeState) {
        // 繼續遊戲：從死亡前的狀態恢復（保留能量球、分數、關卡進度）
        walls = [];
        var map = getCurrentMap();
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const type = map[r][c];
                if (type === 1) {
                    walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
                }
                // 4/5 鏡射通道：不加入任何物件
            }
        }

        // 恢復已吃掉的能量球狀態（只保留尚未吃掉的）
        dots = resumeState.dots;
        powerDots = resumeState.powerDots;

        // Pac-Man 從初始位置重生（避免死亡時貼牆導致卡住）
        var start = findPacmanStart();
        pacman.x = start.x * TILE_SIZE + TILE_SIZE / 2;
        pacman.y = start.y * TILE_SIZE + TILE_SIZE / 2;
        pacman.dir = {x: 1, y: 0};
        pacman.nextDir = {x: 1, y: 0};
        pacman.speed = 2;

        // 恢復幽靈（重置為鬼屋內）
        ghosts = [];
        var ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];
        var ghostStarts = [
            { x: 9, y: 8 },
            { x: 8, y: 8 },
            { x: 10, y: 8 },
            { x: 9, y: 8 },
        ];
        for (var i = 0; i < 4; i++) {
            var gs = ghostStarts[i];
            ghosts.push({
                x: gs.x * TILE_SIZE + TILE_SIZE / 2,
                y: gs.y * TILE_SIZE + TILE_SIZE / 2,
                color: ghostColors[i],
                dir: {x: 0, y: 0},
                speed: resumeState.levelConfig.ghostSpeed,
                inGhostHouse: true,
                frightened: false,
                frightenedTimer: 0,
                dead: false,
                returningHome: false,
                homeTimer: null,
                _bfsPath: null
            });
        }

        ghostReleaseTimer = 0;
        dying = false;
        justDied = false;
        levelTransition = false;
        powerMode = false;
        powerModeTimer = 0;
        powerModeParticles = [];
        // 清除保存的狀態
        resumeState = null;
        buildWallCache();
    } else {
        // 正常進入下一關：重建地圖和幽靈
        walls = [];
        dots = [];
        powerDots = [];
        var map = getCurrentMap();
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                var type = map[r][c];
                if (type === 1) {
                    walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
                } else if (type === 0) {
                    dots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                } else if (type === 3) {
                    powerDots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                }
            }
        }

        var start = findPacmanStart();
        pacman.x = start.x * TILE_SIZE + TILE_SIZE / 2;
        pacman.y = start.y * TILE_SIZE + TILE_SIZE / 2;
        pacman.dir = {x: 1, y: 0};
        pacman.nextDir = {x: 1, y: 0};
        pacman.speed = 2;

        ghosts = [];
        var ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];
        var ghostStarts = [
            { x: 9, y: 8 },
            { x: 8, y: 8 },
            { x: 10, y: 8 },
            { x: 9, y: 8 },
        ];
        for (var i = 0; i < 4; i++) {
            var gs = ghostStarts[i];
            ghosts.push({
                x: gs.x * TILE_SIZE + TILE_SIZE / 2,
                y: gs.y * TILE_SIZE + TILE_SIZE / 2,
                color: ghostColors[i],
                dir: {x: 0, y: 0},
                speed: getConfig().ghostSpeed,
                inGhostHouse: true,
                frightened: false,
                frightenedTimer: 0,
                dead: false,
                returningHome: false,
                homeTimer: null,
                _bfsPath: null
            });
        }

        ghostReleaseTimer = 0;
        dying = false;
        justDied = false;
        levelTransition = false;
        powerMode = false;
        powerModeTimer = 0;
        powerModeParticles = [];
        buildWallCache();
    }

    gameRunning = true;
    overlay.style.display = 'none';
    overlay.onclick = null;

    playSound('start');
    loop();
}

// 鍵盤控制
window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
    }
    if (!gameRunning || levelTransition) {
        if ((e.key === ' ' || e.key === 'Enter') && gameRunning === false) {
            if (lives > 0) {
                startGame(false);
            } else {
                startGame(true);
            }
        }
        return;
    }
    if (e.key === ' ') {
        togglePause();
        return;
    }
    switch(e.key) {
        case 'ArrowUp': pacman.nextDir = {x:0, y:-1}; break;
        case 'ArrowDown': pacman.nextDir = {x:0, y:1}; break;
        case 'ArrowLeft': pacman.nextDir = {x:-1, y:0}; break;
        case 'ArrowRight': pacman.nextDir = {x:1, y:0}; break;
    }
});

// 觸控控制 — 使用 Pointer Events + 即時滑動響應
const SWIPE_THRESHOLD = 30;
const TAP_THRESHOLD = 10;
let touchStartX = 0;
let touchStartY = 0;
let isTouching = false;

const gameContainer = document.getElementById('game-container');

gameContainer.addEventListener('pointerdown', e => {
    if (e.target.id === 'start-btn') return;
    if (!gameRunning || levelTransition) return;
    e.preventDefault();
    isTouching = true;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
}, {passive: false});

gameContainer.addEventListener('pointermove', e => {
    if (!isTouching || !gameRunning || levelTransition) return;
    // 只在真正有位移時才 preventDefault + 設定方向
    const diffX = e.clientX - touchStartX;
    const diffY = e.clientY - touchStartY;
    const distance = Math.sqrt(diffX * diffX + diffY * diffY);

    if (distance > TAP_THRESHOLD) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
            pacman.nextDir = diffX > 0 ? {x:1, y:0} : {x:-1, y:0};
        } else {
            pacman.nextDir = diffY > 0 ? {x:0, y:1} : {x:0, y:-1};
        }
    }
}, {passive: true});

gameContainer.addEventListener('pointerup', e => {
    isTouching = false;
}, {passive: false});

gameContainer.addEventListener('pointercancel', e => {
    isTouching = false;
}, {passive: false});

// 防止 container 內的 touch 事件造成頁面滾動（僅在遊戲中攔截）
gameContainer.addEventListener('touchstart', e => {
    if (e.target.id === 'start-btn') return;
    e.preventDefault();
}, {passive: false});
gameContainer.addEventListener('touchmove', e => {
    if (gameRunning && !levelTransition) {
        e.preventDefault();
    }
}, {passive: false});

// 暫停/繼續
function togglePause() {
    if (!gameRunning || levelTransition) return;
    isPaused = !isPaused;
    const btn = document.getElementById('pause-btn');
    if (isPaused) {
        btn.textContent = '▶';
        btn.classList.add('paused');
        btn.title = '繼續 (空白鍵)';
    } else {
        btn.textContent = '⏸';
        btn.classList.remove('paused');
        btn.title = '暫停 (空白鍵)';
    }
}

document.getElementById('pause-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    togglePause();
});

// 按鈕點擊事件
startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (lives <= 0) {
        // 遊戲結束，重新開始（重設分數）
        gameStarted = false;
        startGame(true);
    } else {
        // 繼續遊戲（保留分數）
        startGame(false);
    }
});

startBtn.addEventListener('touchend', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (lives <= 0) {
        gameStarted = false;
        startGame(true);
    } else {
        startGame(false);
    }
});

// 視窗大小改變
window.addEventListener('resize', () => {
    resizeCanvas();
    if (gameRunning) draw();
});

// 初始繪製
resizeCanvas();
if (gameRunning) draw();

// ================= 排行榜功能 =================
let currentLeaderboardData = [];
let currentSubmitScore = 0;
let currentSubmitLevelLabel = '';

// 計算遊戲結束時的關卡標籤（格式：第X-N關）
function getGameOverLevelLabel() {
    const LEVEL_MAPS_LEN = LEVEL_MAPS.length;
    const goCycle = Math.floor(totalCleared / LEVEL_MAPS_LEN) + 1;
    const goLevel = (totalCleared % LEVEL_MAPS_LEN) + 1;
    return '第' + goCycle + '-' + goLevel + '關';
}

function showLeaderboard(score, levelLabel) {
    currentSubmitScore = score;
    currentSubmitLevelLabel = levelLabel;
    const lbOverlay = document.getElementById('leaderboard-overlay');
    const lbList = document.getElementById('lb-list');
    const lbInputArea = document.getElementById('lb-input-area');
    const lbStatus = document.getElementById('lb-status');

    lbOverlay.classList.add('active');
    lbList.innerHTML = '';
    lbInputArea.classList.remove('active');
    lbStatus.textContent = '讀取中...';

    // 讀取排行榜
    sb.from('pmleaderboard').select('*').order('score', {ascending: false}).limit(10).then(({data, error}) => {
        if (error) {
            lbStatus.textContent = '讀取失敗，請稍後再試';
            console.error('Leaderboard read error:', error);
            return;
        }
        lbStatus.textContent = '';
        currentLeaderboardData = data || [];
        renderLeaderboard(currentLeaderboardData);
        checkIfInTop10(score);
    });
}

function renderLeaderboard(entries) {
    const lbList = document.getElementById('lb-list');
    lbList.innerHTML = '';

    if (entries.length === 0) {
        lbList.innerHTML = '<div style="color:#aaa;text-align:center;padding:20px;">尚無紀錄</div>';
        return;
    }

    const medals = ['🥇', '🥈', '🥉'];
    entries.forEach((entry, idx) => {
        const row = document.createElement('div');
        row.className = 'lb-row';
        if (idx === 0) row.classList.add('top1');
        else if (idx === 1) row.classList.add('top2');
        else if (idx === 2) row.classList.add('top3');

        const rank = document.createElement('span');
        rank.className = 'lb-rank';
        rank.textContent = medals[idx] ? medals[idx] : (idx + 1);
        row.appendChild(rank);

        const name = document.createElement('span');
        name.className = 'lb-name';
        name.textContent = entry.name;
        row.appendChild(name);

        const score = document.createElement('span');
        score.className = 'lb-score';
        score.textContent = entry.score;
        row.appendChild(score);

        if (entry.level) {
            const lvl = document.createElement('span');
            lvl.className = 'lb-level';
            lvl.textContent = entry.level;
            row.appendChild(lvl);
        }

        lbList.appendChild(row);
    });
}

function checkIfInTop10(score) {
    const lbInputArea = document.getElementById('lb-input-area');
    const lbStatus = document.getElementById('lb-status');
    const nameInput = document.getElementById('lb-name-input');
    const submitBtn = document.getElementById('lb-submit-btn');

    // 如果已有同分數記錄，不再顯示輸入框（避免重複提交）
    for (var i = 0; i < currentLeaderboardData.length; i++) {
        if (currentLeaderboardData[i].score === score) {
            lbStatus.textContent = '已進入排行榜';
            return;
        }
    }

    // 如果已有 10 筆，檢查最低分是否比目前分數低
    if (currentLeaderboardData.length < 10) {
        // 不足 10 筆，可以直接提交
        lbInputArea.classList.add('active');
        lbStatus.textContent = '恭喜進入排行榜！請輸入暱稱';
        nameInput.value = '';
        setupSubmitHandler();
    } else if (score > currentLeaderboardData[currentLeaderboardData.length - 1].score) {
        // 分數高於第 10 名
        lbInputArea.classList.add('active');
        lbStatus.textContent = '恭喜進入排行榜！請輸入暱稱';
        nameInput.value = '';
        setupSubmitHandler();
    } else {
        lbStatus.textContent = '未進入前十名';
    }
}

function setupSubmitHandler() {
    const nameInput = document.getElementById('lb-name-input');
    const submitBtn = document.getElementById('lb-submit-btn');

    // 移除舊的事件監聽（建立新元素所以不需要）
    submitBtn.onclick = function() {
        const name = nameInput.value.trim();
        if (!name) {
            document.getElementById('lb-status').textContent = '請輸入暱稱';
            return;
        }
        if (name.length > 12) {
            document.getElementById('lb-status').textContent = '名稱太長（最多中文６字／英文12字）';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '儲存中...';
        document.getElementById('lb-status').textContent = '';

        // 插入或更新排行榜
        sb.from('pmleaderboard').insert({
            name: name,
            score: currentSubmitScore,
            level: currentSubmitLevelLabel
        }).then(({data, error}) => {
            submitBtn.disabled = false;
            submitBtn.textContent = '送出';

            if (error) {
                document.getElementById('lb-status').textContent = '儲存失敗：' + error.message;
                console.error('Leaderboard insert error:', error);
                return;
            }

            document.getElementById('lb-status').textContent = '儲存成功！';
            // 重新讀取
            setTimeout(() => {
                sb.from('pmleaderboard').select('*').order('score', {ascending: false}).limit(10).then(({data, error}) => {
                    if (!error) {
                        currentLeaderboardData = data || [];
                        renderLeaderboard(currentLeaderboardData);
                        document.getElementById('lb-input-area').classList.remove('active');
                    }
                });
            }, 1000);
        });
    };
}

// 關閉排行榜
document.getElementById('lb-close-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    document.getElementById('leaderboard-overlay').classList.remove('active');
});

</script>
