            --text-color: #fff;

        body {

            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background-color: #000;
            border-radius: 4px;
            -webkit-user-select: none;
            margin-top: 10px;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            margin-top: 4px;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(60, 60, 60, 0.25);
            border: 2px solid var(--pacman-color);
            border-radius: 12px;
            padding: 6px 18px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            max-width: 380px;
            margin-top: 100px;
        }

        #top-bar .left-section {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #pause-btn {
            min-width: 44px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid var(--pacman-color);
            border-radius: 6px;
            background: rgba(255, 215, 0, 0.1);
            color: var(--pacman-color);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            transition: all 0.2s;
            pointer-events: auto;
        }

        #pause-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        #pause-btn:active {
            transform: scale(0.95);
        }

        #pause-btn.paused {
            background: rgba(255, 215, 0, 0.25);
            color: #fff;
        }

        #top-bar .right-section {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #top-bar .heart {
            color: #e74c3c;
            font-size: 18px;
        }

        #top-bar .score-value {
            color: #00bcd4;
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 30px;
            border: 2px solid var(--pacman-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            border-radius: 8px;
            touch-action: manipulation;

        }

    // 檢查是否為牆
    function isTileWall(col, row) {
        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
        var map = getCurrentMap();
        return map[row][col] === 1;
    }

    // 檢查格子是否可以通行（牆=1不可通行；4/5 通道視為可通行）
    function isPassable(col, row) {
        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
        var map = getCurrentMap();
        var tile = map[row][col];
        return tile !== 1;
    }

    // 幽靈回鬼屋（一般死幽靈使用，貪婪法）
    function moveToHouse(g) {
        var houseX = 9 * TILE_SIZE + TILE_SIZE / 2;
        var houseY = 9 * TILE_SIZE + TILE_SIZE / 2;
        var hdx = houseX - g.x;
        var hdy = houseY - g.y;
        if (Math.abs(hdx) > 2 || Math.abs(hdy) > 2) {
            var dxd = Math.abs(hdx) > Math.abs(hdy) ? (hdx > 0 ? 1 : -1) : 0;
            var dyd = Math.abs(hdy) > Math.abs(hdx) ? (hdy > 0 ? 1 : -1) : 0;
            if (dxd !== 0 && canMoveAt(g.x, g.y, {x:dxd, y:0}, GHOST_RADIUS)) {
                g.x += dxd;
            } else if (dyd !== 0 && canMoveAt(g.x, g.y, {x:0, y:dyd}, GHOST_RADIUS)) {
                g.y += dyd;
            }
        } else {
            g.dead = false;
            g.inGhostHouse = true;
            g.homeTimer = Date.now();
            g.frightened = false;
            g.frightenedTimer = 0;
        }
    }

    // BFS 最短路径（用於分數達標後的恐懼幽靈回鬼屋）
    function bfsShortestPath(ghost, targetCol, targetRow) {
        var gCol = Math.round((ghost.x - TILE_SIZE/2) / TILE_SIZE);
        var gRow = Math.round((ghost.y - TILE_SIZE/2) / TILE_SIZE);
        var visited = {};
        var queue = [{ col: gCol, row: gRow, path: [] }];
        visited[gRow + ',' + gCol] = true;
        var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
        while (queue.length > 0) {
            var cur = queue.shift();
            if (cur.col === targetCol && cur.row === targetRow) {
                return cur.path;
            }
            for (var i = 0; i < dirs.length; i++) {
                var nc = cur.col + dirs[i].x;
                var nr = cur.row + dirs[i].y;
                var key = nr + ',' + nc;
                if (!visited[key] && isPassable(nc, nr)) {
                    visited[key] = true;
                    var newPath = cur.path.concat([{ col: nc, row: nr }]);
                    queue.push({ col: nc, row: nr, path: newPath });
                }
            }
        }
        return null; // 無路徑
    }

      // 檢查是否可以移動 — 經典 Pac-Man 風格：只檢查前方網格中心
        function canMoveAt(x, y, dir, radius) {
            var r = radius || PACMAN_RADIUS;
            // 計算物體前方一格的中心點座標
            if (dir.x !== 0) {
                // 水平移動：檢查前方格子的上下兩個角
                var fcol = dir.x > 0 ? Math.floor((x + r + 1) / TILE_SIZE) : Math.floor((x - r - 1) / TILE_SIZE);
                var topRow = Math.floor((y - r + 1) / TILE_SIZE);
                var botRow = Math.floor((y + r - 1) / TILE_SIZE);
                if (isTileWall(fcol, topRow)) return false;
                if (isTileWall(fcol, botRow)) return false;
            }
            if (dir.y !== 0) {
                // 垂直移動：檢查前方格子的左右兩個角
                var frow = dir.y > 0 ? Math.floor((y + r + 1) / TILE_SIZE) : Math.floor((y - r - 1) / TILE_SIZE);
                var leftCol = Math.floor((x - r + 1) / TILE_SIZE);
                var rightCol = Math.floor((x + r - 1) / TILE_SIZE);
                if (isTileWall(leftCol, frow)) return false;
                if (isTileWall(rightCol, frow)) return false;
            }
            return true;
        }

     // 檢查是否對齊網格（用於精確轉向）— 用容差 3px
     function isAligned(x, y) {
         var targetX = Math.round((x - TILE_SIZE / 2) / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
         var targetY = Math.round((y - TILE_SIZE / 2) / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
         return Math.abs(x - targetX) < 3 && Math.abs(y - targetY) < 3;
     }

    function resizeCanvas() {
        const w = COLS * TILE_SIZE;
        const h = ROWS * TILE_SIZE;
        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight - 50;
        let scale = 1;

        if (w > maxWidth) scale = maxWidth / w;
        if (h > maxHeight) scale = maxHeight / h;

        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.style.width = `${w * scale}px`;
        canvas.style.height = `${h * scale}px`;
    }

    // 建立牆壁離線快取（只畫一次，大幅降低每幀 shadowBlur 開銷）
    function buildWallCache() {
        const cacheCanvas = document.createElement('canvas');
        cacheCanvas.width = COLS * TILE_SIZE;
        cacheCanvas.height = ROWS * TILE_SIZE;
        const cctx = cacheCanvas.getContext('2d');
        cctx.fillStyle = '#62AFD0';
        cctx.strokeStyle = '#A1C6DE';
        cctx.shadowColor = '#DDF8FD';
        cctx.shadowBlur = 4;
        cctx.shadowOffsetY = 2;
        cctx.lineWidth = 2;
        walls.forEach(w => {
            cctx.beginPath();
            cctx.roundRect(w.x + 2, w.y + 2, TILE_SIZE - 4, TILE_SIZE - 4, 2);
            cctx.fill();
            cctx.stroke();
        });
        wallCache = cacheCanvas;
    }

    function initGame() {
        walls = [];
        dots = [];
        powerDots = [];
        ghosts = [];
        score = 0;
        lives = 3;
        level = 1;
        totalCleared = 0;
        ghostsEatenCounter = 0;
        scoreEl.innerText = score;
        livesEl.innerText = lives;
        levelEl.innerText = 1;
        cycleEl.innerText = 1;

        var map = getCurrentMap();
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const type = map[r][c];
                if (type === 1) {
                    walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
                } else if (type === 0) {
                    dots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                } else if (type === 3) {
                    powerDots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                }
                // 4/5 鏡射通道：不加入任何物件（如同已打通的空洞）
            }
        }

        // Pac-Man 起始位置
        var start = findPacmanStart();
        pacman.x = start.x * TILE_SIZE + TILE_SIZE / 2;
        pacman.y = start.y * TILE_SIZE + TILE_SIZE / 2;
        pacman.dir = {x: 1, y: 0};
        pacman.nextDir = {x: 1, y: 0};
        pacman.speed = 2;

        // 幽靈起始位置（鬼屋出口）
        var ghostStarts = [
            { x: 9, y: 8 },  // 中間
            { x: 8, y: 8 },  // 左
            { x: 10, y: 8 }, // 右
            { x: 9, y: 9 },  // 重複（4隻時用）
        ];
        var ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];

        for (var i = 0; i < 4; i++) {
            var gs = ghostStarts[i];
            ghosts.push({
                x: gs.x * TILE_SIZE + TILE_SIZE / 2,
                y: gs.y * TILE_SIZE + TILE_SIZE / 2,
                color: ghostColors[i],
                dir: {x: 0, y: 0},

                inGhostHouse: true,
                frightened: false,
                frightenedTimer: 0,
                dead: false,
                returningHome: false,
                homeTimer: null,
                _bfsPath: null
            });
        }

        levelTransition = false;
        dying = false;
        justDied = false;
        ghostReleaseTimer = 0;
    }

    function update(dt) {
        if (levelTransition || dying) return;

        // 以 FIXED_DT 為基準的比例因子（手機 30fps 時約 2x）

                     if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                         // 向出口移動
                         if (Math.abs(dx) > Math.abs(dy)) {
                             g.x += (dx > 0 ? -1 : 1) * t;
                         } else {
                             g.y += (dy > 0 ? -1 : 1) * t;
                         }
                     }
                 }
             }
         } else {
             // 釋放幽靈
             for (var gi = 0; gi < ghosts.length; gi++) {
                 var g = ghosts[gi];
                 if (g.inGhostHouse && !g.homeTimer) {
                     g.inGhostHouse = false;
                     // 移到鬼屋出口
                     g.x = (gi % 4 === 0 ? 9 : gi % 4 === 1 ? 8 : gi % 4 === 2 ? 10 : 9) * TILE_SIZE + TILE_SIZE / 2;
                     g.y = 8 * TILE_SIZE + TILE_SIZE / 2;
                     g.dir = {x: gi % 2 === 0 ? 1 : -1, y: 0};
                 }
             }
         }

        // 更新 Pac-Man
        if (pacman.nextDir.x !== 0 || pacman.nextDir.y !== 0) {
            if (isAligned(pacman.x, pacman.y) && canMoveAt(pacman.x, pacman.y, pacman.nextDir, pacman.radius)) {
                pacman.dir = {x: pacman.nextDir.x, y: pacman.nextDir.y};
            }
        }

        if (canMoveAt(pacman.x, pacman.y, pacman.dir, pacman.radius)) {
            pacman.x += pacman.dir.x * pacman.speed * t;
            pacman.y += pacman.dir.y * pacman.speed * t;
        }

        // 左右隧道 / 鏡射通道
        var map = getCurrentMap();
        var pacCol = Math.round((pacman.x - TILE_SIZE/2) / TILE_SIZE);
        var pacRow = Math.round((pacman.y - TILE_SIZE/2) / TILE_SIZE);
        var teleported = false;
        // 檢查是否進入鏡射通道
        // 觸發條件：進入通道格子 + 移動超過半格 + 仍朝同一方向
        if (pacRow >= 0 && pacRow < ROWS && pacCol >= 0 && pacCol < COLS) {
            if (map[pacRow][pacCol] === 4 && pacman.dir.x > 0) {
                // 在通道 4 內且往右移動，且 Pac-Man 中心已超過通道左半格
                var channelLeft = pacCol * TILE_SIZE;
                var channelRight = pacCol * TILE_SIZE + TILE_SIZE;
                if (pacman.x > channelLeft + TILE_SIZE / 2) {
                    // 從左側通道進入，跳到右側對應的 5
                    for (let c = COLS - 1; c >= 0; c--) {
                        if (map[pacRow][c] === 5) {
                            pacman.x = c * TILE_SIZE + TILE_SIZE / 2;
                            pacman.y = pacRow * TILE_SIZE + TILE_SIZE / 2;
                            teleported = true;
                            break;
                        }
                    }
                }
            } else if (map[pacRow][pacCol] === 5 && pacman.dir.x < 0) {
                // 在通道 5 內且往左移動，且 Pac-Man 中心已超過通道右半格
                var channelLeft5 = pacCol * TILE_SIZE;
                if (pacman.x < channelLeft5 + TILE_SIZE / 2) {
                    // 從右側通道進入，跳到左側對應的 4
                    for (let c = 0; c < COLS; c++) {
                        if (map[pacRow][c] === 4) {
                            pacman.x = c * TILE_SIZE + TILE_SIZE / 2;
                            pacman.y = pacRow * TILE_SIZE + TILE_SIZE / 2;
                            teleported = true;
                            break;
                        }
                    }
                }
            }
        }
        // 傳統隧道（從地圖外穿過）
        if (!teleported) {
            if (pacman.x < -TILE_SIZE/2) pacman.x = COLS * TILE_SIZE + TILE_SIZE/2;
            else if (pacman.x > COLS * TILE_SIZE + TILE_SIZE/2) pacman.x = -TILE_SIZE/2;
        }

        // 吃能量球
        for (let i = dots.length - 1; i >= 0; i--) {
            var d = dots[i];
            var dx = pacman.x - d.x;
            var dy = pacman.y - d.y;
            if (Math.sqrt(dx*dx + dy*dy) < TILE_SIZE/2) {
                dots.splice(i, 1);
                score += 10;
                scoreEl.innerText = score;
                playSound('eat');
            }
        }

        // 吃強化能量球（Power Dot）
        for (let i = powerDots.length - 1; i >= 0; i--) {
            var pd = powerDots[i];
            var dx = pacman.x - pd.x;
            var dy = pacman.y - pd.y;
            if (Math.sqrt(dx*dx + dy*dy) < TILE_SIZE/2) {
                powerDots.splice(i, 1);
                score += 50;
                scoreEl.innerText = score;
                playSound('eat');
                // 幽靈變恐懼
                for (var gj = 0; gj < ghosts.length; gj++) {
                    var g = ghosts[gj];
                    if (!g.inGhostHouse && !g.dead) {
                        g.frightened = true;
                        g.frightenedTimer = getConfig().powerDuration;
                        g.dir = {x: -g.dir.x, y: -g.dir.y};
                    }
                }
            }
        }

        // 幽靈 AI
         for (var gi = 0; gi < ghosts.length; gi++) {
             var g = ghosts[gi];
             var cfg = getConfig();

             // 恐懼計時
             if (g.frightened) {
                 g.frightenedTimer -= t;
                 if (g.frightenedTimer <= 0) {
                     g.frightened = false;
                     g.dir = {x: -g.dir.x, y: -g.dir.y};
                 }
             }

             // 已死的幽靈回鬼屋（一般吃法）
             if (g.dead) {
                 moveToHouse(g);
                 continue;
             }

             // 分數達標的恐懼幽靈回鬼屋（最短路径）
             if (g.returningHome) {
                 if (!g._bfsPath) {
                     g._bfsPath = bfsShortestPath(g, 9, 9);
                 }
                 if (g._bfsPath && g._bfsPath.length > 0) {
                     var next = g._bfsPath[0];
                     var targetX = next.col * TILE_SIZE + TILE_SIZE / 2;
                     var targetY = next.row * TILE_SIZE + TILE_SIZE / 2;
                     var dx = targetX - g.x;
                     var dy = targetY - g.y;
                     var dist = Math.sqrt(dx*dx + dy*dy);
                     var spd = g.speed * 0.6 * t; // 恐懼速度
                     if (dist <= spd + 1) {
                         // 到達目標格子，移除並重新計算路徑
                         g._bfsPath.shift();
                         g.x = targetX;
                         g.y = targetY;
                     } else {
                         g.x += (dx / dist) * spd;
                         g.y += (dy / dist) * spd;
                     }
                     g.dir = { x: dx >= 0 ? 1 : -1, y: dy >= 0 ? 1 : -1 };
                 } else {
                     // BFS 路徑已用完，重新計算
                     g._bfsPath = null;
                 }
                 // 回到鬼屋（統一在這裡檢查）
                 if (Math.abs(g.x - (9 * TILE_SIZE + TILE_SIZE / 2)) < 3 && Math.abs(g.y - (9 * TILE_SIZE + TILE_SIZE / 2)) < 3) {
                     g.returningHome = false;
                     g._bfsPath = null;
                     g.inGhostHouse = true;
                     // 強制把幽靈放到鬼屋中心，確保不會再移動出去
                     g.x = 9 * TILE_SIZE + TILE_SIZE / 2;
                     g.y = 9 * TILE_SIZE + TILE_SIZE / 2;
                     g.homeTimer = Date.now(); // 記錄回到鬼屋的時間
                     g.frightened = false;
                     g.frightenedTimer = 0;
                 }
                 continue;
             }

             // 回到鬼屋後的等待：時間到後釋放追擊
             if (g.homeTimer) {
                 if (!g.inGhostHouse) {
                     g.homeTimer = null;
                 } else if (Date.now() - g.homeTimer >= 6000) {
                     g.inGhostHouse = false;
                     g.homeTimer = null;
                     g.dir = {x: 1, y: 0};
                 } else {
                     continue;
                 }
             } else if (g.inGhostHouse && !g.returningHome && !g.dead) {
                 continue;
             }

             // 只在網格中心檢查是否要轉向（經典 Pac-Man 行為）
             var atCenter = (Math.abs(g.x % TILE_SIZE - TILE_SIZE/2) < 2) &&
                            (Math.abs(g.y % TILE_SIZE - TILE_SIZE/2) < 2);

             if (atCenter) {
                 var gridCol = Math.round((g.x - TILE_SIZE/2) / TILE_SIZE);
                 var gridRow = Math.round((g.y - TILE_SIZE/2) / TILE_SIZE);
                 var oppositeDir = {x: -g.dir.x, y: -g.dir.y};

                 // 如果當前方向撞牆，強制轉向
                 if (!canMoveAt(g.x, g.y, g.dir, GHOST_RADIUS)) {
                     g.dir = {x: -g.dir.x, y: -g.dir.y};
                 } else {
                     // 在網格中心時選擇新方向
                     var validDirs = [];
                     var possibleDirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
                     for (var pdi = 0; pdi < possibleDirs.length; pdi++) {
                         var d = possibleDirs[pdi];
                         if (d.x === oppositeDir.x && d.y === oppositeDir.y && validDirs.length > 0) continue;
                         if (isPassable(gridCol + d.x, gridRow + d.y)) {
                             validDirs.push(d);
                         }
                     }
                     if (validDirs.length === 0) {
                         if (isPassable(gridCol + oppositeDir.x, gridRow + oppositeDir.y)) {
                             validDirs.push(oppositeDir);
                         }
                     }

                     if (validDirs.length > 0) {
                         if (g.frightened && !g.dead) {
                             g.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                         } else if (!g.frightened) {
                             // 追蹤 Pac-Man
                             var bestDir = validDirs[0];
                             var bestDist = Infinity;
                             for (var vi = 0; vi < validDirs.length; vi++) {
                                 var vd = validDirs[vi];
                                 var nx = g.x + vd.x * TILE_SIZE * 5;
                                 var ny = g.y + vd.y * TILE_SIZE * 5;
                                 var dist = Math.abs(nx - pacman.x) + Math.abs(ny - pacman.y);
                                 if (dist < bestDist) {
                                     bestDist = dist;
                                     bestDir = vd;
                                 }
                             }
                             g.dir = bestDir;
                         }
                     }
                 }
             }

             // 移動
             if (canMoveAt(g.x, g.y, g.dir, GHOST_RADIUS)) {
                 var spd = g.frightened ? g.speed * 0.6 : g.speed;
                 if (g.dead) spd = g.speed * 1.5;
                 g.x += g.dir.x * spd * t;
                 g.y += g.dir.y * spd * t;
             } else {
                 g.dir = {x: -g.dir.x, y: -g.dir.y};
             }

            // 左右隧道 / 鏡射通道
            var map = getCurrentMap();
            var gCol = Math.round((g.x - TILE_SIZE/2) / TILE_SIZE);
            var gRow = Math.round((g.y - TILE_SIZE/2) / TILE_SIZE);
            if (gRow >= 0 && gRow < ROWS && gCol >= 0 && gCol < COLS) {
                if (map[gRow][gCol] === 4 && g.dir.x > 0) {
                    // 在通道 4 內且往右移動，且幽靈中心已超過通道左半格
                    var chLeft = gCol * TILE_SIZE;
                    if (g.x > chLeft + TILE_SIZE / 2) {
                        for (let c = COLS - 1; c >= 0; c--) {
                            if (map[gRow][c] === 5) {
                                g.x = c * TILE_SIZE + TILE_SIZE / 2;
                                g.y = gRow * TILE_SIZE + TILE_SIZE / 2;
                                break;
                            }
                        }
                    }
                } else if (map[gRow][gCol] === 5 && g.dir.x < 0) {
                    // 在通道 5 內且往左移動，且幽靈中心已超過通道右半格
                    var chLeft5 = gCol * TILE_SIZE;
                    if (g.x < chLeft5 + TILE_SIZE / 2) {
                        for (let c = 0; c < COLS; c++) {
                            if (map[gRow][c] === 4) {
                                g.x = c * TILE_SIZE + TILE_SIZE / 2;
                                g.y = gRow * TILE_SIZE + TILE_SIZE / 2;
                                break;
                            }
                        }
                    }
                }
            }
            if (g.x < -TILE_SIZE/2) g.x = COLS * TILE_SIZE + TILE_SIZE/2;
            else if (g.x > COLS * TILE_SIZE + TILE_SIZE/2) g.x = -TILE_SIZE/2;

            // 碰撞檢測
            var cdx = pacman.x - g.x;
            var cdy = pacman.y - g.y;
            var collisionDist = (pacman.radius + GHOST_RADIUS) * 0.8;
            if (Math.sqrt(cdx*cdx + cdy*cdy) < collisionDist) {
                if (g.frightened && !g.dead) {
                    ghostsEatenCounter++;
                    if (score >= EAT_SCORE_THRESHOLD) {
                        score += 200;
                        scoreEl.innerText = score;
                        playSound('eat');
                        g.returningHome = true;
                        g.dir = {x: -g.dir.x, y: -g.dir.y};
                    } else {
                        g.dead = true;
                        score += 200;
                        scoreEl.innerText = score;
                        playSound('eat');
                    }
                    // 每吃 10 隻恐懼幽靈 +1 生命
                    if (ghostsEatenCounter % 10 === 0) {
                        lives++;
                        livesEl.innerText = lives;
                    }
                } else if (!g.dead) {
                    // 死亡
                    playerDie();
                }
            }
        }

        // 檢查是否通關
        if (dots.length === 0 && powerDots.length === 0) {
            nextLevel();
        }
    }

    function playerDie() {
        if (justDied) return;
        justDied = true;
        dying = true;
        gameRunning = false;
        lives--;
        livesEl.innerText = lives;
        playSound('die');
        cancelAnimationFrame(animationId);

        // 保存死亡前的狀態
        var savedDots = dots.slice();
        var savedPowerDots = powerDots.slice();
        var savedPacmanX = pacman.x;
        var savedPacmanY = pacman.y;
        var savedPacmanDir = {x: pacman.dir.x, y: pacman.dir.y};
        var savedPacmanNextDir = {x: pacman.nextDir.x, y: pacman.nextDir.y};
        var savedPacmanSpeed = pacman.speed;
        var savedGhosts = ghosts.map(function(g) {
            return {
                x: g.x, y: g.y, color: g.color,
                dir: {x: g.dir.x, y: g.dir.y},
                speed: g.speed,
                inGhostHouse: g.inGhostHouse,
                frightened: g.frightened,
                frightenedTimer: g.frightenedTimer,
                dead: g.dead,
                returningHome: g.returningHome,
                homeTimer: g.homeTimer,
                _bfsPath: g._bfsPath ? g._bfsPath.slice() : null
            };
        });
        var savedGhostReleaseTimer = ghostReleaseTimer;
        var savedLevelConfig = getConfig();

        resumeState = {
            dots: savedDots,
            powerDots: savedPowerDots,
            pacman: { x: savedPacmanX, y: savedPacmanY, dir: savedPacmanDir, nextDir: savedPacmanNextDir, speed: savedPacmanSpeed },
            ghosts: savedGhosts,
            ghostReleaseTimer: savedGhostReleaseTimer,
            levelConfig: savedLevelConfig
        };

        // 更新最高分
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('pacmanHighScore', highScore.toString());
        }

        if (lives <= 0) {
            // 遊戲結束
            overlay.style.display = 'flex';
            overlayTitle.innerText = "遊戲結束";
            startBtn.innerText = "重新開始";
            // 清除舊訊息
            var oldMsgs = overlay.querySelectorAll(':scope > p');
            oldMsgs.forEach(function(el) { el.remove(); });
            var p = document.createElement('p');
            p.style.color = '#FFD700';
            p.style.fontSize = '1.1rem';
            p.style.whiteSpace = 'pre-line';
            p.innerHTML = "生命耗盡！\n最終分數：" + score + "\n最高分：" + highScore + "\n到達關卡：第" + (Math.floor(totalCleared / LEVEL_MAPS.length) + 1) + "-" + ((totalCleared % LEVEL_MAPS.length) + 1) + "關";
            overlay.appendChild(p);

            // 排行榜按鈕
            var oldLbBtn = overlay.querySelector('.leaderboard-btn');
            if (oldLbBtn) oldLbBtn.remove();
            var lbBtn = document.createElement('button');
            lbBtn.className = 'leaderboard-btn';
            lbBtn.textContent = '🏆 排行榜';
            lbBtn.addEventListener('pointerdown', (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                showLeaderboard(score, getGameOverLevelLabel());
            });
            overlay.appendChild(lbBtn);

            resumeState = null;
        } else {
            // 繼續遊戲（保留目前分數）
            overlay.style.display = 'flex';
            overlayTitle.innerText = "你死亡了";
            startBtn.innerText = "繼續";
            gameRunning = false;
            // 清除舊訊息
            var oldMsgs = overlay.querySelectorAll(':scope > p');
            oldMsgs.forEach(function(el) { el.remove(); });
            var p = document.createElement('p');
            p.style.color = '#FFD700';
            p.style.fontSize = '1.1rem';
            p.style.whiteSpace = 'pre-line';
            p.innerHTML = "剩餘生命：" + lives + "\n目前分數：" + score + "\n最高分：" + highScore;
            overlay.appendChild(p);
        }
    }

    function nextLevel() {
        levelTransition = true;
        var prevLevel = level;
        level++;
        // 最後一關過完回到第 1 關
        if (level > LEVEL_MAPS.length) {
            level = 1;
        }

        // 計算已經完成的關卡數（從1開始）
        totalCleared++;
        var cycle = Math.ceil(totalCleared / LEVEL_MAPS.length);
        var displayLevel = ((totalCleared - 1) % LEVEL_MAPS.length) + 1;
        var levelLabel = "第" + cycle + "-" + displayLevel + "關";
        var nowcycle = Math.floor(totalCleared / LEVEL_MAPS.length) + 1;
        var nowlevel = (totalCleared % LEVEL_MAPS.length) + 1;
        levelEl.innerText = nowlevel;
        cycleEl.innerText = nowcycle;

        // 更新最高分
        if (score > highScore) {
            localStorage.setItem('pacmanHighScore', highScore.toString());
        }

        // 顯示通關訊息
        overlay.style.display = 'flex';
        overlayTitle.innerHTML = levelLabel + "<br>通關";
        startBtn.innerText = "進入下一關";

        // 清除舊訊息
        var oldMsgs = overlay.querySelectorAll(':scope > p');
        oldMsgs.forEach(function(el) { el.remove(); });
        var p = document.createElement('p');
        p.style.color = '#FFD700';
        p.style.fontSize = '1.1rem';
        p.style.whiteSpace = 'pre-line';
        p.innerHTML = "分數：" + score + "\n最高分：" + highScore;
        overlay.appendChild(p);

        // 儲存當前生命和分數
        var savedLives = lives;
        var savedScore = score;

        // 過關按鈕綁定（透過 startGame(false) 處理）
    }

    function gameOver() {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        playSound('die');

        // 更新最高分
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('pacmanHighScore', highScore.toString());
        }

        overlay.style.display = 'flex';
        overlayTitle.innerText = "遊戲結束";
        startBtn.innerText = "重新開始";

        // 清除舊訊息
        var oldMsgs = overlay.querySelectorAll(':scope > p');
        oldMsgs.forEach(function(el) { el.remove(); });
        var p = document.createElement('p');
        p.style.color = '#FFD700';
        p.style.fontSize = '1.1rem';
        p.style.whiteSpace = 'pre-line';
        p.innerHTML = "最終分數：" + score + "\n最高分：" + highScore;
        overlay.appendChild(p);

        // 排行榜按鈕
        var oldLbBtn = overlay.querySelector('.leaderboard-btn');
        if (oldLbBtn) oldLbBtn.remove();
        var lbBtn = document.createElement('button');
        lbBtn.className = 'leaderboard-btn';
        lbBtn.textContent = '🏆 排行榜';
        lbBtn.addEventListener('pointerdown', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            showLeaderboard(score, getGameOverLevelLabel());
        });
        overlay.appendChild(lbBtn);

        resumeState = null;
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, COLS * TILE_SIZE, ROWS * TILE_SIZE);

        // 牆壁：從離線快取貼上（不再每幀重算 shadowBlur）
        if (wallCache) {
            ctx.drawImage(wallCache, 0, 0);
        }

        // 能量球（糖果風格）
        dots.forEach(d => {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(d.x, d.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(d.x - 1, d.y - 1, 1.2, 0, Math.PI * 2);
            ctx.fill();
        });

        // 強化能量球（糖果風格 + 脈衝閃爍）
        var pulse = 1 + Math.sin(Date.now() / 200) * 0.2;
        powerDots.forEach(d => {
            ctx.fillStyle = '#EC5F72';
            ctx.beginPath();
            ctx.arc(d.x, d.y, 6 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(d.x - 2 * pulse, d.y - 2 * pulse, 2.4 * pulse, 0, Math.PI * 2);
            ctx.fill();
        });

        // 幽靈
        for (var gi = 0; gi < ghosts.length; gi++) {
            var g = ghosts[gi];
            var color = g.frightened ? '#0000FF' : g.dead ? '#888888' : g.color;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(g.x, g.y - 2, 8, Math.PI, 0);
            ctx.lineTo(g.x + 8, g.y + 8);
            // 波浪邊緣
            for (var w = 0; w < 3; w++) {
                var wx = g.x + 8 - w * (16/3);
                ctx.quadraticCurveTo(wx - 4, g.y + 4, wx - (16/3), g.y + 8);
            }
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(g.x - 3, g.y - 4, 2, 0, Math.PI * 2);
            ctx.arc(g.x + 3, g.y - 4, 2, 0, Math.PI * 2);
            ctx.fill();

            // 瞳孔
            ctx.fillStyle = g.frightened ? '#fff' : '#000';
            ctx.beginPath();
            ctx.arc(g.x - 3 + g.dir.x, g.y - 4 + g.dir.y, 1, 0, Math.PI * 2);
            ctx.arc(g.x + 3 + g.dir.x, g.y - 4 + g.dir.y, 1, 0, Math.PI * 2);
            ctx.fill();

            // 恐懼幽靈的恐懼表情
            if (g.frightened) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(g.x - 4, g.y + 3);
                ctx.lineTo(g.x - 2, g.y + 5);
                ctx.lineTo(g.x, g.y + 3);
                ctx.lineTo(g.x + 2, g.y + 5);
                ctx.lineTo(g.x + 4, g.y + 3);
                ctx.stroke();
            }
        }

        // 小精靈
        ctx.fillStyle = '#FFFF52';
        ctx.beginPath();

        let angle = 0;
        if (pacman.dir.x === 1) angle = 0;
        if (pacman.dir.x === -1) angle = Math.PI;
        if (pacman.dir.y === 1) angle = Math.PI / 2;
        if (pacman.dir.y === -1) angle = -Math.PI / 2;

        const mouthSize = 0.15 * Math.PI + (Math.sin(Date.now() / 80) * 0.1);
        ctx.arc(pacman.x, pacman.y, pacman.radius, angle + mouthSize, angle + (2 * Math.PI - mouthSize));
        ctx.lineTo(pacman.x, pacman.y);
        ctx.fill();

        // 暫停覆蓋層
        if (isPaused) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, COLS * TILE_SIZE, ROWS * TILE_SIZE);
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 32px "Microsoft JhengHei", "PingFang TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('暫停', COLS * TILE_SIZE / 2, ROWS * TILE_SIZE / 2);
            ctx.font = '14px "Microsoft JhengHei", "PingFang TC", sans-serif';
            ctx.fillStyle = '#ccc';
            ctx.fillText('點擊 ▶ 繼續', COLS * TILE_SIZE / 2, ROWS * TILE_SIZE / 2 + 36);
        }
    }

    // 固定時間步進 — 避免手機端 rAF 幀率跳動導致視覺忽快忽慢
    let lastFrameTime = 0;
    const FIXED_DT = 16.6667; // 目標 60fps 步進（ms）

    function loop(timestamp) {
        if (!gameRunning || levelTransition) return;
        if (!timestamp) timestamp = performance.now();
        if (lastFrameTime === 0) lastFrameTime = timestamp;

        const delta = timestamp - lastFrameTime;
        lastFrameTime = timestamp;

        // 限制最大 delta 防止切換 tab 後爆衝
        const dt = Math.min(delta, FIXED_DT * 3);

        if (!isPaused) {
            // 以實際經過時間比例更新（手機 30fps 時 delta 約 33ms → 移動 2x）
            update(dt);
        }
        draw();
        animationId = requestAnimationFrame(loop);
    }

    let gameStarted = false;
    var resumeState = null; // 保存死亡前的遊戲狀態，用於繼續遊戲

    function startGame(resetScore = true) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        resizeCanvas();

        if (resetScore || !gameStarted) {
            initGame();
            buildWallCache();
            gameStarted = true;
        } else if (resumeState) {
            // 繼續遊戲：從死亡前的狀態恢復
            walls = [];
            var map = getCurrentMap();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const type = map[r][c];
                    if (type === 1) {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
                    }
                    // 4/5 鏡射通道：不加入任何物件
                }
            }

            // 恢復已吃掉的能量球狀態（只保留尚未吃掉的）
            dots = resumeState.dots;
            powerDots = resumeState.powerDots;

            // 恢復 Pac-Man 位置
            pacman.x = resumeState.pacman.x;
            pacman.y = resumeState.pacman.y;
            pacman.dir = resumeState.pacman.dir;
            pacman.nextDir = resumeState.pacman.nextDir;
            pacman.speed = resumeState.pacman.speed;

            // 恢復幽靈（重置為鬼屋內）
            ghosts = [];
            var ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];
            var ghostStarts = [
                { x: 9, y: 8 },
                { x: 8, y: 8 },
                { x: 10, y: 8 },
                { x: 9, y: 8 },
            ];
            for (var i = 0; i < 4; i++) {
                var gs = ghostStarts[i];
                ghosts.push({
                    x: gs.x * TILE_SIZE + TILE_SIZE / 2,
                    y: gs.y * TILE_SIZE + TILE_SIZE / 2,
                    color: ghostColors[i],
                    dir: {x: 0, y: 0},
                    speed: resumeState.levelConfig.ghostSpeed,
                    inGhostHouse: true,
                    frightened: false,
                    frightenedTimer: 0,
                    dead: false,
                    returningHome: false,
                    homeTimer: null,
                    _bfsPath: null
                });
            }

            ghostReleaseTimer = 0;
            dying = false;
            justDied = false;
            levelTransition = false;

            // 清除保存的狀態
            resumeState = null;
            buildWallCache();
        } else {
            // 正常進入下一關：重建地圖和幽靈
            walls = [];
            dots = [];
            powerDots = [];
            var map = getCurrentMap();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    var type = map[r][c];
                    if (type === 1) {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
                    } else if (type === 0) {
                        dots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                    } else if (type === 3) {
                        powerDots.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                    }
                }
            }

            var start = findPacmanStart();
            pacman.x = start.x * TILE_SIZE + TILE_SIZE / 2;
            pacman.y = start.y * TILE_SIZE + TILE_SIZE / 2;
            pacman.dir = {x: 1, y: 0};
            pacman.nextDir = {x: 1, y: 0};
            pacman.speed = 2;

            ghosts = [];
            var ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];
            var ghostStarts = [
                { x: 9, y: 8 },
                { x: 8, y: 8 },
                { x: 10, y: 8 },
                { x: 9, y: 8 },
            ];
            for (var i = 0; i < 4; i++) {
                var gs = ghostStarts[i];
                ghosts.push({
                    x: gs.x * TILE_SIZE + TILE_SIZE / 2,
                    y: gs.y * TILE_SIZE + TILE_SIZE / 2,
                    color: ghostColors[i],
                    dir: {x: 0, y: 0},
                    speed: getConfig().ghostSpeed,
                    inGhostHouse: true,
                    frightened: false,
                    frightenedTimer: 0,
                    dead: false,
                    returningHome: false,
                    homeTimer: null,
                    _bfsPath: null
                });
            }

            ghostReleaseTimer = 0;
            dying = false;
            justDied = false;
            levelTransition = false;
            buildWallCache();
        }

        gameRunning = true;
        overlay.style.display = 'none';
        overlay.onclick = null;

        playSound('start');
        loop();
    }

    // 鍵盤控制
    window.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
        }
        if (!gameRunning || levelTransition) {
            if ((e.key === ' ' || e.key === 'Enter') && gameRunning === false) {
                if (lives > 0) {
                    startGame(false);
                } else {
                    startGame(true);
                }
            }
            return;
        }
        if (e.key === ' ') {
            togglePause();
            return;
        }
        switch(e.key) {
            case 'ArrowUp': pacman.nextDir = {x:0, y:-1}; break;
            case 'ArrowDown': pacman.nextDir = {x:0, y:1}; break;
            case 'ArrowLeft': pacman.nextDir = {x:-1, y:0}; break;
            case 'ArrowRight': pacman.nextDir = {x:1, y:0}; break;
        }
    });

    // 觸控控制 — 使用 Pointer Events + 即時滑動響應
    const SWIPE_THRESHOLD = 30;
    const TAP_THRESHOLD = 10;
    let touchStartX = 0;
    let touchStartY = 0;
    let isTouching = false;

    const gameContainer = document.getElementById('game-container');

    gameContainer.addEventListener('pointerdown', e => {
        if (e.target.id === 'start-btn') return;
        if (!gameRunning || levelTransition) return;
        e.preventDefault();
        isTouching = true;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
    }, {passive: false});

    gameContainer.addEventListener('pointermove', e => {
        if (!isTouching || !gameRunning || levelTransition) return;
        // 只在真正有位移時才 preventDefault + 設定方向
        const diffX = e.clientX - touchStartX;
        const diffY = e.clientY - touchStartY;
        const distance = Math.sqrt(diffX * diffX + diffY * diffY);

        if (distance > TAP_THRESHOLD) {
            e.preventDefault();
            if (Math.abs(diffX) > Math.abs(diffY)) {
                pacman.nextDir = diffX > 0 ? {x:1, y:0} : {x:-1, y:0};
            } else {
                pacman.nextDir = diffY > 0 ? {x:0, y:1} : {x:0, y:-1};
            }
        }
    }, {passive: true});

    gameContainer.addEventListener('pointerup', e => {
        isTouching = false;
    }, {passive: false});

    gameContainer.addEventListener('pointercancel', e => {
        isTouching = false;
    }, {passive: false});

    // 防止 container 內的 touch 事件造成頁面滾動（僅在遊戲中攔截）
    gameContainer.addEventListener('touchstart', e => {
        if (e.target.id === 'start-btn') return;
        e.preventDefault();
    }, {passive: false});
    gameContainer.addEventListener('touchmove', e => {
        if (gameRunning && !levelTransition) {
            e.preventDefault();
        }
    }, {passive: false});

    // 暫停/繼續
    function togglePause() {
        if (!gameRunning || levelTransition) return;
        isPaused = !isPaused;
        const btn = document.getElementById('pause-btn');
        if (isPaused) {
            btn.textContent = '▶';
            btn.classList.add('paused');
            btn.title = '繼續 (空白鍵)';
        } else {
            btn.textContent = '⏸';
            btn.classList.remove('paused');
            btn.title = '暫停 (空白鍵)';
        }
    }

    document.getElementById('pause-btn').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        togglePause();
    });

    // 按鈕點擊事件
    startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (lives <= 0) {
            // 遊戲結束，重新開始（重設分數）
            gameStarted = false;
            startGame(true);
        } else {
            // 繼續遊戲（保留分數）
            startGame(false);
        }
    });

    startBtn.addEventListener('touchend', (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (lives <= 0) {
            gameStarted = false;
            startGame(true);
        } else {
            startGame(false);
        }
    });

    // 視窗大小改變
    window.addEventListener('resize', () => {
        resizeCanvas();
        if (gameRunning) draw();
    });

    // 初始繪製
    resizeCanvas();
    if (gameRunning) draw();

    // ================= 排行榜功能 =================
    let currentLeaderboardData = [];
    let currentSubmitScore = 0;
    let currentSubmitLevelLabel = '';

    // 計算遊戲結束時的關卡標籤（格式：第X-N關）
    function getGameOverLevelLabel() {
        const LEVEL_MAPS_LEN = LEVEL_MAPS.length;
        const goCycle = Math.floor(totalCleared / LEVEL_MAPS_LEN) + 1;
        const goLevel = (totalCleared % LEVEL_MAPS_LEN) + 1;
        return '第' + goCycle + '-' + goLevel + '關';
    }

    function showLeaderboard(score, levelLabel) {
        currentSubmitScore = score;
        currentSubmitLevelLabel = levelLabel;
        const lbOverlay = document.getElementById('leaderboard-overlay');
        const lbList = document.getElementById('lb-list');
        const lbInputArea = document.getElementById('lb-input-area');
        const lbStatus = document.getElementById('lb-status');

        lbOverlay.classList.add('active');
        lbList.innerHTML = '';
        lbInputArea.classList.remove('active');
        lbStatus.textContent = '讀取中...';

        // 讀取排行榜
        sb.from('pmleaderboard').select('*').order('score', {ascending: false}).limit(10).then(({data, error}) => {
            if (error) {
                lbStatus.textContent = '讀取失敗，請稍後再試';
                console.error('Leaderboard read error:', error);
                return;
            }
            lbStatus.textContent = '';
            currentLeaderboardData = data || [];
            renderLeaderboard(currentLeaderboardData);
            checkIfInTop10(score);
        });
    }

    function renderLeaderboard(entries) {
        const lbList = document.getElementById('lb-list');
        lbList.innerHTML = '';

        if (entries.length === 0) {
            lbList.innerHTML = '<div style="color:#aaa;text-align:center;padding:20px;">尚無紀錄</div>';
            return;
        }

        const medals = ['🥇', '🥈', '🥉'];
        entries.forEach((entry, idx) => {
            const row = document.createElement('div');
            row.className = 'lb-row';
            if (idx === 0) row.classList.add('top1');
            else if (idx === 1) row.classList.add('top2');
            else if (idx === 2) row.classList.add('top3');

            const rank = document.createElement('span');
            rank.className = 'lb-rank';
            rank.textContent = medals[idx] ? medals[idx] : (idx + 1);
            row.appendChild(rank);

            const name = document.createElement('span');
            name.className = 'lb-name';
            name.textContent = entry.name;
            row.appendChild(name);

            const score = document.createElement('span');
            score.className = 'lb-score';
            score.textContent = entry.score;
            row.appendChild(score);

            if (entry.level) {
                const lvl = document.createElement('span');
                lvl.className = 'lb-level';
                lvl.textContent = entry.level;
                row.appendChild(lvl);
            }

            lbList.appendChild(row);
        });
    }

    function checkIfInTop10(score) {
        const lbInputArea = document.getElementById('lb-input-area');
        const lbStatus = document.getElementById('lb-status');
        const nameInput = document.getElementById('lb-name-input');
        const submitBtn = document.getElementById('lb-submit-btn');

        // 如果已有 10 筆，檢查最低分是否比目前分數低
        if (currentLeaderboardData.length < 10) {
            // 不足 10 筆，可以直接提交
            lbInputArea.classList.add('active');
            lbStatus.textContent = '恭喜進入排行榜！請輸入暱稱';
            nameInput.value = '';
            setupSubmitHandler();
        } else if (score > currentLeaderboardData[currentLeaderboardData.length - 1].score) {
            // 分數高於第 10 名
            lbInputArea.classList.add('active');
            lbStatus.textContent = '恭喜進入排行榜！請輸入暱稱';
            nameInput.value = '';
            setupSubmitHandler();
        } else {
            lbStatus.textContent = '未進入前十名';
        }
    }

    function setupSubmitHandler() {
        const nameInput = document.getElementById('lb-name-input');
        const submitBtn = document.getElementById('lb-submit-btn');

        // 移除舊的事件監聽（建立新元素所以不需要）
        submitBtn.onclick = function() {
            const name = nameInput.value.trim();
            if (!name) {
                document.getElementById('lb-status').textContent = '請輸入暱稱';
                return;
            }
            if (name.length > 12) {
                document.getElementById('lb-status').textContent = '名稱太長（最多中文６字／英文12字）';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '儲存中...';
            document.getElementById('lb-status').textContent = '';

            // 插入或更新排行榜
            sb.from('pmleaderboard').insert({
                name: name,
                score: currentSubmitScore,
                level: currentSubmitLevelLabel
            }).then(({data, error}) => {
                submitBtn.disabled = false;
                submitBtn.textContent = '送出';

                if (error) {
                    document.getElementById('lb-status').textContent = '儲存失敗：' + error.message;
                    console.error('Leaderboard insert error:', error);
                    return;
                }

                document.getElementById('lb-status').textContent = '儲存成功！';
                // 重新讀取
                setTimeout(() => {
                    sb.from('pmleaderboard').select('*').order('score', {ascending: false}).limit(10).then(({data, error}) => {
                        if (!error) {
                            currentLeaderboardData = data || [];
                            renderLeaderboard(currentLeaderboardData);
                            document.getElementById('lb-input-area').classList.remove('active');
                        }
                    });
                }, 1000);
            });
        };
    }

    // 關閉排行榜
    document.getElementById('lb-close-btn').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        document.getElementById('leaderboard-overlay').classList.remove('active');
    });

</script>
