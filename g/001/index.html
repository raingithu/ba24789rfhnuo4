  }
}

// ===== B2：設定欄位映射（openSettings / saveSettings / resetSettings 共用單一來源；新增設定只需加一列）=====
const SETTING_FIELDS=[
  {id:'settingKey',key:'apiKey',type:'text',trim:true},
  {id:'settingModel',key:'model',type:'model'},
  {id:'settingImageModel',key:'imageModel',type:'text',trim:true,def:'agnes-image-2.1-flash'},
  {id:'settingImageSize',key:'imageSize',type:'text'},
  {id:'settingImageRatio',key:'imageRatio',type:'text'},
  {id:'settingEndpoint',key:'endpoint',type:'text',trim:true},
  {id:'settingTemp',key:'temperature',type:'float',def:0.6},
  {id:'settingMaxTokens',key:'maxTokens',type:'int',def:2048},
  {id:'settingCtx',key:'ctxLimit',type:'text'},
  {id:'settingAutoScroll',key:'autoScroll',type:'bool'},
  {id:'settingQuickReply',key:'quickReply',type:'bool'},
  {id:'settingThinking',key:'showThinking',type:'bool'},
  {id:'settingStorageWarn',key:'storageWarnMB',type:'int',def:DEFAULT_STORAGE_WARN_MB},
  {id:'settingSystem',key:'systemPrompt',type:'text',trim:true},
  {id:'settingPersona',key:'persona',type:'text'},
  {id:'settingSendKey',key:'sendKey',type:'text',def:'auto'},
  {id:'settingTheme',key:'theme',type:'text'}
];
function openSettings(){
  // B2：以 SETTING_FIELDS 映射表統一填值
  SETTING_FIELDS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(!el)return;
    if(f.type==='bool'){
      // B5：沿用各設定 getter 的語意（三者都是 `!==false`，未設定時一律視為「開」；
      //     實務上 migrateLegacySettings() 啟動時就會補上 DEFAULT_SETTINGS，不會真的走到未設定分支）
      el.checked=f.key==='autoScroll'?getAutoScroll():f.key==='quickReply'?getQuickReply():getShowThinking();
    }else{
      // 後備鏈：settings 值 → DEFAULT_SETTINGS 預設 → 欄位 def → 空字串（確保面板永不空白）
      const v=settings[f.key];
      const dv=(v!=null&&v!=='')?v:(DEFAULT_SETTINGS[f.key]!=null?DEFAULT_SETTINGS[f.key]:(f.def!=null?f.def:''));
      el.value=dv;
    }
  });
  syncModelInput();   // 依端點欄位值切換模型欄的「下拉/文字」形態（model 值先寫入文字端，再由 sync 統一兩側）
  fillPersonaOptions();
  document.getElementById('settingPersona').value=getPersonaId();
  updatePersonaDesc();
  document.getElementById('settingsModal').classList.add('open');
  histPush('settings');   // 推入一筆歷史狀態：手機返回鍵／返回手勢觸發 popstate 時關設定，而不是離開頁面
}
function closeSettings(){
  document.getElementById('settingsModal').classList.remove('open');
  histPop('settings');   // 手機返回鍵同步：用 ✕／背景／Esc 關閉時退掉推入的狀態
  applyTheme();
}

// ===== Modal 確認框 & Toast 提示 =====
function showConfirm(msg){
  return new Promise(resolve=>{
    const modal=document.getElementById('confirmModal');
    const yes=document.getElementById('confirmYes');
    const no=document.getElementById('confirmNo');
    document.getElementById('confirmMsg').textContent=msg;
    modal.classList.add('open');
    histPush('confirm');   // 推入一筆歷史狀態：手機返回鍵關確認框（視同按「取消」），而不是離開頁面
    const done=v=>{
      modal.classList.remove('open');
      histPop('confirm');   // 同步退掉推入的狀態（popstate 端旗標已清，不會重複關閉）
      yes.removeEventListener('click',onYes);
      no.removeEventListener('click',onNo);
      modal.removeEventListener('click',onBg);
      resolve(v);
    };
    const onYes=()=>done(true);
    const onNo=()=>done(false);
    const onBg=e=>{if(e.target===modal)done(false)};
    yes.addEventListener('click',onYes);
    no.addEventListener('click',onNo);
    modal.addEventListener('click',onBg);
  });
}
// ===== 三之1：搜尋來源面板 =====
// 訊息上只存了查詢字串（🔍 徽章）；實際引用到的來源清單記錄在 m.sources，點徽章即可展開。
function safeHttpUrl(u){
  const s=String(u||'').trim();
  return /^https?:\/\/[^\s]+$/i.test(s)?s:'';   // 只放行 http(s)，阻擋 javascript: 等偽協議
}
function showSourcesModal(m){
  const list=(m&&m.sources||[]).map(s=>({title:String(s.title||''),url:safeHttpUrl(s.url)})).filter(s=>s.url);
  if(!list.length){showToast('沒有可用的來源網址','warn');return}
  document.getElementById('sourcesQuery').textContent=m.searchQuery?('查詢字串：'+m.searchQuery):'';
  document.getElementById('sourcesList').innerHTML=list.map((s,i)=>
    '<a href="'+escHtml(s.url)+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="src-title">'+escHtml((i+1)+'. '+(s.title||s.url))+'</span>'+
      '<span class="src-url">'+escHtml(s.url)+'</span>'+
    '</a>').join('');
  document.getElementById('sourcesModal').classList.add('open');
  histPush('sources');   // 推入一筆歷史狀態：手機返回鍵關面板，而不是離開頁面
}
function closeSourcesModal(fromPop){
  const modal=document.getElementById('sourcesModal');
  if(!modal.classList.contains('open'))return;
  modal.classList.remove('open');
  histPop('sources',!!fromPop);   // 由 popstate 觸發時歷史狀態已彈掉，不能再退一次
}
document.getElementById('sourcesClose').addEventListener('click',()=>closeSourcesModal(false));
document.getElementById('sourcesModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSourcesModal(false)});

function showToast(msg,type){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.innerHTML=msg;
  wrap.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2600);
  return t;
}
// ===== PWA 新版更新提示（記憶體旗標：本輪只提示一次、不騷擾）=====
let appUpdateToastShown=false;   // 本輪是否已顯示過「有新版本」toast
let appUpdatePending=false;      // 是否有待套用的新版（header 更新鈕顯示依據）
function setAppUpdatePending(on){
  appUpdatePending=!!on;
  const b=document.getElementById('btnAppUpdate');
  if(b){b.hidden=!appUpdatePending;b.classList.toggle('show',appUpdatePending)}
}
function notifyAppUpdateAvailable(){
  setAppUpdatePending(true);
  if(appUpdateToastShown)return;   // 已提示過：只留 header 更新鈕，不再彈 toast
  appUpdateToastShown=true;
  const t=showToast('有新版本，可更新','action');
  if(t)t.addEventListener('click',()=>applyAppUpdate());
}
function applyAppUpdate(){
  // 串流生成中禁止重整：避免 AI 回覆／生圖被中斷；請使用者等完成後再點 header 的更新鈕
  if(typeof isStreaming!=='undefined'&&isStreaming){showToast('AI 回覆中，請稍後更新','warn');return}
  try{
    if(draftTimer){clearTimeout(draftTimer);draftTimer=null}
    if(typeof saveDraft==='function')saveDraft();               // 輸入框草稿先存
    if(typeof saveChatsDataNow==='function')saveChatsDataNow(); // 待寫存的對話先沖掉
    if(typeof saveDrafts==='function')saveDrafts();
  }catch(e){}
  // controller 已換手時 reload 必定拿到新殼；若新 SW 還在背景裝，給它一點時間再重整
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)setAppUpdatePending(false),location.reload();
  else setTimeout(()=>location.reload(),1200);
}
// D3：常駐進度提示（匯出／壓縮大量項目時用；與 toast 不同，不會自動消失）
let progressToastEl=null;
function showProgress(msg){

    progressToastEl=document.createElement('div');
    progressToastEl.className='toast';
    document.getElementById('toastWrap').appendChild(progressToastEl);
  }
  progressToastEl.innerHTML=msg;
}
function hideProgress(){

// D7：啟動時儲存空間用量檢查（超過設定門檻則提醒壓縮／清理）
async function checkStorageUsage(){
  try{
    if(!navigator.storage||!navigator.storage.estimate)return;
    const est=await navigator.storage.estimate();
    const usage=est.usage||0;
    const limitMB=parseInt(settings.storageWarnMB,10)||DEFAULT_STORAGE_WARN_MB;
    if(usage>limitMB*1048576)showToast('⚠️ 本機儲存已用 '+fmtBytes(usage)+'（提醒門檻 '+limitMB+' MB），建議開啟圖片庫壓縮或清理','warn');
  }catch(e){}
}

async function resetSettings(){
  if(!await showConfirm('確定要將所有設定恢復為網頁預設值嗎？'))return;
  settings={...DEFAULT_SETTINGS};
  loadCustomPersonas();   // 重設會清掉自訂人格設定，同步把運作中的人格清單還原回內建（再開設定即為空白新增項）
  saveSettingsData(settings);
  // B2：以 SETTING_FIELDS 映射表統一回填預設值
  SETTING_FIELDS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(!el)return;
    if(f.type==='bool')el.checked=!!DEFAULT_SETTINGS[f.key];
    else el.value=DEFAULT_SETTINGS[f.key]!=null?DEFAULT_SETTINGS[f.key]:(f.def!=null?f.def:'');
  });
  syncModelInput();   // 預設端點是 Agnes → 切回下拉形態
  // 人格下拉選單同步重建：loadCustomPersonas 已清掉自訂人格，但不重建下拉殘留舊 option 與舊選取值
  fillPersonaOptions();
  document.getElementById('settingPersona').value=getPersonaId();
  updatePersonaDesc();
  applyTheme();
  invalidateRenderCache();   // B1：設定回到預設值，快取同樣要失效
  if(chats[activeChatId])renderMessages(true);
  showToast('已恢復為預設設定','success');
}
function saveSettings(){
  const prevThinking=getShowThinking();   // B1：判斷「顯示思考過程」是否真的被改動
  syncModelInput();   // 模型雙形態：把目前有效端的值帶回文字端（#settingModel），下面統一從文字端收值
  // B2：以 SETTING_FIELDS 映射表統一收值
  SETTING_FIELDS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(!el)return;
    if(f.type==='bool'){settings[f.key]=el.checked;return}
    let v=el.value;
    if(f.trim)v=v.trim();
    if(f.type==='float')v=parseFloat(v);
    else if(f.type==='int')v=parseInt(v,10);
    if((f.type==='float'||f.type==='int')&&!Number.isFinite(v))v=f.def!=null?f.def:0;
    else if(v===''&&f.def!=null)v=f.def;
    settings[f.key]=v;
  });
  applyTheme();
  saveSettingsData(settings);
  invalidateRenderCache();   // B1：設定會影響 renderContent 的輸出（例：顯示思考過程）
  closeSettings();
  // 「顯示思考過程」開關會改變既有訊息的外觀：真的改了才重繪（保留捲動位置）
  if(getShowThinking()!==prevThinking&&chats[activeChatId])renderMessages(true);
}

// D8：串流結束後送出排隊訊息（requestAI / requestImage 的 finally 呼叫）
function flushQueuedMessage(){
  if(isStreaming||!pendingQueue)return;
  const q=pendingQueue;pendingQueue=null;
  msgInput.value=q.text||'';
  pendingImages=q.images||[];
  if(!!q.imgMode!==imgMode){   // 還原排隊當下的圖片模式（排隊期間使用者可能切換過）
    imgMode=!!q.imgMode;
    const b=document.getElementById('btnImgMode');
    if(b)b.classList.toggle('active',imgMode);
    updateImgModeHint();
  }
  renderAttachBar();
  updateSendButton();
  sendMessage();
}

// 輸入框自動調整高度；只要內容裝得下（未達 150px 捲動上限）就垂直置中，達上限後維持頂部對齊捲動
const msgInput=document.getElementById('msgInput');
// 隱藏量測用 textarea：量 placeholder 折行後的實際高度（同寬、同字體、同 padding）
let phMeter=null;
function measureNaturalH(text){
  if(!phMeter){
    phMeter=document.createElement('textarea');
    phMeter.setAttribute('readonly','');
    phMeter.rows=1;
    phMeter.style.position='absolute';
    phMeter.style.visibility='hidden';
    phMeter.style.left='-9999px';
    phMeter.style.top='0';
    phMeter.style.resize='none';
    phMeter.style.overflow='hidden';
    document.body.appendChild(phMeter);
  }
  const cs=getComputedStyle(msgInput),s=phMeter.style;
  s.width=msgInput.clientWidth+'px';
  s.boxSizing='border-box';
  s.border='0';
  s.padding=cs.padding;
  s.fontStyle=cs.fontStyle;s.fontWeight=cs.fontWeight;s.fontSize=cs.fontSize;
  s.lineHeight=cs.lineHeight;s.fontFamily=cs.fontFamily;s.letterSpacing=cs.letterSpacing;
  phMeter.value=text||' ';
  return phMeter.scrollHeight;
}
function layoutMsgInput(){
  msgInput.style.paddingTop='';msgInput.style.paddingBottom=''; // 先還原置中，避免污染量測
  msgInput.style.height='auto';
  msgInput.style.minHeight='0';                        // 暫時解除 min-height，量出內容自然高度
  let natural=msgInput.scrollHeight;                   // 內容自然高度（含上下 padding）
  // 空值時改量 placeholder（圖生圖提示文字在手機會折行，框要夠高才不會被切到）
  if(!msgInput.value){
    const ph=measureNaturalH(msgInput.getAttribute('placeholder')||'');
    if(ph>natural)natural=ph;
  }
  msgInput.style.minHeight='';
  msgInput.style.height=Math.min(natural,150)+'px';    // 長高邏輯與原本相同（上限 150px）
  // 有留白就上下均分 → 任何行數都垂直置中；達上限（捲動狀態）時 slack<=0，維持頂部對齊
  const slack=msgInput.clientHeight-natural;
  if(slack>0){
    const base=parseFloat(getComputedStyle(msgInput).paddingTop)||12;
    msgInput.style.paddingTop=(base+slack/2)+'px';
    msgInput.style.paddingBottom=(base+slack/2)+'px';
    msgInput.scrollTop=0;
  }
}

// ===== 草稿自動保存（重整／當機／切換對話都不丟輸入內容）=====
// 以對話 id 為鍵存在 localStorage；未選定對話時用 '__new__'。
// 只存文字與附件 id（圖片本體在 IndexedDB），因此體積極小。
const DRAFT_KEY='chatcat_drafts';
let drafts=loadDrafts();
let draftTimer=null;
function loadDrafts(){
  try{const o=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}}catch(e){return {}}
}
function saveDrafts(){
  try{
    const keys=Object.keys(drafts);
    if(keys.length>CONFIG.draft.maxDrafts){   // 超出上限：淘汰最久沒動的
      keys.sort((a,b)=>(drafts[a].t||0)-(drafts[b].t||0));
      keys.slice(0,keys.length-CONFIG.draft.maxDrafts).forEach(k=>delete drafts[k]);
    }
    localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));
  }catch(e){}
}
function draftKey(id){return id||activeChatId||'__new__'}
function saveDraft(id){
  const k=draftKey(id);
  const text=msgInput?msgInput.value:'';
  const images=pendingImages.map(p=>p.id);
  if(!text&&!images.length){   // 空草稿不留痕跡
    if(drafts[k]){delete drafts[k];saveDrafts()}
    return;
  }
  drafts[k]={text:text,images:images,imgMode:!!imgMode,t:Date.now()};
  saveDrafts();
}
function scheduleDraft(){
  if(draftTimer)clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{draftTimer=null;saveDraft()},CONFIG.draft.debounceMs);
}
// 切換對話時把還原：文字直接回填，附件只還原 IndexedDB 裡還存在的 id
async function applyDraft(id){
  const d=drafts[draftKey(id)];
  clearPendingImages();
  if(!d){
    if(msgInput&&msgInput.value)msgInput.value='';
    return false;
  }
  if(msgInput)msgInput.value=d.text||'';
  if(!!d.imgMode!==imgMode){
    imgMode=!!d.imgMode;
    const b=document.getElementById('btnImgMode');
    if(b)b.classList.toggle('active',imgMode);
  }
  const restored=[];
  for(const mid of (d.images||[])){
    try{
      const data=await mediaGet(mid);
      if(data!=null)restored.push({id:mid,url:previewUrlFor(data)});
    }catch(e){}
  }
  pendingImages=restored;
  renderAttachBar();
  updateImgModeHint();
  if(msgInput){layoutMsgInput();updateSendButton()}
  return true;
}

// 在游標處插入換行（舊寫法 value+='\n' 永遠插在尾端，游標在中間斷行時會被搬到最後）
// 有選取時取代選取範圍；插入後游標停在換行之後。
function insertNewlineAtCaret(ta){
  ta.focus();
  const v=ta.value;
  const s=(ta.selectionStart==null)?v.length:ta.selectionStart;
  const e=(ta.selectionEnd==null)?s:ta.selectionEnd;
  let ok=false;
  try{
    ta.setSelectionRange(s,e);
    // execCommand 會觸發原生 input 事件且保留復原堆疊（Android IME 相容較好）；已廢棄但仍廣泛支援
    ok=document.execCommand('insertText',false,'\n');
  }catch(err){ok=false}
  if(!ok){   // 後備：手動切字串（execCommand 被停用或失敗時）
    ta.value=v.slice(0,s)+'\n'+v.slice(e);
    const p=s+1;
    try{ta.setSelectionRange(p,p)}catch(err){}
    ta.dispatchEvent(new Event('input'));
  }
}
msgInput.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.isComposing||e.keyCode===229)return;   // IME 組字中（注音／倉頡等）：Enter 是選字鍵，交給輸入法
  // 觸控為主的裝置（手機／平板）：Enter 換行、Shift+Enter 送出；有滑鼠／實體鍵盤的環境維持 Enter 送出。
  // 舊判定用 navigator.maxTouchPoints>0，會把「觸控螢幕筆電」也當成手機（Enter 永遠送不出去）。
  const touchPrimary=window.matchMedia
    ?window.matchMedia('(hover:none) and (pointer:coarse)').matches
    :(navigator.maxTouchPoints>0);
  // 送出鍵可切換（設定 → 送出鍵）：auto＝依裝置自動、enter＝Enter 送出、ctrlenter＝Ctrl/Cmd+Enter 送出
  const keyMode=settings.sendKey||'auto';
  if(keyMode==='ctrlenter'){
    if(e.ctrlKey||e.metaKey){e.preventDefault();sendMessage()}
    return;   // Enter 維持原生換行
  }
  if(touchPrimary&&keyMode!=='enter'){
    if(e.shiftKey){e.preventDefault();sendMessage()}
    else{e.preventDefault();insertNewlineAtCaret(msgInput)}
  }else{
    if(!e.shiftKey){e.preventDefault();sendMessage()}
  }
});

// 加入圖片附件（檔案選擇／拖放／貼上三條路徑共用）
// 存進 IndexedDB 的是 Blob（不再整份轉成 dataURL 字串），預覽改用 objectURL，送出前才轉 dataURL。
// 同一張圖重複加入會命中內容去重，沿用既有 id，不會在圖庫裡多存一份。
async function addImageFiles(files){
  const list=[...(files||[])].filter(f=>f&&f.type&&f.type.indexOf('image/')===0);
  if(!list.length)return 0;
  let n=0;
  for(const f of list){
    if(pendingImages.length>=8){showToast('一次最多附加 8 張圖片','warn');break}
    try{
      let data;
      if(f.type==='image/gif'||f.size<300*1024){
        data=f;   // B3：小檔或 GIF（動圖轉 JPEG 會失去動畫）直接原樣保存
      }else{
        data=(await compressToJpeg(f,{maxEdge:1024,quality:0.85})).data;
      }
      const id=await mediaPutDedup(data,'u');   // 存進 IndexedDB，歷史只留 image_ref，不撐爆 localStorage
      pendingImages.push({id,url:previewUrlFor(data)});
      n++;
      renderAttachBar();
    }catch(err){
      showToast('圖片讀取失敗：'+(f.name||''),'warn');
    }
  }
  if(n)scheduleDraft();
  return n;
}

// B3：通用 JPEG 壓縮核心（附件上傳與 Gallery 壓縮共用）
// source：File / Blob / dataURL 字串；opt.maxEdge 限制長邊（0＝維持原尺寸）；opt.quality 預設 0.85
// 回傳 {data:Blob,width,height}；透明處鋪白底（JPEG 無透明）
function compressToJpeg(source,opt){
  opt=opt||{};
  const quality=opt.quality||0.85,maxEdge=opt.maxEdge||0;
  return new Promise((resolve,reject)=>{
    const isStr=typeof source==='string';
    const srcUrl=isStr?source:URL.createObjectURL(source);
    const cleanup=()=>{if(!isStr){try{URL.revokeObjectURL(srcUrl)}catch(e){}}};
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(maxEdge&&w>maxEdge&&h>maxEdge){
          const s=Math.min(maxEdge/w,maxEdge/h);
          w=Math.round(w*s);h=Math.round(h*s);
        }
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        cv.toBlob(blob=>{
          cleanup();
          if(blob)resolve({data:blob,width:w,height:h});
          else reject(new Error('瀏覽器不支援 canvas 轉檔'));
        },'image/jpeg',quality);
      }catch(e){cleanup();reject(e)}
    };
    img.onerror=()=>{cleanup();reject(new Error('圖片讀取失敗'))};
    img.src=srcUrl;
  });
}

// 設定面板不採用「點面板外關閉」（有取消按鈕，避免誤觸）；僅由取消／儲存／ESC 關閉

// ===== 捲動輔助（單一真相來源：應不應該自動捲，一律問 shouldAutoScroll）=====
// shouldAutoScroll：在「自動捲動訊息」開啟 且 使用者仍貼底（stickBottom）時才回 true。
// scrollToBottom 內部不再自己檢查開關，呼叫端一律先問 shouldAutoScroll() 再決定，
// 避免「外層問一次、內層又問一次、還有 force 繞過」三種語意互相打架。
function shouldAutoScroll(){return getAutoScroll()&&stickBottom}
// scrollToBottom：捲到底部。用雙 RAF 等 layout 完成後再 scroll，確保圖片非同步載入後仍能正確捲到最新位置。
// force=true → 無條件捲，給「使用者手動點擊 ↓ 按鈕」這類必須執行的場景用；其餘一律先問 shouldAutoScroll()。
function scrollToBottom(smooth,force){
  if(!force&&!shouldAutoScroll())return;
  stickBottom=true;   // 程式觸發的捲動（自動跟隨／完成／手動回到底）：回到貼底狀態
  const doScroll=()=>{
    messagesEl.scrollTo({
      top:messagesEl.scrollHeight-messagesEl.clientHeight,
      behavior:smooth?'smooth':'auto'
    });
    updateScrollBtn();
  };
  if(smooth){doScroll();return}   // 手動平滑回到底：立即執行才有動畫感，不等 RAF
  requestAnimationFrame(()=>{
    requestAnimationFrame(doScroll);
  });
}
// scrollToLatestStart：捲到「最後一則訊息的開頭」（長回覆完成時用，從頭開始讀）。
// force 語意同 scrollToBottom；短回覆（一屏能看完）會退化成捲到底，避免底部留白。
function scrollToLatestStart(smooth,force){
  if(!force&&!shouldAutoScroll())return;
  stickBottom=true;
  const doScroll=()=>{
    try{
      const rows=messagesEl.querySelectorAll('.msg-row');
      const last=rows.length?rows[rows.length-1]:null;
      if(last&&last.offsetHeight>messagesEl.clientHeight*1.5)last.scrollIntoView({block:'start',behavior:smooth?'smooth':'auto'});
      else messagesEl.scrollTo({top:messagesEl.scrollHeight-messagesEl.clientHeight,behavior:smooth?'smooth':'auto'});
    }catch(e){try{messagesEl.scrollTop=messagesEl.scrollHeight}catch(_){}}
    updateScrollBtn();
  };
  if(smooth){doScroll();return}
  requestAnimationFrame(()=>{requestAnimationFrame(doScroll)});   // 雙 RAF：等最終排版完成再定位，避免開頭量錯
}
// stickBottom：使用者是否「貼在最新訊息」。新訊息（AI 回覆／生圖完成／送出訊息）時設 true；
// 使用者主動往上捲（滾輪／觸控）設 false，之後串流與圖片載入就不再拉動畫面。
// 注意：送出訊息／完成／圖片載入跟上時不要直接 stickBottom=true，
// 先問 shouldAutoScroll() 再決定，避免「使用者已往上捲卻被強制拉回」的打架。
let stickBottom=true;
// 使用者手勢離開底部：停止自動跟隨（scroll 事件會被程式式捲動觸發，故只攔 wheel/touch）
messagesEl.addEventListener('wheel',()=>{stickBottom=false},{passive:true});
messagesEl.addEventListener('touchmove',()=>{stickBottom=false},{passive:true});
// 自動捲動開啟且仍貼底時跟到最新

    const wasOpen=dd.classList.contains('open');
    closeAllMenus();
    if(!wasOpen){
      dd.classList.add('open');
      menuBtn.closest('.msg-row').classList.add('menu-open');
      positionDropdown(menuBtn.closest('.msg-row'));   // 下方空間不足時改向上展開
    }
    return;
  }
  // C6：繼續生成（finish_reason=length 被截斷的訊息；按鈕不在 ⋮ 選單內，需先於 dropdown 判斷）
  const contBtn=e.target.closest('.continue-btn');
  if(contBtn){
    if(isStreaming)return;
    const chatC=chats[activeChatId];
    const rowC=contBtn.closest('.msg-row');
    const mC=chatC&&rowC?chatC.messages[parseInt(rowC.dataset.idx,10)]:null;
    if(!mC)return;
    mC.truncated=false;
    saveChatsData(chats);
    contBtn.remove();   // 只移除「繼續生成」按鈕本身，不重建訊息區（畫面不跑動）
    followIfStuck();   // 續寫模式
    requestAI({continueHint:'從上次中斷處繼續，直接接續輸出剩餘內容，不要重複已輸出的部分。'});
    return;
  }
  // 三之1：點擊氣泡下方的 🔍 時間徽章 → 開啟搜尋來源面板（不在 ⋮ 選單內，需先於 dropdown 判斷）
  const srcBadge=e.target.closest('.msg-time[data-act="sources"]');
  if(srcBadge){
    const chatS=chats[activeChatId];
    const rowS=srcBadge.closest('.msg-row');
    const mS=chatS&&rowS?chatS.messages[parseInt(rowS.dataset.idx,10)]:null;
    if(mS&&Array.isArray(mS.sources)&&mS.sources.length)showSourcesModal(mS);
    else showToast('這一則沒有記錄到搜尋來源（可能是改版前的舊訊息）','warn');
    return;
  }
  const btn=e.target.closest('.msg-dropdown [data-act]');
  if(!btn)return;
  closeAllMenus();
  const row=btn.closest('.msg-row');
  const chat=chats[activeChatId];
  if(!row||!chat)return;
  const act=btn.dataset.act;
  if(isStreaming&&act!=='copy'&&act!=='saveimg'&&act!=='sources'&&act!=='bookmark'&&act!=='speak')return;
  const idx=parseInt(row.dataset.idx,10);
  const m=chat.messages[idx];
  if(!m)return;
  if(act==='sources'){   // 三之1：選單「🔗 查看來源」
    if(Array.isArray(m.sources)&&m.sources.length)showSourcesModal(m);
    else showToast('這一則沒有記錄到搜尋來源','warn');
  }else if(act==='copy'){
    copyToClipboard(contentText(m)).then(ok=>showToast(ok?'已複製':'複製失敗',ok?'success':'warn'));
  }else if(act==='copyconv'){
    // 轉格式複製：\(..\)/\[..\] → $..$/$$..$$，貼到其他地方可直接使用
    copyToClipboard(convertCopyText(contentText(m))).then(ok=>showToast(ok?'已複製':'複製失敗',ok?'success':'warn'));
  }else if(act==='saveimg'){
    saveMessageImages(m);
  }else if(act==='edit'){
    // 「編輯並重送」：該則之後還有對話 → 先彈出確認（覆寫並重送／另開對話分支／取消）；否則維持原行為
    const subCount=chat.messages.length-1-idx;
    if(subCount>0)openEditConfirm(idx,m,chat);
    else editPutBack(idx,m,chat);
  }else if(act==='regen'){
    // 移除該則回應之後的內容，重新請求
    const removed=chat.messages.splice(idx);
    delMediaIds(removed.flatMap(collectMsgImageIds));   // A1：被移除訊息內的圖片一併從 IndexedDB 刪除
    saveChatsData(chats);
    removeMessageRowsFrom(idx);   // 只移除尾端列，捲動位置不變
    followIfStuck();   // regen：僅在自動捲動開啟且貼底時跟上
    if(chat.messages.length&&chat.messages[chat.messages.length-1].role==='user'){
      const last=chat.messages[chat.messages.length-1];
      // 被重新生成的是圖片訊息（含 image_ref）→ 改呼叫圖片模型，用最後一則使用者訊息重建 prompt 與參考圖
      const wasImage=Array.isArray(m.content)&&m.content.some(p=>p.type==='image_ref');
      if(wasImage){
        const parts=Array.isArray(last.content)?last.content:[{type:'text',text:String(last.content||'')}];
        const prompt=parts.filter(p=>p.type==='text'&&p.text).map(p=>p.text).join('\n').trim();
        const refIds=parts.filter(p=>p.type==='image_ref'&&p.id).map(p=>p.id);
        const images=[];
        for(const rid of refIds){
          const data=await mediaGet(rid);
          if(data!=null)images.push(typeof data==='string'?data:await blobToDataURL(data));
        }
        requestImage({prompt,images});
      }else if(m.searchQuery){
        // 有搜尋標記的回答：沿用原查詢字串重新搜尋後生成（不需改寫與確認）
        await regenWithSearch(m.searchQuery);
      }else requestAI();
    }
  }else if(act==='bookmark'){
    // 書籤：切換該則的收藏狀態（只動 class，不重建訊息區）
    m.bm=!m.bm;
    row.classList.toggle('bm',!!m.bm);
    const bmBtnEl=btn;
    if(bmBtnEl)bmBtnEl.textContent=m.bm?'🔖 移除書籤':'🔖 加入書籤';
    saveChatsData(chats,activeChatId);
    if(bookmarkModalOpen)renderBookmarkList();   // 面板開著時即時更新
    showToast(m.bm?'已加入書籤':'已移除書籤',m.bm?'success':undefined);
  }else if(act==='speak'){
    toggleSpeak(m);
  }else if(act==='delmsg'){
    // C4：刪除單則訊息（串流中已被上方 guard 阻擋）
    if(!await showConfirm('確定要刪除這則訊息嗎？'))return;
    chat.messages.splice(idx,1);   // 先從陣列移除，再清圖：delMediaIds 才不會誤判「仍被本則引用」而留下孤兒圖
    await delMediaIds(collectMsgImageIds(m));   // A1：訊息內圖片一併從 IndexedDB 刪除（有別則引用則保留）
    saveChatsData(chats);
    // 不重建整個訊息區：只移除該列 DOM 並重編 data-idx，捲動位置完全不變（其餘訊息自然上移補位）
    removeMessageRow(idx);
    showToast('已刪除訊息','success');
  }else if(act==='editimg'){
    // 將 AI 生成的圖片設為圖生圖參考圖：複製一份新媒體記錄，避免日後刪除任一訊息時互相誤刪
    const part=Array.isArray(m.content)?m.content.find(p=>p.type==='image_ref'&&p.id):null;
    if(!part)return;
    if(pendingImages.length>=4){showToast('參考圖最多 4 張（可從不同訊息各選一張合成），已達上限','warn');return}   // D9
    const data=await mediaGet(part.id);
    if(data==null){showToast('圖片資料已不存在（可能已被刪除）','warn');return}
    // 內容去重：同一張圖重複「修改圖片」時直接沿用既有 id，
    // 圖庫不會再多出一份一模一樣的檔案（舊版每次修改都複製一份，改十次就十份）
    let nid;
    try{nid=await mediaPutDedup(data,'e')}catch(e){showToast('圖片讀取失敗','warn');return}
    pendingImages.push({id:nid,url:previewUrlFor(data)});
    if(!imgMode){
      imgMode=true;   // 修改圖片需在圖片模式下送出，自動開啟
      const b=document.getElementById('btnImgMode');
      if(b)b.classList.add('active');
      showToast('已自動切換到圖片模式（🎨）','success');
    }
    renderAttachBar();   // 內部會 updateImgModeHint 更新輸入框提示
    scheduleDraft();
    showToast('已加入為參考圖（共 '+pendingImages.length+' 張，可從其他訊息再加），請輸入要修改的內容描述','success');
    msgInput.focus();
  }
});
// 點擊選單以外區域時收起所有選單
document.addEventListener('click',e=>{
  if(!e.target.closest('.msg-menu-wrap'))closeAllMenus();
});

// 手機長按氣泡（480ms）直接開啟選單；滑動即取消
let lpTimer=null;
// 開啟訊息選單時檢查：若向下展開會超出對話區下緣（被輸入列裁切），改加上 .up 向上展開
function positionDropdown(row){
  if(!row)return;
  const dd=row.querySelector('.msg-dropdown');
  if(!dd)return;
  // 清掉可能殘留的觸控定位內聯樣式，避免影響 PC 端 .up 邏輯
  dd.style.left=dd.style.top=dd.style.right=dd.style.bottom='';
  dd.classList.remove('up');
  const cr=messagesEl.getBoundingClientRect();
  const dr=dd.getBoundingClientRect();
  if(dr.bottom>cr.bottom-4)dd.classList.add('up');
  // PC 端水平夾限：使用者訊息氣泡靠右（或視窗較窄）時，絕對定位的選單可能被擠出
  // 視窗／訊息區的左右緣而看不到（觸控裝置走 openRowMenu 的 position:fixed 夾限，不會有此問題）。
  // 量測實際渲染位置，超出時以「相對定位父層（.msg-menu-wrap）」的內聯 left 拉回畫面內。
  const leftBound=Math.max(6,cr.left+2), rightBound=Math.min(window.innerWidth-6,cr.right-2);
  let shift=0;
  if(dr.right>rightBound)shift=rightBound-dr.right;        // 超出右緣：往左拉
  else if(dr.left<leftBound)shift=leftBound-dr.left;       // 超出左緣：往右推
  if(shift&&dd.offsetParent){
    const base=dd.offsetParent.getBoundingClientRect();
    dd.style.right='auto';   // left 與 right 並存會把元素撐開，先清掉 right 改純 left 定位
    dd.style.left=Math.round(dr.left+shift-base.left)+'px';
  }
}
function openRowMenu(row,x,y){
  closeAllMenus();
  const dd=row.querySelector('.msg-dropdown');
  if(!dd)return;
  dd.classList.remove('up','touch');
  dd.style.left=dd.style.top=dd.style.right=dd.style.bottom='';
  if(typeof x==='number'&&typeof y==='number'&&window.matchMedia('(hover: none)').matches){
    // 觸控長按：依長按座標（viewport）以 position:fixed 顯示，固定寬度 200px（CSS 已設 max-width）
    dd.classList.add('touch');
    dd.classList.add('open');
    row.classList.add('menu-open');
    const w=200;   // 與 CSS .msg-dropdown.touch width 一致；用固定值避免 offsetWidth 受渲染影響造成抖動
    const h=dd.offsetHeight||200;
    let left=Math.min(Math.max(6,x-w/2),window.innerWidth-w-6);
    let top=y+12;
    if(top+h>window.innerHeight-10)top=Math.max(10,y-h-12);   // 下方空間不足：翻到長按點上方
    dd.style.left=left+'px';
    dd.style.top=top+'px';
  }else{
    dd.classList.add('open');
    row.classList.add('menu-open');
    positionDropdown(row);   // PC 端：點 ⋮ 鈕，維持原 .up 向上邏輯
  }
  if(navigator.vibrate){try{navigator.vibrate(15)}catch(e){}}
}
messagesEl.addEventListener('touchstart',e=>{
  const row=e.target.closest('.msg-row');
  if(!row||!row.querySelector('.msg-dropdown'))return;
  row.classList.add('pressing');
  const t=e.touches[0];
  const lx=t?t.clientX:0, ly=t?t.clientY:0;   // 記住長按座標，開選單時貼近該處顯示
  lpTimer=setTimeout(()=>openRowMenu(row,lx,ly),480);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>messagesEl.addEventListener(ev,()=>{
  clearTimeout(lpTimer);
  document.querySelectorAll('.msg-row.pressing').forEach(r=>r.classList.remove('pressing'));
},{passive:true}));
// 觸控裝置上阻擋長按時的瀏覽器原生選單，讓自訂選單接管
messagesEl.addEventListener('contextmenu',e=>{
  if(e.target.closest('.msg-row .msg')&&window.matchMedia('(hover: none)').matches)e.preventDefault();
});
// 側邊欄：同樣阻擋長按原生選單／反白干擾（重新命名輸入框除外，仍需原生複製貼上）
document.getElementById('sidebar').addEventListener('contextmenu',e=>{
  if(!window.matchMedia('(hover: none)').matches)return;
  if(e.target.closest('input,textarea'))return;
  e.preventDefault();
});

// ===== C-edit：編輯並重送確認 + 另開對話分支 =====
// 將訊息內容放回輸入框，並移除該則之後的所有訊息（原「編輯並重送」行為）
function editPutBack(idx,m,chat){
  msgInput.value=contentText(m);
  const removed=chat.messages.splice(idx);
  delMediaIds(removed.flatMap(collectMsgImageIds));   // A1：被移除訊息內的圖片一併從 IndexedDB 刪除
  saveChatsData(chats);
  removeMessageRowsFrom(idx);   // A7：標題不變，只移除尾端列，捲動位置不變
  msgInput.dispatchEvent(new Event('input'));
  msgInput.focus();
}
// 另開對話分支：複製該則「之前」的所有訊息到新對話（不附額外模型上下文，訊息本身即上下文），
// 並把被按的訊息內容帶入新對話輸入框供編輯後重送；原對話完全不受影響
function branchChat(idx,m,chat){
  const id='chat_'+Date.now();
  const copy=JSON.parse(JSON.stringify(chat.messages.slice(0,idx)));
  chats[id]={id,title:(chat.title||'新對話')+'（分支）',messages:copy,createdAt:Date.now(),updatedAt:Date.now()};
  saveChatsData(chats);
  setActiveChat(id);
  msgInput.value=contentText(m);
  msgInput.dispatchEvent(new Event('input'));
  msgInput.focus();
  showToast('已另開對話分支，原對話保留','success');
}
let editCtx=null;
function openEditConfirm(idx,m,chat){
  editCtx={idx,m,chat};
  document.getElementById('editBranchMsg').textContent='此訊息之後還有 '+(chat.messages.length-1-idx)+' 則對話。選擇「覆寫並重送」會刪除其後所有對話；或「另開對話分支」在原對話之外另開一條新對話繼續。';
  document.getElementById('editBranchModal').classList.add('open');
  histPush('editBranch');   // 推入一筆歷史狀態：手機返回鍵／返回手勢觸發 popstate 時關編輯確認，而不是離開頁面
}
function closeEditConfirm(){
  const m=document.getElementById('editBranchModal');
  if(!m.classList.contains('open'))return;   // 已關閉就不再退歷史（避免連退兩層）
  m.classList.remove('open');
  editCtx=null;
  histPop('editBranch');   // 用按鈕／背景／Esc 關閉時同步退掉推入的狀態
}
document.getElementById('editOverwrite').addEventListener('click',()=>{const c=editCtx;closeEditConfirm();if(c)editPutBack(c.idx,c.m,c.chat)});
document.getElementById('editBranch').addEventListener('click',()=>{const c=editCtx;closeEditConfirm();if(c)branchChat(c.idx,c.m,c.chat)});
document.getElementById('editCancel').addEventListener('click',closeEditConfirm);
document.getElementById('editBranchModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditConfirm()});

// ===== C1：圖片燈箱（點擊 .msg-img 放大；滾輪/雙擊縮放；✕/🗑️/💾/背景/Esc；左右切換：PC 拖曳＋邊緣箭頭、手機滑動）=====
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbPrev=document.getElementById('lbPrev');
const lbNext=document.getElementById('lbNext');
let lbScale=1,lbTx=0,lbTy=0,lbDrag=null,lbSwipe=null,lbMediaId=null,lbSrc=null;
let lbObjUrl=null;   // A4：lbShow 建立的 objectURL（離開燈箱或切換時釋放，避免累積）
let lbList=[],lbPos=-1;   // 燈箱左右切換：目前情境可瀏覽的圖片 id 清單與位置
function lbApply(){
  lbImg.style.transform='translate('+lbTx+'px,'+lbTy+'px) scale('+lbScale+')';
  updateLbNav();
}
// 邊緣箭頭：一般不顯示；有前/後一張可切換且未放大時，游標靠近左右緣才顯示
function updateLbNav(){
  const on=lbScale<=1&&lbList.length>1;
  lbPrev.classList.toggle('avail',on&&lbPos>0);
  lbNext.classList.toggle('avail',on&&lbPos>=0&&lbPos<lbList.length-1);
}
// 依開啟來源建立切換清單：Gallery 開啟 → 全部圖片（照圖庫排序）；訊息開啟 → 目前對話的圖片順序
function lbBuildList(currentId){
  lbList=[];lbPos=-1;
  if(!currentId)return;
  let ids=[];
  if(document.getElementById('galleryModal').classList.contains('open')&&galleryIds.length){
    ids=galleryIds.slice();
  }else{
    const chat=chats[activeChatId];
    if(chat)chat.messages.forEach(m=>{
      if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id&&!ids.includes(p.id))ids.push(p.id)});
    });
  }
  const i=ids.indexOf(currentId);
  if(i>=0){lbList=ids;lbPos=i}
  else{lbList=[currentId];lbPos=0}
}
async function lbShow(id){
  const data=await mediaGet(id);
  if(data==null){showToast('圖片資料已不存在','warn');return}
  lbMediaId=id;
  if(lbObjUrl){try{URL.revokeObjectURL(lbObjUrl)}catch(e){}lbObjUrl=null}   // A4：釋放上一張
  lbSrc=(typeof data==='string')?data:(lbObjUrl=URL.createObjectURL(data));
  lbScale=1;lbTx=0;lbTy=0;
  lbImg.src=lbSrc;
  lbApply();
}
function lbNav(dir){
  const np=lbPos+dir;
  if(np<0||np>=lbList.length)return;
  lbPos=np;
  lbShow(lbList[lbPos]);
}
function openLightbox(src,mediaId){
  if(!src)return;
  lbSrc=src;lbMediaId=mediaId||null;
  lbBuildList(lbMediaId);
  lbScale=1;lbTx=0;lbTy=0;lbApply();
  lbImg.src=src;
  lightbox.classList.add('open');
  histPush('lightbox');   // 推入一筆歷史狀態：手機返回鍵／返回手勢觸發 popstate 時關燈箱，而不是離開頁面
}
function lbHide(){   // 燈箱 UI 收起與狀態清理（不含歷史堆疊處理）
  lightbox.classList.remove('open');
  if(lbObjUrl){try{URL.revokeObjectURL(lbObjUrl)}catch(e){}lbObjUrl=null}   // A4：釋放燈箱自建的 objectURL
  lbImg.src='';lbSrc=null;lbMediaId=null;lbList=[];lbPos=-1;lbDrag=null;lbSwipe=null;
}
function closeLightbox(){
  if(!lightbox.classList.contains('open'))return;
  lbHide();
  histPop('lightbox');   // 用 ✕／背景／Esc 關閉時同步退掉推入的狀態（popstate 端旗標已清，不會重複關閉）
}
// 手機返回鍵／返回手勢：popstate 時依「彈回後」的 state 決定關哪一層
// （堆疊例：頁面→圖片庫→燈箱→確認框；每按一次返回只關最上層）
window.addEventListener('popstate',e=>{
  const st=e.state||{};
  // R3：單一分派表——依註冊順序（＝堆疊由深到淺的慣例）找出旗標仍掛著、且彈回後
  // 的 state 不是該層的第一個彈出層，由返回鍵關閉它（histPop 傳 skipBack=true）。
  const onPop={
    confirm(){
      const cm=document.getElementById('confirmModal');
      if(cm.classList.contains('open'))document.getElementById('confirmNo').click();   // 視同按「取消」
    },
    sources(){closeSourcesModal(true)},   // 三之1：搜尋來源面板
    lightbox(){
      if(lightbox.classList.contains('open'))lbHide();   // 關燈箱、留在原頁（圖片庫若開著則保持）
    },
    gallery(){
      const gm=document.getElementById('galleryModal');
      if(gm.classList.contains('open')){
        gm.classList.remove('open');
        setGallerySelectMode(false);   // 與 closeGallery 相同的收尾（不再 pop 歷史，避免連退兩層）
      }
    },
    settings(){
      const sm=document.getElementById('settingsModal');
      if(sm.classList.contains('open')){
        sm.classList.remove('open');
        applyTheme();   // 與 closeSettings 相同的收尾（不再 pop 歷史，避免連退兩層）
      }
    },
    personaName(){   // 自訂人格命名／重命名彈窗：視同按「取消」（走 done(null) 讓 await 正常結束）
      document.getElementById('personaNameNo').click();
    },
    bmRename(){   // 書籤重新命名彈窗：視同按「取消」（走 done(null) 讓 await 正常結束），書籤清單保留
      document.getElementById('bookmarkRenameNo').click();
    },
    export(){
      const em=document.getElementById('exportModal');
      if(em.classList.contains('open'))em.classList.remove('open');   // 與 closeExportModal 相同的收尾
    },

// ===== 手機側邊欄滑動手勢（max-width:768px）=====
// 兩側面板關閉時：左緣右滑＝把對話歷史側邊欄「拉出來」（跟手拖曳）。
// 側邊欄開啟時：畫面任何位置左滑＝把它「推回去」（跟手拖曳）。
// （圖片庫不做滑動手勢：置中彈窗與跟手拖曳不搭，維持原版按鈕／背景點擊開關）
const edgeSidebar=document.getElementById('sidebar');
const edgeMq=window.matchMedia('(max-width:768px)');
let edgeGesture=null;   // {type:'sidebarOpen'|'sidebarClose', sx,sy, engaged, progress, t0, v, lx, lt}
function edgeGestureAllowed(){
  if(!edgeMq.matches)return false;
  if(document.getElementById('lightbox').classList.contains('open'))return false;   // 燈箱有自己的滑動切圖手勢
  for(const m of document.querySelectorAll('.modal-overlay.open'))return false;   // 任何彈窗開啟時不做手勢
  return true;
}
document.addEventListener('touchstart',e=>{
  edgeGesture=null;
  if(e.touches.length!==1||!edgeGestureAllowed())return;
  // 按鈕／輸入框／可橫向捲動的表格與程式碼區塊上不啟動手勢（避免干擾點擊與橫向捲動）
  if(e.target.closest&&e.target.closest('button,a,input,textarea,select,.msg table,pre'))return;
  const t=e.touches[0];
  if(edgeSidebar.classList.contains('open')){
    // 側邊欄開啟：任何位置（面板上或面板外）左滑都能推回去（跟手）
    edgeGesture={type:'sidebarClose',sx:t.clientX,sy:t.clientY,engaged:false,progress:0,t0:e.timeStamp};
  }else if(t.clientX<=240){
    edgeGesture={type:'sidebarOpen',sx:t.clientX,sy:t.clientY,engaged:false,progress:0,t0:e.timeStamp};
  }
},{passive:true});
document.addEventListener('touchmove',e=>{
  const g=edgeGesture;
  if(!g)return;
  const t=e.touches[0];
  const dx=t.clientX-g.sx,dy=t.clientY-g.sy;
  // 最近速度的加權平滑（給 touchend 判斷輕掃用，比全程平均更能反映放手瞬間的意圖）
  if(g.lx!=null){
    const dtm=Math.max(8,e.timeStamp-g.lt);
    const inst=(t.clientX-g.lx)/dtm;
    g.v=g.v==null?inst:g.v*0.6+inst*0.4;
  }
  g.lx=t.clientX;g.lt=e.timeStamp;
  const horiz=Math.abs(dx)>Math.abs(dy)*1.2;
  if(!g.engaged){
    if(g.type==='sidebarOpen'&&dx>10&&horiz)g.engaged=true;
    else if(g.type==='sidebarClose'&&dx<-10&&horiz)g.engaged=true;
    if(!g.engaged)return;
    edgeSidebar.style.transition='none';   // 拖曳期間關閉動畫，讓面板跟手
  }
  e.preventDefault();   // 已確認是橫向拖曳手勢：防止頁面跟著捲動
  const W=edgeSidebar.offsetWidth||260;
  g.progress=Math.min(Math.max(g.type==='sidebarOpen'?dx:-dx,0),W);
  edgeSidebar.style.transform='translateX('+(g.type==='sidebarOpen'?g.progress-W:-g.progress)+'px)';
},{passive:false});
document.addEventListener('touchend',e=>{
  const g=edgeGesture;
  edgeGesture=null;
  if(!g)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-g.sx,dy=t.clientY-g.sy;
  // 放手瞬間的方向速度（px/ms）：快速輕掃即使位移不長也視為要開／關，避免卡在露出一半
  const dirDx=g.type==='sidebarOpen'?dx:-dx;
  const v=(g.v!=null&&e.timeStamp-g.lt<=120)?g.v:dirDx/Math.max(1,e.timeStamp-g.t0);
  const W=edgeSidebar.offsetWidth||260;
  if(g.engaged){
    const toOpen=g.type==='sidebarOpen'?(g.progress>W/2||v>0.4):!(g.progress>W/2||v>0.4);
    edgeSidebar.style.transition='';   // 交還 CSS 動畫：從目前位置滑到定位（開啟→0、關閉→-100%）
    if(toOpen)edgeSidebar.classList.add('open');else edgeSidebar.classList.remove('open');
    requestAnimationFrame(()=>{edgeSidebar.style.transform=''});
  }else if(dx>60&&Math.abs(dx)>Math.abs(dy)*1.5){   // 快速輕掃（未達拖曳跟手門檻）：直接開啟
    edgeSidebar.classList.add('open');
  }else if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.5){   // 未跟手但已左劃過半：直接關閉
    edgeSidebar.classList.remove('open');
  }
},{passive:true});

function exportStamp(){

  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

// 組匯出 JSON：{app:'ChatCAT',version:1,exportedAt,chats:[...]}
async function buildExportData(list){
  const withImg=document.getElementById('exportWithImages').checked;
  const out=[];
  let total=0,done=0;   // D3：圖片進度
  if(withImg)list.forEach(c=>((c&&c.messages)||[]).forEach(m=>{if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id)total++})}));
  for(const c of list){
    const cc=JSON.parse(JSON.stringify(c));
    for(const m of cc.messages){
      if(!Array.isArray(m.content))continue;
      for(const p of m.content){
        if(p.type==='image_ref'&&p.id){
          if(withImg){
            done++;
            if(total)showProgress('📦 匯出中… '+done+' / '+total+' 張圖片');   // D3
            try{
              const data=await mediaGet(p.id);
              if(data==null)p.missing=true;
              else if(typeof data==='string')p.dataUrl=data;
              else if(data instanceof Blob)p.dataUrl=await blobToDataURL(data);
            }catch(e){p.missing=true}
          }
          // 不含圖時僅保留 id（匯入後需該裝置上已有圖，否則顯示替代）
        }
      }
    }
    out.push(cc);
  }
  return {app:'ChatCAT',version:1,exportedAt:new Date().toISOString(),chats:out};
}
// 三之9：匯出唯讀單檔 HTML（當前對話；markdown 預渲染、思考摺疊、數學走 KaTeX 預渲染、圖片內嵌 dataURL、來源連結）
async function exportToHtml(){
  const c=chats[activeChatId];   // 只匯出當前對話（與 btnExportCurrent / btnExportMd 一致）
  if(!c){showToast('沒有當前對話','warn');return}
  const withImg=document.getElementById('exportWithImages').checked;
  showProgress('📄 正在產生唯讀 HTML');
  let data;
  try{data=await buildExportData([c])}catch(e){hideProgress();showToast('匯出失敗：'+e.message,'warn');return}
  // 建立 mediaId → dataUrl 對照，供後續把 <img data-media-id> 換成內嵌 src
  const mediaMap={};
  if(withImg)data.chats.forEach(cc=>(cc.messages||[]).forEach(m=>{if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id&&p.dataUrl)mediaMap[p.id]=p.dataUrl})}));
  const chatsHtml=data.chats.map(cc=>chatToArticleHtml(cc,mediaMap,withImg)).join('\n');
  hideProgress();
  const html=buildExportHtml(chatsHtml,(c.title||'新對話'));
  downloadBlob(new Blob([html],{type:'text/html;charset=utf-8'}),'ChatCAT_export_'+exportStamp()+'.html');
  showToast('已匯出當前對話唯讀 HTML','success');
}
function chatToArticleHtml(c,mediaMap,withImg){
  const title=escHtml(c.title||'新對話');
  const sub=(c.messages&&c.messages.length)?('（'+c.messages.length+' 則訊息）'):'';
  // 走完整 renderContent + renderMath 流程：把訊息 HTML 灌進 DOM，呼叫 KaTeX 預渲染後再取 innerHTML，
  // 讓匯出檔案直接帶 .katex 結構，無需外部 JS/CSS 即可正確顯示數學
  const tmp=document.createElement('div');
  const msgs=(c.messages||[]).map(m=>{
    tmp.innerHTML=renderContent(m);
    // 匯出時完全移除思考區塊，節省體積（接收者看不到思考過程）
    tmp.querySelectorAll('details.thinking').forEach(d=>d.remove());
    if(withImg){
      tmp.querySelectorAll('img[data-media-id]').forEach(img=>{
        const id=img.getAttribute('data-media-id');
        const du=mediaMap[id];
        if(du){img.setAttribute('src',String(du).replace(/"/g,'&quot;'));img.removeAttribute('data-media-id')}
        else{img.setAttribute('data-missing','1')}
      });
    }
    renderMath(tmp);   // KaTeX 預渲染：把 $..$ / $$..$$ 轉成 .katex DOM
    let h=tmp.innerHTML;
    tmp.innerHTML='';
    const role=m.role==='user'?'user':(m.error?'error':'assistant');
    const who=role==='user'?'🧑 使用者':(role==='error'?'⚠️ 錯誤':'🤖 AI');
    return '<section class="msg '+role+'"><div class="who">'+who+'</div><div class="bubble">'+h+'</div></section>';
  }).join('\n');
  return '<article class="chat"><h2>'+title+'</h2><p class="meta">'+sub+'</p><div class="msgs">'+msgs+'</div></article>';
}
function buildExportHtml(chatsHtml,title){
  // 從 CDN 載入完整 KaTeX CSS：分享場景預設接收者會在線，與原 chat.html 渲染一致；檔案最小、維護簡單。
  // 預渲染流程已在 chatToArticleHtml 內完成（renderMath 將 $..$ / $$..$$ 轉成 .katex DOM），故不需 auto-render JS。
  return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+escHtml(title)+'</title>'
    +'<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">'
    +'<style>'
    +'*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}'
    +'.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}h1{font-size:22px;text-align:center;color:#333;margin:8px 0 24px}'
    +'.chat{background:#fff;border:1px solid #e5e5ea;border-radius:14px;padding:16px 18px;margin:18px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}'
    +'.chat h2{margin:0 0 4px;font-size:18px;color:#111}.chat .meta{margin:0 0 12px;font-size:12px;color:#888}'
    +'.msgs{display:flex;flex-direction:column;gap:14px}.msg{display:flex;flex-direction:column;max-width:88%}'
    +'.msg .who{font-size:12px;color:#999;margin:0 4px 2px}.msg.user{align-self:flex-end;align-items:flex-end}.msg.assistant,.msg.error{align-self:flex-start;align-items:flex-start}'
    +'.bubble{padding:10px 14px;border-radius:14px;font-size:15px;word-break:break-word;overflow-wrap:anywhere}.msg.user .bubble{background:#0b93f6;color:#fff;border-bottom-right-radius:4px}'
    +'.msg.assistant .bubble{background:#eef0f2;color:#1a1a1a;border-bottom-left-radius:4px}.msg.error .bubble{background:#fdecea;color:#b71c1c;border:1px solid #f5c6cb}'
    +'.bubble :first-child{margin-top:0}.bubble :last-child{margin-bottom:0}.bubble pre{background:rgba(0,0,0,.06);padding:10px;border-radius:8px;overflow:auto}'
    +'.msg.user .bubble pre{background:rgba(255,255,255,.18)}.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}'
    +'.bubble img{max-width:100%;border-radius:10px;margin:6px 0;display:block}.bubble a{color:inherit;text-decoration:underline}.msg.user .bubble a{color:#fff}'
    +'details.think{margin:4px 0 8px;font-size:13px;color:#666;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:6px 10px}details.think summary{cursor:pointer;color:#888}'
    +'.src{margin-top:6px;font-size:12px;color:#888}.src a{color:#0b93f6;word-break:break-all}.miss{color:#b71c1c;font-size:13px}'
    // KaTeX 預渲染 → 顯示數學可能過寬；強制水平滾動避免版面破壞（與 chat.html 一致）
    +'.bubble .katex-display{display:block;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.2em 0}'
    +'.bubble .katex-display>.katex{display:inline-block;white-space:nowrap}'
    +'</style></head><body><div class="wrap"><h1>'+escHtml(title)+'</h1>'+chatsHtml+'</div></body></html>';
}

    const data=JSON.parse(await f.text());
    if(!data||data.app!=='ChatCAT'||!Array.isArray(data.chats))throw new Error('格式不符（需 ChatCAT 匯出檔）');
    let imported=0,imgs=0,lastId=null;
    for(const c of data.chats){
      if(!c||!Array.isArray(c.messages))continue;
      const id=(c.id&&!(c.id in chats))?c.id:('chat_'+Date.now()+'_'+Math.random().toString(36).slice(2,6));   // id 衝突以新 id 重取，不覆蓋
      c.id=id;
      for(const m of c.messages){
        delete m.truncated;
        delete m.sources;   // B3：匯入備份裡的來源網址可能早已失效（死鏈），與 truncated 一樣不帶入
        if(!Array.isArray(m.content))continue;
        for(const p of m.content){
          if(p.type==='image_ref'&&p.dataUrl){
            const nid='img_imp_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
            try{await mediaPut(nid,p.dataUrl);p.id=nid;imgs++}catch(e2){}
            delete p.dataUrl;
          }
        }
      }
      chats[id]=ensureChatMeta(c);
      lastId=id;
      imported++;
    }
    if(!imported)throw new Error('檔內沒有可匯入的對話');
    saveChatsData(chats);
    saveChatsDataNow();
    if(lastId)setActiveChat(lastId);   // 匯入後自動切到最後匯入的對話（內部會重繪列表與訊息區）
    else renderChatList();
    showToast('已匯入 '+imported+' 場對話（內嵌圖片 '+imgs+' 張）','success');
    closeExportModal();
  }catch(err){
    showToast('匯入失敗：'+err.message,'warn');
  }
});
// 讀取 IndexedDB 全部 key（清理未引用圖片用）
function mediaAllKeys(){
  return openMediaDB().then(db=>new Promise((res,rej)=>{
    try{
      const rq=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).getAllKeys();
      rq.onsuccess=()=>{db.close();res(rq.result||[])};
      rq.onerror=()=>{db.close();rej(rq.error)};
    }catch(e){db.close();rej(e)}
  }));
}

// ===== 書籤：單則收藏 ＋ 🔖 面板跨對話快速跳轉 =====
let bookmarkModalOpen=false;
function collectBookmarks(){
  const out=[];
  Object.keys(chats).forEach(cid=>{
    const c=chats[cid];
    if(!c||!Array.isArray(c.messages))return;
    c.messages.forEach((m,i)=>{
      if(!m||!m.bm)return;
      // bm 為 true（舊資料）或 {name} 物件（新資料）都視為書籤；自訂名稱只影響書籤顯示，原對話標題不動
      const bmName=(m.bm&&typeof m.bm==='object'&&(m.bm.name||'').trim())||'';
      out.push({chatId:cid,idx:i,m:m,title:bmName||c.title||'新對話',custom:!!bmName});
    });
  });
  out.sort((a,b)=>(b.m.createdAt||0)-(a.m.createdAt||0));   // 新→舊
  return out;
}
// 書籤重新命名共用彈窗：回傳 {name}／null（取消；空白 Enter/確定也視同取消、不修改、不恢復標題）
// 點背景不關閉：避免命名中誤觸關掉；只有取消按鈕、ESC、手機返回鍵能關
function promptBookmarkRename(msg,defaultName){
  return new Promise(resolve=>{
    const modal=document.getElementById('bookmarkRenameModal');
    const input=document.getElementById('bookmarkRenameInput');
    const yes=document.getElementById('bookmarkRenameYes');
    const no=document.getElementById('bookmarkRenameNo');
    document.getElementById('bookmarkRenameMsg').textContent=msg;
    input.value=defaultName||'';
    modal.classList.add('open');
    input.focus();input.select();
    histPush('bmRename');   // 疊在書籤清單上：手機返回鍵關命名框（視同取消），書籤清單保留
    let settled=false;
    const done=v=>{
      if(settled)return;settled=true;
      modal.classList.remove('open');
      histPop('bmRename');   // 同步退掉推入的狀態（popstate 端旗標已清，不會重複關閉）
      yes.removeEventListener('click',onYes);
      no.removeEventListener('click',onNo);
      input.removeEventListener('keydown',onKey);
      resolve(v);
    };
    const onYes=()=>{
      const v=input.value.trim();
      done(v?{name:v.slice(0,30)}:null);   // 空白送出視同取消：不修改、不恢復標題
    };
    const onNo=()=>done(null);
    const onKey=e=>{
      if(e.isComposing)return;   // IME 組字中：Enter 是上字，不能視同「確定」
      if(e.key==='Enter'){e.preventDefault();onYes()}
      else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(null)}
    };
    yes.addEventListener('click',onYes);
    no.addEventListener('click',onNo);
    input.addEventListener('keydown',onKey);
  });
}
async function renameBookmark(chatId,idx){

  if(r==null)return;   // 取消或空白送出：不修改、不恢復標題

// ===== C12：語音輸入（Web Speech API；僅支援的瀏覽器顯示 🎤）=====
(function initVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById('btnMic');
  if(!btn)return;
  btn.classList.add('enabled');  // 修正：原用 style.display='' 清不掉 CSS 的 .btn-mic{display:none}，導致按鈕永遠不出現
  if(!SR){
    // 能力偵測：不支援 Web Speech API 的瀏覽器（如 Firefox）直接隱藏按鈕，
    // 不再留一個按了永遠只會跳提示的 🎤（舊版會一直顯示，佔輸入列空間也誤導）
    btn.style.display='none';
    return;
  }
  let rec=null,listening=false;
  btn.addEventListener('click',()=>{
    if(listening){
      listening=false;
      btn.classList.remove('listening');
      try{rec.stop()}catch(e){}
      return;
    }
    try{rec=new SR()}catch(e){return}
    rec.lang='zh-TW';
    rec.interimResults=true;
    rec.continuous=false;
    listening=true;
    btn.classList.add('listening');
    rec.onresult=ev=>{
      let finalTxt='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)finalTxt+=ev.results[i][0].transcript;
      }
      if(finalTxt){
        msgInput.value=(msgInput.value||'')+finalTxt;   // 結果附加進輸入框
        msgInput.dispatchEvent(new Event('input'));
      }
    };
    rec.onend=()=>{listening=false;btn.classList.remove('listening')};
    rec.onerror=ev=>{
      listening=false;
      btn.classList.remove('listening');
      const why={
        'not-allowed':'語音輸入失敗：麥克風權限被拒絕（請允許麥克風存取）',
        'service-not-allowed':'語音輸入失敗：瀏覽器或系統未允許語音服務',
        'network':'語音輸入失敗：需要網路連線（辨識在雲端進行）',
        'audio-capture':'語音輸入失敗：找不到可用的麥克風',
        'no-speech':'沒有偵測到說話內容',
        'aborted':null
      }[ev.error];
      if(why)showToast(why,'warn');
    };
    try{
      rec.start();
      showToast('語音辨識中…再次點擊 🎤 可停止');
    }catch(e){
      listening=false;
      btn.classList.remove('listening');
    }
  });
})();

// ===== C9：圖片 Gallery（瀏覽所有 IndexedDB 圖片；入口：右上 🖼️）=====
const galleryUrls=new Set();
let galleryIds=[];   // 圖庫目前排序的圖片 id 清單（燈箱左右切換用）
let galleryScrollObs=null;   // C2：縮圖分批載入 observer
let gallerySelectOn=false;   // D5：多選模式
const gallerySelected=new Set();
function openGallery(){
  const gm=document.getElementById('galleryModal');
  // 快取：自上次渲染後若無任何圖片新增／刪除／壓縮，直接重用上次的內容與 blob URL（不必重讀 IndexedDB）
  if(galleryDirty||!document.getElementById('galleryGrid').children.length)renderGalleryGrid();
  else updateGalleryUsage();   // 用量顯示仍然即時
  gm.classList.add('open');
  histPush('gallery');   // 推入一筆歷史狀態：手機返回鍵／返回手勢觸發 popstate 時關圖片庫，而不是離開頁面

function closeGallery(){

  gm.classList.remove('open');
  // 手機返回鍵同步：用 ✕／背景／Esc 關閉時退掉推入的狀態
  // （若燈箱疊在其上，堆疊頂還是燈箱的狀態，退回交給 closeLightbox 處理）
  if(histArmed.gallery&&!document.getElementById('lightbox').classList.contains('open'))histPop('gallery');
  // 不在關閉時釋放 blob URL／清空內容：快取保留，下次開啟秒開；下次開啟時若有變更才重新渲染（屆時才釋放舊 URL）
  setGallerySelectMode(false);   // D5：關閉時退出多選

async function renderGalleryGrid(){
  const myGen=++galleryGen;   // 世代計數：渲染期間若有圖片變更（mediaPut/mediaDel），完成後不誤清髒標記
  // 先釋放上一輪的 blob URL，避免孤兒清理後殘留殭屍 URL
  galleryUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  galleryUrls.clear();
  updateGalleryUsage();   // D2：儲存空間用量顯示
  const grid=document.getElementById('galleryGrid');
  grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:20px">讀取中…</div>';
  // 建立 圖片id → 來源對話標題 對照
  const owner={};
  Object.values(chats).forEach(c=>{
    ((c&&c.messages)||[]).forEach(m=>{
      if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id&&!owner[p.id])owner[p.id]=c.title||'新對話'});
    });
  });
  let entries=[];
  try{
    const all=await mediaAllEntries();
    // 依生成時間新→舊排序：優先用記錄的 createdAt，舊記錄則從 id 解析 13 位時間戳（img_<ts>_ / img_u_<ts>_ / img_e_<ts>_ / img_mig_<ts>_）
    const tsOf=rec=>{if(!rec)return 0;if(rec.createdAt)return rec.createdAt;const m=String(rec&&rec.id||'').match(/(\d{13})/);return m?+m[1]:0};
    entries=all.slice().sort((a,b)=>tsOf(b)-tsOf(a));
    galleryIds=entries.map(rec=>rec&&rec.id).filter(Boolean);   // 記下圖庫排序，燈箱左右切換依此順序
  }catch(e){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:20px">讀取失敗：'+escHtml((e&&e.message)||e)+'</div>';
    return;
  }
  if(!entries.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:20px">尚無圖片</div>';
    if(myGen===galleryGen)galleryDirty=false;
    return;
  }
  // C2：分批渲染（每批 60 張，捲動到底自動載入更多）
  grid.innerHTML='<div id="gallerySentinel" style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:12px;padding:8px;display:none"></div>';
  const sentinel=document.getElementById('gallerySentinel');
  const PAGE=60;let shown=0;
  const appendBatch=()=>{
    const end=Math.min(shown+PAGE,entries.length);
    const frag=document.createDocumentFragment();
    for(let i=shown;i<end;i++){if(entries[i]&&entries[i].id)frag.appendChild(buildGalleryItem(entries[i],owner))}
    shown=end;
    grid.insertBefore(frag,sentinel);
    if(shown<entries.length){sentinel.style.display='block';sentinel.textContent='載入中…（'+shown+' / '+entries.length+'）'}
    else sentinel.style.display='none';
  };
  appendBatch();
  if(galleryScrollObs)galleryScrollObs.disconnect();
  if(shown<entries.length){
    galleryScrollObs=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))appendBatch()},{root:grid,rootMargin:'300px'});
    galleryScrollObs.observe(sentinel);
  }
  if(myGen===galleryGen)galleryDirty=false;   // 本次渲染完成且期間無變更：快取視為乾淨
}
// 單一縮圖項目（D5：加入多選模式支援）
function buildGalleryItem(rec,owner){
  const item=document.createElement('div');
  item.className='gallery-item'+(gallerySelectOn&&gallerySelected.has(rec.id)?' selected':'');
  const img=document.createElement('img');
  img.alt=rec.id;
  img.loading='lazy';
  img.title=(owner[rec.id]?('來源：'+owner[rec.id]):'（未被任何對話引用）')+(rec.urlOnly?'（僅連結）':'')+'｜'+rec.id;
  if(typeof rec.data==='string')img.src=rec.data;
  else if(rec.data instanceof Blob){const u=URL.createObjectURL(rec.data);galleryUrls.add(u);img.src=u}
  const info=document.createElement('div');
  info.className='gallery-item-info';
  info.textContent=(rec.urlOnly?'🔗 ':'')+(owner[rec.id]||'（未被引用）');   // A7：僅連結標記
  const acts=document.createElement('div');
  acts.className='gallery-item-actions';
  const bDl=document.createElement('button');bDl.type='button';bDl.textContent='💾';bDl.title='下載';
  const bDel=document.createElement('button');bDel.type='button';bDel.textContent='🗑️';bDel.title='刪除';
  acts.appendChild(bDl);acts.appendChild(bDel);
  item.appendChild(img);item.appendChild(info);item.appendChild(acts);
  img.addEventListener('click',()=>{
    if(gallerySelectOn){   // D5：多選模式：點縮圖切換選取
      item.classList.toggle('selected');
      if(item.classList.contains('selected'))gallerySelected.add(rec.id);else gallerySelected.delete(rec.id);
      updateGallerySelCount();
      return;
    }
    openLightbox(img.src,rec.id);   // 大圖：複用燈箱
  });
  bDl.addEventListener('click',()=>saveMessageImages({content:[{type:'image_ref',id:rec.id}]}));
  bDel.addEventListener('click',async()=>{
    const used=Object.values(chats).filter(c=>collectChatImageIds(c).includes(rec.id)).length;
    const msg=used
      ?('此圖被 '+used+' 則訊息引用；刪除後訊息文字保留、圖片改顯示「圖片已刪除」佔位。\n\n確定刪除？')
      :'確定要刪除這張圖片嗎？';
    if(!await showConfirm(msg))return;
    try{await mediaDel(rec.id)}catch(e){showToast('刪除失敗：'+e.message,'warn');return}
    showToast('圖片已刪除','success');
    renderGalleryGrid();
    renderMessages(true);   // 重新渲染當前對話，缺圖改為佔位框（hydrateMedia 處理）；保持捲動位置
  });
  return item;
}

  let fail=0;
  for(const id of [...gallerySelected]){try{await mediaDel(id)}catch(e){fail++}}
  showToast('已刪除 '+(n-fail)+' 張圖片'+(fail?('，'+fail+' 張失敗'):''),fail?'warn':'success');
  setGallerySelectMode(false);
  renderGalleryGrid();
  renderMessages(true);
});
document.getElementById('btnBatchDownload').addEventListener('click',()=>{
  if(!gallerySelected.size){showToast('尚未選取任何圖片','warn');return}
  const n=gallerySelected.size;
  [...gallerySelected].forEach(id=>saveMessageImages({content:[{type:'image_ref',id}]}));
  showToast('開始下載 '+n+' 張圖片（瀏覽器可能詢問允許多個下載）','success');
});
document.getElementById('btnBatchCompress').addEventListener('click',async()=>{
  if(!gallerySelected.size){showToast('尚未選取任何圖片','warn');return}
  let entries;
  try{entries=await mediaAllEntries()}catch(e){showToast('讀取失敗：'+((e&&e.message)||e),'warn');return}
  const sel=new Set(gallerySelected);
  const cands=entries.filter(rec=>rec&&rec.id&&sel.has(rec.id)&&isPngMedia(rec.data));
  if(!cands.length){showToast('選取中沒有可壓縮的 PNG 圖片','warn');return}
  if(!await showConfirm('將把選取的 '+cands.length+' 張 PNG 轉存為 JPEG（品質 85%、尺寸不變）。\n\n此操作不可還原，確定繼續？'))return;
  const r=await compressGalleryEntries(cands);
  showToast(r.done?('已壓縮 '+r.done+' 張，節省 '+fmtBytes(r.savedBytes)):'選取的圖片都不需要壓縮',r.done?'success':'warn');
  renderGalleryGrid();
});
// 讀取 IndexedDB 全部圖片記錄（Gallery 用）→ 已併入上方媒體輔助區（B1）

// ===== C9-2：Gallery 一鍵壓縮（PNG → JPEG 品質 85%）=====
// 不縮小尺寸、只轉檔：肉眼幾乎感覺不出差異，但 PNG（無損）轉 JPEG 通常可省 60~90% 空間。
// 壓縮後若沒有比原檔小 10% 以上就不覆蓋，避免白工或反而變大。JPEG 不支援透明，透明處鋪白底。
function fmtBytes(n){
  if(n>=1048576)return (n/1048576).toFixed(2)+' MB';
  if(n>=1024)return (n/1024).toFixed(1)+' KB';
  return n+' B';
}
function isPngMedia(data){
  if(typeof data==='string')return /^data:image\/png/i.test(data);
  return data instanceof Blob&&(data.type==='image/png'||data.type==='');
}
// B3：批次壓縮核心（單鍵壓縮與多選批次壓縮共用）；recs 為媒體記錄陣列，回傳 {done,savedBytes}
async function compressGalleryEntries(recs){
  let done=0,savedBytes=0;
  for(let i=0;i<recs.length;i++){
    showProgress('🗜️ 壓縮中 '+(i+1)+' / '+recs.length+'…');
    try{
      const srcSize=mediaDataSize(recs[i].data);
      const r=await compressToJpeg(recs[i].data,{quality:0.85});
      if(r&&r.data.size<srcSize*0.9){   // 省不到 10% 就不覆蓋
        await mediaPut(recs[i].id,r.data,recs[i].createdAt);   // 覆寫保留原時間戳，排序不變
        done++;savedBytes+=srcSize-r.data.size;
      }
    }catch(e){}
  }
  hideProgress();
  return {done,savedBytes};
}
document.getElementById('btnCompressImages').addEventListener('click',async()=>{
  const btn=document.getElementById('btnCompressImages');
  if(btn.disabled)return;
  let entries;
  try{entries=await mediaAllEntries()}catch(e){showToast('讀取失敗：'+((e&&e.message)||e),'warn');return}
  const cands=entries.filter(rec=>rec&&rec.id&&isPngMedia(rec.data));
  if(!cands.length){showToast('沒有可壓縮的 PNG 圖片（JPEG／遠端連結不在處理範圍）','warn');return}
  const msg=`將把 ${cands.length} 張 PNG 圖片轉存為 JPEG\n（品質 85%、尺寸不變、透明處鋪白底）。\n\n此動作不可還原，確定繼續？`;
  if(!await showConfirm(msg))return;
  btn.disabled=true;
  const oldText=btn.textContent;
  const r=await compressGalleryEntries(cands);
  btn.disabled=false;btn.textContent=oldText;
  if(r.done){
    showToast(`已壓縮 ${r.done} 張圖片，節省 ${fmtBytes(r.savedBytes)}`,'success');
    renderGalleryGrid();   // 刷新縮圖
  }else{
    showToast('沒有圖片需要壓縮','warn');
  }
});

// ===== C10：Service Worker 離線快取（需 https；file:// 或註冊失敗時自動略過）=====
// 改為指向實體 ./sw.js 與 ./manifest.webmanifest；可離線使用，devtool 可看到快取
// 新版流程：註冊成功後監聽 updatefound／controllerchange；偵測到新 SW 接管就提示一次
// toast（可點立即更新），不點則只留 header「⟳ 更新」鈕；串流中擋更新避免中斷。
(function setupServiceWorker(){
  try{
    if(!('serviceWorker' in navigator))return;
    if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;   // file:// 直接略過
    const btn=document.getElementById('btnAppUpdate');
    if(btn)btn.addEventListener('click',()=>applyAppUpdate());
    // 若新 SW 已在背景裝好並接管（例如上一輪已下載、本輪才 controllerchange），直接提示
    navigator.serviceWorker.addEventListener('controllerchange',()=>notifyAppUpdateAvailable());
    navigator.serviceWorker.register('./sw.js')
      .then(reg=>{
        dbg('[Chat] Service Worker 已註冊（離線快取開啟）');
        // 已有新版在 waiting（上一輪下載完但舊頁還沒關）：本輪打開就提示，不用再等一次
        if(reg.waiting)notifyAppUpdateAvailable();
        reg.addEventListener('updatefound',()=>{
          const nw=reg.installing;
          if(!nw)return;
          nw.addEventListener('statechange',()=>{
            // 新 SW 裝好（installed）且已有舊 controller 代表「有新版待套用」
            if(nw.state==='installed'&&navigator.serviceWorker.controller)notifyAppUpdateAvailable();
          });
        });
      })
      .catch(err=>dbg('[Chat] Service Worker 註冊略過：',err&&err.message));
  }catch(e){}
})();

// ===== 二之2：貓頭隨機傾斜（原為頁面尾端獨立的小 script，已併入主 script）=====
function initCatHeadTilt(){
  const heads=document.querySelectorAll('.head');
  heads.forEach(head=>{
    if(head.dataset.tiltReady)return;
    head.dataset.tiltReady='1';
    let lastSide=0;
    function tilt(){
      let side=Math.random()<0.5?-1:1;
      if(side===lastSide)side*=-1;
      lastSide=side;
      head.style.transform='rotate('+(side*(5+Math.random()*4))+'deg)';
      setTimeout(()=>{
        head.style.transform='rotate(0deg)';
        setTimeout(tilt,4000+Math.random()*9000);
      },2200+Math.random()*1800);
    }
    setTimeout(tilt,3000+Math.random()*7000);
  });
}
initCatHeadTilt();

// ===== PWA：連結實體 manifest（icons/ChatCat-192.png 等由同目錄的 icons/ 載入）=====
// http(s) 環境下指向 ./manifest.webmanifest；file:// 環境（多數本機開啟）自動降級為 blob 內嵌
(function setupManifest(){
  try{
    const link=document.createElement('link');
    link.rel='manifest';
    if(location.protocol==='http:'||location.protocol==='https:'){
      link.href='./manifest.webmanifest';
    }else{
      // file://：把 manifest 序列化成 blob URL，避開 file:// 無法被相對 URL 解析
      const cv=document.createElement('canvas');
      cv.width=cv.height=192;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#141414';ctx.fillRect(0,0,192,192);
      ctx.font='84px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🐱',96,102);
      const mf={
        name:'ChatCAT',short_name:'ChatCAT',start_url:'.',display:'standalone',
        background_color:'#0d0d0d',theme_color:'#0d0d0d',
        icons:[{src:cv.toDataURL('image/png'),sizes:'192x192',type:'image/png'}]
      };
      link.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    }
    document.head.appendChild(link);
    // iOS / iPad：加 apple-touch-icon 與 theme-color（這部分跨瀏覽器都該有）
    if(!document.querySelector('link[rel="apple-touch-icon"]')){
      const at=document.createElement('link');
      at.rel='apple-touch-icon';
      at.href='icons/ChatCat-180.png';
      document.head.appendChild(at);
    }
    if(!document.querySelector('link[rel="icon"]')){
      const ic=document.createElement('link');
      ic.rel='icon';
      ic.type='image/png';
      ic.href='icons/ChatCat-192.png';
      document.head.appendChild(ic);
    }
  }catch(e){}
})();
</script>
