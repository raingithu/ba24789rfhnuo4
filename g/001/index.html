}

// ===== 對話內全文搜尋：高亮 ＋ 上／下一則（Ctrl+F 或點 🔍）=====
// 搜尋粒度是「訊息」：m = 符合的訊息則數，n = 目前停在第幾則。
// 高亮只作用在已渲染的列上；往上捲載入更早訊息時（P2）會自動補高亮。
const findBarEl=document.getElementById('findBar');
const findInputEl=document.getElementById('findInput');
const findCountEl=document.getElementById('findCount');
// 高亮時要避開的區域：MathML 原文、程式碼按鈕、訊息選單與時間徽章等 UI 文字
const FIND_SKIP='script,style,textarea,.katex-mathml,.code-copy,.msg-menu-wrap,.msg-time,.continue-btn,.msg-top-sentinel';
let findQ='';          // 目前搜尋字串（小寫）
let findMsgIdxs=[];    // 符合的訊息索引（遞增）
let findCur=-1;        // 目前停在哪一筆 findMsgIdxs
function clearFindMarks(){
  findMarkCount=0;   // 標記計數歸零（重搜時重新累計）
  messagesEl.querySelectorAll('mark.chatcat-hit').forEach(mk=>{
    const p=mk.parentNode;
    if(!p)return;
    p.replaceChild(document.createTextNode(mk.textContent),mk);
    try{p.normalize()}catch(e){}
  });
}
function highlightRow(row){
  if(!row||!findQ)return 0;
  if(row.querySelector('mark.chatcat-hit'))return 0;
  const walker=document.createTreeWalker(row,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      if(!n.nodeValue)return NodeFilter.FILTER_REJECT;
      const p=n.parentElement;
      if(!p)return NodeFilter.FILTER_REJECT;
      if(p.closest(FIND_SKIP))return NodeFilter.FILTER_REJECT;
      return n.nodeValue.toLowerCase().indexOf(findQ)>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }
  });
  const nodes=[];let w;
  while((w=walker.nextNode()))nodes.push(w);
  let cnt=0;
  nodes.forEach(node=>{
    const text=node.nodeValue,lc=text.toLowerCase(),frag=document.createDocumentFragment();
    let pos=0,i;
    while((i=lc.indexOf(findQ,pos))>=0){
      if(i>pos)frag.appendChild(document.createTextNode(text.slice(pos,i)));
      const mk=document.createElement('mark');
      mk.className='chatcat-hit';
      mk.textContent=text.slice(i,i+findQ.length);
      frag.appendChild(mk);
      pos=i+findQ.length;cnt++;
    }
    if(pos<text.length)frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag,node);
  });
  return cnt;
}
// 只標「畫面內（含上下 200px 緩衝）」的訊息列：萬字長對話不會一次掃完所有列。
// 捲動時由 onViewChange() 補標新進畫面的列；標記總量達上限就停止，避免 DOM 被 mark 塞爆。
const FIND_VIEW_MARGIN=200;
let findMarkCount=0;
function rowInView(row){
  if(!messagesEl)return true;
  const cr=messagesEl.getBoundingClientRect();
  const br=row.getBoundingClientRect();
  return br.bottom>cr.top-FIND_VIEW_MARGIN&&br.top<cr.bottom+FIND_VIEW_MARGIN;
}
function highlightRenderedRows(){
  if(!findQ||!findMsgIdxs.length)return;
  if(findMarkCount>=CONFIG.find.maxMarks)return;
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    if(findMarkCount>=CONFIG.find.maxMarks)return;
    const i=parseInt(r.dataset.idx,10);
    if(findMsgIdxs.indexOf(i)<0)return;
    if(!rowInView(r))return;
    findMarkCount+=highlightRow(r);
  });
}
// 視窗／捲動變化後的統一補做：數學字級 + 搜尋高亮（rAF 節流）
let viewRaf=0;
function onViewChange(){
  if(viewRaf)return;
  viewRaf=requestAnimationFrame(()=>{
    viewRaf=0;
    fitPendingMath();
    if(findQ)highlightRenderedRows();
  });
}
function updateFindCount(){findCountEl.textContent=findMsgIdxs.length?((findCur+1)+' / '+findMsgIdxs.length):'0 / 0'}
function findGoto(pos){
  if(!findMsgIdxs.length)return;
  findCur=((pos%findMsgIdxs.length)+findMsgIdxs.length)%findMsgIdxs.length;
  const idx=findMsgIdxs[findCur];
  ensureMsgRendered(idx);   // P2：必要時往前補載
  const row=messagesEl.querySelector('.msg-row[data-idx="'+idx+'"]');
  if(row){
    highlightRow(row);
    messagesEl.querySelectorAll('mark.chatcat-hit.cur').forEach(m=>m.classList.remove('cur'));
    row.querySelectorAll('mark.chatcat-hit').forEach(m=>m.classList.add('cur'));
    row.scrollIntoView({block:'start'});
  }
  updateFindCount();
}
function runFind(){
  const q=(findInputEl.value||'').trim().toLowerCase();
  findQ=q;
  clearFindMarks();
  const chat=chats[activeChatId];
  findMsgIdxs=[];findCur=-1;
  if(chat&&q)chat.messages.forEach((m,i)=>{if(contentText(m).toLowerCase().indexOf(q)>=0)findMsgIdxs.push(i)});
  highlightRenderedRows();
  if(findMsgIdxs.length)findGoto(0);
  else updateFindCount();
}
function openFindBar(){
  findBarEl.classList.add('open');
  findInputEl.focus();
  findInputEl.select();
  if(findInputEl.value.trim())runFind();
}
function closeFindBar(){
  findBarEl.classList.remove('open');
  findQ='';findMsgIdxs=[];findCur=-1;
  clearFindMarks();
  updateFindCount();
}
document.getElementById('btnFind').addEventListener('click',()=>{
  if(findBarEl.classList.contains('open'))closeFindBar();else openFindBar();
});
document.getElementById('findClose').addEventListener('click',closeFindBar);
document.getElementById('findPrev').addEventListener('click',()=>findGoto(findCur-1));
document.getElementById('findNext').addEventListener('click',()=>findGoto(findCur+1));
let findDeb=null;
findInputEl.addEventListener('input',()=>{
  if(findDeb)clearTimeout(findDeb);
  findDeb=setTimeout(runFind,150);
});
findInputEl.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==='Enter'){e.preventDefault();findGoto(findCur+(e.shiftKey?-1:1))}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeFindBar()}
});
// Ctrl/Cmd+F 開啟對話內搜尋；搜尋列開著時 Esc 先關它
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='f'||e.key==='F')){
    e.preventDefault();openFindBar();return;
  }
  if(e.key==='Escape'&&findBarEl.classList.contains('open')){closeFindBar();return}
},{capture:true});
// 對話列表事件委派：切換 / 置頂 / 重新命名 / 刪除
document.getElementById('chatList').addEventListener('click',async e=>{
  if(e.target.tagName==='INPUT')return; // 重新命名輸入中，不觸發其他行為
  const item=e.target.closest('.chat-item');
  if(!item)return;
  const id=item.dataset.id;
  const act=e.target.closest('[data-act]');
  if(!act){
    const q=(document.getElementById('chatSearch').value||'').trim().toLowerCase();
    setActiveChat(id);
    if(q)jumpToSearchMatches(q);   // D6：從搜尋結果進入對話，跳到第一則符合訊息
    document.getElementById('sidebar').classList.remove('open');
    return;
  }
  const a=act.dataset.act;
  if(a==='del'){await deleteChat(id);return}
  if(a==='pin'){chats[id].pinned=!chats[id].pinned;saveChatsData(chats);renderChatList();return}
  if(a==='rename'){
    const c=chats[id];
    const titleEl=item.querySelector('.title');
    const inp=document.createElement('input');
    inp.className='rename-input';inp.value=c.title||'';
    titleEl.replaceWith(inp);
    inp.focus();inp.select();
    let finished=false;   // B4：Enter 觸發後 renderChatList 會移除輸入框，blur 可能再觸發一次
    const done=save=>{
      if(finished)return;
      finished=true;
      if(save&&inp.value.trim()){c.title=inp.value.trim().slice(0,60);delete c.titleFromMsg;saveChatsData(chats)}   // 手動改名：清除暫用標記，避免被自動標題覆蓋
      renderChatList();
    };
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'){ev.preventDefault();done(true)}
      else if(ev.key==='Escape'){ev.stopPropagation();done(false)}
    });
    inp.addEventListener('blur',()=>done(true));
  }
});
// 對話搜尋（比對標題與內容）— B3：200ms debounce，避免每個按鍵都全量掃描
let searchDeb=null;
document.getElementById('chatSearch').addEventListener('input',()=>{
  if(searchDeb)clearTimeout(searchDeb);
  searchDeb=setTimeout(renderChatList,200);
});

const messagesEl=document.getElementById('messages');

// ===== P2：分段漸進渲染 =====
// 開場只 render 最後 MSG_PAGE 則，往上捲時以 IntersectionObserver 分批往前補；
// sentinel 也可直接點擊（IntersectionObserver 沒觸發時的保底操作）。
// 數百則的長對話不必一次處理全部，開場體感差很多。
const MSG_PAGE=CONFIG.render.msgPage;
let msgRenderedFrom=0;    // 目前已渲染的最前端訊息索引（0 = 已全部載入）
let msgTopObs=null;
function msgRangeHtml(from,to){
  const chat=chats[activeChatId];
  let s='';
  for(let i=from;i<to;i++)s+=msgHtml(chat.messages[i],i);
  return s;
}
function updateMsgTopSentinel(){
  const chat=chats[activeChatId];
  if(chat)msgRenderedFrom=Math.min(msgRenderedFrom,Math.max(0,chat.messages.length));   // 刪除訊息後可能越界
  const el=document.getElementById('msgTopSentinel');
  if(!el)return;
  if(msgRenderedFrom<=0){el.remove();return}
  el.textContent='↑ 顯示更早的 '+Math.min(MSG_PAGE,msgRenderedFrom)+' 則（尚有 '+msgRenderedFrom+' 則未載入）';
}
function setupMsgTopObserver(){
  if(msgTopObs){msgTopObs.disconnect();msgTopObs=null}
  if(msgRenderedFrom<=0)return;
  const el=document.getElementById('msgTopSentinel');
  if(!el||!window.IntersectionObserver)return;
  msgTopObs=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))loadMoreMessagesUp()},{root:messagesEl,rootMargin:'300px'});
  msgTopObs.observe(el);
}
// 往前補一批訊息；回傳是否真的補了
function loadMoreMessagesUp(){
  if(msgRenderedFrom<=0)return false;
  const chat=chats[activeChatId];
  if(!chat)return false;
  const prevH=messagesEl.scrollHeight,prevTop=messagesEl.scrollTop;
  const to=msgRenderedFrom,from=Math.max(0,to-MSG_PAGE);
  const wrap=document.createElement('div');
  wrap.innerHTML=msgRangeHtml(from,to);
  const frag=document.createDocumentFragment(),newRows=[];
  let n;
  while((n=wrap.firstElementChild)){newRows.push(n);frag.appendChild(n)}
  const sentinel=document.getElementById('msgTopSentinel');
  if(sentinel)sentinel.after(frag);
  else messagesEl.insertBefore(frag,messagesEl.firstChild);
  msgRenderedFrom=from;
  newRows.forEach(r=>{
    fitMathBlocks(r);
    hydrateMedia(r);
    const ri=parseInt(r.dataset.idx,10);
    if(findQ&&findMsgIdxs.indexOf(ri)>=0)highlightRow(r);   // 補載的段落若有命中，一併高亮
  });
  messagesEl.scrollTop=prevTop+(messagesEl.scrollHeight-prevH);   // 補償：上方插入內容後畫面不跳動
  updateMsgTopSentinel();
  updateScrollBtn();
  if(msgRenderedFrom<=0&&msgTopObs){msgTopObs.disconnect();msgTopObs=null}
  return true;
}
// 確保第 idx 則已被渲染（搜尋跳轉用）：連續往前補到該則進入 DOM
function ensureMsgRendered(idx){
  let guard=0;
  while(idx<msgRenderedFrom&&msgRenderedFrom>0&&guard++<200){if(!loadMoreMessagesUp())break}
}

function renderMessages(keepPos){
  closeLightbox();           // 重建 DOM 前先收起燈箱，避免引用被釋放的 blob URL
  revokeRenderBlobUrls();    // A2：釋放上一輪渲染建立的 objectURL
  if(msgTopObs){msgTopObs.disconnect();msgTopObs=null}
  const chat=chats[activeChatId];
  if(!chat||!chat.messages.length){messagesEl.innerHTML='<div class="empty"></div>';msgRenderedFrom=0;if(shouldAutoScroll())scrollToBottom(false);updateScrollBtn();return}   // 空對話也要同步重算按鈕，否則舊對話的 ↓ 會殘留
  const total=chat.messages.length;
  msgRenderedFrom=Math.max(0,total-MSG_PAGE);   // P2：開場只 render 最後一批
  // P1：msgHtml 內部使用 finalBodyHtml（已含程式碼按鈕與 KaTeX，且整列 HTML 有快取）
  const head=msgRenderedFrom>0?'<div id="msgTopSentinel" class="msg-top-sentinel" role="button" tabindex="0"></div>':'';
  messagesEl.innerHTML=head+msgRangeHtml(msgRenderedFrom,total);
  updateMsgTopSentinel();
  fitMathBlocks(messagesEl);   // 字級依容器寬度計算、不進快取；整批插入 DOM 後統一跑一次
  hydrateMedia(messagesEl);
  if(findQ)highlightRenderedRows();   // 重建後補回搜尋高亮（findQ 為空時不做）
  setupMsgTopObserver();
  updateScrollBtn();   // 重建後更新「捲到底按鈕」顯示
  updateTtsBtn();   // 朗讀中重建訊息區（切換對話回來／設定變更重繪）：把 ⏹ 停止朗讀補回正在朗讀的那則
  // 預設強制捲到底；keepPos=true 表示呼叫端會自行決定（注意：scrollToBottom 會再問一次 shouldAutoScroll，關閉或已往上捲就不動）
  if(!keepPos&&shouldAutoScroll())scrollToBottom(false);
}

// 刪除單則訊息時使用：只移除該列 DOM 並重編後續 data-idx，
// 不重建整個訊息區 → 捲動位置保持不變，其餘訊息自然上移補位（自動捲動關閉時畫面完全不受影響）
function removeMessageRow(idx){
  const row=messagesEl.querySelector(`.msg-row[data-idx="${idx}"]`);
  if(row)row.remove();
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    const i=parseInt(r.dataset.idx,10);
    if(!Number.isNaN(i)&&i>idx)r.dataset.idx=String(i-1);
  });
  if(!chats[activeChatId]||!chats[activeChatId].messages.length)messagesEl.innerHTML='<div class="empty"></div>';
  updateScrollBtn();
}
// 移除 idx（含）之後的所有列（編輯重送／重新生成時用；被移除的一定在尾端）
function removeMessageRowsFrom(idx){
  messagesEl.querySelectorAll('.msg-row').forEach(r=>{
    const i=parseInt(r.dataset.idx,10);
    if(!Number.isNaN(i)&&i>=idx)r.remove();
  });
  if(!chats[activeChatId]||!chats[activeChatId].messages.length)messagesEl.innerHTML='<div class="empty"></div>';
  updateScrollBtn();
}
// 新訊息加入：只附加單一列 DOM，不重建整個訊息區。
// （innerHTML 重建會讓圖片重新載入、高度瞬間塌縮，捲動位置因此漂移——自動捲動關閉時尤其明顯；
//   附加方式對上方既有內容零影響，捲動位置完全不動）
function appendMessageRow(m){
  const chat=chats[activeChatId];
  if(!chat||!m)return;
  const i=chat.messages.indexOf(m);
  if(i<0)return;
  const empty=messagesEl.querySelector('.empty');
  if(empty)empty.remove();
  const wrap=document.createElement('div');
  wrap.innerHTML=msgHtml(m,i);
  const row=wrap.firstElementChild;
  if(!row)return;
  messagesEl.appendChild(row);
  fitMathBlocks(row);      // P1：只補跑字級調整（其餘已在 finalBodyHtml 快取內）
  hydrateMedia(row);
  updateScrollBtn();
}

function msgHtml(m,i){
  const cls=m.role==='user'?'user':(m.error?'error':'assistant');
  const isUser=m.role==='user';
  // C3：訊息時間戳（舊資料無 createdAt 則不顯示）
  const tstr=m.createdAt?('🕒 '+new Date(m.createdAt).toLocaleString('zh-TW')):'';
  // 氣泡上顯示時間（完整時間保留在長按選單第一行）；使用者訊息不顯示，僅 AI 氣泡下方顯示
  const tshort=m.createdAt?new Date(m.createdAt).toLocaleTimeString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const timeRow=tstr?`<div class="menu-time">${escHtml(tstr)}</div>`:'';
  // 🔍 搜尋標記：該回覆曾以搜尋結果增強（滑鼠移過顯示實際查詢字串）
  // 三之1：有記錄來源時，徽章可點擊開啟來源面板
  const hasSrc=!isUser&&Array.isArray(m.sources)&&m.sources.length>0;
  const searchTip=(!isUser&&m.searchQuery)?` title="🔍 搜尋：${escHtml(m.searchQuery)}${hasSrc?'（可點擊查看來源）':''}"`:'';
  const timeBadge=(tshort&&!isUser)?`<div class="msg-time${hasSrc?' clickable':''}"${searchTip}${hasSrc?' data-act="sources" role="button" tabindex="0"':''}>${m.searchQuery?'🔍 ':''}${escHtml(tshort)}</div>`:'';
  // 選單項目：user = 複製/編輯；AI 純文字 = 複製/轉格式複製/重新生成；AI 圖片訊息 = 儲存圖片/重新生成（C4：皆附刪除）
  // 書籤與朗讀為本次新增：書籤一律提供，朗讀只在瀏覽器支援語音合成時出現
  const delBtn=`<button data-act="delmsg" type="button">🗑️ 刪除</button>`;
  const bmBtn=`<button data-act="bookmark" type="button">${m.bm?'🔖 移除書籤':'🔖 加入書籤'}</button>`;
  const speakBtn=ttsSupported()?`<button data-act="speak" type="button">🔊 朗讀</button>`:'';
  const items=isUser
    ?`<button data-act="copy" type="button">📋 複製</button><button data-act="edit" type="button">✏️ 編輯並重送</button>${speakBtn}${bmBtn}${delBtn}`
    :(msgHasImage(m)
      ?`${hasSrc?`<button data-act="sources" type="button">🔗 查看來源</button>`:''}<button data-act="saveimg" type="button">💾 儲存圖片</button><button data-act="editimg" type="button">🎨 修改圖片</button><button data-act="regen" type="button">🔄 重新生成</button>${bmBtn}${delBtn}`
      :`${hasSrc?`<button data-act="sources" type="button">🔗 查看來源</button>`:''}<button data-act="copy" type="button">📋 複製（原始）</button><button data-act="copyconv" type="button">📋 複製（文字）</button>${speakBtn}<button data-act="regen" type="button">🔄 重新生成</button>${bmBtn}${delBtn}`);
  // 書籤標記：只在該則被收藏時顯示（樣式由 .msg-row.bm 控制，切換書籤時只動 class）
  const bmFlag='<span class="msg-bm-flag" title="已加入書籤">🔖</span>';
  // C6：因長度上限被截斷（finish_reason=length）的 AI 訊息，附「繼續生成」按鈕
  const contBtn=(m.truncated&&!isUser)?`<button class="continue-btn" type="button">⤵️ 繼續生成</button>`:'';
  // B2：串流出錯但已有部分內容時，錯誤原因直接標在該則下方（不再多一則 [錯誤] 氣泡）
  const errNote=(!isUser&&m.errorNote)?`<div class="msg-errnote">⚠️ ${escHtml(m.errorNote)}</div>`:'';
  return `<div class="msg-row ${cls}${m.bm?' bm':''}" data-idx="${i}"><div class="msg ${cls}">${finalBodyHtml(m)}${timeBadge}${bmFlag}<div class="msg-menu-wrap"><button class="msg-menu" type="button" title="訊息選單" aria-label="訊息選單">⋮</button><button class="msg-tts-stop" type="button" title="停止朗讀" aria-label="停止朗讀">⏹</button><div class="msg-dropdown">${timeRow}${items}</div></div>${errNote}${contBtn}</div></div>`;
}

  document.querySelectorAll('.msg-row.menu-open').forEach(r=>r.classList.remove('menu-open'));

// 數學前置處理：
//  - 把模型的 LaTeX 分隔符 \[ .. \]、\( .. \) 轉成 KaTeX auto-render 認得的 $$ / $
//    （Markdown 會把反斜線當跳脫字元吃掉，必須在 parse 之前轉換）
//  - 程式碼區塊（``` 圍欄與行內 `code`）原樣保留，讓數學與程式碼互不干擾
//  - 已認得的數學（$$..$$、$..$）先「收進佔位符」，之後的「裸括號→行內數學」
//    才不會誤改到數學內部而產生巢狀 $（例如 $$OA^2 + OB^2 = (x_1^2 + 16) + …$$
//    被包成 $x_1^2 + 16$ 就會造成 KaTeX parse error）
//  - 顯示數學內若殘留巢狀 / 孤立的 $（舊資料或缺漏裁切所致），會還原成括號或直接清除
const MATH_PH_START='\uE000';
const MATH_PH_END='\uE001';
function preprocessMath(text){
  // 先抽出程式碼（``` 圍欄 + 行內 `code`）與一般文字
  const parts=String(text).split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/);
  return parts.map((p,idx)=>{
    if(idx%2===1)return p; // 程式碼原樣保留，不做任何數學轉換
    return convertMath(p);
  }).join('');
}
// 不含程式碼的文字上做數學轉換（含對舊資料的修補）
function convertMath(p){
  const tokens=[];
  const ph=s=>{tokens.push(s);return MATH_PH_START+(tokens.length-1)+MATH_PH_END;};
  const unph=s=>{
    const re=new RegExp(MATH_PH_START+'(\\d+)'+MATH_PH_END,'g');
    let t=s;
    // 循環還原：即使意外出現「佔位符包佔位符」的巢狀，內層也會在後續回合還原
    for(let k=0;k<20;k++){
      const n=t.replace(re,(m,i)=>tokens[+i]!==undefined?tokens[+i]:m);
      if(n===t)break;
      t=n;
    }
    return t;
  };
  // 1) \[ .. \] → 顯示數學（整段先收進佔位符，避免被後續步驟誤改）
  p=p.replace(/\\\[([\s\S]*?)\\\]/g,(m,c)=>ph('\n\n$$'+c+'$$\n\n'));
  // 2) \( .. \) → 行內數學
  p=p.replace(/\\\(([\s\S]*?)\\\)/g,(m,c)=>ph('$'+c+'$'));
  // 3) $$ .. $$ 顯示數學：內部殘留的巢狀 $..$ 還原成括號、孤立 $ 清除
  //    （舊版誤把括號包成 $..$，例如 $x_1^2 + 16$ 原本是 (x_1^2 + 16)）
  p=p.replace(/\$\$([\s\S]*?)\$\$/g,(m,c)=>ph('$$'+c.replace(/\$([^$\n]{1,120})\$/g,'($1)').replace(/\$/g,'')+'$$'));
  // 4) $ .. $ 行內數學（內容不含換行，避免誤抓跨行文字）
  p=p.replace(/\$([^$\n]{1,200}?)\$/g,(m,c)=>ph('$'+c+'$'));
  // 5) 裸括號內含數學符號（^ _ 或 \指令）時視為行內數學，如 (3^{x+1} = 27)
  //    此時真正的數學已被佔位符取代，不會再改到 $$..$$ 或 $..$ 內部
  //    佔位符本身不含 $ ( ) ^ _ \，不會再被此規則誤判
  p=p.replace(/\(([^()\n]{0,120})\)/g,(m,c)=>/[\\^_]/.test(c)?ph('$'+c+'$'):m);
  // 還原被保護的數學區段
  return unph(p);
}

// 保護 $$..$$ 不被 marked 掃進去：把每段顯示數學收進佔位符，
// marked 處理完後再還原。否則 marked 會把 `_x`、`*x*` 當斜體/粗體，
// 把公式結構毀掉（例：|_{L_{-m}} → |<em>L</em>{-m}）。
function shieldDisplayMath(text){
  const tokens=[];
  const re=/\$\$([\s\S]*?)\$\$/g;
  const shielded=text.replace(re,(m,c)=>{
    tokens.push('$$'+c+'$$');
    return MATH_PH_START+(tokens.length-1)+MATH_PH_END;
  });
  return {shielded,restore:s=>s.replace(new RegExp(MATH_PH_START+'(\\d+)'+MATH_PH_END,'g'),(m,i)=>tokens[+i]!==undefined?tokens[+i]:m)};
}

// KaTeX 自動排版（pre/code 內不自動渲染；載入失敗時靜默跳過）
// skipFit=true：略過 fitMathBlocks（快取「定稿 HTML」時用；字級調整依賴容器寬度，不能快取）
function renderMath(el,skipFit){
  if(window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        ignoredTags:['script','noscript','style','textarea','pre','code'],
        throwOnError:false
      });
    }catch(e){}
  }
  if(!skipFit)fitMathBlocks(el);
}

// 自動縮字級：每個 .katex-display 若自然寬超過容器可用寬度，就單獨往下縮到不溢出為止；
// 縮不到下限（10px）就交給水平 scrollbar。只動該段，不影響其他內容。
// 效能：只處理「在畫面內（含上下 400px 緩衝）」的區塊；畫面外的標記 .math-pending，
// 等使用者捲過去時再由 fitPendingMath() 補算——長對話（數百則、每則都有公式）不再卡頓。
const MATH_VIEW_MARGIN=400;
function mathBoxInView(box){
  if(!messagesEl)return true;
  const cr=messagesEl.getBoundingClientRect();
  const br=box.getBoundingClientRect();
  return br.bottom>cr.top-MATH_VIEW_MARGIN&&br.top<cr.bottom+MATH_VIEW_MARGIN;
}
function fitOneMath(box){
  const MIN_PX=10;     // 下限：再小就糊了
  const STEP=0.92;     // 每次縮 92%
  const MAX_LOOPS=8;   // 安全閥
  if(box.style.fontSize)box.style.fontSize='';   // 先還原到繼承值（沒被調整過就不寫，少一次強制排版）
  if(box.scrollWidth<=box.clientWidth+1)return;  // 沒溢出的區塊直接跳過，省掉 getComputedStyle()
  let n=0;
  while(box.scrollWidth>box.clientWidth+1&&n<MAX_LOOPS){
    const cur=parseFloat(getComputedStyle(box).fontSize);
    if(cur<=MIN_PX+0.5)break;   // 觸底，改走 scrollbar
    box.style.fontSize=(cur*STEP)+'px';
    n++;
  }
}
function fitMathBlocks(root){
  if(!root||!root.querySelectorAll)return;
  root.querySelectorAll('.katex-display').forEach(box=>{
    if(!mathBoxInView(box)){box.classList.add('math-pending');return}
    box.classList.remove('math-pending');
    fitOneMath(box);
  });
}
// 捲動時補算「先前在畫面外」的公式（rAF 節流，一幀最多一次）
let pendingFitRaf=0;
function fitPendingMath(){
  if(pendingFitRaf)return;
  pendingFitRaf=requestAnimationFrame(()=>{
    pendingFitRaf=0;
    const boxes=messagesEl.querySelectorAll('.katex-display.math-pending');
    if(!boxes.length)return;
    let did=false;
    boxes.forEach(box=>{
      if(!mathBoxInView(box))return;
      box.classList.remove('math-pending');
      fitOneMath(box);
      did=true;
    });
    if(did)updateScrollBtn();
  });
}

// Markdown 渲染（CDN 載入失敗時退回純文字）
function mdToHtml(text){
  maybeLoadKatex(text);   // 延遲初始化：訊息真的有數學才去抓 KaTeX
  const t=preprocessMath(text);
  if(window.marked&&window.DOMPurify){
    try{
      // 先把 $$..$$ 收進佔位符，避免 marked 掃進去把 `_x` `*x*` 當斜體/粗體
      const {shielded,restore}=shieldDisplayMath(t);
      const html=DOMPurify.sanitize(marked.parse(shielded,{breaks:true}));
      // 最後一道保險：清掉 <a> 前後殘留的 $，確保點開網址永遠不會多出 $ 而失誤
      const safeHtml=sanitizeAnchors(html);
      // SVG 空殼清理：foreignObject/script/事件屬性被 DOMPurify 拔掉後，可能留下
      // <svg width height> 空殼（看不見卻佔位）；這裡整顆移除，不放寬消毒器
      const noEmptySvg=stripEmptySvg(safeHtml);
      // 所有對外連結另開分頁，避免離開聊天頁；rel 加 noopener+noreferrer 防 opener 控制與 Referer 外洩
      const withBlank=noEmptySvg.replace(/<a\s+([^>]*?)>/gi,(m,attrs)=>{
        if(!/href=/i.test(attrs))return m;   // 沒 href 不處理
        if(/target=/i.test(attrs))return m;   // 已設 target 不覆蓋
        return `<a ${attrs} target="_blank" rel="noopener noreferrer">`;
      });
      return restore(withBlank);
    }catch(e){return formatMsg(t)}
  }
  return formatMsg(t);
}

function formatMsg(text){
  return escHtml(text).replace(/\n/g,'<br>');
}

// ===== 最後一道連結 $ 保險 =====
// 就算模型/fixJinaLinks 漏掉，render 出的 <a> 前後若還殘留 $，點開時就會多出 $ 而失誤。
// 這裡直接把每個 <a href> 最前、最後的 $ 清掉（顯示文字也一併清），保證點開網址永遠正確。
// 只清「開頭／結尾」的 $，絕不碰網址中間的 $（例如 ?t=...$1... 這種查詢參數留著不動）。
function sanitizeAnchors(html){
  if(!html||html.indexOf('$')<0)return html;   // 完全沒有 $，直接原樣回傳（最快路徑）
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  const trimEdge=s=>String(s||'').replace(/^[\s$]+/,'').replace(/[\s$]+$/,'');
  const anchors=tmp.querySelectorAll('a[href]');
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i];
    const href=a.getAttribute('href')||'';
    const trimmed=trimEdge(href);
    if(trimmed!==href)a.setAttribute('href',trimmed);   // 移除開頭/結尾的 $ 與空白
    // 顯示文字前後的 $ 也一併清（避免「$文字$」殘留在可見處）
    if(a.firstChild&&a.firstChild.nodeType===Node.TEXT_NODE){
      const t=trimEdge(a.firstChild.textContent);
      if(t!==a.firstChild.textContent)a.firstChild.textContent=t;
    }
  }
  return tmp.innerHTML;
}

// 移除消毒後殘留的 SVG 空殼（foreignObject/script 動畫被拔掉後只剩 <svg width height>）
// DOMPurify 預設允許 svg/circle/rect 等圖形標籤但擋 foreignObject/script/on*；
// foreignObject 包排版文字的卡片型 SVG 消毒後就變「看不見但佔 width×height 的空盒」。
// 不放寬消毒器（XSS 風險），改為整顆移除；<pre><code> 內的原始碼文字不受影響。
function stripEmptySvg(html){
  if(!html||html.indexOf('<svg')<0)return html;
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  tmp.querySelectorAll('svg').forEach(svg=>{
    // 有實際圖形子元素（path/circle/rect/ellipse/line/polyline/polygon/text/use/image/g）就保留
    if(svg.querySelector('path,circle,rect,ellipse,line,polyline,polygon,text,use,image,g'))return;
    svg.remove();
  });
  // 空殼被移除後若留下空 <p>（只有 <br> 或空白），一併清掉避免殘留大段空白
  tmp.querySelectorAll('p').forEach(p=>{
    if(p.querySelector('svg,img,pre,code,a,table,.katex'))return;
    if((p.textContent||'').trim()==='')p.remove();
  });
  return tmp.innerHTML;
}

// 為程式碼區塊加上複製按鈕
// ===== 剪貼簿（PC / 手機皆可）=====
// 同步備援方案：隱藏 textarea + execCommand('copy')，相容性最好（手機瀏覽器、file:// 皆可用）
function copyTextSync(text){
  text=String(text||'');
  if(!text)return false;
  const textarea=document.createElement('textarea');
  textarea.value=text;
  textarea.setAttribute('readonly','');
  textarea.style.position='fixed';
  textarea.style.left='0';
  textarea.style.top='0';
  textarea.style.width='1px';
  textarea.style.height='1px';
  textarea.style.padding='0';
  textarea.style.border='0';
  textarea.style.outline='0';
  textarea.style.opacity='0.01';
  textarea.style.zIndex='999999';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  textarea.setSelectionRange(0,textarea.value.length);
  let success=false;
  try{success=document.execCommand('copy')}catch(e){}
  textarea.blur();
  document.body.removeChild(textarea);
  return success;
}
// 統一入口：優先 Clipboard API，失敗自動退回 execCommand
function copyToClipboard(text){
  text=String(text||'');
  if(!text)return Promise.resolve(false);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text)
      .then(()=>true)
      .catch(()=>Promise.resolve(copyTextSync(text)));
  }
  return Promise.resolve(copyTextSync(text));
}

// ===== 訊息朗讀（TTS）：訊息選單的「🔊 朗讀」=====
let ttsUtter=null,ttsMsg=null;
function ttsSupported(){return typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined'}
function ttsVoice(){
  try{
    const vs=window.speechSynthesis.getVoices?speechSynthesis.getVoices():[];
    return vs.find(v=>/zh[-_]?(TW|Hant)/i.test(v.lang||''))||vs.find(v=>/^zh/i.test(v.lang||''))||null;
  }catch(e){return null}
}
// 朗讀狀態 → 畫面：正在朗讀的那則訊息加 .speaking，讓 ⋮ 下方的 ⏹ 顯示出來（其餘列清除）
function updateTtsBtn(){
  document.querySelectorAll('.msg-row.speaking').forEach(r=>r.classList.remove('speaking'));
  if(!ttsMsg||!chats[activeChatId])return;
  const idx=chats[activeChatId].messages.indexOf(ttsMsg);
  if(idx<0)return;   // 該則已被刪除或屬於其他對話：不顯示
  const row=document.querySelector(`.msg-row[data-idx="${idx}"]`);
  if(row)row.classList.add('speaking');
}
function ttsStop(){
  try{speechSynthesis.cancel()}catch(e){}
  ttsUtter=null;ttsMsg=null;
  updateTtsBtn();
}
function toggleSpeak(m){
  if(!ttsSupported()){showToast('此瀏覽器不支援語音朗讀','warn');return}
  if(ttsUtter&&ttsMsg===m){ttsStop();showToast('已停止朗讀','warn');return}   // 同一則再點一次 = 停止
  const text=contentText(m)
    .replace(/```[\s\S]*?```/g,'（程式碼區塊省略）')
    .replace(/`([^`\n]*)`/g,'$1')
    .replace(/\$\$?([^$\n]{1,200}?)\$\$?/g,'（公式）')
    .replace(/^\s*[#>*\-]+\s?/gm,'')
    .trim();
  if(!text){showToast('這一則沒有可朗讀的文字','warn');return}
  ttsStop();
  const u=new SpeechSynthesisUtterance(text.slice(0,4000));   // 上限保護：超長訊息不餵爆引擎
  u.lang='zh-TW';
  const v=ttsVoice();if(v)u.voice=v;
  u.rate=1.25;
  u.pitch=1.8;
  u.onend=()=>{ttsUtter=null;ttsMsg=null;updateTtsBtn()};
  u.onerror=()=>{ttsUtter=null;ttsMsg=null;updateTtsBtn()};
  ttsUtter=u;ttsMsg=m;
  try{speechSynthesis.speak(u);updateTtsBtn();showToast('朗讀中… 點 ⏹ 可停止朗讀','success')}
  catch(e){ttsUtter=null;ttsMsg=null;updateTtsBtn();showToast('朗讀失敗','warn')}
}

// ===== 儲存訊息圖片 =====
function extFromMime(t){
  t=String(t||'').toLowerCase();
  if(t.includes('jpeg')||t.includes('jpg'))return'.jpg';
  if(t.includes('webp'))return'.webp';
  if(t.includes('gif'))return'.gif';
  return'.png';
}
// 觸發瀏覽器下載（dataURL / blobURL 皆可）
function downloadHref(href,name){
  const a=document.createElement('a');
  a.href=href;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
// 抓取遠端圖片成 Blob：直接抓 → 失敗改走 CORS 圖片代理（Agnes 圖床無 CORS header，瀏覽器 JS 讀不到，需借代理）
// 會驗證回傳內容確實是圖片（避免代理的錯誤頁面被當成圖片）；全部失敗回傳 null。
// 注意：圖片 URL 會經過第三方代理伺服器。
async function blobIsImage(blob){
  const t=String(blob.type||'').toLowerCase();
  if(t.startsWith('image/'))return true;
  try{
    const b=new Uint8Array(await blob.slice(0,16).arrayBuffer());
    if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)return true;                // PNG
    if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return true;                             // JPEG
    if(b[0]===0x47&&b[1]===0x49&&b[2]===0x46)return true;                             // GIF
    if(b[0]===0x52&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50)return true; // WEBP
  }catch(e){}
  return false;
}
async function fetchRemoteImage(url,timeoutMs){
  timeoutMs=timeoutMs||TIMEOUT.remoteImage;
  const enc=encodeURIComponent(url);
  const tries=[
    url,                                            // 有些圖床其實有開 CORS，先直接試
    'https://wsrv.nl/?url='+enc+'&n=-1',            // images.weserv.nl 圖片代理（實測對 Agnes 圖床有效，ACO:*）
    'https://api.allorigins.win/raw?url='+enc,      // allorigins 備援
    'https://api.codetabs.com/v1/proxy?quest='+enc, // codetabs 備援
  ];
  for(let i=0;i<tries.length;i++){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
      const r=await fetch(tries[i],{signal:ctrl.signal});
      clearTimeout(timer);
      if(!r.ok)continue;
      const blob=await r.blob();
      if(blob&&blob.size>0&&await blobIsImage(blob)){
        dbg('[Chat] 圖片抓取成功（來源：'+(i===0?'直接':('代理 #'+i))+'），大小:',blob.size);
        return blob;
      }
      dbg('[Chat] 圖片來源 #'+i+' 回應非圖片（type:',blob.type,'size:',blob.size,'）');
    }catch(e){}
  }
  return null;
}
// 儲存訊息內的所有圖片（從 IndexedDB 取出：dataURL / Blob / 遠端 URL）
async function saveMessageImages(m){
  const parts=Array.isArray(m.content)?m.content.filter(p=>p.type==='image_ref'&&p.id):[];
  if(!parts.length){showToast('此訊息沒有圖片','warn');return}
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const base=`image_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  let saved=0,opened=0,failed=0;
  for(let i=0;i<parts.length;i++){
    const name=parts.length>1?`${base}_${i+1}`:base;
    try{
      const data=await mediaGet(parts[i].id);
      if(data==null){failed++;continue}
      if(typeof data==='string'){
        if(data.startsWith('data:')){
          downloadHref(data,name+extFromMime(data.slice(0,data.indexOf(','))));saved++;
        }else{
          // 遠端 URL：直接抓或走 CORS 代理抓回 Blob 再下載；都失敗才退回開新分頁讓使用者手動另存
          showToast('正在取得圖片…');
          const blob=await fetchRemoteImage(data);
          if(blob){
            const u=URL.createObjectURL(blob);
            downloadHref(u,name+extFromMime(blob.type));saved++;
            setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
          }else{
            const a=document.createElement('a');
            a.href=data;a.target='_blank';a.rel='noopener';
            document.body.appendChild(a);a.click();a.remove();
            opened++;
          }
        }
      }else if(data instanceof Blob){
        const u=URL.createObjectURL(data);
        downloadHref(u,name+extFromMime(data.type));saved++;
        setTimeout(()=>URL.revokeObjectURL(u),30000);   // A2：用完釋放
      }else failed++;
    }catch(e){failed++}
  }
  if(opened)setTimeout(()=>showToast('無法取得圖片資料，已開新分頁，請長按／右鍵另存圖片','warn'),saved?1800:0);
  if(failed&&!saved&&!opened)setTimeout(()=>showToast('儲存失敗：找不到圖片資料','warn'),(saved||opened)?1800:0);
}

// 取出 <pre> 的純文字（排除按鈕本身與結尾空行）
function preText(pre){
  const clone=pre.cloneNode(true);
  clone.querySelectorAll('.code-copy,.code-view').forEach(b=>b.remove());
  return (clone.textContent||'').replace(/\n+$/,'');
}

// 只負責「把按鈕加進 HTML」，點擊行為改由下方 messagesEl 的事件委派處理。
// 原因：定稿訊息的 HTML 會被快取並以 innerHTML 灌回 DOM，逐顆按鈕掛的監聽不會跟著回來。
function enhanceCodeBlocks(root){
  root.querySelectorAll('pre').forEach(pre=>{
    if(pre.dataset.enhanced)return;
    pre.dataset.enhanced='1';
    const btn=document.createElement('button');
    btn.className='code-copy';btn.type='button';btn.textContent='複製';
    btn.title='複製程式碼';
    pre.appendChild(btn);

    // HTML / SVG 程式碼加上即時預覽按鈕
    const codeEl=pre.querySelector('code');
    const lang=((codeEl&&codeEl.className.match(/language-([\w-]+)/))||[])[1]||'';
    const raw=preText(pre);
    const looksHtml=/^\s*(<!DOCTYPE\s+html|<html[\s>]|<svg[\s>])/i.test(raw);
    if(looksHtml||/^(html|svg|xml|xhtml)$/i.test(lang)){
      const pv=document.createElement('button');
      pv.className='code-copy code-view';pv.type='button';pv.textContent='👁 預覽';
      pv.title='另開視窗預覽';
      pre.appendChild(pv);
    }
  });
}
// 程式碼區塊按鈕：事件委派（掛在容器上，快取 HTML 重新灌回 DOM 後仍然有效）
// 內容在點擊當下才從 <pre> 取出，不會因為快取而拿到舊資料。
messagesEl.addEventListener('click',e=>{
  if(!e.target||!e.target.closest)return;
  if(e.target.closest('#msgTopSentinel')){loadMoreMessagesUp();return}   // P2：手動載入更早的訊息
  const btn=e.target.closest('.code-copy');

    if(ok){
      btn.textContent='已複製';
      setTimeout(()=>{if(btn.isConnected)btn.textContent='複製'},1500);
    }else showToast('複製失敗','warn');
  });
});

// ===== R3：彈出層「手機返回鍵關閉」共用機制 =====
// 每個可被返回鍵關閉的彈出層在此註冊歷史旗標 key：開層 histPush() 推入一筆歷史狀態，
// 返回鍵觸發 popstate 時由單一分派表關閉最上層；用 ✕／背景／Esc 關閉時 histPop()
// 同步退掉推入的狀態（由 popstate 觸發的關閉傳 skipBack=true——歷史已彈掉，不能再退）。
const HIST_LAYERS={
  confirm:'chatcatConfirm',        // 確認框
  sources:'chatcatSources',        // 搜尋來源面板
  lightbox:'chatcatLightbox',      // 圖片燈箱
  gallery:'chatcatGallery',        // 圖片庫
  settings:'chatcatSettings',      // 設定
  personaName:'chatcatPersonaName', // 自訂人格命名／重命名彈窗（疊在設定面板上）
  bmRename:'chatcatBmRename',     // 書籤重新命名彈窗（疊在書籤清單上）
  export:'chatcatExport',          // 匯出／匯入
  preview:'chatcatPreview',        // 程式碼即時預覽
  editBranch:'chatcatEditBranch',  // 「編輯並重送」確認
  bookmark:'chatcatBookmark'       // 書籤清單
};
const histArmed={};   // layerId → 推入的歷史狀態是否仍掛在堆疊上
function histPush(layer){   // 開層時推入歷史狀態（已推過不重複推）
  if(histArmed[layer])return;
  histArmed[layer]=true;
  try{history.pushState({[HIST_LAYERS[layer]]:1},'')}catch(e){histArmed[layer]=false}
}
function histPop(layer,skipBack){   // 關層時同步退掉推入的狀態
  if(!histArmed[layer])return;
  histArmed[layer]=false;
  if(!skipBack)history.back();   // popstate 觸發時歷史已彈掉，不能再退（避免連退兩層）
}

// ===== 程式碼即時預覽（沙箱 iframe）=====
function openPreview(code){
  const frame=document.getElementById('previewFrame');
  const s=code.trim();
  const isSvg=/^<svg[\s>]/i.test(s)||/^<\?xml[\s\S]*?<svg[\s>]/i.test(s);
  frame.srcdoc=isSvg
    ?`<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#fff}svg{max-width:96%;max-height:96%}</style></head><body>${s}</body></html>`
    // 外部連結先確認再開：避免預覽裡的程式碼一被點就把使用者帶去陌生網站
    :`<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><style>body{margin:8px;font-family:sans-serif}</style></head><body>${s}<script>document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;var h=a.getAttribute('href')||'';if(/^https?:\\/\\//i.test(h)&&!confirm('開啟外部連結？\\n'+h))e.preventDefault();},true);<\/script></body></html>`;
  document.getElementById('previewModal').classList.add('open');
  histPush('preview');   // 推入一筆歷史狀態：手機返回鍵關預覽，而不是離開頁面
}
function closePreview(){
  document.getElementById('previewModal').classList.remove('open');
  histPop('preview');   // 手機返回鍵同步：用 ✕／背景／Esc 關閉時退掉推入的狀態
  document.getElementById('previewFrame').srcdoc='';
}
document.getElementById('previewClose').addEventListener('click',closePreview);
document.getElementById('previewOpen').addEventListener('click',()=>{
  const frame=document.getElementById('previewFrame');
  if(!frame.srcdoc)return;
  const url=URL.createObjectURL(new Blob([frame.srcdoc],{type:'text/html'}));
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
});
document.getElementById('previewModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closePreview()});

// 處理訊息內容：支援純文字、含圖片的多模態陣列，以及思考過程（reasoning）
// 二之1：alreadyFixed=true 表示呼叫端已修復過 Jina 壞連結（串流中的增量修復器），不再重跑一次
function renderContent(m,alreadyFixed){
  const fx=alreadyFixed?(s=>String(s==null?'':s)):fixJinaLinks;
  let html='';
  if(m.thinking&&getShowThinking())html+=`<details class="thinking"${m.thinkingOpen?' open':''}><summary>💭 思考過程</summary><div class="thinking-body">${escHtml(m.thinking)}</div></details>`;
  const c=m.content;
  if(typeof c==='string')html+=mdToHtml(fx(c));   // 修復舊訊息中 Jina 壞連結格式（顯示層）
  else if(Array.isArray(c)){
    c.forEach(p=>{
      if(p.type==='image_ref'&&p.id){
        html+=`<img class="msg-img${p.large?' large':''}" data-media-id="${escHtml(p.id)}" alt="圖片">`;
      }else if(p.type==='image_url'&&p.image_url&&p.image_url.url){
        // B6：僅相容極舊資料（遷移前直接內嵌 URL 的訊息）；新資料一律為 image_ref
        html+=`<img src="${escHtml(p.image_url.url)}" class="msg-img" alt="attached">`;
      }else if(p.type==='text'&&p.text){
        html+=mdToHtml(fx(p.text));
      }
    });
  }else html+=formatMsg(String(c));
  return html;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
// 二：打字／狀態列元素工廠（取代多處重複的 createElement + className='typing'）
function makeTypingEl(){const d=document.createElement('div');d.className='typing';return d;}
// R2：帶內容（與可選 id）的狀態列工廠；原本 5 處各寫一次 createElement+className+innerHTML
function makeStatusEl(html,id){
  const d=makeTypingEl();
  if(id)d.id=id;
  if(html)d.innerHTML=html;
