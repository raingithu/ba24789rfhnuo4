}

async function sendMessage(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(isStreaming){
    // D8：串流中送出 → 排隊，目前回覆完成後自動送出（送出鈕此時仍是「停止」，行為不變）
    if(text||pendingImages.length){
      pendingQueue={text:text,images:pendingImages.slice(),imgMode:imgMode};   // 連圖片模式一起排隊，避免排隊期間切換模式造成送出時 mode 錯亂
      pendingImages=[];
      renderAttachBar();
      showToast('已排隊：目前回覆完成後自動送出','success');
    }
    return;
  }
  // 若無活躍對話，自動建立
  if(!activeChatId)newChat();
  if(!text && !pendingImages.length)return;

  const apiKey=getApiKey();
  if(!apiKey){
    showToast('請先設定 API Key（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }

  input.value='';layoutMsgInput();updateSendButton();   // 清空並重置輸入框高度／置中狀態、三態按鈕切換
  updateImgModeHint();

  if(!chats[activeChatId].messages.length){
    chats[activeChatId].title=(text||'📷 圖片').slice(0,30)+((text||'📷 圖片').length>30?'…':'');
    chats[activeChatId].titleFromMsg=true;   // 標記：此標題為暫用（取自首則訊息），第一輪結束後由 autoTitle 覆蓋
    saveChatsData(chats);renderChatList();
  }
  const userContent=pendingImages.length
    ? [{type:'text',text},...pendingImages.map(u=>({type:'image_ref',id:u.id}))]
    : text;
  chats[activeChatId].messages.push({role:'user',content:userContent,createdAt:Date.now()});   // C3：記錄時間戳
  touchChat(activeChatId);   // 最後活動時間更新：對話依此往頂端移動
  const imgs=pendingImages.slice();
  clearPendingImages();   // 預覽用 objectURL 一併釋放
  renderAttachBar();
  saveDraft();            // 送出後清空該對話的草稿
  saveChatsData(chats,activeChatId);   // A1：只標記這場對話 dirty
  renderChatList();   // 有新訊息時，把這則對話移回分組頂端
  appendMessageRow(chats[activeChatId].messages[chats[activeChatId].messages.length-1]);   // 只附加新訊息列，不重建（畫面不跑動）
  if(shouldAutoScroll())scrollToBottom(false);   // 使用者送出訊息後：自動捲動開啟且仍貼底才捲到底；關閉或已往上捲就不動（維持使用者控制權）
  if(imgMode){
    const imgData=[];   // 送出前才把 Blob 轉成 dataURL（模型要的是可內嵌的資料）
    for(const it of imgs){
      try{const d=await mediaToDataURL(it.id);if(d)imgData.push(d)}catch(e){}
    }
    await requestImage({prompt:text,images:imgData});
  }
  else if(extractUrls(text).length){
    // 訊息含網址：讀取網頁內容讓 AI 分析（貼網址意圖明確，不需關鍵字；優先於搜尋關鍵字）
    await requestPageRead(text,extractUrls(text));
  }
  else if(matchSearchKeyword(text)){
    // 一之4：關鍵字命中改走兩條路，避免誤觸發付費搜尋
    // A. 後端支援 tools → 交給模型判斷（關鍵字只當作提示）。原本子字串命中就直接搜尋，
    //    「什麼是搜尋引擎」這類純名詞解釋也會白白扣一次 Tavily 額度；交給模型後，
    //    它只在真的需要即時資訊時才呼叫 web_search（此路徑也省下每次的查詢改寫成本）。
    // B. 後端不支援 tools → 沿用原本的關鍵字快速通道（改寫 → 搜尋 → 注入 context）。
    if(!TOOL_STATE.unsupported){
      requestAI({_keywordHint:true});
      return;
    }
    // 關鍵字命中：目前引擎有設定對應 key 才走搜尋流程，否則提示並照常送純文字請求
    const engineOk=WEB_SEARCH.engine==='jina'
      ? /^jina_/.test(WEB_SEARCH.jinaKey||'')
      : /^tvly-/.test(WEB_SEARCH.tavilyKey||'');
    if(engineOk)await requestWebSearch(text);
    else{
      showToast('偵測到搜尋關鍵字：尚未設定 '+(WEB_SEARCH.engine==='jina'?'Jina':'Tavily')+' API Key（請在檔案內搜尋「WEB_SEARCH」填入）','warn');
      requestAI();
    }
  }
  else requestAI();
}

// 組文本模型的上下文：把歷史中的 image_ref 從 IndexedDB 還原成文本模型可讀的 image_url
async function histToMsgs(hist){
  const IMG_LIMIT=4;   // B4：文字請求最多附「最後 4 張」圖；更舊的以 [圖片] 文字替代，避免請求爆量
  const allIds=[];
  hist.forEach(m=>{if(Array.isArray(m.content))m.content.forEach(p=>{if(p.type==='image_ref'&&p.id)allIds.push(p.id)})});
  const keep=new Set(allIds.slice(-IMG_LIMIT));
  const out=[];
  for(const m of hist){
    const c=m.content;
    if(Array.isArray(c)){
      const parts=[];
      for(const p of c){
        if(p.type==='image_ref'&&p.id){
          if(keep.has(p.id)){
            const url=await mediaToDataURL(p.id);   // C1：帶快取的 id→dataURL（同一張圖每輪請求不再重複轉檔）
            if(url)parts.push({type:'image_url',image_url:{url}});
          }else if(!parts.some(q=>q.type==='text'&&q.text==='[圖片]')){
            parts.push({type:'text',text:'[圖片]'});
          }
        }else if(p.type==='text'&&p.text){parts.push({type:'text',text:fixJinaLinks(p.text)})}   // 順手修復歷史中照抄 Jina 的壞連結格式，避免模型模仿
        else parts.push(p);
      }
      out.push({role:m.role,content:parts});
    }else out.push({role:m.role,content:fixJinaLinks(c)});
  }
  return out;
}

// ===== C5：共用「503/queue is full/逾時自動重試」fetch（文字與圖片請求共用同一套模式）=====
// 回傳成功的 Response；使用者主動中止（AbortError）不重試直接丟出；
// 可重試錯誤用盡次數後丟出 Error（訊息截斷 300 字，與圖片請求一致）
async function fetchWithRetry(url,options,cfg){
  cfg=cfg||{};
  const timeoutMs=cfg.timeoutMs||TIMEOUT.http;   // 單次嘗試的連線逾時（回應表頭前）
  const maxAttempts=cfg.maxAttempts||4;       // 最多嘗試次數
  const onStatus=cfg.onStatus||null;          // 重試進度回呼（更新狀態列）
  const onWait=cfg.onWait||null;              // 等待重試間隔的 callback（讓呼叫端把狀態文字切回「正在…」，避免「伺服器忙碌」殘留至下一輪請求完成）
  const prefix=cfg.statusPrefix||'';          // 狀態文字前綴（如 '🖼️ '）
  const isAborted=cfg.isAborted||(()=>false); // 等待重試間隔時檢查是否已被中止
  const getKey=cfg.getKey||null;              // 多 Key 輪替：每次嘗試前呼叫，取得本次要用的 API Key（備用 Key 輪替用）
  let resp=null,attempt=0,timedOut=false;
  while(true){
    attempt++;
    timedOut=false;
    const curKey=getKey?getKey():null;   // 本次要用的 Key（429/401/403 時標記冷卻並換下一把）
    if(curKey&&options&&options.headers&&typeof options.headers==='object')options.headers.Authorization='Bearer '+curKey;
    const timeoutId=setTimeout(()=>{timedOut=true;cfg.abort&&cfg.abort()},timeoutMs);
    try{
      resp=await fetch(url,options);
    }catch(e){
      clearTimeout(timeoutId);
      if(e.name==='AbortError'&&!timedOut)throw e;   // 使用者主動停止，不重試
      if(attempt>=maxAttempts)throw e;               // 重試次數用完
      if(curKey)rotateKeyPtr();   // 連線逾時／回應慢：下一把 Key 換著試（不標記失敗）
      const wait=Math.min(5*attempt,15);
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+'連線逾時，'+wait+' 秒後自動重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      dbg('[Chat] 連線逾時，自動重試第 '+(attempt+1)+' 次');
      await new Promise(r=>setTimeout(r,wait*1000));
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      if(onWait)onWait(attempt+1);   // 把狀態文字切回「正在…」避免「連線逾時」殘留
      continue;
    }
    clearTimeout(timeoutId);
    if(resp.ok)break;
    const errText=await resp.text();
    // 多 Key 輪替：限流（429）或 Key 失效（401/403）→ 標記該 Key 冷卻，立刻換下一把重試（不等待）
    if(curKey&&(resp.status===429||resp.status===401||resp.status===403)&&attempt<maxAttempts){
      markKeyFail(curKey,resp.status===429?60000:10*60000);   // 限流冷卻 60 秒；401/403 視為無效，冷卻 10 分鐘
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+(resp.status===429?'Key 限流':'Key 無效')+'，切換備用重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      dbg('[Chat] HTTP '+resp.status+'，換備用 Key 重試（第 '+(attempt+1)+' 次）');
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      continue;
    }
    // 佇列已滿 / 伺服器忙碌 → 自動重試
    if((resp.status===503||/queue is full|please retry later/i.test(errText))&&attempt<maxAttempts){
      const wait=Math.min(5*attempt,15);
      if(onStatus)onStatus('<span class="spinner"></span>'+prefix+'伺服器忙碌，'+wait+' 秒後自動重試（第 '+(attempt+1)+'/'+maxAttempts+' 次）');
      dbg('[Chat] 伺服器忙碌（503 queue is full），第 '+attempt+' 次失敗，'+wait+' 秒後重試');
      await new Promise(r=>setTimeout(r,wait*1000));
      if(isAborted())throw Object.assign(new Error('aborted'),{name:'AbortError'});
      if(onWait)onWait(attempt+1);   // 把狀態文字切回「正在…」避免「伺服器忙碌」殘留 30~90 秒
      continue;
    }
    // 重試次數用盡：把常見錯誤代碼轉成友善中文訊息，避免把 JSON 錯誤內容直接丟給使用者
    const err=new Error();
    if(resp.status===503||/queue is full|please retry later/i.test(errText)){
      err.message='伺服器忙碌中，請稍後再試';
    }else if(resp.status===429){
      err.message='請求過於頻繁，請稍後再試';
    }else if(resp.status===401||resp.status===403){
      err.message='API Key 無效或權限不足';
    }else if(resp.status>=500){
      err.message='伺服器錯誤（'+resp.status+'），請稍後再試';
    }else{
      err.message=`HTTP ${resp.status}: ${errText.slice(0,300)}`;
    }
    throw err;
  }
  return resp;
}

// ===== 網路搜尋：關鍵字偵測 → Tavily 搜尋 → Jina Reader 讀全文 → 注入 context 後走正常文字請求 =====
// 一之4：定義型問句不該觸發付費搜尋（「什麼是搜尋引擎」並非要上網查，只是問名詞解釋）
const SEARCH_STOP_PATTERNS=/^(什麼是|什麼叫|什麼叫做|何謂|何為)/;
function matchSearchKeyword(t){
  const s=String(t||'').trim();
  if(!s)return false;
  if(SEARCH_STOP_PATTERNS.test(s))return false;
  return SEARCH_KEYWORDS.some(k=>s.includes(k));
}

// 一之1：搜尋查詢健全性檢查（三條搜尋路徑共用：tool calling／關鍵字／重新搜尋）
// 背景：串流若在 tool_calls 的 arguments 傳到一半時斷線，JSON.parse 會失敗，正則保底取出來的
// 可能只是殘缺片段或亂碼（例：'{"query":"高雄天'）。這種字串打去 Tavily 只會白扣額度，
// 因此送出前三道檢查：長度、殘留符號／控制字元、有效內容比例與重複字元（亂碼）偵測。
function isSaneQuery(q){
  const s=String(q==null?'':q).trim();
  if(s.length<2||s.length>120)return false;
  if(/[{}[\]\\"'`]/.test(s))return false;                  // 殘留 JSON 結構、反斜線或引號
  if(/[\u0000-\u001f\u007f]/.test(s))return false;         // 控制字元
  let meaningful='';
  try{meaningful=s.replace(/[\s\p{P}\p{S}]/gu,'')}         // 去掉空白與標點符號後的有效字元
  catch(e){meaningful=s.replace(/\s/g,'')}                 // 舊瀏覽器不支援 Unicode 屬性逃脫時的保底
  if(meaningful.length<2)return false;
  if(meaningful.length>=4){   // 4 字以上才做亂碼偵測（避免「好好吃」這類疊字短查詢被誤擋）
    const freq=Object.create(null);let top=0;
    for(const ch of meaningful){freq[ch]=(freq[ch]||0)+1;if(freq[ch]>top)top=freq[ch]}
    if(top/meaningful.length>0.75)return false;            // 單一字元佔比過高 → 視為亂碼
  }
  return true;
}

// 修復 Jina Reader 轉換 PDF／LaTeX 來源、以及模型照抄時產生的連結格式問題：
//   1) [文字] $https://...$（含 ] 與 $ 之間有空白／強調符號）→ [文字](https://...)（轉成合法 Markdown 連結）
//   2) $https://...$ → https://...（去掉 LaTeX 式 $ 包裹）
//   3) 行首孤立 $https://... → https://...（$ 只殘留開頭時也移除）
// 不先處理的話，模型會照抄壞格式，回答裡出現「[標題]$網址$」這種失效連結。
// 注意：只處理「成對包裹」與「行首孤立」的 $，絕不刪網址中間的 $（如查詢參數），
// 避免誤刪正常網址；渲染後再由 sanitizeAnchors 做最後一道 $ 清除保險。
function fixJinaLinks(s){
  return String(s||'')
    // [文字] $url$ / [文字]$url$：允許 ] 與 $ 之間有空白
    .replace(/\[\s*([^\]\n]{1,200}?)\s*\]\s*\$+(https?:\/\/[^\s<>$]+?)\$+/g,'[$1]($2)')
    // **文字** $url$：被 Markdown 強調符號包住的連結文字也還原成連結
    .replace(/\*{1,3}([^*\n]{1,100}?)\*{1,3}\s*\$+(https?:\/\/[^\s<>$]+?)\$+/g,'[$1]($2)')
    // 純 $url$ → url
    .replace(/\$+(https?:\/\/[^\s<>$]+?)\$+/g,'$1')
    // 行首孤立 $ 後緊接網址 → 移除該 $
    .replace(/^\s*\$+(?=https?:)/gm,'');
}

// 二之1：串流中的增量修復器
// 原本每個 RAF 都對「整段累積文字」重跑一次 fixJinaLinks（4 道正則 × 每次全文 → 隨長度呈平方成長），
// 串流結束、renderContent、histToMsgs 又各跑一次。改為只修復新追加的片段：
// fixJinaLinks 的四道正則都不跨行（標題與 URL 的字元類別皆排除換行），故以「換行」為安全切割點。
// 回傳值＝已修復的前段＋尚未修復的最後一行（串流結束時由呼叫端做一次完整修復，不會漏掉）。
function makeFixStreamer(){
  let fixedLen=0,fixed='';
  return function(text){
    const s=String(text||'');
    if(s.length<=fixedLen)return fixed+s.slice(fixedLen);   // 理論上不會發生（full 只增不減）：保守回傳
    const nl=s.lastIndexOf('\n');
    if(nl>=fixedLen){                                       // 有完整的行可修：一次修好接到已修復的前段
      fixed+=fixJinaLinks(s.slice(fixedLen,nl+1));
      fixedLen=nl+1;
    }
    return fixed+s.slice(fixedLen);                         // 尾端未結束的那一行原樣輸出，下輪或結束時再修
  };
}

// 用 Jina Reader 把網頁轉成純文字（Markdown）；失敗回空字串（單頁失敗不影響整體）
async function jinaFetch(url,sig){
  try{
    const ac=new AbortController();
    if(sig&&sig.aborted)ac.abort();
    else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});   // 外部「■ 停止」鈕同步中斷
    const tid=setTimeout(()=>ac.abort(),TIMEOUT.pageRead);   // 單頁讀取逾時
    const headers={
      'Accept':'text/plain',
      'X-Locale':'zh-TW',               // 結果回繁中（與搜尋端一致）
      'X-Retain-Images':'none',         // 跳過圖片（氣象圖示、logo 等都對回答無用，省 token）
      'X-Base':'final'                  // 取得 redirect 終點的 URL（cwa.gov.tw/V8/C/ → index.html），避免抓到重導頁造成 422
    };
    // r.jina.ai 走匿名（不附 key）：避免 Jina 搜尋額度被讀全文的請求吃光
    // 匿名限流按 IP，多人共用時，避免吃同一 apikey額度，匿名的不同 IP 較難打滿 20 rpm；單頁讀取失敗回空字串由 buildSearchContext 走搜尋自帶 content 兜底
    const resp=await fetch(WEB_SEARCH.jinaReader+url,{signal:ac.signal,headers});
    clearTimeout(tid);
    if(!resp.ok)return '';
    return await resp.text();
  }catch(e){return ''}
}

// 查詢改寫：使用者訊息常依賴上下文（如 AI 說無法查天氣後，使用者補「那你幫我查一下」），
// 直接拿去搜尋會得到不相關的結果。這裡先用文字模型（非串流）把最新訊息依對話歷史補齊成
// 「獨立的搜尋字串」，同時順便清掉「幫我查」「搜尋」等指令詞。
// 注意：思考型模型的推理會吃掉 max_tokens，故給 1000 並過濾 <think>／reasoning；失敗回空字串，由呼叫端降級。
async function rewriteSearchQuery(query){
  try{
    const chat=chats[activeChatId];
    let hist='';
    if(chat){
      chat.messages.filter(m=>!m.error).slice(-6).forEach(m=>{   // 取最近 6 則（去除錯誤訊息）作為上下文
        const t=contentText(m).slice(0,300);
        if(t)hist+=(m.role==='user'?'使用者: ':'AI: ')+t+'\n';
      });
    }
    const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
    const sys='你是搜尋查詢產生器。根據對話上下文，把使用者最新訊息改寫成一條適合搜尋引擎的獨立查詢字串。規則：\n'+
      '1. 補齊代名詞與省略的內容，指涉的東西要寫清楚。\n'+
      '2. 必須保留原主題的具體名詞（城市、地點、事物）。例如前面在問「高雄天氣」，使用者只說「那你查一下」→ 就查「高雄 今天 天氣」。\n'+
      '3. 若使用者追問來源或細節（如「中央氣象署的資料呢」），要把來源與原主題合併，例如「中央氣象署 高雄 天氣」，不能只搜來源名稱。\n'+
      '4. 去除「幫我查」「搜尋一下」等指令詞。若需要日期，用具體日期（現在時間是 '+today+'）。\n'+
      '只輸出查詢字串本身，不要任何解釋、引號或多餘文字。';
    const resp=await fetch(getEndpoint()+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+pickApiKey()},
      body:JSON.stringify({
        model:getModel(),stream:false,max_tokens:1000,temperature:0.2,
        messages:[
          {role:'system',content:sys},
          {role:'user',content:(hist?('對話歷史:\n'+hist+'\n'):'')+'最新訊息: '+query}
        ]
      })
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const j=await resp.json();
    const raw=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    dbg('[Search] 改寫原始輸出:',raw);
    let q=raw.replace(/<think>[\s\S]*?(<\/think>|$)/g,'')          // 思考型模型：濾掉思考段（含未閉合）
      .split('\n').map(l=>l.trim()).filter(Boolean).pop()||'';     // 取最後一行非空文字（模型常先客套）
    q=q.replace(/^(查詢|搜尋|查詢字串|搜尋字串)\s*[:：]\s*/,'')     // 去除「查詢：」前綴
       .replace(/^["「『`']+|["」』`']+$/g,'').trim();              // 去前後引號
    if(!q||q.length>120)return '';                                 // 空值或過長視為無效改寫
    return q;
  }catch(e){
    dbg('[Search] 查詢改寫失敗:',e);
    return '';
  }
}

// 客戶端降級：把訊息中的搜尋指令詞／語尾助詞剝掉，取出實際要查的主題（剝完不足 2 字視為無主題）
function extractSearchTopic(text){
  let s=String(text||'');
  SEARCH_KEYWORDS.forEach(k=>{s=s.split(k).join(' ')});
  s=s.replace(/^(那你|那|就|再|然後|幫我|麻煩|請|拜託)+/g,'')
     .replace(/(一下|一下下|看看|好嗎|可以嗎|好不好|嘛|吧|囉|喔|哦|喵)+$/g,'')
     .replace(/[，,。!！?？～、\s]+/g,' ').trim();
  return s.length>=2?s:'';
}

// 從訊息中抓出網址（URL 本體限 ASCII 合法字元，避免把後面接的中文一起抓進來；去尾端標點、去重複、限量）
function extractUrls(text){
  const m=String(text||'').match(/https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/g)||[];
  const urls=m.map(u=>u.replace(/[。，、！？；：」』】〉》!?,;\)\]}'"…．]+$/,''));
  return [...new Set(urls)].slice(0,WEB_SEARCH.urlMaxPages);
}

// 一之6：網頁內容注入量自適應
// 3 頁 × 8000 字 ≈ 上萬 token，再疊上長對話歷史就可能撐爆模型 context，觸發「回覆中斷」。
// 改以總預算 urlCtxBudget 扣掉對話歷史的估計長度，動態決定每頁注入多少字（歷史越長，每頁給越少）。
function adaptivePageChars(pageCount){
  const n=Math.max(1,pageCount||1);
  let histChars=0;
  const chat=chats[activeChatId];
  if(chat)chat.messages.slice(-20).forEach(m=>{histChars+=Math.min(contentText(m).length,2000)});   // 只估最近 20 則（更舊的通常已被 ctxLimit 截掉）
  const per=Math.floor(((WEB_SEARCH.urlCtxBudget||24000)-histChars)/n);
  return Math.max(1200,Math.min(WEB_SEARCH.urlMaxChars,per));   // 下限 1200：再少就失去讀網頁的意義
}

// 網頁分析：訊息含網址時，用 Jina Reader 讀取內容注入 context，讓模型依頁面內容回答／分析
async function requestPageRead(text,urls){
  isStreaming=true;updateSendButton();   // 讀取進行中即視為串流狀態：避免期間使用者再送訊息造成並發請求
  abortCtrl=new AbortController();   // 讀取期間的「■ 停止」鈕支援
  const statusDiv=makeStatusEl('<span class="spinner"></span>🔗 正在讀取網頁（0/'+urls.length+'）');
  messagesEl.appendChild(statusDiv);
  followIfStuck();   // 讀取狀態列：僅在自動捲動開啟且貼底時跟上
  let context='';
  try{
    let done=0;
    const pages=await Promise.all(urls.map(async u=>{
      const txt=await jinaFetch(u,abortCtrl.signal);
      done++;
      if(statusDiv.isConnected)statusDiv.innerHTML='<span class="spinner"></span>🔗 正在讀取網頁（'+done+'/'+urls.length+'）';
      return {u:u,txt:txt};
    }));
    const ok=pages.filter(p=>p.txt&&p.txt.trim());
    if(!ok.length)throw new Error('所有網頁都讀取失敗');
    const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
    const perPage=adaptivePageChars(ok.length);   // 一之6：依對話歷史長度動態決定每頁注入字數
    const parts=ok.map((p,i)=>{
      let s='[網頁 '+(i+1)+'] '+p.u+'\n內容:\n'+fixJinaLinks(p.txt).trim().slice(0,perPage);
      return s;
    });
    pages.forEach((p,i)=>{if(!(p.txt&&p.txt.trim()))parts.push('[網頁 '+(ok.length+1)+'] '+p.u+'\n（讀取失敗，請對此網址誠實說明無法取得內容）');});
    context='以下是使用者提供網址，於 '+today+' 透過網頁讀取工具取得的網頁實際內容（你沒有任何工具可呼叫，禁止輸出 tool_calls，請直接以文字根據這些內容回答）：\n\n'+parts.join('\n\n')+
      '\n\n（回答規則：以上即為網頁的實際內容，請依使用者的問題或指示分析、摘要、解讀。引用網頁連結時必須使用 Markdown 格式 [文字](網址)，網址須與內容中出現的原始網址完全一致，不可夾帶 $ 符號或自行拼湊。現在時間是 '+today+'。）';
    showToast('🔗 已讀取 '+ok.length+' 個網頁','success');
  }catch(e){
    if(abortCtrl&&abortCtrl.signal.aborted){
      showToast('已停止讀取網頁','warn');
      abortCtrl=null;isStreaming=false;updateSendButton();
      return;
    }
    console.error('[Page] 網頁讀取失敗:',e);
    showToast('網頁讀取失敗（'+e.message+'），無法取得內容','warn');
    // fallback context：明確禁止 AI 偷跑去搜尋（Jina 失敗時不該自動觸發 web_search，
    // 搜尋結果跟原網址無關，會誤導使用者），noTools:true 讓 requestAI 不附帶 web_search 工具
    context='（重要：以下網址的網頁讀取工具（Jina Reader）讀取失敗，無法取得實際內容。請直接告訴使用者無法讀取這些網址，建議他們改用純文字貼上內容摘要、或換成可公開存取的網頁。'+
      '**不要**呼叫任何工具、**不要**用其他來源的資訊猜測網頁內容、**不要**搜尋網路。嚴格只用文字回答。）\n\n'+
      '使用者提供的網址：\n'+urls.map((u,i)=>`[網址 ${i+1}] ${u}`).join('\n');
  }finally{
    if(statusDiv.isConnected)statusDiv.remove();
  }
  await requestAI(context?{searchContext:context,noTools:true}:{});
}

// 三之1：記錄每次搜尋實際引用的來源（🔍 徽章點擊時可開啟來源面板）
const SEARCH_SOURCES=new Map();   // query → [{title,url}]
function setSearchSources(q,results){
  if(!q||!results||!results.length)return;
  if(SEARCH_SOURCES.size>=30){const first=SEARCH_SOURCES.keys().next().value;SEARCH_SOURCES.delete(first)}
  SEARCH_SOURCES.set(q,results.filter(r=>r&&r.url).slice(0,10).map(r=>({title:String(r.title||'').slice(0,120),url:String(r.url).slice(0,600)})));
}

// 三之3：搜尋結果快取（同一工作階段內相同查詢直接重用 context，省 Tavily／Jina 額度）
// 即時性查詢（今天／現在／股價…）不進快取，避免回覆時拿到幾分鐘前的舊資料。
const SEARCH_CACHE=new Map();          // key → {ctx,at,sources}
const SEARCH_CACHE_TTL=10*60*1000;     // 快取有效時間：10 分鐘
const SEARCH_CACHE_MAX=30;             // 最多保留 30 筆（超過淘汰最舊的）
const NO_CACHE_QUERY=/今天|今日|今晚|今晨|今早|現在|即時|剛剛|剛才|目前|最新|比分|股價|匯率|天氣/;
function searchCacheKey(q){return (WEB_SEARCH.engine||'')+'|'+String(q||'').trim().toLowerCase()}
function getSearchCache(q){
  if(!q||NO_CACHE_QUERY.test(q))return null;
  const k=searchCacheKey(q),e=SEARCH_CACHE.get(k);
  if(!e)return null;
  if(Date.now()-e.at>SEARCH_CACHE_TTL){SEARCH_CACHE.delete(k);return null}
  return e;
}
function setSearchCache(q,ctx){
  if(!q||!ctx||NO_CACHE_QUERY.test(q))return;
  const k=searchCacheKey(q);
  if(SEARCH_CACHE.size>=SEARCH_CACHE_MAX){const first=SEARCH_CACHE.keys().next().value;SEARCH_CACHE.delete(first)}
  SEARCH_CACHE.set(k,{ctx:ctx,at:Date.now(),sources:SEARCH_SOURCES.get(q)||null});
}

// 執行網路搜尋（依 WEB_SEARCH.engine：Jina Reader s.jina.ai 或 Tavily）＋Jina 讀全文，
// 組出注入用的 context 字串；失敗丟錯由呼叫端處理
// statusCb(html)：更新「正在搜尋／閱讀」狀態文字（關鍵字路徑與 tool calling 路徑共用）
async function performSearch(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  // 三之3：快取命中 → 直接沿用上次的 context（不再打 Tavily、不再用 Jina 讀頁）
  const hit=getSearchCache(query);
  if(hit){
    if(hit.sources&&!SEARCH_SOURCES.has(query))setSearchSources(query,hit.sources);
    dbg('[Search] 快取命中，跳過搜尋:',query);
    st('<span class="spinner"></span>♻️ 沿用剛剛的搜尋結果');
    return hit.ctx;
  }
  // 引擎派發：Jina 搜尋走 s.jina.ai（純文字），Tavily 走 api.tavily.com（JSON）
  const ctx=WEB_SEARCH.engine==='jina'
    ? await performJinaSearch(query,statusCb,sig)
    : await performTavilySearch(query,statusCb,sig);
  setSearchCache(query,ctx);
  return ctx;
}

// ---- Jina Reader 搜尋（s.jina.ai）----
// 官方建議：以 POST 帶 JSON body {"q": "查詢"}，並用 Authorization: Bearer 帶 key。
// 加 X-With-Links-Summary / X-With-Images-Summary 後，回應會是 JSON 結構（data 內含搜尋結果）。
// 若伺服器不支援 JSON body（舊版）而回純文字，也會自動 fallback 到 markdown 解析。
async function performJinaSearch(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  dbg('[Search] Jina 查詢:',query);
  const ac=new AbortController();
  if(sig&&sig.aborted)ac.abort();
  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});
  const tid=setTimeout(()=>ac.abort(),25000);
  st('<span class="spinner"></span>🔍 正在搜尋');
  let raw='';
  let isJson=false;
  try{
    const resp=await fetch(WEB_SEARCH.jinaEndpoint,{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+WEB_SEARCH.jinaKey,
        'Content-Type':'application/json',
        'X-Engine':'browser',                              // 官方能拿到正確資訊的引擎（s.jina.ai 搜尋+JSON 結構）
        'X-Locale':'zh-TW',                               // 與官方測試一致，結果回 zh-Hant-TW
        'X-With-Images-Summary':'true',
        'X-With-Links-Summary':'true',
        'Accept':'application/json, text/plain'
      },
      body:JSON.stringify({q:query}),
      signal:ac.signal
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const ct=(resp.headers.get('Content-Type')||'').toLowerCase();
    isJson=ct.indexOf('json')>=0;
    raw=await resp.text();
  }finally{clearTimeout(tid)}
  if(!raw||!raw.trim())throw new Error('Jina 搜尋回傳空白');
  // 依回應類型解析：JSON（新版）或純文字（舊版 fallback）
  const results=(isJson?parseJinaSearchJson(raw):parseJinaSearchResults(raw)).slice(0,WEB_SEARCH.maxResults);
  if(!results.length){
    dbg('[Search] Jina 未解析出結果，raw 開頭:',raw.slice(0,400));
    throw new Error('Jina 未找到搜尋結果');
  }
  dbg('[Search] Jina 解析出結果數:',results.length);
  // 與 Tavily 相同的「讀前 N 筆全文 → 其餘附摘要 → 組 context」流程
  return buildSearchContext(query,results,st,sig,true);
}

// 新版 s.jina.ai 的 JSON 回應解析。結構通常形如：
//   { "code":200, "status":2000000, "data": { ..., "search": [ { "url":"..","title":"..","description":".." } ] } }
// 但欄位可能為 links／results／data 直接陣列、或 metadata.title 等。這裡容錯抽取出各候選欄位。
function parseJinaSearchJson(text){
  let obj=null;
  try{obj=JSON.parse(text)}catch(e){return []}
  const out=[];
  // 收集所有可能包含結果的陣列
  const candidates=[];
  if(obj&&obj.data){
    if(Array.isArray(obj.data.search))candidates.push(obj.data.search);
    if(Array.isArray(obj.data.links))candidates.push(obj.data.links);
    if(Array.isArray(obj.data.results))candidates.push(obj.data.results);
    if(Array.isArray(obj.data))candidates.push(obj.data);
  }
  if(obj){
    if(Array.isArray(obj.search))candidates.push(obj.search);
    if(Array.isArray(obj.results))candidates.push(obj.results);
    if(Array.isArray(obj.links))candidates.push(obj.links);
  }
  const seen=new Set();
  for(const arr of candidates){
    if(Array.isArray(arr))arr.forEach(item=>{
      if(!item||typeof item!=='object')return;
      const url=(item.url||item.link||item.href||(item.metadata&&item.metadata.url)||'').trim();
      if(!url||!/^https?:\/\//i.test(url)||seen.has(url))return;
      seen.add(url);
      const title=(item.title||item.name||(item.metadata&&(item.metadata.title||item.metadata.name))||'').trim();
      const desc=(item.description||item.content||item.snippet||item.summary||(item.metadata&&item.metadata.description)||'').trim();
      out.push({title:title,url:url,content:desc});
    });
    // 找到就停；避免重複加同一批資料
    if(out.length)candidates.length=0;
  }
  return out;
}

// s.jina.ai 的純文字通常形如：
//   Title: OOO
//   URL: https://...
//   Description: ...
//   (有時夾雜 AUTHOR、PUBLISH DATE 等欄位，或原文擷取段落)
// 這裡用「Title + 下一個 URL」區塊切割，容錯未知欄位；回傳 [{title,url,content}]
function parseJinaSearchResults(text){
  const out=[];let cur=null;
  // Jina 實際回傳格式為「[N] Title: ..」「[N] URL Source: ..」「[N] Description: ..」(N 為結果編號)
  // 編號前綴要吃進去，避免被誤判成新 group
  const lineRe=/(?:^|\n)\s*(?:\[\d+\]\s*)?(Title|URL Source|URL|Description)\s*:\s*(.+?)\s*$/gim;
  let m;
  while((m=lineRe.exec(text))){
    const key=m[1].toLowerCase(),val=m[2];
    if(key==='title'){cur={title:val,url:'',content:''};out.push(cur)}
    else if((key==='url source'||key==='url')&&cur){cur.url=val}
    else if(key==='description'&&cur){cur.content=val}
  }
  // 過濾掉缺網址的虛項（s.jina.ai 偶爾單獨回一段無網址原文）
  return out.filter(x=>x.url&&/^https?:\/\//i.test(x.url));
}

// 共用組 context 流程：前 fetchPages 筆抓全文，其餘附摘要
// 優先用搜尋結果自帶的 content（Jina s.jina.ai 搜尋回應就含完整網頁內文），
// 只有在 r.content 為空或過短時才額外呼叫 jinaFetch(r.url) 抓全文（Tavily 走這條路徑）。
// 避免 Jina 搜尋後又 jinaFetch 一次同網址浪費額度，也避免 r.jina.ai 不支援的頁面（重導、SPA）
// 回 422 / 拉一堆不相干的 noise 進 context。
async function buildSearchContext(query,results,st,sig,fresh){
  setSearchSources(query,results);   // 三之1：記錄本次搜尋的來源，供訊息上的 🔍 面板顯示
  const top=results.slice(0,WEB_SEARCH.fetchPages);
  st('<span class="spinner"></span>📖 正在閱讀網頁（0/'+top.length+'）');
  let done=0;
  const pages=await Promise.all(top.map(async r=>{
    // r.content 已有足夠內容（Jina 搜尋結果）→ 直接用，不重抓
    const builtIn=(r.content&&r.content.trim().length>=200)?r.content.trim():'';
    let txt='';
    if(!builtIn){
      // 缺內文（Tavily 只有 description；或 Jina content 太短）才呼叫 r.jina.ai
      txt=await jinaFetch(r.url,sig);
    }
    done++;
    st('<span class="spinner"></span>📖 正在閱讀網頁（'+done+'/'+top.length+'）');
    return {r:r,txt:txt,builtIn:builtIn};
  }));
  const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
  const parts=pages.map((p,i)=>{
    let s='[來源 '+(i+1)+'] '+(p.r.title||'')+'\n網址: '+p.r.url;
    // 優先序：jinaFetch 結果 > 搜尋自帶 content > 搜尋自帶 description
    const body=fixJinaLinks((p.txt&&p.txt.trim())||p.builtIn||p.r.content||'');
    if(body)s+='\n內容:\n'+body.slice(0,WEB_SEARCH.pageChars);
    return s;
  });
  results.slice(WEB_SEARCH.fetchPages).forEach(r=>{
    parts.push('[來源 '+(parts.length+1)+'] '+(r.title||'')+'\n網址: '+r.url+'\n摘要: '+fixJinaLinks((r.content||'').slice(0,300)));
  });
  dbg('[Search] 完成，來源數:',results.length);
  return '以下是以「'+query+'」為關鍵字，於 '+today+' 進行網路搜尋的結果'+(fresh?'（本次限定近期內的資料，若其中沒有使用者問的當日資訊，請明確說明查無當日資料，不要把舊資料當成今天的）':'（搜尋已完成，結果直接列在下方；你沒有任何工具可呼叫，禁止輸出 tool_calls／函式呼叫，請直接以文字根據這些結果回答）')+'：\n\n'+parts.join('\n\n')+
    '\n\n（回答規則：1. 優先根據上述搜尋結果回答，引用到的資訊請附上來源連結（Markdown 格式）；連結只能原樣引用上方「網址:」列出的字串，不可自行拼湊、改寫或編造網址。2. 使用者問了多個對象（如多個城市）時，每個對象都要分別說明。3. 若搜尋結果與問題無關或不足，就依你自己的知識回答並說明。現在時間是 '+today+'。）';
}

// ---- 中央氣象署 OpenData 天氣直查（三之4）----
// 天氣類查詢不走 Tavily：直接向氣象署拉「今明 36 小時預報＋一週預報」（官方 JSON、免費、
// 有授權碼即可），組成精簡文字 context。台灣以外地區或需要更細資料時，requestAI 端
// 保留 web_search 工具讓模型自行 fallback（見 _cwa 提示）。
// 三之5：模型改寫的 query 常出現簡體（「高雄天气」）或英文（「Kaohsiung weather」），
// 只認繁體會漏判 → 明明是台灣天氣卻跑去跑 Tavily 白扣額度。這裡補上簡體與常見英文寫法。
const WEATHER_RE=/天氣|天气|氣溫|气温|溫度|温度|降雨|下雨|雨量|颱風|台风|暴風圈|暴风圈|寒流|冷氣團|热浪|熱浪|高溫|高温|低溫|低温|紫外線|紫外线|體感|体感|預報|预报|weather|forecast|temperature|typhoon|rainfall/i;
const CWA_LOCATIONS=['基隆市','臺北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];
// 三之5：簡體地名用字 → 繁體。實測氣象署只認繁體縣市名：送簡體（花莲县）或英文（Kaohsiung）
// 會回 HTTP 200、success=true 但資料 0 筆，因此要在送出前先把縣市名轉成繁體。
const CWA_LOC_S2T=[[/县/g,'縣'],[/莲/g,'蓮'],[/兰/g,'蘭'],[/义/g,'義'],[/云/g,'雲'],[/园/g,'園'],[/门/g,'門'],[/东/g,'東'],[/龙/g,'龍']];
const CWA_CACHE=new Map();   // datasetId＋縣市 → {at,records}（氣象署約每小時更新，短 TTL 即可）
function isWeatherQuery(q){return WEATHER_RE.test(q||'')}
// 三之7：颱風類查詢（命中才多拉一次颱風警特報，避免每次天氣查詢都多打一支 API）。
// 「臺风」是必要的：縣市比對會先把「台」轉成「臺」，簡體「台风」在該步驟後會變成「臺风」。
const TYPH_RE=/颱風|台风|臺风|typhoon|暴風圈|暴风圈|熱帶性低氣壓|热带性低气压|陸上警報|海上警報|陆上警报|海上警报/i;
function isTyphoonQuery(q){return TYPH_RE.test(q||'')}
// 取單一資料集：params 為查詢參數（locationName/elementName 小寫＝F-C 系列；
// LocationName/ElementName 大寫＋中文元素名＝F-D0047-091；limit＝地震報告）
async function cwaFetch(ds,params,sig){
  const pkey=JSON.stringify(params||{});
  const key=ds+'|'+pkey;
  const hit=CWA_CACHE.get(key);
  if(hit&&Date.now()-hit.at<WEB_SEARCH.cwaCacheMs)return hit.records;
  const u=new URL(WEB_SEARCH.cwaEndpoint+ds);
  u.searchParams.set('format','JSON');
  for(const k in (params||{}))u.searchParams.set(k,params[k]);
  const ac=new AbortController();
  if(sig&&sig.aborted)ac.abort();
  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});   // 外部「■ 停止」鈕同步中斷
  const tid=setTimeout(()=>ac.abort(),TIMEOUT.cwa);
  try{
    let j=null;
    try{
      // 直連：opendata.cwa.gov.tw 若未送 CORS 標頭，瀏覽器 fetch 會丟 TypeError
      const resp=await fetch(u,{headers:{'Authorization':WEB_SEARCH.cwaKey},signal:ac.signal});
      if(!resp.ok)throw Object.assign(new Error('HTTP '+resp.status),{cwaHttp:true});
      j=await resp.json();
    }catch(err){
      if(err.name==='AbortError')throw err;
      if(err.cwaHttp)throw err;   // 4xx/5xx＝金鑰或參數問題，走中繼也一樣失敗
      // CORS／網路失敗 → 改走 Jina Reader 中繼（授權碼改放 query 參數，CWA 官方支援此用法）
      dbg('[CWA] 直連失敗（可能是 CORS），改走 Jina 中繼:',err&&err.message);
      u.searchParams.set('Authorization',WEB_SEARCH.cwaKey);
      const r2=await fetch(WEB_SEARCH.jinaReader+u.toString(),{signal:ac.signal,headers:{'x-return-format':'text'}});
      if(!r2.ok)throw new Error('HTTP '+r2.status);
      const s=await r2.text();
      const b=s.lastIndexOf('}'),a=s.indexOf('{');
      if(a<0||b<=a)throw new Error('中繼回應非 JSON');
      j=JSON.parse(s.slice(a,b+1));
    }
    if(!j||!j.records)throw new Error('資料集無資料（確認資料集代號與授權碼）');
    CWA_CACHE.set(key,{at:Date.now(),records:j.records});
    return j.records;
  }finally{clearTimeout(tid)}
}
function cwaTimes(loc,elName){   // 相容 F-C（小寫 elementName/time）與 F-D0047-091（大寫）兩種欄位
  const els=loc.weatherElement||loc.WeatherElement||[];
  const el=els.find(e=>e.elementName===elName||e.ElementName===elName);
  const t=el&&(el.time||el.Time);
  return t&&Array.isArray(t)?t:null;
}
function cwaVal(slot){   // 三種型態：F-C 的 parameter.parameterName、F-D0047 的 ElementValue[{鍵:值}]、舊式 elementValue[{value}]
  if(slot&&slot.parameter)return String(slot.parameter.parameterName!=null?slot.parameter.parameterName:'').trim();
  const ev=slot&&(slot.ElementValue||slot.elementValue);
  if(ev&&ev[0]){for(const k in ev[0]){const v=ev[0][k];if(v!=null&&v!=='')return String(v).trim()}}
  return '';
}
function cwaDay(iso){   // '2026-09-06T06:00:00+08:00' 或 '2026-09-06 06:00:00' → '9/6(週日)'
  const d=new Date(String(iso||'').replace(' ','T'));
  return isNaN(d)?String(iso||'').slice(5,10):((d.getMonth()+1)+'/'+d.getDate()+'(週'+'日一二三四五六'[d.getDay()]+')');
}
// 今明 36 小時（F-C0032-001）：每縣市每時段一行（Wx 氣溫 降雨% 舒適度）
function fmtCwaCurrent(records){
  const locs=records.location||((records.locations&&records.locations[0]&&records.locations[0].location)||[]);
  const out=[];
  for(const loc of locs){
    const wx=cwaTimes(loc,'Wx'),minT=cwaTimes(loc,'MinT'),maxT=cwaTimes(loc,'MaxT'),pop=cwaTimes(loc,'PoP12h'),ci=cwaTimes(loc,'CI');
    if(!wx)continue;
    const segs=[];
    for(let i=0;i<wx.length;i++){
      const w=cwaVal(wx[i]);
      const lo=minT&&minT[i]?cwaVal(minT[i]):'?',hi=maxT&&maxT[i]?cwaVal(maxT[i]):'?';
      const p=pop&&pop[i]?cwaVal(pop[i]):'',c=ci&&ci[i]?cwaVal(ci[i]):'';
      segs.push(w+' '+lo+'~'+hi+'°C'+(p?' 降雨'+p+'%':'')+(c?'（'+c+'）':''));
    }
    if(segs.length)out.push(loc.locationName+'：\n'+segs.map((x,i)=>'  '+String(wx[i].startTime||wx[i].StartTime||'').slice(5,16).replace('T',' ')+'起 '+x).join('\n'));
  }
  return out.join('\n');
}
// 一週（F-D0047-091）：按日期分組，每行一天（白天／夜晚各一筆）；LocationName 過濾後通常只有該縣市一筆
function fmtCwaWeek(records){
  const locs=(records.Locations&&records.Locations[0]&&records.Locations[0].Location)||[];
  const out=[];
  for(const loc of locs){
    const wx=cwaTimes(loc,'天氣現象'),minT=cwaTimes(loc,'最低溫度'),maxT=cwaTimes(loc,'最高溫度'),pop=cwaTimes(loc,'12小時降雨機率');
    if(!wx)continue;
    const days=[];   // [{date,segs:[]}]
    for(let i=0;i<wx.length;i++){
      const st=String(wx[i].StartTime||wx[i].startTime||'');
      const d=new Date(st.replace(' ','T'));
      const date=isNaN(d)?st.slice(0,10):((d.getMonth()+1)+'/'+d.getDate()+'(週'+'日一二三四五六'[d.getDay()]+')');
      const h=isNaN(d)?0:d.getHours();
      const label=h<6?'凌晨':(h<18?'白天':'夜晚');
      const lo=minT&&minT[i]?cwaVal(minT[i]):'?',hi=maxT&&maxT[i]?cwaVal(maxT[i]):'?';
      const p=pop&&pop[i]?cwaVal(pop[i]):'';
      const seg=label+' '+cwaVal(wx[i])+' '+lo+'~'+hi+'°C'+(p&&/\d/.test(p)?' 降雨'+p+'%':'');
      const last=days[days.length-1];
      if(last&&last.date===date)last.segs.push(seg);
      else days.push({date:date,segs:[seg]});
    }
    if(days.length)out.push((loc.LocationName||loc.locationName)+'：\n'+days.map(d=>'  '+d.date+'：'+d.segs.join('／')).join('\n'));
  }
  return out.join('\n');
}
// 地震報告（E-A0015-001 顯著有感／E-A0016-001 小區域）：摘要直接用官方 ReportContent（含時間、規模、最大震度）
function fmtCwaQuake(records){
  const list=(records&&records.Earthquake)||[];
  return list.map(eq=>{
    const info=eq.EarthquakeInfo||{};
    const t=new Date(String(info.OriginTime||'').replace(' ','T'));
    const when=isNaN(t)?String(info.OriginTime||'').slice(5,16):((t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
    const mag=info.EarthquakeMagnitude&&info.EarthquakeMagnitude.MagnitudeValue;
    return '● 規模 '+(mag!=null?mag:'?')+'｜深度 '+(info.FocalDepth!=null?info.FocalDepth:'?')+' km｜發震時間 '+when
      +'\n  震央：'+((info.Epicenter&&info.Epicenter.Location)||'?')
      +(eq.ReportContent?('\n  摘要：'+eq.ReportContent):'')
      +(eq.Web?('\n  報告：'+eq.Web):'');
  }).join('\n');
}
// 颱風警特報（W-C0034-001）：records.info[] 每筆是一個 CAP 格式的警報。
// 重要：不帶 expires=true 時，氣象署連「已解除的舊警報」也會回傳（實測 9/7 查詢仍回 8/28 解除的
// 沙德爾），直接餵給模型會被當成現況 → 比不查更糟。所以呼叫端帶 expires=true，
// 這裡再依 expires 時間做第二層過濾（雙重保險），只輸出尚未過期的警報。
function fmtCwaTyphoon(records){
  const list=(records&&records.info)||[];
  const now=Date.now();
  const out=[];
  for(const it of list){
    if(!it)continue;
    const exp=it.expires?new Date(String(it.expires).replace(' ','T')).getTime():NaN;
    if(!isNaN(exp)&&exp<=now)continue;   // 已過期 → 略過（不讓舊警報被當成現況）
    const head=[];
    if(it.headline)head.push(String(it.headline));
    const eff=it.effective?new Date(String(it.effective).replace(' ','T')):null;
    const exd=isNaN(exp)?null:new Date(exp);
    const fm=d=>d&&!isNaN(d)?((d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')):'';
    if(eff)head.push('發布 '+fm(eff));
    if(exd)head.push('有效至 '+fm(exd));
    const secs=(it.description&&it.description.section)||[];
    const body=secs.map(s=>'  '+s.title+'：'+String(s.value==null?'':s.value).replace(/\s+/g,' ').trim()).join('\n');
    out.push('● '+head.join('｜')+(body?'\n'+body:''));
  }
  return out.join('\n');
}
// 天氣直查主流程：成功回傳 {context,sources}；非預期失敗回傳 null（呼叫端落回一般搜尋）。
// 中止（使用者按「■ 停止」）則原樣丟出，交給外層的既有的中止處理。
async function tryCwaWeather(query,statusCb,sig,extra){
  const st=h=>{if(statusCb)statusCb(h)};
  try{
    // 從查詢抓出台灣縣市（「台」「臺」都要能對上）；抓到 → 36hr 只拉該縣市、一週才取得到。
    // extra＝最後一則使用者訊息：模型改寫的 query 偶爾會漏掉縣市名，用原訊息補抓。
    // 三之5a：比對前先把簡體地名轉繁體（見 CWA_LOC_S2T）。
    // 三之5b：再比對去掉「市／縣」的簡稱——使用者與模型幾乎都只寫「高雄」「台北」，
    //   過去只認完整名稱（高雄市），結果 loc 永遠抓不到 → 一週預報整段不會出現
    //   （使用者問「明天」卻只拿到今明 36 小時，就是這個原因）。先比全名、再比簡稱，
    //   「新竹縣」這種才不會被「新竹市」搶走。
    // 抓不到縣市（例如純英文查詢）時 loc=''：只拉全台 36 小時、跳過一週預報，不會送錯參數。
    const rawQ=(String(query||'')+' '+String(extra||''));   // 未正規化的原文：颱風判斷要用它（nq 會把「台」轉成「臺」）
    let nq=rawQ.replace(/台/g,'臺');
    for(const pair of CWA_LOC_S2T)nq=nq.replace(pair[0],pair[1]);
    const loc=CWA_LOCATIONS.find(t=>nq.includes(t))||CWA_LOCATIONS.find(t=>nq.includes(t.replace(/[市縣]$/,'')))||'';
    st('<span class="spinner"></span>🌤️ 正在查詢氣象署（今明 36 小時）');
    const cur=await cwaFetch(WEB_SEARCH.cwaCurrent,loc?{locationName:loc}:{},sig);
    const curText=fmtCwaCurrent(cur);
    if(!curText)throw new Error('今明預報格式未預期');
    // 三之7：颱風警特報（W-C0034-001，免額度）——只有問到颱風才多拉這一支。
    // 帶 expires=true 讓氣象署端就先濾掉過期警報；取不到資料時整段不提，不做任何斷言。
    let typhoonPart='',typhoonSrc=false;
    if(WEB_SEARCH.cwaTyphoon&&isTyphoonQuery(rawQ)){
      try{
        st('<span class="spinner"></span>🌀 正在查詢氣象署（颱風警特報）');
        const ty=await cwaFetch(WEB_SEARCH.cwaTyphoon,{expires:'true'},sig);
        const tyText=fmtCwaTyphoon(ty);
        typhoonPart='【颱風警特報（氣象署，僅含未過期警報）】\n'+(tyText||'目前沒有生效中的颱風警特報。');
        typhoonSrc=true;
      }catch(e3){dbg('[CWA] 颱風警特報取不到:',e3&&e3.message)}
    }
    const parts=['【今明 36 小時預報】\n'+curText];
    if(typhoonPart)parts.unshift(typhoonPart);   // 問到颱風時，警特報排最前面
    if(loc){
      // 一週預報（F-D0047-091 全台逐 12 小時，資料量大：必須指定縣市；失敗不影響 36hr）
      let weekText='';
      try{
        st('<span class="spinner"></span>🌤️ 正在查詢氣象署（一週預報）');
        const week=await cwaFetch(WEB_SEARCH.cwaWeekly,{LocationName:loc,ElementName:'天氣現象,最低溫度,最高溫度,12小時降雨機率',sort:'time'},sig);
        weekText=fmtCwaWeek(week);
      }catch(e2){dbg('[CWA] 一週預報（含元素過濾）取不到:',e2&&e2.message)}
      if(!weekText){
        // 備援：不帶 ElementName／sort 再試一次（參數組合偶爾失敗時的保底）
        try{
          const week=await cwaFetch(WEB_SEARCH.cwaWeekly,{LocationName:loc},sig);
          weekText=fmtCwaWeek(week);
        }catch(e2){dbg('[CWA] 一週預報（無過濾）也取不到:',e2&&e2.message)}
      }
      if(weekText)parts.push('【一週天氣預報（'+loc+'，未來 7 天逐 12 小時，白天／夜晚各一筆）】\n'+weekText);
      else parts.push('【一週天氣預報】（本次取得失敗。使用者若問明天或未來幾天的天氣，請再呼叫一次 web_search 重試——重試通常會成功，屆時請以回傳的一週預報回答。）');
    }
    const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
    const scope=loc?('資料範圍：'+loc):'資料範圍：全台各縣市（未偵測到特定縣市，僅含今明 36 小時預報）';
    const context='以下是 '+today+' 於中央氣象署取得的台灣天氣預報（'+scope+'）：\n\n'+parts.join('\n\n')
      +'\n\n（回答規則：1. 使用者問台灣天氣時，優先根據上述資料回答。2. 今明 36 小時預報只涵蓋最近的 3 個半天時段，可能不含明天白天；使用者問明天、後天、本週或未來天氣時，請以【一週天氣預報】為準（未來 7 天逐 12 小時，白天／夜晚各一筆），不要說「資料只到今天」。3. 日期與時段以資料中的 startTime 為準，現在時間是 '+today+'。4. 本資料只涵蓋台灣的預報：使用者問台灣以外地區、即時觀測或過去天氣時，請說明資料範圍或另行查證。'
      +'5. 使用者問颱風時以【颱風警特報】那一段為準：該段若寫「目前沒有生效中的颱風警特報」，就明確回答目前沒有颱風警報，不要拿降雨或風力資料推測可能有颱風；沒有這一段時，代表本次沒取得颱風資料，不要假裝有。）';
    const sources=[
      {title:'中央氣象署：天氣概況（今明 36 小時預報）',url:'https://www.cwa.gov.tw/V8/C/W/index.html'},
      {title:'中央氣象署：一週天氣預報',url:'https://www.cwa.gov.tw/V8/C/W/week.html'}
    ];
    if(typhoonSrc)sources.unshift({title:'中央氣象署：颱風消息',url:'https://www.cwa.gov.tw/V8/C/P/Typhoon/TY_NEWS.html'});   // 三之7：實測 typhoon.html 是 404，TY_NEWS.html 才是 200
    dbg('[CWA] 天氣完成，範圍:',loc||'全台','context 長度:',context.length);
    return {context:context,sources:sources};
  }catch(e){
    if(e.name==='AbortError')throw e;
    dbg('[CWA] 氣象署天氣查詢失敗，改走一般搜尋:',e&&e.message);
    return null;
  }
}
// 地震直查：顯著有感＋小區域各取最近 3 筆
const QUAKE_RE=/地震|餘震|余震|震度|強震|强震|有感地震|地牛|搖|earthquake/i;
function isQuakeQuery(q){return QUAKE_RE.test(q||'')}
async function tryCwaQuake(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  try{
    st('<span class="spinner"></span>🌍 正在查詢氣象署（地震報告）');
    const major=await cwaFetch(WEB_SEARCH.cwaQuakeMajor,{limit:3},sig);
    const majorText=fmtCwaQuake(major);
    if(!majorText)throw new Error('地震報告格式未預期');
    const parts=['【顯著有感地震報告（最近 3 筆）】\n'+majorText];
    try{
      const local=await cwaFetch(WEB_SEARCH.cwaQuakeLocal,{limit:3},sig);
      const localText=fmtCwaQuake(local);
      if(localText)parts.push('【小區域有感地震報告（最近 3 筆，規模通常較小）】\n'+localText);
    }catch(e2){dbg('[CWA] 小區域地震報告取不到:',e2&&e2.message)}
    const today=nowText();   // 三之6：含時刻——只給日期的話，模型無法判斷「剛剛／現在」是多久以前
    const context='以下是中央氣象署地震測報中心於 '+today+' 取得的最新地震報告：\n\n'+parts.join('\n\n')
      +'\n\n（回答規則：1. 使用者問最近有沒有地震／震度／規模時，優先根據上述資料回答並附上報告連結。2. 現在時間是 '+today+'，報告中的發震時間要跟它比較：使用者問「剛剛／現在／最近有沒有地震」時，請用現在時間減發震時間得出「多久以前」，不要憑印象猜測現在幾點（例如凌晨 3 點時，凌晨 0 點多的地震是「約 3 小時前」，不是「13 小時前」）。3. 若使用者問的是更早的地震、國外地震或需要更詳細的內容，可另行查證。4. 使用者說「剛剛有感」但報告中最新的地震已是很久以前，或找不到相符的地震時，請明說報告裡沒有對應的紀錄，不要硬套一筆資料當成剛剛發生。）';
    const sources=[
      {title:'中央氣象署：地震測報中心',url:'https://scweb.cwa.gov.tw/'},
      {title:'中央氣象署：地震報告',url:'https://www.cwa.gov.tw/V8/C/E/Earthquake/'}
    ];
    dbg('[CWA] 地震完成，context 長度:',context.length);
    return {context:context,sources:sources};
  }catch(e){
    if(e.name==='AbortError')throw e;
    dbg('[CWA] 氣象署地震查詢失敗，改走一般搜尋:',e&&e.message);
    return null;
  }
}
// 統一派發：天氣 → 天氣直查；地震 → 地震直查；其他 → null（走一般搜尋）
async function tryCwaDirect(query,statusCb,sig,extra){
  if(isWeatherQuery(query))return tryCwaWeather(query,statusCb,sig,extra);
  if(isQuakeQuery(query))return tryCwaQuake(query,statusCb,sig);
  return null;
}

// ---- Tavily 搜尋（api.tavily.com，JSON）----
async function performTavilySearch(query,statusCb,sig){
  const st=h=>{if(statusCb)statusCb(h)};
  dbg('[Search] Tavily 查詢:',query);
  // 時效性偵測（分兩級）：
  // day：明確問「今天／今日」等當日字詞 → 限定最近一天，最精準
  // week：其他時效性字詞（最新、最近、年份等）→ 限定最近一週，兼顧時效與命中率
  // 避免相關性排名把數月前的權威頁面（如氣象署舊快照）排最前面，導致讀到過期資訊
  const day=/現在|剛剛|剛才|即時|今天|今日|今晚|今晨|今早|今(天|日)(的|有|是)|本日/.test(query);
  const week=/最新|最近|目前|近期|本週|這幾天|\d{4}\s*年/.test(query);
  const fresh=day||week;
  const ac=new AbortController();
  if(sig&&sig.aborted)ac.abort();
  else if(sig)sig.addEventListener('abort',()=>ac.abort(),{once:true});   // 外部「■ 停止」鈕同步中斷
  const tid=setTimeout(()=>ac.abort(),25000);   // 搜尋整體 25 秒逾時
  const reqBody={query:query,search_depth:'basic',max_results:WEB_SEARCH.maxResults};
  if(day)reqBody.time_range='day';
  else if(week)reqBody.time_range='week';
  const resp=await fetch(WEB_SEARCH.tavilyEndpoint,{
    method:'POST',
    headers:{'Authorization':'Bearer '+WEB_SEARCH.tavilyKey,'Content-Type':'application/json'},
    body:JSON.stringify(reqBody),
    signal:ac.signal
  });
  clearTimeout(tid);
  if(!resp.ok)throw new Error('HTTP '+resp.status);
  const j=await resp.json();
  const results=(j.results||[]).slice(0,WEB_SEARCH.maxResults);
  if(!results.length)throw new Error('沒有搜尋結果');
  return buildSearchContext(query,results,st,sig,fresh);
}

// 關鍵字命中時的完整流程：改寫查詢 → Tavily 搜尋 → Jina Reader 讀全文 → 注入 context 後走正常文字請求
// （改寫為空＝無法判斷要查什麼：直接中止，不呼叫 Tavily 以免浪費搜尋額度）
async function requestWebSearch(query){
  isStreaming=true;updateSendButton();   // 搜尋進行中即視為串流狀態：避免期間使用者再送訊息造成並發請求
  abortCtrl=new AbortController();   // 搜尋期間的「■ 停止」鈕支援
  const statusDiv=makeStatusEl('<span class="spinner"></span>🔍 正在準備搜尋');
  messagesEl.appendChild(statusDiv);
  followIfStuck();   // 搜尋狀態列：僅在自動捲動開啟且貼底時跟上
  let context='';
  try{
    // 步驟 1：查詢改寫——依對話歷史把「那你幫我查一下」補齊成獨立搜尋字串（如「台北天氣」）
    let rewritten=await rewriteSearchQuery(query);
    if(!rewritten){
      // 模型改寫無效：客戶端降級——先剝目前訊息的指令詞；剝完沒主題就往回找前幾則使用者訊息
      const chat=chats[activeChatId];
      rewritten=extractSearchTopic(query);
      if(!rewritten&&chat){
        for(let i=chat.messages.length-2;i>=0;i--){
          const m=chat.messages[i];
          if(m.role!=='user'||m.error)continue;
          rewritten=extractSearchTopic(contentText(m));
          if(rewritten)break;
        }
      }
      if(!rewritten){
        if(statusDiv.isConnected)statusDiv.remove();
        abortCtrl=null;isStreaming=false;updateSendButton();   // 中止：復原串流狀態
        showToast('無法判斷要搜尋的內容，請說明想查什麼','warn');
        return;   // 中止：不呼叫 Tavily，不浪費搜尋額度
      }
      dbg('[Search] 客戶端降級查詢:',rewritten);
    }
    if(rewritten!==query)dbg('[Search] 查詢改寫:',query,'→',rewritten);
    // 一之1：改寫／降級後的查詢若仍是殘缺片段或亂碼 → 中止，不呼叫 Tavily（白扣額度）
    if(!isSaneQuery(rewritten)){
      if(statusDiv.isConnected)statusDiv.remove();
      abortCtrl=null;isStreaming=false;updateSendButton();   // 中止：復原串流狀態
      showToast('無法判斷要搜尋的內容，請說明想查什麼','warn');
      return;
    }
    // 主題分層：當前訊息本身含主題 → 直接搜；依賴上下文的追問（如「那你查一下」）→
    // 先用確認框顯示實際搜尋字串讓使用者把關，避免改寫猜錯主題白扣搜尋額度
    if(!extractSearchTopic(query)){
      const ok=await showConfirm('要幫你搜尋「'+rewritten+'」嗎？');
      if(!ok){abortCtrl=null;isStreaming=false;updateSendButton();return}   // 取消：不呼叫 Tavily，不浪費搜尋額度
    }
    query=rewritten;
    let weather=false;
    // 三之4：天氣查詢 → 直接查中央氣象署 OpenData（不花 Tavily 額度）；web_search 工具保留，
    // 模型遇到資料不足（台灣以外地區等）時自行呼叫工具補查。無 key／失敗 → 落回一般搜尋。
    if(WEB_SEARCH.cwaKey&&(isWeatherQuery(query)||isQuakeQuery(query))){
      statusDiv.innerHTML='<span class="spinner"></span>🌤️ 正在查詢中央氣象署';
      const w=await tryCwaDirect(query,h=>{statusDiv.innerHTML=h},abortCtrl.signal);
      if(w){
        setSearchSources(query,w.sources);   // 🔍 徽章與來源面板顯示氣象署頁面
        context=w.context;
        weather=true;
      }
    }
    if(!weather){
      statusDiv.innerHTML='<span class="spinner"></span>🔍 正在搜尋網路';
      context=await performSearch(query,h=>{statusDiv.innerHTML=h},abortCtrl.signal);
    }
//    showToast('🔍 已搜尋：'+query,'success');   // 可選：讓使用者看到實際搜尋的字串
  }catch(e){
    console.error('[Search] 搜尋失敗:',e);
    if(e.name==='AbortError'||(abortCtrl&&abortCtrl.signal.aborted)){
      showToast('已停止搜尋','warn');
      abortCtrl=null;isStreaming=false;updateSendButton();
      return;
    }
    showToast('網路搜尋失敗（'+e.message+'），改用模型知識回答','warn');
  }finally{
    if(statusDiv.isConnected)statusDiv.remove();
  }
  await requestAI(context?{searchContext:context,_searchQuery:query,_cwa:weather}:{});
}

// 重新生成「有搜尋標記」的回答：沿用原查詢字串重新搜尋後生成（不需改寫與確認）
async function regenWithSearch(q){
  // 一之1：歷史訊息記錄的查詢字串可能是早期版本留下的亂碼／殘缺值，這裡一併擋掉
  if(!isSaneQuery(q)){
    showToast('原查詢字串無法使用，改以模型知識回答','warn');
    await requestAI();
    return;
  }
  isStreaming=true;updateSendButton();
  const statusDiv=makeStatusEl('<span class="spinner"></span>🔍 正在重新搜尋');
  messagesEl.appendChild(statusDiv);
  followIfStuck();
  let context='',weather=false;
  try{
    // 三之4：同 requestWebSearch——重新生成也先走氣象署直查，失敗落回一般搜尋
    if(WEB_SEARCH.cwaKey&&(isWeatherQuery(q)||isQuakeQuery(q))){
      statusDiv.innerHTML='<span class="spinner"></span>🌤️ 正在查詢中央氣象署';
      const w=await tryCwaDirect(q,h=>{statusDiv.innerHTML=h});
      if(w){setSearchSources(q,w.sources);context=w.context;weather=true}
    }
    if(!weather){
      statusDiv.innerHTML='<span class="spinner"></span>🔍 正在重新搜尋';
      context=await performSearch(q,h=>{statusDiv.innerHTML=h});
    }
  }catch(e){
    showToast('重新搜尋失敗（'+e.message+'），改用模型知識回答','warn');
  }finally{
    if(statusDiv.isConnected)statusDiv.remove();
  }
  await requestAI(context?{searchContext:context,_searchQuery:q,_cwa:weather}:{});
}

// 依目前對話送出請求並串流顯示回應
async function requestAI(opts){
  opts=opts||{};
  const chat=chats[activeChatId];
  if(!chat)return;
  const apiKey=getApiKey();
  if(!apiKey){
    showToast('請先設定 API Key（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }
  isStreaming=true;
  updateSendButton();

  const container=messagesEl;
  const statusDiv=makeStatusEl('<span class="spinner"></span>回應中','statusMsg');
  container.appendChild(statusDiv);
  followIfStuck();   // 回應中狀態列：僅在自動捲動開啟且貼底時跟上

  let aiDiv=null;   // 串流中的回應氣泡
  let full='';      // 累積的純文字
  let thinking=opts._prevThinking||'';  // 累積的推理內容（reasoning_content）；工具呼叫（web_search）多輪時帶入前輪思考，避免最終訊息只剩最後一輪的思考（開啟「顯示思考過程」卻在回覆完成後消失的原因）
  let finishReason=null;   // C6：最後一個 chunk 的 finish_reason（length=被截斷）
  let sawToolCalls=false;   // 模型是否輸出過 tool_calls
  let sawDone=false;        // 是否收到 SSE 的 [DONE]（搭配 finish_reason 偵測串流是否被提前切斷）
  let toolAcc=[];           // 串流中累積的 tool_calls 片段（tool calling 模式）
  let useTools=false;       // 本次請求是否附帶 web_search 工具
  let rafId=0;
  const fixStream=makeFixStreamer();   // 二之1：串流中增量修復 Jina 壞連結（取代每幀全文重跑）
  // 剔除開頭空白行（模型有時會先輸出空行），顯示與儲存都經過它
  // （宣告必須在 try 之前：若中止發生在串流開始前，catch 內也取得到 clean，否則會 ReferenceError）
  const clean=s=>s.replace(/^\s+/, '');

  try{
    // 組建上下文：排除錯誤訊息，並依設定限制歷史則數
    let hist=chat.messages.filter(m=>!m.error);
    const limit=getCtxLimit();
    if(limit!=='all'&&hist.length>parseInt(limit,10))hist=hist.slice(-parseInt(limit,10));
    const msgs=await histToMsgs(hist);
    if(opts.searchContext)msgs.unshift({role:'system',content:opts.searchContext});   // 網路搜尋結果：注入在歷史最前（系統提示之下）
    const sys=getSystemPrompt();
    if(sys)msgs.unshift({role:'system',content:sys});
    // 工具呼叫模式：一般請求附上 web_search 工具，由模型自行決定何時搜尋（後端不支援時自動降級）
    // 三之4：氣象署天氣直查的請求（_cwa）也保留工具——台灣以外的天氣／資料不足時由模型 fallback
    // 三之5：續問輪原本一律不附工具（!opts._toolMsgs），但模型拿到不足的資料（例如一週預報沒拿到）
    // 想再查一次時，手上已經沒有工具可用，只能把 tool_call 當純文字吐出來——使用者看到的就是
    // 「回答的內容似乎是它要調工具的內容」然後就斷了。
    // 改為：上一輪若命中氣象署直查（免額度），續問輪保留工具，讓模型真的能再查一次；
    // Tavily（會扣額度）的請求維持原來「只查一次」的行為。
    const allowToolInFollowUp=(opts._cwaRounds||0)>0;
    useTools=(opts._cwa||!opts.searchContext||allowToolInFollowUp)&&(!opts._toolMsgs||allowToolInFollowUp)&&!opts.noTools&&!opts._retryEmpty&&!TOOL_STATE.unsupported&&(opts._toolDepth||0)<WEB_SEARCH.toolMaxRounds+(opts._cwaRounds||0);
    // 提醒訊息：附工具時告知可用 web_search；未搜尋時禁止編造即時資料（避免幻覺）
    // 兩種都附上今天日期：模型對「現在」的認知來自訓練資料，不給日期它會猜錯（如把 9 月查成 7 月）
    const todayNote=(d=>nowText(d,true)+(lunarDateText(d)?('｜農曆 '+lunarDateText(d)):''))(new Date());   // 三之6：含國曆＋星期＋「現在時刻」＋農曆：日期換算類問題不必呼叫搜尋，需要算時間差的問題（剛剛／現在）也不用猜
    if(!opts.searchContext&&!opts._toolMsgs){
      // 一之4：關鍵字提示——使用者的訊息含搜尋用語，但由模型自己判斷是否真的需要即時資料
      const kwHint=opts._keywordHint
        ?'（使用者的訊息含有「查／找／搜尋」等用語。若他確實在要即時資訊（天氣、新聞、匯率、股價、賽事、公告等），就呼叫 web_search；若只是一般問題或名詞解釋，直接回答即可，不需要搜尋。）'
        :'';
      const note=useTools
        ?'（提示：現在時間是 '+todayNote+'。你可以呼叫 web_search 工具查詢即時資訊（天氣、匯率、股價、新聞、賽事等）。若使用者的問題需要即時或最新資料而你沒有把握，就呼叫工具；若不需要即時資料則直接回答。呼叫工具時若查詢涉及日期，務必使用上面的今天實際日期，不要憑記憶猜測。若使用者只是要日期換算（如今天是農曆幾號、星期幾），上方的今天資訊已含國曆與農曆，直接回答即可，不要為此呼叫搜尋工具。若你沒有呼叫工具，切勿編造即時資料。除 web_search 外你沒有其他工具，不要輸出其他 tool_calls。）'+kwHint
        :'（注意：現在時間是 '+todayNote+'。本次對話沒有進行網路搜尋，你沒有任何即時資料來源。切勿編造即時資訊（天氣、匯率、股價、新聞、比分等）或模仿搜尋結果的格式輸出假資料；若使用者詢問此類資訊，請明確說明你無法取得即時資料，並建議使用者輸入「查一下」等關鍵字要求你搜尋網路（日期與農曆換算除外——上方的今天資訊已含國曆與農曆，可直接推算回答）。另外：你不具備任何工具或函式，絕對不要輸出 tool_calls／函式呼叫，一律只用純文字回答。）';
      if(sys)msgs[0].content+='\n'+note;
      else msgs.unshift({role:'system',content:note});
    }else if(opts._cwa&&!opts._toolMsgs){
      // 三之4：氣象署資料已注入——台灣天氣直接用；資料不足（台灣以外等）才呼叫 web_search
      const cwaNote='（提示：現在時間是 '+todayNote+'。上方已附中央氣象署（官方網址 www.cwa.gov.tw）的台灣天氣預報（今明 36 小時＋一週）。使用者問台灣天氣時，請直接依該資料回答並附上來源連結，日期與時段以資料中的 startTime 為準。若資料不足——例如使用者問的是台灣以外地區的天氣、需要特定鄉鎮的細節、即時觀測或過去天氣——再呼叫 web_search 工具補查；資料足夠時不要呼叫工具。沒有呼叫工具時切勿編造資料。）';
      if(sys)msgs[0].content+='\n'+cwaNote;
      else msgs.unshift({role:'system',content:cwaNote});
    }else if(opts._toolMsgs){
      // 工具呼叫續問輪次：明確告知模型剛收到的 tool 訊息就是「搜尋結果」，請直接根據它回答（不要當成對話歷史忽略）
      // 三之5：本輪「還有沒有工具」要分開講。過去不分情況一律寫「不要再輸出 tool_calls」，
      // 但續問輪其實還附著工具，模型想補查時被這句話卡死，就有可能把 tool_call 當純文字吐出來。
      const toolNote=useTools
        ?'（提示：現在時間是 '+todayNote+'。你剛剛呼叫了 web_search 工具，搜尋結果已透過 tool 訊息回傳給你（請直接讀取「role: tool」的訊息內容）。請優先根據結果回答。若結果明顯不足以回答使用者的問題——例如缺少他問的那一天或那個地區的資料，或工具訊息明確寫著「取得失敗，請再呼叫一次 web_search 重試」——你可以再呼叫一次 web_search 補查（換個更具體的查詢字串，例如補上縣市名）；資料已經夠用就不要重複搜尋。切勿在沒有呼叫工具的情況下編造即時資料。）'
        :'（提示：現在時間是 '+todayNote+'。你剛剛呼叫了 web_search 工具，搜尋結果已透過 tool 訊息回傳給你（請直接讀取「role: tool」的訊息內容）。請根據搜尋結果回答使用者的問題——即使問題涉及即時資訊（天氣、匯率、股價、新聞等）也沒問題，你已有資料。若結果不充分，就依現有資料與你的知識回答並說明限制；不要以為你「沒有即時資料」而回罐頭拒絕回答。注意：這一輪已達搜尋次數上限，沒有工具可用，絕對不要再輸出 tool_calls 或假造函式呼叫，一律只用純文字回覆。）';
      if(sys)msgs[0].content+='\n'+toolNote;
      else msgs.unshift({role:'system',content:toolNote});
    }
    // 工具呼叫輪次：附加 ephemeral 的 assistant tool_calls 與 tool 搜尋結果（不存進聊天歷史）
    if(opts._toolMsgs)msgs.push(...opts._toolMsgs);
    // C6：續寫模式——補一則不存進歷史的指示訊息
    if(opts.continueHint)msgs.push({role:'user',content:opts.continueHint});
    dbg('[Chat] 發送請求至:', getEndpoint()+'/chat/completions');
    dbg('[Chat] 模型:', getModel());

    abortCtrl=new AbortController();
    const sig=opts._sig||abortCtrl.signal;   // 工具呼叫多輪共用同一個中止信號：按「■ 停止」可中斷整條鏈
    const resp=await fetchWithRetry(`${getEndpoint()}/chat/completions`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
      body:JSON.stringify(Object.assign({
        model:getModel(),messages:msgs,stream:true,
        max_tokens:(opts.searchContext||opts._toolMsgs)?Math.max(getMaxTokens(),16384):getMaxTokens(),temperature:getTemperature()   // 含搜尋結果／網頁內容的請求：context 長且思考型模型的推理會吃 max_tokens，保底 16384 確保正文有輸出空間（避免「讀完網頁後回覆中斷」）
      },useTools?{tools:[WEB_SEARCH_TOOL]}:{},
        // 一之5：快速回覆 bias 只作用於一般回覆；含搜尋結果／網頁內容的請求不套用——
        // 這類請求本來就要產出完整長文，對 </think> 加偏權只會干擾輸出（且這類請求的推理更長）
        (getQuickReply()&&!opts.searchContext&&!opts._toolMsgs)?{logit_bias:{[QUICK_REPLY.token]:QUICK_REPLY.bias}}:{})),
      signal:sig
    },{
      timeoutMs:TIMEOUT.http,   // 只限「連線建立」（回應表頭前）；串流本身不限時
      maxAttempts:Math.max(4,keyPoolSize()*2+2),   // Key 池越大給越多嘗試空間（429/401/403 換 Key 重試也計入次數）
      getKey:()=>pickApiKey(),   // 多 Key 輪替：主 Key 限流／失效時自動換備用 Key
      onStatus:h=>{if(statusDiv.isConnected)statusDiv.innerHTML=h},
      onWait:()=>{if(statusDiv.isConnected)statusDiv.innerHTML='<span class="spinner"></span>回應中'},
      isAborted:()=>sig.aborted
    });

    dbg('[Chat] 回應狀態:', resp.status, resp.statusText);

    // 移除狀態提示，改用訊息氣泡
    // 工具呼叫續問輪次：沿用前輪傳來的 aiDiv（不重建），避免「第一輪氣泡被吃掉」的視覺中斷感
    if(!opts._aiDivEl){
      statusDiv.remove();
      aiDiv=document.createElement('div');
      aiDiv.className='msg assistant';
      container.appendChild(aiDiv);
      followIfStuck(); // statusDiv 移除後建立 aiDiv：僅在自動捲動開啟且貼底時跟上
    }else{
      // 續問輪次：沿用前輪的 aiDiv（規劃文字會被第二輪正文覆寫）
      aiDiv=opts._aiDivEl;
      if(statusDiv.isConnected)statusDiv.remove();
      followIfStuck();
    }

    // 以 requestAnimationFrame 節流重繪，避免每個片段都整段重建 HTML。
    // P4：原本是「每幀」對整段累積文字重跑 renderContent（marked＋DOMPurify）＋KaTeX，長回覆是 O(n²)，
    // 後半段會明顯掉幀。這裡再加兩道節流：
    //   STREAM_PAINT_MS → 畫面更新間隔（不到時間就排下一幀再試，不會把最後幾個字吃掉）
    //   STREAM_MATH_MS  → KaTeX 更貴，間隔再拉長（收尾時最終列會走完整渲染，不會留下未排版的 $..$）
    const STREAM_PAINT_MS=CONFIG.stream.paintMs;
    const STREAM_MATH_MS=CONFIG.stream.mathMs;
    let lastPaint=0,lastMath=0;
    const show=()=>{
      if(rafId)return;
      rafId=requestAnimationFrame(()=>{
        rafId=0;
        const now=Date.now();
        if(now-lastPaint<STREAM_PAINT_MS){show();return}   // 還沒到節流時間：下一幀再來
        lastPaint=now;
        // 二之1：fixStream 只修復新追加的片段，並以 alreadyFixed 讓 renderContent 不再重跑一次全文修復
        aiDiv.innerHTML=renderContent({content:clean(fixStream(full)),thinking:thinking||null,thinkingOpen:true},true);
        enhanceCodeBlocks(aiDiv);
        if(now-lastMath>=STREAM_MATH_MS){lastMath=now;renderMath(aiDiv)}
        if(shouldAutoScroll())scrollToBottom(false);   // 串流中：自動滾動開啟且使用者仍貼底時持續跟上（雙 RAF 避免圖片/數學尚未 layout 造成中間地帶）
      });
    };
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer=''; // SSE 行緩衝
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      // 逐行切割 SSE
      let nl;
      while((nl=buffer.indexOf('\n'))>=0){
        const line=buffer.slice(0,nl).trim();
        buffer=buffer.slice(nl+1);
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]'){sawDone=true;continue;}
        try{
          const j=JSON.parse(data);
          const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(delta.content)full+=delta.content;
          if(delta.reasoning_content)thinking+=delta.reasoning_content;
          if(delta.tool_calls){sawToolCalls=true;delta.tool_calls.forEach(tc=>{const i=tc.index||0;toolAcc[i]=toolAcc[i]||{id:'',name:'',args:''};if(tc.id)toolAcc[i].id=tc.id;if(tc.function){if(tc.function.name)toolAcc[i].name=tc.function.name;if(tc.function.arguments)toolAcc[i].args+=tc.function.arguments;}});}   // 累積 tool_calls 片段（tool calling 模式）
          if(j.choices&&j.choices[0]&&j.choices[0].finish_reason)finishReason=j.choices[0].finish_reason;
        }catch(e){/* 忽略無法解析的續傳片段 */}
      }
      show();
    }
    // 處理緩衝區殘留最後一行
    if(buffer.trim().startsWith('data:')){
      const data=buffer.trim().slice(5).trim();
      if(data!=='[DONE]'){
        try{
          const j=JSON.parse(data);
          const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(delta.content)full+=delta.content;
          if(delta.reasoning_content)thinking+=delta.reasoning_content;
          if(delta.tool_calls){sawToolCalls=true;delta.tool_calls.forEach(tc=>{const i=tc.index||0;toolAcc[i]=toolAcc[i]||{id:'',name:'',args:''};if(tc.id)toolAcc[i].id=tc.id;if(tc.function){if(tc.function.name)toolAcc[i].name=tc.function.name;if(tc.function.arguments)toolAcc[i].args+=tc.function.arguments;}});}
          if(j.choices&&j.choices[0]&&j.choices[0].finish_reason)finishReason=j.choices[0].finish_reason;
        }catch(e){}
      }
    }
    // 修復模型輸出中照抄 Jina 的壞連結格式（[文字]$網址$ → [文字](網址)、$網址$ → 網址）
    full=fixJinaLinks(full);
    // 串流提前中斷偵測：連線在正常結束前被切斷（沒有 finish_reason 也沒有 [DONE]）。
    // 讀網頁／搜尋後 context 很長，串流較容易被中間層切斷；過去會把半成品默默當完整回覆存檔
    // （看起來就是「回覆莫名中斷」）。現在標記 truncated 讓訊息下方出現「⤵️ 繼續生成」，完成時再跳出提示。
    // 一之3：只在「後端會送結束訊號」的前提下才判定中斷（後端從不送時自動停止判定，避免每則都誤標）
    noteStreamSignal(sawDone||!!finishReason);
    const streamDropped=!STREAM_DROP.disabled&&!sawDone&&!finishReason&&!!clean(full);
    if(streamDropped)dbg('[Chat] 偵測到串流提前中斷（無 finish_reason／[DONE]），已收長度=',full.length);
    // 進階 tool calling：模型要求搜尋 → 執行 Tavily+Jina，把結果以 tool 訊息帶回再續問（最多 WEB_SEARCH.toolMaxRounds 輪）
    const toolCallsReq=toolAcc.filter(Boolean);
    const searchCall=toolCallsReq.find(c=>c.name==='web_search');
    // 三之5：輪次上限。一般查詢維持 WEB_SEARCH.toolMaxRounds（Tavily 每次都扣額度）；
    // 本次請求若已命中過氣象署直查（免額度），續問輪多給一輪，讓模型能補查（例如一週預報沒拿到時）。
    const toolDepth=opts._toolDepth||0;
    const freeRound=(opts._cwaRounds||0)>0;   // 本次請求已用過氣象署直查＝免費來源
    const maxToolRounds=WEB_SEARCH.toolMaxRounds+(freeRound?1:0);
    // 一之2：與 useTools 的條件統一為「< toolMaxRounds」——原本 +1 讓搜尋次數比設定多一次（off-by-one）
    if(searchCall&&toolDepth<maxToolRounds){
      let q='';
      try{const a=JSON.parse(searchCall.args||'{}');q=String(a.query||a.q||'')}catch(e){}
      if(!q)q=String(searchCall.args||'').replace(/[{}\[\]"\\]/g,'').trim();   // 後端 args 非正規 JSON 時的保底
      // 一之1：參數殘缺／亂碼 → 不搜尋，直接略過工具輪（避免白扣額度）。
      // 後續若模型只輸出 tool_calls 沒輸出正文，會由空回應防護自動重試一次（該次不附工具，模型改以知識回答）。
      if(q&&!isSaneQuery(q)){
        dbg('[Chat] 工具呼叫查詢字串異常，略過搜尋:',String(q).slice(0,80));
        q='';
      }
      // 三之5：多出來的那一輪只放行「氣象署免費查詢」，避免模型拿加開的輪數去燒 Tavily 額度
      if(q&&toolDepth>=WEB_SEARCH.toolMaxRounds&&!(isWeatherQuery(q)||isQuakeQuery(q))){
        dbg('[Chat] 加開的續問輪僅開放免費來源（氣象署），略過付費搜尋:',String(q).slice(0,80));
        q='';
      }
      if(q){
        if(sig.aborted)throw Object.assign(new Error('aborted'),{name:'AbortError'});   // 停止鈕：中斷整條工具鏈
        dbg('[Chat] 工具呼叫 web_search:',q);
        const tStat=makeStatusEl('<span class="spinner"></span>🔍 正在搜尋網路');
        container.appendChild(tStat);
        followIfStuck();
        let toolResult='';
        let cwaHit=null;
        let cwaUsed=false;   // 三之5：本輪是否命中氣象署直查（免額度）→ 決定續問輪要不要保留工具
        // 三之4：最後一則使用者訊息——模型改寫的 query 偶爾漏掉縣市名，用原訊息補
        const lastUserMsg=(()=>{for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];if(m&&m.role==='user'&&typeof m.content==='string')return m.content}return ''})();
        try{
          // 三之4：天氣／地震查詢先走氣象署 OpenData（不扣 Tavily 額度）；查不到再走一般搜尋
          if(WEB_SEARCH.cwaKey)cwaHit=await tryCwaDirect(q,h=>{tStat.innerHTML=h},sig,lastUserMsg);
          if(cwaHit){
            toolResult=cwaHit.context;
            cwaUsed=true;
            setSearchSources(q,cwaHit.sources);   // 🔍 來源徽章顯示氣象署頁面
          }else{
            toolResult=await performSearch(q,h=>{tStat.innerHTML=h},sig);
          }
//          showToast('🔍 已搜尋：'+q,'success');
        }catch(e2){
          if(e2.name==='AbortError')throw e2;
          console.error('[Chat] 工具搜尋失敗:',e2);
          showToast('網路搜尋失敗（'+e2.message+'），改用模型知識回答','warn');
          toolResult='（搜尋失敗：'+e2.message+'。請依你自己的知識回答，並明確說明無法取得即時資料。）';
        }finally{
          if(tStat.isConnected)tStat.remove();
        }
        if(sig.aborted)throw Object.assign(new Error('aborted'),{name:'AbortError'});   // 停止鈕：搜尋完成後若已中止，不進入下一輪
        if(rafId){cancelAnimationFrame(rafId);rafId=0}
        // 跨輪思考加分隔：下一輪的推理會直接接在本輪思考後面，補一行標記避免內容黏在一起難以閱讀
        if(thinking&&thinking.length>(opts._prevThinking||'').length)thinking+='\n\n〔以下為依搜尋結果回答時的思考〕\n\n';
        // 不移除 aiDiv：把前輪的 DOM 元素透過 _aiDivEl 傳給下一輪，避免「第一輪氣泡被吃掉」的視覺中斷感
        const aiDivEl=aiDiv;   // 閉包抓住元素參考
        toolCallsReq.forEach((c,i)=>{if(!c.id)c.id='call_'+Date.now()+'_'+i;});   // 補齊 id 以符合 API 規範
        const toolMsgs=(opts._toolMsgs||[]).concat([
          {role:'assistant',content:clean(full)||null,tool_calls:toolCallsReq.map(c=>({id:c.id,type:'function',function:{name:c.name||'web_search',arguments:c.args||'{}'}}))},
          {role:'tool',tool_call_id:searchCall.id,content:toolResult}
        ]);
        toolCallsReq.forEach((c,i)=>{if(c!==searchCall)toolMsgs.push({role:'tool',tool_call_id:c.id,content:'（本次僅處理第一個搜尋，此呼叫略過。）'});});
        return await requestAI(Object.assign({},opts,{_toolMsgs:toolMsgs,_toolDepth:toolDepth+1,_cwaRounds:(cwaUsed||freeRound)?1:0,_searchQuery:q,_sig:sig,_aiDivEl:aiDivEl,_prevThinking:thinking||''}));   // await：外層 finally 等內層完成後才收尾；_searchQuery 供最終訊息標記；_sig 讓整條鏈共用中止信號；_aiDivEl 跨輪傳遞同一個氣泡 DOM；_prevThinking 跨輪保留思考過程；_cwaRounds 傳遞「已用過免費來源」供續問輪保留工具
      }
    }
    // 空回應防護：只有思考沒有正文時，先自動重試一次（模型誤輸出 tool_calls 的情況重試通常會正常），仍失敗才顯示提示
    if(!clean(full)){
      dbg('[Chat] 空回應：finish_reason=',finishReason,'tool_calls=',sawToolCalls,'thinking 長度=',thinking.length);
      if(sawToolCalls&&!opts._retryEmpty){
        dbg('[Chat] 模型誤輸出 tool_calls，自動重試一次');
        if(statusDiv.isConnected)statusDiv.remove();
        if(aiDiv)aiDiv.remove();
        return await requestAI(Object.assign({},opts,{_retryEmpty:true,_sig:sig,_prevThinking:thinking||''}));   // await：外層 finally 會等內層完成；_prevThinking 保留思考
      }
      if(sawToolCalls)full='（⚠️ 模型沒有輸出文字，而是嘗試呼叫它沒有的工具（重試仍失敗）。請按 ⋮ 重新生成再試一次。）';
      else if(finishReason==='length')full='（⚠️ 思考過程就佔滿了最大回覆長度，正文還沒開始就被截斷。請到 ⚙ 設定調高「最大回覆長度」，再按 ⋮ 重新生成。）';
      else if(streamDropped)full='（⚠️ 連線提前中斷，未收到任何內容。請按 ⋮ 重新生成再試一次。）';
      else full='（⚠️ 模型未回傳任何內容，請按 ⋮ 重新生成。）';
    }
    // 完成後以完整訊息列重建 DOM（含 ⋮ 選單），並尊重使用者的捲動位置
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    const finalMsg={role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now(),truncated:finishReason==='length'||streamDropped};   // C3：時間戳；C6：length 截斷標記；串流被提前切斷也視同截斷（出現「⤵️ 繼續生成」）
    if(opts._searchQuery){
      finalMsg.searchQuery=opts._searchQuery;   // 🔍 搜尋標記：記錄實際查詢字串（氣泡顯示徽章、重新生成時重用）
      const src=SEARCH_SOURCES.get(opts._searchQuery);   // 三之1：附上本次搜尋的來源清單（顯示於來源面板）
      if(src&&src.length)finalMsg.sources=src;
    }
    chat.messages.push(finalMsg);
    touchChat(chat);   // 新回應完成：更新最後活動時間
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    saveChatsDataNow();   // B2：串流結束立即寫入
    aiDiv.remove();
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加完成的訊息列，不重建（尊重使用者捲動位置）
    renderChatList();   // 依最後活動時間重新排序與分組（該對話移到頂端）
    if(chat.messages.length===2&&(chat.titleFromMsg||!chat.title||chat.title==='新對話'))autoTitle(chat);   // 標題自動生成：第一輪對話結束後（覆蓋暫用標題）
    // 三之5：串流提前中斷 → 自動續寫一次，避免使用者看到中斷的回覆無下文
    if(streamDropped){
      if(opts.continueHint){
        // 自動續寫本身又中斷：不再無限觸發，提示使用者手動按 ⤵️
        showToast('連線再次中斷，請手動按訊息下方的 ⤵️ 繼續生成','warn');
      }else{
        showToast('連線提前中斷，正在自動續寫一次…','warn');
        // 等本輪 finally 收尾（isStreaming 設回 false）後再發起續寫，避免並發請求
        setTimeout(()=>{ if(activeChatId===chat.id&&!isStreaming) requestAI({continueHint:'從上次中斷處繼續，直接接續輸出剩餘內容，不要重複已輸出的部分。'}); },500);
      }
    }
    if(getAutoScroll()){
      stickBottom=true;
      scrollToLatestStart(false,true);   // 自動滾動開啟：短回覆捲到底、長回覆停在最後一則開頭從頭讀（強制執行，stickBottom 剛設 true 不再被擋；雙 RAF 等 layout 避免「中間地帶」；之後圖片載入由 load 監聽跟上）
    }else{
      showToast('有新訊息','success');   // 自動滾動關閉：AI 回應完成時提醒，畫面一律不動
    }
    updateScrollBtn();
    dbg('[Chat] 完成，長度:', full.length);
  }catch(e){
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    // 後端不支援 tools（400/422 等）：關閉工具模式並原樣重試一次（之後整個工作階段不再附帶）
    if(useTools&&!opts._toolsRetry&&e.name!=='AbortError'&&isToolsUnsupportedError(e.message)){
      TOOL_STATE.unsupported=true;
      console.warn('[Chat] 後端不支援 tools，此工作階段改用無工具模式：',e.message);
      if(statusDiv.isConnected)statusDiv.remove();
      if(aiDiv)aiDiv.remove();
      return await requestAI(Object.assign({},opts,{_toolsRetry:true,_sig:sig,_prevThinking:thinking||''}));
    }
    if(e.name==='AbortError'){
      // 使用者主動停止：保留已產生的部分內容
      if(aiDiv)aiDiv.remove();
      if(statusDiv.isConnected)statusDiv.remove();
      if(clean(full)){
        chat.messages.push({role:'assistant',content:clean(full),thinking:thinking||null,createdAt:Date.now()});   // C3：時間戳
        touchChat(chat);
        saveChatsData(chats,chat.id);   // A1：只寫入這場對話
        saveChatsDataNow();   // B2：立即寫入
        appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加保留的部分回應，不重建
        renderChatList();
        if(shouldAutoScroll())scrollToBottom(false);   // 自動捲動開啟且使用者仍貼底才捲到底（使用者已往上捲就不拉回，只提示）
        showToast('已停止生成，已保留部分回應','warn');
      }else{
        showToast('已停止生成','warn');
      }
      return;
    }
    console.error('[Chat] 錯誤:', e);
    if(statusDiv.isConnected){
      statusDiv.innerHTML=`<span style="color:var(--accent)">✕ 錯誤：${escHtml(e.message)}</span>`;
      statusDiv.classList.remove('typing');
      setTimeout(()=>{if(statusDiv.isConnected)statusDiv.remove()},6000);
    }else{
      showToast('錯誤：'+e.message,'warn');
    }
    // B2：串流中若已有部分內容，先保留，並把錯誤原因**併進同一則**（訊息下方顯示紅字註記）。
    // 原本會再多 push 一則 [錯誤] 氣泡，畫面同時出現「半成品」與「錯誤」兩則，冗餘；
    // 合併後使用者一樣看得到「為什麼停下來」，只是不再多一則。（完全沒內容時仍維持單獨的 [錯誤] 氣泡）
    const partial=(aiDiv&&clean(full))?clean(full):'';
    if(aiDiv)aiDiv.remove();
    if(partial){
      chat.messages.push({role:'assistant',content:partial,thinking:thinking||null,createdAt:Date.now(),errorNote:'回應未完成：'+e.message});   // C3：時間戳
    }else{
      // 錯誤訊息標記為 error：會顯示，但不會送回 API 上下文
      chat.messages.push({role:'assistant',content:`[錯誤] ${e.message}`,error:true});
    }
    touchChat(chat);
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加新增的那一列，不重建（畫面不跑動）
    renderChatList();
  }finally{
    isStreaming=false;
    abortCtrl=null;
    updateSendButton();
    saveChatsDataNow();    // B2：串流結束沖掉待寫存的變更
    flushQueuedMessage();    // D8：送出排隊訊息
  }
}

// 標題自動生成：第一輪對話結束後，用小型（非串流）請求為「新對話」取標題
async function autoTitle(chat){
  const fu=chat.messages.find(m=>m.role==='user');
  // fallback：任何失敗（網路錯誤／非 200／空標題）都改用首則使用者訊息前 18 字，避免標題停留在暫用值
  const applyFallback=()=>{
    if(!chat.titleFromMsg)return;   // 使用者期間已手動改名：尊重，不覆蓋
    const t=(contentText(fu||{}).replace(/\s+/g,' ').trim().slice(0,18))||'新對話';
    chat.title=t;
    delete chat.titleFromMsg;   // 已生成正式標題，之後不再觸發
    saveChatsData(chats,chat.id);
    renderChatList();
    dbg('[Chat] 標題自動生成（fallback）:',t);
  };
  try{
    const fa=chat.messages.find(m=>m.role==='assistant'&&!m.error);
    if(!fu||!fa)return;
    const sys='你是對話標題產生器。根據對話開頭取一個 6～14 字的繁體中文（台灣用語）標題，概括對話主題。只輸出標題本身，不要引號、句號或任何其他文字。';
    const resp=await fetch(getEndpoint()+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+pickApiKey()},
      body:JSON.stringify({model:getModel(),stream:false,max_tokens:500,temperature:0.4,messages:[
        {role:'system',content:sys},
        {role:'user',content:'使用者: '+contentText(fu).slice(0,200)+'\nAI: '+contentText(fa).slice(0,200)}
      ]})
    });
    if(!resp.ok)return applyFallback();
    const j=await resp.json();
    let t=((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'')
      .replace(/<think>[\s\S]*?(<\/think>|$)/g,'')   // 思考型模型：濾掉思考段
      .split('\n').map(l=>l.trim()).filter(Boolean).pop()||'';
    t=t.replace(/^["「『\s]+|["」』\s.。]+$/g,'').slice(0,30);
    if(!t)return applyFallback();
    if(!chat.titleFromMsg)return;   // 使用者在生成期間已手動改名：尊重命名，不覆蓋
    chat.title=t;
    delete chat.titleFromMsg;   // 已生成正式標題，之後不再觸發
    saveChatsData(chats,chat.id);
    renderChatList();
    dbg('[Chat] 標題自動生成:',t);
  }catch(e){dbg('[Chat] 標題生成失敗，改用 fallback:',e);applyFallback();}
}

// 圖片模型請求（文生圖 / 圖生圖 / 多圖合成）
async function requestImage(opts){
  const chat=chats[activeChatId];
  if(!chat)return;
  const apiKey=getImageApiKey();   // Agnes 官方圖片模型：一律用預設 Agnes Key（不受使用者自訂 Key 影響）
  if(!apiKey){
    showToast('請先設定 API Key（在 ⚙ 設定 裡）','warn');
    openSettings();
    return;
  }
  isStreaming=true;
  updateSendButton();

  const container=messagesEl;
  const statusDiv=makeStatusEl('<span class="spinner"></span>🖼️ 正在生成圖片','statusMsg');
  container.appendChild(statusDiv);
  followIfStuck(); // 圖片請求 statusDiv 建立：僅在自動捲動開啟且貼底時跟上

  abortCtrl=new AbortController();
  const imgStart=performance.now();
  try{
    dbg('[Chat] 發送圖片請求至:', getImageEndpoint()+'/images/generations');
    dbg('[Chat] 圖片模型:', getImageModel());
    // 依官方文件：size 用檔位（2K）+ ratio（16:9）由後端解析；response_format 用 "url"
    // （官方範例用 url；曾嘗試 "b64_json" 會卡死 spinner 至 timeout，因此採 url 由前端下載）
    const body={model:getImageModel(),prompt:opts.prompt,size:getImageSize(),ratio:getImageRatio(),extra_body:{response_format:'url'}};
    if(opts.images&&opts.images.length){
      // 圖生圖：單張直接給 dataURL；多圖合成：給陣列
      body.extra_body.image=opts.images.length===1?opts.images[0]:opts.images;
    }
    dbg('[Chat] 圖片請求 body:', body);
    // 送出請求；與文字請求共用 fetchWithRetry：伺服器忙碌（503「queue is full」）或連線逾時時自動重試
    const resp=await fetchWithRetry(`${getImageEndpoint()}/images/generations`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal:abortCtrl.signal
    },{
      timeoutMs:TIMEOUT.image,   // 2K 圖片生成正常 30~90 秒；單次嘗試逾時 2 分鐘視為卡死
      maxAttempts:Math.max(5,keyPoolSize(getImageApiKey())*2+2),
      getKey:()=>pickApiKey(getImageApiKey()),   // 多 Key 輪替（圖片 Key 為主的池）
      onStatus:h=>{statusDiv.innerHTML=h},
      onWait:()=>{statusDiv.innerHTML='<span class="spinner"></span>🖼️ 正在生成圖片'},   // 重試間隔後立刻把狀態文字切回，避免「伺服器忙碌」殘留 30~90 秒
      statusPrefix:'🖼️ ',
      isAborted:()=>abortCtrl.signal.aborted
    });
    dbg('[Chat] 圖片回應狀態:', resp.status, resp.statusText, `(${Math.round(performance.now()-imgStart)}ms)`);
    statusDiv.innerHTML='<span class="spinner"></span>⬇️ 正在取得圖片';   // 重試成功後立刻切換狀態文字，避免「伺服器忙碌」殘留
    const j=await resp.json();
    dbg('[Chat] 圖片回應 body:', j);
    const item=(j.data&&j.data[0])||{};
    const b64=item.b64_json||'';
    const url=item.url||'';
    if(!b64&&!url)throw new Error('圖片模型未回傳圖片（請檢查 prompt 與 API 權限）');

    // 圖片存進 IndexedDB，歷史只留輕量 image_ref，不撐爆 localStorage
    const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    if(b64){
      // 優先使用 b64_json：伺服器直接給 base64，無 CORS 問題，且永久保存
      const dataUrl=b64.startsWith('data:')?b64:'data:image/png;base64,'+b64;
      await mediaPut(id,dataUrl);
    }else if(url.startsWith('data:')){
      await mediaPut(id,url);
    }else if(url){
      // Agnes 圖床（platform-outputs.agnes-ai.space）無 CORS header，瀏覽器 JS 無法直接讀取。
      // 透過直接抓取 / CORS 圖片代理把圖抓回來存進 IndexedDB：永久保存（URL 過期也不怕）且可直接下載。
      // 全部失敗才退回只存 URL 字串（顯示靠 <img src> 不受 CORS 影響）。
      const blob=await fetchRemoteImage(url,30000);
      if(blob){
        await mediaPut(id,blob);
        dbg('[Chat] 圖片已抓回存入 IndexedDB，大小:',blob.size);
      }else{
        dbg('[Chat] 圖片抓取失敗（含代理），僅保存 URL，該圖可能無法直接下載');
        await mediaPut(id,url,null,{urlOnly:true});   // A7：標記僅連結（無法下載／壓縮，Gallery 會顯示提示）
      }
    }
    statusDiv.remove();
    const prefix=opts.images&&opts.images.length?`已根據 ${opts.images.length} 張圖生成：`:'已生成圖片：';
    chat.messages.push({role:'assistant',content:[{type:'text',text:prefix+opts.prompt},{type:'image_ref',id,large:true}],createdAt:Date.now()});   // C3：時間戳
    touchChat(chat);
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    saveChatsDataNow();   // B2：立即寫入
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加生成的圖片訊息列，不重建（尊重使用者捲動位置）
    renderChatList();
    if(getAutoScroll()){
      stickBottom=true;
      scrollToBottom(false,true);   // 自動滾動開啟：捲到最新（強制執行，stickBottom 剛設 true 不再被擋；雙 RAF 等 layout；圖片載入後由 load 監聽跟上，避免「中間地帶」）
    }else{
      showToast('圖片已生成','success');   // 自動滾動關閉：圖片生成完成時提醒，畫面一律不動
    }
    updateScrollBtn();
    dbg('[Chat] 圖片完成，id:', id);
  }catch(e){
    if(e.name==='AbortError'){
      if(statusDiv.isConnected)statusDiv.remove();
      showToast('已停止生成圖片','warn');
      return;
    }
    console.error('[Chat] 圖片錯誤:', e);
    if(statusDiv.isConnected){
      statusDiv.innerHTML=`<span style="color:var(--accent)">✕ 錯誤：${escHtml(e.message)}</span>`;
      statusDiv.classList.remove('typing');
      setTimeout(()=>{if(statusDiv.isConnected)statusDiv.remove()},6000);
    }else{
      showToast('錯誤：'+e.message,'warn');
    }
    chat.messages.push({role:'assistant',content:`[錯誤] ${e.message}`,error:true});
    saveChatsData(chats,chat.id);   // A1：只寫入這場對話
    appendMessageRow(chat.messages[chat.messages.length-1]);   // 只附加錯誤訊息列，不重建
  }finally{
    isStreaming=false;
    abortCtrl=null;
    updateSendButton();
    saveChatsDataNow();   // B2：結束時沖掉待寫存的變更
    flushQueuedMessage();   // D8：送出排隊訊息
  }
}

// 送出 / 停止 / 語音三態切換（同一個槽位互斥顯示）
function updateSendButton(){
  const b=document.getElementById('btnSend');
  const m=document.getElementById('btnMic');
  if(isStreaming){
    if(b){
      b.textContent='■';b.classList.add('stop');
