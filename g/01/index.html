<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖模擬器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1410;--bg2:#2a2018;--bg3:#332820;--bg4:#1e1812;--bor:#5a4a3a;--tx:#e8dcc8;--tx2:#a89880;--tx3:#7a6a58;--ac:#c8a060;--acd:#8a7040}
body{font-family:"Noto Serif TC","Songti TC","MingLiU",serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
.ov{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center}
.ov.h{display:none}
.char-create-panel,.pnl{overflow-y:auto;padding:24px 32px}
.char-create-panel h2,.pnl h2{color:var(--ac);margin-bottom:8px;font-size:1.4rem;text-align:center;position:sticky;top:0;background:var(--bg2);padding-bottom:12px;z-index:1}
.pnl label{display:block;color:var(--tx2);font-size:.9rem}
.pnl input,.pnl select{width:100%;padding:6px 10px;background:var(--bg4);border:1px solid var(--bor);border-radius:4px;color:var(--tx);font-size:.7rem;margin-bottom:18px;font-family:inherit}
.pnl input:focus,.pnl select:focus{outline:none;border-color:var(--ac)}
.pnl select option{background:var(--bg2)}
.pnl .hint{font-size:.78rem;color:var(--tx3);margin-top:-12px;margin-bottom:18px}
.b{padding:10px 24px;border:1px solid var(--bor);border-radius:4px;cursor:pointer;font-family:inherit;font-size:.95rem;transition:background .2s}
.bp{background:var(--acd);color:var(--tx);border-color:var(--ac)}.bp:hover{background:var(--ac)}.bp:disabled{opacity:.5;cursor:not-allowed}
.bs{background:transparent;color:var(--tx2)}.bs:hover{color:var(--tx)}
.br{display:flex;gap:12px;justify-content:center;margin-top:8px}
#app{display:none;flex-direction:column;height:100vh}
#app.a{display:flex}
.hd{background:var(--bg2);border-bottom:1px solid var(--bor);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ht{color:var(--ac);font-size:1.1rem}.ha{display:flex;gap:8px}.ha .b{padding:6px 14px;font-size:.82rem}
.ca{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:85%;animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{align-self:flex-start}.msg.pl{align-self:flex-end}
.mb{padding:14px 18px;border-radius:8px;line-height:1.7;font-size:.95rem;white-space:pre-wrap;word-break:break-word}
.msg.ai .mb{background:var(--bg3);border:1px solid var(--bor);border-left:3px solid var(--ac)}
.msg.pl .mb{background:var(--acd);border:1px solid var(--ac)}
.mm{font-size:.72rem;color:var(--tx3);margin-top:4px;padding:0 4px}
.sb{background:var(--bg4);border:1px solid var(--bor);border-radius:4px;padding:8px 12px;margin:8px 0;font-size:.82rem;color:var(--tx2);line-height:1.6}
.sb span{color:var(--ac)}
.ia{background:var(--bg2);border-top:1px solid var(--bor);padding:14px 20px;flex-shrink:0;display:flex;gap:10px}
.ia textarea{flex:1;background:var(--bg4);border:1px solid var(--bor);border-radius:4px;color:var(--tx);font-family:inherit;font-size:.95rem;padding:10px 14px;resize:none;min-height:44px;max-height:120px}
.ia textarea:focus{outline:none;border-color:var(--ac)}
.ia .b{padding:10px 20px;flex-shrink:0}
.ld{display:inline-flex;gap:4px;padding:8px 0}
.ld span{width:6px;height:6px;background:var(--acd);border-radius:50%;animation:bnc 1.2s infinite}
.ld span:nth-child(2){animation-delay:.2s}.ld span:nth-child(3){animation-delay:.4s}
@keyframes bnc{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.ca::-webkit-scrollbar{width:6px}.ca::-webkit-scrollbar-track{background:transparent}.ca::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px}
@media(max-width:600px){.pnl{padding:20px}.msg{max-width:95%}.hd{padding:8px 12px}.ia{padding:10px 12px}}
</style>
</head>
<body>

<div id="settings-overlay" class="ov">
<div class="pnl">
<h2>&#9881;&#65039; 江湖設定</h2>
<label for="api-host">API 位址</label>
<input type="text" id="api-host" placeholder="https://apihub.agnes-ai.com/v1/chat/completions">
<p class="hint">LLM API 基礎位址（預設 Agnes AI）</p>
<label for="api-key">API Key</label>
<input type="text" id="api-key" placeholder="填入你的 API 金鑰">
<label for="model-name">模型名稱</label>
<input type="text" id="model-name" placeholder="agnes-2.0-flash">
<p class="hint">例如 agnes-2.0-flash、claude-sonnet-4</p>
<label for="md-base-url">MD 檔案基礎 URL</label>
<input type="text" id="md-base-url" placeholder="https://raw.githubusercontent.com/raingithu/ba24789rfhnuo4/main/g/01">
<p class="hint">GitHub raw URL，指向 files.json 和 .md 檔案所在的目錄</p>
<div class="br">
<button class="b bp" id="btn-load" onclick="doLoadFiles()">載入必要檔案</button>
</div>
<div id="file-status" style="margin-top:12px;font-size:.85rem;color:var(--tx3);text-align:center"></div>
</div>
</div>

<div id="loading-overlay" class="ov h">
<div class="pnl" style="text-align:center">
<div class="ld" style="justify-content:center"><span></span><span></span><span></span></div>
<p id="load-text" style="margin-top:16px;color:var(--tx2)">載入江湖檔案中…</p>
<p id="load-prog" style="margin-top:8px;color:var(--tx3);font-size:.85rem">0 / 0</p>
</div>
</div>

<div id="char-create-overlay" class="ov h">
<div class="pnl">
<h2>&#127807; 建立角色</h2>
<p style="color:var(--tx3);text-align:center;margin-bottom:24px;font-size:.9rem">踏入這片江湖之前，先讓世界認識你</p>
<label for="char-name">姓名</label>
<input type="text" id="char-name" placeholder="你的名字" maxlength="20">
<label for="char-age">年齡</label>
<input type="text" id="char-age" placeholder="你的年齡" maxlength="2">
<label for="char-gender">性別</label>
<select id="char-gender">
<option value="男">男</option>
<option value="女">女</option>
<option value="不詳">不詳</option>
</select>
<label for="char-background">出身背景</label>
<input type="text" id="char-background" placeholder="例如：初出茅廬少女、沒落千金、孤兒等">
<label for="char-faction">嚮往門派</label>
<select id="char-faction">
<option value="">尚未決定</option>
<option value="少林">少林</option>
<option value="武當">武當</option>
<option value="峨眉">峨眉</option>
<option value="崑崙">崑崙</option>
<option value="天山">天山</option>
<option value="華山">華山</option>
<option value="青城">青城</option>
<option value="崆峒">崆峒</option>
<option value="唐門">唐門</option>
<option value="丐幫">丐幫</option>
<option value="明教">明教</option>
<option value="合歡宗">合歡宗</option>
<option value="逍遙門">逍遙門</option>
<option value="其他">其他</option>
</select>
<label for="char-martial">鑽研方向</label>
<select id="char-martial">
<option value="">尚未決定</option>
<option value="劍法">劍法</option>
<option value="刀法">刀法</option>
<option value="拳掌">拳掌</option>
<option value="內功">內功</option>
<option value="輕功">輕功</option>
<option value="醫術">醫術</option>
<option value="毒術">毒術</option>
<option value="鍛造">鍛造</option>
<option value="經商">經商</option>
<option value="其他">其他</option>
</select>
<div class="br">
<button class="b bp" onclick="doCreateChar()">踏入江湖</button>
</div>
</div>
</div>

<div id="app">
<div class="hd">
<span class="ht" id="hdr-title">江湖模擬器</span>
<div class="ha">
<button class="b bs" onclick="doShowSettings()">&#9881;&#65039; 設定</button>
<button class="b bs" onclick="doReset()">&#128260; 新遊戲</button>
</div>
</div>
<div class="ca" id="chat-area"></div>
<div class="ia">
<textarea id="player-input" placeholder="輸入你的行動..." rows="1" onkeydown="onIK(event)"></textarea>
<button class="b bp" id="btn-send" onclick="doSend()">發送</button>
</div>
</div>

<script>
var S={url:'',key:'',model:'',mdUrl:'',sys:'',sid:'',name:'',hist:[],busy:false};

function saveSet(){
var urlVal=document.getElementById('api-host').value.trim();
var keyVal=document.getElementById('api-key').value.trim();
var modelVal=document.getElementById('model-name').value.trim();
var mdVal=document.getElementById('md-base-url').value.trim();
S.url=urlVal||'https://apihub.agnes-ai.com/v1/chat/completions';
S.key=keyVal||'';
S.model=modelVal||'agnes-2.0-flash';
S.mdUrl=mdVal||'https://raw.githubusercontent.com/raingithu/ba24789rfhnuo4/main/g/01';
try{localStorage.setItem('jh',JSON.stringify({url:S.url,key:S.key,model:S.model,mdUrl:S.mdUrl}))}catch(e){}
}
function loadSet(){try{var s=localStorage.getItem('jh');if(s){var d=JSON.parse(s);S.url=d.url||'';S.key=d.key||'';S.model=d.model||'';S.mdUrl=d.mdUrl||''}}catch(e){}}
function doShowSettings(){document.getElementById('settings-overlay').classList.remove('h');document.getElementById('api-host').value=S.url||'https://apihub.agnes-ai.com/v1/chat/completions';document.getElementById('api-key').value=S.key;document.getElementById('model-name').value=S.model||'agnes-2.0-flash';document.getElementById('md-base-url').value=S.mdUrl||'https://raw.githubusercontent.com/raingithu/ba24789rfhnuo4/main/g/01';}

function showLoad(v,t){document.getElementById('loading-overlay').classList.toggle('h',!v);if(t)document.getElementById('load-text').textContent=t;}
function updProg(d,t){document.getElementById('load-prog').textContent=d+' / '+t;}

async function doLoadFiles(){
saveSet();
if(!S.url){alert('請填寫 API 位址');return;}
if(!S.mdUrl){alert('請填寫 MD 檔案基礎 URL');return;}
var btn=document.getElementById('btn-load');btn.disabled=true;
showLoad(true,'載入檔案清單…');document.getElementById('file-status').textContent='';
try{
var fu=S.mdUrl.replace(/\/+$/,'')+'/files.json';
var fr=await fetch(fu);
if(!fr.ok)throw new Error('無法載入 files.json ('+fr.status+')');
var files=await fr.json();
showLoad(true,'載入 '+files.length+' 個檔案中…');
var tot=files.length,done=0,secs=[];
for(var i=0;i<files.length;i++){
var u=S.mdUrl.replace(/\/+$/,'')+'/'+files[i];
try{var r=await fetch(u);if(r.ok){var t=await r.text();secs.push('=== '+files[i]+' ===\n'+t)}}catch(e){}
done++;updProg(done,tot);
}
S.sys=secs.join('\n\n');
var kb=(S.sys.length/1024).toFixed(1);
document.getElementById('file-status').innerHTML='<span style="color:var(--ac)">&#10003;</span> 載入完成：'+done+' 個文件，'+kb+' KB';
setTimeout(function(){showLoad(false);document.getElementById('settings-overlay').classList.add('h');document.getElementById('char-create-overlay').classList.remove('h')},800);
}catch(e){document.getElementById('file-status').innerHTML='<span style="color:#a04040">&#10007;</span> 失敗：'+esc(e.message);showLoad(false);}
finally{btn.disabled=false;}
}

function doCreateChar(){
var n=document.getElementById('char-name').value.trim();
if(!n){alert('請輸入姓名');return;}
S.name=n;
var age=document.getElementById('char-age').value.trim();
var g=document.getElementById('char-gender').value;
var bg=document.getElementById('char-background').value.trim();
var f=document.getElementById('char-faction').value;
var m=document.getElementById('char-martial').value;
document.getElementById('char-create-overlay').classList.add('h');
document.getElementById('app').classList.add('a');
doStart(n,g,age,bg,f,m);
}

async function callLLM(msgs){
var r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key},body:JSON.stringify({model:S.model,messages:msgs,temperature:0.85,max_tokens:4096})});
if(!r.ok){var t=await r.text();throw new Error('API 錯誤 ('+r.status+'): '+t);}
var d=await r.json();
if(d.choices&&d.choices[0]&&d.choices[0].message)return d.choices[0].message.content;
throw new Error('LLM 回應格式異常');
}

async function doStart(name,gender,age,background,faction,martial){
setBusy(true);
try{
var intro='我準備好開始江湖之旅了。\n我的角色資料：\n- 姓名：'+name+'\n- 性別：'+gender;
if(age)intro+='\n- 年齡：'+age;
if(background)intro+='\n- 出身背景：'+background;
if(faction)intro+='\n- 嚮往門派：'+faction;
if(martial)intro+='\n- 鑽研方向：'+martial;
var msgs=[{role:'system',content:S.sys},{role:'user',content:intro}];
var resp=await callLLM(msgs);
msgs.push({role:'assistant',content:resp});
addAI(resp);
addSys(parseWS(resp));
S.hist=msgs;
document.getElementById('hdr-title').textContent='\u6c5f\u6e56 \u2014\u2014 '+name;
}catch(e){addSys('\u26a0\ufe0f 啟動失敗：'+e.message);console.error(e);}
finally{setBusy(false);}
}

async function doSend(){
var inp=document.getElementById('player-input');
var txt=inp.value.trim();
if(!txt||S.busy)return;
inp.value='';inp.style.height='auto';
addPl(txt);
S.hist.push({role:'user',content:txt});
setBusy(true);
try{
var resp=await callLLM(S.hist);
S.hist.push({role:'assistant',content:resp});
addAI(resp);
addSys(parseWS(resp));
}catch(e){addSys('\u26a0\ufe0f 回應失敗：'+e.message);console.error(e);}
finally{setBusy(false);}
}

function addPl(t){var c=document.getElementById('chat-area');var d=document.createElement('div');d.className='message pl';d.innerHTML='<div class="mb">'+esc(t)+'</div><div class="mm">'+tm()+' \u2022 '+S.name+'</div>';c.appendChild(d);sb();}
function addAI(t){var c=document.getElementById('chat-area');var d=document.createElement('div');d.className='message ai';d.innerHTML='<div class="mb">'+fmt(t)+'</div><div class="mm">'+tm()+' \u2022 \u6c5f\u6e56</div>';c.appendChild(d);sb();}
function addSys(t){if(!t)return;var c=document.getElementById('chat-area');var d=document.createElement('div');d.className='message ai';d.innerHTML='<div class="mb"><div class="sb">'+esc(t)+'</div></div><div class="mm">'+tm()+'</div>';c.appendChild(d);sb();}
function showLD(){var c=document.getElementById('chat-area');var d=document.createElement('div');d.className='message ai';d.id='ld-msg';d.innerHTML='<div class="mb"><div class="ld"><span></span><span></span><span></span></div></div>';c.appendChild(d);sb();}
function hidLD(){var e=document.getElementById('ld-msg');if(e)e.remove();}
function setBusy(v){S.busy=v;document.getElementById('btn-send').disabled=v;if(v)showLD();else hidLD();}
function sb(){var c=document.getElementById('chat-area');requestAnimationFrame(function(){c.scrollTop=c.scrollHeight;});}
function tm(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function fmt(t){return esc(t).replace(/\n/g,'<br>');}
function parseWS(t){if(!t)return'';var l=[];var m;t=/所在地[：:]\s*(.+)/.exec(t);if(t)l.push('\ud83d\udccd <span>'+esc(t[1].trim())+'</span>');t=/時間[：:]\s*(.+)/.exec(t);if(t)l.push('\ud83d\udcc5 <span>'+esc(t[1].trim())+'</span>');t=/天氣[：:]\s*(.+)/.exec(t);if(t)l.push('\u26c5 <span>'+esc(t[1].trim())+'</span>');t=/生命[：:]\s*(.+)/.exec(t);if(t)l.push('\u2764\ufe0f <span>'+esc(t[1].trim())+'</span>');t=/內力[：:]\s*(.+)/.exec(t);if(t)l.push('\u2728 <span>'+esc(t[1].trim())+'</span>');t=/體力[：:]\s*(.+)/.exec(t);if(t)l.push('\u26a1 <span>'+esc(t[1].trim())+'</span>');t=/銀兩[：:]\s*(.+)/.exec(t);if(t)l.push('\ud83d\udcb0 <span>'+esc(t[1].trim())+'</span>');return l.join('<br>');}
function onIK(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}}
function doReset(){if(!confirm('\u78ba\u5b9a\u8981\u958b\u59cb\u65b0\u904a\u6232\u55ce\uff1f'))return;S.hist=[];document.getElementById('chat-area').innerHTML='';document.getElementById('char-create-overlay').classList.remove('h');document.getElementById('app').classList.remove('a');}

loadSet();
</script>
</body>
</html>
